光暗，\n景物凄清冷看台。\n原本借机耍花样，\n新冠无奈只悲哀。 ​​​", "date": "2021.07.25", "themes": ["家国情怀与时代歌咏", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4662766387073094 - 七律    东京奥运/01.jpg"]}, {"id": "4663127390031048", "title": "七律·赠神州健儿", "genre": "七律", "body": "首金射落气冲霄，\n惊艳东瀛华夏骄。\n学子谦谦盈笑靥，\n国人奋奋热情高。\n歌声飞荡银空震，\n旗帜飘扬卷赤涛。\n险恶风云浑不惧，\n神州威武看今朝。 ​​​", "date": "2021.07.26", "themes": ["家国情怀与时代歌咏", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4663127390031048 - 七律 赠神州健儿/01.jpg", "冰雪诗词_全部图片/4663127390031048 - 七律 赠神州健儿/02.jpg"]}, {"id": "4663490722136746", "title": "菩萨蛮·曲终峰现", "genre": "菩萨蛮", "body": "世间一曲天津散，\n谢锋强硬刚舒曼。\n心意不真诚，\n只和虚此行。\n不知当有愧，\n别却多回味。\n宇宙九重天，\n鲲鹏任翥旋。 ​​​", "date": "2021.07.27", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4663490722136746 - 菩萨蛮 曲终峰现/01.jpg"]}, {"id": "4663853068059617", "title": "一剪梅·夏日暮歌", "genre": "一剪梅", "body": "童稚黄昏聚院庭，\n各色儿车，\n老少同行。\n滑梯上下态憨萌，\n踏板穿梭，\n彩泡飞萦。\n倦鸟闻观亦动情，\n抖翅高翔，\n盘绕争鸣。\n斜晖暮色乐融融，\n纸扇风凉，\n阵阵欢声。 ​​​", "date": "2021.07.28", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4663853068059617 - 一剪梅 夏日暮歌/01.jpg"]}, {"id": "4664212426589948", "title": "朝中措·看西方", "genre": "朝中措", "body": "无聊政客是非多，\n梦里也胡说。\n埋怨天公下雨，\n指摘春水秋波。\n一身狗屎，\n惯闻其味，\n到处撒泼。\n妻妾家中肚胀，\n赖人替己背锅。 ​​​", "date": "2021.07.29", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4664212426589948 - 朝中措    看西方/01.jpg"]}, {"id": "4664575431284220", "title": "山花子·离京寄怀", "genre": "山花子", "body": "别却娇娃忍泪行，\n廉州二老亦牵情。\n此去家山消父病，\n盼安平。\n来往城乡愁聚散，\n怀思老少绪疏盈。\n恨是两全无好策，\n梦难宁。 ​​​", "date": "2021.07.30", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4664575431284220 - 山花子 离京寄怀/01.jpg"]}, {"id": "4664945448324640", "title": "蝶恋花·夏日闲吟", "genre": "蝶恋花", "body": "旧友新朋前夜聚，\n畅诉心言，\n把酒千欢绪。\n且看白啤浑不拒，\n红虾紫蟹无人举。\n两盏三杯难尽趣，\n昂首扬眉，\n一口吹瓶去。\n醉望天河星共语，\n宵深人静寻诗句。 ​​​", "date": "2021.07.31", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4664945448324640 - 蝶恋花 夏日闲吟/01.jpg"]}, {"id": "4665300333889399", "title": "破阵子·八一寄怀", "genre": "破阵子", "body": "凭仗三军固本，\n频添剑盾提神。\n将士赤心明壮志，\n瀚海长空日夜巡。\n川原疆界亲。\n天际风烟动荡，\n地阶贼寇纷纭。\n西北东南闻鬼闹，\n且看钟馗锁魅魂。\n神州春复春。 ​​​", "date": "2021.08.01", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4665300333889399 - 破阵子 八一寄怀/01.jpg", "冰雪诗词_全部图片/4665300333889399 - 破阵子 八一寄怀/02.jpg", "冰雪诗词_全部图片/4665300333889399 - 破阵子 八一寄怀/03.jpg"]}, {"id": "4665662326181068", "title": "七绝·赞巩立姣", "genre": "七绝", "body": "震天怒吼转乾坤，\n惊落铅球第一金。\n廿载未移娇女志，\n争光华夏有恒心。 ​​​", "date": "2021.08.02", "themes": ["咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4665662326181068 - 七绝    赞巩立姣/01.jpg", "冰雪诗词_全部图片/4665662326181068 - 七绝    赞巩立姣/02.jpg"]}, {"id": "4666027100605204", "title": "烛影摇红·赞举重健儿", "genre": "烛影摇红", "body": "举铁抓金，\n气冲霄汉频称冠。\n更红旗漫卷飞扬，\n内外皆惊叹。\n平日俯身流汗，\n换今朝、亿人慨赞。\n骄容可爱，赤子红心，\n如珠璀璨。\n举重队获七金一银 ​​​", "date": "2021.08.03", "themes": ["感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4666027100605204 - 烛影摇红 赞举重健儿/01.jpg"]}, {"id": "4666394123701886", "title": "行香子·中伏午吟", "genre": "行香子", "body": "噪起蝉蛩，光炙梧桐。\n恰云天闷热潮浓。\n无风叶静，雾气濛濛。\n看车儿停，鸟儿卧，树儿弓。\n午休难睡，浑身汗浸。\n似这般人在蒸笼。\n躺平难奈，坐立难从。\n盼阵儿雷，阵儿雨，阵儿风。 ​​​", "date": "2021.08.04", "themes": ["羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4666394123701886 - 行香子  中伏午吟/01.jpg"]}, {"id": "4666751466603603", "title": "踏莎行·见闻有思", "genre": "踏莎行", "body": "所谓明星，\n堪称恶棍。\n光鲜龌龊阴阳混。\n贪金好色醉青烟，\n沾花惹草招人恨。\n官府擒凶，\n民间泄愤。\n道长揭短随公论。\n掀开黑伞莫稀松，\n扭风正气人心顺。 ​​​", "date": "2021.08.05", "themes": ["羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4666751466603603 - 踏莎行 见闻有思/01.jpg"]}, {"id": "4667115452503086", "title": "眼儿媚·少女非凡", "genre": "眼儿媚", "body": "平台起跳众人惊，\n一跃水花轻。\n胜情锁定，眼神飞彩，\n稚态呆萌。\n少年坚毅心怀梦，\n嫩脸踏征程。\n东京奥运，非凡佳绩，\n举世闻名。\n注：中国代表队最小\n的运动员，十四岁全\n红婵10米跳水，数次\n满分，一骑绝尘，轻\n松夺冠。 ​​​", "date": "2021.08.06", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4667115452503086 - 眼儿媚         少女非凡/01.jpg", "冰雪诗词_全部图片/4667115452503086 - 眼儿媚         少女非凡/02.jpg", "冰雪诗词_全部图片/4667115452503086 - 眼儿媚         少女非凡/03.jpg"]}, {"id": "4667474791109213", "title": "七绝·立秋吟", "genre": "七绝", "body": "心期天际起清风，\n溽暑行消暮色明。\n飒爽银空星闪烁，\n梧桐叶上泛秋声。 ​​​", "date": "2021.08.07", "themes": ["四时风光与节气流转", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4667474791109213 - 七绝        立秋吟/01.jpg"]}, {"id": "4667838734537755", "title": "满江红·赠华夏奥运健儿", "genre": "满江红", "body": "鏖战东京，风头盛，举枪金落。\n喜新人，锦华正茂，搏身求索。\n奥运争光心底快，\n家乡父老同天乐。\n赞老将，矍铄屡传奇，惊魂魄。\n凭实力，频收获。神州势，今非昨。\n似钢铁军团，虎奔龙跃。\n拔寨攻城长志气，曾经弱项添花萼。\n占鳌头，赤子映红旗，星光烁。", "date": "2021.08.08", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4667838734537755 - 满江红    赠华夏奥运健儿/01.jpg", "冰雪诗词_全部图片/4667838734537755 - 满江红    赠华夏奥运健儿/02.jpg", "冰雪诗词_全部图片/4667838734537755 - 满江红    赠华夏奥运健儿/03.jpg", "冰雪诗词_全部图片/4667838734537755 - 满江红    赠华夏奥运健儿/04.jpg", "冰雪诗词_全部图片/4667838734537755 - 满江红    赠华夏奥运健儿/05.jpg", "冰雪诗词_全部图片/4667838734537755 - 满江红    赠华夏奥运健儿/06.jpg", "冰雪诗词_全部图片/4667838734537755 - 满江红    赠华夏奥运健儿/07.jpg", "冰雪诗词_全部图片/4667838734537755 - 满江红    赠华夏奥运健儿/08.jpg", "冰雪诗词_全部图片/4667838734537755 - 满江红    赠华夏奥运健儿/09.jpg"]}, {"id": "4668201429107660", "title": "七绝·初秋闲吟", "genre": "七绝", "body": "西风携雨过南楼，\n带走伏天潮闷愁。\n枝上蝉蛩欢咏唱，\n门前流水自无忧。 ​​​", "date": "2021.08.09", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4668201429107660 - 七绝    初秋闲吟/01.jpg"]}, {"id": "4668563015074756", "title": "烛影摇红·美轮美奂", "genre": "烛影摇红", "body": "落日余晖，\n晚霞飞度彤如画。\n伫阶遥望满怀情，\n回味消长夏。\n奥运东京酷耍，\n众健儿，金银各挂。\n女童添乐，\n学子称奇，\n传为佳话。 ​​​", "date": "2021.08.10", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4668563015074756 - 烛影摇红 美轮美奂/01.jpg"]}, {"id": "4668924174274055", "title": "蝶恋花·爷孙连线", "genre": "蝶恋花", "body": "数日别离屏上见，\n小眼迷茫，\n稚脸神情乱。\n似是而非苍老面，\n怎能把我娇名唤。\n七月乖娃添判断，\n最喜爬行，\n期待加餐饭。\n庭院花香心里愿，\n童车一坐听尊便。 ​​​", "date": "2021.08.11", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4668924174274055 - 蝶恋花 爷孙连线/01.jpg", "冰雪诗词_全部图片/4668924174274055 - 蝶恋花 爷孙连线/02.jpg", "冰雪诗词_全部图片/4668924174274055 - 蝶恋花 爷孙连线/03.jpg"]}, {"id": "4669287601538272", "title": "七绝·闲思", "genre": "七绝", "body": "酸言醋语暗伤人，\n阵阵阴风似鬼魂。\n亦若乌云图蔽日，\n奈何光烈碎其身。 ​​​", "date": "2021.08.12", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4669287601538272 - 七绝           闲思/01.jpg"]}, {"id": "4669648610525792", "title": "卜算子·黄昏吟", "genre": "卜算子", "body": "冠疫乱呈威，\n故友难相聚。\n暮色匆匆独自行，\n迎著秋风去。\n暑气渐消沉，\n一路残蝉语。\n凄切声声总不停，\n招惹愁思绪。 ​​​", "date": "2021.08.13", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4669648610525792 - 卜算子    黄昏吟/01.jpg"]}, {"id": "4670014046864419", "title": "鹊桥仙·七夕怨", "genre": "鹊桥仙", "body": "牛郎织女，鹊桥相会。\n怎抵人间尘世。\n云空连线霎时通，\n千万里、犹如临莅。\n若非王母，无情拆散。\n秋月春花惬意。\n青山绿水恁风流，\n天伦乐、温馨萦地。 ​​​", "date": "2021.08.14", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4670014046864419 - 鹊桥仙           七夕怨/01.jpg"]}, {"id": "4670374970659990", "title": "忆秦娥·七夕恨", "genre": "忆秦娥", "body": "逢乞巧，\n牛郎织女难欢笑。\n难欢笑。\n桥头刚见，\n星空将晓。\n纤云情鹊纷飞了，\n天河又现凄凉貌。\n凄凉貌。\n依依不舍，\n恨离催老。 ​​​", "date": "2021.08.15", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4670374970659990 - 忆秦娥    七夕恨/01.jpg"]}, {"id": "4670739888998255", "title": "满江红·闻事寄怀", "genre": "满江红", "body": "倭寇曾降，今又闹，贼心不死。\n眄神州，无端招惹，言污行耻。\n孤岛窝居肝胆胀，\n心胸狭隘窝斜气。\n似小丑，尽舞爪欺人、蒙尘世。\n钓鱼岛，谣称己。窥台海，频生事。\n想印太结盟，招人非议。\n昔日恶行无悔过，今朝丑事谁堪比。\n再放肆，惟马踏刀飞、弹丸地。", "date": "2021.08.16", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4670739888998255 - 满江红          闻事寄怀/01.jpg"]}, {"id": "4671098741065500", "title": "忆秦娥·梦碎", "genre": "忆秦娥", "body": "……喀布尔之夏\n机声咽，\n人潮骚动情悲切，\n情悲切。\n争相夺路，\n景光凄烈。\n自由米帝心如铁，\n而今头破浑身血，\n浑身血。\n曾经许诺，\n灰飞烟灭。 ​​​", "date": "2021.08.17", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4671098741065500 - 忆秦娥        梦碎/01.jpg", "冰雪诗词_全部图片/4671098741065500 - 忆秦娥        梦碎/02.jpg", "冰雪诗词_全部图片/4671098741065500 - 忆秦娥        梦碎/03.jpg"]}, {"id": "4671461392387707", "title": "踏莎行·见闻抒怀", "genre": "踏莎行", "body": "一脉相承，\n两张图片。\n这般风景人惊颤。\n可怜走狗苦哀求，\n多情终了难随愿。\n廿载攻心，\n一朝现眼。\n自由米帝辉光散。\n人权不过口中词，\n周边无利神思远。 ​​​", "date": "2021.08.18", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4671461392387707 - 踏莎行 见闻抒怀/01.jpg"]}, {"id": "4671823298694438", "title": "十六字令·三首", "genre": "十六字令", "body": "一.\n秋，\n晓色霞光碧水流。\n云空丽，\n莺鹊啭无忧。\n二.\n秋，\n紫绿橙红果渐收。\n香风漫，\n喜气绕枝头。\n三.\n秋，\n袅袅清风夜色幽。\n蟾光淡，\n桐叶映西楼。 ​​​", "date": "2021.08.19", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4671823298694438 - 十六字令    三首/01.jpg"]}, {"id": "4672190735452980", "title": "渔家傲·日暮闲吟", "genre": "渔家傲", "body": "碌碌人生行已半，\n凭栏回首风云卷。\n眺望远方霞色漫，\n桥路转，\n长河自有高山伴。\n日月浮沉星火灿，\n寒冬过后春风暖。\n花落花开青帝管，\n凝神看，\n风光无意争长短。 ​​​", "date": "2021.08.20", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4672190735452980 - 渔家傲 日暮闲吟/01.jpg"]}, {"id": "4672555242489430", "title": "太常引·初秋暮吟", "genre": "太常引", "body": "斜风细雨舞清秋，\n爽意染心头。\n黄叶水中流。\n暮空霁，\n凭栏自悠。\n霞光远照，\n飞云漫卷。\n鸦鹊啭无休。\n把酒更何求？\n向梦里，\n山川畅游。 ​​​", "date": "2021.08.21", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4672555242489430 - 太常引 初秋暮吟/01.jpg"]}, {"id": "4672916572867085", "title": "朝中措·中元感怀", "genre": "朝中措", "body": "今朝祭祖古来同，\n香火漫长空。\n虽是阴阳两界，\n凭风遥寄深情。\n时光流转，\n循环往复。\n日夜周行。\n便是人间别却，\n黄泉终会相逢。 ​​​", "date": "2021.08.22", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4672916572867085 - 朝中措 中元感怀/01.jpg"]}, {"id": "4673279102815136", "title": "山花子·处暑吟", "genre": "山花子", "body": "日暮风柔岸柳垂，\n清波碧水映斜晖。\n桐叶趋黄将欲落，\n雁高飞。\n暑去秋来云淡淡，\n昼晴夜爽露微微。\n故里神思情渐盛，\n客心归。 ​​​", "date": "2021.08.23", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4673279102815136 - 山花子    处暑吟/01.jpg"]}, {"id": "4673636834739836", "title": "太常引·赠诗弟", "genre": "太常引", "body": "菇娘果粒溢清香，\n千里自龙江，\n兄弟意情长。\n味鲜嫩，\n芳馨满堂。\n未曾谋面，\n心连诗韵。\n如此热衷肠，\n东北好儿郎。\n感君意，\n频交梦乡。 ​​​", "date": "2021.08.24", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4673636834739836 - 太常引    赠诗弟/01.jpg"]}, {"id": "4673997515784988", "title": "朝中措·卖房有感", "genre": "朝中措", "body": "为儿筹备一新房，\n静卧二环旁。\n岂料京城落户，\n春秋几度彷徨。\n今朝转手，\n倚栏难舍，\n暗自心伤。\n期许儿孙快乐，\n老来亦或沾光。 ​​​", "date": "2021.08.25", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4673997515784988 - 朝中措 卖房有感/01.jpg"]}, {"id": "4674362273173529", "title": "踏莎行·梅韵飞香", "genre": "踏莎行", "body": "……贺早梅香诗刊百期\n雪藻兰襟，\n唐风宋雨。\n早梅香韵屏中聚。\n山川江海丽霞飞，\n星光云色添情趣。\n百卷华章，\n万家心绪。\n裁成长短人生句。\n一枝一叶总关情，\n随风吹遍尘寰去。 ​​​", "date": "2021.08.26", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4674362273173529 - 踏莎行         梅韵飞香/01.jpg"]}, {"id": "4674719633378791", "title": "踏莎行·京秋暮色", "genre": "踏莎行", "body": "雨过京华，\n虹飞帝里。\n初秋暮色云空丽。\n天光楼影水悠悠，\n尘间一派祥和气。\n世道安平，\n黎民欢喜。\n古今华夏翻天地。\n莺歌燕舞啭清音，\n神龙玉凤乘风起。 ​​​", "date": "2021.08.27", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4674719633378791 - 踏莎行 京秋暮色/01.jpg", "冰雪诗词_全部图片/4674719633378791 - 踏莎行 京秋暮色/02.jpg"]}, {"id": "4675087112865634", "title": "蝶恋花·闻事有感", "genre": "蝶恋花", "body": "善恶尘间终有报，\n无论何人，\n早晚能收到。\n侥幸一时休自耀，\n周身检点方为好。\n日夜轮回天地道，\n月有阴晴，\n人有悲和笑。\n得意忘形心易傲，\n秋风落叶凭空啸。 ​​​", "date": "2021.08.28", "themes": ["感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4675087112865634 - 蝶恋花 闻事有感/01.jpg"]}, {"id": "4675447395452465", "title": "踏莎行·谁之过", "genre": "踏莎行", "body": "无奈离开，\n又遭伤死。\n多年反恐何如此。\n一心称霸妄言行，\n寰球招惹千般事。\n己处优先，\n人家垫底。\n鬼神不敢行斯理。\n众生苍海命相当，\n应同凉热于天地。 ​​​", "date": "2021.08.29", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4675447395452465 - 踏莎行     谁之过/01.jpg"]}, {"id": "4675809451181409", "title": "七绝·一骑绝尘", "genre": "七绝", "body": "红旗三面耀星空，\n勇冠东京华夏情。\n不畏身残心志远，\n今秋奥战起雄风。 ​​​", "date": "2021.08.30", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4675809451181409 - 七绝    一骑绝尘/01.jpg", "冰雪诗词_全部图片/4675809451181409 - 七绝    一骑绝尘/02.jpg"]}, {"id": "4676177929702850", "title": "菩萨蛮·相逢有寄", "genre": "菩萨蛮", "body": "月余未见娇孙女，\n相逢生怯无言语。\n两眼紧盯瞧，\n凝神苍鬓毛。\n欢情飞稚脸，\n笑舞身忙乱。\n毕竟血相连，\n转晴一瞬间。 ​​​", "date": "2021.08.31", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4676177929702850 - 菩萨蛮 相逢有寄/01.jpg", "冰雪诗词_全部图片/4676177929702850 - 菩萨蛮 相逢有寄/02.jpg"]}, {"id": "4676536421319368", "title": "七绝·渔家乐", "genre": "七绝", "body": "清波荡漾泛金晖，\n秋水潺潺客晚归。\n日暮蝉蛩声切切，\n小舟仓满蟹鱼肥。 ​​​", "date": "2021.09.01", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4676536421319368 - 七绝       渔家乐/01.jpg"]}, {"id": "4676898062337207", "title": "少年游·秋日晓吟", "genre": "少年游", "body": "深宵枕簟感清凉，\n落叶打西窗。\n雨促秋声，冷蟾斜下，\n惊梦绕回肠。\n晓来旭日霞晖满，\n晨练好风光。\n曲调歌音，贯拳飞腿，\n舞剑弄刀枪。 ​​​", "date": "2021.09.02", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4676898062337207 - 少年游        秋日晓吟/01.jpg"]}, {"id": "4677259119561243", "title": "清平乐·英烈安息", "genre": "清平乐", "body": "魂归故里，\n且把英雄记。\n凭仗当年豪迈气，\n才有今朝盛世。\n和平尊尚三军，\n战时勇猛绝伦。\n将士守疆固土，\n黎民昼夜安神。 ​​​", "date": "2021.09.03", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4677259119561243 - 清平乐 英烈安息/01.jpg", "冰雪诗词_全部图片/4677259119561243 - 清平乐 英烈安息/02.jpg", "冰雪诗词_全部图片/4677259119561243 - 清平乐 英烈安息/03.jpg"]}, {"id": "4677627312869322", "title": "眼儿媚·来者不善", "genre": "眼儿媚", "body": "梅开二度落天津，\n克里为何因？\n巧言气候，\n百般刁难，\n地暗天昏。\n巨龙腾起西方怵，\n恶意舞烟尘。\n三番五次，\n神情颠倒，\n祸乱纷纷。 ​​​", "date": "2021.09.04", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4677627312869322 - 眼儿媚 来者不善/01.jpg"]}, {"id": "4677985289112987", "title": "五律·秋之韵", "genre": "五律", "body": "秋日恁多情，\n飞云伴雁行。\n双眸盈晕色，\n两耳尽蝉声。\n碧水翻波浪，\n青山木叶横。\n凭高风气爽，\n远眺景光明。 ​​​", "date": "2021.09.05", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4677985289112987 - 五律 秋之韵/01.jpg"]}, {"id": "4678345516648954", "title": "点绛唇·秋日寄怀", "genre": "点绛唇", "body": "何必悲秋，\n雁飞云卷长空丽。\n水清波细，\n五彩斑斓地。\n鹤引诗情，\n把酒凭风寄。\n蟾宫里，\n桂香迢递，\n直漫人间世。 ​​​", "date": "2021.09.06", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4678345516648954 - 点绛唇 秋日寄怀/01.jpg"]}, {"id": "4678708390004924", "title": "眼儿媚·娇儿乐", "genre": "眼儿媚", "body": "孙女逢秋更销魂，\n满地落香痕。\n床头伫立，\n几边弄笑，\n恁是天真。\n清风送爽安眠睡，\n半宿未翻身。\n醒来眸亮，\n红腮粉靥，\n分外招人。 ​​​", "date": "2021.09.07", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4678708390004924 - 眼儿媚    娇儿乐/01.jpg", "冰雪诗词_全部图片/4678708390004924 - 眼儿媚    娇儿乐/02.jpg", "冰雪诗词_全部图片/4678708390004924 - 眼儿媚    娇儿乐/03.jpg"]}, {"id": "4679070140597124", "title": "踏莎行·秋日闲吟", "genre": "踏莎行", "body": "缓度流年，\n闲思岁月。\n一篇一幕从头越。\n曾经多少事追心，\n而今心底无疆界。\n浊酒一杯，\n新词两阙。\n庭花遥对清蟾夜。\n浮生已半鬓飞丝，\n开怀栏角闻莺雀。 ​​​", "date": "2021.09.08", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4679070140597124 - 踏莎行 秋日闲吟/01.jpg"]}, {"id": "4679430944066012", "title": "满江红·缅怀主席", "genre": "满江红", "body": "今日寰球，如君料，狼心米帝。\n屠刀举，横行四海，妄称仁义。\n陷害栽赃无底线，\n热心搅乱人家事。\n似西风，漫卷起尘烟，污盈地。\n华夏幸，腾朝气。\n新丝路，神龙起。\n仗高天北斗，俯仰千里。\n广袤川原山水秀，\n无垠江海风光丽。\n百姓安，更忆伟人明，情无比。", "date": "2021.09.09", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4679430944066012 - 满江红     缅怀主席/01.jpg", "冰雪诗词_全部图片/4679430944066012 - 满江红     缅怀主席/02.jpg", "冰雪诗词_全部图片/4679430944066012 - 满江红     缅怀主席/03.jpg"]}, {"id": "4679797354270636", "title": "七律·教师节抒怀", "genre": "七律", "body": "解惑释疑同古今，\n先生誉望几浮沉。\n栽培桃李千千代，\n孕育梁椽万万人。\n师者言行垂典范，\n世间情事有佳音。\n若得重教成风气，\n华夏山河总是春。 ​​​", "date": "2021.09.10", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4679797354270636 - 七律 教师节抒怀/01.jpg"]}, {"id": "4680158310564557", "title": "蝶恋花·别样教师", "genre": "蝶恋花", "body": "身在讲堂思在外，\n故漏精华，草草图轻快。\n学子奈何心里怪，\n岂知课后家中卖。\n劣马乱群为一害，\n此病如成，势必园丁败。\n培土修枝规若坏，\n毁伤桃李情难耐。 ​​​", "date": "2021.09.11", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4680158310564557 - 蝶恋花      别样教师/01.jpg"]}, {"id": "4680533181729321", "title": "南歌子·911有寄", "genre": "南歌子", "body": "反恐风头劲，\n回头双秩年。\n当今寰宇可平安。\n世上谁知？\n把酒问苍天。\n几欲强权灭，\n还来塔利班。\n最终无奈卷衣衫。\n四海纷纷，\n岂是自家园。 ​​​", "date": "2021.09.12", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4680533181729321 - 南歌子  911有寄/01.jpg"]}, {"id": "4680881744120161", "title": "玉楼春·吟望", "genre": "玉楼春", "body": "东望乳山心已醉，\n宵梦银滩千里会。\n登山遥眺景无边，\n临海高歌人不累。\n今日逢秋难迈腿，\n情滞京城陪晚辈。\n何时还作自由身，\n塞北江南尝美味。 ​​​", "date": "2021.09.13", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4680881744120161 - 玉楼春        吟望/01.jpg"]}, {"id": "4681245219358004", "title": "踏莎行·天生一对", "genre": "踏莎行", "body": "鬼斧神工，\n左男右女。\n眉清目秀无言语。\n欲亲还罢恁多情，\n水中为伴终相聚。\n不似人间，\n无常情侣。\n朝三暮四如飞絮。\n风来各自去无踪，\n那堪共沐狂天雨。 ​​​", "date": "2021.09.14", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4681245219358004 - 踏莎行 天生一对/01.jpg"]}, {"id": "4681612363828135", "title": "忆王孙·秋日童乐", "genre": "忆王孙", "body": "乖宝逢秋鲜吵闹，\n眠有序，晚安晨早。\n晓来梳洗乐加餐，\n绿院里，观花草。\n开上奔驰神态俏，\n红嫩脸，眉开眼笑。\n一颦一靥更招人，\n秀唇润，娇娃巧。 ​​​", "date": "2021.09.15", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4681612363828135 - 忆王孙    秋日童乐/01.jpg", "冰雪诗词_全部图片/4681612363828135 - 忆王孙    秋日童乐/02.jpg", "冰雪诗词_全部图片/4681612363828135 - 忆王孙    秋日童乐/03.jpg", "冰雪诗词_全部图片/4681612363828135 - 忆王孙    秋日童乐/04.jpg"]}, {"id": "4681969310632775", "title": "朝中措·贺全运会开幕", "genre": "朝中措", "body": "古城昨夜焕新姿，\n雁塔映江池。\n钟鼓齐鸣欢奏，\n健儿歌舞今时。\n全民参与，\n强身壮体，\n亿万雄狮。\n腾跃堪惊世界，\n神龙万里东西。 ​​​", "date": "2021.09.16", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4681969310632775 - 朝中措 贺全运会开幕/01.jpg", "冰雪诗词_全部图片/4681969310632775 - 朝中措 贺全运会开幕/02.jpg", "冰雪诗词_全部图片/4681969310632775 - 朝中措 贺全运会开幕/03.jpg"]}, {"id": "4682332709323373", "title": "长相思·遥望", "genre": "长相思", "body": "星光明，月光明。\n临近中秋云色轻。\n微寒鸟不惊。\n忆亲情，念友情。\n无限相思日夜萦。\n团圆惟梦成。 ​​​", "date": "2021.09.17", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "怀古咏史与读文有感", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4682332709323373 - 长相思        遥望/01.jpg"]}, {"id": "4682693491558008", "title": "蝶恋花·天外归客", "genre": "蝶恋花", "body": "……贺神舟十二返回\n环宇神舟飞赤子，\n载誉归来，\n眉眼舒豪气。\n曾问天公商玉帝，\n九州山水风云丽。\n往返穿梭天与地，\n留驻苍穹，\n日后随心意。\n尘世人间多少事，\n天和宫里从长计。 ​​​", "date": "2021.09.18", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4682693491558008 - 蝶恋花     天外归客/01.jpg"]}, {"id": "4683057326721748", "title": "忆秦娥·918警示", "genre": "忆秦娥", "body": "贼心起，\n偷窥台海行孬计。\n行孬计。\n拉帮结派，\n欲行不义。\n风潮暗涌雷声厉，\n九州汀岸人须记。\n人须记。\n绸缪未雨，\n狼来当毙。 ​​​", "date": "2021.09.19", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4683057326721748 - 忆秦娥  918警示/01.jpg"]}, {"id": "4683434603053198", "title": "踏莎行·望月", "genre": "踏莎行", "body": "丹桂馨香，\n西风飒爽。\n中秋临近神思荡。\n天南地北盼团圆，\n家亲朋侣情相向。\n几许随心，\n几多失望。\n缘由千百难重样。\n月明昂首瞩星空，\n深情会聚银盘上。 ​​​", "date": "2021.09.20", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4683434603053198 - 踏莎行         望月/01.jpg"]}, {"id": "4683787864378606", "title": "鹧鸪天·中秋吟望", "genre": "鹧鸪天", "body": "我欠家乡一首诗，\n廉州镇里少年时。\n无穷快乐心头印，\n几个朋俦梦里期。\n人恋世，鬓飞丝。\n客居京邑尽相思。\n今朝又是团圆夜，\n南望星空泪染衣。 ​​​", "date": "2021.09.21", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4683787864378606 - 鹧鸪天 中秋吟望/01.jpg"]}, {"id": "4683929501565838", "title": "七绝·中秋望", "genre": "七绝", "body": "秋水长空一色天，\n斜阳漫洒韵无边。\n徜徉曲岸心头醉，\n期待今宵月更圆。 ​​​", "date": "2021.09.21", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4683929501565838 - 七绝        中秋望/01.jpg", "冰雪诗词_全部图片/4683929501565838 - 七绝        中秋望/02.jpg"]}, {"id": "4684149288340786", "title": "踏莎行·中秋玉女", "genre": "踏莎行", "body": "细细眉峰，\n盈盈秋水。\n轻颦浅笑招人醉。\n乖娃九月恰中秋，\n玉盘萦绕情丝缀。\n宝贝多欢，\n予心不累。\n天天呵护娇花蕊。\n幼苗茁壮老人安，\n惟期如此年年岁 ​​​", "date": "2021.09.22", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4684149288340786 - 踏莎行 中秋玉女/01.jpg", "冰雪诗词_全部图片/4684149288340786 - 踏莎行 中秋玉女/02.jpg", "冰雪诗词_全部图片/4684149288340786 - 踏莎行 中秋玉女/03.jpg", "冰雪诗词_全部图片/4684149288340786 - 踏莎行 中秋玉女/04.jpg"]}, {"id": "4684515831712241", "title": "鹧鸪天·话丰收", "genre": "鹧鸪天", "body": "一派金黄眼底收，\n农人欢悦溢双眸。\n天公不负春耕苦，\n地母凭添喜获秋。\n粮万斗，解千愁。\n举杯邀月恁风流。\n艰辛一分心毋悔，\n百倍赢回在后头。 ​​​", "date": "2021.09.23", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4684515831712241 - 鹧鸪天    话丰收/01.jpg", "冰雪诗词_全部图片/4684515831712241 - 鹧鸪天    话丰收/02.jpg"]}, {"id": "4684870300994878", "title": "眼儿媚·看西方", "genre": "眼儿媚", "body": "一单生意闹翻天，\n浊浪望无边。\n愤招使者，\n震惊元首，\n怒气仇言。\n本非钢板伤痕重，\n碎镜岂能圆。\n凋花败蕊，\n随流而下，\n此后难欢。 ​​​", "date": "2021.09.24", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4684870300994878 - 眼儿媚    看西方/01.jpg"]}, {"id": "4685246241179518", "title": "行香子·秋叶晚红", "genre": "行香子", "body": "…..贺扬振宁先生百岁\n百岁杨公，多少传奇。\n到如今几许人知。\n仰观宇宙，俯辨珠丝。\n解人间情，物间力，世间谜。\n青春溢彩，霞光晚照。\n寄情华夏费神思。\n流言淡对，行做无私。\n默为人友，引人路，作人梯。 ​​​", "date": "2021.09.25", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4685246241179518 - 行香子        秋叶晚红/01.jpg", "冰雪诗词_全部图片/4685246241179518 - 行香子        秋叶晚红/02.jpg", "冰雪诗词_全部图片/4685246241179518 - 行香子        秋叶晚红/03.jpg"]}, {"id": "4685601444727669", "title": "鹧鸪天·秋晚归舟", "genre": "鹧鸪天", "body": "彼岸豺狼贼眼垂，\n无端招惹咬华为。\n历经三载云涛怒，\n漫卷孤峰巨浪催。\n龙引路，晚舟归。\n茫茫沧海映霞晖。\n青山绿水连天碧，\n万里长空白鹤飞。 ​​​", "date": "2021.09.26", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4685601444727669 - 鹧鸪天 秋晚归舟/01.jpg"]}, {"id": "4685979989051524", "title": "太常引·归舟寄怀", "genre": "太常引", "body": "国贫岂有小民安？\n中法事同然，\n结果异千般。\n慨而叹，\n遥如地天。\n平生难忘，\n神州远阔，\n山海万民欢。\n情奋舞翩跹，\n展鹏翼，\n长空劲翻。 ​​​", "date": "2021.09.27", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4685979989051524 - 太常引 归舟寄怀/01.jpg"]}, {"id": "4686320871671977", "title": "浣溪沙·暂别娇孙", "genre": "浣溪沙", "body": "一早乖娃打疫苗，\n临行怀里恁多娇。\n清眉笑靥更妖娆。\n却是归来人不见，\n思乡爷奶去今朝。\n再逢惟盼智身高。 ​​​", "date": "2021.09.28", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4686320871671977 - 浣溪沙 暂别娇孙/01.jpg"]}, {"id": "4686682571674313", "title": "踏莎行·秋日吟", "genre": "踏莎行", "body": "明月娟娟，\n繁星款款。\n黄花丹桂香情远。\n西风寒露又中秋，\n回头往事心无怨。\n天上银盘，\n人间玉盏。\n蟾光醇液金尊满。\n举杯只愿梦成真，\n无边闲事何须管。 ​​​", "date": "2021.09.29", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4686682571674313 - 踏莎行     秋日吟/01.jpg"]}, {"id": "4687043873998217", "title": "临江仙·敬慰英烈", "genre": "临江仙", "body": "先烈英魂千百万，\n而今尽可安眠。\n后生承志奋争前。\n九州山水换，\n旗赤五星妍。\n两弹一星依北斗，\n神舟圆梦飞天。\n古来丝路喜延绵。\n川原盈锦绣，\n峰岭袅炊烟。 ​​​", "date": "2021.09.30", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4687043873998217 - 临江仙 敬慰英烈/01.jpg", "冰雪诗词_全部图片/4687043873998217 - 临江仙 敬慰英烈/02.jpg", "冰雪诗词_全部图片/4687043873998217 - 临江仙 敬慰英烈/03.jpg"]}, {"id": "4687430005559707", "title": "贺新郎·国庆抒怀", "genre": "贺新郎", "body": "旗赤金星闪，遍城乡、迎风飘荡，频亲君脸。\n欣喜穿行神州路，悦看红黄尽染。\n长天外，雁高云淡。\n江海无忧涛浪浅，晚舟归，温暖人心坎。\n情不禁，齐声喊。\n今朝秋水波光滟，\n碧连天，晴空万里，金风拂槛。\n寰宇天宫凭留去，一任英雄俯瞰。\n九州美，夜光点点。\n无悔人生今更是，且高歌，挥笔豪情蘸。\n写不尽，心头念。", "date": "2021.10.01", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4687430005559707 - 贺新郎 国庆抒怀/01.jpg"]}, {"id": "4687771661239467", "title": "七绝·咏叹秋叶", "genre": "七绝", "body": "秋风无意叶花心，\n摇拽飘零羡彩云。\n也想凭空行万里，\n奈何离断自消沉。 ​​​", "date": "2021.10.02", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4687771661239467 - 七绝    咏叹秋叶/01.jpg"]}, {"id": "4688130479753514", "title": "眼儿媚·珠海航展", "genre": "眼儿媚", "body": "银鹰鸣刺湛篮天，\n靓艳舞翩跹。\n炫光幻影，\n彩虹弥漫，\n袅袅云烟。\n几多矛盾惊人眼，\n华夏可长安。\n迎风鼓荡，\n情舒心展，\n众悦无边。 ​​​", "date": "2021.10.03", "themes": ["山水田园与闲居雅趣", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4688130479753514 - 眼儿媚 珠海航展/01.jpg", "冰雪诗词_全部图片/4688130479753514 - 眼儿媚 珠海航展/02.jpg"]}, {"id": "4688502586081613", "title": "太常引·秋日寄怀", "genre": "太常引", "body": "人生易老世无穷，\n何必怨秋风。\n且赏叶趋红。\n把酒向，\n层云碧空。\n凭思往事，\n情怀飞荡，\n暗自笑西东。\n放眼晚霞彤，\n闲迈步，\n山幽水淙。 ​​​", "date": "2021.10.04", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4688502586081613 - 太常引 秋日寄怀/01.jpg"]}, {"id": "4688858635308289", "title": "念奴娇·长津湖寄怀", "genre": "念奴娇", "body": "欺人太甚！手挥三军聚，跨江明志。\n巧设长津湖畔计，怎耐酷寒天气。\n人似冰雕，神魂未了，赤子情坚毅。\n卧艰行苦，却无谁怨天地。\n击碎贼子狂言，弃盔卸甲，一败何千里。\n从此惊心怀噩梦，更昼夜浮生涕。\n华夏扬威，国安家稳，赢取和平世。\n而今回望，拜英雄永相记。", "date": "2021.10.05", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4688858635308289 - 念奴娇     长津湖寄怀/01.jpg", "冰雪诗词_全部图片/4688858635308289 - 念奴娇     长津湖寄怀/02.jpg", "冰雪诗词_全部图片/4688858635308289 - 念奴娇     长津湖寄怀/03.jpg"]}, {"id": "4689222676775689", "title": "五绝·秋雨叹", "genre": "五绝", "body": "秋日连天雨，\n禾田谷未收。\n而今难种麦，\n年后景堪忧。 ​​​", "date": "2021.10.06", "themes": ["感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4689222676775689 - 五绝 秋雨叹/01.jpg", "冰雪诗词_全部图片/4689222676775689 - 五绝 秋雨叹/02.jpg"]}, {"id": "4689333891629370", "title": "七绝·忽悠", "genre": "七绝", "body": "清晨播报雨将停，\n中午又传临暮晴。\n夜里滴阶声未断，\n醒来烟水雾蒙蒙。 ​​​", "date": "2021.10.06", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4689333891629370 - 七绝          忽悠/01.jpg"]}, {"id": "4689581372345654", "title": "清风满桂楼·秋雨愁人", "genre": "清风满桂楼", "body": "风轻雨细。\n数日连绵，泥污漫流田里。\n刚好种麦时，无可奈，黎民怨心窝气。\n凭栏远伫望，九霄外，廉纤难止。\n苍穹拜！良机错过，更无能替。\n都知饭香腻，日月难离，何人管天公事？\n乡下已成灾，阡陌上，牛羊恨君无计。\n今朝未撒子，怎能望，明年物喜。\n谁愁苦，惟有农家泪涕。", "date": "2021.10.07", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4689581372345654 - 清风满桂楼        秋雨愁人/01.jpg"]}, {"id": "4689942602842810", "title": "玉楼春·红与黑", "genre": "玉楼春", "body": "来往三番宇宙宽，\n大洋彼岸两重天。\n当年霸道横于世，\n今日低声对面言。\n盈酒盏，淡心田。\n阴晴难定莫悲欢。\n旦凭北斗银空照，\n便是风霜亦向前。 ​​​", "date": "2021.10.08", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4689942602842810 - 玉楼春   红与黑/01.jpg"]}, {"id": "4690302676238443", "title": "眼儿媚·屏上乖宝", "genre": "眼儿媚", "body": "别娃一日似三秋，\n网见喜心头。\n两眸闪亮，\n辨音挥手，\n站立无忧。\n看书端坐翻来去，\n竞自乐难休。\n鸡熊为友，\n观颜闻事，\n摆弄圈球。 ​​​", "date": "2021.10.09", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4690302676238443 - 眼儿媚 屏上乖宝/01.jpg", "冰雪诗词_全部图片/4690302676238443 - 眼儿媚 屏上乖宝/02.jpg", "冰雪诗词_全部图片/4690302676238443 - 眼儿媚 屏上乖宝/03.jpg", "冰雪诗词_全部图片/4690302676238443 - 眼儿媚 屏上乖宝/04.jpg"]}, {"id": "4690673854842127", "title": "鹧鸪天·赠儿媳新疆挂职", "genre": "鹧鸪天", "body": "九月娇娃别母亲，\n人生几个似如今。\n三年西域君无怨，\n每日东边扯汝心。\n思稚脸，盼儿音。\n一天伏案几分神。\n今朝桃李经风雨，\n日后芳欣果更淳。 ​​​", "date": "2021.10.10", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4690673854842127 - 鹧鸪天 赠儿媳新疆挂职/01.jpg"]}, {"id": "4691031436298083", "title": "蝶恋花·双十寄怀", "genre": "蝶恋花", "body": "辛亥当年回首望，\n翻转乾坤，\n江海掀波浪。\n万岭千山思变样，\n神州到处风云荡。\n更起红船人向党，\n赤子齐心，\n万丈豪情漾。\n无数英雄同继往，\n如今凯奏高歌唱。 ​​​", "date": "2021.10.11", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4691031436298083 - 蝶恋花 双十寄怀/01.jpg"]}, {"id": "4691398869649606", "title": "七律·秋夜闲吟", "genre": "七律", "body": "一望篱边菊蕊黄，\n微风寒露夜趋凉。\n清光东滞裁桐叶，\n明月西移过女墙。\n把酒飞思千里远，\n剪音成韵几诗行。\n灯前吟赋人无寐，\n梦里念君情意长。 ​​​", "date": "2021.10.12", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4691398869649606 - 七律   秋夜闲吟/01.jpg"]}, {"id": "4691756848775799", "title": "风入松·外甥女出嫁", "genre": "风入松", "body": "妹家喜事聚乡邻，\n笑语声频。\n楼前炉火蒸香溢，\n情盈碗，意满瓯盆。\n旭日金风送爽，\n笼灯五彩萦门。\n闺中娇女醉心神，\n喜雾氤氲。\n红花玉照床头上，\n轻回首，顾盼郎君。\n携手人生长路，\n连枝比翼销魂。 ​​​", "date": "2021.10.13", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4691756848775799 - 风入松 外甥女出嫁/01.jpg", "冰雪诗词_全部图片/4691756848775799 - 风入松 外甥女出嫁/02.jpg", "冰雪诗词_全部图片/4691756848775799 - 风入松 外甥女出嫁/03.jpg", "冰雪诗词_全部图片/4691756848775799 - 风入松 外甥女出嫁/04.jpg", "冰雪诗词_全部图片/4691756848775799 - 风入松 外甥女出嫁/05.jpg", "冰雪诗词_全部图片/4691756848775799 - 风入松 外甥女出嫁/06.jpg"]}, {"id": "4692117606369433", "title": "太常引·玉女完婚", "genre": "太常引", "body": "王家俏女入冯门，\n惊艳众乡邻。\n鸟雀醉心神。\n俊眉眼，\n红唇浅颦。\n芳庭落轿，\n花童拥簇，\n轻踏起香尘。\n心里念娘恩，\n盈喜泪，\n回头望亲。 ​​​", "date": "2021.10.14", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4692117606369433 - 太常引 玉女完婚/01.jpg", "冰雪诗词_全部图片/4692117606369433 - 太常引 玉女完婚/02.jpg", "冰雪诗词_全部图片/4692117606369433 - 太常引 玉女完婚/03.jpg", "冰雪诗词_全部图片/4692117606369433 - 太常引 玉女完婚/04.jpg", "冰雪诗词_全部图片/4692117606369433 - 太常引 玉女完婚/05.jpg", "冰雪诗词_全部图片/4692117606369433 - 太常引 玉女完婚/06.jpg"]}, {"id": "4692480233309329", "title": "鹧鸪天·重阳吟", "genre": "鹧鸪天", "body": "九九重阳万里秋，\n枫红气爽老无忧。\n居家漫看尘间事，\n野外闲观碧水流。\n攀俊岭，泛轻舟。\n凭风把酒醉难休。\n登高望远心怀畅，\n胜似天堂岂用求。 ​​​", "date": "2021.10.15", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4692480233309329 - 鹧鸪天   重阳吟/01.jpg"]}, {"id": "4692854544269554", "title": "菩萨蛮·神舟又起", "genre": "菩萨蛮", "body": "酒泉夜起飞天客，\n逐星伴月寒光彻。\n地上过重阳，\n云空万里翔。\n天和增喜气，\n宫里迎娇女。\n半载宇寰行，\n三人事竟成。 ​​​", "date": "2021.10.16", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4692854544269554 - 菩萨蛮 神舟又起/01.jpg"]}, {"id": "4693207101212620", "title": "菩萨蛮·心欲碎", "genre": "菩萨蛮", "body": "节前别过今相见，\n孙娃一霎心神乱。\n或许想妈妈，\n明眸润欲花。\n此情催老泪，\n将语心头碎。\n九月小娇人，\n家亲来往频。\n注：十一前爷爷奶奶\n走，姥爷姥姥来。十\n月九日奶奶来，十日\n妈妈去新疆三年。今\n朝爷爷来，姥爷姥姥\n走。 ​​​", "date": "2021.10.17", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4693207101212620 - 菩萨蛮   心欲碎/01.jpg"]}, {"id": "4693569329169934", "title": "七绝·秋风美韵", "genre": "七绝", "body": "浮云吹去尽蓝天，\n早晚无风亦冷寒。\n秋染京城美如画，\n香山红叶醉心田。 ​​​", "date": "2021.10.18", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4693569329169934 - 七绝    秋风美韵/01.jpg"]}, {"id": "4693928542471325", "title": "菩萨蛮·闻事闲吟", "genre": "菩萨蛮", "body": "当年半管凭空粉，\n无端开战人神恨。\n不见愧心怀，\n苍天报应来。\n新冠尘世祸，\n老米委人过。\n却有信其真，\n到头伤自身。 ​​​", "date": "2021.10.19", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4693928542471325 - 菩萨蛮 闻事闲吟/01.jpg", "冰雪诗词_全部图片/4693928542471325 - 菩萨蛮 闻事闲吟/02.jpg"]}, {"id": "4694293148862541", "title": "七绝·闻事有感", "genre": "七绝", "body": "祸害人家招众恨，\n狐朋狗党情相近。\n冥冥天道在尘间，\n终了声名岂用问。 ​​​", "date": "2021.10.20", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4694293148862541 - 七绝    闻事有感/01.jpg", "冰雪诗词_全部图片/4694293148862541 - 七绝    闻事有感/02.jpg"]}, {"id": "4694658436040192", "title": "行香子·秋夜吟", "genre": "行香子", "body": "明镜飞天，水静蟾寒。\n望银空夜色难眠。\n繁星闪烁，落叶无言。\n恰秋儿暮，风儿细，月儿圆。\n灯前缃帙，文辞入眼。\n似先贤古圣来前。\n追寻李杜，遥访苏韩。\n品诗中事，词中水，赋中山。 ​​​", "date": "2021.10.21", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4694658436040192 - 行香子           秋夜吟/01.jpg"]}, {"id": "4695024262972212", "title": "七律·秋日寄同窗", "genre": "七律", "body": "鬓角飞丝任剪裁，\n而今谁个不头白。\n曾经坎坷风霜落，\n赢取甘甜雨露来。\n遥望今朝千里外，\n相思往事一襟怀。\n凭栏慨叹云霞色，\n喜看秋菊遍处开。 ​​​", "date": "2021.10.22", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4695024262972212 - 七律 秋日寄同窗/01.jpg"]}, {"id": "4695382234235309", "title": "采桑子·时令吟", "genre": "采桑子", "body": "西风漫卷催霜降，\n星月高悬，\n晓色清寒，\n疏柳栖鸦对老蝉。\n黄花红叶凭空舞，\n庭院篱边，\n窗下尊前，\n岁月悠悠年复年。 ​​​", "date": "2021.10.23", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4695382234235309 - 采桑子   时令吟/01.jpg"]}, {"id": "4695754758949050", "title": "鹧鸪天·心慰", "genre": "鹧鸪天", "body": "灯下孙娃才睡安，\n一天忙碌此时闲。\n端详稚脸生红晕，\n抚触眉头汗已干。\n娘别后，爸趋前。\n通宵陪护女儿边。\n深情母爱今相续，\n昼夜无忧渐始欢。 ​​​", "date": "2021.10.24", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4695754758949050 - 鹧鸪天       心慰/01.jpg", "冰雪诗词_全部图片/4695754758949050 - 鹧鸪天       心慰/02.jpg", "冰雪诗词_全部图片/4695754758949050 - 鹧鸪天       心慰/03.jpg"]}, {"id": "4696107362288728", "title": "虞美人·白头吟", "genre": "虞美人", "body": "当年无空娇儿侍，\n昼夜凭妻继。\n而今得空弄孙娃，\n斑鬓霜丝合力育妍花。\n人生代代情相递，\n千古成今世。\n爱倾耆少益神州，\n始有泱泱华夏万年秋。 ​​​", "date": "2021.10.25", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4696107362288728 - 虞美人           白头吟/01.jpg"]}, {"id": "4696466326818176", "title": "长相思·任性妄为", "genre": "长相思", "body": "人凝眸，虎凝眸。\n相对无言万众愁。\n谁能解个由。\n早风流，晚风流。\n为客之行当敛收。\n性情家里留。 ​​​", "date": "2021.10.26", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4696466326818176 - 长相思 任性妄为/01.jpg"]}, {"id": "4696834306212315", "title": "七绝·游园有寄", "genre": "七绝", "body": "百子湾中看野鸭，\n娇孙嫩脸乐开花。\n天真童稚无忧虑，\n戏水金鱼可似她？ ​​​", "date": "2021.10.27", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4696834306212315 - 七绝    游园有寄/01.jpg", "冰雪诗词_全部图片/4696834306212315 - 七绝    游园有寄/02.jpg", "冰雪诗词_全部图片/4696834306212315 - 七绝    游园有寄/03.jpg"]}, {"id": "4697192998895987", "title": "忆王孙·闻事有感", "genre": "忆王孙", "body": "钢琴王子意飘然，\n心若游丝乱为欢。\n终有今朝车马翻。\n霎时间，\n无数光环散远天。 ​​​", "date": "2021.10.28", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4697192998895987 - 忆王孙 闻事有感/01.jpg"]}, {"id": "4697558276375266", "title": "七绝·闲吟游人", "genre": "七绝", "body": "重阳秋兴漾心头，\n惬意携家塞外游。\n不料疫情今又起，\n胡杨未见走难筹。 ​​​", "date": "2021.10.29", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4697558276375266 - 七绝    闲吟游人/01.jpg"]}, {"id": "4697917409198392", "title": "少年游·秋日闲吟", "genre": "少年游", "body": "已然霜降却无寒，\n秋暮似春天。\n午后微风，斜阳横照，\n征雁奋翩跹。\n花前庭院凭栏望，\n耆少自悠闲。\n翁老争棋，粉人劲舞，\n童稚荡秋千。 ​​​", "date": "2021.10.30", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4697917409198392 - 少年游       秋日闲吟/01.jpg"]}, {"id": "4698280540505975", "title": "七绝·假日闲吟", "genre": "七绝", "body": "久闻集市晓趋前，\n横锁穿门叶寂寒。\n借问今番竟何事？\n疫情逼近保民安。 ​​​", "date": "2021.10.31", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4698280540505975 - 七绝    假日闲吟/01.jpg"]}, {"id": "4698647071297071", "title": "蝶恋花·苦乐吟", "genre": "蝶恋花", "body": "怡弄孙娃忙早晚，\n窗下台前，\n净手清眉眼。\n热奶烧汤蒸煮饭，\n新潮玩具收还乱。\n便是得闲眠亦浅，\n梦里分神，\n生怕婴声远。\n苦乐交加金不换，\n欣然回首娇容灿。 ​​​", "date": "2021.11.01", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4698647071297071 - 蝶恋花    苦乐吟/01.jpg"]}, {"id": "4699009182599873", "title": "七绝·婴鸟相乐", "genre": "七绝", "body": "金秋庭院弄朝晖，\n十月娇孙看雀飞。\n眉眼清圆纤手舞，\n多情小鸟不思归。 ​​​", "date": "2021.11.02", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4699009182599873 - 七绝    婴鸟相乐/01.jpg", "冰雪诗词_全部图片/4699009182599873 - 七绝    婴鸟相乐/02.jpg"]}, {"id": "4699373307167950", "title": "蝶恋花·挚爱深情", "genre": "蝶恋花", "body": "母爱深深千里寄，\n人在边关，\n念女京城事。\n细乳涓涓凭空递，\n温情宛转千方计。\n自古娘亲无可替，\n不惧艰辛，\n只为儿孙丽。\n多少后生明此意，\n终身能把娘恩记。 ​​​", "date": "2021.11.03", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4699373307167950 - 蝶恋花 挚爱深情/01.jpg", "冰雪诗词_全部图片/4699373307167950 - 蝶恋花 挚爱深情/02.jpg"]}, {"id": "4699724755502867", "title": "七律·赞获奖者", "genre": "七律", "body": "埋头研创奖加身，\n无悔平生历苦辛。\n二弹一星凭志远，\n巡天探月赖情深。\n冷观寰宇风云暗，\n喜看神州景色春。\n昂首扬眉依重器，\n龙腾霄汉仰诸君。 ​​​", "date": "2021.11.04", "themes": ["感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4699724755502867 - 七律    赞获奖者/01.jpg"]}, {"id": "4700093922148877", "title": "太常引·寒秋晓雾", "genre": "太常引", "body": "寒潮南北卷神州，\n晓色冷飕飕。\n霾雾更堪忧。\n恁无奈，人悲鸟愁。\n枯枝黄叶，\n层层霜露，\n无语诉深秋。\n冠疫乱行游。\n外出苦，\n居家为囚。 ​​​", "date": "2021.11.05", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4700093922148877 - 太常引 寒秋晓雾/01.jpg"]}, {"id": "4700461955288792", "title": "蝶恋花·闻事抒怀", "genre": "蝶恋花", "body": "绝地逢生凭士气，\n智取舟桥，\n更把豺狼避。\n留有青山长远计，\n再图叶茂风华易。\n霸主情怀今又是，\n尝胆披荆，\n铸就英雄势。\n多路出兵前后继，\n等闲且看东山起。 ​​​", "date": "2021.11.06", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4700461955288792 - 蝶恋花 闻事抒怀/01.jpg", "冰雪诗词_全部图片/4700461955288792 - 蝶恋花 闻事抒怀/02.jpg"]}, {"id": "4700823378986012", "title": "七绝·立冬", "genre": "七绝", "body": "通宵雨雪斗西风，\n除尽污霾洒玉冰。\n树上寒鸦慵不起，\n爷孙楼角望花凌。 ​​​", "date": "2021.11.07", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4700823378986012 - 七绝           立冬/01.jpg", "冰雪诗词_全部图片/4700823378986012 - 七绝           立冬/02.jpg", "冰雪诗词_全部图片/4700823378986012 - 七绝           立冬/03.jpg"]}, {"id": "4701177096962624", "title": "七绝·立冬寄同窗", "genre": "七绝", "body": "飘絮飞花冷色浓，\n朔风催我入初冬。\n三鲜水饺寻常事，\n一盏醇醪慰此生。 ​​​", "date": "2021.11.08", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4701177096962624 - 七绝 立冬寄同窗/01.jpg"]}, {"id": "4701541426005233", "title": "七绝·雪后楼院", "genre": "七绝", "body": "雪霁天晴水又冰，\n楼前庭院少人声。\n寻常童叟悠闲处，\n今日寒鸦避北风。 ​​​", "date": "2021.11.09", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4701541426005233 - 七绝   雪后楼院/01.jpg"]}, {"id": "4701901264257383", "title": "秋蕊香引·雪梅报春", "genre": "秋蕊香引", "body": "冬已到。风寒霜降，败枝衰草。暮鸦静，栖树杪。\n晚霞散尽空清冷，路人渐稀少。\n临夜半，玉絮纷飞弄巧。雪来早。\n六花满地，万里银光袅。\n冷香处，红梅蕊，欲将春报。 ​​​", "date": "2021.11.10", "themes": ["四时风光与节气流转"], "images": ["冰雪诗词_全部图片/4701901264257383 - 秋蕊香引        雪梅报春/01.jpg"]}, {"id": "4702268886616656", "title": "踏莎行·闻事有感", "genre": "踏莎行", "body": "尘世无常，\n人生不易。\n身前多少功名利。\n今朝不料尽随风，\n音容一霎如烟逝。\n语要迎心，\n行宜合体。\n少争无怨舒肝气。\n山间水畔醉天光，\n云来涛去由它意。 ​​​", "date": "2021.11.11", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4702268886616656 - 踏莎行 闻事有感/01.jpg"]}, {"id": "4702626795488493", "title": "五律·初冬趣", "genre": "五律", "body": "楼台萦翠色，\n冬日恁温馨。\n盆里栽生菜，\n栏边育嫩芹。\n老妻堪巧手，\n童稚口食亲。\n免却担惊怕，\n婴餐尽可心。 ​​​", "date": "2021.11.12", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4702626795488493 - 五律 初冬趣/01.jpg", "冰雪诗词_全部图片/4702626795488493 - 五律 初冬趣/02.jpg", "冰雪诗词_全部图片/4702626795488493 - 五律 初冬趣/03.jpg"]}, {"id": "4702998880586484", "title": "七绝·别后初逢", "genre": "七绝", "body": "母女别离情不断，\n银屏声貌日相闻。\n醒来惊喜床头见，\n十月孙娃笑更频。 ​​​", "date": "2021.11.13", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4702998880586484 - 七绝    别后初逢/01.jpg"]}, {"id": "4703358617387600", "title": "七律·半老抒怀", "genre": "七律", "body": "人生能有几时闲？\n忙碌今朝日复年。\n少子读书灯下苦，\n壮丁立业梦中难。\n儿孙总念宵无寐，\n父母常思昼不安。\n斑鬓飞丝心未老，\n钟情山水又趋前。 ​​​", "date": "2021.11.14", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4703358617387600 - 七律    半老抒怀/01.jpg"]}, {"id": "4703712494225556", "title": "长相思·惜宝岛", "genre": "长相思", "body": "说台湾，\n看台湾。\n今被他人桌上摊。\n听来好可怜。\n蒙一天，\n算一天。\n孤井为家竟自欢。\n无缘天外天。 ​​​", "date": "2021.11.15", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4703712494225556 - 长相思    惜宝岛/01.jpg"]}, {"id": "4704086395980624", "title": "采桑子·冬日闲吟", "genre": "采桑子", "body": "耳根清净功名远。\n事少心闲，\n灯下尊前。\n喜看今朝似过年。\n火红日子风云淡。\n碧水蓝天，\n思绪无边。\n鸥鹭为盟醉海天。 ​​​", "date": "2021.11.16", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4704086395980624 - 采桑子 冬日闲吟/01.jpg"]}, {"id": "4704441917245455", "title": "朝中措·交锋", "genre": "朝中措", "body": "前番几次将相逢，\n彼此探军情。\n几许心中有数，\n今朝两帅交锋。\n年来暗战，\n云烟迷漫，\n难论输赢。\n惟有言欢握手，\n才能世态安宁。 ​​​", "date": "2021.11.17", "themes": ["家国情怀与时代歌咏", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4704441917245455 - 朝中措       交锋/01.jpg"]}, {"id": "4704802519647483", "title": "七绝·颙望", "genre": "七绝", "body": "百态人生或短长，\n朝霞冉冉至夕阳。\n曾经绚丽心无悔，\n何虑青丝染露霜。 ​​​", "date": "2021.11.18", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4704802519647483 - 七绝           颙望/01.jpg"]}, {"id": "4705164176919173", "title": "鹧鸪天·咏柳", "genre": "鹧鸪天", "body": "黄绿参差漫剪风，\n枝条垂落诉曾经。\n秋光不似春光暖，\n老叶深含嫩叶情。\n听暮雨，映晨星。\n从前草碧百花红。\n如今霜降多凋谢，\n独对寒鸦意亦浓。 ​​​", "date": "2021.11.19", "themes": ["四时风光与节气流转", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4705164176919173 - 鹧鸪天       咏柳/01.jpg"]}, {"id": "4705530474660319", "title": "长相思·爷孙乐", "genre": "长相思", "body": "橙子甘，\n柚子甘。\n滋润双唇两靥甜。\n娇娃自是欢。\n乐一天，\n玩一天。\n打过秋千还套圈。\n细眉飞耳边。 ​​​", "date": "2021.11.20", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4705530474660319 - 长相思     爷孙乐/01.jpg"]}, {"id": "4705892094968433", "title": "七绝·寄银滩李兄", "genre": "七绝", "body": "相思不必长相见，\n情寄银屏字句真。\n望水隔山闲事少，\n倚栏邀月醉同心。 ​​​", "date": "2021.11.21", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4705892094968433 - 七绝 寄银滩李兄/01.jpg"]}, {"id": "4706249767911779", "title": "朝中措·生日有寄", "genre": "朝中措", "body": "今年家宴不同昔，\n孙女最称奇。\n往日尊前平淡，\n她来无限生机。\n平添滋味，\n徒增欢笑，\n任鬓飞丝。\n忘却平生烦恼，\n与娃心醉神怡。 ​​​", "date": "2021.11.22", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4706249767911779 - 朝中措 生日有寄/01.jpg"]}, {"id": "4706612315424741", "title": "七绝·冬日有感", "genre": "七绝", "body": "时临小雪卷寒风，\n残叶横飞乱远空。\n出手即回心底颤，\n路人无奈苦谋生。 ​​​", "date": "2021.11.23", "themes": ["四时风光与节气流转", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4706612315424741 - 七绝    冬日有感/01.jpg"]}, {"id": "4706981351262805", "title": "踏莎行·闻事有感", "genre": "踏莎行", "body": "恶狗伤人，\n庸差了事。\n周遭百姓难平气。\n新潮媒体助人心，\n喜来官府迎民意。\n显案刚平，\n隐情又起。\n为人切莫依权势。\n举头三尺有神明，\n心存敬畏长空丽。 ​​​", "date": "2021.11.24", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4706981351262805 - 踏莎行 闻事有感/01.jpg"]}, {"id": "4707336632928381", "title": "七绝·酬友", "genre": "七绝", "body": "问候临屏冬日暖，\n真情驱散九天寒。\n神州防疫民为本，\n山海同辉草木安。 ​​​", "date": "2021.11.25", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4707336632928381 - 七绝           酬友/01.jpg"]}, {"id": "4707702212658027", "title": "蝶恋花·述怀", "genre": "蝶恋花", "body": "人重人轻身外事，\n浮利虚名，\n不必心头计。\n宠辱无惊湖畔倚，\n泛舟弄水鱼鸥戏。\n云淡风轻人惬意，\n畅望山峰，\n袅袅腾烟气。\n满眼霞光飞旎旖，\n余生闲度清幽地 ​​​", "date": "2021.11.26", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4707702212658027 - 蝶恋花       述怀/01.jpg"]}, {"id": "4708061451388836", "title": "七绝·渴望", "genre": "七绝", "body": "百岁人生能有几？\n同窗相聚古来稀。\n促膝闲坐茗香淡，\n多少英豪梦里期。 ​​​", "date": "2021.11.27", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4708061451388836 - 七绝           渴望/01.jpg"]}, {"id": "4708424666056139", "title": "南歌子·咏望", "genre": "南歌子", "body": "天上星河转，\n人间岁月流。\n今朝山水乐无忧。\n翠岭闲观轻浪、\n戏沙鸥。\n塞北风光丽，\n江南景色柔。\n莺飞燕舞啭枝头。\n万里层云欣喜、\n望神州。 ​​​", "date": "2021.11.28", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4708424666056139 - 南歌子       咏望/01.jpg"]}, {"id": "4708787271501605", "title": "朝中措·高人妙方", "genre": "朝中措", "body": "见风转舵好行船，\n妙理越千年。\n凭此畅游江海，\n浪中笑看长天，\n丛林世界，\n云烟跌宕，\n龙虎争前。\n到底谁能随愿，\n渐崇华夏军团。 ​​​", "date": "2021.11.29", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4708787271501605 - 朝中措 高人妙方/01.jpg"]}, {"id": "4709150624057211", "title": "蝶恋花·联想有感", "genre": "蝶恋花", "body": "杨柳青青人欲问，\n昔日豪情，\n惟剩心头恨？\n司马滔滔抛妙论，\n至今谁可消疑闷。\n有理说开民释忿，\n何必无声，\n背地挥刀棍。\n若使他人言语尽，\n还须自己行为顺。 ​​​", "date": "2021.11.30", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4709150624057211 - 蝶恋花 联想有感/01.jpg"]}, {"id": "4709519353974681", "title": "七绝·冬日闲吟", "genre": "七绝", "body": "与人常笑身心少，\n胜似灵丹堪妙药。\n年老情闲何所求，\n无忧岁月风光好。 ​​​", "date": "2021.12.01", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4709519353974681 - 七绝    冬日闲吟/01.jpg"]}, {"id": "4709872504930797", "title": "南乡子·冬日感怀", "genre": "南乡子", "body": "镜里鬓飞霜，\n将老还行远故乡。\n来为子孙勤料理。\n穷忙，\n常是无闲夜未央。\n儿辈梦中香，\n自是无忧脸目详。\n晓起转身清爽去。\n阳光，\n洒向周边紫气扬。 ​​​", "date": "2021.12.02", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4709872504930797 - 南乡子 冬日感怀/01.jpg"]}, {"id": "4710240320751008", "title": "七绝·无题", "genre": "七绝", "body": "知音难觅梦中求，\n欲诉心怀网上游。\n虚拟空间多少事，\n光阴无奈指尖流。 ​​​", "date": "2021.12.03", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4710240320751008 - 七绝           无题/01.jpg"]}, {"id": "4710612712818611", "title": "定风波·知足自乐", "genre": "定风波", "body": "多是生来为口忙，\n果鲜未必尽穿肠。\n天下珍馐千百万，\n休怨。\n且留后世子孙尝。\n万事中庸方为好，\n愁少。\n魂安拥枕梦宵香。\n日夜无忧心绪远，\n闲看。\n悠悠山水好风光。 ​​​", "date": "2021.12.04", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4710612712818611 - 定风波 知足自乐/01.jpg"]}, {"id": "4710964739442612", "title": "踏莎行·时光欢逝", "genre": "踏莎行", "body": "苍鬓童心，\n无愁有笑。\n与娃相处心怀俏。\n一周转眼又轮回，\n时光飞逝余生妙。\n爷奶欢行，\n祖孙嘻闹。\n楼前院后闻啼鸟。\n天寒无惧赖貂裘，\n篱边梅蕊春将报。 ​​​", "date": "2021.12.05", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4710964739442612 - 踏莎行 时光欢逝/01.jpg"]}, {"id": "4711322954762728", "title": "七绝·遥看", "genre": "七绝", "body": "七把长枪一个班，\n阵容威武啸云天。\n为迎圣诞阖家照，\n难怪街头祸患连。 ​​​", "date": "2021.12.06", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4711322954762728 - 七绝           遥看/01.jpg"]}, {"id": "4711687138051595", "title": "菩萨蛮·寄语孙娃", "genre": "菩萨蛮", "body": "梦香不晓妈妈去，\n醒来依旧盈欢绪。\n毕竟小天真，\n别离未动心。\n说来还算好，\n爷奶忧愁少。\n父母也神安，\n征途志远天。 ​​​", "date": "2021.12.07", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4711687138051595 - 菩萨蛮 寄语孙娃/01.jpg"]}, {"id": "4712045923272426", "title": "七绝·霞光晚照", "genre": "七绝", "body": "风轮星月染霞晖，\n万里澄空日色归。\n已是黄昏情亦好，\n登高送目绪思飞。 ​​​", "date": "2021.12.08", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4712045923272426 - 七绝    霞光晚照/01.jpg"]}, {"id": "4712410763495589", "title": "踏莎行·闻事感吟", "genre": "踏莎行", "body": "无事生非，\n魂消烟灭。\n葬身山谷寒虫啮。\n曾经狂妄蔑神州，\n而今梦语随风月。\n好自为人，\n切毋撒野。\n阿三上下当思略。\n与邻友善共云天，\n并行致远歌长阕。 ​​​", "date": "2021.12.09", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4712410763495589 - 踏莎行 闻事感吟/01.jpg"]}, {"id": "4712777182086759", "title": "桂殿秋·太空开讲", "genre": "桂殿秋", "body": "仙女课，在天宫。\n释疑解惑宇寰行。\n神州赤子心怀奋，\n仰望星空月色明。 ​​​", "date": "2021.12.10", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4712777182086759 - 桂殿秋 太空开讲/01.jpg"]}, {"id": "4713135657978420", "title": "浣溪沙·痛击疯会", "genre": "浣溪沙", "body": "打脸何须对面抽，\n一言击中癞皮猴。\n贼心窝火恨难流。\n尘世阳光谁可阻，\n人间正道自追求。\n桑田沧海写春秋。 ​​​", "date": "2021.12.11", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4713135657978420 - 浣溪沙 痛击疯会/01.jpg"]}, {"id": "4713498016220009", "title": "七绝·冬日闲吟", "genre": "七绝", "body": "时逢大雪雨纤纤，\n烟雾濛濛漫远天。\n依照寻常本该冷，\n春衫秋裤意超然。 ​​​", "date": "2021.12.12", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4713498016220009 - 七绝    冬日闲吟/01.jpg"]}, {"id": "4713866737485450", "title": "清平乐·祝娘亲高寿", "genre": "清平乐", "body": "倚栏伫立，\n遥祝娘生日。\n身陷京城思故里，\n心愧双亲难抑。\n惟期慈母平安，\n与邻说笑聊天。\n二老相依为伴，\n还凭贤妹朝前。 ​​​", "date": "2021.12.13", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4713866737485450 - 清平乐 祝娘亲高寿/01.jpg"]}, {"id": "4714225023321918", "title": "七绝·感悟", "genre": "七绝", "body": "亲人如玉友如金，\n百倍珍惜莫染尘。\n多少钱财难买断，\n真诚一分久于心。 ​​​", "date": "2021.12.14", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4714225023321918 - 七绝           感悟/01.jpg"]}, {"id": "4714585305120956", "title": "七绝·午后童趣", "genre": "七绝", "body": "娇孙睡醒乐无穷，\n地上翻爬趣更浓。\n厨卫明知不许去，\n回头媚笑恣前行。 ​​​", "date": "2021.12.15", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4714585305120956 - 七绝    午后童趣/01.jpg"]}, {"id": "4714948649550800", "title": "浣溪沙·云", "genre": "浣溪沙", "body": "来不相知去不留，\n长空万里任行游。\n浮生名分岂须求。\n酷暑临江非有意，\n严寒出岫亦无由。\n随心舒卷恁风流。 ​​​", "date": "2021.12.16", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4714948649550800 - 浣溪沙    云/01.jpg"]}, {"id": "4715310437107635", "title": "七绝·冬晓吟", "genre": "七绝", "body": "一夜狂风梦不圆，\n打窗枝叶送清寒。\n翻身恐怕家人醒，\n暗自劳神忆往年。 ​​​", "date": "2021.12.17", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4715310437107635 - 七绝     冬晓吟/01.jpg"]}, {"id": "4715672154145014", "title": "七绝·闻事偶感", "genre": "七绝", "body": "人来尘世鸣天地，\n魂逝云空悄不言。\n多少亲情留未住，\n声名无奈向黄泉。 ​​​", "date": "2021.12.18", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4715672154145014 - 七绝    闻事偶感/01.jpg"]}, {"id": "4716038317149921", "title": "七律·玉鼠学步", "genre": "七律", "body": "将临周岁起身行，\n颤颤悠悠腿不灵。\n脚底歪斜花影动，\n眉心上下舞春风。\n开怀最是词难表，\n得意谁能语悦情。\n看似寻常蹀躞步，\n却从此刻走人生。 ​​​", "date": "2021.12.19", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4716038317149921 - 七律    玉鼠学步/01.jpg", "冰雪诗词_全部图片/4716038317149921 - 七律    玉鼠学步/02.jpg", "冰雪诗词_全部图片/4716038317149921 - 七律    玉鼠学步/03.jpg"]}, {"id": "4716400038121174", "title": "鹧鸪天·浮生悟", "genre": "鹧鸪天", "body": "莫道人间行路难，\n心怀宽阔纳云天。\n依山且走林中径，\n傍水勤摇浪里船。\n当努力，忌空言。\n捕鱼采果自成欢。\n粗茶淡饭凭栏望，\n闲看星辰梦里甜。 ​​​", "date": "2021.12.20", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4716400038121174 - 鹧鸪天    浮生悟/01.jpg"]}, {"id": "4716814711916191", "title": "鹧鸪天·若煊生日", "genre": "鹧鸪天", "body": "玉鼠一周岁悄然，\n秀眉娇靥立人前。\n常添笑料心怀悦，\n总作谈资伴美餐。\n情不尽，趣无边。\n流年逝月指挥间。\n万金难买阖家乐，\n惟有孙娃笑破天。 ​​​", "date": "2021.12.21", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4716814711916191 - 鹧鸪天 若煊生日/01.jpg", "冰雪诗词_全部图片/4716814711916191 - 鹧鸪天 若煊生日/02.jpg", "冰雪诗词_全部图片/4716814711916191 - 鹧鸪天 若煊生日/03.jpg", "冰雪诗词_全部图片/4716814711916191 - 鹧鸪天 若煊生日/04.jpg"]}, {"id": "4717125098277816", "title": "七绝·冬至", "genre": "七绝", "body": "昼短夜长天数九，\n寒鸦冷树怯西风。\n红梅傲雪花枝绽，\n拟报春来玉宇清。 ​​​", "date": "2021.12.22", "themes": ["四时风光与节气流转"], "images": ["冰雪诗词_全部图片/4717125098277816 - 七绝      冬至/01.jpg"]}, {"id": "4717488439297028", "title": "桂殿秋·闻事吟", "genre": "桂殿秋", "body": "灯塔灭，树将倾。\n猢狲各自觅前程，\n呼风唤雨今难再，\n马下麾旁恁冷清。 ​​​", "date": "2021.12.23", "themes": ["咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4717488439297028 - 桂殿秋    闻事吟/01.jpg"]}, {"id": "4717848620434514", "title": "采桑子·岁暮吟", "genre": "采桑子", "body": "时光无意催人老，\n且享余生，\n潇洒闲行。\n何必回头恋旧名。\n香醪一盏心微醉，\n梦稳神宁，\n缭绕乡情。\n悬月娟娟故里明。 ​​​", "date": "2021.12.24", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4717848620434514 - 采桑子    岁暮吟/01.jpg"]}, {"id": "4718209921714298", "title": "蝶恋花·小聚有感", "genre": "蝶恋花", "body": "物是人非心底叹。\n岁暮围炉，\n不见桃花面。\n或许多情疏信念，\n惟期日后身康健。\n往事萦怀难逝远。\n待友于朋，\n曾似春光漫。\n笑语盈盈风物暖，\n而今音讯如丝断。 ​​​", "date": "2021.12.25", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4718209921714298 - 蝶恋花 小聚有感/01.jpg"]}, {"id": "4718577171038669", "title": "南乡子·缅怀主席", "genre": "南乡子", "body": "己正影难歪，\n挥手清除玉宇埃。\n倾力为民宵继日。\n奇哉，\n千古神州万世才。\n身后亿人怀，\n历久情深滚滚来。\n最是预言今俱应。\n明白，\n野寇狼心岂用猜！ ​​​", "date": "2021.12.26", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4718577171038669 - 南乡子  缅怀主席/01.jpg"]}, {"id": "4718934945432499", "title": "七绝·敬颂主席", "genre": "七绝", "body": "一.\n百姓心中一杆秤，\n可量千古山河重。\n东方红日熠神州，\n激荡情怀波浪涌。\n二.\n日耀东方万里霞，\n贫家敝户亦生花。\n阳光温暖禾苗壮，\n葱郁芳馨紫气佳。 ​​​", "date": "2021.12.27", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4718934945432499 - 七绝   敬颂主席/01.jpg"]}, {"id": "4719294615128954", "title": "菩萨蛮·冬练有感", "genre": "菩萨蛮", "body": "寒天欲晓驱残月，\n北风刺面穿心彻。\n街上路人稀，\n啼鸦荡柳枝。\n常年晨练早，\n自是忧烦少。\n安稳度平生，\n萦怀父老情。 ​​​", "date": "2021.12.28", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4719294615128954 - 菩萨蛮  冬练有感/01.jpg"]}, {"id": "4719661872579394", "title": "踏莎行·雪藻兰襟韵飞扬", "genre": "踏莎行", "body": "玉女飞歌，\n琼楼漫韵。\n芳音宛转心头润。\n丝丝缕缕总萦回，\n魂追梦绕情难尽。\n曲赋悠扬，\n诗词激奋。\n临屏怎不神思振。\n唐风宋雨妙无穷，\n摘星揽月凭谁问。 ​​​", "date": "2021.12.29", "themes": ["羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4719661872579394 - 踏莎行 雪藻兰襟韵飞扬/01.jpg"]}, {"id": "4720022436184398", "title": "七绝·冬日吟", "genre": "七绝", "body": "飞雪深情唤早春，\n年关将近念朋亲。\n寒窗灯下一杯酒，\n梦里相逢尽故人。 ​​​", "date": "2021.12.30", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4720022436184398 - 七绝       冬日吟/01.jpg"]}, {"id": "4720384891160872", "title": "清平乐·望长安", "genre": "清平乐", "body": "古都蒙难，\n百姓心怀乱。\n情似去年追武汉，\n却是从容应战。\n鼓楼雁塔清清，\n街头白色流行。\n鸟雀盘旋纳闷，\n犹期人跃笙鸣。 ​​​", "date": "2021.12.31", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4720384891160872 - 清平乐    望长安/01.jpg", "冰雪诗词_全部图片/4720384891160872 - 清平乐    望长安/02.jpg", "冰雪诗词_全部图片/4720384891160872 - 清平乐    望长安/03.jpg", "冰雪诗词_全部图片/4720384891160872 - 清平乐    望长安/04.jpg"]}, {"id": "4720748092721453", "title": "苏幕遮·元旦", "genre": "苏幕遮", "body": "晓晖明，心底暖。\n伫立楼台，眺望云空远。\n遥想天和帆翼展，\n宇外英雄，笑把神州看。\n壮山河，霞色漫。\n塞北江南，遍地红旗卷。\n楼若繁星光璀璨。\n万众豪情，劲舞欢歌赞。 ​​​", "date": "2022.01.01", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4720748092721453 - 苏幕遮       元旦/01.jpg"]}, {"id": "4721109305917658", "title": "喝火令·元旦升旗", "genre": "喝火令", "body": "百姓情真切，\n三军气欲吞。\n景光宏阔撼人心。\n千里冒寒相聚，\n浑是抖精神。\n广场摩肩立，\n银屏把手亲。\n万家凝目细追寻。\n晓看星残，\n晓看月西沉。\n晓看赤旗飞卷，\n映彻九州人。 ​​​", "date": "2022.01.02", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "四时风光与节气流转", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4721109305917658 - 喝火令 元旦升旗/01.jpg"]}, {"id": "4721472477857296", "title": "七绝·元旦有寄", "genre": "七绝", "body": "风云岁月入新年，\n趣味人生色彩添。\n看似无心加一笔，\n回头再望更光鲜。 ​​​", "date": "2022.01.03", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4721472477857296 - 七绝    元旦有寄/01.jpg"]}, {"id": "4721837307332598", "title": "南乡子·吟将别", "genre": "南乡子", "body": "把酒劝君留，\n将语难言泪欲流。\n家母寝行应莫念，\n毋愁。\n游走安心在外头。\n驱步几回眸，\n岂奈分离自是忧。\n父子一心都不舍，\n无由。\n别后相思怎个休。 ​​​", "date": "2022.01.04", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4721837307332598 - 南乡子    吟将别/01.jpg"]}, {"id": "4722195600769041", "title": "七绝·闻事有寄", "genre": "七绝", "body": "夫妻互敬日悠长，\n子散家离苦断肠。\n覆水难收蒸逝易，\n儿忧破镜少明光。 ​​​", "date": "2022.01.05", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4722195600769041 - 七绝   闻事有寄/01.jpg"]}, {"id": "4722561806762840", "title": "七绝·天道", "genre": "七绝", "body": "时钟周转不知愁，\n日月轮回岂用忧。\n花落花开天作主，\n人间悲乐水长流。 ​​​", "date": "2022.01.06", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4722561806762840 - 七绝           天道/01.jpg"]}, {"id": "4722920088142896", "title": "江城梅花引·五常之举", "genre": "江城梅花引", "body": "拥核大佬弄声明，\n讲和平，议和平。\n举世围观，期待宇寰宁。\n从此或消核恐怖？\n日趋稳，有谁能，\n不领情。\n领情，领情。盼执行。\n俄美中，带法英。\n或许各自，有想法，\n只怕难成。\n丑帝奸滑，\n一味耍贼聪。\n失信欺人终自毁。\n遭唾弃，愧于天，\n地不容。 ​​​", "date": "2022.01.07", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4722920088142896 - 江城梅花引  五常之举/01.jpg"]}, {"id": "4723283897879883", "title": "七绝·闻事有感", "genre": "七绝", "body": "残杨败柳不心甘，\n冬日逆风强欲欢。\n纵使枯枝追落叶，\n惘然愁寂对长天。 ​​​", "date": "2022.01.08", "themes": ["感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4723283897879883 - 七绝    闻事有感/01.jpg"]}, {"id": "4723648882280584", "title": "蝶恋花·遥望云烟", "genre": "蝶恋花", "body": "为害街头多有鬼，\n口喊民生，\n心意偏离嘴。\n内外暗通犹祸水，\n污涛恶浪谁之罪？\n相似情形相似味，\n几欲垂成，\n终是前功废。\n霹雳雷霆惩乱匪，\n有人夜梦惊天碎。 ​​​", "date": "2022.01.09", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4723648882280584 - 蝶恋花 遥望云烟/01.jpg"]}, {"id": "4724013034636342", "title": "诉衷情·腊日", "genre": "诉衷情", "body": "乖孙初试腊香粥，\n八宝润娇喉。\n欢情笑染双靥，\n灵动闪清眸。\n盛一碗，\n粒无留，\n再三求。\n手招头晃，\n舌卷朱唇，\n玉口涎流。 ​​​", "date": "2022.01.10", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4724013034636342 - 诉衷情        腊日/01.jpg"]}, {"id": "4724369592682953", "title": "蝶恋花·客访未成", "genre": "蝶恋花", "body": "中午时分铃作响，\n投箸倾听，\n一霎心神荡。\n故友失联今欲访，\n寻声旧事凭浮想。\n意外忽来难细讲，\n车至途中，\n怎奈遥相望。\n同在京城桥路傍，\n欣期日后交如往。 ​​​", "date": "2022.01.11", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4724369592682953 - 蝶恋花 客访未成/01.jpg"]}, {"id": "4724732693840443", "title": "减字木兰花·悟", "genre": "减字木兰花", "body": "天宽地厚，\n江海横流峰岭瘦。\n岁月悠长，\n万古星辰几色光。\n人来人往，\n风起云生花绽放。\n尘世悲欢，\n尽在情思物欲间。 ​​​", "date": "2022.01.12", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4724732693840443 - 减字木兰花   悟/01.jpg"]}, {"id": "4725095706134822", "title": "七绝·辛丑冬吟", "genre": "七绝", "body": "云霄不见雪花飞，\n三九时光冷色微。\n曾记去年冬至后，\n嘶天裂地朔风吹。 ​​​", "date": "2022.01.13", "themes": ["四时风光与节气流转", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4725095706134822 - 七绝    辛丑冬吟/01.jpg"]}, {"id": "4725458363224289", "title": "七绝·冬日吟望", "genre": "七绝", "body": "凭栏常羡他人好，\n行客慕君依暖阳。\n飞鸟不知深水浪，\n金鱼向往碧云翔。 ​​​", "date": "2022.01.14", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4725458363224289 - 七绝    冬日吟望/01.jpg"]}, {"id": "4725819803699338", "title": "踏莎行·众望", "genre": "踏莎行", "body": "街貌清新，\n花蓝璀璨。\n欲迎冬奥容妆换。\n新春冰上待相逢，\n五洲四海情怀远。\n宾友为欢，\n妖魔使乱。\n云烟半缕空消散。\n风行玉宇扫尘埃，\n神州万里霞光漫。 ​​​", "date": "2022.01.15", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4725819803699338 - 踏莎行      众望/01.jpg"]}, {"id": "4726185311863918", "title": "风入松·游芳园里", "genre": "风入松", "body": "携孙假日赏楼园，\n物秀光妍。\n旋梯廊道迷人眼。\n游乐处，次第相连。\n潮涌温馨老少，\n比肩亲子同欢。\n家庭微景恁齐全，\n巧手蹁跹。\n狗猫鱼兔空遥望，\n欲摩触，投币趋前。\n童稚开心一刻，\n多情长辈烧钱。 ​​​", "date": "2022.01.16", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4726185311863918 - 风入松 游芳园里/01.jpg"]}, {"id": "4726546545772276", "title": "菩萨蛮·岁暮吟", "genre": "菩萨蛮", "body": "流年似水依涛去，\n潮生潮落长如许。\n踏浪舞人生，\n倚帆江海行。\n仰天观日月，\n回首风摇叶。\n淡看世间情，\n心闲梦亦宁。 ​​​", "date": "2022.01.17", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4726546545772276 - 菩萨蛮   岁暮吟/01.jpg"]}, {"id": "4726906618120744", "title": "七绝·月圆吟", "genre": "七绝", "body": "寻常腊月日趋欢，\n明月中天喜近年。\n今夜清蟾辉照旧，\n疫情无奈隐心酸。 ​​​", "date": "2022.01.18", "themes": ["家国情怀与时代歌咏", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4726906618120744 - 七绝       月圆吟/01.jpg"]}, {"id": "4727269430135499", "title": "太常引·天灾叵测", "genre": "太常引", "body": "火山云漫蔽长空，\n海啸卷洲城。\n一霎宇寰惊。\n胜核弹，余威不穷。\n浮尘遮日，\n数年难散，\n夏季少凉风。\n无奈是苍生。\n岛湮没，悲催泪零。 ​​​", "date": "2022.01.19", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4727269430135499 - 太常引 天灾叵测/01.jpg", "冰雪诗词_全部图片/4727269430135499 - 太常引 天灾叵测/02.jpg"]}, {"id": "4727636213366795", "title": "朝中措·时令吟", "genre": "朝中措", "body": "大寒飞雪舞京都，\n花影树间无。\n但见栖鸦瑟瑟，\n啼声凄断飘乎。\n年关将近，\n疫情突起，\n心意难舒。\n举首家乡遥望，\n谁知绪乱情孤。 ​​​", "date": "2022.01.20", "themes": ["家国情怀与时代歌咏", "四时风光与节气流转", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4727636213366795 - 朝中措    时令吟/01.jpg"]}, {"id": "4727993681838729", "title": "鹧鸪天·同床异梦", "genre": "鹧鸪天", "body": "四九听风彻夜寒，\n孙娃栖侧久深眠。\n满床翻转舒心梦，\n双脚伸勾浅靥圆。\n挥玉手，抖香肩。\n暖身锦被乱朝天。\n晓来稚脸眉梢乐，\n老眼飞星头欲旋。 ​​​", "date": "2022.01.21", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4727993681838729 - 鹧鸪天 同床异梦/01.jpg"]}, {"id": "4728359454509004", "title": "菩萨蛮·望", "genre": "菩萨蛮", "body": "疫情阻断归乡路，\n情牵父子心头堵。\n京洛望廉州，\n天寒两处忧。\n家亲尊二老，\n年货筹谋早。\n闻讯略心宽，\n迎春向虎年。 ​​​", "date": "2022.01.22", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4728359454509004 - 菩萨蛮       望/01.jpg"]}, {"id": "4728721607232382", "title": "鹧鸪天·雪映京都", "genre": "鹧鸪天", "body": "细玉盈空鸟雀寒，\n梨花满树冷晖妍。\n红灯漫舞迎祥瑞，\n银粟婆娑入虎年。\n童子乐，雪人憨。\n琼英着处尽情喧。\n寻常学业心头苦，\n天赋今朝怎不欢。 ​​​", "date": "2022.01.23", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4728721607232382 - 鹧鸪天 雪映京都/01.jpg", "冰雪诗词_全部图片/4728721607232382 - 鹧鸪天 雪映京都/02.jpg", "冰雪诗词_全部图片/4728721607232382 - 鹧鸪天 雪映京都/03.jpg"]}, {"id": "4729086038245945", "title": "七绝·闲吟", "genre": "七绝", "body": "莫问人生寿短长，\n心宽骨硬自风光。\n樽前潇洒山川醉，\n日月盈怀一缕阳。 ​​​", "date": "2022.01.24", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4729086038245945 - 七绝          闲吟/01.jpg"]}, {"id": "4729448878575079", "title": "五绝·小年吟", "genre": "五绝", "body": "物丰情趣淡，\n心气不如初。\n鬓染风霜色，\n梦魂何所图。 ​​​", "date": "2022.01.25", "themes": ["四时风光与节气流转", "羁旅思乡与行吟纪游", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4729448878575079 - ​五绝 小年吟/01.jpg"]}, {"id": "4729805804930710", "title": "七绝·岁暮吟", "genre": "七绝", "body": "虎近新年雪洗尘，\n银妆门户俏迎春。\n红梅一簇窗前闹，\n满院生辉喜照人。 ​​​", "date": "2022.01.26", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4729805804930710 - 七绝       岁暮吟/01.jpg"]}, {"id": "4730170327962084", "title": "太常引·望乡", "genre": "太常引", "body": "乡情似酒漫年关，\n醇烈殢樽前。\n便醉亦难眠。\n夜光下，\n人浮事缠。\n少时光景，\n小门深院。\n恋物绪蹁跹，\n最忆是家山。\n恰岁杪、相思万千。 ​​​", "date": "2022.01.27", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4730170327962084 - 太常引         望乡/01.jpg"]}, {"id": "4730531374435059", "title": "七绝·F35坠南海", "genre": "七绝", "body": "彼岸尘烟暗水空，\n风云诡异怒涛生。\n黑鹰无奈失魂坠，\n别样浪花鱼鸟惊。 ​​​", "date": "2022.01.28", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4730531374435059 - 七绝 F35坠南海/01.jpg"]}, {"id": "4730894898169711", "title": "朝中措·寄思", "genre": "朝中措", "body": "老爹疑病夜难安，\n坐卧自心烦。\n总是思亲念旧，\n替人悲地愁天。\n吾身在外，\n疫情难返，\n俩妹趋前。\n万苦养儿育女，\n耆年福寿如山。 ​​​", "date": "2022.01.29", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4730894898169711 - 朝中措       寄思/01.jpg"]}, {"id": "4731265104742355", "title": "七绝·股市瞭望", "genre": "七绝", "body": "深绿微红一丑牛，\n年关羞愧不抬头。\n伏身或为迎寅虎，\n期许腾空啸九州。 ​​​", "date": "2022.01.30", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4731265104742355 - 七绝    股市瞭望/01.jpg"]}, {"id": "4731823106827648", "title": "七绝·除夕", "genre": "七绝", "body": "盈樽守岁夜分年，\n五彩银屏万户欢。\n歌舞迎春寅虎啸，\n转天喜看九州妍。\n祝大家虎年快乐\n吉祥！！！ ​​​", "date": "2022.01.31", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4731823106827648 - 七绝           除夕/01.jpg"]}, {"id": "4731983194227271", "title": "朝中措·别样祝福", "genre": "朝中措", "body": "天宫虎啸贺新春，\n激荡亿人心。\n寰宇英雄笑貌，\n今朝分外相亲。\n一元复始，\n万家欢乐，\n天地温馨。\n寒气消春日胜，\n九州四海缤纷。\n祝大家虎年吉\n祥欢乐！[玫瑰][玫瑰][玫瑰] ​​​", "date": "2022.02.01", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4731983194227271 - 朝中措 别样祝福/01.jpg"]}, {"id": "4732374988622398", "title": "蝶恋花·新年乐", "genre": "蝶恋花", "body": "精美红包情意表，\n压岁迎春，\n惟愿孙娃好。\n稚脸娇甜频浅笑，\n轻盈眉眼舒心貌。\n刚满一周身段俏，\n胜日来临，\n手舞花灯闹。\n慨叹去年怀里宝，\n今朝无碍穿堂跑。 ​​​", "date": "2022.02.02", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4732374988622398 - 蝶恋花    新年乐/01.jpg"]}, {"id": "4732715633215821", "title": "七绝·新年感怀", "genre": "七绝", "body": "岁月无言奏阕章，\n人生百态韵悠长。\n波涛依旧东流去，\n梅雪迎春绿染香。 ​​​", "date": "2022.02.03", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4732715633215821 - 七绝    新年感怀/01.jpg"]}, {"id": "4733068730173726", "title": "五律·赠师友", "genre": "五律", "body": "石门曾共事，\n京邑又相逢。\n天冷心头暖，\n茗香齿底浓。\n慢言传妙理，\n浅盏蕴深情。\n漫漫人生路，\n儿怀渐次明。 ​​​", "date": "2022.02.04", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4733068730173726 - ​五律 赠师友/01.jpg"]}, {"id": "4733434016563300", "title": "五律·抒怀", "genre": "五律", "body": "春回冬奥秀，\n胜友远方来。\n壁垒连番破，\n心胸次第开。\n京张飞雪处，\n旌旆舞云台。\n风卷欢声浪，\n英雄醉染怀。 ​​​", "date": "2022.02.05", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4733434016563300 - 五律    抒怀/01.jpg", "冰雪诗词_全部图片/4733434016563300 - 五律    抒怀/02.jpg", "冰雪诗词_全部图片/4733434016563300 - 五律    抒怀/03.jpg"]}, {"id": "4733799000704429", "title": "蝶恋花·一起向未来", "genre": "蝶恋花", "body": "片片雪花萦火炬，\n国号清新，冉冉辉光煦。\n冬奥五环连广宇，\n相思相望今朝聚。\n滑雪溜冰君且去，\n各展风姿，飒爽骄儿女。\n圆梦神州情自许，\n鸟巢惊艳舒心绪。 ​​​", "date": "2022.02.06", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4733799000704429 - 蝶恋花      一起向未来/01.jpg", "冰雪诗词_全部图片/4733799000704429 - 蝶恋花      一起向未来/02.jpg"]}, {"id": "4734163209420832", "title": "蝶恋花·女足夺冠有感", "genre": "蝶恋花", "body": "男女足球天与地，\n万丈之差，或在精神气。\n短发娇颜拼勇智，\n油头浪子无心意。\n对待粉丝情态异，\n善策良言，能否融怀里。\n非是金钱成大事，\n惟期革面凝心志。 ​​​", "date": "2022.02.07", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4734163209420832 - 蝶恋花    女足夺冠有感/01.jpg"]}, {"id": "4734520177460334", "title": "七绝·童真", "genre": "七绝", "body": "虎娃高唱鸟巢惊，\n一缕清新华夏风。\n山里纯真呼远客，\n童音迢递九州情。 ​​​", "date": "2022.02.08", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4734520177460334 - 七绝           童真/01.jpg"]}, {"id": "4734881677181302", "title": "蝶恋花·逐梦", "genre": "蝶恋花", "body": "顾盼新年年过了，\n转眼春来，又见人行早。\n追梦逐天抛父老，\n心中景色知多少。\n南北穿梭如雀鸟，\n不畏风寒，日暮栖枝杪。\n冷气袭来惊梦晓，\n争飞振羽云空渺。 ​​​", "date": "2022.02.09", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4734881677181302 - 蝶恋花       逐梦/01.jpg"]}, {"id": "4735245448905205", "title": "蝶恋花·冬奥趣", "genre": "蝶恋花", "body": "萌俏冰墩诚可爱，\n眉眼情浓，一副娇憨态。\n自是吉祥添异彩，\n怎能不被人青睐。\n一个难求堪奥赛，\n百计千方，且为儿孙带。\n更有佳宾来域外，\n还乡生怕亲朋怪。 ​​​", "date": "2022.02.10", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4735245448905205 - 蝶恋花           冬奥趣/01.jpg", "冰雪诗词_全部图片/4735245448905205 - 蝶恋花           冬奥趣/02.jpg", "冰雪诗词_全部图片/4735245448905205 - 蝶恋花           冬奥趣/03.jpg"]}, {"id": "4735606603122579", "title": "采桑子·冠军随想", "genre": "采桑子", "body": "功成岂有寻常事。\n不立恒心，\n不付千辛，\n铁杵无缘作绣针。\n羡人励己从今日。\n俯首凝神，\n寸土耕耘，\n终会花香万里春。 ​​​", "date": "2022.02.11", "themes": ["家国情怀与时代歌咏"], "images": ["冰雪诗词_全部图片/4735606603122579 - 采桑子 冠军随想/01.jpg"]}, {"id": "4735967568856850", "title": "七绝·岁初闲吟", "genre": "七绝", "body": "年来玉虎啸春风，\n放眼五洲谁与同。\n无奈躺平浑不醒，\n新冠难问是归程。 ​​​", "date": "2022.02.12", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4735967568856850 - 七绝    岁初闲吟/01.jpg"]}, {"id": "4736328786773302", "title": "浣溪沙·叹春雪", "genre": "浣溪沙", "body": "春晓风寒玉粟飞，\n空庭晨练冷潮摧。\n枝鸦瑟瑟泣声微。\n残雪刚溶冰又厚，\n东君欲放蕊还悲。\n云空何日映新辉？ ​​​", "date": "2022.02.13", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4736328786773302 - 浣溪沙    叹春雪/01.jpg"]}, {"id": "4736691288149059", "title": "庆春泽·月将圆", "genre": "庆春泽", "body": "楼角红灯相映，交火树银花，宿鸦难定。天暮谢余辉，霄寒云冷。月夜朦胧，玉台泛清影。\n新年气色犹胜，娇孙女情浓，颜欢随性。常甚喜于怀，凭栏观景，手舞眉扬，靥甜笑声永。 ​​​", "date": "2022.02.14", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4736691288149059 - 庆春泽        月将圆/01.jpg", "冰雪诗词_全部图片/4736691288149059 - 庆春泽        月将圆/02.jpg"]}, {"id": "4737054337925990", "title": "太常引·元宵吟", "genre": "太常引", "body": "虎年遭遇倒春寒，\n雪地映苍天。\n风起卷青烟。\n更蟾冷，\n姮娥喟然。\n花灯寂寞，\n鱼龙慨叹。\n倩女俊郎烦，\n苦向柳梢看。\n共期许，\n悠悠梦欢。 ​​​", "date": "2022.02.15", "themes": ["四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4737054337925990 - 太常引    元宵吟/01.jpg"]}, {"id": "4737417095942421", "title": "七绝·元夕", "genre": "七绝", "body": "可怜寅虎初圆月，\n雪映花灯少热情。\n巷陌匆匆行走客，\n裘裳紧裹避寒风。 ​​​", "date": "2022.02.16", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4737417095942421 - 七绝      元夕/01.jpg", "冰雪诗词_全部图片/4737417095942421 - 七绝      元夕/02.jpg"]}, {"id": "4737779899041225", "title": "七律·域外风云", "genre": "七律", "body": "烟笼俄乌看客多，\n心怀各色起秧歌。\n一声锣鼓媒婆跳，\n数列幡旗醉汉说。\n乱舞刀枪夸友善，\n巧言生死搅山河。\n终究闪电能来否，\n谁道雷公忍几何。 ​​​", "date": "2022.02.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4737779899041225 - 七律   域外风云/01.jpg"]}, {"id": "4738142772920914", "title": "蝶恋花·好客神州", "genre": "蝶恋花", "body": "京北春寒冬奥热，\n飞雪凌空，帅酷骄姿落。\n冰上轻盈情脉脉，\n晶台频闪金银色。\n各路英豪皆忘我，\n语暖言周，处处情如火。\n赛事无忧心不忑，\n泪眸回首神难舍。 ​​​", "date": "2022.02.18", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4738142772920914 - 蝶恋花       好客神州/01.jpg"]}, {"id": "4738510785872192", "title": "踏莎行·爱凌飞渡", "genre": "踏莎行", "body": "多少艰辛，\n高低飞越。\n钟情万岭千山雪。\n非常苦乐溢云空，\n无穷信念溶心血。\n往日之功，\n今朝一跃。\n人惊鸟啭欢声烈。\n梦中夙愿映神州，\n青春无悔鸣新阕。 ​​​", "date": "2022.02.19", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4738510785872192 - 踏莎行 爱凌飞渡/01.jpg", "冰雪诗词_全部图片/4738510785872192 - 踏莎行 爱凌飞渡/02.jpg", "冰雪诗词_全部图片/4738510785872192 - 踏莎行 爱凌飞渡/03.jpg"]}, {"id": "4738872506056830", "title": "五绝·远行", "genre": "五绝", "body": "京都寒欲尽，\n却向冷疆行。\n携手孙娃去，\n缘圆母女情。 ​​​", "date": "2022.02.20", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4738872506056830 - 五绝    远行/01.jpg"]}, {"id": "4739228909440862", "title": "踏莎行·难忘北京", "genre": "踏莎行", "body": "精彩绝伦，\n欢声雷动。\n赤蓝光色辉相映。\n折杨赠柳话今朝，\n依依不舍心潮涌。\n双奥之城，\n万家称颂。\n不分中外情思共。\n五洲携手未来寻，\n更高更快齐追梦。 ​​​", "date": "2022.02.21", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4739228909440862 - 踏莎行 难忘北京/01.jpg", "冰雪诗词_全部图片/4739228909440862 - 踏莎行 难忘北京/02.jpg", "冰雪诗词_全部图片/4739228909440862 - 踏莎行 难忘北京/03.jpg", "冰雪诗词_全部图片/4739228909440862 - 踏莎行 难忘北京/04.jpg"]}, {"id": "4739592273788967", "title": "朝中措·孙女乘机", "genre": "朝中措", "body": "飞行初次不觉生，\n玩乐在云空。\n昂首前张后望，\n与人满目春风。\n吱呀乱语，\n开心手舞，\n稚脸轻盈。\n最是平安落地，\n新奇无限频惊。 ​​​", "date": "2022.02.22", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4739592273788967 - 朝中措 孙女乘机/01.jpg"]}, {"id": "4739957035369123", "title": "踏莎行·迷向", "genre": "踏莎行", "body": "南北门翻，\n东西墙换。\n初来乍到神思乱。\n定睛日月绪微清，\n转头几案违心愿。\n睡后无忧，\n醒来总眩。\n脑中自斗天昏暗。\n何如故里旧蓬窗，\n不分宵昼星光灿。 ​​​", "date": "2022.02.23", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4739957035369123 - 踏莎行       迷向/01.jpg"]}, {"id": "4740315267990164", "title": "太常引·边关闲问", "genre": "太常引", "body": "鬓霜谁料尚西行，\n春日到边城。\n残雪未消溶。\n冷潮甚，\n丝丝北风。\n轻尘薄雾，\n云烟缭绕，\n不似旧心情。\n何日絮飞萦，\n花草翠，\n亭台暖晴。 ​​​", "date": "2022.02.24", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4740315267990164 - 太常引 边关闲问/01.jpg"]}, {"id": "4740679052298396", "title": "七绝·悲叹", "genre": "七绝", "body": "头领跳梁如演戏，\n可怜百姓街头泣。\n蚍蜉撼树耍聪明，\n一阵风来难自立。 ​​​", "date": "2022.02.25", "themes": ["感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4740679052298396 - ​七绝           悲叹/01.jpg"]}, {"id": "4741039376564503", "title": "七绝·边城吟", "genre": "七绝", "body": "昔时荒漠无毛地，\n今日高楼连片立。\n回汉炊烟袅碧空，\n闲庭鸟雀欢情溢。 ​​​", "date": "2022.02.26", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4741039376564503 - 七绝       边城吟/01.jpg", "冰雪诗词_全部图片/4741039376564503 - 七绝       边城吟/02.jpg"]}, {"id": "4741402250707693", "title": "朝中措·西域风色", "genre": "朝中措", "body": "边城初逛大巴扎，\n春日碧云霞。\n丝路风光荟萃，\n葡萄美酒人夸。\n香馕烤肉，\n豹裘皮帽，\n茶奶梨瓜。\n农牧交融于此，\n新疆故土繁华。 ​​​", "date": "2022.02.27", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4741402250707693 - 朝中措 西域风色/01.jpg", "冰雪诗词_全部图片/4741402250707693 - 朝中措 西域风色/02.jpg", "冰雪诗词_全部图片/4741402250707693 - 朝中措 西域风色/03.jpg", "冰雪诗词_全部图片/4741402250707693 - 朝中措 西域风色/04.jpg", "冰雪诗词_全部图片/4741402250707693 - 朝中措 西域风色/05.jpg", "冰雪诗词_全部图片/4741402250707693 - 朝中措 西域风色/06.jpg"]}, {"id": "4741765401151732", "title": "菩萨蛮·迪化灯会", "genre": "菩萨蛮", "body": "春宵梦幻如仙境，\n冰灯火树霓虹影。\n玉虎啸寒空，\n金牛卧雪中。\n银星天璀璨，\n华夜嫦娥叹。\n应悔一时贪，\n无缘尘世欢。 ​​​", "date": "2022.02.28", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4741765401151732 - 菩萨蛮 迪化灯会/01.jpg", "冰雪诗词_全部图片/4741765401151732 - 菩萨蛮 迪化灯会/02.jpg", "冰雪诗词_全部图片/4741765401151732 - 菩萨蛮 迪化灯会/03.jpg", "冰雪诗词_全部图片/4741765401151732 - 菩萨蛮 迪化灯会/04.jpg", "冰雪诗词_全部图片/4741765401151732 - 菩萨蛮 迪化灯会/05.jpg", "冰雪诗词_全部图片/4741765401151732 - 菩萨蛮 迪化灯会/06.jpg"]}, {"id": "4742125868549798", "title": "七绝·随感", "genre": "七绝", "body": "因果相随尘世间，\n识人辨事莫心偏。\n周思慎语云空阔，\n独处纵游天地宽。 ​​​", "date": "2022.03.01", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4742125868549798 - 七绝           随感/01.jpg"]}, {"id": "4742491838089793", "title": "五律·咏新疆", "genre": "五律", "body": "昔时边塞苦，\n今日酒花香。\n喜见楼林立，\n欣闻鸟啭长。\n牛羊芳草地，\n巷陌丽云光。\n放眼天山秀，\n伊梨水润疆。 ​​​", "date": "2022.03.02", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4742491838089793 - 五律 咏新疆/01.jpg"]}, {"id": "4742854829674393", "title": "五律·边城吟", "genre": "五律", "body": "故乡天已暮，\n此地日高悬。\n相距八千里，\n飞来一瞬间。\n春风还未至，\n残雪尚依然。\n不见东君影，\n百花谁敢言。 ​​​", "date": "2022.03.03", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4742854829674393 - 五律 边城吟/01.jpg"]}, {"id": "4743213958562311", "title": "七绝·龙抬头", "genre": "七绝", "body": "神龙昂首傲长天，\n日月远迎霄汉间。\n俯瞰九州山水秀，\n烟霞袅袅百花妍。 ​​​", "date": "2022.03.04", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4743213958562311 - 七绝        龙抬头/01.jpg"]}, {"id": "4743577521356950", "title": "朝中措·闲看风云", "genre": "朝中措", "body": "一番操作世人惊，\n呆看假文明。\n封你自由言论，\n钱财落己囊中。\n何来公理，\n诸君莫问，\n霜道无穷。\n虚伪天花乱坠，\n野林谁敢不从。 ​​​", "date": "2022.03.05", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4743577521356950 - 朝中措 闲看风云/01.jpg"]}, {"id": "4743938978349278", "title": "清平乐·春日感怀", "genre": "清平乐", "body": "盲人点火，\n炬焰花中卧。\n残奥迎春情脉脉，\n期待英姿硕果。\n欣逢两会齐开，\n悠悠紫气东来。\n华夏云空晴丽，\n巨龙昂首舒怀。 ​​​", "date": "2022.03.06", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4743938978349278 - ​清平乐 春日感怀/01.jpg"]}, {"id": "4744322002716166", "title": "七绝·闲思", "genre": "七绝", "body": "众人多角感烟云，\n凉热自知凭本心。\n莫道他言非我意，\n实情未必己为真。 ​​​", "date": "2022.03.07", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4744322002716166 - 七绝          闲思/01.jpg"]}, {"id": "4744662709699827", "title": "朝中措·新女性", "genre": "朝中措", "body": "寻常浅靥黛眉长，\n今日更悠扬。\n自信人生满满，\n茫茫尘世流芳。\n门厅内外，\n持家执业，\n妙手留香。\n无愧青天半面，\n宛如闪闪星光。 ​​​", "date": "2022.03.08", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4744662709699827 - 朝中措    新女性/01.jpg"]}, {"id": "4745022711531006", "title": "太常引·边地初春", "genre": "太常引", "body": "背阴残雪渐消融，\n晨晓起春风。\n阳处草初青。\n见枝鸟，\n柔音嫩声。\n长裘辞退，\n棉靴别后，\n顿感意轻松。\n闲望碧云空，\n纸鸢闹，\n争翔趣浓。 ​​​", "date": "2022.03.09", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4745022711531006 - 太常引 边地初春/01.jpg"]}, {"id": "4745384805269856", "title": "朝中措·遥念", "genre": "朝中措", "body": "边城初到故人稀，\n夜里费神思。\n总把双亲梦念，\n苍颜斑鬓飞丝。\n隔天通话，\n情传千里，\n语暖心池。\n更喜春回老院，\n厅堂一派生机。 ​​​", "date": "2022.03.10", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4745384805269856 - 朝中措        遥念/01.jpg"]}, {"id": "4745747713230552", "title": "七绝·边城初春", "genre": "七绝", "body": "草芽嫩色有还无，\n莺燕初飞细语酥。\n仰面舒怀心欲醉，\n云霄深处舞宏图。 ​​​", "date": "2022.03.11", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4745747713230552 - 七绝    边城初春/01.jpg"]}, {"id": "4746112159975637", "title": "踏莎行·世事有感", "genre": "踏莎行", "body": "真假难分，\n言行各异。\n丛林难讲公平理。\n豺狼当道乱无穷，\n良人多有烦心事。\n宇宙风云，\n尘间非是。\n阴阳两面常交替。\n凭栏远望绪难安，\n强身之外无他计。 ​​​", "date": "2022.03.12", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4746112159975637 - 踏莎行 世事有感/01.jpg", "冰雪诗词_全部图片/4746112159975637 - 踏莎行 世事有感/02.jpg", "冰雪诗词_全部图片/4746112159975637 - 踏莎行 世事有感/03.jpg", "冰雪诗词_全部图片/4746112159975637 - 踏莎行 世事有感/04.jpg"]}, {"id": "4746475677155821", "title": "鹧鸪天·观屏有感", "genre": "鹧鸪天", "body": "遥望银滩，\n梦思兄弟。\n海都花苑盈春气。\n南腔北调客相逢，\n东拉西扯心无忌。\n丽水人家，\n乳山福地。\n蝶飞莺舞云霞丽。\n隔空万里百花香，\n海鲜风味凭栏忆。 ​​​", "date": "2022.03.13", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4746475677155821 - 鹧鸪天 观屏有感/01.jpg", "冰雪诗词_全部图片/4746475677155821 - 鹧鸪天 观屏有感/02.jpg"]}, {"id": "4746836541441161", "title": "五律·边城眺望", "genre": "五律", "body": "昔日天山远，\n今朝映眼前。\n东西峰岭秀，\n日月照清寒。\n畅想瑶池景，\n盛传卧雪莲。\n风光独到处，\n王母宴群仙。 ​​​", "date": "2022.03.14", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4746836541441161 - 五律 边城眺望/01.jpg", "冰雪诗词_全部图片/4746836541441161 - 五律 边城眺望/02.jpg"]}, {"id": "4747200650020930", "title": "朝中措·宇宙风云", "genre": "朝中措", "body": "狼烟漫卷暗尘寰，\n蔽日苦难言。\n谁点干柴烈火，\n奈何魔鬼摇幡。\n丛林豺豹，\n恃强凌弱，\n为霸多端。\n呼唤武松打虎，\n景阳山静人安。 ​​​", "date": "2022.03.15", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4747200650020930 - 朝中措 宇宙风云/01.jpg"]}, {"id": "4747562206891131", "title": "太常引·孙女逛街", "genre": "太常引", "body": "频挥小手路人欢，\n灵气溢眉间，\n稚脸靥娇圆。\n嫩声语，\n摇身向前。\n不时张望，\n同龄拥抱，\n闹处喜流连。\n过客扭头看，\n惊赞许，\n回身笑言。 ​​​", "date": "2022.03.16", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4747562206891131 - 太常引 孙女逛街/01.jpg", "冰雪诗词_全部图片/4747562206891131 - 太常引 孙女逛街/02.jpg", "冰雪诗词_全部图片/4747562206891131 - 太常引 孙女逛街/03.jpg"]}, {"id": "4747925210793440", "title": "七绝·罗马交锋", "genre": "七绝", "body": "​手翻云雨渐失灵，\n怎耐东方有巨龙。\n鹿马混淆天下乱，\n一朝人破世难容。 ​​​", "date": "2022.03.17", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4747925210793440 - 七绝   罗马交锋/01.jpg"]}, {"id": "4748287771673117", "title": "七绝·吟望", "genre": "七绝", "body": "三月边城未见花，\n枝头残叶映人家。\n天涯路远春风怨，\n便是迟来莫怪她。 ​​​", "date": "2022.03.18", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4748287771673117 - ​七绝           吟望/01.jpg"]}, {"id": "4748652042782199", "title": "七绝·倒春寒", "genre": "七绝", "body": "劲风吹却初阳暖，\n雨雪袭来冷画栏。\n雾浪云涛天欲暮，\n树梢孤雀与谁言。 ​​​", "date": "2022.03.19", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4748652042782199 - ​七绝       倒春寒/01.jpg", "冰雪诗词_全部图片/4748652042782199 - ​七绝       倒春寒/02.jpg"]}, {"id": "4749011238783888", "title": "踏莎行·寰宇吟望", "genre": "踏莎行", "body": "邻里失和，\n贼人拱火。\n手摇蒲扇情怀恶。\n斜眉歪嘴映私心，\n黑白颠倒遮非过。\n谎语花言，\n拉帮结伙。\n虚声造势分敌我。\n不嫌事大搅浑天，\n呼云蔽日终遭唾。 ​​​", "date": "2022.03.20", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4749011238783888 - 踏莎行 寰宇吟望/01.jpg"]}, {"id": "4749373869391918", "title": "浣溪沙·观屏有感", "genre": "浣溪沙", "body": "论事抒怀各自言，\n争鸣心态且从宽。\n抬头遥望共云天。\n日月轮回恒有道，\n星辰明灭瞬时间。\n人生谁可越千年。 ​​​", "date": "2022.03.21", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4749373869391918 - 浣溪沙 观屏有感/01.jpg"]}, {"id": "4749736605647764", "title": "朝中措·悼空难同胞", "genre": "朝中措", "body": "银鹰折翅九州悲，\n多少泪花飞。\n春日晴天霹雳，\n寒风漫卷惊雷。\n痛心无限，\n凝眸回首，\n逝者难追。\n生命从来无价，\n寻常珍重休违。 ​​​", "date": "2022.03.22", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4749736605647764 - 朝中措 悼空难同胞/01.jpg"]}, {"id": "4750098766758653", "title": "七律·随感", "genre": "七律", "body": "舆情时事静思观，\n遥望方能透远山。\n莫信他人酸辣语，\n且凭自己悟辛甘。\n是非总会明天下，\n真假终究映眼前。\n别有用心今者众，\n多从域外起谣言。 ​​​", "date": "2022.03.23", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4750098766758653 - 七律           随感/01.jpg"]}, {"id": "4750459849933189", "title": "五律·边城春雪", "genre": "五律", "body": "楼高气色深，\n银粟覆芳茵。\n曲径人稀少，\n华亭隐鸟痕。\n寻常童稚闹，\n今日断清音。\n春院花无影，\n庭失草木魂。 ​​​", "date": "2022.03.24", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4750459849933189 - ​五律 边城春雪/01.jpg"]}, {"id": "4750823038649873", "title": "南乡子·空难寄怀", "genre": "南乡子", "body": "近日暗伤神，\n遥望搜寻欲断魂。\n荒岭野原将踏遍，\n寒心，\n残片凄凄不见人。\n风雨卷乌云，\n万里家亲泪眼深。\n以为寻常别又聚，\n难吞，\n此后阴阳两处分。 ​​​", "date": "2022.03.25", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4750823038649873 - 南乡子 空难寄怀/01.jpg"]}, {"id": "4751190451555598", "title": "减字木兰花·丛林乱象", "genre": "减字木兰花", "body": "妖魔共舞，\n尘世人间能不苦。\n暮打朝拉，\n为利食言最数它。\n横行欺霸，\n怎奈神龙浑不怕。\n妄想独尊，\n日渐西山气色沉。 ​​​", "date": "2022.03.26", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4751190451555598 - 减字木兰花 丛林乱象/01.jpg"]}, {"id": "4751548586394309", "title": "七绝·赏玉随感", "genre": "七绝", "body": "宝石翡翠夺人目，\n圆润晶莹闪异光。\n璧玉深藏凭慧眼，\n可怜和氏久悲伤。 ​​​", "date": "2022.03.27", "themes": ["感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4751548586394309 - 七绝   赏玉随感/01.jpg", "冰雪诗词_全部图片/4751548586394309 - 七绝   赏玉随感/02.jpg", "冰雪诗词_全部图片/4751548586394309 - 七绝   赏玉随感/03.jpg"]}, {"id": "4751910336464697", "title": "太常引·迪化初雨", "genre": "太常引", "body": "廉纤丝雨润边城，\n暮色掩春情。\n宵夜静无声。\n月西坠，\n天晴梦惊。\n阶前草嫩，\n泥虫渐醒，\n树杪舞啼莺。\n拂面晓风轻。\n还几日，\n繁花竞明？ ​​​", "date": "2022.03.28", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4751910336464697 - 太常引 迪化初雨/01.jpg"]}, {"id": "4752273772642628", "title": "七绝·闻事闲吟", "genre": "七绝", "body": "覆水难收自古今，\n恶言相向冷人心。\n一时口快终生恨，\n遇事三思巧作君。 ​​​", "date": "2022.03.29", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4752273772642628 - 七绝   闻事闲吟/01.jpg"]}, {"id": "4752633941986253", "title": "采桑子·春日有约", "genre": "采桑子", "body": "故人招我樽前聚。\n千里传声，\n一片深情。\n意绪欣然却不能。\n且凭鸿雁凌空去。\n人在边城，\n思念无穷。\n日后还乡醉五更。 ​​​", "date": "2022.03.30", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4752633941986253 - 采桑子 春日有约/01.jpg"]}, {"id": "4752994811518302", "title": "太常引·故乡新友", "genre": "太常引", "body": "几碟小菜恁悠闲，\n谈笑望云天。\n初坐似从前。\n巧相遇，\n浮生有缘。\n同乡河北，\n情怀趋近，\n边地度流年。\n交往悦心田。\n茶胜酒，\n香浓味甘。 ​​​", "date": "2022.03.31", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4752994811518302 - 太常引 故乡新友/01.jpg"]}, {"id": "4753358785875621", "title": "七绝·闲吟", "genre": "七绝", "body": "半吊司机路跑偏，\n弃邻拜鬼怨苍天。\n不闻乘客心头苦，\n媚眼西方闯险关。 ​​​", "date": "2022.04.01", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4753358785875621 - ​七绝           闲吟/01.jpg"]}, {"id": "4753722234899018", "title": "太常引·春院一瞥", "genre": "太常引", "body": "春来童稚尽开颜。\n时聚院堂前，\n娇靥映眉欢。\n踏滑板，\n前驱后翻。\n旋梯飞舞，\n招猫戏狗，\n纤手荡秋千。\n莺燕啭枝边。\n情不尽，\n欣欣乐园。 ​​​", "date": "2022.04.02", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4753722234899018 - ​太常引 春院一瞥/01.jpg", "冰雪诗词_全部图片/4753722234899018 - ​太常引 春院一瞥/02.jpg", "冰雪诗词_全部图片/4753722234899018 - ​太常引 春院一瞥/03.jpg"]}, {"id": "4754085284417763", "title": "七律·疆塞寄思", "genre": "七律", "body": "春到清明未见花，\n边城寂落似天涯。\n枯枝残叶盈人眼，\n冷月寒星照客家。\n梦里山村桃李秀，\n乡中朋侣醉烟霞。\n上坟纸火郊原烈，\n祭祖思亲敬酒茶。 ​​​", "date": "2022.04.03", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4754085284417763 - 七律    疆塞寄思/01.jpg"]}, {"id": "4754519588078378", "title": "浣溪沙·祖孙暂别", "genre": "浣溪沙", "body": "念老还乡娃不知，\n寻常娇笑对分离。\n明眸浅靥惹人思。\n春日芳园花竞放，\n此间乖宝胜花枝。\n奈何爷奶鬓添丝。 ​​​", "date": "2022.04.04", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4754519588078378 - 浣溪沙 祖孙暂别/01.jpg", "冰雪诗词_全部图片/4754519588078378 - 浣溪沙 祖孙暂别/02.jpg", "冰雪诗词_全部图片/4754519588078378 - 浣溪沙 祖孙暂别/03.jpg", "冰雪诗词_全部图片/4754519588078378 - 浣溪沙 祖孙暂别/04.jpg"]}, {"id": "4754810845529020", "title": "七绝·清明", "genre": "七绝", "body": "辗转晨昏夜半归，\n凌空越岭促云飞。\n回乡祭祖随心愿，\n故里春风暖日晖。 ​​​", "date": "2022.04.05", "themes": ["四时风光与节气流转", "羁旅思乡与行吟纪游", "节日
