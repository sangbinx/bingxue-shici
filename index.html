const POEMS = [{"id": "4412049473977060", "title": "七绝·有思", "genre": "七绝", "body": "人间有味是清欢，\n几案书香不羡仙。\n享受孤独方为道，\n浮生寡欲尽晴天。 ​​​", "date": "2019.09.02", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4413494948081139", "title": "七绝·秋水晨钓", "genre": "七绝", "body": "晨风摇柳水云边，\n旭日红霞映碧天。\n临岸听蝉垂钓早，\n清心养气且悠闲。 ​​​", "date": "2019.09.06", "themes": ["山水田园与闲居雅趣", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4413794766012683", "title": "长相思·秋晓", "genre": "长相思", "body": "晨光明，晓风轻，\n自在白云卷碧空，\n高天万里晴。\n鸟儿鸣，果儿红，\n一夜深眠思绪清，\n平安寄此生。 ​​​", "date": "2019.09.07", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": []}, {"id": "4414237428310529", "title": "浣溪沙·白露有寄", "genre": "浣溪沙", "body": "白露滴阶黄菊开，\n青云碧水映高台。\n中秋不日又将来。\n岁月无声年过半，\n苍生有愿可舒怀？\n路途艰险莫徘徊。 ​​​", "date": "2019.09.08", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": []}, {"id": "4414549564094868", "title": "七绝·缅怀主席", "genre": "七绝", "body": "江水乱流山不动，\n顶峰灯塔照舟行。\n四十三载何曾灭，\n雾散云开万里明。 ​​​", "date": "2019.09.09", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4414549564094868 - 七绝    缅怀主席/01.jpg"]}, {"id": "4414893601973456", "title": "鹧鸪天·谢恩师", "genre": "鹧鸪天", "body": "别却恩师四秩年，\n同窗偶聚总相谈。\n课堂音貌依稀记，\n人事言行仔细传。\n今俱老，愿心欢。\n不能谋面盼身安。\n当初年少得君教，\n尘世浮生天地宽。 ​​​", "date": "2019.09.10", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": []}, {"id": "4415783251894033", "title": "浣溪沙·银滩行", "genre": "浣溪沙", "body": "千里驱车到乳山，\n雨珠一路打窗前。\n临家有事电频传。\n白露秋霜飞野草，\n中秋梧叶隐寒蝉。\n明天新月万家圆。 ​​​", "date": "2019.09.12", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "节日庆典与民俗风情"], "images": []}, {"id": "4416085124293175", "title": "五律·银滩秋景", "genre": "五律", "body": "软风吹不燥，\n拂面润心田。\n临海凭栏眺，\n倚山戏水玩。\n渔舟欢唱晚，\n燕雀舞云天。\n远客闲思荡，\n抬头望纸鸢。 ​​​", "date": "2019.09.13", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4416148591900092", "title": "苏幕遮·银滩中秋寄怀", "genre": "苏幕遮", "body": "海风吹，云朵卷。\n水漾渔舟，\n虾蟹仓仓满。\n厚道船家盈笑脸。\n人悦鱼收，\n无悔归来晚。\n恰中秋，心绪远。\n月映银滩，\n怎肯金樽浅。\n把酒怀乡一盏盏。\n遥望婵娟，\n无限情思远。 ​​​", "date": "2019.09.13", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4416148591900092 - 苏幕遮  银滩中秋寄怀/01.jpg", "冰雪诗词_全部图片/4416148591900092 - 苏幕遮  银滩中秋寄怀/02.jpg"]}, {"id": "4416802723357937", "title": "七绝·自然美", "genre": "七绝", "body": "黄绿赤橙染碧天，\n谁人法力大无边。\n等闲信手丹青画，\n胜却粉颜几万千。 ​​​", "date": "2019.09.15", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4416802723357937 - 七绝       自然美/01.jpg", "冰雪诗词_全部图片/4416802723357937 - 七绝       自然美/02.jpg"]}, {"id": "4417069288226111", "title": "贺新郎·银滩感怀", "genre": "贺新郎", "body": "雨过云天碧。\n望银滩，\n青青草木，\n软风和煦。\n鹰燕凌空随心意，\n自在东西来去。\n舟荡漾，\n渔家笑立。\n烟水波涛拍岸绿，\n更红枫秋色宜人地。\n盈海景，\n溢朝气。\n天南地北人相聚。\n看晨昏，\n悠悠共乐，\n浑然成趣。\n忘却昔时烦恼事，\n欢语频连妙句。\n凭日夜，\n无忧少虑。\n斑鬓花颜争献艺，\n胜夕阳辉映霞光璧。\n身于此，\n藐仙帝。", "date": "2019.09.16", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4417069288226111 - 贺新郎     银滩感怀/01.jpg", "冰雪诗词_全部图片/4417069288226111 - 贺新郎     银滩感怀/02.jpg", "冰雪诗词_全部图片/4417069288226111 - 贺新郎     银滩感怀/03.jpg", "冰雪诗词_全部图片/4417069288226111 - 贺新郎     银滩感怀/04.jpg"]}, {"id": "4417446347460081", "title": "七律·银滩随想", "genre": "七律", "body": "海天空阔细风扬，\n多趣花筝巧自翔。\n风荡线牵翻转舞，\n云开翼摆闪金光。\n七八列阵九天外，\n三两成行一水长。\n银线由心松紧去，\n思绪随风散海疆。 ​​​", "date": "2019.09.17", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4418523718217972", "title": "破阵子·铭记九一八", "genre": "破阵子", "body": "难忘当年今日\n倭贼半夜炮轰\n霎那间烟光四起\n淫火遍烧北大营\n可怜我众生\n十四春秋惨烈\n万千罪恶分明\n抵赖模糊强盗事\n妄想乾坤向后行\n语出世界惊 ​​​", "date": "2019.09.20", "themes": ["羁旅思乡与行吟纪游", "怀古咏史与读文有感"], "images": []}, {"id": "4418896134080456", "title": "江城子·寄同窗", "genre": "江城子", "body": "京城别后信茫茫，\n念春光，鬓飞霜。\n遥望神州，鸿雁俱翱翔。\n展翅九霄风雨翥，\n雄姿丽，气轩昂。\n山河万里自流芳，\n伴高阳，映疏窗，\n影越楼台，庭树散幽香。\n数度春秋传锦字，\n情谊远，韵悠长。 ​​​", "date": "2019.09.21", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": []}, {"id": "4419767387164079", "title": "渔家傲·庆丰收", "genre": "渔家傲", "body": "丽日金秋云淡淡，\n喜人五谷盈场院，\n锣鼓喧天歌遍遍。\n清风伴，\n黄叶飘飖频点赞。\n辛苦农家千百万，\n冰霜泥雪从无怨，\n双手赢得身境换。\n双颊灿，\n神州百姓心光艳。 ​​​", "date": "2019.09.23", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4419767387164079 - 渔家傲    庆丰收/01.jpg", "冰雪诗词_全部图片/4419767387164079 - 渔家傲    庆丰收/02.jpg", "冰雪诗词_全部图片/4419767387164079 - 渔家傲    庆丰收/03.jpg"]}, {"id": "4420062540496511", "title": "渔家傲·庆丰收", "genre": "渔家傲", "body": "丽日金秋云淡淡，\n喜人五谷盈场院，\n锣鼓喧天歌遍遍。\n清风伴，\n黄叶飘飖频点赞。\n辛苦农家千百万，\n冰霜泥雪从无怨，\n双手赢得身境换。\n双颊灿，\n神州百姓心光艳。 ​​​", "date": "2019.09.24", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4420326517469116", "title": "浣溪沙·题同学忆父", "genre": "浣溪沙", "body": "自古人生父子恩，\n言传身教善留根。\n阴阳别后更情深。\n中岁前觉无所谓，\n晚年后望泪湿襟。\n再忙莫忘孝双亲。 ​​​", "date": "2019.09.25", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": []}, {"id": "4420712272298241", "title": "浣溪沙·闲钓", "genre": "浣溪沙", "body": "秋日闲来理钓钩，\n湖边垂线绪思收。\n白云飞鸟各悠悠。\n别却高楼天地阔，\n亲合芳野气神柔。\n起杆空也不烦忧。 ​​​", "date": "2019.09.26", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": []}, {"id": "4421052342128417", "title": "七律·银滩随想", "genre": "七律", "body": "海天空阔细风扬，\n多趣花筝巧自翔。\n风荡线牵翻转舞，\n云开翼摆闪金光。\n七八列阵九天外，\n三两成行一水长。\n银线由心松紧去，\n思绪随风散海疆。 ​​​", "date": "2019.09.27", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4421165931885157", "title": "七律·银滩随想2", "genre": "七律", "body": "庭院幽深木叶青，\n轻风徐荡鸟虫鸣。\n闲翻诗画添情趣，\n忙弈棋牌聚老翁。\n河北河南才见面，\n楼前楼后总同行。\n秦腔越调协同曲，\n尽展情怀唱山东。 ​​​", "date": "2019.09.27", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4422493441755564", "title": "水调歌头·祖国颂", "genre": "水调歌头", "body": "秋日云天碧，\n山水好风光。\n神州国庆民奋，\n旗展舞飞扬。\n塞北江南红遍，\n莺燕蝉蛩欢唱，\n喜气满城乡。\n草树迎人笑，\n街角溢花香。\n惊回首，\n情不尽，\n韵悠长。\n桥连港澳，\n丝路横跨亚欧邦。\n天眼巡回宇宙，\n北斗指明航向，\n江海映高阳。\n华夏齐心力，\n世纪铸辉煌。 ​​​", "date": "2019.10.01", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4422503533520388", "title": "蝶恋花·缅怀英烈", "genre": "蝶恋花", "body": "静默无言人肃立，\n纪念碑前，\n俱为忠魂泣。\n浴血牺牲家万里，\n神州代代心铭记。\n今日山河千千异，\n矗立东方，\n国盛云天碧。\n带路连通欧亚体，\n子孙不负君前志。 ​​​", "date": "2019.10.01", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": []}, {"id": "4422614665180524", "title": "清平乐·国庆有感", "genre": "清平乐", "body": "激怀壮志，\n红叶金秋季。\n千载古都新彩丽，\n亿万工农吐气。\n军姿威武昂扬，\n铁流滚滚飞光，\n闪闪银鹰耀眼，\n山河万寿无疆。 ​​​", "date": "2019.10.01", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4422862322624257", "title": "清平乐·慰英灵", "genre": "清平乐", "body": "三车并进，\n些许心生闷。\n此举为何谁可问？\n晓寓深情眼润。\n空车满载英魂，\n邀来回望三军。\n盛世如您所愿，\n银鹰铁甲成林。 ​​​", "date": "2019.10.02", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4423587769379496", "title": "苏幕遮·银滩夜色", "genre": "苏幕遮", "body": "月黄昏，华彩放。\n远客乡邻，\n携手身心畅。\n笑聚欢谈闲地上，\n乐曲飞扬，\n歌舞翻新样。\n水兵操，男女靓。\n独舞蹁跹，\n戏曲连环唱。\n管瑟琴笙音悠荡。\n夜半声消，\n好梦凭人酿。 ​​​", "date": "2019.10.04", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4423724176531946", "title": "鹧鸪天·又聚银滩", "genre": "鹧鸪天", "body": "午聚檀香情谊深，\n九龙玉液满金樽。\n五家老少同欢笑，\n和面烧鱼煮海珍。\n红扇贝，紫蟹新，\n茴香韭菜饺馋人，\n客居他处时常乐，\n故友频逢别样亲。 ​​​", "date": "2019.10.04", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": []}, {"id": "4424309520587473", "title": "渔家傲·贺岳母生日", "genre": "渔家傲", "body": "四世同堂福寿宴，\n耄耋鹤发微红面，\n慈目安神盈笑脸。\n齐祝愿，\n南山不老松苍健。\n母女情深金不换，\n一家老少胸中惦。\n历尽沧桑却无怨。\n心绪淡，\n福如东海千邻羡。 ​​​", "date": "2019.10.06", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": []}, {"id": "4424670881420592", "title": "采桑子·银滩重阳有寄", "genre": "采桑子", "body": "海边胜似高山阔，\n碧水云天，\n思绪无边，\n惟念家乡父母安。\n临堤梧叶迎风去，\n岁月无言，\n秋日余年，\n潇洒人生跬步前。 ​​​", "date": "2019.10.07", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": []}, {"id": "4425034237971289", "title": "蝶恋花·寒露抒怀", "genre": "蝶恋花", "body": "国庆豪情心正荡，\n喜悦难消，\n谁不回头望。\n方阵铿锵兵甲壮，\n东风烈烈催巨浪。\n思绪随风收岗上，\n亿万神奇，\n再为九州创。\n日日旋升光彩放，\n赤龙腾起东方亮。 ​​​", "date": "2019.10.08", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4425402023606203", "title": "清平乐·重阳寄友", "genre": "清平乐", "body": "真情久久，\n彼此心中有。\n年少校园前或后，\n同事多年左右。\n闲来共处银滩，\n无由把酒言欢。\n兴起诗词歌赋，\n云开踏海登山。 ​​​", "date": "2019.10.09", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": []}, {"id": "4426125042046082", "title": "江城子·妻游仙人桥", "genre": "江城子", "body": "濛濛丝雨有无间，\n洞桥边，海天蓝。\n水面无风，\n鸟语润心田。\n闺蜜远来留倩影，\n轻挽手，似从前。\n细声慢步碎石湾，\n肺腑言，恁悠闲。\n昔日同窗，\n转眼四十年。\n南北两人缘分厚，\n各置业，共银滩。 ​​​", "date": "2019.10.11", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4426125042046082 - 江城子 妻游仙人桥/01.jpg", "冰雪诗词_全部图片/4426125042046082 - 江城子 妻游仙人桥/02.jpg"]}, {"id": "4426842083537755", "title": "临江仙·问无锡", "genre": "临江仙", "body": "近日古城名又震，\n缘由竟是桥翻。\n可怜母女再无言。\n出门歇片刻，\n家路永难还。\n悲剧真的防不了？\n个中疑问连连。\n曾经网上有书篇，\n任凭车载重，\n早晚那一天。 ​​​", "date": "2019.10.13", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": []}, {"id": "4427210460934682", "title": "七绝·秋晓", "genre": "七绝", "body": "白云戏水舞金秋，\n鸥鹭翱翔日色流。\n晨雾随风千里去，\n霎时散尽梦中愁。 https://video.weibo.com/show?fid=1034:4427210426152453 ​​​", "date": "2019.10.14", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4427320284637348", "title": "七绝·秋晓", "genre": "七绝", "body": "白云戏水舞金秋，\n鸥鹭翱翔日色流。\n晨雾随风千里去，\n霎时散尽梦中愁。 ​​​", "date": "2019.10.14", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4427572706777804", "title": "浣溪沙·银滩潮汐湖", "genre": "浣溪沙", "body": "草木红黄水岸边，\n高阳斜照碧云天，\n桥亭栈道曲连环。\n秋色层叠人漫步，\n微风偶荡鸟飞还。\n晚霞辉映暖心田。 ​​​", "date": "2019.10.15", "themes": ["山水田园与闲居雅趣"], "images": []}, {"id": "4427936578845437", "title": "如梦令·银滩", "genre": "如梦令", "body": "夜色流光溢彩，\n炫舞飙歌人帅，\n无虑释深情，\n万众激昂欢快。\n豪迈，豪迈。\n魅力银滩常在。 ​​​", "date": "2019.10.16", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4427936578845437 - 如梦令    银滩/01.jpg", "冰雪诗词_全部图片/4427936578845437 - 如梦令    银滩/02.jpg", "冰雪诗词_全部图片/4427936578845437 - 如梦令    银滩/03.jpg", "冰雪诗词_全部图片/4427936578845437 - 如梦令    银滩/04.jpg", "冰雪诗词_全部图片/4427936578845437 - 如梦令    银滩/05.jpg", "冰雪诗词_全部图片/4427936578845437 - 如梦令    银滩/06.jpg"]}, {"id": "4428295963536480", "title": "清平乐·银滩渔村", "genre": "清平乐", "body": "杜家海岛，\n村小人稀少。\n红瓦青石房俱老，\n窄巷闲聊翁媪。\n三边水绕青山，\n苍峰袅袅云烟。\n青壮弄舟踏浪，\n鹰飞鱼跳人欢。 ​​​", "date": "2019.10.17", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4428295963536480 - 清平乐 银滩渔村/01.jpg", "冰雪诗词_全部图片/4428295963536480 - 清平乐 银滩渔村/02.jpg", "冰雪诗词_全部图片/4428295963536480 - 清平乐 银滩渔村/03.jpg", "冰雪诗词_全部图片/4428295963536480 - 清平乐 银滩渔村/04.jpg", "冰雪诗词_全部图片/4428295963536480 - 清平乐 银滩渔村/05.jpg", "冰雪诗词_全部图片/4428295963536480 - 清平乐 银滩渔村/06.jpg"]}, {"id": "4428663376257171", "title": "渔家傲·游多福山", "genre": "渔家傲", "body": "十月多褔山灿烂，\n黄花红叶坡上漫，\n曲径丛幽天一线。\n轻挥汗，\n飞身跃顶天池见。\n香客游人盈笑脸，\n玉皇庙顶俯身瞰，\n楼立银滩清水岸。\n高声唤，\n红旗飘洒英雄汉。\n七律        多福山\n晨曦四射耀福山，\n岭翠坡葱气色仙。\n半米方池盈玉液，\n一祠圆顶绕云烟。\n石阶千磴寿星老，\n曲径九折一线天。\n玉庙碧霞烟火处，\n万千福禄降人间。\n七绝 碧霞元君祠\n凌空横卧碧霞宫，\n紫气东来万里风。\n护佑家国逢盛世，\n悠悠千载惠苍生。\n七绝     霄龙禅寺\n清幽寺院笼云烟，\n白虎青龙左右边。\n宝塔护国顶天立，\n斩妖除孽保平安。", "date": "2019.10.18", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4428663376257171 - 渔家傲 游多福山/01.jpg", "冰雪诗词_全部图片/4428663376257171 - 渔家傲 游多福山/02.jpg", "冰雪诗词_全部图片/4428663376257171 - 渔家傲 游多福山/03.jpg", "冰雪诗词_全部图片/4428663376257171 - 渔家傲 游多福山/04.jpg", "冰雪诗词_全部图片/4428663376257171 - 渔家傲 游多福山/05.jpg", "冰雪诗词_全部图片/4428663376257171 - 渔家傲 游多福山/06.jpg", "冰雪诗词_全部图片/4428663376257171 - 渔家傲 游多福山/07.jpg", "冰雪诗词_全部图片/4428663376257171 - 渔家傲 游多福山/08.jpg", "冰雪诗词_全部图片/4428663376257171 - 渔家傲 游多福山/09.jpg"]}, {"id": "4429021205350950", "title": "七律·逛南泓码头", "genre": "七律", "body": "黄昏渔港渐人欢，\n陆续归来满载船。\n杆顶红旗风劲舞，\n栏边老汉笑开颜。\n八方来客齐询价，\n数个鱼仓一瞬完。\n拎蟹兜虾车散去，\n夕晖暮色又安然。 ​​​", "date": "2019.10.19", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4429021205350950 - 七律 逛南泓码头/01.jpg", "冰雪诗词_全部图片/4429021205350950 - 七律 逛南泓码头/02.jpg", "冰雪诗词_全部图片/4429021205350950 - 七律 逛南泓码头/03.jpg", "冰雪诗词_全部图片/4429021205350950 - 七律 逛南泓码头/04.jpg", "冰雪诗词_全部图片/4429021205350950 - 七律 逛南泓码头/05.jpg", "冰雪诗词_全部图片/4429021205350950 - 七律 逛南泓码头/06.jpg"]}, {"id": "4429381701073955", "title": "贺新郎·寄同窗返校", "genre": "贺新郎", "body": "闻道将相聚。\n喜难言，\n频思夜日，\n有心归去。\n无奈今朝难凑巧，\n千里随风遥寄。\n秋色爽，\n师生合璧。\n携手开怀言旧事，\n更金樽笑语连欢句。\n情未老，\n溢豪气。\n已然四秩春秋逝。\n忆当年，\n风霜寒暑，\n苦读成趣。\n今日京城重聚首，\n忘却昔时烦事。\n凭日夜，\n无忧少虑。\n海阔长空心意远，\n恰夕阳辉映云天碧。\n山水处，\n任君去。", "date": "2019.10.20", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": []}, {"id": "4429493034487334", "title": "贺新郎·大学情", "genre": "贺新郎", "body": "闻道将相聚。\n喜难言，\n频思夜日，\n有心归去。\n无奈今朝难凑巧，\n千里随风遥寄。\n秋色爽，\n师生合璧。\n携手开怀言旧事，\n更金樽笑语连欢句。\n情未老，\n溢豪气。\n已然四秩春秋逝。\n忆当年，\n风霜寒暑，\n苦读成趣。\n今日京城重聚首，\n忘却昔时烦事。\n凭日夜，\n无忧少虑。\n海阔长空心意远，\n恰夕阳辉映云天碧。\n山水处，\n任君去。", "date": "2019.10.20", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": []}, {"id": "4430108242278590", "title": "七绝·自乐", "genre": "七绝", "body": "飘洒芦花染晚秋，\n不须谁赏自欢悠。\n为人行事若如此，\n心里清安无乱愁。 ​​​", "date": "2019.10.22", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4430108242278590 - 七绝           自乐/01.jpg"]}, {"id": "4430477252961337", "title": "浣溪沙·潮汐湖夜景", "genre": "浣溪沙", "body": "夜色朦胧露丽容，\n楼光桥影漾湖明。\n玩童戏耍趣犹浓。\n华彩倚栏环水岸，\n流辉映字耀星空。\n迷离仙境梦中行。 ​​​", "date": "2019.10.23", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4430477252961337 - 浣溪沙 潮汐湖夜景/01.jpg", "冰雪诗词_全部图片/4430477252961337 - 浣溪沙 潮汐湖夜景/02.jpg", "冰雪诗词_全部图片/4430477252961337 - 浣溪沙 潮汐湖夜景/03.jpg", "冰雪诗词_全部图片/4430477252961337 - 浣溪沙 潮汐湖夜景/04.jpg", "冰雪诗词_全部图片/4430477252961337 - 浣溪沙 潮汐湖夜景/05.jpg", "冰雪诗词_全部图片/4430477252961337 - 浣溪沙 潮汐湖夜景/06.jpg"]}, {"id": "4430477508802488", "title": "浣溪沙·潮汐湖夜景", "genre": "浣溪沙", "body": "夜色朦胧露丽容，\n楼光桥影漾湖明。\n玩童戏耍趣犹浓。\n华彩倚栏环水岸，\n流辉映字耀星空。\n迷离仙境梦中行。 ​​​", "date": "2019.10.23", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4430477508802488 - 浣溪沙 潮汐湖夜景/01.jpg", "冰雪诗词_全部图片/4430477508802488 - 浣溪沙 潮汐湖夜景/02.jpg", "冰雪诗词_全部图片/4430477508802488 - 浣溪沙 潮汐湖夜景/03.jpg", "冰雪诗词_全部图片/4430477508802488 - 浣溪沙 潮汐湖夜景/04.jpg", "冰雪诗词_全部图片/4430477508802488 - 浣溪沙 潮汐湖夜景/05.jpg", "冰雪诗词_全部图片/4430477508802488 - 浣溪沙 潮汐湖夜景/06.jpg"]}, {"id": "4430830258102742", "title": "如梦令·盼", "genre": "如梦令", "body": "往日喧哗无现，\n树静场清人散。\n远客返家乡，\n能否明年还见？\n期盼，期盼。\n日后天随人愿！ ​​​", "date": "2019.10.24", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4430830258102742 - 如梦令        盼/01.jpg", "冰雪诗词_全部图片/4430830258102742 - 如梦令        盼/02.jpg", "冰雪诗词_全部图片/4430830258102742 - 如梦令        盼/03.jpg", "冰雪诗词_全部图片/4430830258102742 - 如梦令        盼/04.jpg", "冰雪诗词_全部图片/4430830258102742 - 如梦令        盼/05.jpg", "冰雪诗词_全部图片/4430830258102742 - 如梦令        盼/06.jpg"]}, {"id": "4431932521546737", "title": "行香子·健身乐", "genre": "行香子", "body": "树下川前，跑步登山。\n斗寒暑，晓暮风烟。\n浑身轻巧，步履翩翩。\n自睡得香，吃得好，顽得欢。\n鸟啭心闲，岭翠神安。\n交新友，故友难偏。\n偶然远去，常聚尊前。\n对几声歌，几杯酒，几人酣。 ​​​", "date": "2019.10.27", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4432652112992265", "title": "五绝·银滩夜望", "genre": "五绝", "body": "临岸数寒星，\n轻闻海浪声。\n归心思故土，\n最忆是乡情。 ​​​", "date": "2019.10.29", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "怀古咏史与读文有感"], "images": []}, {"id": "4433115583568829", "title": "十六字令·井冈山", "genre": "十六字令", "body": "山，\n青翠茫茫袅袅烟。\n人居此，\n不愿做神仙。\n山，\n百里方圆峻岭连。\n黄洋界，\n一炮退敌千。\n山，\n回望当年尽杜鹃。\n忆先烈，\n血色映红天。 ​​​", "date": "2019.10.30", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "怀古咏史与读文有感"], "images": []}, {"id": "4433373827083661", "title": "七绝·题庄子岭", "genre": "七绝", "body": "蓝天红叶映岭川，\n溪水游人峡谷间。\n秋意正浓山色美，\n鸟姿风韵润心田。 ​​​", "date": "2019.10.31", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4433373827083661 - 七绝    题庄子岭/01.jpg", "冰雪诗词_全部图片/4433373827083661 - 七绝    题庄子岭/02.jpg", "冰雪诗词_全部图片/4433373827083661 - 七绝    题庄子岭/03.jpg", "冰雪诗词_全部图片/4433373827083661 - 七绝    题庄子岭/04.jpg", "冰雪诗词_全部图片/4433373827083661 - 七绝    题庄子岭/05.jpg", "冰雪诗词_全部图片/4433373827083661 - 七绝    题庄子岭/06.jpg"]}, {"id": "4433734445049088", "title": "减字木兰花·秋雨闲赋", "genre": "减字木兰花", "body": "云飘雨落\n窗外清风亲远客\n节气宜人\n望海休闲最销魂\n琴音楼上\n顿挫悠扬思绪畅\n诗画品读\n缕缕书香浸玉壶 ​​​", "date": "2019.11.01", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4434462005864010", "title": "一剪梅·欢聚", "genre": "一剪梅", "body": "千里归来秋月明，\n往日三家，\n今又重逢。\n养元道里气氛浓，\n两盏三杯，\n情趣难平。\n畅饮开怀意绪清，\n论古谈今，\n诗赋乡情。\n月移花影粉墙东，\n酒肆人稀，\n夜色朦胧。 ​​​", "date": "2019.11.03", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4434823780930140", "title": "七律·秋游", "genre": "七律", "body": "红叶黄花炫丽秋，\n山间漫步乐悠悠。\n清清溪水欢腾过，\n淡淡飞云眼底收。\n柿子满枝随处望，\n游人稀少景边留。\n不闻喧闹心神静，\n鸟语花香自不愁。 ​​​", "date": "2019.11.04", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4435185125100856", "title": "七律·神州美", "genre": "七律", "body": "广袤山河万里长，\n涓涓溪水汇川江。\n浪涛滚滚东流去，\n云雾茫茫卷夕阳。\n塞北已然冰雪地，\n江南依旧稻花香。\n神州处处风光美，\n铭刻心中是故乡。 ​​​", "date": "2019.11.05", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": []}, {"id": "4435546648684306", "title": "卜算子·晨练", "genre": "卜算子", "body": "街上月朦胧，\n露重声稀少。\n起舞闻鸡早养成，\n挥汗一清晓。\n遥望日东升，\n雾散云天皎。\n抖擞精神昂首回，\n秋色晨曦好。 ​​​", "date": "2019.11.06", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": []}, {"id": "4435909162747389", "title": "七绝·无题", "genre": "七绝", "body": "雾里看花别样红，\n糊涂处世更高明。\n五分清醒五分醉，\n闲淡安然度半生。 ​​​", "date": "2019.11.07", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": []}, {"id": "4436028578407009", "title": "七绝·洒脱", "genre": "七绝", "body": "雾里看花别样红，\n糊涂处世更高明。\n五分清醒五分醉，\n闲淡安然度半生。 ​​​", "date": "2019.11.07", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": []}, {"id": "4436270644488331", "title": "长相思·娘", "genre": "长相思", "body": "菊花黄，\n梧叶黄，\n秋染山川五彩光。\n天凉果正香。\n思老娘，\n伴老娘，\n一日三餐絮短长。\n娘安心不慌。 ​​​", "date": "2019.11.08", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4436309865563506", "title": "七绝·立冬所见", "genre": "七绝", "body": "惺忪晓起已立冬，\n窗外轻寒未显冰。\n路边花草寻常见，\n红叶频摇笑北风。 ​​​", "date": "2019.11.08", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4436309865563506 - 七绝    立冬所见/01.jpg", "冰雪诗词_全部图片/4436309865563506 - 七绝    立冬所见/02.jpg", "冰雪诗词_全部图片/4436309865563506 - 七绝    立冬所见/03.jpg", "冰雪诗词_全部图片/4436309865563506 - 七绝    立冬所见/04.jpg", "冰雪诗词_全部图片/4436309865563506 - 七绝    立冬所见/05.jpg", "冰雪诗词_全部图片/4436309865563506 - 七绝    立冬所见/06.jpg"]}, {"id": "4436632993966000", "title": "七绝·念", "genre": "七绝", "body": "携手红原山水间，\n匆匆别后念无边。\n心期来日还相聚，\n豪饮华山醉九天。 ​​​", "date": "2019.11.09", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": []}, {"id": "4436993368628186", "title": "青玉案·题同窗忆恩师", "genre": "青玉案", "body": "读罢短文飞思绪，\n四十载，光阴逝。\n笑貌音容难忘记。\n治学严谨，\n待人周细，\n常道谆谆语。\n独撑农电高挥臂，\n沥血终生倾心力。\n学业品行传弟子。\n宛如秋叶，\n护根情续，\n岁月留佳迹。 ​​​", "date": "2019.11.10", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": []}, {"id": "4437364111736947", "title": "七绝·咏菊", "genre": "七绝", "body": "深秋大地独娇艳，\n带露含香弄晓寒。\n彩嫩腰枝风伴舞，\n暖阳斜照韵斑斓。 ​​​", "date": "2019.11.11", "themes": ["咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4437364111736947 - 七绝           咏菊/01.jpg", "冰雪诗词_全部图片/4437364111736947 - 七绝           咏菊/02.jpg", "冰雪诗词_全部图片/4437364111736947 - 七绝           咏菊/03.jpg", "冰雪诗词_全部图片/4437364111736947 - 七绝           咏菊/04.jpg", "冰雪诗词_全部图片/4437364111736947 - 七绝           咏菊/05.jpg", "冰雪诗词_全部图片/4437364111736947 - 七绝           咏菊/06.jpg"]}, {"id": "4437438061266647", "title": "七绝·咏菊", "genre": "七绝", "body": "深秋大地独娇艳，\n带露含香弄晓寒。\n彩嫩腰枝风伴舞，\n暖阳斜照韵斑斓。 ​​​", "date": "2019.11.11", "themes": ["咏物寄意与比兴抒怀"], "images": []}, {"id": "4437720023344845", "title": "长相思·遥望银滩", "genre": "长相思", "body": "---观视频有寄\n天已凉，\n心不凉。\n暮色银滩管乐扬，\n银花夜未央。\n为人忙，\n为己忙。\n去到乳山梦里香，\n归来更思量。 ​​​", "date": "2019.11.12", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": []}, {"id": "4438082423862743", "title": "七律·闲咏", "genre": "七律", "body": "立冬雨后尽寒风\n黄叶枯枝遍地横。\n玉露银霜晨尽染，\n层云斜日晚趋彤。\n宵吟苏轼西江月，\n日咏曹操短歌行。\n千古诗词催己奋，\n高歌把酒趣无穷。 ​​​", "date": "2019.11.13", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": []}, {"id": "4438108097416110", "title": "七律·冬咏", "genre": "七律", "body": "立冬雨后尽寒风\n黄叶枯枝遍地横。\n玉露银霜晨尽染，\n层云斜日晚趋彤。\n宵吟苏轼西江月，\n日咏曹操短歌行。\n千古诗词催己奋，\n高歌把酒趣无穷。 ​​​", "date": "2019.11.13", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": []}, {"id": "4438446179140234", "title": "七绝·无题", "genre": "七绝", "body": "世间名利无穷尽，\n诱惑今年胜去年。\n锦瑟时光须奋斗，\n桑榆岁月且悠闲。 ​​​", "date": "2019.11.14", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": []}, {"id": "4438813491126934", "title": "破阵子·农家喜事", "genre": "破阵子", "body": "昨日回家巧遇，\n乡临嫁女酬宾。\n酒宴当街连数日，\n换盏推杯聚友亲，\n欢言贺新婚。\n冬季农闲事少，\n凭添喜气纷纷。\n满院彩旗人尽笑，\n远近亲朋情谊真。\n鼓锣鞭炮频。 ​​​", "date": "2019.11.15", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4438813491126934 - 破阵子 农家喜事/01.jpg", "冰雪诗词_全部图片/4438813491126934 - 破阵子 农家喜事/02.jpg", "冰雪诗词_全部图片/4438813491126934 - 破阵子 农家喜事/03.jpg"]}, {"id": "4439173328760844", "title": "七绝·选择", "genre": "七绝", "body": "人生之路万千条，\n行走凭思慎重挑。\n地里种瓜难获豆，\n仰天空叹只心焦。 ​​​", "date": "2019.11.16", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": []}, {"id": "4439531253742285", "title": "七绝·友聚", "genre": "七绝", "body": "茶亦醉人难忘酒，\n丹青笔墨映书香。\n文词诗赋情千古，\n舞影歌声久荡肠。 ​​​", "date": "2019.11.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱"], "images": []}, {"id": "4439895390787626", "title": "七绝·芦花二首", "genre": "七绝", "body": "飘洒芦花染晚秋，\n不须谁赏自欢悠。\n为人行事皆如此，\n心里清安无乱愁。\n风摆苇丛飞浪花，\n芦塘深处有渔家。\n船头偶见金鱼跃，\n笑脸微微映晚霞。 ​​​", "date": "2019.11.18", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4439895390787626 - 七绝   芦花二首/01.jpg", "冰雪诗词_全部图片/4439895390787626 - 七绝   芦花二首/02.jpg", "冰雪诗词_全部图片/4439895390787626 - 七绝   芦花二首/03.jpg"]}, {"id": "4440262841124628", "title": "七绝·画中行", "genre": "七绝", "body": "穿行云海越仙山，\n人似梦中入九天。\n不是神州国力盛，\n怎得踏岭若平原。 https://video.weibo.com/show?fid=1034:4440262550702321 ​​​", "date": "2019.11.19", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": []}, {"id": "4440618962828187", "title": "五律·秋望", "genre": "五律", "body": "一夜秋风劲，\n千山木叶黄。\n菊花开正盛，\n柿子染红墙。\n云淡鸣飞鸟，\n水清流碧光。\n山头携酒卧，\n邀月举金觞。 ​​​", "date": "2019.11.20", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4440981795393768", "title": "七律·闲咏", "genre": "七律", "body": "半生苦累晚来闲，\n无愧于心心自安。\n戴月披星度寒暑，\n青丝斑鬓代朱颜。\n一张一驰道中道，\n花落花开年复年。\n惟有青春多努力，\n人间岁月不遭难。 ​​​", "date": "2019.11.21", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4441346712145398", "title": "七绝·夜读", "genre": "七绝", "body": "月升花影落书窗，\n灯映诗笺淡淡黄。\n品味先贤明理句，\n不觉花色却闻香。 ​​​", "date": "2019.11.22", "themes": ["山水田园与闲居雅趣"], "images": []}, {"id": "4441709356333105", "title": "采桑子·感悟", "genre": "采桑子", "body": "人间自古千般味，\n草舍层楼，\n争向层楼，\n心绪不平常犯愁。\n而今尝过千般味，\n闲事皆休，\n静乐无休，\n恬淡欣然度春秋。 ​​​", "date": "2019.11.23", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": []}, {"id": "4442073367751645", "title": "清平乐·与君欢酌", "genre": "清平乐", "body": "多时不见，\n昨晚逢君面。\n笑口欢言金不换，\n玉液琼浆怕浅。\n遥思共忆当年，\n云光暮色窗前。\n心喜频端玉觯，\n悠然快意杯干。 ​​​", "date": "2019.11.24", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": []}, {"id": "4442433166821423", "title": "木兰花·远近", "genre": "木兰花", "body": "有心则近无心远，\n即便天天能碰面。\n低头不语枉相识，\n微笑招呼初次见。\n虽然隔水犹思念，\n莫要对门缺顾眄 。\n人生在世友宜多，\n切勿急时才找盼。 ​​​", "date": "2019.11.25", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4443152591444017", "title": "七绝·创新评审", "genre": "七绝", "body": "同行高手聚锡州，\n各展神思语不休。\n电力精英齐奋进，\n凝神远望上高楼。\n七绝 夜行二泉路\n千里之行到无锡，\n恰逢骤冷雨丝丝。\n白天忙碌难得空，\n晚上凉风吹绪思。 ​​​", "date": "2019.11.27", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": []}, {"id": "4443516635517847", "title": "七绝·偷闲", "genre": "七绝", "body": "黄昏小聚粤玲珑，\n烧脑之余起笑声。\n玉液笼包香气漫，\n身心疲倦尽随风。\n七绝    锡州冬晓\n三天未见太阳公，\n雨过晓来云彩明。\n漫步花园三五里，\n回身厅内论英雄。 ​​​", "date": "2019.11.28", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": []}, {"id": "4443980848881432", "title": "江城子·永无止境", "genre": "江城子", "body": "…贺创新评审圆满结束\n创新论剑聚锡州，\n上层楼，竞风流。\n各路精英，\n言语不肯休，\n文字描说图画展，\n精彩处，博眼球。\n切磋技艺未存留，\n有刚柔，重交流。\n尽展绝招，\n携手度春秋。\n生产经营强管理，\n齐进步，俱丰收。 ​​​", "date": "2019.11.29", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4443980848881432 - 江城子 永无止境/01.jpg"]}, {"id": "4444249657230167", "title": "破阵子·高手欢别", "genre": "破阵子", "body": "乐曲萦空飞荡，\n创新颁奖情浓。\n光聚舞台眉眼笑，\n手捧金牌绪不平，\n大厅起掌声。\n南北精英互贺，\n相识欢意无穷。\n携手交谈增干劲，\n日后人生做友朋，\n攀登永不停。 ​​​", "date": "2019.11.30", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": []}, {"id": "4444607221745587", "title": "五律·别无锡", "genre": "五律", "body": "初冬翠未衰，\n连日雨徘徊。\n傍晚增寒气，\n清晨云雾开。\n笑观龙虎竞，\n惬意释心怀。\n伫立锡州路，\n今别期再来。 ​​​", "date": "2019.12.01", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4444632295454591", "title": "七绝·华为娇子", "genre": "七绝", "body": "成仁取义中国范，\n优雅从容看晚舟。\n不畏风云千里浪，\n置身虎穴度春秋。\nhttps://mp.weixin.qq.com/s/U0q1mvD_gJttJgVzbJTB7Q ​​​", "date": "2019.12.01", "themes": ["家国情怀与时代歌咏"], "images": []}, {"id": "4444970276986716", "title": "七绝·心安自乐", "genre": "七绝", "body": "年与时驰人易老，\n夜凭事少梦无惊。\n醒来又是新天地，\n南北东西万里晴。 ​​​", "date": "2019.12.02", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4445334862023199", "title": "七律·出师表读感", "genre": "七律", "body": "忠贞不二肺腑言，\n字里行间老泪斑。\n先帝后君皆念顾，\n文臣武将摆堂前。\n宫中府内寻常事，\n陟罚利弊列其间。\n碧血丹心昭厚土，\n鞠躬尽瘁映苍天。 ​​​", "date": "2019.12.03", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": []}, {"id": "4445696356588057", "title": "七律·寒窑赋读感", "genre": "七律", "body": "谁解千年醒世篇？\n祸福叵测瞬息间。\n颜渊命短非凶恶，\n楚霸艺高刎江边。\n君子失时宜守份，\n蛟龙未遇岂飞天。\n时来风雨皆同力。\n运去英雄共犯难。 ​​​", "date": "2019.12.04", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": []}, {"id": "4446072824741337", "title": "鹧鸪天·庆母八十大寿", "genre": "鹧鸪天", "body": "冬日返乡不道寒，\n老娘伞寿聚桌前。\n稀疏银发慈眉目，\n忙碌农家月复年。\n人敬重，赖心安，\n轻言少语众邻欢。\n一生孝老疼晚辈，\n和睦家风代代传。 ​​​", "date": "2019.12.05", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": []}, {"id": "4446419207229720", "title": "七律·滕王阁序读感", "genre": "七律", "body": "王杨卢骆第一人，\n八斗之才弱冠身。\n投笔抒怀明壮志，\n登楼作赋震佳宾。\n落霞孤鹜云空丽，\n海角天涯若比邻。\n仕路曲折遭意外，\n滕王阁上荡英魂。 ​​​", "date": "2019.12.06", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": []}, {"id": "4446782093980313", "title": "七绝·大雪", "genre": "七绝", "body": "玉树琼枝万里飘，\n神工鬼斧胜雕刀。\n青青一色同天地，\n山野茫茫气势豪。 ​​​", "date": "2019.12.07", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转"], "images": []}, {"id": "4447144004300197", "title": "蝶恋花·雾中冬练", "genre": "蝶恋花", "body": "雾锁晨空浑不见，\n湿气扑身，\n双耳风中颤。\n漫跑修身金不换，\n春秋寒暑未曾断。\n脚下叶黄随声乱，\n偶遇行人，\n花罩遮颜面。\n蹬腿扩胸微透汗，\n弥天大雾何时散？ ​​​", "date": "2019.12.08", "themes": ["羁旅思乡与行吟纪游"], "images": []}, {"id": "4447505775645066", "title": "七律·<师说>读感", "genre": "七律", "body": "学而师道古来传，\n术业专攻日复年。\n一技之长宜敬重，\n三人行坐近师边。\n居前闻道无长少，\n之后习学态必端。\n不耻相师齐共进，\n人无贵贱艺当先。 ​​​", "date": "2019.12.09", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": []}, {"id": "4447866854155918", "title": "七律·醉翁亭记读感", "genre": "七律", "body": "山水之间醉老翁，\n若非泉酿具神功？\n林梢岩穴云飞荡，\n木秀芳幽景色明。\n野簌香肴心喜悦，\n觥筹喧闹鸟悲惊。\n夕阳西下人还乐，\n客与仙翁乐不同。 ​​​", "date": "2019.12.10", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": []}, {"id": "4448229473606258", "title": "七律·戒子书读感", "genre": "七律", "body": "修身明志度人生，\n勤俭养德家道平。\n宁静沉思山水远，\n澹泊冶性世间行。\n谁能险躁兴宏业，\n惟有才学可事成。\n戒子箴言千古句，\n一生垂范树家风。 ​​​", "date": "2019.12.11", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": []}, {"id": "4448596890186954", "title": "七律·爱莲说读感", "genre": "七律", "body": "秋菊夏莲春牡丹，\n世人所爱不一般。\n晋陶篱下闻香菊，\n唐李口中夸牡丹。\n臣子随君追富贵，\n宋民独有喜清莲。\n大千世界花无意，\n却是凡人眼色偏。 ​​​", "date": "2019.12.12", "themes": ["感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": []}, {"id": "4448954387678933", "title": "破阵子·12.13寄怀", "genre": "破阵子", "body": "---悼南京大屠杀亡灵\n地破天惊惨案\n狼烟昏暗长空\n凄切悲魂今尚在\n岁岁敲击警世钟\n江河恨泪盈\n上下俯身共奋\n城乡倾力齐兴\n五岳三山容貌换\n万寨千村映彩虹\n神州腾巨龙。 ​​​", "date": "2019.12.13", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": []}, {"id": "4449318410910377", "title": "七律·岳阳楼记读感", "genre": "七律", "body": "览文胜似踏江楼，\n遥想波涛滚滚流。\n阴雨霏霏星日隐，\n青云淡淡卷春秋。\n临风把酒心神旷，\n望月凝思进退忧。\n悲喜君民惟忘我，\n先忧后乐更何求！ ​​​", "date": "2019.12.14", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": []}, {"id": "4449682556156320", "title": "七律·五柳先生传读感", "genre": "七律", "body": "垂垂苍柳草宅边，\n无虑得失静少言。\n嗜酒樽前期必醉，\n赋诗窗下总成欢。\n不汲富贵甘贫苦，\n喜著文章性雅然。\n日后若得如此过，\n轻忧寡欲享天年。 ​​​", "date": "2019.12.15", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": []}, {"id": "4450044478413230", "title": "五绝·晨咏", "genre": "五绝", "body": "华夏千条路，\n神州万古情。\n人生行正道，\n为善贵心恒。 ​​​", "date": "2019.12.16", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4450404932438869", "title": "七律·陋室铭读感", "genre": "七律", "body": "身居简室胸怀阔，\n不近丝竹品亦高。\n鸿儒往来天下事，\n金经研阅万千条。\n沉浮官场心神淡，\n驰骋文坛气势豪。\n志向云亭草庐者，\n江湖飞荡任逍遥。 ​​​", "date": "2019.12.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": []}, {"id": "4450766658442608", "title": "浣溪沙·遥望乳山", "genre": "浣溪沙", "body": "阳侧银滩倚秀山，\n夏凉冬暖醉人间。\n民风醇厚蟹鱼鲜。\n负氧盈空挥不尽，\n白云拂水海天蓝。\n休闲养老可心甜。 ​​​", "date": "2019.12.18", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4451135420894130", "title": "七律·归去来兮读感", "genre": "七律", "body": "辞官不作当宵去，\n归隐田园心不忧。\n三径将荒松菊在，\n一门虽破子仆留。\n乐琴书日闲星悦，\n善棹舟云卷水流。\n不道今人闻此后，\n钻营上位几时休？ ​​​", "date": "2019.12.19", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": []}, {"id": "4451492155305718", "title": "七律·惜缘", "genre": "七律", "body": "茫茫人海能相遇，\n前世修得今日缘。\n逢聚珍惜如手足，\n别离思念盼平安。\n取长补短乾坤阔，\n细语轻言天地宽。\n处事为人多换位，\n浮生处处尽情欢。 ​​​", "date": "2019.12.20", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4451628888985638", "title": "清平乐·贺澳门回归", "genre": "清平乐", "body": "莲花宝地，\n廿载回归日。\n拥抱母亲逢盛世，\n诠释一国两制。\n昔时七子之身，\n今朝丽日飞云。\n临海鸟欢人笑，\n民情风景欣欣。 ​​​", "date": "2019.12.20", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": []}, {"id": "4451865247251536", "title": "浣溪沙·大寨小岗", "genre": "浣溪沙", "body": "人道三农两面旗，\n前行路上各东西。\n请君回首看端倪。\n合作经营成大事，\n分家管理只求吃。\n种田模式引深思。 ​​​", "date": "2019.12.21", "themes": ["羁旅思乡与行吟纪游"], "images": []}, {"id": "4452218641612401", "title": "七律·问天", "genre": "七律", "body": "冬至时节鲜见冰，\n天寒日短感微风。\n河边树上摇残叶，\n墙角枝头吐嫩红。\n敢问天公何日雪，\n聊安百姓几多情。\n漫空银粟飘遥落，\n瑞兆春来庚子丰。\n七绝            冬至\n时从今日渐天长，\n大地微微初聚阳。\n寒气犹存春已近，\n更喜红梅满院香。 ​​​", "date": "2019.12.22", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "感怀人生与自省述志"], "images": []}, {"id": "4452579628692285", "title": "七律·孔雀东南飞读感", "genre": "七律", "body": "棒打鸳鸯失伴飞，\n别离无奈泪花催。\n弱妻含痛休家去，\n独子凝思耐苦悲。\n各被逼婚心有恨，\n竞相赴死愿无违。\n千年咏唱钟情女，\n何日安得此女归？ ​​​", "date": "2019.12.23", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感", "节日庆典与民俗风情"], "images": []}, {"id": "4452942260720715", "title": "七律·颜斶说齐王读感", "genre": "七律", "body": "颜斶齐王各命前，\n短文趣事古来传。\n昔时有士昂胸首，\n今日无人陈谏言。\n礼贤下士寻常少，\n慕势贪权盈耳边。\n取巧投机终坏事，\n遭人唾弃更无颜。 ​​​", "date": "2019.12.24", "themes": ["感怀人生与自省述志", "怀古咏史与读文有感"], "images": []}, {"id": "4453305339893160", "title": "七律·沧浪亭记读感", "genre": "七律", "body": "黜官野外得幽境，\n傍水临竹构小亭。\n风月柔和踞仰笑，\n山川澄翠绪思明。\n远离仕宦情怀淡，\n亲近林光忘辱荣。\n不与众驱别有趣，\n诗文花鸟悦人生。 ​​​", "date": "2019.12.25", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": []}, {"id": "4453419828231829", "title": "七律·有感", "genre": "七律", "body": "静无喧闹过三天，\n屏网清晰任我观。\n惟有军人风雪立，\n岂因洋鬼送平安。\n居家当念边关苦，\n出外犹思华夏甘。\n隔夜主席诞辰日，\n请君默默记心间。 ​​​", "date": "2019.12.25", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": []}, {"id": "4453667559836912", "title": "满江红·缅怀毛主席", "genre": "满江红", "body": "年少心高，铭壮志，\n湘江北去。\n望川岳，茫茫烟雨，\n秋收霹雳。\n瞰井冈风云漫卷，\n藐沉浮信旗高举。\n遵义城，倾力转乾坤，\n谁能比！\n击日寇，除蒋匪，\n城楼上，抒豪气！\n为人民作主，\n动天惊地。\n两弹一星横宇宙，\n五湖四海皆兄弟。\n弹指间，清气满神州，\n山河丽！ ​​​", "date": "2019.12.26", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4453690754373252", "title": "七律·独领风骚", "genre": "七律", "body": "五帝三皇日月年，\n唐诗汉赋韵连篇。\n文人骚客遥天梦，\n公子王侯欲作仙。\n毛氏笔锋绝万古，\n历朝墨色怎齐肩。\n运筹帷幄神州丽，\n伟略雄韬煜世间。 ​​​", "date": "2019.12.26", "themes": ["羁旅思乡与行吟纪游"], "images": []}, {"id": "4454029540849597", "title": "七律·朱子家训读感", "genre": "七律", "body": "晨昏琐事莫嫌烦，\n处世居家忌乱言。\n富贵贫穷诚恳待，\n祖宗后辈勿心偏。\n娶媳嫁女求人品，\n教子读书慎为官。\n恒久行之家业旺，\n简明古训利当前。 ​​​", "date": "2019.12.27", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": []}, {"id": "4454398992194428", "title": "七律·斥歪风斜气", "genre": "七律", "body": "造假蒙人诚可恨，\n谎言虚数纸连篇。\n张冠李戴寻常事，\n太子换猫都想圆？\n无病呻吟装稚嫩，\n纵情胡闹扮疯癫。\n长空何日清风起？\n霾散天光万里传！ ​​​", "date": "2019.12.28", "themes": ["感怀人生与自省述志"], "images": []}, {"id": "4454755117994193", "title": "浣溪沙·岁暮吟", "genre": "浣溪沙", "body": "腊月初三转眼年，\n春红夏翠已飘然。\n莫失己亥雪花天。\n玉树冬梅别有味，\n银丝斑鬓暖心田。\n临屏咏赋喜流连。 ​​​", "date": "2019.12.29", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4455116398513226", "title": "临江仙·深冬暮雾", "genre": "临江仙", "body": "雾起黄昏阴暗早，\n潮湿冷气朦胧，\n身边过客俱匆匆。\n残枝垂败叶，\n河水静无冰。\n今岁一直天少雪，\n浮尘常聚高空，\n凭风吹散碧云晴。\n无风尘不去，\n灰色染苍穹。 ​​​", "date": "2019.12.30", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": []}, {"id": "4455481986678874", "title": "卜算子·致2019", "genre": "卜算子", "body": "睁眼已然年尾，\n路上车流如水，\n奋力向前方，\n只为家国更美。\n无悔，无悔。\n梦想使人陶醉。 ​​​", "date": "2019.12.31", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": []}, {"id": "4455560768213475", "title": "菩萨蛮·年前午后", "genre": "菩萨蛮", "body": "楼台午后高阳照，\n凭栏心逸云空俏。\n隔夜又新年，\n乘风再向前。\n神州山水处，\n溪岭穿行悟。\n饱览好风光，\n青葱花色香。 ​​​", "date": "2019.12.31", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4455842646510669", "title": "行香子·元旦寄怀", "genre": "行香子", "body": "岁月无声，今又新年。\n家国盛，华夏人欢。\n山青林翠，碧水云天。\n看花儿繁、鸟儿乐、海儿蓝。\n半生奋斗，近日悠闲。\n爱诗书，几案流连。\n来春心向，郊野田园。\n望世平和、家平妥、友平安。\n祝大家新年快乐！！！ ​​​", "date": "2020.01.01", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": []}, {"id": "4455887601462050", "title": "行香子·新年寄语银滩", "genre": "行香子", "body": "不是家人，却似亲人。\n来相聚，粤调京音。\n楼前院后，日夜欢心。\n望海中浪、山中寺、空中云。\n春秋寒暑，红翠芳芬。\n白云卷，碧水青林。\n夏凉冬暖，健体安神。\n胜桃花源、梅花坞、杏花村。 ​​​", "date": "2020.01.01", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": []}, {"id": "4456018387904764", "title": "长相思·新年好", "genre": "长相思", "body": "昨一年，\n今一年。\n抖擞精神更向前，\n晴空丽日天。\n月光绵，\n彩光绵。\n漫步街头喜流连，\n风轻心里甜。 ​​​", "date": "2020.01.01", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4456018387904764 - 长相思    新年好/01.jpg", "冰雪诗词_全部图片/4456018387904764 - 长相思    新年好/02.jpg", "冰雪诗词_全部图片/4456018387904764 - 长相思    新年好/03.jpg"]}, {"id": "4456207768749082", "title": "诉衷情·腊八", "genre": "诉衷情", "body": "昨天元旦碧云光，\n今日腊粥香。\n晓星高挂人起，\n窗外细风扬。\n盛两碗，\n满屋芳，\n热中肠。\n心暖绪飞，\n期盼鼠年，\n业旺家康。 ​​​", "date": "2020.01.02", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "节日庆典与民俗风情"], "images": []}, {"id": "4456244813087807", "title": "七绝·腊八二首", "genre": "七绝", "body": "元旦风轻年味浓，\n腊八炉火映晓星。\n色香温润来一碗，\n暖透身心逐梦行。\n夜熬枣米晓清香，\n暖意丝丝缓润肠。\n老伴对桌欢笑语，\n不觉日上小楼窗。 ​​​", "date": "2020.01.02", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": []}, {"id": "4456567321555106", "title": "七律·报任安书读感", "genre": "七律", "body": "字里行间司马迁，\n耻羞悲愤苦辛酸。\n死生度外心无惧，\n史记为先宁体残。\n获罪因言千古恨，\n成名仗志永相传。\n当时贼子鸿毛去，\n君书君死重泰山。 ​​​", "date": "2020.01.03", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": []}, {"id": "4456950781273651", "title": "七律·新农村老父母", "genre": "七律", "body": "家中父老不觉孤，\n手把微屏万里呼。\n孝子贤孙心顺气，\n儿来女往信和书。\n不道天涯山路远，\n只缘村落未曾出。\n耄耋老友门前唤，\n慢语欢言笑洒途。 ​​​", "date": "2020.01.04", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": []}, {"id": "4457300120656057", "title": "浣溪沙·阖家欢", "genre": "浣溪沙", "body": "一路斜阳到帝京，\n黄昏相聚叙亲情。\n闲闻趣事笑谈中。\n儿子家庭新气象，\n外甥女婿更从容。\n微风夜色月朦胧。 ​​​", "date": "2020.01.05", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": []}, {"id": "4457413941852506", "title": "七律·遥望", "genre": "七律", "body": "京城遥望石门雪，\n片片晶花漫舞天。\n玉树琼枝风里俏，\n腊梅飞鸟斗严寒。\n孩童小院开心闹，\n老者中堂喜上颜。\n期盼一冬有今日，\n飘来祥瑞兆丰年。 ​​​", "date": "2020.01.05", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4457456405210953", "title": "五律·雪趣", "genre": "五律", "body": "童娃堆雪妞，\n寒冷不言休。\n通体多白色，\n浑身酥软柔。\n红唇萦秀口，\n绿眼泛神谋。\n地上并肩站，\n风中一起游。 ​​​", "date": "2020.01.05", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4457456405210953 - 五律    雪趣/01.jpg"]}, {"id": "4457656770799087", "title": "五律·小寒晨练", "genre": "五律", "body": "雪落浮尘去，\n拂晓气清新。\n慢跑微出汗，\n深吸醒脑神。\n轻风摇玉树，\n寒鸟隐琼林。\n偶见枝头蕊，\n无言报鼠春。 ​​​", "date": "2020.01.06", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转"], "images": ["冰雪诗词_全部图片/4457656770799087 - 五律 小寒晨练/01.jpg", "冰雪诗词_全部图片/4457656770799087 - 五律 小寒晨练/02.jpg", "冰雪诗词_全部图片/4457656770799087 - 五律 小寒晨练/03.jpg", "冰雪诗词_全部图片/4457656770799087 - 五律 小寒晨练/04.jpg", "冰雪诗词_全部图片/4457656770799087 - 五律 小寒晨练/05.jpg", "冰雪诗词_全部图片/4457656770799087 - 五律 小寒晨练/06.jpg"]}, {"id": "4458015187397581", "title": "七律·谏太宗十思疏读感", "genre": "七律", "body": "魏徵切症谏直言，\n无虑得失犯圣颜。\n易取江山难守住，\n详说社稷怎平安。\n处事竭诚无不克，\n纵情傲物事维艰。\n十思成就贞观世，\n一奏忠良万古传。 ​​​", "date": "2020.01.07", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": []}, {"id": "4458165275701507", "title": "点绛唇·冬日游园", "genre": "点绛唇", "body": "午后清闲，\n醒来惬意街园转。\n东瞧西看，\n黄叶微风乱。\n残雪银山，\n王树冰湖岸。\n寒鸦啭，\n斜阳拂面，\n漫步心怀淡。 ​​​", "date": "2020.01.07", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4458380292424888", "title": "清平乐·怀念周总理", "genre": "清平乐", "body": "怎能忘记，\n元月单八日。\n泪洒长街天地泣，\n悲送人民总理。\n四十四载春秋，\n英魂激荡神州。\n华夏今非昔比，\n蛟龙誉满环球。\n七律\n周公无子又无私，\n沥血为民才智奇。\n少壮明心华夏起，\n终生践志未曾移。\n虚怀待事情思满，\n和气与人诚不失。\n表里如一堪典范，\n神州内外美名遗。", "date": "2020.01.08", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": []}, {"id": "4458429726521756", "title": "七绝·缅怀周总理", "genre": "七绝", "body": "无子岂缺思念人\n山川湖海悼英魂\n挺拔俊逸参天树\n万古尘间几度闻 ​​​", "date": "2020.01.08", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4458746246323120", "title": "七律·天坛大爷", "genre": "七律", "body": "出手惊人艺不凡，\n单双杠上后空翻。\n飞身似燕头高起，\n弓体如蛙背照天。\n已是古稀人倒立，\n赢得青壮眼睁圆。\n年年岁岁风霜笑，\n日月无言鸟雀欢。 https://video.weibo.com/show?fid=1034:4458746198294551 ​​​", "date": "2020.01.09", "themes": ["感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4459102988454801", "title": "一剪梅·遥望感怀", "genre": "一剪梅", "body": "星火桥横闻响笛，\n南北东西，日夜奔驰。\n茫茫车海客心急，\n老少相期，老板相逼。\n遥想当年恋此时，\n窗下吟诗，几案书词。\n人生逐梦恰今昔，\n青发司职，斑鬓悠息。 ​​​", "date": "2020.01.10", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4459102988454801 - 一剪梅        遥望感怀/01.jpg"]}, {"id": "4459480810683409", "title": "七绝·望月", "genre": "七绝", "body": "娟娟明月照神京，\n夜色清清望远空。\n回首无言冬又去，\n严寒过后尽春风。 ​​​", "date": "2020.01.11", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4459480810683409 - 七绝            望月/01.jpg"]}, {"id": "4459831065210044", "title": "十六字令·冬", "genre": "十六字令", "body": "一\n冬，\n白雪皑皑万里冰。\n春心动，\n千万物萌生。\n二\n冬，\n寒夜梅英舞细风。\n清香溢，\n归客悦心容。\n三\n冬，\n午后楼台避北风。\n高阳照，\n倦意暖融融。 ​​​", "date": "2020.01.12", "themes": ["羁旅思乡与行吟纪游"], "images": []}, {"id": "4460188658219696", "title": "长相思·春归", "genre": "长相思", "body": "寒相催，\n暖相催。\n不待多时春又回，\n乾坤万里晖。\n北风吹，\n东风吹。\n杨柳依依花絮飞，\n衡阳雁也归。 ​​​", "date": "2020.01.13", "themes": ["羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4460552077984568", "title": "七绝·蝴蝶兰", "genre": "七绝", "body": "蝶衣片片欲翩跹，\n娇似娉婷妩媚颜。\n韵态宛如梅卧雪，\n清香淡淡自悠然。 ​​​", "date": "2020.01.14", "themes": ["咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4460552077984568 - 七绝        蝴蝶兰/01.jpg", "冰雪诗词_全部图片/4460552077984568 - 七绝        蝴蝶兰/02.jpg", "冰雪诗词_全部图片/4460552077984568 - 七绝        蝴蝶兰/03.jpg"]}, {"id": "4460914692513959", "title": "唐多令·致文朋诗友", "genre": "唐多令", "body": "群里聚玩家，\n长词短调佳。\n触银屏，妙笔生花。\n平仄和谐音韵美，\n昏暮咏，映朝霞。\n齐诵酒棋茶，\n同吟草木鸦。\n寄情怀，慨叹频发。\n斑鬓红颜人气旺，\n绝律唱，赋诗答。 ​​​", "date": "2020.01.15", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": []}, {"id": "4461276803380127", "title": "十六字令·佛", "genre": "十六字令", "body": "一\n佛，\n寡欲清心自快活。\n禅中悟，\n除却己身魔。\n二\n佛，\n宽大为怀行善德。\n寻心路，\n独自履山河。\n三\n佛，\n凡世尘间最重和。\n得人敬，\n遍地缘分多。 ​​​", "date": "2020.01.16", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": []}, {"id": "4461639858306310", "title": "踏莎行·小年寄怀", "genre": "踏莎行", "body": "晓月西南，\n晨曦东泛，\n长空日月遥相见。\n灯笼高挂庆新春，\n火红年味心思念。\n常日团圆，\n而今别散，\n双方父母身边伴。\n阖家老少几头忙，\n人生欢乐金不换。 ​​​", "date": "2020.01.17", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4461639858306310 - 踏莎行 小年寄怀/01.jpg", "冰雪诗词_全部图片/4461639858306310 - 踏莎行 小年寄怀/02.jpg", "冰雪诗词_全部图片/4461639858306310 - 踏莎行 小年寄怀/03.jpg", "冰雪诗词_全部图片/4461639858306310 - 踏莎行 小年寄怀/04.jpg", "冰雪诗词_全部图片/4461639858306310 - 踏莎行 小年寄怀/05.jpg", "冰雪诗词_全部图片/4461639858306310 - 踏莎行 小年寄怀/06.jpg"]}, {"id": "4462003186174366", "title": "渔家傲·遥望", "genre": "渔家傲", "body": "客地桥飞楼耸立，\n车流声远匆匆去。\n云淡风轻斜暖日，\n光芒刺，\n平阶垂幕晖横溢。\n岁月掩埋多少事，\n故乡老友凭栏忆，\n不道除夕能否聚。\n心铭记，\n少年哭笑无穷次。 ​​​", "date": "2020.01.18", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4462003186174366 - 渔家傲        遥望/01.jpg"]}, {"id": "4462364286492189", "title": "卜算子·岁暮街景", "genre": "卜算子", "body": "岸上雪残存，\n河里冰融化。\n四九微微暖意回，\n鸟雀枝头踏。\n年味渐趋浓，\n遍处红灯挂。\n但见行人脚步急，\n包鼓兜斜挎。 ​​​", "date": "2020.01.19", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4462729748602989", "title": "南乡子·大寒寄怀", "genre": "南乡子", "body": "拂晓气清寒，\n残月当空镰细弯。\n风摆灯旗欢快舞，\n蹁跹，\n不日迎来子鼠年。\n回首亦安然，\n饱览诗书日月天。\n挚友高朋山海过，\n心甜，\n春暖花开又向前。 ​​​", "date": "2020.01.20", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": []}, {"id": "4463091876184508", "title": "如梦令·小酌", "genre": "如梦令", "body": "老友樽前欢聚，\n深浅凭心随欲。\n陈酿溢清香，\n勾起馋虫难驭。\n情趣，情趣。\n盏往杯来谁拒。 ​​​", "date": "2020.01.21", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4463456105382303", "title": "忆秦娥·年前寄怀", "genre": "忆秦娥", "body": "年关近，\n回乡伴母心怀奋。\n心怀奋，\n不拘时日，\n促膝言论。\n半生漂外奔波紧，\n离多聚少心头恨。\n心头恨，\n从今不再，\n孝亲应分。 ​​​", "date": "2020.01.22", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": []}, {"id": "4463816739511457", "title": "虞美人·父母愿", "genre": "虞美人", "body": "椿萱连日蒸煎煮，\n香气萦门户。\n炊烟袅袅舞云空，\n白发红颜欢喜溢言情。\n喃喃自语心头事，\n只待除夕日。\n鸡鸭鱼肉摆厅堂，\n犒赏儿孙晚辈整年忙。 ​​​", "date": "2020.01.23", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": []}, {"id": "4463933915906296", "title": "五绝·秘方", "genre": "五绝", "body": "消息满天飞，\n不知能信谁。\n与其忙打问，\n岂若把家回。 ​​​", "date": "2020.01.23", "themes": ["感怀人生与自省述志"], "images": []}, {"id": "4464175939913826", "title": "七律·辞旧迎新", "genre": "七律", "body": "金猪辞岁除夕到，\n玉鼠迎春残雪消。\n喜鹊踏枝鸣树杪，\n归人入户喜眉梢。\n疫情难阻家乡愿，\n高铁成全父老邀。\n华夏一宵同守岁，\n神州万里乐如潮。\n祝亲朋好友身体健康！新年快乐！ ​​​", "date": "2020.01.24", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": []}, {"id": "4464544821149642", "title": "七律·新年敬医者", "genre": "七律", "body": "逆行身影舞江城，\n别样除夕战疫情。\n昂首离家亏父母，\n低头诊病赛英雄。\n为人舍己堪豪迈，\n救死扶伤美誉升。\n大爱无疆广称赞，\n举国上下志成城。 ​​​", "date": "2020.01.25", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "节日庆典与民俗风情"], "images": []}, {"id": "4464647480109015", "title": "清平乐·出征", "genre": "清平乐", "body": "鲜红指印，\n请战群情奋。\n恰是除夕春晚劲，\n将士江城挺进。\n人民利益崇高，\n舍家千里迢迢。\n携手铲除魔怪，\n徐风温暖同胞。 ​​​", "date": "2020.01.25", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "四时风光与节气流转", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4464647480109015 - 清平乐        出征/01.jpg", "冰雪诗词_全部图片/4464647480109015 - 清平乐        出征/02.jpg", "冰雪诗词_全部图片/4464647480109015 - 清平乐        出征/03.jpg", "冰雪诗词_全部图片/4464647480109015 - 清平乐        出征/04.jpg", "冰雪诗词_全部图片/4464647480109015 - 清平乐        出征/05.jpg", "冰雪诗词_全部图片/4464647480109015 - 清平乐        出征/06.jpg"]}, {"id": "4464902326140540", "title": "浣溪沙·初一有感", "genre": "浣溪沙", "body": "恰遇新春闹肺炎，\n除夕心冷感天寒。\n城乡街市少人烟。\n别后相逢隔布罩，\n樽前空对怎言欢。\n平生难忘这一年。 ​​​", "date": "2020.01.26", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": []}, {"id": "4465048904962990", "title": "七律·闲咏", "genre": "七律", "body": "庚子新年不是味，\n皆因疫起汉阳城。\n神州万众家藏匿，\n华夏千城路禁行。\n幸有白衣拼死战，\n更得将士踏征程。\n南山不老多贤智，\n再斩恶魔尘世清。 ​​​", "date": "2020.01.26", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4465266182409941", "title": "浣溪沙·随吟", "genre": "浣溪沙", "body": "晓起传来假日添，\n疫情严峻莫心欢。\n居家勿动自平安。\n坚信国家多举措，\n辩听网络少谣言。\n寒冬过后艳阳天。 ​​​", "date": "2020.01.27", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "感怀人生与自省述志"], "images": []}, {"id": "4465625483346328", "title": "长相思·武汉", "genre": "长相思", "body": "盼新年，\n过新年。\n不道除夕夜色寒，\n江城行路难。\n火神山，\n雷神山。\n三镇乡亲眼欲穿，\n降魔仗此间。 ​​​", "date": "2020.01.28", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "节日庆典与民俗风情"], "images": []}, {"id": "4465661004641620", "title": "虞美人·致武汉", "genre": "虞美人", "body": "惊慌恐惧何时了？\n人祸知多少。\n可怜江汉起寒风，\n野味不堪回首病房中。\n华南市场今犹在，\n日后真能改？\n劝君牢记而今愁！\n痛改前非泪水莫白流！ ​​​", "date": "2020.01.28", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": []}, {"id": "4465989972644826", "title": "七绝·初五寄怀", "genre": "七绝", "body": "破五心期破疫情，\n炮声阵阵刺长空。\n妖魔鬼怪随烟去，\n还我神州万里晴。 ​​​", "date": "2020.01.29", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": []}, {"id": "4466351882025960", "title": "五律·致敬", "genre": "五律", "body": "着装席地睡，\n屈体映君心。\n忘却娇儿女，\n难思父母亲。\n醒来还战斗，\n挺立更精神，\n坚韧白衣者，\n泪湿无数人。 ​​​", "date": "2020.01.30", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4466351882025960 - 五律    致敬/01.jpg", "冰雪诗词_全部图片/4466351882025960 - 五律    致敬/02.jpg", "冰雪诗词_全部图片/4466351882025960 - 五律    致敬/03.jpg"]}, {"id": "4466713527350471", "title": "五律·问责唐志红", "genre": "五律", "body": "问三三不知，\n日日作何思。\n身在卫生委，\n神离防疫时。\n不谙疾痛苦，\n难对病人慈。\n当场免职去，\n黎民百姓期。 ​​​", "date": "2020.01.31", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4467074585948392", "title": "鹧鸪天·夜问", "genre": "鹧鸪天", "body": "闪闪银星耀远空，\n可知尘世起瘟情。\n白衣将士身心苦，\n病患黎民日夜疼。\n年假日，却封城，\n人烟稀少月宫惊。\n嫦娥俯瞰凡间事，\n雷火神山景色明。 ​​​", "date": "2020.02.01", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "感怀人生与自省述志"], "images": []}, {"id": "4467440815383038", "title": "蝶恋花·庚子新春有感", "genre": "蝶恋花", "body": "本是访亲邀友日，\n路上清清，难见人来去。\n街口追查盘问细，\n目光炯炯神情异。\n江汉病魔侵各地，\n形势非常，门户纷纷闭。\n百姓白衣同努力，\n乡村州府除瘟疫。 ​​​", "date": "2020.02.02", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4467800611728394", "title": "鹧鸪天·闲咏", "genre": "鹧鸪天", "body": "防疫居家茶灶边，\n茗香四溢懒得端。\n青云舒卷随天意，\n麻雀高飞任自欢。\n人坐卧，绪难闲，\n不知前线可平安。\n屏银日日风声紧，\n惟盼江城过险关。 ​​​", "date": "2020.02.03", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4468163720975280", "title": "七律·立春有寄", "genre": "七律", "body": "又逢春日再题诗，\n正是瘟神肆虐时。\n但愿东风吹晦气，\n惟期初雨洗霉枝。\n冰消雪化云烟暖，\n叶放花开韵色奇。\n万众山前携巨手，\n雄关迈步更心齐。 ​​​", "date": "2020.02.04", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": []}, {"id": "4468524661396050", "title": "青玉案·防疫迎春", "genre": "青玉案", "body": "风吹庚子新春日，\n更期待，驱瘟疫。\n万寨千城门户闭，\n步移庭院，耳闻风泣，\n眼望云天碧。\n闲思飞绪江城事，\n欣喜白衣再发力，\n雷火神山添利器。\n众心凝聚，军民齐志，\n华夏巍然立。 ​​​", "date": "2020.02.05", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4468888844750936", "title": "青玉案·致敬钟老", "genre": "青玉案", "body": "南山不老松苍翠，\n斗风雨，迎尘秽。\n闻道龟蛇悲洒泪，\n纵行千里，百般抚慰，\n是以心操碎。\n瘟神肆虐如洪水，\n降住魔头苦难寐。\n心系江城终不悔，\n任眸湿润，于民无愧，\n洁雅如兰桂。 ​​​", "date": "2020.02.06", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4469252855767548", "title": "七绝·悼李医生", "genre": "七绝", "body": "魔来吹哨无人醒！\n反被追究惊夜梦。\n倘若当初稳稳神，\n挽回多少江城命？ ​​​", "date": "2020.02.07", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": []}, {"id": "4469266952334779", "title": "七绝·致武汉相关部门及其后", "genre": "七绝", "body": "有脑缺思枉为人，\n未闻临阵哨鸣音。\n糊涂之举终生憾，\n毁誉江城罪对民。 ​​​", "date": "2020.02.07", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": []}, {"id": "4469410029286891", "title": "七律·悼文亮医生", "genre": "七律", "body": "三十五岁正华年，\n初面瘟神释警言。\n无奈善行遭训戒，\n更逢昏吏扯虚篇。\n江城霎那悲难尽，\n华夏轰然雾满天。\n不幸今朝君又去，\n神州百姓痛心肝。 ​​​", "date": "2020.02.07", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4469611552465195", "title": "西江月·庚子元夕", "genre": "西江月", "body": "明月可知别苦？\n华人正叹离伤！\n瘟神肆虐遍城乡，\n一场攻坚硬仗。\n龙马花灯不见，\n汤圆珍野无香。\n满怀思念寄前方，\n何日江城解放？ ​​​", "date": "2020.02.08", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": []}, {"id": "4469695023343775", "title": "七律·再悼李医生", "genre": "七律", "body": "他为苍生说过话，\n读来泪水潸然下。\n平凡言语蕴深情，\n宽阔胸怀天地纳。\n忍爱割慈似远行，\n思儿念母心头挂。\n愿君一路气盈身，\n魑魅瘟神都惧怕。\n转发：2月7日，李文亮医生的妻子付雪洁在社交平台发布声明称：不接受任何个人捐款，网上流传的关于她本人的求助信息均为不实信息。声明全文如下：\n本人付雪洁，襄阳人，是李文亮医生的妻子，本人声明我们不接受任何个人捐款。网上流传的本人求助信息均为不实信息。\n感谢社会各界对李文亮医生及对我们家人的关怀！\n同时我把我丈夫李文亮的《我走了》完成全稿！\n在我成为一粒尘埃之前，我又静静地怀想了一遍故乡的黑土白云。多想回到小时候啊，风是尽情飞舞的，雪是洁白无瑕的。\n活着真好，可我死了。我再也无法抚摸亲人的脸庞，再也无法带孩子去看东湖春晓，再也无法陪父母去看武大樱花，再也无法把风筝放到白云深处。\n我曾依稀梦见我尚未出世的孩子，他（她）一出生就眼含热泪，在人潮人海中把我寻找。对不起，孩子！我知道你只想要一个平凡父亲，而我却做了一个平民英雄。\n天快亮了，我要走了，带着一张保证书，那是我此生唯一的行囊。\n谢谢世间所有懂我怜我爱我的人，我知道你们都在黎明等候，等我越过山丘！可是，我太累了。\n此生，我不想重于泰山，也不怕轻于鸿毛。我唯一的心愿，就是希望冰雪消融之后，众生依然热爱大地，依然相信祖国。\n等到春雷滚滚，如果有人还想纪念我，请给我立一个小小的墓碑吧！不必伟岸，只须证明我曾来过这个世界，有名有姓，无知无畏。\n那么，我的墓志铭只需一句：\n他为苍生说过话。", "date": "2020.02.08", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4469976171327183", "title": "鹧鸪天·元宵夜", "genre": "鹧鸪天", "body": "月暗星疏各闭门，\n不闻街上闹灯音。\n元夕晚会无观众，\n惟见真情华夏人。\n凝斗志，力千钧，\n瘟神当道铸英魂。\n珞珈山下民同愿，\n万里神州分外亲。 ​​​", "date": "2020.02.09", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "节日庆典与民俗风情"], "images": []}, {"id": "4470338463393452", "title": "定风波·初春闲咏", "genre": "定风波", "body": "多日阴霾转丽天，\n东风徐荡渐心宽。\n喜看疫情新患少，趋好。\n封城闭户众人安。\n小院轻寒莺鹊闹，微笑。\n庭前漫步自成欢。\n更待江城传喜报，尽早。\n神州又见百花繁。 ​​​", "date": "2020.02.10", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4470700263548473", "title": "清平乐·闲思", "genre": "清平乐", "body": "世间万物，\n千古悠悠处。\n切莫自私浑不顾，\n失道神仙难助。\n风云日月长空，\n山川雨雪辰星。\n花木飞禽走兽，\n与人相辅相成。 ​​​", "date": "2020.02.11", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4471063540823552", "title": "苏幕遮·爱无疆", "genre": "苏幕遮", "body": "月明圆，思不寐。\n遥寄江城，多少离人泪。\n父母望儿心欲碎，\n挚爱夫妻，千里空相对。\n难当头，心不愧。\n无数白衣，昼夜人憔悴。\n昂首逆行留弱背，\n他日相逢，切莫无情怼。 ​​​", "date": "2020.02.12", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": []}, {"id": "4471424070299245", "title": "沁园春·望", "genre": "沁园春", "body": "庚子初春，霾雾萦浮，\n尘秽漫飘。\n瞰江城内外，瘟神荡荡，\n大河南北，民意滔滔。\n泪染龟蛇，疫侵黄鹤，\n山海齐心气势高。\n除夕夜，看白衣将士，\n分外妖娆。\n九州赤子多娇，\n引父老乡亲尽折腰。\n敬南山豪迈，几多神采，\n兰娟温雅，无限风骚。\n耋耄之年，倾心呐喊，\n挥臂弯弓射大雕。\n同奋力，斩妖魔鬼怪，\n喜看明朝。", "date": "2020.02.13", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "节日庆典与民俗风情"], "images": []}, {"id": "4471788937498045", "title": "如梦令·无奈独吟", "genre": "如梦令", "body": "夜半雨丝飘落，\n晓起冷风吹彻。\n闻疫更心寒，\n羡野鸟儿飞过。\n神恻，神恻，\n魑魅几时能破。 ​​​", "date": "2020.02.14", "themes": ["羁旅思乡与行吟纪游"], "images": []}, {"id": "4472150130255547", "title": "卜算子·春雪晓寄", "genre": "卜算子", "body": "残月挂西南，\n风雪吹来冷。\n晓起凭栏远望天，\n四下悠悠静。\n依旧不开门，\n防疫千般重。\n回坐窗前览古书，\n思绪交先圣。 ​​​", "date": "2020.02.15", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": []}, {"id": "4472511360382565", "title": "七律·时事有感", "genre": "七律", "body": "言行莫要惹民怨，\n善恶须知天在看。\n身正毋忧地影斜，\n脚歪自是沙痕乱。\n遭人唾弃岂无因，\n受众尊崇难自愿。\n平语近民仁爱心，\n神州大地苍生盼。 ​​​", "date": "2020.02.16", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4472873400075670", "title": "渔家傲·春日随咏", "genre": "渔家傲", "body": "春晓风寒残叶响，\n暖阳午后窗辉漾，\n伏案悠闲思绪畅。\n随手望，\n谁家词赋眼前亮。\n古者情怀多坦荡，\n苦吟笑对堪豪放，\n千载诗篇一宝藏。\n常向往，\n不时咏诵心神旷。 ​​​", "date": "2020.02.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4472950390115231", "title": "七绝·题图", "genre": "七绝", "body": "机静人闲湛蓝天，\n乱飞鸟雀任由欢。\n可知百姓心中苦，\n日日居家绪不安。 ​​​", "date": "2020.02.17", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4472950390115231 - 七绝           题图/01.jpg"]}, {"id": "4473236467626704", "title": "清平乐·呼唤", "genre": "清平乐", "body": "春风依旧，\n无奈山河瘦。\n厂院无人机欲锈，\n街市冷清难购。\n神州何日花开，\n莺飞燕舞萦杯。\n将士凯歌高奏，\n白衣抗疫归来。 ​​​", "date": "2020.02.18", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4473600297674053", "title": "渔家傲·期待", "genre": "渔家傲", "body": "残雪虽消寒未尽，\n突起瘟情，万户如临阵。\n堵路封城人不顺，\n凭添百姓无名恨。\n到底何因都在问，\n众口纷纭，拭目瞧踪信。\n期待青天雷暴震，\n闪光霹雳传真讯。 ​​​", "date": "2020.02.19", "themes": ["感怀人生与自省述志"], "images": []}, {"id": "4473962598129704", "title": "七律·雨水日有寄", "genre": "七律", "body": "紫气东来风色长，\n千城万寨把毒防。\n而今独对一株柳，\n他日同游万里江。\n华夏山川恒有道，\n龟蛇瘟疫奈何常。\n早春雨水欣然至，\n静待花繁絮卷扬。 ​​​", "date": "2020.02.20", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": []}, {"id": "4474323488705782", "title": "浪淘沙·晨望", "genre": "浪淘沙", "body": "晓起雾茫茫，\n弥漫无疆。\n倚栏伫立感湿凉。\n防疫掩门何日了，\n苦荡回肠。\n烟霭笼村庄，\n难见鹰翔。\n凭心只盼大风狂。\n吹散阴霾尘秽去，\n晴照溪塘。 ​​​", "date": "2020.02.21", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4474685129045298", "title": "蝶恋花·春望", "genre": "蝶恋花", "body": "浩荡东风霾雾去，\n晴映山河，阡陌铺新绿。\n无奈掩门防肺疫，\n凭栏独自飞思绪。\n往日春来芳草地，\n车马游人，燕舞莺声细。\n花色纸鸢争俏丽，\n山阳斜照湖光碧。 ​​​", "date": "2020.02.22", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4475049446327443", "title": "如梦令·悟", "genre": "如梦令", "body": "莫道光阴虚掷，\n庚子春千年计。\n闭户佑神州，\n自有春风和煦。\n凝气、凝气，\n心静神闲明志。 ​​​", "date": "2020.02.23", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": []}, {"id": "4475412031857931", "title": "清平乐·龙之愿", "genre": "清平乐", "body": "凭空腾起，\n辉映乾坤赤。\n横扫神州庚子疫，\n巷陌山川葱碧。\n行人整备衣装，\n雏莺乳燕争翔。\n花木飘红吐翠，\n湖光岭色呈祥。 ​​​", "date": "2020.02.24", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": []}, {"id": "4475774772115609", "title": "蝶恋花·春雨练功", "genre": "蝶恋花", "body": "午后转阴飘细雨，\n啭鸟归飞，庭院独幽寂。\n四处无声寒又至，\n云空黯淡回屋去。\n舒体静心松站立，\n两臂轻垂，颔首眸微闭。\n气聚丹田凭运意，\n任督二脉如天地。 ​​​", "date": "2020.02.25", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4476135318911296", "title": "满庭芳·独思闲问", "genre": "满庭芳", "body": "晓色阴阴，早春清冷，院落空荡无声。\n树头残叶，岑寂舞斜风。\n多日关门谢客，屋檐下，偶有莺呜。\n遥相敬，神州遍地，抗疫众豪英。\n心情，多郁闷。宾朋不见，亲友难逢。\n任酒别金榼，人对虚庭。\n何至今朝如此？当初语：可控休惊。\n谁之过？江城失守，魑魅祸千城！", "date": "2020.02.26", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": []}, {"id": "4476498557585762", "title": "临江仙·闲吟", "genre": "临江仙", "body": "防疫居家门户闭，\n清悠闲览诗书。\n王杨卢骆耀唐初，\n元白歌盛世，\n李杜竞哀哭。\n翠鸟金鱼皆意境，\n山川秀脑中图，\n欢涛怒水自心出。\n花香飘不断，\n叶落有还无。 ​​​", "date": "2020.02.27", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": []}, {"id": "4476860174252697", "title": "浣溪沙·情无尽", "genre": "浣溪沙", "body": "防疫隔绝门户间，\n遥思汇聚手屏前，\n文言闪动报平安。\n见字如人心底近，\n闻声视面似身边。\n情温意暖克时艰。 ​​​", "date": "2020.02.28", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": []}, {"id": "4477224973370379", "title": "七绝·春晓风色", "genre": "七绝", "body": "濛濛渐落纤纤雨，\n细细轻拂昨夜尘。\n远处红灯湿不舞，\n柔风欲暖吻行人。 ​​​", "date": "2020.02.29", "themes": ["羁旅思乡与行吟纪游"], "images": []}, {"id": "4477585503163661", "title": "采桑子·问风", "genre": "采桑子", "body": "闭门已耐三十日，\n意绪低迷，\n解禁心期，\n试问春风知不知。\n依然翻卷吹来去，\n摇曳残枝，\n昼夜如斯，\n催染愁颜鬓上丝。 ​​​", "date": "2020.03.01", "themes": ["感怀人生与自省述志"], "images": []}, {"id": "4477946544938483", "title": "江城子·寄语武汉", "genre": "江城子", "body": "东风春日绪难平，\n望江城，寄深情。\n鸿雁高飞，划破碧云空。\n凭借君行传口信：\n荆楚地，尽豪英。\n举国上下志成城，\n战瘟神，聚精兵。\n百姓三军，携手力无穷。\n毕竟酷寒冬已过，\n花正放，看新晴。 ​​​", "date": "2020.03.02", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": []}, {"id": "4478309926898496", "title": "玉楼春·疫火怒烧", "genre": "玉楼春", "body": "神州之外狼烟起，\n烈焰已然烧美帝。\n先前咧嘴妄狂言，\n不道今朝能有此。\n天涯地角同一体，\n山海同晖千古世。\n人间相助万年安，\n舞爪张牙难度日。 ​​​", "date": "2020.03.03", "themes": ["山水田园与闲居雅趣"], "images": []}, {"id": "4478671328674827", "title": "长相思·谁之过", "genre": "长相思", "body": "风凄凄，\n路凄凄。\n庚子初春防疫急，\n千家万户离。\n草未萋，\n木未萋。\n怨恨由谁日夜思，\n宵寒月又西。 ​​​", "date": "2020.03.04", "themes": ["羁旅思乡与行吟纪游"], "images": []}, {"id": "4479035507406434", "title": "浣溪沙·惊蛰有寄", "genre": "浣溪沙", "body": "乍响春雷万物惊，\n蛰虫骇醒鸟飞鸣。\n东来紫气卷长空。\n驱赶瘟神霄汉外，\n赢得芳翠陌阡中。\n软风摇荡杏枝红。 ​​​", "date": "2020.03.05", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": []}, {"id": "4479066025425118", "title": "七绝·今日天安门", "genre": "七绝", "body": "城楼高耸入蓝天，\n金柱银灯矗路边。\n倒影清晰天地阔，\n宛如仙境落人间。 ​​​", "date": "2020.03.05", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4479066025425118 - 七绝 今日天安门/01.jpg"]}, {"id": "4479398885137543", "title": "临江仙·股市风云", "genre": "临江仙", "body": "冷暖沉浮欢并恨，\n惊魂日日年年。\n银屏红绿舞翩跹。\n霎时崖坠谷，\n转眼跃山巅。\n昨日收盘窃喜，\n今朝开市难言。\n心潮澎湃涨跌间。\n平生如胆小，\n切莫近跟前。 ​​​", "date": "2020.03.06", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": []}, {"id": "4479761163932381", "title": "天仙子·古韵屏辉", "genre": "天仙子", "body": "书画文词屏上秀，\n南北知音千里凑，\n挥毫泼墨度春秋。\n寻故旧，\n邀新友，\n唱和赏读如醉酒。\n柳赵欧颜宣纸透，\n汉赋唐诗情韵厚，\n九州瑰宝煜双眸。\n童与叟，\n师徒手，\n共仿先贤神意走。 ​​​", "date": "2020.03.07", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": []}, {"id": "4480123195940699", "title": "忆王孙·节日寄妻", "genre": "忆王孙", "body": "三八恰是月圆时，\n独望蟾宫意绪凄，\n古冶廉州两处思。\n恨别离，\n只盼瘟神滚向西。 ​​​", "date": "2020.03.08", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": []}, {"id": "4480223402239543", "title": "七绝·三八敬天使", "genre": "七绝", "body": "白衣袅袅若羽轻，\n心暖江城满目情。\n驱散人间瘟疫雾，\n换回云汉九霄明。 ​​​", "date": "2020.03.08", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣"], "images": []}, {"id": "4480484874196596", "title": "七绝·春晓风光", "genre": "七绝", "body": "初阳冉冉耀东方，\n春水涟漪漾碧光。\n两岸纤纤垂细柳，\n惺忪娇眼泛蛾黄。 ​​​", "date": "2020.03.09", "themes": ["山水田园与闲居雅趣", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4480484874196596 - 七绝   春晓风光/01.jpg", "冰雪诗词_全部图片/4480484874196596 - 七绝   春晓风光/02.jpg", "冰雪诗词_全部图片/4480484874196596 - 七绝   春晓风光/03.jpg"]}, {"id": "4481209558377982", "title": "清平乐·孤酌", "genre": "清平乐", "body": "愁闲殢酒，\n独伴庭前柳。\n岂奈掩门难聚友，\n不道春来人瘦。\n枉然天外云光，\n欣欣风色隔墙。\n何日芳郊览翠？\n消除烦闷忧慌。 ​​​", "date": "2020.03.11", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4481572092892615", "title": "卜算子·寂叹", "genre": "卜算子", "body": "午静鸟清啼，\n窗下闲思乱。\n独处已然月有余，\n愁寂空长叹。\n细柳剪蛾黄，\n院外花香淡。\n心绪随风无限飞，\n遥望云空雁。 ​​​", "date": "2020.03.12", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": []}, {"id": "4481934929253114", "title": "采桑子·植树节寄语", "genre": "采桑子", "body": "和风煦日难植绿，\n不似昔年，\n种树山前，\n翠柳青杨映碧天。\n心期往日槐梧壮，\n枝叶连连，\n遮蔽云烟，\n迢递花香漫世间。 ​​​", "date": "2020.03.13", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": []}, {"id": "4482296659182153", "title": "浣溪沙·方仓医院", "genre": "浣溪沙", "body": "生命方舟拯救谁？\n江城百姓万千回。\n遮风避浪闪惊雷。\n霎那瘟魔袭武汉，\n瞬间将士斩蛇龟。\n白衣妙手送春晖。 ​​​", "date": "2020.03.14", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣"], "images": []}, {"id": "4482658996234724", "title": "七绝·遣怀", "genre": "七绝", "body": "人生梦想半成非，\n半世沉浮有喜悲。\n富贵终究身外物，\n幸福只在自心扉。 ​​​", "date": "2020.03.15", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4483019723161837", "title": "天仙子·瘟神怒", "genre": "天仙子", "body": "席卷西方兴巨浪，\n倒海翻江摧陆上，\n千山万壑起风狂。\n洪水涨，\n谁能挡，\n堤岸滩涂残叶广。\n前日讽嘲华夏妄，\n今夜自身无处躺，\n缺情少问遍鳞伤。\n空张望，\n胡乱撞，\n相互咬撕狠狈样。 ​​​", "date": "2020.03.16", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4483380948925700", "title": "画堂春·春日寄妻", "genre": "画堂春", "body": "闲庭独坐念亲人，\n斜阳西下销魂。\n廉州古冶却连心，\n两处愁春。\n相比江城百姓，\n顿觉万幸安神。\n从今往后重家身，\n平淡才真。 ​​​", "date": "2020.03.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": []}, {"id": "4483745803260023", "title": "浣溪沙·农家小院", "genre": "浣溪沙", "body": "垂柳无言染蛾黄，\n新芽嫩草映花墙。\n清幽庭院洒春光。\n丽日明霞阶上暖。\n流莺脆响荡回肠。\n窗前闲坐绪飞扬  。 ​​​", "date": "2020.03.18", "themes": ["山水田园与闲居雅趣", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4484107121431732", "title": "蝶恋花·风夜咏", "genre": "蝶恋花", "body": "楼外狂风声不住，\n击打疏窗，\n乱叶残枝舞。\n彻夜起伏停又蹙，\n梦中多少离人苦。\n日月轮回失晓暮，\n世道沉浮，\n且把春秋度。\n庚子年来常闭户，\n银丝染镜侵双目。 ​​​", "date": "2020.03.19", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4484468863319232", "title": "蝶恋花·别武汉", "genre": "蝶恋花", "body": "近日天河频洒泪，\n不舍白衣，\n敬送千滋味。\n各路英雄身已累，\n凯旋归去颜憔悴。\n多是除夕援鄂妹，\n两月拼搏，\n人苦心无愧。\n救死扶伤她最美，\n亲情堪比金翡翠。\n注：武汉天河机场 ​​​", "date": "2020.03.20", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": []}, {"id": "4484509762722446", "title": "蝶恋花·别江城", "genre": "蝶恋花", "body": "近日天河频洒泪，\n不舍白衣，\n敬送千滋味。\n各路英雄身已累，\n凯旋归去颜憔悴。\n多是除夕援鄂妹，\n两月拼搏，\n人苦心无愧。\n救死扶伤她最美，\n亲情堪比金翡翠。\n注：武汉天河机场 ​​​", "date": "2020.03.20", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": []}, {"id": "4484831457044665", "title": "蝶恋花·天使逢春", "genre": "蝶恋花", "body": "柳幕垂垂迎赤子，\n翠鸟声声，\n淡淡云空丽。\n花萼欣欣春满地，\n纵横阡陌蒸蒸意。\n千里凯旋人畅喜，\n战疫江城，\n屡屡传佳绩。\n燕赵家亲行重礼，\n英雄儿女心铭记。 ​​​", "date": "2020.03.21", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": []}, {"id": "4485193702232372", "title": "七绝·老子二十二章读感", "genre": "七绝", "body": "直枉曲全天下道，\n得失多少莫强求。\n明彰有度功长远，\n世事无争更自由。 ​​​", "date": "2020.03.22", "themes": ["感怀人生与自省述志", "怀古咏史与读文有感"], "images": []}, {"id": "4485556396570744", "title": "相见欢·春洒晓院", "genre": "相见欢", "body": "朝霞一抹穿庭，\n暖融融，\n树杪轻轻翠叶舞春风。\n花枝绽，\n禽鸟啭，\n小窗明。\n闲坐阶前遥望燕翔空。 ​​​", "date": "2020.03.23", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4485918545482421", "title": "七律·春夜寄怀", "genre": "七律", "body": "更深独坐静无言，\n惦念亲人难入眠。\n陈酒清香盈翠觯，\n孤灯暗色笼银笺。\n三杯玉液穿肠过，\n几句拙词落纸间。\n难禁遥思眸欲润，\n星空岑寂待明天。 ​​​", "date": "2020.03.24", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": []}, {"id": "4485971401735291", "title": "七绝·流氓", "genre": "七绝", "body": "米帝全无羞耻布，\n高官信口黄毛助。\n自家瓢碗满尘灰，\n却怨他人纤手妇。 ​​​", "date": "2020.03.24", "themes": ["感怀人生与自省述志"], "images": []}, {"id": "4486281511746510", "title": "七绝·老子十二章读感", "genre": "七绝", "body": "五色令人双目盲，\n五音催断几回肠。\n贪食五味一时快，\n岂料赢得遍体伤。 ​​​", "date": "2020.03.25", "themes": ["感怀人生与自省述志", "怀古咏史与读文有感"], "images": []}, {"id": "4486643187042276", "title": "减字木兰花·晓雨寄杯", "genre": "减字木兰花", "body": "清明将到，\n细雨纷纷悲绪绕。\n泪染衣襟，\n多少今人忆故人。\n一年一度，\n相念相思情不住。\n天上人间，\n未了尘缘梦里还。 ​​​", "date": "2020.03.26", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": []}, {"id": "4487009088910666", "title": "减字木兰花·防疫峰会", "genre": "减字木兰花", "body": "寰球大佬，\n万里连屏属稀少。\n只为新毒，\n共讨良方把病除。\n神州上策，\n分享世间险滩过。\n日月齐辉，\n风雨同舟携手归。 ​​​", "date": "2020.03.27", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4487369266961740", "title": "少年游·画像", "genre": "少年游", "body": "自觉最是善独思，\n疑世俱无知。\n万民皆醉，\n高天欲倒，\n唯有吾独支。\n出言必语他人傻，\n满眼不相宜。\n东西任我，\n指南损北，\n谁敢不从余。 ​​​", "date": "2020.03.28", "themes": ["羁旅思乡与行吟纪游"], "images": []}, {"id": "4487731167731943", "title": "采桑子·战疫初捷", "genre": "采桑子", "body": "移除路卡春风畅，\n天碧云轻，\n万里新晴，\n翠鸟争翔遍处鸣。\n瘟情得控山河喜，\n草木葱茏，\n溪水叮咚，\n百姓欢欣享太平。 ​​​", "date": "2020.03.29", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": []}, {"id": "4488093195246701", "title": "减字木兰花·春宵", "genre": "减字木兰花", "body": "夕阳如玉，\n日暮斜辉花弄趣。\n烟晕朦胧，\n阵阵清香小院浓。\n纤纤弯月，\n闪闪星光轻洒泻。\n凝伫飞思，\n千里家亲共此时。 ​​​", "date": "2020.03.30", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4488456396753887", "title": "苏幕遮·神州内外", "genre": "苏幕遮", "body": "夜风寒，\n心底颤。\n异域瘟情，\n患者七十万。\n昔日恶言酸武汉，\n忍看今朝，\n遍处家国乱。\n望神州，\n云水淡。\n战疫初捷，\n日暖山花漫。\n力尽所能情无限，\n放眼寰球，\n旗展五星艳。 ​​​", "date": "2020.03.31", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": []}, {"id": "4488817463245014", "title": "减字木兰花·晓寒", "genre": "减字木兰花", "body": "冷风吹雨，\n倒灌春寒丝缕缕。\n老弱难支，\n夜醒昼眠不进食。\n阴云暗日，\n烟雾濛濛挥不去。\n期盼天晴，\n万里长空花色明。 ​​​", "date": "2020.04.01", "themes": ["感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4489180559885664", "title": "忆秦娥·贺父生日", "genre": "忆秦娥", "body": "千长寿，\n儿孙祝愿重音奏，\n重音奏。\n神安体健，\n舒心夜昼。\n耄耋霜鬓人淳厚，\n风闲云淡常思旧，\n常思旧。\n一生仗义，\n尊崇盈袖。 ​​​", "date": "2020.04.02", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "怀古咏史与读文有感", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": []}, {"id": "4489543669047863", "title": "蝶恋花·春之病", "genre": "蝶恋花", "body": "乍暖乍寒天未定，\n表壮实虚，\n一霎飞来病。\n胸闷头晕神不静，\n三三两两医院碰。\n滴液行针消肿痛，\n昼夜烦心，\n可悔常无动？\n人恙逢春难称兴，\n最当烟酒吃喝控！ ​​​", "date": "2020.04.03", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4489905319439011", "title": "减字木兰花·国祭", "genre": "减字木兰花", "body": "山河肃静，\n逝者英魂江海敬。\n抗疫辞亲，\n赢取神州万里春。\n名垂千古，\n酹酒凭觞浇热土。\n岁岁清明，\n泪洒川原草木惊。 ​​​", "date": "2020.04.04", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "节日庆典与民俗风情"], "images": []}, {"id": "4489931009389581", "title": "七律·悼抗疫英烈", "genre": "七律", "body": "笛声刺耳入云空，\n旗落杆头祭逝灵。\n山海同悲天地泣，\n岭河齐怨暗尘风。\n英雄儿女辞身去，\n百姓黎民心底生。\n从此清明春雨日，\n神州万里泪盈盈。 ​​​", "date": "2020.04.04", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": []}, {"id": "4490268588257936", "title": "七律·时事有思", "genre": "七律", "body": "崇洋教化几十年，\n尧舜儿孙总不安。\n域外遭欺呑苦泪，\n家中疑恨月无圆。\n黄毛蓝眼均称客，\n黑脸白牙也上天。\n生米已然半熟饭，\n便能咽下岂心甘？ ​​​", "date": "2020.04.05", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4490630535359608", "title": "蝶恋花·闲人忧天", "genre": "蝶恋花", "body": "无影青苗多草木，\n只为赔偿，\n乱毁良田处。\n累累伤痕袭眼目，\n陌阡无语情难诉。\n自古粮丰心不怵，\n若靠他人，\n恐断儿孙路。\n莫道九州千万户，\n将来食饮无着处。 ​​​", "date": "2020.04.06", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": []}, {"id": "4490990767361790", "title": "采桑子·春日掠影", "genre": "采桑子", "body": "芳园闲步香风软，\n柳晕青青，\n草色绒绒，\n欢快悠悠乐曲声。\n倚栏倩侣轻轻语，\n意态娇秾，\n眉目传情，\n远处斜阳映小亭。 ​​​", "date": "2020.04.07", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4491358041918436", "title": "忆秦娥·解甲归去", "genre": "忆秦娥", "body": "东风劲，\n一宵吹绽花枝盛，\n花枝盛。\n沿堤细柳，\n鳞光摇动。\n九州怒把瘟神送，\n白衣执甲今朝胜，\n今朝胜。\n江城解放，\n万民礼敬。 ​​​", "date": "2020.04.08", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": []}, {"id": "4491713668030254", "title": "望江南·三首", "genre": "望江南", "body": "多少事，\n庚子九州春。\n突起疫情袭武汉，\n霎时牵动亿人心，\n凝聚到如今。\n白衣将，\n日夜战瘟神。\n不顾身危同奋力，\n救扶病患胜亲人，\n赢取百花春。\n怀歹意，\n码字日发文。\n点火煽风凭臆断，\n斜眸歪嘴乱喷人，\n睁眼坏良心。 ​​​", "date": "2020.04.09", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4492080006917764", "title": "七绝·老子第八章读感", "genre": "七绝", "body": "上善有谁能似水，\n不争名利亦无忧。\n润滋万物葳蕤状，\n无虑山川遍处流。 ​​​", "date": "2020.04.10", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": []}, {"id": "4492442730558376", "title": "一剪梅·春风晓色", "genre": "一剪梅", "body": "河岸柔风翠鸟鸣，\n花落花开，\n水碧天晴。\n春光满目郁葱茏，\n紫粉青黄，\n尽展芳容。\n晨练飞奔脚下轻，\n浊气排出，\n体爽神清。\n人生花甲绪思明，\n远事无忧，\n少虑心平。 ​​​", "date": "2020.04.11", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4492804296390541", "title": "七绝·老子二十九章读感", "genre": "七绝", "body": "天道恒常莫乱为，\n世间万物自行随。\n吹歔隳载由他去，\n自古圣人淡喜悲。 ​​​", "date": "2020.04.12", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": []}, {"id": "4493168407655223", "title": "蝶恋花·于无声处", "genre": "蝶恋花", "body": "晓月无言荆楚静，\n远处樱花，\n寞寞遥相送。\n将士江城圆使命，\n凯旋不扰黎民梦。\n最是当代人可敬，\n历次灾来，\n上下齐听令。\n军纪严明思想硬，\n五洲四海谁能胜！ ​​​", "date": "2020.04.13", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": []}, {"id": "4493530712278556", "title": "七绝·春湖花岸", "genre": "七绝", "body": "一\n碧水涟漪翠色深，\n繁花争艳喜游人。\n随风摇曳轻声语，\n何日再来同赏春。\n二\n柳烟袅袅影沉沉，\n湖水清清花色深。\n曲岸小桥欢语处，\n絮飞云卷戏游人。 ​​​", "date": "2020.04.14", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4493891598639883", "title": "浪淘沙·牵手", "genre": "浪淘沙", "body": "千里冀东行，\n一路春风，\n飞车旷野映晨星。\n冉冉红阳彤似火，\n树暖花明。\n别后苦伤情，\n离绪翻腾，\n相思相望却难逢。\n今日疫情得解放，\n携手从容。 ​​​", "date": "2020.04.15", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4494255995116679", "title": "一剪梅·春雨有寄", "genre": "一剪梅", "body": "夜半轻闻打叶声，\n细雨悄然，\n梦醒天明。\n芳菲满目脑神清，\n木翠花繁，\n紫粉黄红。\n晓色濛濛雨未停，\n伫立窗前，\n思绪飞萦。\n花开花谢任天公，\n往复循环，\n恰似人生。 ​​​", "date": "2020.04.16", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": []}, {"id": "4494618210652227", "title": "浣溪沙·闲庭漫步", "genre": "浣溪沙", "body": "午后雨停接晚晴，\n清幽楼院少人声。\n微风阵阵起飞红。\n偶有黄犬窗外吠，\n时闻翠鸟树梢鸣。\n闲情漫步与妻同。 ​​​", "date": "2020.04.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱"], "images": []}, {"id": "4494981228617012", "title": "浣溪沙·唐山南湖", "genre": "浣溪沙", "body": "塌陷成湖水映天，\n废墟堆变万花山。\n莺飞蝶舞榭桥边。\n丹凤朝阳鸣盛世，\n姮嫦辞月慕凡间。\n春来此处醉八仙。 ​​​", "date": "2020.04.18", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4494981228617012 - 浣溪沙 唐山南湖/01.jpg", "冰雪诗词_全部图片/4494981228617012 - 浣溪沙 唐山南湖/02.jpg", "冰雪诗词_全部图片/4494981228617012 - 浣溪沙 唐山南湖/03.jpg", "冰雪诗词_全部图片/4494981228617012 - 浣溪沙 唐山南湖/04.jpg", "冰雪诗词_全部图片/4494981228617012 - 浣溪沙 唐山南湖/05.jpg", "冰雪诗词_全部图片/4494981228617012 - 浣溪沙 唐山南湖/06.jpg"]}, {"id": "4495341204605061", "title": "七绝·百花赞", "genre": "七绝", "body": "平生开谢尽随天，\n雨打风吹默不言。\n无计得失难有恨，\n归根化土亦安然。 ​​​", "date": "2020.04.19", "themes": ["羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4495705760654893", "title": "踏莎行·黄昏寄语", "genre": "踏莎行", "body": "翠色盈庭，\n幽香满径。\n暮春花影微风动。\n斜阳夕照暖人心，\n红英绿叶争相竞。\n脚下清溪，\n眸中秀景。\n昔时山岗荒芜境。\n几年楼筑地翻天，\n而今夜夜温馨梦。 ​​​", "date": "2020.04.20", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": []}, {"id": "4496067359964951", "title": "七绝·游园两首", "genre": "七绝", "body": "一.\n疫情过后踏新晴，\n曲岸平湖碧水明。\n花盛人闲心绪好，\n小园寻觅旧行踪。\n二.\n湖水清清柳岸明，\n玉兰花绽笑云空。\n沉思忆起当年事，\n四秩光阴一瞬中。 ​​​", "date": "2020.04.21", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": []}, {"id": "4496438908362063", "title": "南歌子·春晓远望", "genre": "南歌子", "body": "楼外青山远，\n晨风起细沙。\n枝头啼鸟唱春华，\n满眼芳菲、\n无限绪思发。\n花落飘零去，\n燕飞恋故家。\n人生有志闯天涯，\n阔岸高峰、\n极目望朝霞。 ​​​", "date": "2020.04.22", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4496803162603136", "title": "减字木兰花·看西方", "genre": "减字木兰花", "body": "万分心痛，\n宝贵时光轻放纵。\n大疫当前，\n到处甩锅胡乱言。\n谎称最懂，\n愚弄国人梦难醒。\n恸地悲天，\n无数冤魂怎个安。 ​​​", "date": "2020.04.23", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4497158256514142", "title": "相见欢·暮春晓色", "genre": "相见欢", "body": "晨曦一缕花明，\n暖融融，\n满院春晖、\n梦醒好心情。\n莺儿啭，\n丁香漫，\n晚樱浓。\n翠叶无言、\n轻舞趁东风。 ​​​", "date": "2020.04.24", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4497520774040168", "title": "虞美人·春游曹妃甸", "genre": "虞美人", "body": "曹妃湖畔蒹葭密，\n水净云天碧。\n传说渔女救唐王，\n千载悠悠、\n韵味愈芬芳。\n甸边连片高楼起，\n花木欣欣意。\n青桥跨海似飞虹，\n鸥鹭争翔、\n深港远洋行。 ​​​", "date": "2020.04.25", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4497520774040168 - 虞美人 春游曹妃甸/01.jpg", "冰雪诗词_全部图片/4497520774040168 - 虞美人 春游曹妃甸/02.jpg", "冰雪诗词_全部图片/4497520774040168 - 虞美人 春游曹妃甸/03.jpg", "冰雪诗词_全部图片/4497520774040168 - 虞美人 春游曹妃甸/04.jpg"]}, {"id": "4497877914637707", "title": "临江仙·夕照河岸", "genre": "临江仙", "body": "碧水清波斜照影，\n无边岸柳垂绦。\n落花柔絮正飘飘。\n风轻摇翠叶，\n云淡燕飞高。\n漫步休闲人渐密，\n疫情恐惧烟消。\n轻松心绪自昭昭。\n时常闻笑语，\n偶有诵歌谣。 ​​​", "date": "2020.04.26", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4498240067942292", "title": "七绝·老子第二章读感", "genre": "七绝", "body": "雅俗美丑有无间，\n善恶相行伴地天。\n长短盈虚相对望，\n无为胜似乱添言。 ​​​", "date": "2020.04.27", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": []}, {"id": "4498612602182593", "title": "临江仙·月季礼赞", "genre": "临江仙", "body": "篱下街边花色艳，\n风摇朵朵娇人。\n深红浅粉笑迎君。\n春归从不怨，\n夏日也清新。\n不与杏桃争众赏，\n无言自有芳心。\n秋姿秋色胜当春。\n一生情久远，\n不恋短时亲。 ​​​", "date": "2020.04.28", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4498612602182593 - 临江仙 月季礼赞/01.jpg", "冰雪诗词_全部图片/4498612602182593 - 临江仙 月季礼赞/02.jpg", "冰雪诗词_全部图片/4498612602182593 - 临江仙 月季礼赞/03.jpg", "冰雪诗词_全部图片/4498612602182593 - 临江仙 月季礼赞/04.jpg", "冰雪诗词_全部图片/4498612602182593 - 临江仙 月季礼赞/05.jpg", "冰雪诗词_全部图片/4498612602182593 - 临江仙 月季礼赞/06.jpg"]}, {"id": "4498964387062746", "title": "南乡子·时事有思", "genre": "南乡子", "body": "放眼扫寰球，\n瘟疫横行万众愁。\n却有贼人闲找事，\n胡诌，\n乱搅时局嘴脸丢。\n叫嚣比人优，\n抵毁神州壮志酬。\n轻看国民频死去，\n无忧，\n只为私心语不休。 ​​​", "date": "2020.04.29", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": []}, {"id": "4499327458943303", "title": "苏幕遮·晖映春岸", "genre": "苏幕遮", "body": "晓窗明，惊梦醒。\n啼鸟穿空，\n叶翠花香重。\n漫步河边心绪静。\n吐水金鱼，\n欢跃谁人懂。\n望长川，春浪涌。\n垂柳飘摇，\n月季迎风动。\n林下人声轻诵咏。\n百姓高歌，\n万物朝晖竞。 ​​​", "date": "2020.04.30", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4499689732322181", "title": "鹧鸪天·忐忑", "genre": "鹧鸪天", "body": "别样年光过五一，\n诚惶诚恐度假期。\n赏花与否心敲鼓，\n戏水可行人不知。\n君切记，勿轻敌，\n随身口罩莫分离。\n三山五岳寻常在，\n岂差今朝望顶池。 ​​​", "date": "2020.05.01", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "怀古咏史与读文有感"], "images": []}, {"id": "4500053820385054", "title": "七绝·老子三十七章读感", "genre": "七绝", "body": "看似无为却有为，\n真心守道气相随。\n无名之朴催人奋，\n动静相辅正自归。 ​​​", "date": "2020.05.02", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": []}, {"id": "4500454472380333", "title": "满江红·暮春晓热", "genre": "满江红", "body": "晓起潮湿，\n似欲雨、雾尘相伴。\n叶无声、繁花不语，\n苍烟悠远。\n快步河边飞腿炼，\n瞬间汗水衣衫满。\n气短虚、歇脚缓心神，\n桥头站。\n云空渺，无所念。\n不经意，高飞燕。\n俱翩跹振翅、山翻岭转。\n举目周边青草木，\n更闻树杪蝉音乱。\n望天地、万里少清风，\n神难淡。", "date": "2020.05.03", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4500778956127538", "title": "鹧鸪天·五四寄怀", "genre": "鹧鸪天", "body": "丝雨如尘晓色阴，\n楼台窗下细风频。\n潮湿退去心神爽，\n鸟雀前来语调亲。\n逢五四，忆青春，\n峥嵘岁月铸忠魂。\n今生无悔为华夏，\n来世炎黄好子孙。 ​​​", "date": "2020.05.04", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": []}, {"id": "4501139427541429", "title": "鹧鸪天·春暮寄妻", "genre": "鹧鸪天", "body": "雨送亲人去帝京，\n银屏连线走停停。\n心期日暮黄昏到，\n不料凌晨午夜行。\n频堵塞，防疫情。\n入城查测不轻松。\n千辛万苦家门进，\n只为儿孙享太平。 ​​​", "date": "2020.05.05", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": []}, {"id": "4501501400447187", "title": "踏莎行·春暮寄怀", "genre": "踏莎行", "body": "飞絮飘飘，\n落花袅袅。\n枝头叶壮莺声老。\n东风无力柳垂垂，\n斜阳冉冉当庭照。\n风雨春归，\n烟空云渺。\n芳菲渐去桐荫好。\n人生起落莫伤心，\n恰如春去春来早。 ​​​", "date": "2020.05.06", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": []}, {"id": "4501859736093826", "title": "南乡子·莫争斗", "genre": "南乡子", "body": "夜雨细无声，\n润物轻轻一片情。\n叶翠花娇欢不语，\n祥宁，\n天地从来不抢功。\n人却为虚名，\n争斗难休遍体疼。\n纵使眼前财万贯，\n如风，\n一旦归西两手空。 ​​​", "date": "2020.05.07", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4502224796370448", "title": "七绝·后浪别说", "genre": "七绝", "body": "一.\n自居前辈语新人，\n后浪之说未入心。\n惟有真诚才是友，\n春风化雨自缤纷。\n二.\n江水连绵千里浪，\n难分前后莫强求。\n一同奔涌东流去，\n岂可超脱独自留！ ​​​", "date": "2020.05.08", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": []}, {"id": "4502588475561941", "title": "踏莎行·蓬特之流", "genre": "踏莎行", "body": "信口雌黄，\n贼心若墨。\n无中生有飞污沫。\n是非颠倒却寻常，\n移花接木民惊愕。\n狼狈为奸，\n狗猪同卧。\n咬人吠日声名恶。\n搅得天下不能安，\n万年遗臭遭千唾。 ​​​", "date": "2020.05.09", "themes": ["羁旅思乡与行吟纪游"], "images": []}, {"id": "4502949693398042", "title": "满江红·节日敬娘亲", "genre": "满江红", "body": "回首当初，依稀记，\n时时牵手。\n拥怀里，寒冬亦暖，\n温馨腕肘。\n巧施针线缝衣裤，\n妙用食材香过肉。\n脚步捷、四季不得闲，\n人清瘦。\n如今日，银丝抖。\n双耳背，常怀旧。\n总开心悠乐，\n门庭慢走。\n一日三餐仍自理，\n念女挂儿凭夜昼。\n愿双亲、犹似泰山松，\n千长寿。", "date": "2020.05.10", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": []}, {"id": "4503312865089669", "title": "南歌子·备而无患", "genre": "南歌子", "body": "五月天多变，\n晴空骤雨飘。\n行人无备总挨浇，\n苦痛难言、咳嗽又发烧。\n国际风云乱，\n反华怪调高。\n九州有备任他嚣，\n猎手神枪、岂让虎狼逃。 ​​​", "date": "2020.05.11", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4503675701502723", "title": "一剪梅·少怨自安", "genre": "一剪梅", "body": "春暮欢娱闹市东，\n溪水叮当，\n陌上青青。\n花繁鸟啭舞蝶蜂，\n翼展飞香，\n风起云惊。\n乱絮茫茫落又升，\n扑面遮眸，\n扰乱心情。\n一天好事半成空，\n切勿伤怀，\n莫怨天公。 ​​​", "date": "2020.05.12", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": []}, {"id": "4504034113418685", "title": "七绝·老子二十三章读感", "genre": "七绝", "body": "骤雨急来难日久，\n惊风乍起只一朝。\n苍天尚且才如此，\n况于人乎有妙招？ ​​​", "date": "2020.05.13", "themes": ["感怀人生与自省述志", "怀古咏史与读文有感"], "images": []}, {"id": "4504396694584982", "title": "南乡子·晓园风色", "genre": "南乡子", "body": "烟暖晓风柔，\n青翠街园人渐稠。\n歌舞太极随乐起，\n悠悠，\n散尽疫情庚子愁。\n鸟雀绕枝头，\n溪水潺潺碧色流。\n草里虫儿闲不住，\n啾啾，\n月季荷花曲径幽。 ​​​", "date": "2020.05.14", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4504544882844276", "title": "南乡子·疫情飘过", "genre": "南乡子", "body": "烟暖晓风柔，\n青翠街园人渐稠。\n歌舞太极随乐起，\n悠悠，\n散尽疫情庚子愁。\n鸟雀绕枝头，\n溪水潺潺碧色流。\n草里虫儿闲不住，\n啾啾，\n月季荷花曲径幽。 ​​​", "date": "2020.05.14", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4504755081047842", "title": "苏幕遮·槐香清韵", "genre": "苏幕遮", "body": "晚风轻，香气漫。\n辞树槐花，\n飘过深墙院。\n归鸟栖息蝉响软。\n夜色如银，\n枝影花阴散。\n漾清辉，弯月灿。\n幽景宜人，\n惬意心怀展。\n把酒问天星闪闪，\n意荡天河，\n静望飞思远。 ​​​", "date": "2020.05.15", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4505243662417837", "title": "踏莎行·贺兄嫂山居", "genre": "踏莎行", "body": "清晓急行，\n初阳高速。\n悠悠云雾山前驻。\n凭栏缓上半山中，\n潺潺溪水萦新户。\n挚友亲朋，\n群贤共路。\n樽前把酒情无数。\n扬眉弹指几十年，\n车轱山下轻轻诉。 ​​​", "date": "2020.05.16", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": []}, {"id": "4505618490524255", "title": "浣溪沙·元谷山庄", "genre": "浣溪沙", "body": "栈道曲栏入碧天，\n潺潺溪水舞长川。\n闲情漫步翠无边。\n一路蜂蝶萦脚下，\n千年茶树卧山前。\n清幽行宿彩云间。 ​​​", "date": "2020.05.17", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4505618490524255 - 浣溪沙  元谷山庄/01.jpg", "冰雪诗词_全部图片/4505618490524255 - 浣溪沙  元谷山庄/02.jpg", "冰雪诗词_全部图片/4505618490524255 - 浣溪沙  元谷山庄/03.jpg", "冰雪诗词_全部图片/4505618490524255 - 浣溪沙  元谷山庄/04.jpg", "冰雪诗词_全部图片/4505618490524255 - 浣溪沙  元谷山庄/05.jpg", "冰雪诗词_全部图片/4505618490524255 - 浣溪沙  元谷山庄/06.jpg"]}, {"id": "4505854265371309", "title": "一丛花·车轱辘山有感", "genre": "一丛花", "body": "当年荒径草萋萋，\n林暗鸟声稀。\n石垣断壁山腰处，\n院空空，残叶陈丝。\n往日人家，难寻踪影，\n老树记当时。\n今朝山下起新居，\n老少俱心怡。\n清溪筑坝平湖满，\n路宽宽，树茂花滋。\n袅袅炊烟，盈盈笑语，\n处处显生机。 ​​​", "date": "2020.05.18", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4505854265371309 - 一丛花 车轱辘山有感/01.jpg"]}, {"id": "4506222969477893", "title": "七律·痛悼刘总", "genre": "七律", "body": "初夏晨风尚显凉，\n驱车郊外草茫茫。\n忍悲含泪别师长，\n掩面伤心断寸肠。\n笑貌音容难再见，\n良言暖语永留香。\n君今驾鹤西归去，\n无虑无忧日月翔。 ​​​", "date": "2020.05.19", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4506336257456628", "title": "菩萨蛮·咏日晕", "genre": "菩萨蛮", "body": "飞虹五彩萦白日，\n环心耀眼天光炽。\n奇特碧云空，\n赢得呐喊声。\n谁人挥巨笔？\n成此千年丽。\n无限叹苍穹，\n妙谜多少层？ ​​​", "date": "2020.05.19", "themes": ["感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4506336257456628 - 菩萨蛮    咏日晕/01.jpg", "冰雪诗词_全部图片/4506336257456628 - 菩萨蛮    咏日晕/02.jpg", "冰雪诗词_全部图片/4506336257456628 - 菩萨蛮    咏日晕/03.jpg"]}, {"id": "4506567888040759", "title": "如梦令·520寄亲人", "genre": "如梦令", "body": "三个字心中念，\n独默语千千遍。\n依旧未说出，\n只仰仗灵犀唤。\n心愿，心愿。\n来世今生难变！ ​​​", "date": "2020.05.20", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": []}, {"id": "4506937284880663", "title": "七绝·初夏暮色", "genre": "七绝", "body": "黄昏夕照溢丁香，\n树下悠闲扯话长。\n翠叶微风人不倦，\n楼窗点点染红光。 ​​​", "date": "2020.05.21", "themes": ["山水田园与闲居雅趣"], "images": []}, {"id": "4507062241922955", "title": "七绝·石门风雨", "genre": "七绝", "body": "午后黑云城欲摧，\n惊雷阵阵鸟横飞。\n狂风骤雨窗前过，\n童稚闻声哭皱眉。 ​​​", "date": "2020.05.21", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": []}, {"id": "4507298825944612", "title": "破阵子·风云突变", "genre": "破阵子", "body": "霎那雷鸣电闪，\n晴空骤暗天惊。\n枝叶丛花狂起落，\n乱卷黑云雨伴风。\n只闻刺耳声。\n无奈行人湿透，\n可怜飞鸟迷笼。\n戏水鸳鸯含恨去，\n遍地积流漫西东。\n老天也耍疯。 https://video.weibo.com/show?fid=1034:4507298748628996 ​​​", "date": "2020.05.22", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4507662618471169", "title": "七绝·感恩前浪", "genre": "七绝", "body": "新枝翠叶渐趋浓，\n烈日当头荫下行。\n幸有前人勤种树，\n方得今日夏凉风。 ​​​", "date": "2020.05.23", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4508025123813619", "title": "洞仙歌·城河暮色", "genre": "洞仙歌", "body": "黄昏云淡，又踏城河岸。\n柔软风来暗香漫。\n水波清，鱼戏垂柳悠闲，\n夕阳影，碧色波光零乱。\n余辉花亦灿，月季蔷薇，\n脉脉含情自争艳。\n莺啭彩蝶飞，结对成双，\n蹁跹舞，惹人目昡。\n子孙乐，苍音应童言，\n总笑语欢声，意浓情满。 ​​​", "date": "2020.05.24", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4508385762410766", "title": "清平乐·咏麦浪", "genre": "清平乐", "body": "晴空曦照，\n碧浪青烟袅。\n卧雪逢春情未了，\n风雨沉浮不倒。\n历经冻土冰霜，\n嫩苗细叶蔫黄。\n凭借东风又起，\n今朝万里飞扬。 ​​​", "date": "2020.05.25", "themes": ["感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4508385762410766 - 清平乐    咏麦浪/01.jpg"]}, {"id": "4508748746098931", "title": "唐多令·雨后小园", "genre": "唐多令", "body": "丝雨润芳茵，\n娇花翠叶新，\n径清幽，漫步菲林。\n望柳闻香溪水处，\n人不语，欲销魂。\n树杪鸟飞音，\n红黄月季亲，\n细风摇，煞是招人。\n雨送春归花却盛，\n尘间事，莫忧心。 ​​​", "date": "2020.05.26", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4509111969090123", "title": "阮郎归·民心河畔", "genre": "阮郎归", "body": "绿槐青柳响新蝉，\n晴空飒爽天。\n风轻香淡漫河边，\n神闲老少欢。\n歌舞秀，太极拳，\n花绳小狗牵。\n空竹花剑甩长鞭，\n悠悠日落山。 ​​​", "date": "2020.05.27", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4509473744421
