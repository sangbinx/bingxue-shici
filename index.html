  岁晚抒怀/01.jpg"]}, {"id": "4850481166296503", "title": "七绝·回暖", "genre": "七绝", "body": "街头烟火渐趋浓，\n远处依稀叫卖声。\n鸟雀来回低首看，\n从前老友几时逢？ ​​​", "date": "2022.12.25", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4850481166296503 - 七绝          回暖/01.jpg"]}, {"id": "4850843817351930", "title": "踏莎行·缅怀主席", "genre": "踏莎行", "body": "百姓回眸，\n伟人诞日。\n满怀敬仰情难抑。\n先贤挖井水甘甜，\n润泽华夏民长记。\n没有当初，\n何来今世。\n高楼万丈凭基起。\n倚栏远眺俏川原，\n韶山冲里云空丽。 ​​​", "date": "2022.12.26", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4850843817351930 - 踏莎行 缅怀主席/01.jpg", "冰雪诗词_全部图片/4850843817351930 - 踏莎行 缅怀主席/02.jpg", "冰雪诗词_全部图片/4850843817351930 - 踏莎行 缅怀主席/03.jpg"]}, {"id": "4851211234444294", "title": "长相思·吟怀", "genre": "长相思", "body": "烧已停，痛已停。\n阳过身疲静养中。\n魂归气脉通。\n忆亲情，念亲情。\n暖意丝丝心底生。\n爱能溶化冰。 ​​​", "date": "2022.12.27", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4851211234444294 - 长相思       吟怀/01.jpg"]}, {"id": "4851568291096693", "title": "阮郎归·岁暮吟", "genre": "阮郎归", "body": "疫情反复已三年，\n放开羊满川。\n东西南北起风烟，\n茫然一瞬间。\n霜雪后，是春妍。\n金鱼白浪翻。\n桃花杏雨碧云天，\n蝶莺舞陌阡。 ​​​", "date": "2022.12.28", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4851568291096693 - 阮郎归    岁暮吟/01.jpg"]}, {"id": "4851930960232962", "title": "满庭芳·新年顾望", "genre": "满庭芳", "body": "鸡晓钟昏，天寒岁暮，时光流逝无踪。\n举头回望，日月亦匆匆。\n先是携孙迪化，清明后、古冶京城。\n廉州路，来回几度，南北似征鸿。\n五人居四地，春秋相念，寒暑为情。\n更二老，音容总在心中。\n千里几头难顾，恨冠疫、年底疯行。\n东风劲，阴霾吹散，待旭日高升。", "date": "2022.12.29", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4851930960232962 - 满庭芳    新年顾望/01.jpg"]}, {"id": "4852292900097588", "title": "五绝·晓吟", "genre": "五绝", "body": "腊日年年过，\n今朝味不同。\n冠虫还肆虐，\n阵阵乱心情。 ​​​", "date": "2022.12.30", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4852292900097588 - 五绝    晓吟/01.jpg"]}, {"id": "4852742558584209", "title": "西江月·岁暮闲吟", "genre": "西江月", "body": "今日夕阳辞岁，\n明朝晓月迎年。\n鬓边霜雪漫趋前，\n闲看风轻云淡。\n侍老弄孙家乐，\n咏诗挥墨心欢。\n远离尘世少忧烦，\n窗下开怀把盏。 ​​​", "date": "2022.12.31", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4852742558584209 - 西江月 岁暮闲吟/01.jpg"]}, {"id": "4853038579192223", "title": "阮郎归·元旦吟", "genre": "阮郎归", "body": "终于岁杪喜相逢，\n祖孙别样情。\n依约同日到京城，\n冀边万里晴。\n阳康后，自由行，\n筹谋皆可能。\n三年羁绊尽随风，\n迎春畅想中。 ​​​", "date": "2023.01.01", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4853038579192223 - 阮郎归    元旦吟/01.jpg", "冰雪诗词_全部图片/4853038579192223 - 阮郎归    元旦吟/02.jpg"]}, {"id": "4853385108919039", "title": "浣溪沙·新年吟望", "genre": "浣溪沙", "body": "三载猖狂疫渐消，\n出行随愿乐滔滔。\n京城元旦涌人潮。\n旧岁回头多少事，\n新年昂首路千条。\n人生斑鬓任逍遥。 ​​​", "date": "2023.01.02", "themes": ["四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4853385108919039 - 浣溪沙 新年吟望/01.jpg"]}, {"id": "4853745718397844", "title": "浣溪沙·孙女归来", "genre": "浣溪沙", "body": "万里回家喜又惊，\n东瞧西看语随行。\n眉扬手舞表心情。\n玩具平铺挨个数，\n儿书翻遍点图形。\n可怜别久再相逢。 ​​​", "date": "2023.01.03", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4853745718397844 - 浣溪沙 孙女归来/01.jpg"]}, {"id": "4854108072709105", "title": "七绝·冬夜吟", "genre": "七绝", "body": "一轮明月数颗星，\n寒夜清辉漫九空。\n阳后身心多有变，\n群楼庭院少人行。 ​​​", "date": "2023.01.04", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4854108072709105 - 七绝       冬夜吟/01.jpg"]}, {"id": "4854467730343684", "title": "浣溪沙·小孙女", "genre": "浣溪沙", "body": "别久重逢长进多，\n童言稚语似长河。\n拼图认字欲飞车。\n懂话察颜观脸色，\n会思善记爱听歌。\n朱唇笑靥眼婆娑。 ​​​", "date": "2023.01.05", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4854467730343684 - 浣溪沙    小孙女/01.jpg"]}, {"id": "4854829963021552", "title": "七绝·闲问", "genre": "七绝", "body": "一冬未见雪花飘，\n满目街头草木凋。\n难道天公今亦老，\n忘规逾矩使昏招？ ​​​", "date": "2023.01.06", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4854829963021552 - 七绝           闲问/01.jpg"]}, {"id": "4855190706979291", "title": "七绝·腊十五夜吟", "genre": "七绝", "body": "天上月圆人未圆，\n明朝团聚晚餐前。\n一家五口京城会，\n短暂相逢怎个欢！ ​​​", "date": "2023.01.07", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4855190706979291 - 七绝 腊十五夜吟/01.jpg"]}, {"id": "4855555996517321", "title": "七绝·十六夜吟", "genre": "七绝", "body": "京城古冶往来还，\n千里晨辉晚照间。\n接上夫人孙女悦，\n迎门巧嘴惹心甜。 ​​​", "date": "2023.01.08", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4855555996517321 - 七绝    十六夜吟/01.jpg"]}, {"id": "4855995145389308", "title": "七绝·腊夜吟", "genre": "七绝", "body": "五口团圆只一天，\n爷爷奶奶伴窗前。\n宝妈公干边陲去，\n幼女思亲怪可怜。 ​​​", "date": "2023.01.09", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4855995145389308 - 七绝        腊夜吟/01.jpg"]}, {"id": "4856284823947437", "title": "七绝·吟望", "genre": "七绝", "body": "尘霾散落九霄明，\n妖雾摧开玉宇清。\n更起祥云千万里，\n神州大地欲春风。 ​​​", "date": "2023.01.10", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4856284823947437 - 七绝           吟望/01.jpg"]}, {"id": "4856642628223180", "title": "小重山·晨练感杯", "genre": "小重山", "body": "晓月偏西依旧明。出门寒气甚、冷清清。从前晨练影重重。刀枪剑、歌漫舞红缨。\n阳过梦难成。凭空添恐惧、病无情。人多调养待春生。花开后、庭院喜盈盈。 ​​​", "date": "2023.01.11", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4856642628223180 - 小重山         晨练感杯/01.jpg"]}, {"id": "4857005396985230", "title": "蝶恋花·赠维真", "genre": "蝶恋花", "body": "夜饮归来人不寐。\n欲闹青啤，\n往事还回味。\n无奈途中朋隐退，\n寒灯独自仍无睡。\n提笔抒怀心里累。\n转眼浮生，\n叶落窗前醉。\n漫卷西风飘又坠，\n别来何日能相会。 ​​​", "date": "2023.01.12", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4857005396985230 - 蝶恋花    赠维真/01.jpg"]}, {"id": "4857366846115042", "title": "七绝·吟望", "genre": "七绝", "body": "几片雪花飘九空，\n降临京洛霎无踪。\n天公也弄稀松事，\n难怪人间有懒虫。 ​​​", "date": "2023.01.13", "themes": ["羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4857366846115042 - 七绝           吟望/01.jpg"]}, {"id": "4857729028719897", "title": "望海潮·小年感怀", "genre": "望海潮", "body": "冠虫三载，横行岁暮，肆侵万户千家。\n欺叟害童，滋男扰女，攻城掠地无涯。\n神药亦浮夸。价高争付款，疯抢连花。\n布洛芬无，悲医护困累交加。\n中招筋骨酸麻。更头疼欲裂，嗓痛音沙。\n咳嗽难消，低烧不退，可怜耆老娇娃。\n愁苦厌餐茶。辗转宵无寐，期盼朝霞。\n阳过神疲体弱，何日竞芳华。", "date": "2023.01.14", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4857729028719897 - 望海潮        小年感怀/01.jpg"]}, {"id": "4858091349477122", "title": "七绝·闲问", "genre": "七绝", "body": "小年南北不同天，\n自古传来必有缘。\n谁解个中多少趣，\n与人分享乐屏前。 ​​​", "date": "2023.01.15", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4858091349477122 - 七绝          闲问/01.jpg"]}, {"id": "4858454033828868", "title": "七绝·吟望", "genre": "七绝", "body": "朔风翻卷刀割面，\n败叶枯枝送虎年。\n一点寒梅迎卯兔，\n思乡顾望不成欢。 ​​​", "date": "2023.01.16", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4858454033828868 - 七绝           吟望/01.jpg"]}, {"id": "4858817319799439", "title": "采桑子·寄友", "genre": "采桑子", "body": "石门别久京都聚。\n廿载重逢，\n未变音容。\n岁月无痕情意浓。\n疫虫阻挡难相见。\n几欲成行，\n终是无功。\n今日开怀酒色红。 ​​​", "date": "2023.01.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4858817319799439 - 采桑子       寄友/01.jpg"]}, {"id": "4859180320559662", "title": "鹧鸪天·吟望抒怀", "genre": "鹧鸪天", "body": "临近年关灯火红，\n通宵庭院树窗明。\n鹊鸦惊眼啼华影，\n枝叶舒怀舞瑞风。\n人阳过，愿趋同。\n南亲北友尽相逢。\n共迎卯兔新春日，\n畅叙三秋梦里情。 ​​​", "date": "2023.01.18", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4859180320559662 - 鹧鸪天 吟望抒怀/01.jpg"]}, {"id": "4859905871970940", "title": "七绝·晓行", "genre": "七绝", "body": "戴月披星返故乡，\n驱车独自沐霞光。\n阳康来往心无忌，\n陪伴爹娘梦里香。 ​​​", "date": "2023.01.20", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4859905871970940 - 七绝          晓行/01.jpg"]}, {"id": "4860276107904347", "title": "太常引·除夕", "genre": "太常引", "body": "久违鞭炮漫长空。\n户户挂红灯。\n福字映门厅。\n煮煎炒、新年味浓。\n返乡游子，\n居家老少，\n欢笑聚堂中。\n守岁望花红。\n团圆夜、深深意情。 ​​​", "date": "2023.01.21", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4860276107904347 - 太常引           除夕/01.jpg"]}, {"id": "4860643578217024", "title": "七绝·元日", "genre": "七绝", "body": "红灯倚树喜冲天，\n鞭炮争鸣过大年。\n玉兔飞临辞虎岁，\n人间春始物华妍。\n祝大家新年吉祥！ ​​​", "date": "2023.01.22", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4860643578217024 - 七绝     元日/01.jpg"]}, {"id": "4860997024613243", "title": "七律·春晚", "genre": "七律", "body": "昔日九州年夜餐，\n大江南北庆团圆。\n相声捧逗舒心乐，\n魔术虚实眼欲穿。\n妙语撩人人不寐，\n明星搞笑笑翻天。\n而今却似白开水，\n寡味偏凉惹胃寒。 ​​​", "date": "2023.01.23", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4860997024613243 - 七律           春晚/01.jpg"]}, {"id": "4861353477540021", "title": "五律·初二待亲", "genre": "五律", "body": "三年愁未聚，今日喜相逢。\n心语无穷尽，芳樽满莫停。\n酒香情更切，胆壮脸微红。\n频怪醇醪浅，骄嗔地不平。 ​​​", "date": "2023.01.24", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4861353477540021 - 五律        初二待亲/01.jpg"]}, {"id": "4861716145899620", "title": "七绝·闻讯吟", "genre": "七绝", "body": "养儿防老古来言，\n真到用时能向前？\n多是又忙孙辈事，\n费心上下两为难。 ​​​", "date": "2023.01.25", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4861716145899620 - 七绝       闻讯吟/01.jpg"]}, {"id": "4862079158191684", "title": "卜算子·初五", "genre": "卜算子", "body": "鞭炮映长空，\n门敞财神到。\n玉兔飞临带瑞风，\n山水人欢笑。\n三载疫猖狂，\n今个真奇妙。\n虎过瘟虫影迹无，\n剩有梅花悄。 ​​​", "date": "2023.01.26", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4862079158191684 - 卜算子       初五/01.jpg"]}, {"id": "4862443659987763", "title": "卜算子·乡情", "genre": "卜算子", "body": "弯月笑红灯，\n夜色辉相映。\n回到家乡过大年，\n斑鬓春心动。\n发小恁多情，\n交盏欢言盛。\n畅饮醇香醉不知，\n挽手欹窗并。 ​​​", "date": "2023.01.27", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4862443659987763 - 卜算子      乡情/01.jpg"]}, {"id": "4862812697134901", "title": "蝶恋花·开年", "genre": "蝶恋花", "body": "破五纳财迎六顺。\n转眼新春，万众情怀奋。\n抖擞身心浑是劲，\n今朝阔步朝前奔。\n人涌车流锣鼓震，\n店铺开张，筹划周思甚。\n紫气东来春水近，\n人间岁月交鸿运。 ​​​", "date": "2023.01.28", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4862812697134901 - 蝶恋花             开年/01.jpg"]}, {"id": "4863171746333533", "title": "七绝·闲吟", "genre": "七绝", "body": "尘絮漫天凭借风，\n添柴方使火通红。\n人推神助功名就，\n不懈精心事可成。 ​​​", "date": "2023.01.29", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4863171746333533 - 七绝           闲吟/01.jpg"]}, {"id": "4863528307264305", "title": "喜团圆·过年", "genre": "喜团圆", "body": "回家守岁，荧屏舞动，厅案飘香。\n楼窗映衬烟花炫，虎归兔繁忙。\n尊贤祭祖，迎亲待友，一派和祥。\n匆匆假日，离亲欲返，略感心伤。 ​​​", "date": "2023.01.30", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4863528307264305 - 喜团圆           过年/01.jpg"]}, {"id": "4863889852074702", "title": "柳含烟·春瑞", "genre": "柳含烟", "body": "迎仙兔，庆新春。\n破五祈求六顺。\n响鞭花炮映朱门，\n纳财神。\n紫气东来祥瑞降，\n树杪莺鸣燕唱。\n熏风袅袅吻家人，\n喜双亲。 ​​​", "date": "2023.01.31", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4863889852074702 - 柳含烟       春瑞/01.jpg"]}, {"id": "4864252554511569", "title": "七绝·新春吟", "genre": "七绝", "body": "午后高阳檐下暖，\n阶前闲坐身心懒。\n过年惬意好风光，\n无奈将行京邑远。 ​​​", "date": "2023.02.01", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4864252554511569 - 七绝        新春吟/01.jpg"]}, {"id": "4864618419192175", "title": "七绝·惜春", "genre": "七绝", "body": "光阴总是牵君手，\n日月多情催我走。\n短暂人生更恋春，\n谁如天地恒长久。 ​​​", "date": "2023.02.02", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4864618419192175 - 七绝           惜春/01.jpg"]}, {"id": "4864978261643570", "title": "五律·别有思", "genre": "五律", "body": "入夜乡村静，\n时闻犬吠声。\n花墙移月影，\n街角闪红灯。\n回首新年过，\n抬头望斗星。\n寒家穷不舍，\n最念是亲情。 ​​​", "date": "2023.02.03", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4864978261643570 - 五律 别有思/01.jpg"]}, {"id": "4865338854605395", "title": "喜团圆·祖孙乐", "genre": "喜团圆", "body": "驱车半晌，京都相见，日暖人欢。\n乖孙手舞双眉悄，笑音绕堂前。\n别离半月，虎踪隐没，玉兔翩翩。\n娇灵幼女，身心俱进，动静嫣然。 ​​​", "date": "2023.02.04", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4865338854605395 - 喜团圆          祖孙乐/01.jpg"]}, {"id": "4865720422762410", "title": "采桑子·上元吟", "genre": "采桑子", "body": "春风初起元宵闹。\n聚散京城，\n别样心情。\n戴月披星古冶行。\n爷来奶又今朝去。\n无奈匆匆，\n何日相逢。\n别却娇孙晓梦中。 ​​​", "date": "2023.02.05", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4865720422762410 - 采桑子    上元吟/01.jpg"]}, {"id": "4866070034781366", "title": "七律·元夕寄妻", "genre": "七律", "body": "京城古冶两云天，\n银发贤淑不住闲。\n侍奉老娘迷昼夜，\n管陪孙女制衣餐。\n元宵昏晓人来去，\n远处家亲心苦酸。\n明月清辉同举望，\n寄情千里共婵娟。 ​​​", "date": "2023.02.06", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4866070034781366 - 七律    元夕寄妻/01.jpg"]}, {"id": "4866425577016072", "title": "七绝·遥望闲吟", "genre": "七绝", "body": "气球飘落惹舆情，\n美相神州梦未成。\n真假终究多少事，\n何方拆解细说清。 ​​​", "date": "2023.02.07", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4866425577016072 - 七绝    遥望闲吟/01.jpg"]}, {"id": "4866791174834713", "title": "七绝·新春晓吟", "genre": "七绝", "body": "残月西悬拂晓明，\n上元已过少花灯。\n风吹寂寞空庭院，\n晨练天寒独自行。 ​​​", "date": "2023.02.08", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4866791174834713 - 七绝   新春晓吟/01.jpg"]}, {"id": "4867151016496167", "title": "踏莎行·新春别", "genre": "踏莎行", "body": "奶奶离开，\n妈妈远去。\n娇孙日暮添思绪。\n与爷玩耍亦分神，\n欲眠伤感呢喃语。\n冬雪消融，\n春风和煦。\n路边小草依稀绿。\n莺欢燕舞柳芽新，\n一家何日能相聚。 ​​​", "date": "2023.02.09", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4867151016496167 - 踏莎行    新春别/01.jpg"]}, {"id": "4867513223221369", "title": "七绝·正月飞花", "genre": "七绝", "body": "早春初雪兆丰年，\n点缀梅枝鸟雀欢。\n树草迓迎童稚喜，\n滋生万物竞新颜。 ​​​", "date": "2023.02.10", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4867513223221369 - 七绝    正月飞花/01.jpg"]}, {"id": "4867877003333693", "title": "七绝·闻事吟", "genre": "七绝", "body": "名英之后招人骂，\n多是偏离祖辈心。\n头顶光环谋小利，\n定然污色染金身 ​​​", "date": "2023.02.11", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4867877003333693 - 七绝       闻事吟/01.jpg"]}, {"id": "4868242097047104", "title": "采桑子·悦游", "genre": "采桑子", "body": "乖孙向望芳园里。\n嘴上黄鸭，\n梦里黄鸭。\n昨日三番把弄它。\n稚童堂聚心怀旷。\n娇影如花，\n笑靥如花。\n各处流连忘却家。 ​​​", "date": "2023.02.12", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4868242097047104 - 采桑子       悦游/01.jpg", "冰雪诗词_全部图片/4868242097047104 - 采桑子       悦游/02.jpg", "冰雪诗词_全部图片/4868242097047104 - 采桑子       悦游/03.jpg"]}, {"id": "4868600579754755", "title": "五绝·晓吟", "genre": "五绝", "body": "春雪驱尘尽，\n银辉映九空。\n霁晴霞色漫，\n万物复萌生。 ​​​", "date": "2023.02.13", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4868600579754755 - 五绝    晓吟/01.jpg"]}, {"id": "4868963044164502", "title": "七绝·网事吟", "genre": "七绝", "body": "何来无事作一休，\n笑料频添己不愁。\n顶上光环风掠去，\n花冠跌落老秃头。 ​​​", "date": "2023.02.14", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4868963044164502 - 七绝       网事吟/01.jpg"]}, {"id": "4869325033572708", "title": "七绝·春日闲吟", "genre": "七绝", "body": "口力疯行网络间，\n各方角色诉心言。\n偷风盗雨争名利，\n搅乱云空昼夜天。 ​​​", "date": "2023.02.15", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4869325033572708 - 七绝    春日闲吟/01.jpg"]}, {"id": "4869688082825598", "title": "七绝·春望", "genre": "七绝", "body": "残雪消融临雨水，\n余寒渐退柳芽生。\n人间烟火迎春旺，\n庭院梅梢啭鹊莺。 ​​​", "date": "2023.02.16", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4869688082825598 - 七绝          春望/01.jpg"]}, {"id": "4870050760101123", "title": "五绝·春晓", "genre": "五绝", "body": "起闻莺鹊语，\n旭日耀东方。\n庭院清新气，\n微风袅瑞祥。 ​​​", "date": "2023.02.17", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4870050760101123 - 五绝    春晓/01.jpg"]}, {"id": "4870412636260755", "title": "临江仙·何苦", "genre": "临江仙", "body": "两弹一星功已定，\n痴和于敏齐名。\n英雄逝去怎知声。\n奈何民不应，\n神鬼道非同。\n倚老狂言愚蠢事，\n先前人设残崩。\n模糊老底被拎清。\n耆年当本分，\n闲淡度余生。 ​​​", "date": "2023.02.18", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4870412636260755 - 临江仙       何苦/01.jpg"]}, {"id": "4870776521492298", "title": "七绝·时令吟", "genre": "七绝", "body": "喜逢雨水物华新，\n垂柳摇风惹翠禽。\n睡草惊光尖乍绿，\n慵人晓起自精神。 ​​​", "date": "2023.02.19", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4870776521492298 - 七绝        时令吟/01.jpg"]}, {"id": "4871137734955401", "title": "七绝·二把刀", "genre": "七绝", "body": "爷爷水饺乖孙爱，\n奶奶遥闻饭菜香。\n老少欢玩心魄定，\n半拉厨艺不亏肠。 ​​​", "date": "2023.02.20", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4871137734955401 - 七绝       二把刀/01.jpg"]}, {"id": "4871499397730309", "title": "七绝·二月二", "genre": "七绝", "body": "龙抬头日望山川，\n春意欣盈九陌妍。\n如水车流驰远近，\n离枝燕鹊舞蹁跹。 ​​​", "date": "2023.02.21", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4871499397730309 - 七绝       二月二/01.jpg"]}, {"id": "4871861849294381", "title": "七绝·吟望", "genre": "七绝", "body": "飞龙昂首冲云汉，\n回瞰山河遍处春。\n南北风光虽迥异，\n鲜花青睐早行人。 ​​​", "date": "2023.02.22", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4871861849294381 - 七绝           吟望/01.jpg"]}, {"id": "4872237045780401", "title": "五绝·晨吟", "genre": "五绝", "body": "故人托梦来，\n往事绕心怀。\n晓敬尘封酒，\n举杯云雾开。 ​​​", "date": "2023.02.23", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4872237045780401 - 五绝    晨吟/01.jpg"]}, {"id": "4872590302118447", "title": "七绝·闻事吟", "genre": "七绝", "body": "为师不正道将偏，\n莫怪登台赤子言。\n常羡他人堂上论，\n作回自己讲尊严。 ​​​", "date": "2023.02.24", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4872590302118447 - 七绝        闻事吟/01.jpg"]}, {"id": "4872950853140819", "title": "七绝·春晓吟", "genre": "七绝", "body": "清晨五谷磨成浆，\n滋养心田暖胃肠。\n日月精华盈宇宙，\n人生智慧脑中藏。 ​​​", "date": "2023.02.25", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4872950853140819 - 七绝       春晓吟/01.jpg"]}, {"id": "4873349828449168", "title": "南乡子·娇孙趣事", "genre": "南乡子", "body": "假日乐无边，\n餐饭疏思忘睡眠。\n宵昼耍疯难住手。\n何缘，\n妈爸今朝有空闲。\n童稚性天然，\n父母身旁任是欢。\n过后岂知爷奶苦。\n难言，\n诱导多时到以前。 ​​​", "date": "2023.02.26", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4873349828449168 - 南乡子 娇孙趣事/01.jpg"]}, {"id": "4873673913926167", "title": "七绝·湖畔早春", "genre": "七绝", "body": "轻柔杨柳映残冰，\n倒影横斜泮水中。\n乍暖还寒郊野处，\n云空万里日辉红。 ​​​", "date": "2023.02.27", "themes": ["山水田园与闲居雅趣", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4873673913926167 - 七绝    湖畔早春/01.jpg"]}, {"id": "4874053356359757", "title": "七绝·见有思", "genre": "七绝", "body": "贪黑起早上学堂，\n父母劳神里外忙。\n恨不分出灵巧手，\n随身儿女著文章。 ​​​", "date": "2023.02.28", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4874053356359757 - 七绝       见有思/01.jpg"]}, {"id": "4874399851480649", "title": "玉楼春·798艺术区", "genre": "玉楼春", "body": "站在火车头上望，\n孙女扬眉心底旷。\n昔时荒废一工房，\n今日涂装翻有样。\n思路转弯行走畅，\n杨柳春风新气象。\n商家游客两相宜，\n掘土为金烟火旺。 ​​​", "date": "2023.03.01", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4874399851480649 - 玉楼春 798艺术区/01.jpg", "冰雪诗词_全部图片/4874399851480649 - 玉楼春 798艺术区/02.jpg", "冰雪诗词_全部图片/4874399851480649 - 玉楼春 798艺术区/03.jpg", "冰雪诗词_全部图片/4874399851480649 - 玉楼春 798艺术区/04.jpg"]}, {"id": "4874862369705949", "title": "七绝·观展有寄", "genre": "七绝", "body": "解脱双脚四轮行，\n海角天涯任纵横。\n以电代油风势劲，\n烟霾消散宇寰清。 ​​​", "date": "2023.03.02", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4874862369705949 - 七绝   观展有寄/01.jpg", "冰雪诗词_全部图片/4874862369705949 - 七绝   观展有寄/02.jpg", "冰雪诗词_全部图片/4874862369705949 - 七绝   观展有寄/03.jpg", "冰雪诗词_全部图片/4874862369705949 - 七绝   观展有寄/04.jpg", "冰雪诗词_全部图片/4874862369705949 - 七绝   观展有寄/05.jpg", "冰雪诗词_全部图片/4874862369705949 - 七绝   观展有寄/06.jpg"]}, {"id": "4875123666717567", "title": "蝶恋花·晓望", "genre": "蝶恋花", "body": "寒褪阳升风色暖。\n雨水初临，\n草木新芽短。\n放眼江河冰欲泮，\n游人郊野寻春面。\n两会将开翘首盼。\n又聚群英，\n争把筹谋献。\n疫过民生千百唤，\n心期国策金光灿。 ​​​", "date": "2023.03.03", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4875123666717567 - 蝶恋花        晓望/01.jpg"]}, {"id": "4875486238610012", "title": "五绝·动车有感", "genre": "五绝", "body": "窗外晓云飞，\n予心似箭归。\n扬眉千里路，\n一日几来回。 ​​​", "date": "2023.03.04", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4875486238610012 - 五绝 动车有感/01.jpg"]}, {"id": "4875848459486988", "title": "七绝·雷锋", "genre": "七绝", "body": "为民旗帜航标塔，\n六秩春风火焰红。\n照亮世间山海路，\n神州百姓一心灯。 ​​​", "date": "2023.03.05", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4875848459486988 - 七绝           雷锋/01.jpg"]}, {"id": "4876215418619063", "title": "七绝·节令吟", "genre": "七绝", "body": "未响惊雷虫自醒，\n回眸栖草已然青。\n抬头天际风云丽，\n抖擞泥身快乐行。 ​​​", "date": "2023.03.06", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4876215418619063 - ​七绝       节令吟/01.jpg"]}, {"id": "4876579740320620", "title": "如梦令·仲春", "genre": "如梦令", "body": "庭院细风吹荡，\n杨柳新芽漫放。\n远处起雷声，\n地下虫惊争上。\n张望，张望。\n睡眼惺忪相向。 ​​​", "date": "2023.03.07", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4876579740320620 - 如梦令    仲春/01.jpg"]}, {"id": "4876936028883811", "title": "七绝·三八有寄", "genre": "七绝", "body": "春风浩荡百花妍，\n细水柔条舞陌阡。\n蝶色莺声云欲醉，\n朝霞红透半边天。 ​​​", "date": "2023.03.08", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4876936028883811 - 七绝    三八有寄/01.jpg"]}, {"id": "4877300757431327", "title": "七绝·新官秀", "genre": "七绝", "body": "倾心妙语论当前，\n身段绵柔底气传。\n袖里藏刀山海去，\n随时防备野狼缠。 ​​​", "date": "2023.03.09", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4877300757431327 - ​七绝       新官秀/01.jpg"]}, {"id": "4877670070620473", "title": "采桑子·春日抒怀", "genre": "采桑子", "body": "神州两会环球望。\n要事连番，\n花絮蹁跹。\n各路媒喉喊破天。\n东风强劲云空阔。\n鸦闹莺欢，\n细韵粗弦。\n合唱吾朝卯兔年。 ​​​", "date": "2023.03.10", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4877670070620473 - 采桑子 春日抒怀/01.jpg"]}, {"id": "4878443504468371", "title": "采桑子·骤降", "genre": "采桑子", "body": "仲春又遇寒潮甚。\n日月无情，\n草木皆惊。\n老少添衣避冷风。\n谁人能管天公事！\n南北西东，\n莫不愁容。\n嫩蕾新芽晓泪盈。 ​​​", "date": "2023.03.12", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4878443504468371 - 采桑子       骤降/01.jpg"]}, {"id": "4878874457150676", "title": "七绝·祖孙古冶行", "genre": "七绝", "body": "离京寻奶到唐山，\n身境新奇俏语连。\n西望东瞧闲不住，\n扬眉抖腕舞蹁跹。 ​​​", "date": "2023.03.13", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4878874457150676 - 七绝 祖孙古冶行/01.jpg", "冰雪诗词_全部图片/4878874457150676 - 七绝 祖孙古冶行/02.jpg", "冰雪诗词_全部图片/4878874457150676 - 七绝 祖孙古冶行/03.jpg"]}, {"id": "4879126714123094", "title": "七绝·三月春", "genre": "七绝", "body": "一夜风来满眼花，\n芳菲染酷万千家。\n沟红岭翠黄莺啭，\n漫舞蜂蝶暖水鸭。 ​​​", "date": "2023.03.14", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4879126714123094 - 七绝       三月春/01.jpg"]}, {"id": "4879967094048538", "title": "七绝·春日闲吟", "genre": "七绝", "body": "漫漫人生世路宽，\n直通不畅走坡弯。\n历经坎坷心怀壮，\n斑鬓深情语少年。 ​​​", "date": "2023.03.16", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4879967094048538 - 七绝    春日闲吟/01.jpg"]}, {"id": "4881288727105204", "title": "七绝·晨吟", "genre": "七绝", "body": "晓风细雨却尘埃，\n红日爬升霞色开。\n缓步迎来春暖意，\n梅香莺语入心怀。 ​​​", "date": "2023.03.20", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4881288727105204 - 七绝           晨吟/01.jpg"]}, {"id": "4881651840585271", "title": "七绝·春分", "genre": "七绝", "body": "昼夜均开早晚寒，\n午时微汗透轻衫。\n繁花各色眸前亮，\n翠鸟清音向远天。 ​​​", "date": "2023.03.21", "themes": ["四时风光与节气流转"], "images": ["冰雪诗词_全部图片/4881651840585271 - ​七绝           春分/01.jpg"]}, {"id": "4882114719257327", "title": "七绝·沙尘暴", "genre": "七绝", "body": "飞沙蔽日漫春庭，\n晓色昏黄柳荡风。\n偶有乌鸦头顶过，\n斜身抖落土一层。 ​​​", "date": "2023.03.22", "themes": ["山水田园与闲居雅趣", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4882114719257327 - 七绝       沙尘暴/01.jpg"]}, {"id": "4882411265984319", "title": "七绝·春日闲吟", "genre": "七绝", "body": "邻居走近有人愁，\n歪嘴酸言苦上头。\n灯塔无光虚摆设，\n仰凭北斗宇寰游。 ​​​", "date": "2023.03.23", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4882411265984319 - 七绝    春日闲吟/01.jpg"]}, {"id": "4882759871629652", "title": "七绝·春思", "genre": "七绝", "body": "昼夜短长交替行，\n世间不变是亲情。\n儿今斑鬓娘犹念，\n二老频来我梦中。 ​​​", "date": "2023.03.24", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4882759871629652 - 七绝           春思/01.jpg"]}, {"id": "4883176223410294", "title": "七绝·悼友", "genre": "七绝", "body": "噩耗如雷晓色昏，\n悲闻昨夜逝文斌。\n中天家业轰然变，\n难掩双颊泪水痕。 ​​​", "date": "2023.03.25", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4883176223410294 - 七绝           悼友/01.jpg"]}, {"id": "4883634437233582", "title": "蝶恋花·芳香", "genre": "蝶恋花", "body": "孙女两周留玉照。\n窈窕身姿，\n浅靥朱唇俏。\n秀发明眸娇若鸟，\n扬眉回首频微笑。\n紫色花衣香袅袅。\n光彩宜人，\n映衬春来早。\n似是瑶台花正好，\n闲来把看千般巧。\n​ ​​​", "date": "2023.03.26", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4883634437233582 - 蝶恋花        芳香/01.jpg", "冰雪诗词_全部图片/4883634437233582 - 蝶恋花        芳香/02.jpg", "冰雪诗词_全部图片/4883634437233582 - 蝶恋花        芳香/03.jpg", "冰雪诗词_全部图片/4883634437233582 - 蝶恋花        芳香/04.jpg", "冰雪诗词_全部图片/4883634437233582 - 蝶恋花        芳香/05.jpg", "冰雪诗词_全部图片/4883634437233582 - 蝶恋花        芳香/06.jpg"]}, {"id": "4883826112725716", "title": "太常引·蝶变", "genre": "太常引", "body": "春来闲逛首钢园。\n翠柳映蓝天。\n不见旧尘烟。\n老楼塔，容光焕然。\n时逢假日，车流如水，\n游客悦桃源。\n鸟雀啭声欢。\n明湖畔，风吹画船。 ​​​", "date": "2023.03.27", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4883826112725716 - ​   太常引         蝶变/01.jpg", "冰雪诗词_全部图片/4883826112725716 - ​   太常引         蝶变/02.jpg", "冰雪诗词_全部图片/4883826112725716 - ​   太常引         蝶变/03.jpg", "冰雪诗词_全部图片/4883826112725716 - ​   太常引         蝶变/04.jpg"]}, {"id": "4884182922432409", "title": "五绝·日暮吟", "genre": "五绝", "body": "花草有兴衰，\n雪融春又来。\n暗香浮动处，\n不似旧心怀。 ​​​", "date": "2023.03.28", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4884182922432409 - 五绝 日暮吟/01.jpg"]}, {"id": "4884547135079892", "title": "浪淘沙·闻事吟", "genre": "浪淘沙", "body": "马氏访家乡，\n祭祖匆忙。\n中山陵处尽春光。\n漫步东西多少事，\n情暖中肠。\n两岸久离殇，\n独子猖狂。\n言行卑鄙洗心房。\n唯有交流知远近，\n血脉悠长。 ​​​", "date": "2023.03.29", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4884547135079892 - 浪淘沙     闻事吟/01.jpg"]}, {"id": "4884908239224980", "title": "浪淘沙·春日吟", "genre": "浪淘沙", "body": "风暖百花开，\n景色新裁。\n缤纷五彩荡心怀。\n百子湾园闲度步，\n绕柳环台。\n玩稚乐无猜，\n未染尘埃。\n个中或有栋梁才。\n奋起腾飞翔宇宙，\n期待将来。 ​​​", "date": "2023.03.30", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4884908239224980 - 浪淘沙    春日吟/01.jpg"]}, {"id": "4885275916110977", "title": "浪淘沙·闻事寄怀", "genre": "浪淘沙", "body": "蔡女美洲行，\n欲借西风。\n跳梁贼子怕天明。\n被作刀枪难自主，\n掌上悲鸣。\n两岸壑沟横，\n不久将平。\n污涛浊浪势难成。\n雨过长空霞色丽，\n海阔天晴。 ​​​", "date": "2023.03.31", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4885275916110977 - 浪淘沙 闻事寄怀/01.jpg"]}, {"id": "4885647996752137", "title": "浪淘沙·春晓寄怀", "genre": "浪淘沙", "body": "转眼又清明，\n草木含情。\n纸烟漫卷笼悲声。\n祭祖抒怀思往事，\n泪染哀容。\n乡梦寄春风，\n万里飞鸿。\n将归故里意尤浓。\n南望廉州心里念，\n父老安宁。 ​​​", "date": "2023.04.01", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4885647996752137 - 浪淘沙 春晓寄怀/01.jpg"]}, {"id": "4886146493975654", "title": "七绝·闻事吟", "genre": "七绝", "body": "认贼作父有私心，\n图霸家山梦岂真。\n风雨将来天地暗，\n摇枝落叶卷独根。 ​​​", "date": "2023.04.02", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4886146493975654 - 七绝       闻事吟/01.jpg"]}, {"id": "4886496676937863", "title": "七绝·和霜雁飞", "genre": "七绝", "body": "人间四月漫飞花，\n袅袅清香入万家。\n更有梨园千树雪，\n翩翩起舞吻篱笆。\n诗友原玉：\n七绝           白梅\n霜雁飞\n满身玉洁压梨花，\n独自盛开山野家。\n春染枝头关不住，\n暗香一缕过篱笆。 ​​​", "date": "2023.04.03", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4886496676937863 - 七绝    和霜雁飞/01.jpg"]}, {"id": "4886792073906669", "title": "醉花阴·春晓吟望", "genre": "醉花阴", "body": "每近清明天堕雨，\n和泪浇愁绪。\n烟火袅云空，\n灰烬犹悲，\n痛向膺田聚。\n挚情最是儿男女，\n长跪坟前语。\n岁月刻心痕，\n久久相思，\n音貌难将去。 ​​​", "date": "2023.04.04", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4886792073906669 - 醉花阴 春晓吟望/01.jpg"]}, {"id": "4887087650178244", "title": "太常引·清明寄怀", "genre": "太常引", "body": "神州春祭慰英灵，\n天雨洗长空。\n山水柳青青。\n遍华夏，\n红旗五星。\n万千先烈，\n长眠地下，\n方使有今生。\n门户可安宁。\n龙腾跃，\n江明宇清。 ​​​", "date": "2023.04.05", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4887087650178244 - 太常引 清明寄怀/01.jpg"]}, {"id": "4887446250586784", "title": "天净沙·清明", "genre": "天净沙", "body": "不期病扰娇孙，\n返乡之愿难真。\n彻夜愁思染鬓。\n晓来前问，\n稚声驱散烟云。 ​​​", "date": "2023.04.06", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4887446250586784 - 天净沙    清明/01.jpg"]}, {"id": "4887925936096933", "title": "采桑子·遥望有思", "genre": "采桑子", "body": "又闻两岸雷声起。\n风雨飘摇，\n浪里舟桥。\n独岛狼烟待水浇。\n蒋家后代人犹在。\n朽木难雕，\n绿寇成妖。\n玩火终将被火烧。 ​​​", "date": "2023.04.07", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4887925936096933 - 采桑子 遥望有思/01.jpg"]}, {"id": "4888174029703506", "title": "七绝·春日闲吟", "genre": "七绝", "body": "笑对风霜雪染头，\n老来岁月少忧愁。\n与孙为伴光阴逝，\n弯背躬身无所求。 ​​​", "date": "2023.04.08", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4888174029703506 - 七绝    春日闲吟/01.jpg", "冰雪诗词_全部图片/4888174029703506 - 七绝    春日闲吟/02.jpg", "冰雪诗词_全部图片/4888174029703506 - 七绝    春日闲吟/03.jpg"]}, {"id": "4888562183179724", "title": "七绝·咏怀", "genre": "七绝", "body": "逆旅征途已下车，\n回乡俯首报恩德。\n趋前二老殷勤伴，\n往事聊成岁月歌。 ​​​", "date": "2023.04.09", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4888562183179724 - 七绝           咏怀/01.jpg"]}, {"id": "4889264296559822", "title": "醉花阴·千里探母", "genre": "醉花阴", "body": "拜过双亲魂魄稳，\n一见超千问。\n庭院草花香，\n门户无忧，\n多有乡邻进。\n鬓苍少虑时常困，\n醒后牌消闷。\n妹妹往来频，\n念想周全，\n二老衣餐顺。 ​​​", "date": "2023.04.11", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4889264296559822 - 醉花阴 千里探母/01.jpg"]}, {"id": "4889628282719151", "title": "五绝·春晓", "genre": "五绝", "body": "小院对红开，\n鸣檐鸟雀来。\n凭栏飞意绪，\n青翠悦胸怀。 ​​​", "date": "2023.04.12", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4889628282719151 - 五绝    春晓/01.jpg"]}, {"id": "4889988707649069", "title": "七绝·春趣", "genre": "七绝", "body": "蔷薇红晕染枝头，\n翠叶摇风映远楼。\n童稚相邀花树下，\n逐香嘻闹逮蜗牛。 ​​​", "date": "2023.04.13", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4889988707649069 - 七绝           春趣/01.jpg"]}, {"id": "4890347614766906", "title": "七绝·春夜吟", "genre": "七绝", "body": "昔日青丝染雪颜，\n今朝无悔少时年。\n人生自古终将老，\n斑鬓闲身好梦眠。 ​​​", "date": "2023.04.14", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4890347614766906 - 七绝       春夜吟/01.jpg"]}, {"id": "4890754377322451", "title": "七绝·牡丹", "genre": "七绝", "body": "花色斑斓香满园，\n粉红带露恁娇鲜。\n芳姿摇拽蜂蝶醉，\n胜过瑶台万朵仙。 ​​​", "date": "2023.04.15", "themes": ["咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4890754377322451 - 七绝           牡丹/01.jpg"]}, {"id": "4891102538106878", "title": "七绝·和诗友", "genre": "七绝", "body": "相逢不易散时难，\n酒热衷肠心底寒。\n此去东西千里梦，\n低眉挽袖泪轻弹。\n诗友原玉：\n七绝           离梦\n霜雁飞\n踯躅村头一别难，\n离魂羁旅雪天寒。\n他乡游子沧桑梦，\n总把幽思借瑟弹。 ​​​", "date": "2023.04.16", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4891102538106878 - 七绝       和诗友/01.jpg"]}, {"id": "4891438929674378", "title": "七绝·观事有吟", "genre": "七绝", "body": "凡人难抵四周拳，\n且看神龙跃九天。\n巡望八方云海阔，\n瑶台闲坐会游仙。 ​​​", "date": "2023.04.17", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4891438929674378 - 七绝    观事有吟/01.jpg"]}, {"id": "4891915855594729", "title": "七绝·春日有感", "genre": "七绝", "body": "红花绿叶巧为邻，\n相处无争最可亲。\n漫溢芳香赢赞誉，\n独留青翠亦精神。 ​​​", "date": "2023.04.18", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4891915855594729 - 七绝    春日有感/01.jpg"]}, {"id": "4892549598676608", "title": "七绝·咏荷", "genre": "七绝", "body": "芙蕖曼妙玉洁身，\n浊水淤泥不染尘。\n高雅赢得千古颂，\n百花丛里最倾心。 ​​​", "date": "2023.04.20", "themes": ["山水田园与闲居雅趣", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4892549598676608 - 七绝          咏荷/01.jpg"]}, {"id": "4892888666472669", "title": "七绝·赠银川兄", "genre": "七绝", "body": "诗词诱惑理工男，\n花甲躬身李杜前。\n平仄谱出千百韵，\n老来岁月有新天。 ​​​", "date": "2023.04.21", "themes": ["感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4892888666472669 - 七绝    赠银川兄/01.jpg"]}, {"id": "4893252526538888", "title": "七绝·闻事吟", "genre": "七绝", "body": "狗随人性雨随风，\n暴劣温良与主同。\n常近朱砂沾赤色，\n身临缁墨脸乌青。 ​​​", "date": "2023.04.22", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4893252526538888 - 七绝       闻事吟/01.jpg"]}, {"id": "4893792185881443", "title": "七绝·春夜吟", "genre": "七绝", "body": "修来缘分且珍惜，\n携手把樽能几时。\n旦使相逢宜畅饮，\n管他春夏与东西。 ​​​", "date": "2023.04.23", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4893792185881443 - 七绝        春夜吟/01.jpg"]}, {"id": "4894055437699426", "title": "七绝·春日抒怀", "genre": "七绝", "body": "人生谁不老白头，\n昔日芳华任去留。\n无悔苍颜心体健，\n开怀胜过少年愁。 ​​​", "date": "2023.04.24", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4894055437699426 - 七绝    春日抒怀/01.jpg"]}, {"id": "4895174227137216", "title": "踏莎行·郊游", "genre": "踏莎行", "body": "古塔春园，\n垂杨翠柳。\n躲开假日携孙走。\n湖边曲径少人行，\n煦风暖照亭台秀。\n碧水朱栏，\n童声玉手。\n香甜食物充鱼口。\n鸭鹅争叫戏青蛙，\n开心老少频回首。 ​​​", "date": "2023.04.27", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4895174227137216 - 踏莎行        郊游/01.jpg"]}, {"id": "4895945403929403", "title": "蝶恋花·遥望", "genre": "蝶恋花", "body": "父母携儿京洛起，\n此去天津，\n尽把深情寄。\n玩雪春天长久意，\n今朝了却心头事。\n笑靥明眸谁似你，\n玉面纤姿，\n清雅盈香气。\n两岁娇孙心底记，\n归来回味皆欢喜。 ​​​", "date": "2023.04.29", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4895945403929403 - ​蝶恋花        遥望/01.jpg", "冰雪诗词_全部图片/4895945403929403 - ​蝶恋花        遥望/02.jpg"]}, {"id": "4896257367608986", "title": "太常引·大洋彼岸", "genre": "太常引", "body": "奈何相似画中身。\n日者已飞魂，\n韩子步前尘。\n赤毯上，犹如主人。\n仆从夫妇，\n旁边侧立，\n呆板眼无神。\n心底乱纷纷。\n脸堆笑，眉愁万分。 ​​​", "date": "2023.04.30", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4896257367608986 - 太常引    大洋彼岸/01.jpg"]}, {"id": "4896504169367287", "title": "七绝·五一寄怀", "genre": "七绝", "body": "茶酒飘香祝友朋，\n置身节日万花丛。\n开怀畅享春光暖，\n烦恼随风散九空。\n五一快乐！[握手][咖啡] ​​​", "date": "2023.05.01", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4896504169367287 - 七绝    五一寄怀/01.jpg"]}, {"id": "4896873775371536", "title": "七绝·五一致敬", "genre": "七绝", "body": "劳者节来犹未休，\n挥浆砌瓦筑高楼。\n除尘净道披星月，\n俯首无言解众忧。 ​​​", "date": "2023.05.02", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4896873775371536 - 七绝    五一致敬/01.jpg"]}, {"id": "4897340551332082", "title": "七绝·叹望", "genre": "七绝", "body": "出门看景被围观，\n未见物华愁望天。\n抬脚未曾挪半步，\n有心放下已然难。 ​​​", "date": "2023.05.03", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4897340551332082 - 七绝           叹望/01.jpg"]}, {"id": "4897597037220099", "title": "七绝·吟望", "genre": "七绝", "body": "淄博烧烤爆出圈，\n千里奔驰解嘴馋。\n遍处飘香情似火，\n主家周到客流连。 ​​​", "date": "2023.05.04", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4897597037220099 - 七绝           吟望/01.jpg"]}, {"id": "4897980404730085", "title": "江城子·吟望抒怀", "genre": "江城子", "body": "昔时五四意飞扬。\n入华堂，佩勋章。\n热血盈怀，\n胆壮志如钢。\n绶带红花频闪烁，\n高台上，恁风光。\n今朝华发绪思长。\n鬓如霜，梦犹香。\n老少于心，\n几处远奔忙。\n俯首灶台炉火旺，\n亲情暖，醉栏窗。 ​​​", "date": "2023.05.05", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4897980404730085 - 江城子 吟望抒怀/01.jpg"]}, {"id": "4898683042400836", "title": "五绝·立夏", "genre": "五绝", "body": "风开夏日门，\n菡萏影缤纷。\n神韵纤姿妙，\n魂失过路人。 ​​​", "date": "2023.05.07", "themes": ["四时风光与节气流转"], "images": ["冰雪诗词_全部图片/4898683042400836 - 五绝     立夏/01.jpg"]}, {"id": "4899045543512183", "title": "七绝·吟怀", "genre": "七绝", "body": "花甲年来病染身，\n腿疼目眩费心神。\n八方询问投医处，\n妙手何时馈我春。 ​​​", "date": "2023.05.08", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4899045543512183 - 七绝           吟怀/01.jpg"]}, {"id": "4899766218262329", "title": "采桑子·初夏晓院", "genre": "采桑子", "body": "春归花谢晨风暖。\n庭院清幽，\n漫步神游。\n微汗盈身散虑愁。\n柳条垂荡莺飞啭。\n无欲无求，\n怡悦难休。\n寥廓云空竞自由。 ​​​", "date": "2023.05.10", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4899766218262329 - 采桑子 初夏晓院/01.jpg"]}, {"id": "4900130161691562", "title": "七绝·真与假", "genre": "七绝", "body": "颦仿西施惹众嘲，\n虚情得意使一招。\n常年棒打鸳鸯散，\n今日撮合恨未消。 ​​​", "date": "2023.05.11", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4900130161691562 - 七绝        真与假/01.jpg"]}, {"id": "4900491948984159", "title": "七绝·寄儿生日", "genre": "七绝", "body": "三十六载育身心，\n沐雨经风始作人。\n京邑扎根松柏壮，\n争当梁栋报家亲。 ​​​", "date": "2023.05.12", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4900491948984159 - 七绝    寄儿生日/01.jpg"]}, {"id": "4900883291444586", "title": "七绝·孤芳人恋", "genre": "七绝", "body": "寥廓尘间百色花，\n春秋冬夏竞相发。\n眼前一朵云空向，\n过客天涯把视她。 ​​​", "date": "2023.05.13", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4900883291444586 - 七绝    孤芳人恋/01.jpg"]}, {"id": "4901224560724356", "title": "如梦令·遥念母亲", "genre": "如梦令", "body": "近日娘亲健忘。\n常问儿孙时况，\n转眼不知情，\n又复先前声嗓。\n凄怆，凄怆。\n为子心头惆怅。 ​​​", "date": "2023.05.14", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4901224560724356 - 如梦令 遥念母亲/01.jpg"]}, {"id": "4901580900665903", "title": "七绝·童趣", "genre": "七绝", "body": "常玩楼院两无猜，\n哥妹花前去又来。\n携手滑梯同上下，\n秋千并坐乐开怀。 ​​​", "date": "2023.05.15", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4901580900665903 - 七绝           童趣/01.jpg"]}, {"id": "4901947947092147", "title": "七绝·闲吟", "genre": "七绝", "body": "别去新冠卷土来，\n复阳音讯渐传开。\n先期未中多人倒，\n口罩随身或免灾。 ​​​", "date": "2023.05.16", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4901947947092147 - 七绝           闲吟/01.jpg"]}, {"id": "4902665774171723", "title": "破阵子·笑果酸臭", "genre": "破阵子", "body": "小丑一声嘶叫，\n裹含恶语伤人。\n暗箭一支星准点，\n正对神州海陆军。\n损阴煞费神。\n鬼怪难逃干系，\n犹期尘世还魂。\n万众齐呼孙大圣，\n携手钟馗斩魅根。\n风行朗朗坤。 ​​​", "date": "2023.05.18", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4902665774171723 - 破阵子 笑果酸臭/01.jpg"]}, {"id": "4903028156531731", "title": "七绝·戏赠子玉", "genre": "七绝", "body": "已惯操劳难作休，\n门前排队欲相求。\n冠阳无奈悠闲日，\n坐卧无聊暗自愁。 ​​​", "date": "2023.05.19", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4903028156531731 - 七绝    戏赠子玉/01.jpg"]}, {"id": "4903389823768031", "title": "七绝·童趣", "genre": "七绝", "body": "傍妹倚栏哥喂水，\n楼前玩伴似家亲。\n纤眉嫩脸心相映，\n笑靥明眸稚子真。 ​​​", "date": "2023.05.20", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4903389823768031 - 七绝           童趣/01.jpg"]}, {"id": "4903805764242597", "title": "破阵子·小满有寄", "genre": "破阵子", "body": "正是风清云淡，\n禾田籽粒盈浆。\n饱纳天光凭日月，\n此后丰收充廪仓。\n农勤岁月长。\n世路不辞劳苦，\n惠人利己兴邦。\n初获无骄心不躁，\n遇事虚怀底气藏。\n家和国业昌。 ​​​", "date": "2023.05.21", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4903805764242597 - 破阵子 小满有寄/01.jpg"]}, {"id": "4904495081326422", "title": "西江月·夏趣", "genre": "西江月", "body": "童稚花前围坐，\n妪翁树下旁观。\n绿荫花影趣无边，\n书在怀中虚看。\n多是心神飞荡，\n并非眉眼伤残。\n周遭景致扰膺田，\n犬吠鸟鸣惊伴。 ​​​", "date": "2023.05.23", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4904495081326422 - 西江月        夏趣/01.jpg", "冰雪诗词_全部图片/4904495081326422 - 西江月        夏趣/02.jpg"]}, {"id": "4904866021117289", "title": "西江月·祖孙乐", "genre": "西江月", "body": "左摆右拼如画，\n运眸动手凭心。\n散图零乱费童神，\n时有娇声发问。\n楼外天光烦热，\n案周家境清新。\n祖孙老少笑声频，\n夏日无忧情奋。 ​​​", "date": "2023.05.24", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4904866021117289 - 西江月    祖孙乐/01.jpg"]}, {"id": "4905201973070770", "title": "七绝·玩趣", "genre": "七绝", "body": "年龄虽小久相逢，\n只差三天姐弟称。\n并立鹿前争比个，\n楼厅蹦跳笑声盈。 ​​​", "date": "2023.05.25", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4905201973070770 - 七绝           玩趣/01.jpg"]}, {"id": "4905594106677952", "title": "七律·玩童趣读", "genre": "七律", "body": "耍闹间歇看画书，\n彩图精妙眼神足。\n翻开当页长鬃马，\n转过来篇短尾猪。\n姐弟专心旁者聚，\n诵听依脑外音除。\n树梢鸟雀低头望，\n池上花枝底气无。 ​​​", "date": "2023.05.26", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4905594106677952 - 七律    玩童趣读/01.jpg"]}, {"id": "4905926857327531", "title": "七律·稚子夏趣", "genre": "七律", "body": "初夏土桃青又小，\n枝头翠叶笑相迎。\n幼儿结伴清荫下，\n纤手争高兴趣浓。\n圆果脱毛眉目痒，\n微风拂面脸皮红。\n你牵我扯时光快，\n晌午将临未尽情。 ​​​", "date": "2023.05.27", "themes": ["感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4905926857327531 - 七律    稚子夏趣/01.jpg"]}, {"id": "4906290112892083", "title": "西江月·吟望", "genre": "西江月", "body": "岁月如书深厚，\n人生似画斑斓。\n烟涛水浪卷云天，\n梅雪芳香莺啭。\n天地春秋往复，\n昼宵苦乐轮番。\n多情挚爱是人间，\n风月草花相伴。 ​​​", "date": "2023.05.28", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4906290112892083 - 西江月      吟望/01.jpg"]}, {"id": "4906656212714202", "title": "天净沙·农家乐", "genre": "天净沙", "body": "连绵细雨肥秧，\n绕杆爬上争阳。\n翠影阶前日广。\n欣荣景象。\n鸟儿欢老人康。 ​​​", "date": "2023.05.29", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4906656212714202 - 天净沙 农家乐/01.jpg"]}, {"id": "4907051895489908", "title": "踏莎行·有感C919", "genre": "踏莎行", "body": "无限遐思，\n几多期待。\n饱含多少情和爱。\n今朝昂首刺长空，\n眸盈热泪心头快！\n曾几何时，\n千般无奈。\n低眉窝气求人卖。\n此情一去恨随风，\n大鹏展翅云霄外。 ​​​", "date": "2023.05.30", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4907051895489908 - 踏莎行 有感C919/01.jpg", "冰雪诗词_全部图片/4907051895489908 - 踏莎行 有感C919/02.jpg", "冰雪诗词_全部图片/4907051895489908 - 踏莎行 有感C919/03.jpg"]}, {"id": "4907382984934074", "title": "长相思·教授飞天", "genre": "长相思", "body": "桂海潮，弄海潮。\n留驻天宫赤子骄。\n多能誉望高。\n有奇招，用奇招。\n荷载专家巡九霄。\n探求星际桥。 ​​​", "date": "2023.05.31", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4907382984934074 - 长相思 教授飞天/01.jpg"]}, {"id": "4907740616722304", "title": "七律·六一感吟", "genre": "七律", "body": "独自半年爷与孙，\n京城春夏共童真。\n楼前有伴花间乐，\n灯下无忧梦里亲。\n携手天坛观日落，\n倚栏湖畔戏鱼群。\n平衡车上娇声笑，\n单杠凌空老我身。 ​​​", "date": "2023.06.01", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4907740616722304 - 七律    六一感吟/01.jpg"]}, {"id": "4908102229426311", "title": "长相思·小健将", "genre": "长相思", "body": "左脚前，右脚前。\n开步如弓摆动肩，\n来回玉臂牵。\n喜逐颜，乐逐颜。\n笑靥娇唇眉俏弯，\n稚童欢不闲。 ​​​", "date": "2023.06.02", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4908102229426311 - 长相思     小健将/01.jpg", "冰雪诗词_全部图片/4908102229426311 - 长相思     小健将/02.jpg"]}, {"id": "4908494303793869", "title": "天净沙·童乐", "genre": "天净沙", "body": "琮琮领跑煊煊，\n夏初京洛游园。\n并倚桥栏远看。\n彩舟花岸。\n鸟翔鱼跃云天。 ​​​", "date": "2023.06.03", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4908494303793869 - 天净沙    童乐/01.jpg", "冰雪诗词_全部图片/4908494303793869 - 天净沙    童乐/02.jpg"]}, {"id": "4908862966336082", "title": "七绝·夏日行", "genre": "七绝", "body": "白云之上向西行，\n放眼四周霄汉明。\n回望京都千里远，\n天山日暮到疆城。 ​​​", "date": "2023.06.04", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4908862966336082 - 七绝       夏日行/01.jpg", "冰雪诗词_全部图片/4908862966336082 - 七绝       夏日行/02.jpg", "冰雪诗词_全部图片/4908862966336082 - 七绝       夏日行/03.jpg", "冰雪诗词_全部图片/4908862966336082 - 七绝       夏日行/04.jpg", "冰雪诗词_全部图片/4908862966336082 - 七绝       夏日行/05.jpg", "冰雪诗词_全部图片/4908862966336082 - 七绝       夏日行/06.jpg"]}, {"id": "4908863146689681", "title": "七绝·夏日行", "genre": "七绝", "body": "白云之上向西行，\n放眼四周霄汉明。\n回望京都千里远，\n天山日暮到疆城。 ​​​", "date": "2023.06.04", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4908863146689681 - 七绝       夏日行/01.jpg", "冰雪诗词_全部图片/4908863146689681 - 七绝       夏日行/02.jpg", "冰雪诗词_全部图片/4908863146689681 - 七绝       夏日行/03.jpg", "冰雪诗词_全部图片/4908863146689681 - 七绝       夏日行/04.jpg", "冰雪诗词_全部图片/4908863146689681 - 七绝       夏日行/05.jpg", "冰雪诗词_全部图片/4908863146689681 - 七绝       夏日行/06.jpg"]}, {"id": "4909349262591726", "title": "七绝·童心", "genre": "七绝", "body": "回到新疆不陌生，\n家中玩具亦多情。\n幼儿虽小心头记，\n逐个抚摸娇有声。 ​​​", "date": "2023.06.05", "themes": ["羁旅思乡与行吟纪游", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4909349262591726 - 七绝           童心/01.jpg", "冰雪诗词_全部图片/4909349262591726 - 七绝           童心/02.jpg"]}, {"id": "4909574563827492", "title": "七律·芒种有寄", "genre": "七律", "body": "身居闹市闻收麦，\n忆起少时三夏忙。\n人醒长空星未散，\n镰挥大地鸟惊慌。\n马驮车载烟尘去，\n机打风吹芒絮扬。\n今日多为全自动，\n众前说笑籽归仓。 ​​​", "date": "2023.06.06", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4909574563827492 - 七律    芒种有寄/01.jpg"]}, {"id": "4909924180822381", "title": "七绝·吟怀", "genre": "七绝", "body": "当年学子已成爷，\n尘世浮生后半截。\n昔遇龙门拼尽力，\n儿孙今日上台阶。 ​​​", "date": "2023.06.07", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4909924180822381 - 七绝           吟怀/01.jpg"]}, {"id": "4910287696696312", "title": "七绝·执着", "genre": "七绝", "body": "五十六载人生路，\n二秩又七成考神。\n商海遨游能上岸，\n不及范进怎甘心。 ​​​", "date": "2023.06.08", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4910287696696312 - 七绝           执着/01.jpg"]}, {"id": "4910678986726452", "title": "七绝·迪化夏日", "genre": "七绝", "body": "京邑边城万里间，\n昔时景色两重天。\n如今草树街头似，\n两岁娇孙几往还。 ​​​", "date": "2023.06.09", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4910678986726452 - 七绝    迪化夏日/01.jpg"]}, {"id": "4911002863534097", "title": "七绝·吟望", "genre": "七绝", "body": "​天府街头情越位，\n神州屏上火出圈。\n一时酸爽无穷恨，\n懊悔难追把手牵。 ​​​", "date": "2023.06.10", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4911002863534097 - 七绝           吟望/01.jpg"]}, {"id": "4911481772049627", "title": "七绝·吟望", "genre": "七绝", "body": "心虚气壮眼神间，\n不论高低莫怨天。\n国力支撑腰杆硬，\n扬眉昂首越关山。 ​​​", "date": "2023.06.11", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4911481772049627 - 七绝           吟望/01.jpg"]}, {"id": "4912104412812758", "title": "鹧鸪天·变色龙", "genre": "鹧鸪天", "body": "独与娇孙乖可人，\n爸妈相伴乱心魂。\n卧床深夜还嘻闹，\n吃饭多时未染唇。\n情激动，喊声频。\n一天难耐是晨昏。\n寻常最怕逢周末，\n哭笑无由扰四邻。 ​​​", "date": "2023.06.13", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4912104412812758 - 鹧鸪天   变色龙/01.jpg"]}, {"id": "4912498433592268", "title": "五绝·感吟", "genre": "五绝", "body": "为人多礼让，\n福报自来回。\n遇事心无我，\n出行好运随。 ​​​", "date": "2023.06.14", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4912498433592268 - 五绝     感吟/01.jpg"]}, {"id": "4912839439422447", "title": "七绝·夏夜思", "genre": "七绝", "body": "云静空明未染尘，\n老来远事作闲人。\n通宵无虑开轩卧，\n眠梦何忧鬼上门。 ​​​", "date": "2023.06.15", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4912839439422447 - 七绝       夏夜思/01.jpg"]}, {"id": "4913207544381749", "title": "鹧鸪天·边城童乐", "genre": "鹧鸪天", "body": "重到疆城半月间，\n日游庭院两三番。\n滑梯顶上开怀笑，\n喷水池旁粉靥妍。\n新伙伴，旧楼前。\n童真无忌尽情欢。\n与人分享心头物，\n呼鸟闻香细语言。 ​​​", "date": "2023.06.16", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4913207544381749 - ​鹧鸪天 边城童乐/01.jpg", "冰雪诗词_全部图片/4913207544381749 - ​鹧鸪天 边城童乐/02.jpg", "冰雪诗词_全部图片/4913207544381749 - ​鹧鸪天 边城童乐/03.jpg", "冰雪诗词_全部图片/4913207544381749 - ​鹧鸪天 边城童乐/04.jpg", "冰雪诗词_全部图片/4913207544381749 - ​鹧鸪天 边城童乐/05.jpg", "冰雪诗词_全部图片/4913207544381749 - ​鹧鸪天 边城童乐/06.jpg"]}, {"id": "4913576664630269", "title": "七绝·闲吟", "genre": "七绝", "body": "心静无尘日月明，\n乐山戏水度余生。\n闲来远事亲朋近，\n乡韵诗情染鬓容。 ​​​", "date": "2023.06.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4913576664630269 - 七绝           闲吟/01.jpg"]}, {"id": "4914020777200036", "title": "七绝·闻事吟", "genre": "七绝", "body": "鼠鸭搅动万人心，\n啮齿指为脖颈根。\n欲效赵高说鹿马，\n引得烈火燎贼身。 ​​​", "date": "2023.06.18", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4914020777200036 - 七绝        闻事吟/01.jpg"]}, {"id": "4914284364825423", "title": "七绝·看图有感", "genre": "七绝", "body": "晴空无恙人心异，\n眼望神州别样情。\n酸涩难言阴损盛，\n鬼魂魅影怕天明。 ​​​", "date": "2023.06.19", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4914284364825423 - ​七绝    看图有感/01.jpg"]}, {"id": "4914676846826853", "title": "临江仙·仲夏游园", "genre": "临江仙", "body": "酷热炎光何处爽，\n红山树下清香。\n前人栽种我乘凉。\n野风摇鬓影，\n翠叶啭莺藏。\n牵手娇孙闲迈步，\n寻阶漫享时光。\n幼童嘴眼两相忙。\n半腰骑木马，\n登顶俏眉扬。 ​​​", "date": "2023.06.20", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4914676846826853 - 临江仙 仲夏游园/01.jpg", "冰雪诗词_全部图片/4914676846826853 - 临江仙 仲夏游园/02.jpg", "冰雪诗词_全部图片/4914676846826853 - 临江仙 仲夏游园/03.jpg", "冰雪诗词_全部图片/4914676846826853 - 临江仙 仲夏游园/04.jpg"]}, {"id": "4915021048448566", "title": "五绝·夏至", "genre": "五绝", "body": "天山映我窗，\n夏至晓风凉。\n不似关门内，\n晨昏汗浸裳。 ​​​", "date": "2023.06.21", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4915021048448566 - 五绝   夏至/01.jpg"]}, {"id": "4915348200230033", "title": "临江仙·端午寄怀", "genre": "临江仙", "body": "边地端阳思念远，\n抬头遥望双亲。\n粽香应是满庭门。\n眼花兼耳背，\n同念远行人。\n老少别离情几处，\n疆城京冀分神。\n自来骨肉总连心。\n梦中牵一发，\n惊动遍周身。 ​​​", "date": "2023.06.22", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4915348200230033 - 临江仙 端午寄怀/01.jpg"]}, {"id": "4915733966619704", "title": "临江仙·端阳游", "genre": "临江仙", "body": "水磨沟中端午日，\n摩肩游客从容。\n曼歌妙舞恁深情。\n岸前垂钓叟，\n草畔睡酣童。\n戏水白云来又去，\n金鱼潜跃欢逢。\n芳枝翠叶望无穷。\n柳荫遮酷日，\n暑气尽随风。 ​​​", "date": "2023.06.23", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4915733966619704 - 临江仙    端阳游/01.jpg", "冰雪诗词_全部图片/4915733966619704 - 临江仙    端阳游/02.jpg", "冰雪诗词_全部图片/4915733966619704 - 临江仙    端阳游/03.jpg"]}, {"id": "4916089412912005", "title": "七律·石人沟", "genre": "七律", "body": "遥望景光别样新，\n天棚地铺就青茵。\n游人结伴云间卧，\n辞客独行风色亲。\n山顶凌空观落日，\n农家月下肉香熏。\n繁星笑我归来醉，\n旁者岂能知我心。 ​​​", "date": "2023.06.24", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4916089412912005 - 七律       石人沟/01.jpg", "冰雪诗词_全部图片/4916089412912005 - 七律       石人沟/02.jpg", "冰雪诗词_全部图片/4916089412912005 - 七律       石人沟/03.jpg", "冰雪诗词_全部图片/4916089412912005 - 七律       石人沟/04.jpg"]}, {"id": "4916437212988333", "title": "七绝·庙儿沟逢雨", "genre": "七绝", "body": "攀上南山天不留，\n突来风雨使人愁。\n气温骤降十多度，\n酷夏瞬间如晚秋。 ​​​", "date": "2023.06.25", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4916437212988333 - 七绝 庙儿沟逢雨/01.jpg"]}, {"id": "4916799387470237", "title": "七绝·寄友朋", "genre": "七绝", "body": "浮云千里天天见，\n流水东西有浪声。\n不赖飞鸿传语信，\n微屏日日寄深情。 ​​​", "date": "2023.06.26", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4916799387470237 - 七绝       寄友朋/01.jpg"]}, {"id": "4917193853113652", "title": "七绝·吟望", "genre": "七绝", "body": "人以群分各自欢，\n诗歌棋画不相干。\n朝天大路腾云上，\n快马奋蹄何用鞭。 ​​​", "date": "2023.06.27", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4917193853113652 - 七绝           吟望/01.jpg"]}, {"id": "4917523185927417", "title": "七绝·敬拜", "genre": "七绝", "body": "佛在家中莫远求，\n何来四处乱磕头。\n高堂白发心端住，\n尘世穿行岂用愁。 ​​​", "date": "2023.06.28", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4917523185927417 - 七绝           敬拜/01.jpg"]}, {"id": "4917889104085737", "title": "七绝·夏游红光山", "genre": "七绝", "body": "对面天山雪未消，\n眼前熏烤树弯腰。\n谁人能借凉风至，\n携带雪花头上飘。 ​​​", "date": "2023.06.29", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4917889104085737 - 七绝 夏游红光山/01.jpg"]}, {"id": "4918249316421805", "title": "七绝·疆城夏日", "genre": "七绝", "body": "半宵风雨似深秋，\n晨晓层云隐日头。\n长裤夹衫犹耳冷，\n阴凉双手复相揉。 ​​​", "date": "2023.06.30", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4918249316421805 - 七绝    疆城夏日/01.jpg"]}, {"id": "4918614694300568", "title": "清平乐·七一吟颂", "genre": "清平乐", "body": "又逢华诞，\n举世群英赞。\n百载辉煌星璀璨，\n自始初心未变。\n神州地覆天翻，\n国人背挺颜欢。\n日夜舟行碧落，\n蛟龙海底翩跹。 ​​​", "date": "2023.07.01", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4918614694300568 - 清平乐 七一吟颂/01.jpg"]}, {"id": "4919741484897346", "title": "青玉案·古尔邦节", "genre": "青玉案", "body": "大巴扎里人潮涌。\n鼓乐奏，声云动。\n曼舞轻歌同尽兴。\n肉馕香溢，彩旗横纵。\n笑靥凌波影。\n维乡老少齐欢庆。\n邻里亲朋酒樽弄。\n回汉前来情亦重。\n疆城和睦，神州安定。\n山水遥相映。 ​​​", "date": "2023.07.04", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4919741484897346 - 青玉案  古尔邦节/01.jpg", "冰雪诗词_全部图片/4919741484897346 - 青玉案  古尔邦节/02.jpg", "冰雪诗词_全部图片/4919741484897346 - 青玉案  古尔邦节/03.jpg", "冰雪诗词_全部图片/4919741484897346 - 青玉案  古尔邦节/04.jpg"]}, {"id": "4920147288524081", "title": "青玉案·西白杨沟", "genre": "青玉案", "body": "连天瀑布飞流下。\n响山谷，银绡挂。\n落玉飞珠妍似画。\n南山一景，清凉三夏。\n远客来休假。\n草坪溪水争相耍。\n放眼舒怀见牛马。\n风雨袭来浑不怕。\n白云漫卷，兴情难罢。\n最是欢无价。 ​​​", "date": "2023.07.05", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4920147288524081 - 青玉案   西白杨沟/01.jpg", "冰雪诗词_全部图片/4920147288524081 - 青玉案   西白杨沟/02.jpg", "冰雪诗词_全部图片/4920147288524081 - 青玉案   西白杨沟/03.jpg", "冰雪诗词_全部图片/4920147288524081 - 青玉案   西白杨沟/04.jpg"]}, {"id": "4920473185423655", "title": "七绝·夏日闲吟", "genre": "七绝", "body": "世间遍处有高楼，\n莫羡他人己不愁。\n便是身居蓬草地，\n老来无虑更何求。 ​​​", "date": "2023.07.06", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4920473185423655 - 七绝    夏日闲吟/01.jpg"]}, {"id": "4920812915920040", "title": "七绝·时令吟", "genre": "七绝", "body": "小暑恰逢七月七，\n神州警报响东西。\n国仇民愤心头怨，\n旧未消除新又积。 ​​​", "date": "2023.07.07", "themes": ["家国情怀与时代歌咏", "四时风光与节气流转"], "images": ["冰雪诗词_全部图片/4920812915920040 - 七绝        时令吟/01.jpg"]}, {"id": "4921192727446888", "title": "七绝·夏日闲吟", "genre": "七绝", "body": "闻道家乡热浪翻，\n边城小暑夜风寒。\n卧床不敢开窗牗，\n惟恐眠深醒却难。 ​​​", "date": "2023.07.08", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4921192727446888 - 七绝    夏日闲吟/01.jpg"]}, {"id": "4921517274566194", "title": "采桑子·闻事吟", "genre": "采桑子", "body": "平时台上风光劲。\n不道心灵，\n苦念如丛。\n思绪无常乱死生。\n鲜花正艳狂飚落。\n无奈凋零，\n怎不悲情。\n红堕泥香鸟叹声。 ​​​", "date": "2023.07.09", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4921517274566194 - 采桑子    闻事吟/01.jpg"]}, {"id": "4922237977362521", "title": "唐多令·夏日吟", "genre": "唐多令", "body": "伏暑入边城，晓来风色清。\n内地时、粘汗难停。\n早晚微凉心里盼。\n多数是、梦成空。\n今日雨三更，舒心晨练中。\n望天山、岭雪川冰。\n或许阴凉源自此。\n千百载、老还生。 ​​​", "date": "2023.07.11", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4922237977362521 - 唐多令       夏日吟/01.jpg"]}, {"id": "4922633080278274", "title": "唐多令·夏日怅吟", "genre": "唐多令", "body": "五口巧团圆，疆城夏日天。\n欲空闲、游览南山。\n岂料娇孙餐后吐。\n过夜后、漫周边。\n先与爸妈传，又分爷奶间。\n次第来、尽数轮番。\n好在每人愁两日。\n这心绪、怎能言。 ​​​", "date": "2023.07.12", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4922633080278274 - 唐多令    夏日怅吟/01.jpg"]}, {"id": "4923017697955777", "title": "唐多令·遥望", "genre": "唐多令", "body": "落魄眼神传，\n孤形魅影寒。\n绝望情、鬓际眉间。\n心冷眸酸圈子外，\n他人乐，己难欢。\n昔日恁光鲜，\n风头盖过天。\n乱招摇、鼓暴旗翻。\n国破民亡妻子笑，\n跳梁者，岂能闲？ ​​​", "date": "2023.07.13", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4923017697955777 - 唐多令      遥望/01.jpg"]}, {"id": "4923368279642161", "title": "七绝·夏日暮吟", "genre": "七绝", "body": "黄昏庭院水池暝，\n夕照霞辉映晚风。\n携手娇孙闲漫步，\n清凉树色隐蝉鸣。 ​​​", "date": "2023.07.14", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4923368279642161 - 七绝    夏日暮吟/01.jpg"]}, {"id": "4923714574223810", "title": "五绝·童趣", "genre": "五绝", "body": "小手巧拼图，\n暑天心气足。\n不觉窗外热，\n半晌未出屋。 ​​​", "date": "2023.07.15", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4923714574223810 - 五绝    童趣/01.jpg"]}, {"id": "4924179286067109", "title": "七律·再探水磨沟", "genre": "七律", "body": "伏后重来水磨沟，\n家妻结伴算初游。\n山光树色还依旧，\n鼓点人声格外稠。\n席地阴凉消溽暑，\n漫天云朵散忧愁。\n清风拂面心怀爽，\n翥鸟争鸣绕我头。 ​​​", "date": "2023.07.16", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4924179286067109 - 七律 再探水磨沟/01.jpg", "冰雪诗词_全部图片/4924179286067109 - 七律 再探水磨沟/02.jpg", "冰雪诗词_全部图片/4924179286067109 - 七律 再探水磨沟/03.jpg", "冰雪诗词_全部图片/4924179286067109 - 七律 再探水磨沟/04.jpg"]}, {"id": "4924459729028009", "title": "七律·重游庙儿沟", "genre": "七律", "body": "前朝遇雨未登山，\n今日白云翠岭间。\n妻子缓行芳草处，\n娇孙急步荡秋千。\n连天瀑布青龙舞，\n落水珍珠响九环。\n远客闲来消暑夏，\n八方炎气作风烟。 ​​​", "date": "2023.07.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4924459729028009 - 七律 重游庙儿沟/01.jpg", "冰雪诗词_全部图片/4924459729028009 - 七律 重游庙儿沟/02.jpg", "冰雪诗词_全部图片/4924459729028009 - 七律 重游庙儿沟/03.jpg", "冰雪诗词_全部图片/4924459729028009 - 七律 重游庙儿沟/04.jpg"]}, {"id": "4924772469968834", "title": "七律·日暮抒怀", "genre": "七律", "body": "老来安分自逍遥，\n醉眼闲心看四遭。\n雨落风吹天有道，\n虫鸣犬吠事难消。\n枝条长短抬头见，\n人品高低随处瞧。\n莫为周边情所累，\n抛开物欲度昏朝。 ​​​", "date": "2023.07.18", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4924772469968834 - 七律    日暮抒怀/01.jpg"]}, {"id": "4925163348952800", "title": "眼儿媚·馆池戏水", "genre": "眼儿媚", "body": "穹顶清池水中闲。\n孙女自成欢。\n旋梯滑下，浪花飞溅，\n形态娇妍。\n龙头喷洒琼珠散。\n落地自清圆。\n透心凉爽，眉峰带露，\n浅靥欢颜。 ​​​", "date": "2023.07.19", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4925163348952800 - 眼儿媚     馆池戏水/01.jpg", "冰雪诗词_全部图片/4925163348952800 - 眼儿媚     馆池戏水/02.jpg"]}, {"id": "4925864036797081", "title": "眼儿媚·欢乐城堡", "genre": "眼儿媚", "body": "湖畔高楼任童欢。\n酷耍乐翻天。\n先骑木马，\n蹦床飞跳，\n又荡秋千。\n琳琅玩具无穷数。\n商户笑迎前。\n时非假日，\n孩童偏少，\n多是清闲。 ​​​", "date": "2023.07.21", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4925864036797081 - ​眼儿媚 欢乐城堡/01.jpg", "冰雪诗词_全部图片/4925864036797081 - ​眼儿媚 欢乐城堡/02.jpg", "冰雪诗词_全部图片/4925864036797081 - ​眼儿媚 欢乐城堡/03.jpg", "冰雪诗词_全部图片/4925864036797081 - ​眼儿媚 欢乐城堡/04.jpg", "冰雪诗词_全部图片/4925864036797081 - ​眼儿媚 欢乐城堡/05.jpg", "冰雪诗词_全部图片/4925864036797081 - ​眼儿媚 欢乐城堡/06.jpg"]}, {"id": "4926584060905567", "title": "七绝·贺妻61周岁", "genre": "七绝", "body": "恰逢生日在疆城，\n西域糕点情更浓。\n一碗丝滑长寿面，\n牵来孙女祝福声。 ​​​", "date": "2023.07.23", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4926584060905567 - 七绝 贺妻61周岁/01.jpg"]}, {"id": "4926973896561312", "title": "七绝·时令吟", "genre": "七绝", "body": "时逢大暑宿天山，\n清晓盈眸翠色妍。\n眺望四周神气爽，\n凉风惬意不思还。 ​​​", "date": "2023.07.24", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4926973896561312 - 七绝       时令吟/01.jpg", "冰雪诗词_全部图片/4926973896561312 - 七绝       时令吟/02.jpg"]}, {"id": "4927439384351890", "title": "沁园春·江布拉克", "genre": "沁园春", "body": "古郡奇台，百里方圆，万顷山川。\n眺松林雪岭，霄连地漫，花涛麦浪，绿绣红妍。\n峡谷清幽，白云舒卷，牛马成群映草原。\n风凉夏，纵晴明无雨，入夜微寒。\n穿行犹似云端。花海子，展眸不到边。\n遇怪坡上下，有违物理，星空宵昼，别具风烟。\n溪水轻流，雄鹰高翥，醉卧毡篷好梦眠。\n宜避暑，度消魂日月，不慕神仙。", "date": "2023.07.25", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4927439384351890 - 沁园春      江布拉克/01.jpg", "冰雪诗词_全部图片/4927439384351890 - 沁园春      江布拉克/02.jpg", "冰雪诗词_全部图片/4927439384351890 - 沁园春      江布拉克/03.jpg", "冰雪诗词_全部图片/4927439384351890 - 沁园春      江布拉克/04.jpg", "冰雪诗词_全部图片/4927439384351890 - 沁园春      江布拉克/05.jpg", "冰雪诗词_全部图片/4927439384351890 - 沁园春      江布拉克/06.jpg", "冰雪诗词_全部图片/4927439384351890 - 沁园春      江布拉克/07.jpg", "冰雪诗词_全部图片/4927439384351890 - 沁园春      江布拉克/08.jpg"]}, {"id": "4927712663701732", "title": "七绝·天山怪坡", "genre": "七绝", "body": "斜路上坡车自行，\n转弯向下脚须蹬。\n一头雾水凭心问，\n谁解个中别样情。 ​​​", "date": "2023.07.26", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4927712663701732 - 七绝    天山怪坡/01.jpg", "冰雪诗词_全部图片/4927712663701732 - 七绝    天山怪坡/02.jpg"]}, {"id": "4928076498605868", "title": "减字木兰花·奇台消夏", "genre": "减字木兰花", "body": "深情母女，俏揽夕阳凭笑语。\n悠荡秋千，芳靥明眸对雪山。\n刀条岭上，花海无边连麦浪。\n峡谷云天，溪水鸣莺树色寒。 ​​​", "date": "2023.07.27", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4928076498605868 - 减字木兰花    奇台消夏/01.jpg", "冰雪诗词_全部图片/4928076498605868 - 减字木兰花    奇台消夏/02.jpg", "冰雪诗词_全部图片/4928076498605868 - 减字木兰花    奇台消夏/03.jpg", "冰雪诗词_全部图片/4928076498605868 - 减字木兰花    奇台消夏/04.jpg", "冰雪诗词_全部图片/4928076498605868 - 减字木兰花    奇台消夏/05.jpg", "冰雪诗词_全部图片/4928076498605868 - 减字木兰花    奇台消夏/06.jpg"]}, {"id": "4928413578565067", "title": "七绝·刀郎曲", "genre": "七绝", "body": "十年一剑闪寒光，\n驱散怨怀留韵腔。\n不为人知多少事，\n琴弦慢捻细声张。 ​​​", "date": "2023.07.28", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4928413578565067 - 七绝       刀郎曲/01.jpg"]}, {"id": "4929594862606638", "title": "七绝·难得", "genre": "七绝", "body": "为忙老少聚来难，\n徒想山川草地边。\n今日芳茵溪水处，\n夫妻闲坐望云天。 ​​​", "date": "2023.07.31", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4929594862606638 - 七绝           难得/01.jpg"]}, {"id": "4929860046686771", "title": "渔家傲·八一颂", "genre": "渔家傲", "body": "血染军旗红劲展。\n边陲飘舞山川漫。\n映照长空华夏灿。\n天可见，\n救灾抢险从无怨。\n临夜警眠头枕剑。\n狼来定是咽喉断。\n疆土无忧凭火箭。\n迎挑战，\n赤心威猛铮铮汉。 ​​​", "date": "2023.08.01", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4929860046686771 - 渔家傲    八一颂/01.jpg"]}, {"id": "4930231205102701", "title": "御街行·夏日吟望", "genre": "御街行", "body": "漫天暴雨倾盆下。\n浊浪冲河坝。\n云烟滚滚卷长空，\n遥望心惊魂怕。\n轿车翻转，\n随涛起落，\n逢树斜腰挂。\n山洪犹似无缰马。\n街路禾田垮。\n池塘四溢毁城乡，\n怎奈今朝仲夏。\n寰球气候，\n酿成灾祸，\n此害何时罢！ ​​​", "date": "2023.08.02", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4930231205102701 - ​御街行 夏日吟望/01.jpg", "冰雪诗词_全部图片/4930231205102701 - ​御街行 夏日吟望/02.jpg", "冰雪诗词_全部图片/4930231205102701 - ​御街行 夏日吟望/03.jpg"]}, {"id": "4930585652364338", "title": "五律·孙女两岁半", "genre": "五律", "body": "前期开口晚，近日语频频。\n远上寒山去，朝辞白帝云。\n随风潜入夜，铜雀锁春深。\n诗句连成串，言词巧劝人。 ​​​", "date": "2023.08.03", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4930585652364338 - 五律     孙女两岁半/01.jpg"]}, {"id": "4931338010102718", "title": "七绝·学游泳", "genre": "七绝", "body": "老来池里仿青蛙，\n蹬腿埋头两臂划。\n水溅四空人未走，\n为防沉底紧挠抓。 ​​​", "date": "2023.08.05", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4931338010102718 - 七绝        学游泳/01.jpg"]}, {"id": "4931882503111442", "title": "御街行·重游石人沟", "genre": "御街行", "body": "新添景色千般样。\n稻草描形状。\n恐龙兔狗貌清新，\n海盗神形俱旷。\n农夫劳作，躬耕弯背，\n亦有抬头望。\n绣球花海翻波浪。\n眸展情怀畅。\n云随歌舞韵轻扬，\n日暮光流彩放。\n重来意奋，爽心悦目，\n入夜魂飞荡。 ​​​", "date": "2023.08.06", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4931882503111442 - 御街行   重游石人沟/01.jpg", "冰雪诗词_全部图片/4931882503111442 - 御街行   重游石人沟/02.jpg", "冰雪诗词_全部图片/4931882503111442 - 御街行   重游石人沟/03.jpg", "冰雪诗词_全部图片/4931882503111442 - 御街行   重游石人沟/04.jpg", "冰雪诗词_全部图片/4931882503111442 - 御街行   重游石人沟/05.jpg", "冰雪诗词_全部图片/4931882503111442 - 御街行   重游石人沟/06.jpg", "冰雪诗词_全部图片/4931882503111442 - 御街行   重游石人沟/07.jpg", "冰雪诗词_全部图片/4931882503111442 - 御街行   重游石人沟/08.jpg", "冰雪诗词_全部图片/4931882503111442 - 御街行   重游石人沟/09.jpg"]}, {"id": "4932048852618445", "title": "七律·闻事有感", "genre": "七律", "body": "域广物博常事多，\n天灾地害扰生活。\n水淹京冀愁将去，\n震毁山东泪似河。\n冬夏山川迎雨雪，\n春秋江海起风波。\n八方援手合一处，\n灶破家离饭不隔。 ​​​", "date": "2023.08.07", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4932048852618445 - ​七律    闻事有感/01.jpg", "冰雪诗词_全部图片/4932048852618445 - ​七律    闻事有感/02.jpg"]}, {"id": "4932386040841179", "title": "七绝·立秋吟望", "genre": "七绝", "body": "风吹迪化秋来早，\n便是晴天夜晚凉。\n闻道家乡似蒸煮，\n我于此处怕开窗。 ​​​", "date": "2023.08.08", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4932386040841179 - 七绝    立秋吟望/01.jpg"]}, {"id": "4932756570902712", "title": "七律·趣闻", "genre": "七律", "body": "昏暮孩童摆地摊，\n滑梯近处幼儿观。\n稚言讯问相中物，\n嫩语声明多少元。\n从小双方学买卖，\n大来独自闯商关。\n无心练就终身技，\n日后平生好赚钱。 ​​​", "date": "2023.08.09", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4932756570902712 - 七律           趣闻/01.jpg", "冰雪诗词_全部图片/4932756570902712 - 七律           趣闻/02.jpg", "冰雪诗词_全部图片/4932756570902712 - 七律           趣闻/03.jpg"]}, {"id": "4933519283854733", "title": "七绝·夏趣", "genre": "七绝", "body": "娇娃铜马两相宜，\n昂首天山各有思。\n何处飞来小仙女，\n华骝不动任由骑。 ​​​", "date": "2023.08.11", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4933519283854733 - 七绝           夏趣/01.jpg"]}, {"id": "4933839145927483", "title": "七绝·夏日抒怀", "genre": "七绝", "body": "​身似青蛙水里游，\n金鱼摆尾不需愁。\n平生一念随人愿，\n老戏碧池无所求。\n​ ​​​", "date": "2023.08.12", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4933839145927483 - 七绝    夏日抒怀/01.jpg"]}, {"id": "4934207748703085", "title": "七绝·西安吟望", "genre": "七绝", "body": "三个男孩一场戏，\n粉丝狂热使人愁。\n不惜百万谋张票，\n多少家亲泪水流。 ​​​", "date": "2023.08.13", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4934207748703085 - 七绝    西安吟望/01.jpg"]}, {"id": "4934594308871237", "title": "七律·转折", "genre": "七律", "body": "娇孙喜入幼儿堂，\n座落楼前草树旁。\n平日飘窗明眼看，\n今朝教室细眉扬。\n预期熟识新朋友，\n渴望同欢话短长。\n涉世人生初拐点，\n阖家老少睡难香。 ​​​", "date": "2023.08.14", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4934594308871237 - 七律           转折/01.jpg", "冰雪诗词_全部图片/4934594308871237 - 七律           转折/02.jpg", "冰雪诗词_全部图片/4934594308871237 - 七律           转折/03.jpg"]}, {"id": "4934925591253435", "title": "七绝·吟望娇孙", "genre": "七绝", "body": "头天吃睡幼儿园，\n日暮归来恁是欢。\n能否今朝还照旧，\n风轻云淡自心宽。 ​​​", "date": "2023.08.15", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4934925591253435 - 七绝    吟望娇孙/01.jpg", "冰雪诗词_全部图片/4934925591253435 - 七绝    吟望娇孙/02.jpg", "冰雪诗词_全部图片/4934925591253435 - 七绝    吟望娇孙/03.jpg"]}, {"id": "4935662640038418", "title": "清平乐·贺早梅香诗刊二百", "genre": "清平乐", "body": "早梅香韵，朵朵皆温润。\n燕舞蝶飞骚客问，妙语盈心情奋。\n诗苑四季生花，欣欣映照天涯。\n多少辞家回首，樽前细品争夸。 ​​​", "date": "2023.08.17", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4935662640038418 - 清平乐   贺早梅香诗刊二百/01.jpg"]}, {"id": "4936419930277222", "title": "七绝·无奈", "genre": "七绝", "body": "风云不测事难期，\n故里回还枉费思。\n苦是双亲遥望眼，\n欲穿更待到何时。 ​​​", "date": "2023.08.19", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4936419930277222 - 七绝           无奈/01.jpg"]}, {"id": "4936764348957210", "title": "七绝·颂早梅香诗刊", "genre": "七绝", "body": "梅香雪藻映诗坛，\n四季芬芳漫世间。\n惬意灯前闲细品，\n胜如琼露醉心田。 ​​​", "date": "2023.08.20", "themes": ["山水田园与闲居雅趣", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4936764348957210 - 七绝 颂早梅香诗刊/01.jpg"]}, {"id": "4937461383303520", "title": "鹊桥仙·七夕感怀", "genre": "鹊桥仙", "body": "银河阻断，鹊桥为盼。\n苦等一年夕见。\n牛郎织女泪花流，\n化作雨、云空飘漫。\n传言千古，相思一愿。\n天上人间呼唤。\n有情若是伴昏朝，\n到老后、如初何怨。 ​​​", "date": "2023.08.22", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4937461383303520 - 鹊桥仙        七夕感怀/01.jpg"]}, {"id": "4937843627000410", "title": "五律·处暑", "genre": "五律", "body": "溽暑遇秋归，\n清凉暮色回。\n西风吹落叶，\n花影爽心扉。\n雁翥云天外，\n蝉鸣日月催。\n夏秋能往复，\n白发有谁黑。 ​​​", "date": "2023.08.23", "themes": ["四时风光与节气流转", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4937843627000410 - 五律    处暑/01.jpg"]}, {"id": "4938575114144261", "title": "七绝·闻讯有感", "genre": "七绝", "body": "害人核水无穷尽，\n可恨东洋肆意为。\n若马脱缰游荡处，\n天知到了重伤谁。 ​​​", "date": "2023.08.25", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4938575114144261 - 七绝    闻讯有感/01.jpg"]}, {"id": "4939310555464774", "title": "七绝·秋日吟", "genre": "七绝", "body": "夏去无声叶落秋，\n初来风色亦轻柔。\n寻常日月悠悠过，\n两鬓人生痕迹留。 ​​​", "date": "2023.08.27", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4939310555464774 - 七绝       秋日吟/01.jpg"]}, {"id": "4939661082101963", "title": "七绝·木化石", "genre": "七绝", "body": "树经万载还坚挺，\n纹理清晰质不同。\n卧睡泥中抬腿立，\n林边湖畔笑相迎。 ​​​", "date": "2023.08.28", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4939661082101963 - 七绝       木化石/01.jpg"]}, {"id": "4940031326686892", "title": "七绝·吟望", "genre": "七绝", "body": "秋果盈盈景色新，\n鸣蝉飞鸟喜为临。\n可怜桔柿千疮孔，\n谁慰茅棚泣血心。 ​​​", "date": "2023.08.29", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4940031326686892 - 七绝           吟望/01.jpg"]}, {"id": "4940734098051472", "title": "七绝·闻讯吟", "genre": "七绝", "body": "雷蒙多怨华为猛，\n爆款银屏耀眼星。\n向死而生今挺立，\n无情打脸不知疼！ ​​​", "date": "2023.08.31", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4940734098051472 - ​七绝        闻讯吟/01.jpg"]}, {"id": "4941116212775616", "title": "采桑子·天山天池", "genre": "采桑子", "body": "万年岭雪冰融化。\n川水溪流，\n涛浪无忧。\n汇入瑶池王母游。\n蟠桃会上从仙乐。\n无欲何求，\n无怨何愁。\n唤鸟携云日月悠。 ​​​", "date": "2023.09.01", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4941116212775616 - 采桑子 天山天池/01.jpg", "冰雪诗词_全部图片/4941116212775616 - 采桑子 天山天池/02.jpg", "冰雪诗词_全部图片/4941116212775616 - 采桑子 天山天池/03.jpg", "冰雪诗词_全部图片/4941116212775616 - 采桑子 天山天池/04.jpg", "冰雪诗词_全部图片/4941116212775616 - 采桑子 天山天池/05.jpg", "冰雪诗词_全部图片/4941116212775616 - 采桑子 天山天池/06.jpg", "冰雪诗词_全部图片/4941116212775616 - 采桑子 天山天池/07.jpg", "冰雪诗词_全部图片/4941116212775616 - 采桑子 天山天池/08.jpg", "冰雪诗词_全部图片/4941116212775616 - 采桑子 天山天池/09.jpg"]}, {"id": "4941843240845341", "title": "五律·九三寄怀", "genre": "五律", "body": "当年倭寇败，\n今日不甘心。\n还做嚣张梦，\n犹来弄鬼神。\n奈何华夏盛，\n早已九州春。\n草木山河翠，\n巨龙腾碧云。 ​​​", "date": "2023.09.03", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4941843240845341 - 五律 九三寄怀/01.jpg", "冰雪诗词_全部图片/4941843240845341 - 五律 九三寄怀/02.jpg"]}, {"id": "4942290407654995", "title": "七绝·秋日吟", "genre": "七绝", "body": "老来惬意品闲茶，\n回味当年向晚霞。\n舒卷浮云终远去，\n任由鬓发染霜华。 ​​​", "date": "2023.09.04", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4942290407654995 - 七绝       秋日吟/01.jpg"]}, {"id": "4942555537735966", "title": "踏莎行·寇与民", "genre": "踏莎行", "body": "五味沉浮，\n一腔无奈。\n曾经多少阴招坏。\n扣人断货打华为，\n抱团围困图她败。\n任有提防，\n海思澎湃。\n深蹲飞脚高墙踹。\n纵横腾跃志凌空，\n回头已在云天外。 ​​​", "date": "2023.09.05", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4942555537735966 - 踏莎行    寇与民/01.jpg"]}, {"id": "4942931486573905", "title": "七绝·秋日暮吟", "genre": "七绝", "body": "夕阳金水河边俏，\n岸草微黄掩落晖。\n飒爽秋风今又是，\n云天人字雁南飞。 ​​​", "date": "2023.09.06", "themes": ["山水田园与闲居雅趣", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4942931486573905 - 七绝    秋日暮吟/01.jpg"]}, {"id": "4943287989568431", "title": "七绝·秋日闲吟", "genre": "七绝", "body": "笑敞胸怀体魄康，\n闲心且赏碧云光。\n低头坎坷终需过，\n昂首前行岁月长。 ​​​", "date": "2023.09.07", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4943287989568431 - 七绝    秋日闲吟/01.jpg"]}, {"id": "4943638256157760", "title": "七绝·白露吟", "genre": "七绝", "body": "草木秋来七色光，\n人生五味百年尝。\n心头喜怒千般过，\n便是祸福无可慌。 ​​​", "date": "2023.09.08", "themes": ["四时风光与节气流转", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4943638256157760 - 七绝        白露吟/01.jpg"]}, {"id": "4944021823950714", "title": "清平乐·缅怀主席", "genre": "清平乐", "body": "人民没忘，\n日久情怀涨。\n一个声音华夏荡，\n功盖九州无上。\n九月九日同悲，\n天丝心泪纷飞。\n黄叶伤神飘落，\n凉风寒意频催。 ​​​", "date": "2023.09.09", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4944021823950714 - 清平乐 缅怀主席/01.jpg"]}, {"id": "4944388104653050", "title": "满江红·谢师恩同窗聚", "genre": "满江红", "body": "京邑山河，风光秀，秋辉万里。\n重聚首，千思百感，共宵同日。\n塞北江南情不尽，相逢携手还兄弟。\n校园内，老树鸟欢鸣，云鹰喜。\n青春季，星辰起。\n楼馆内，师生事。\n更青丝白发，图强酬志。\n今返东楼回首望，汗流泪洒神州地。\n四十载，无憾为同窗，长相忆。\n踏莎行    喜重逢\n四秩春秋，\n万千昼夜。\n重逢母校情怀切。\n天南塞北鸟飞还，\n清东农苑欢声烈。\n别日青丝，\n见时霜雪。\n秦腔豫调心头悦。\n同窗聚首话今昔，\n晚霞飞渡关山越。", "date": "2023.09.10", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4944388104653050 - ​    满江红       谢师恩同窗聚/01.jpg", "冰雪诗词_全部图片/4944388104653050 - ​    满江红       谢师恩同窗聚/02.jpg"]}, {"id": "4945098385131814", "title": "七绝·边城吟望", "genre": "七绝", "body": "秋香遍野色缤纷，\n云卷蝉鸣草木深。\n闲日无心观景物，\n惟思故土念双亲。 ​​​", "date": "2023.09.12", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4945098385131814 - 七绝    边城吟望/01.jpg"]}, {"id": "4945429760836304", "title": "七绝·吟所见", "genre": "七绝", "body": "青铜器里捡刀枪，\n磨洗唬人翻自伤。\n相遇阵前多硬货，\n身无钢铁莫呈强。 ​​​", "date": "2023.09.13", "themes": ["感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4945429760836304 - 七绝       吟所见/01.jpg"]}, {"id": "4945821945038440", "title": "喝火令·天山大峡谷", "genre": "喝火令", "body": "谷底溪流漫，青龙翠嶂间。半山腰处有湖泉。牛马草滩群逛，鹰雁自悠闲。\n雪岭遥相见，冰川亿万年。醉人风色染天山。夏日云飞，夏日雨丝绵，夏日客游舟渡，笑浪卷长天。 ​​​", "date": "2023.09.14", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4945821945038440 - 喝火令         天山大峡谷/01.jpg", "冰雪诗词_全部图片/4945821945038440 - 喝火令         天山大峡谷/02.jpg", "冰雪诗词_全部图片/4945821945038440 - 喝火令         天山大峡谷/03.jpg", "冰雪诗词_全部图片/4945821945038440 - 喝火令         天山大峡谷/04.jpg", "冰雪诗词_全部图片/4945821945038440 - 喝火令         天山大峡谷/05.jpg", "冰雪诗词_全部图片/4945821945038440 - 喝火令         天山大峡谷/06.jpg", "冰雪诗词_全部图片/4945821945038440 - 喝火令         天山大峡谷/07.jpg", "冰雪诗词_全部图片/4945821945038440 - 喝火令         天山大峡谷/08.jpg", "冰雪诗词_全部图片/4945821945038440 - 喝火令         天山大峡谷/09.jpg"]}, {"id": "4946185564717834", "title": "苏幕遮·天山大峡谷", "genre": "苏幕遮", "body": "谷深长，云阵远。\n溪水奔流，翠嶂峰崖暖。\n照壁山头松子漫。\n湖上天鹅，相对情舒展。\n夏风凉，丝雨浅。\n朋侣穿行，嘻笑无人管。\n闹市憋声心底乱。\n来到此间，极目忧愁散。 ​​​", "date": "2023.09.15", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4946185564717834 - 苏幕遮    天山大峡谷/01.jpg", "冰雪诗词_全部图片/4946185564717834 - 苏幕遮    天山大峡谷/02.jpg", "冰雪诗词_全部图片/4946185564717834 - 苏幕遮    天山大峡谷/03.jpg"]}, {"id": "4946908230716534", "title": "七绝·吟图寄怀", "genre": "七绝", "body": "民心所向比天高，\n无视岂能涛浪消。\n三座大山难自去，\n伟人挥手换今朝。 ​​​", "date": "2023.09.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4946908230716534 - 七绝    吟图寄怀/01.jpg"]}, {"id": "4947309491127205", "title": "破阵子·918咏怀", "genre": "破阵子", "body": "又望卢沟晓月，\n叠加旧恨新仇。\n日寇洋中排秽水，\n浊浪污涛肆虐流。\n八方物态忧。\n只为东瀛私利，\n反来祸害寰球。\n人损心歪遭唾骂，\n无耻之徒不道羞。\n倭邦无可留。 ​​​", "date": "2023.09.18", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4947309491127205 - 破阵子  918咏怀/01.jpg"]}, {"id": "4947622824249378", "title": "七绝·吟望", "genre": "七绝", "body": "秋日街头百果香，\n斜晖买卖两相忙。\n手提心悦回家品，\n去载车轻喜色扬。 ​​​", "date": "2023.09.19", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4947622824249378 - 七绝          吟望/01.jpg"]}, {"id": "4947996694547592", "title": "七绝·秋日暮吟", "genre": "七绝", "body": "红霞万里裹金辉，\n洒向尘间鸟欲归。\n天地无边浑一色，\n飞来绕去总难回。 ​​​", "date": "2023.09.20", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4947996694547592 - 七绝    秋日暮吟/01.jpg"]}, {"id": "4948376276437957", "title": "临江仙·秋日抒怀", "genre": "临江仙", "body": "霜鬓闲身心未老，\n时而轻点银屏。\n横瞥南北与西东。\n古今天下事，\n渐次入怀中。\n贤圣英豪流誉后，\n奸臣贼子污名。\n千秋万代映长空。\n是非成与败，\n岂可尽随风。 ​​​", "date": "2023.09.21", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4948376276437957 - 临冮仙 秋日抒怀/01.jpg"]}, {"id": "4949469167618720", "title": "七绝·秋夜吟", "genre": "七绝", "body": "秋分之日祖孙别，\n幼女回京喜见爹。\n转日老夫回故土，\n彊城挥手暂心歇。 ​​​", "date": "2023.09.24", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4949469167618720 - 七绝        秋夜吟/01.jpg"]}, {"id": "4949531743224737", "title": "西江月·回乡吟", "genre": "西江月", "body": "数尽边城夏日，\n归来故里秋风。\n云空万里绪无穷。\n入户心头方定。\n拜见堂前父母，\n闻听树杪鹂莺。\n炊烟袅袅绕榴红。\n犬吠鸡鸣相映。 ​​​", "date": "2023.09.24", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4949531743224737 - 西江月    回乡吟/01.jpg"]}, {"id": "4949776733049031", "title": "西江月·吟望寄怀", "genre": "西江月", "body": "昂首华为吐气，\n挺胸九夏扬眉。\n奋蹄快马任凭追。\n卷起风烟无悔。\n路上牛羊忌妒，\n枝头鸦雀胡吹。\n犬狼使绊亦徒悲。\n一骑绝尘无畏。 ​​​", "date": "2023.09.25", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4949776733049031 - 西江月 吟望寄怀/01.jpg"]}, {"id": "4950143477482640", "title": "七绝·农家秋喜", "genre": "七绝", "body": "耋耄家翁未肯闲，\n冬瓜上架院门前。\n根苗不负辛勤手，\n三尺皮瓤巧为餐。 ​​​", "date": "2023.09.26", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4950143477482640 - 七绝    农家秋喜/01.jpg"]}, {"id": "4950501696212839", "title": "采桑子·亚运会", "genre": "采桑子", "body": "断桥垂柳西湖畔。\n今日杭州，\n星耀寰球。\n七色缤纷异彩流。\n健儿奔跑神情奋。\n夺冠图谋，\n呐喊无休。\n握举金杯向仲秋。 ​​​", "date": "2023.09.27", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4950501696212839 - ​采桑子    亚运会/01.jpg"]}, {"id": "4950870195177354", "title": "采桑子·回家寄怀", "genre": "采桑子", "body": "中秋临近归思切。\n万里还乡，\n侍候爹娘。\n陪伴三餐焐暖床。\n闻听无遍家常事。\n东短西长，\n磨破心房。\n只为双亲眉上扬。 ​​​", "date": "2023.09.28", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4950870195177354 - 采桑子 回家寄怀/01.jpg"]}, {"id": "4951226266945973", "title": "清平乐·中秋夜", "genre": "清平乐", "body": "月明天外，\n游子还家拜。\n心向高堂情自在，\n两袖清风无怪。\n丹桂摇拽飘香，\n嫦娥浅靥眉扬。\n遥望银辉玉兔，\n九州挥洒康祥。 ​​​", "date": "2023.09.29", "themes": ["四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4951226266945973 - 清平乐    中秋夜/01.jpg"]}, {"id": "4951603602787445", "title": "清平乐·930寄怀", "genre": "清平乐", "body": "英雄远逝，\n亿万人当记。\n血洒神州山海地，\n方有今朝盛世。\n十五明月清圆，\n阖家欢聚堂前\n静好来之不易，\n缅怀先烈英贤。 ​​​", "date": "2023.09.30", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4951603602787445 - 清平乐  930寄怀/01.jpg", "冰雪诗词_全部图片/4951603602787445 - 清平乐  930寄怀/02.jpg", "冰雪诗词_全部图片/4951603602787445 - 清平乐  930寄怀/03.jpg"]}, {"id": "4951692468555422", "title": "五绝·游子吟", "genre": "五绝", "body": "正乡思不住，\n恰月色多情。\n拂晓心难待，\n孤身赶夜程。 ​​​", "date": "2023.09.30", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4951692468555422 - 五绝 游子吟/01.jpg"]}, {"id": "4951950849213717", "title": "采桑子·十一颂", "genre": "采桑子", "body": "花篮锦簇门楼丽。\n万象更新，\n四季缤纷。\n华夏山河久似春。\n人逢国庆心欢喜。\n行亦思君，\n坐亦思君。\n领袖当年留下根。 ​​​", "date": "2023.10.01", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4951950849213717 - 采桑子    十一颂/01.jpg", "冰雪诗词_全部图片/4951950849213717 - 采桑子    十一颂/02.jpg", "冰雪诗词_全部图片/4951950849213717 - 采桑子    十一颂/03.jpg", "冰雪诗词_全部图片/4951950849213717 - 采桑子    十一颂/04.jpg", "冰雪诗词_全部图片/4951950849213717 - 采桑子    十一颂/05.jpg", "冰雪诗词_全部图片/4951950849213717 - 采桑子    十一颂/06.jpg"]}, {"id": "4952312432034354", "title": "七绝·仲秋闲吟", "genre": "七绝", "body": "酒不在多情意真，\n城南一味聚乡邻。\n把樽漫品廉州菜，\n风色宜人几醉心。 ​​​", "date": "2023.10.02", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4952312432034354 - 七绝    仲秋闲吟/01.jpg"]}, {"id": "4952674758297126", "title": "唐多令·假日吟望", "genre": "唐多令", "body": "国庆并中秋，园区客不流。踵相连，左右摇头。本是欢心观景致。如今却，满怀愁。\n昏暮困山沟，风呼月挽留。望星空，思绪难收。悔不当初回故里。门庭静，日无忧。 ​​​", "date": "2023.10.03", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4952674758297126 - 唐多令        假日吟望/01.jpg"]}, {"id": "4953036884543274", "title": "渔家傲·假日吟望", "genre": "渔家傲", "body": "节日仲秋黄叶乱，\n远行心堵车流慢。\n无奈道旁支灶碗。\n烧午饭，\n斜晖星月人难散。\n长假无情将过半，\n阻途还未家亲见。\n父老依门愁望眼。\n苦相盼，\n先前已订团圆宴。 ​​​", "date": "2023.10.04", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4953036884543274 - 渔家傲 假日吟望/01.jpg"]}, {"id": "4953399532717861", "title": "醉太平·小院中秋", "genre": "醉太平", "body": "明空月远，\n清辉露浅。\n瓦墙门户桂香软。\n角梧黄叶卷。\n和家团聚心头暖。\n闲唠嗑，亲情满。\n取悦爹娘有谁懒。\n竞端茶怕晚。 ​​​", "date": "2023.10.05", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "咏物寄意与比兴抒怀", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4953399532717861 - 醉太平 小院中秋/01.jpg"]}, {"id": "4953763267216892", "title": "破阵子·家印翻车", "genre": "破阵子", "body": "欲与天长地久，\n妄图五岳三山。\n白纸阴阳翻作画，\n跑马东西把地圈。\n耍狂傲世间。\n不道星高海阔，\n言行离谱无边。\n明处光鲜凭造势，\n背后贪婪洗巨钱。\n为囚臭万年。 ​​​", "date": "2023.10.06", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4953763267216892 - 破阵子 家印翻车/01.jpg"]}, {"id": "4954125568050344", "title": "七绝·心聚", "genre": "七绝", "body": "假末欢逢饮五粮，\n情深意暖透中肠。\n倾樽一霎心头醉，\n盘盏多情恋故乡。 ​​​", "date": "2023.10.07", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4954125568050344 - 七绝          心聚/01.jpg"]}, {"id": "4954486403500013", "title": "七绝·时令吟", "genre": "七绝", "body": "露水清莹晓色寒，\n西风黄叶晚秋天。\n菊香漫起东篱下，\n鸡犬埋头向日边。 ​​​", "date": "2023.10.08", "themes": ["山水田园与闲居雅趣", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4954486403500013 - ​七绝        时令吟/01.jpg"]}, {"id": "4954848660819307", "title": "五绝·吟望", "genre": "五绝", "body": "碧水红枫衬，\n黄花漫自开。\n云空孤雁去，\n霜鬓晚秋来。 ​​​", "date": "2023.10.09", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4954848660819307 - ​五绝    吟望/01.jpg", "冰雪诗词_全部图片/4954848660819307 - ​五绝    吟望/02.jpg"]}, {"id": "4955221798684995", "title": "鹧鸪天·秋思", "genre": "鹧鸪天", "body": "晓色朦胧独自行，\n残星隐去冷西风。\n寒鸦未醒枝头卧，\n旭日将升远处明。\n沿树径，躲车灯。\n身躯微汗绪难宁。\n归来故里无多日，\n孙女呼爷去北京。 ​​​", "date": "2023.10.10", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4955221798684995 - 鹧鸪天       秋思/01.jpg"]}, {"id": "4955574024801326", "title": "折桂令·秋思", "genre": "折桂令", "body": "胸中父母孙娃。心向京都，难舍贫家。左右为难，寻思日夜，苦闷无他。\n犹似深根嫩芽，壮枝方有娇花。开谢天然，春夏轮回，久历繁华。 ​​​", "date": "2023.10.11", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4955574024801326 - 折桂令     秋思/01.jpg"]}, {"id": "4955938110046538", "title": "踏莎行·秋日寄怀", "genre": "踏莎行", "body": "娘老痴呆，\n爹聋勤快。\n朝依暮伴无嗔怪。\n为儿不孝走东西，\n几头老少皆吾爱。\n无术分身，\n全心祈拜。\n廉州宫面京唐菜。\n多情明月寄边城，\n且将孙女嫦娥带。 ​​​", "date": "2023.10.12", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4955938110046538 - 踏莎行 秋日寄怀/01.jpg"]}, {"id": "4956299465851569", "title": "踏莎行·悼明生君", "genre": "踏莎行", "body": "别去一年，\n聚来无盼。\n阴阳两界空留怨。\n人逢花甲事悲秋，\n归休未稳魂飞散。\n共事情深，\n同窗意满。\n曾邀山水闲来转。\n奈君早逝愿随风，\n金樽久等鸿音断。 ​​​", "date": "2023.10.13", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4956299465851569 - 踏莎行 悼明生君/01.jpg"]}, {"id": "4956661023244382", "title": "七绝·秋日闲吟", "genre": "七绝", "body": "人生好似一杯茶，\n叶展香浮卷浪花。\n水净烟消闲望月，\n于无声处是咱家。 ​​​", "date": "2023.10.14", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4956661023244382 - 七绝   秋日闲吟/01.jpg"]}, {"id": "4957028014098256", "title": "七绝·秋别", "genre": "七绝", "body": "泪语爹娘多保重，\n为儿今日向京城。\n娇孙召唤将身去，\n满带浓浓二老情。 ​​​", "date": "2023.10.15", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4957028014098256 - 七绝           秋别/01.jpg"]}, {"id": "4957390082409545", "title": "七绝·秋喜", "genre": "七绝", "body": "半月再逢秋意浓，\n孙娃清秀态初成。\n与爷相见情无禁，\n俏语娇言悦老翁。 ​​​", "date": "2023.10.16", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4957390082409545 - 七绝           秋喜/01.jpg", "冰雪诗词_全部图片/4957390082409545 - 七绝           秋喜/02.jpg"]}, {"id": "4957750275605311", "title": "七绝·本性难移", "genre": "七绝", "body": "狗脸阴阳快过天，\n家亲不认咬眉间，\n口鼻血注悲声切，\n悔不当初把手牵。 ​​​", "date": "2023.10.17", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4957750275605311 - 七绝    本性难移/01.jpg"]}, {"id": "4959578135725904", "title": "七绝·秋夜吟", "genre": "七绝", "body": "乌云压顶终将去，\n大厦欲倾梁栋支。\n自古人生多坎坷，\n清风明月不相欺。 ​​​", "date": "2023.10.22", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4959578135725904 - 七绝       秋夜吟/01.jpg"]}, {"id": "4959922341281932", "title": "七绝·秋夜寄妻", "genre": "七绝", "body": "姐妹三人未敢眠，\n西风卷叶不知寒。\n娘亲无助心头苦，\n泪眼湿襟痛胆肝。 ​​​", "date": "2023.10.23", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4959922341281932 - 七绝    秋夜寄妻/01.jpg"]}, {"id": "4960309908606037", "title": "七绝·暮秋吟", "genre": "七绝", "body": "重阳心乱未登高，\n霜降来临万木凋。\n花谢逢春开又艳，\n人生逆旅似烟消。 ​​​", "date": "2023.10.24", "themes": ["四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4960309908606037 - 七绝        暮秋吟/01.jpg"]}, {"id": "4960665337856994", "title": "七绝·秋日吟望", "genre": "七绝", "body": "妻愁古冶娘亲事，\n吾在京城为幼忙。\n寄望有人能替代，\n凌空插翅到君旁。 ​​​", "date": "2023.10.25", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4960665337856994 - 七绝    秋日吟望/01.jpg"]}, {"id":
