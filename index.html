庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4754810845529020 - 七绝           清明/01.jpg", "冰雪诗词_全部图片/4754810845529020 - 七绝           清明/02.jpg"]}, {"id": "4755183987331336", "title": "太常引·神州防疫", "genre": "太常引", "body": "且凭绿码过乡关。\n堪验手机端，\n开口测核酸。\n疫情紧，\n群防自安。\n白衣天使，\n辛劳假日，\n昼夜苦难眠。\n情暖九州天。\n诚可敬，\n当今世间。 ​​​", "date": "2022.04.06", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4755183987331336 - ​太常引 神州防疫/01.jpg", "冰雪诗词_全部图片/4755183987331336 - ​太常引 神州防疫/02.jpg"]}, {"id": "4755537301866221", "title": "七绝·闲题", "genre": "七绝", "body": "丐帮之主口悬河，\n望月贪天梦境多。\n唤雨支风嗔玉帝，\n醒来依旧傍鸡窝。 ​​​", "date": "2022.04.07", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4755537301866221 - 七绝           闲题/01.jpg"]}, {"id": "4755902249567362", "title": "蝶恋花·春日寄怀", "genre": "蝶恋花", "body": "回到家乡心底畅。\n风暖空明，庭院飞花浪。\n紫粉黄红相竞放，\n疫情难阻春波漾。\n尽日鹊莺窗下唱。\n来去无忧，彩翼凭人望。\n伫立凝眸思绪旷，\n芳菲满眼神魂爽。 ​​​", "date": "2022.04.08", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4755902249567362 - 回到家乡心底畅。/01.jpg", "冰雪诗词_全部图片/4755902249567362 - 回到家乡心底畅。/02.jpg"]}, {"id": "4756261846911582", "title": "蝶恋花·父高寿", "genre": "蝶恋花", "body": "目不识丁身手巧。\n口快心良，\n嗓大鞋偏小。\n耋耄之年人尚好，\n苍颜耳背家中宝。\n午宴庆生筹划早。\n晚辈奔忙，\n各把真情表。\n满院生机春不老，\n舒怀父母儿孙俏。 ​​​", "date": "2022.04.09", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4756261846911582 - 蝶恋花    父高寿/01.jpg"]}, {"id": "4756624470704429", "title": "鹧鸪天·春晓吟", "genre": "鹧鸪天", "body": "冷暖宜人四月天，\n清明过后草如烟。\n杏红桃粉云天碧，\n燕舞莺鸣竞纸鸢。\n杨絮乱，李花妍。\n归鸦栖树夜深眠。\n晓来风色天光好，\n郊野游人阡陌欢。 ​​​", "date": "2022.04.10", "themes": ["四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4756624470704429 - 鹧鸪天   春晓吟/01.jpg"]}, {"id": "4756984295850818", "title": "蝶恋花·春趣", "genre": "蝶恋花", "body": "姑嫂踏青寻野菜。\n入眼桃花，\n摇曳随风摆。\n朵朵轻盈蜂不怪，\n撩人思绪青霄外。\n望里碧空云自在。\n回首弯腰，\n葱翠心头快。\n纤手摘来香满袋，\n午餐饺子招人爱。 ​​​", "date": "2022.04.11", "themes": ["羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4756984295850818 - 蝶恋花       春趣/01.jpg", "冰雪诗词_全部图片/4756984295850818 - 蝶恋花       春趣/02.jpg"]}, {"id": "4757346095467443", "title": "七律·亲情", "genre": "七律", "body": "相思相念最伤神，\n游子双亲望断魂。\n父沐冬阳心不暖，\n儿逢春色苦为人。\n却从相见眉头俏，\n便总欣闻鹊啭音。\n疑病如云九霄散，\n花开朝暮笑容频。 ​​​", "date": "2022.04.12", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4757346095467443 - 七律           亲情/01.jpg"]}, {"id": "4757708907744591", "title": "七绝·春晓吟行", "genre": "七绝", "body": "夜雨无心翠色生，\n晓风花绽露娇容。\n红阳冉冉云天外，\n郊野芳香缓步行。 ​​​", "date": "2022.04.13", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4757708907744591 - 七绝   春晓吟行/01.jpg"]}, {"id": "4758072348378091", "title": "点绛唇·暮春夜吟", "genre": "点绛唇", "body": "明月清风，\n良宵一刻千般好。\n凭栏远眺，\n银汉星河俏。\n院静心闲，\n惟恐春将老。\n情难了。\n花红又少，\n惊鹊枝头闹。 ​​​", "date": "2022.04.14", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4758072348378091 - 点绛唇 暮春夜吟/01.jpg"]}, {"id": "4758434317077464", "title": "七绝·赏文赠友", "genre": "七绝", "body": "字句珠玑胜似金，\n奈何拜票苦衷心。\n宜凭杯酒云台醉，\n闲看银霄月起沉。 ​​​", "date": "2022.04.15", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4758434317077464 - 七绝    赏文赠友/01.jpg"]}, {"id": "4758796490507138", "title": "鹧鸪天·遣兴", "genre": "鹧鸪天", "body": "花甲斑颜未老心，\n晨昏两练久强身。\n秋冬不畏风霜苦，\n春夏尤觉雨露亲。\n翻卷卧，挺直蹲。\n单双杠上笑晴阴。\n繁花翠柳凝神望，\n飞鸟回头探个真。 ​​​", "date": "2022.04.16", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4758796490507138 - 鹧鸪天       遣兴/01.jpg"]}, {"id": "4759166919380747", "title": "踏莎行·巡宇归来", "genre": "踏莎行", "body": "半载飞天，\n三杰落地。\n东风激荡英雄气。\n神舟万里客安归，\n鲜花朵朵欢声溢。\n亿万人观，\n无穷情寄。\n莺歌燕舞云霄丽。\n高空巨伞绪飘飘，\n草原怀抱深深意。 ​​​", "date": "2022.04.17", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4759166919380747 - 踏莎行 巡宇归来/01.jpg", "冰雪诗词_全部图片/4759166919380747 - 踏莎行 巡宇归来/02.jpg", "冰雪诗词_全部图片/4759166919380747 - 踏莎行 巡宇归来/03.jpg"]}, {"id": "4759522852474059", "title": "七绝·遥看", "genre": "七绝", "body": "临屏万里望孙娃，\n两眼晶莹一朵花。\n雨润云娇飞鸟悦，\n春风桃李映朝霞。 ​​​", "date": "2022.04.18", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4759522852474059 - 七绝          遥看/01.jpg", "冰雪诗词_全部图片/4759522852474059 - 七绝          遥看/02.jpg", "冰雪诗词_全部图片/4759522852474059 - 七绝          遥看/03.jpg"]}, {"id": "4759885230901312", "title": "太常引·春岸吟", "genre": "太常引", "body": "民心河水漾清波，\n草岸柳婆娑。\n莺鹊踏枝歌。\n晓风细，\n红欣翠多。\n春回大地，\n云祥日丽，\n花影妙音和。\n晨练乐呵呵。\n心无虑，\n阴晴奈何。 ​​​", "date": "2022.04.19", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4759885230901312 - 太常引    春岸吟/01.jpg", "冰雪诗词_全部图片/4759885230901312 - 太常引    春岸吟/02.jpg"]}, {"id": "4760247790471385", "title": "七绝·谷雨春望", "genre": "七绝", "body": "草木欣欣花色艳，\n枝头翠鸟清音啭。\n田间谷物嫩芽生，\n春笋香茶谁不羡！ ​​​", "date": "2022.04.20", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4760247790471385 - 七绝    谷雨春望/01.jpg", "冰雪诗词_全部图片/4760247790471385 - 七绝    谷雨春望/02.jpg", "冰雪诗词_全部图片/4760247790471385 - 七绝    谷雨春望/03.jpg"]}, {"id": "4760609469499223", "title": "鹧鸪天·遥望闲吟", "genre": "鹧鸪天", "body": "暴雨袭来鸟雀惊，\n危巢难耐对狂风。\n残枝败叶随天去，\n云卷雷劈电闪鸣。\n家道破，念思空。\n梦宵悲断苦求生。\n蓬头乱撞无着处，\n魂魄凄迷失北东。 ​​​", "date": "2022.04.21", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4760609469499223 - 鹧鸪天 遥望闲吟/01.jpg"]}, {"id": "4760971308960159", "title": "鹧鸪天·对酒当歌", "genre": "鹧鸪天", "body": "逆旅人生且向前，\n犹如溪水下高山。\n历经坎坷心无悔，\n漫度春秋气不残。\n悲复乐，苦含甜。\n世间百味自缠绵。\n万千财物终消去，\n惟有声名殢远天。 ​​​", "date": "2022.04.22", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4760971308960159 - 鹧鸪天 对酒当歌/01.jpg"]}, {"id": "4761333465089720", "title": "七绝·闻事吟", "genre": "七绝", "body": "风云叵测且由天，\n道路尽头宜转弯。\n莫撞南墙生悔恨，\n谨行远眺度关山。 ​​​", "date": "2022.04.23", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4761333465089720 - 七绝       闻事吟/01.jpg"]}, {"id": "4761697003504508", "title": "七绝·主仆怨", "genre": "七绝", "body": "舞棒弄枪伤己身，\n家奴远看暗销魂。\n不知南北如何是，\n乱起风烟天地昏。 ​​​", "date": "2022.04.24", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4761697003504508 - 七绝       主仆怨/01.jpg"]}, {"id": "4762059827578427", "title": "五律·听与看", "genre": "五律", "body": "遇事两边听，\n切毋凭感情。\n书生多意气，\n自古少英雄。\n常陷蜗牛角，\n鲜闻海浪声。\n倘如埋首看，\n难见碧云空。 ​​​", "date": "2022.04.25", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4762059827578427 - 五律 听与看/01.jpg"]}, {"id": "4762422823355300", "title": "蝶恋花·殃及池鱼", "genre": "蝶恋花", "body": "股市风云谁搅动？\n绿劲红衰，\n多少人生痛。\n一路狂奔留暗影，\n似花零落心难静。\n往日春来牛市盛。\n却是今朝，\n熊势波涛涌。\n战火未休魂不定，\n金牛无奈情难纵。 ​​​", "date": "2022.04.26", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4762422823355300 - ​蝶恋花 殃及池鱼/01.jpg"]}, {"id": "4762783742428395", "title": "蝶恋花·河边春趣", "genre": "蝶恋花", "body": "春暮绿阴多几许。\n落絮飘香，\n时见飞红雨。\n莺鹊同欢枝杪聚，\n城河戏水鸳鸯侣。\n岸柳风摇丝缕缕。\n影动鱼争，\n情惹寻花女。\n伫立凝眸盈笑语，\n凭栏俯首思吟句。 ​​​", "date": "2022.04.27", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4762783742428395 - ​蝶恋花 河边春趣/01.jpg"]}, {"id": "4763146172499196", "title": "七绝·赠同窗", "genre": "七绝", "body": "笔歌盛世颂新春，\n酣畅抒怀墨色珍。\n挚友欣闻吟百遍，\n何须陌路客倾心。 ​​​", "date": "2022.04.28", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4763146172499196 - 七绝       赠同窗/01.jpg"]}, {"id": "4763507662520770", "title": "太常引·惜春", "genre": "太常引", "body": "暮春晓雨落花风，\n一并卷红英。\n鸦雀亦伤情。\n怎无奈，\n枝头泣鸣。\n朝夕相伴，\n而今别去，\n何日再重逢。\n愁啭送君行。\n从此后，\n难寻俏容。 ​​​", "date": "2022.04.29", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4763507662520770 - 太常引       惜春/01.jpg"]}, {"id": "4763870269279746", "title": "七绝·闲看水军", "genre": "七绝", "body": "假作真时心里怕，\n无为有处夜来惊。\n撕去伪装皆丑态，\n魅魑魍魉露原形。 ​​​", "date": "2022.04.30", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4763870269279746 - 七绝   闲看水军/01.jpg"]}, {"id": "4764232337852643", "title": "浣溪沙·五一寄怀", "genre": "浣溪沙", "body": "劳者今朝气自扬，\n披红昂首入厅堂。\n身心陶醉焕荣光。\n五月来临风色好，\n三春将尽果蔬香。\n花开月季久芬芳。 ​​​", "date": "2022.05.01", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4764232337852643 - ​浣溪沙 五一寄怀/01.jpg", "冰雪诗词_全部图片/4764232337852643 - ​浣溪沙 五一寄怀/02.jpg"]}, {"id": "4764595933154246", "title": "七绝·错位", "genre": "七绝", "body": "千里相投作演员，\n惊神瞥眼给谁看。\n自家琴瑟无心奏，\n醉恋他人破管弦。 ​​​", "date": "2022.05.02", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4764595933154246 - 七绝           错位/01.jpg"]}, {"id": "4764959835424667", "title": "五律·问春", "genre": "五律", "body": "春归何处去，\n把酒问东风。\n悲为花零落，\n愁于鸟泣鸣。\n林空失丽色，\n山水少清莹。\n谁若能留驻，\n金樽敬不停。 ​​​", "date": "2022.05.03", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4764959835424667 - 五律   问春/01.jpg"]}, {"id": "4765339877117238", "title": "清平乐·寄怀", "genre": "清平乐", "body": "百年五四，\n跌宕风云起。\n夏华曾经多少事，\n换了山河天地。\n九州盛世今朝，\n东方屹立情豪。\n更借天宫远望，\n神龙四海逍遥。 ​​​", "date": "2022.05.04", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4765339877117238 - 清平乐        寄怀/01.jpg"]}, {"id": "4765682836702641", "title": "七绝·立夏", "genre": "七绝", "body": "春花零落夏风来，\n飞絮消停月季开。\n草树浓阴蛙戏水，\n芰荷漫舞尽舒怀。 ​​​", "date": "2022.05.05", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4765682836702641 - 七绝          立夏/01.jpg"]}, {"id": "4766047075041394", "title": "七绝·中风", "genre": "七绝", "body": "处事不公遭众怨，\n言谈失理落人嫌。\n本应手脚同凉热，\n却是心歪嘴眼偏。 ​​​", "date": "2022.05.06", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4766047075041394 - 七绝           中风/01.jpg", "冰雪诗词_全部图片/4766047075041394 - 七绝           中风/02.jpg", "冰雪诗词_全部图片/4766047075041394 - 七绝           中风/03.jpg"]}, {"id": "4766413522732950", "title": "七绝·老父亲种菜", "genre": "七绝", "body": "小院阶前腾一角，\n种瓜点豆老来忙。\n葱葱郁郁苍颜乐，\n轻汗舒身饭菜香。 ​​​", "date": "2022.05.07", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4766413522732950 - 七绝 老父亲种菜/01.jpg"]}, {"id": "4766770214995677", "title": "七绝·母亲节寄怀", "genre": "七绝", "body": "妈在家馨饭菜香，\n晚归早起任匆忙。\n粥汤盈碗心头暖，\n尘世忧烦一扫光。 ​​​", "date": "2022.05.08", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4766770214995677 - 七绝 母亲节寄怀/01.jpg", "冰雪诗词_全部图片/4766770214995677 - 七绝 母亲节寄怀/02.jpg"]}, {"id": "4767131365019640", "title": "太常引·勿忘国耻", "genre": "太常引", "body": "当年恶意却虚称，\n欺世隐真情，\n我自愤难平。\n恨贼子，狂言横行。\n忍悲自励，\n军民苦奋，\n华夏唱英雄。\n劲舞仗东风。\n傲寰宇，冲天巨龙。 ​​​", "date": "2022.05.09", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4767131365019640 - 太常引    勿忘国耻/01.jpg", "冰雪诗词_全部图片/4767131365019640 - 太常引    勿忘国耻/02.jpg", "冰雪诗词_全部图片/4767131365019640 - 太常引    勿忘国耻/03.jpg"]}, {"id": "4767495778468485", "title": "七绝·观阅兵有寄", "genre": "七绝", "body": "以子之心度普京，\n犹如蝼蚁望长城。\n狂风恶雨拂墙过，\n难损秦砖质地青。 ​​​", "date": "2022.05.10", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4767495778468485 - 七绝 观阅兵有寄/01.jpg", "冰雪诗词_全部图片/4767495778468485 - 七绝 观阅兵有寄/02.jpg"]}, {"id": "4767862726593105", "title": "唐多令·芳华竞度", "genre": "唐多令", "body": "盛世正青春，\n欣欣当代人。\n展情怀，筑业为民。\n心向神州肝胆赤，\n蔑雨雪，傲风云。\n万漉聚沙金，\n千锤锻铁身。\n烈火中，铸造忠魂。\n山海江河君自笑，\n波浪里，抖精神。 ​​​", "date": "2022.05.11", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4767862726593105 - ​唐多令    芳华竞度/01.jpg"]}, {"id": "4768226217821509", "title": "七绝·赠韦东奕", "genre": "七绝", "body": "数字盈心织锦绣，\n指尖符合写春秋。\n天惊地叹堪神异，\n当代奇才耀九州。 ​​​", "date": "2022.05.12", "themes": ["感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4768226217821509 - 七绝    赠韦东奕/01.jpg", "冰雪诗词_全部图片/4768226217821509 - 七绝    赠韦东奕/02.jpg", "冰雪诗词_全部图片/4768226217821509 - 七绝    赠韦东奕/03.jpg", "冰雪诗词_全部图片/4768226217821509 - 七绝    赠韦东奕/04.jpg", "冰雪诗词_全部图片/4768226217821509 - 七绝    赠韦东奕/05.jpg", "冰雪诗词_全部图片/4768226217821509 - 七绝    赠韦东奕/06.jpg"]}, {"id": "4768580719608780", "title": "五绝·夏夜吟", "genre": "五绝", "body": "连日阴天雨，\n夏初风色寒。\n犹闻疫情紧，\n入夜苦难眠。 ​​​", "date": "2022.05.13", "themes": ["家国情怀与时代歌咏", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4768580719608780 - 五绝 夏夜吟/01.jpg"]}, {"id": "4768944114109328", "title": "七律·雨霁花娇", "genre": "七律", "body": "雨过空明月季鲜，\n粉黄映翠玉珠圆。\n红砖幽径千娇美，\n绿叶纤枝一色妍，\n飞鸟争鸣音调脆。\n游人漫步笑声连，\n春归渐远情难老，\n夏日风光醉眼前。 ​​​", "date": "2022.05.14", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4768944114109328 - ​七律    雨霁花娇/01.jpg", "冰雪诗词_全部图片/4768944114109328 - ​七律    雨霁花娇/02.jpg"]}, {"id": "4769306941850800", "title": "七绝·和行者老弟", "genre": "七绝", "body": "人生一世似征蓬，\n凭借南来北往风。\n海角天涯追日月，\n瑶台圣境笑仙翁。\n七绝           随感\n常万行者\n岁临六十又飘蓬，\n也遇尘霾也遇风。\n幸得两三知己伴，\n珍馐百里犒衰翁。 ​​​", "date": "2022.05.15", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4769306941850800 - 七绝 和行者老弟/01.jpg"]}, {"id": "4769668461758289", "title": "阮郎归·赠天吉", "genre": "阮郎归", "body": "挥毫泼墨写春秋，\n不觉霜染头。\n珠玑词字万人求，\n意情风韵流。\n携朋侣，藐公侯。\n乐于山水游。\n时光飞逝雅名留，\n书香胜馔馐。 ​​​", "date": "2022.05.16", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4769668461758289 - 阮郎归    赠天吉/01.jpg", "冰雪诗词_全部图片/4769668461758289 - 阮郎归    赠天吉/02.jpg"]}, {"id": "4770031114126512", "title": "江城子·赠维真", "genre": "江城子", "body": "征文竞榜动亲朋。\n聚银屏，力无穷。\n点赞欢呼，\n久久意情浓。\n冉冉新星初耀眼。\n风月里，闪光明。\n笔歌盛世亿家宁。\n唱繁荣，颂安平。\n万众争传，\n江海喜盈盈。\n水秀山青莺鹊舞。\n天远阔，地深情。 ​​​", "date": "2022.05.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4770031114126512 - 江城子    赠维真/01.jpg"]}, {"id": "4770394227085804", "title": "西江月·故友重逢", "genre": "西江月", "body": "前日归休五载，\n今朝相聚一餐。\n深情怎不玉樽干。\n回首沉思无限。\n多少难眠共月，\n曾经至乐同天。\n并肩携手越关山。\n远处斗明星闪。 ​​​", "date": "2022.05.18", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4770394227085804 - 西江月故友重逢/01.jpg"]}, {"id": "4770756296444929", "title": "七绝·赠老友", "genre": "七绝", "body": "故朋小聚热衷肠，\n厚意深情赖酒量。\n欲止又言多少事，\n蕲福祷愿玉樽藏。 ​​​", "date": "2022.05.19", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4770756296444929 - 七绝       赠老友/01.jpg"]}, {"id": "4771125009056856", "title": "七绝·大爱无声", "genre": "七绝", "body": "挚爱深沉语却难，\n真情无限隐心田。\n犹如江海胸怀阔，\n归纳百川谁与言。 ​​​", "date": "2022.05.20", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4771125009056856 - 七绝   大爱无声/01.jpg"]}, {"id": "4771491964784284", "title": "阮郎归·小满吟", "genre": "阮郎归", "body": "垄禾浆满柳鸣蝉，\n薰风吻麦田。\n穗头摇拽籽青圆。\n农家喜梦眠。\n楼欲立，瓦飞檐。\n朱门立院前。\n儿孙嘻闹画堂边，\n寻常似过年。 ​​​", "date": "2022.05.21", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4771491964784284 - 阮郎归    小满吟/01.jpg"]}, {"id": "4771843161983474", "title": "七绝·闲吟", "genre": "七绝", "body": "人生小满梦初成，\n寡欲闲心乐自生。\n日月无忧晖永曜，\n山溪高处水云青。 ​​​", "date": "2022.05.22", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4771843161983474 - 七绝           闲吟/01.jpg"]}, {"id": "4772205101321106", "title": "浣溪沙·农家晚景", "genre": "浣溪沙", "body": "初夏黄昏小院幽，\n层云漫卷细风流。\n几声远吠过墙头。\n落日斜晖风色好，\n酒香余味绕唇喉。\n阶前闲坐更何求。 ​​​", "date": "2022.05.23", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4772205101321106 - 浣溪沙 农家晚景/01.jpg"]}, {"id": "4772568768710817", "title": "七绝·奇事", "genre": "七绝", "body": "好心却咽伤心果，\n人性凭颜岂可知。\n当代农夫未生恨，\n如蛇妖女害家妻。 ​​​", "date": "2022.05.24", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4772568768710817 - ​七绝           奇事/01.jpg"]}, {"id": "4772930224917256", "title": "七绝·赠马飞", "genre": "七绝", "body": "种瓜点豆神农事，\n医者种牙今日忙。\n妙手解除餐咀苦，\n言周技湛暖人肠。 ​​​", "date": "2022.05.25", "themes": ["感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4772930224917256 - 七绝        赠马飞/01.jpg"]}, {"id": "4773293578781555", "title": "踏莎行·夏日晚霞", "genre": "踏莎行", "body": "落日熔金，\n层林染翠。\n长空万里千山媚。\n赤橙黄绿彩云飞，\n丹青妙手谁能绘。\n人造失真，\n天然可贵。\n琼枝玉叶娇姿美。\n风光无限惹闲情，\n凭栏颙望心神醉。 ​​​", "date": "2022.05.26", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4773293578781555 - 踏莎行 夏日晚霞/01.jpg"]}, {"id": "4773661917580480", "title": "破阵子·警惕贼子", "genre": "破阵子", "body": "血债未偿难忘，\n又闻挑衅狂言。\n贼寇北约频舞爪，\n欲向神州台海湾。\n以为似旧年。\n华夏军民警惕，\n东风远胜从前。\n胆敢举足插手处，\n马仰人翻不许还。\n一朝雪耻烦。 ​​​", "date": "2022.05.27", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4773661917580480 - 破阵子 警惕贼子/01.jpg"]}, {"id": "4774018949580782", "title": "七绝·阖家欢", "genre": "七绝", "body": "妈妈生日女儿娇，\n两眼不停瞄蛋糕。\n只待烛光星火起，\n鲜香入口乐滔滔。 ​​​", "date": "2022.05.28", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4774018949580782 - 七绝       阖家欢/01.jpg", "冰雪诗词_全部图片/4774018949580782 - 七绝       阖家欢/02.jpg", "冰雪诗词_全部图片/4774018949580782 - 七绝       阖家欢/03.jpg"]}, {"id": "4774379618306624", "title": "太常引·赠维珍", "genre": "太常引", "body": "老来回味少时情，\n最忆是军营。\n豪迈远山行。\n野芜处，黄沙北风。\n长年操练，\n争时自奋。\n枕畔弄书声，\n星月映窗灯。\n换今日，心闲笔耕。 ​​​", "date": "2022.05.29", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4774379618306624 - ​太常引       赠维珍/01.jpg"]}, {"id": "4774742437661318", "title": "蝶恋花·当心被骗", "genre": "蝶恋花", "body": "开口胡诌遭打脸，\n搔首装聋，或许真瞎眼。\n芳草萋萋独不见，\n光天化日心头暗。\n天上风云须细判，\n岂可蒙人，风雨言晴灿。\n闻者有心凭己断，\n经行莫被泥沟陷。 ​​​", "date": "2022.05.30", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4774742437661318 - 蝶恋花          当心被骗/01.jpg"]}, {"id": "4775104918063016", "title": "五绝·咏竹", "genre": "五绝", "body": "心有凌云志，\n无言逐日高。\n当初人不见，\n隐忍秀今朝。 ​​​", "date": "2022.05.31", "themes": ["咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4775104918063016 - 五绝    咏竹/01.jpg"]}, {"id": "4775469360087509", "title": "菩萨蛮·六一孙女乐", "genre": "菩萨蛮", "body": "去年今日怀中抱，\n此时早已穿堂闹。\n蹦跳又登高，\n可怜身体娇。\n寻常多少事，\n灵巧心中记。\n出外一枝花，\n相逢邻里夸。 ​​​", "date": "2022.06.01", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4775469360087509 - 菩萨蛮 六一孙女乐/01.jpg", "冰雪诗词_全部图片/4775469360087509 - 菩萨蛮 六一孙女乐/02.jpg", "冰雪诗词_全部图片/4775469360087509 - 菩萨蛮 六一孙女乐/03.jpg", "冰雪诗词_全部图片/4775469360087509 - 菩萨蛮 六一孙女乐/04.jpg"]}, {"id": "4775829102397721", "title": "阮郎归·童趣", "genre": "阮郎归", "body": "凭添玩具喜娇童，\n初尝意趣浓。\n飞车弯道影匆匆，\n高台绿映红。\n纤手快，眼含情。\n往来乐不穷。\n临窗鸟雀探芳厅，\n满堂笑语盈。 ​​​", "date": "2022.06.02", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4775829102397721 - 阮郎归       童趣/01.jpg"]}, {"id": "4776196904586720", "title": "念奴娇·边地归来", "genre": "念奴娇", "body": "母携娇女，倚银鹰万里，暂回京邑。\n父女重逢，眉眼动，霎那亲情难抑。\n挚爱相拥，臂托怀抱，酷乐人将泣。\n当初音貌，幼儿今刻还记。\n惬意端午团圆，温馨闲聚，美好同欢忆。\n金海家园烟树下，草木荫浓葱郁。\n豌豆柠檬，前期玩伴，又可齐肩立。\n楼前相见，更添节日惊喜。", "date": "2022.06.03", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4776196904586720 - 念奴娇       边地归来/01.jpg", "冰雪诗词_全部图片/4776196904586720 - 念奴娇       边地归来/02.jpg", "冰雪诗词_全部图片/4776196904586720 - 念奴娇       边地归来/03.jpg", "冰雪诗词_全部图片/4776196904586720 - 念奴娇       边地归来/04.jpg"]}, {"id": "4776643699150087", "title": "七绝·端午愿", "genre": "七绝", "body": "祈祷上苍开慧眼，\n施恩眷顾老来人。\n阖家姐妹三人怨，\n苦待慈萱往日音。 ​​​", "date": "2022.06.04", "themes": ["四时风光与节气流转", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4776643699150087 - 七绝       端午愿/01.jpg"]}, {"id": "4776917146797305", "title": "采桑子·痛", "genre": "采桑子", "body": "云空明媚心情重，\n愁绪萦怀，\n挥去还来。\n无尽悲思解不开。\n老人为善疼千忍，\n夜里徘徊，\n不扰儿孩。\n错过良机我辈哀。 ​​​", "date": "2022.06.05", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4776917146797305 - 采桑子           痛/01.jpg"]}, {"id": "4777282574746609", "title": "鹧鸪天·神舟又起", "genre": "鹧鸪天", "body": "刚过端阳入太空，\n三杰携手驻天宫。\n粽香飘溢姮娥喜，\n银箭穿梭鸟雀迎。\n芒种日，碧霄明。\n无边麦浪映苍穹。\n人间天上齐心力，\n山海神州日月同。 ​​​", "date": "2022.06.06", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "四时风光与节气流转", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4777282574746609 - 鹧鸪天 神舟又起/01.jpg"]}, {"id": "4777643603920709", "title": "五绝·登顶", "genre": "五绝", "body": "十年窗下苦，\n策马在今朝。\n笔墨犹刀剑，\n扬鞭气势高。 ​​​", "date": "2022.06.07", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4777643603920709 - 五绝    登顶/01.jpg"]}, {"id": "4778005404322266", "title": "五绝·逐梦", "genre": "五绝", "body": "学子出行早，\n晨星争报晓。\n鹊莺枝杪啼，\n金榜题名号。 ​​​", "date": "2022.06.08", "themes": ["羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4778005404322266 - 五绝    逐梦/01.jpg"]}, {"id": "4778392057284871", "title": "太常引·代妻作", "genre": "太常引", "body": "别时暖语胜春风，\n送我九州行。\n两眼恁含情。\n再相见，\n无言病容。\n双眸紧闭，\n呼吸难耐，\n吾辈痛余生。\n惟恨晚来逢。\n愿天许，\n慈萱日宁。 ​​​", "date": "2022.06.09", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4778392057284871 - 太常引    代妻作/01.jpg"]}, {"id": "4778728170718471", "title": "朝中措·期许", "genre": "朝中措", "body": "三天或可定终生，\n几许梦中同。\n多是喜忧参半，\n将行南北西东。\n青春年少，\n苍天不负，\n勿躁神宁。\n四载春秋苦度，\n今朝立志能赢。 ​​​", "date": "2022.06.10", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4778728170718471 - 朝中措        期许/01.jpg"]}, {"id": "4779091565742923", "title": "浣溪沙·端午有寄", "genre": "浣溪沙", "body": "腌肉今朝入粽鲜，\n不同往日枣微甜。\n醇香盈口绕喉间。\n糯米端阳凭纪念，\n灵均重五怨苍天。\n隐声汨水两千年。 ​​​", "date": "2022.06.11", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4779091565742923 - 浣溪沙 端午有寄/01.jpg"]}, {"id": "4779452628994255", "title": "五绝·人与物", "genre": "五绝", "body": "酷夏望秋声，\n寒冬盼暖风。\n江河峰岭异，\n千古自从容。 ​​​", "date": "2022.06.12", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4779452628994255 - 五绝 人与物/01.jpg"]}, {"id": "4779816064386685", "title": "七律·冀东凤凰城", "genre": "七律", "body": "当年地震起悲哀，\n今日打人涛浪来。\n歌手不堪遭辱禁，\n微商无耐店难开。\n多家倾诉寻常苦，\n一语激发旧怨怀。\n百姓共鸣心里恨，\n警方于事不应该。 ​​​", "date": "2022.06.13", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4779816064386685 - 七律 冀东凤凰城/01.jpg"]}, {"id": "4780177765175045", "title": "七绝·夏日闲吟", "genre": "七绝", "body": "乌鸦麻雀唱双簧，\n摇动羽毛遮太阳。\n炽热天光铺满地，\n无聊乱鸟趁阴凉。 ​​​", "date": "2022.06.14", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4780177765175045 - 七绝    夏日闲吟/01.jpg"]}, {"id": "4780540043200473", "title": "七绝·遥望有感", "genre": "七绝", "body": "风雷激起千层浪，\n水底鱼争蛙鼓鸣。\n昔日乌云暗天地，\n今朝骤雨净尘空。 ​​​", "date": "2022.06.15", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4780540043200473 - 七绝    遥望有感/01.jpg"]}, {"id": "4780902783913546", "title": "蝶恋花·思念", "genre": "蝶恋花", "body": "半月卧床从未醒。\n吾辈煎熬，\n哭叫无回应。\n医护匆忙情与共，\n至亲昼夜浑如梦。\n昔日待人多笑影。\n细语轻言，\n邻里皆称颂。\n祈祷苍天怜百姓，\n一朝惊喜心头送。 ​​​", "date": "2022.06.16", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4780902783913546 - 蝶恋花        思念/01.jpg"]}, {"id": "4781265146351306", "title": "七绝·糗事", "genre": "七绝", "body": "稻草虚称救命船，\n嘻哈打斗庙堂前。\n政经大事如儿戏，\n贼子谋独枉费钱。 ​​​", "date": "2022.06.17", "themes": ["怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4781265146351306 - 七绝           糗事/01.jpg", "冰雪诗词_全部图片/4781265146351306 - 七绝           糗事/02.jpg"]}, {"id": "4781627291207732", "title": "踏莎行·贺航母下水", "genre": "踏莎行", "body": "昔日辽宁，\n今朝福建。\n山东并作屠龙剑。\n追星逐月下洋洲，\n深蓝所向波涛漫。\n白手持家，\n赤心立愿。\n银鹰弹射撩人眼。\n军民血汗汇江流，\n染红山海云光灿。 ​​​", "date": "2022.06.18", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4781627291207732 - 踏莎行 贺航母下水/01.jpg", "冰雪诗词_全部图片/4781627291207732 - 踏莎行 贺航母下水/02.jpg", "冰雪诗词_全部图片/4781627291207732 - 踏莎行 贺航母下水/03.jpg"]}, {"id": "4781989360306419", "title": "阮郎归·老父亲", "genre": "阮郎归", "body": "近来苦闷不多言，\n时常昼卧眠。\n眼虚耳背对苍颜，\n体衰年复年。\n听不见，字无缘。\n梦宵独自烦。\n却忧晚辈世间难，\n椿庭最可怜。 ​​​", "date": "2022.06.19", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4781989360306419 - 阮郎归    老父亲/01.jpg"]}, {"id": "4782352322530040", "title": "七绝·恨", "genre": "七绝", "body": "刻意逢迎区外鬼，\n无情丑化自家亲。\n三星堆里灵光现，\n羞煞先贤上古人。 ​​​", "date": "2022.06.20", "themes": ["亲情友情与人间至爱"], "images": ["冰雪诗词_全部图片/4782352322530040 - 七绝     恨/01.jpg"]}, {"id": "4782716778185284", "title": "五绝·夏至吟", "genre": "五绝", "body": "暑气愁心躁，\n晚风蝉乱鸣。\n病亲难自语，\n吾辈泣无声。 ​​​", "date": "2022.06.21", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4782716778185284 - 五绝 夏至吟/01.jpg"]}, {"id": "4783076611722456", "title": "七绝·赠友", "genre": "七绝", "body": "偶遇相知必有缘，\n银丝回首忆前欢。\n无声岁月风霜去，\n历久情怀似水蓝。 ​​​", "date": "2022.06.22", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4783076611722456 - 七绝           赠友/01.jpg"]}, {"id": "4783439858896149", "title": "鹧鸪天·苦待", "genre": "鹧鸪天", "body": "积秒成分熬昼宵，\n心怀苦闷绪无着。\n凭栏愁望云空寂，\n欹凳忧听医护招。\n情切切，意滔滔。\n三更风雨打窗绡。\n惟期晓霁乌云远，\n病里家亲醒眼梢。 ​​​", "date": "2022.06.23", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4783439858896149 - 鹧鸪天       苦待/01.jpg"]}, {"id": "4783801576982583", "title": "七绝·感悟", "genre": "七绝", "body": "青壮不知生命短，\n老来悔恨未惜身。\n以钱换物寻常事，\n无价光阴枉费金。 ​​​", "date": "2022.06.24", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4783801576982583 - 七绝           感悟/01.jpg"]}, {"id": "4784164031433544", "title": "五律·盼分", "genre": "五律", "body": "昨夜众难眠，\n聚眸银幕前。\n家长愁不语，\n学子躁无言。\n屏闪悲和喜，\n神惊地与天。\n各思今后事，\n入梦踏关山。 ​​​", "date": "2022.06.25", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4784164031433544 - 五律    盼分/01.jpg"]}, {"id": "4784526879886620", "title": "七律·贼心", "genre": "七律", "body": "与己意合吹上天，\n花腔糊弄宇寰间。\n废除木炭说环保，\n褒奖风光少女言。\n今日自身难兑付，\n昔时她语碍当前。\n此番操作惊尘世，\n盗寇情思不一般。 ​​​", "date": "2022.06.26", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4784526879886620 - 七律           贼心/01.jpg", "冰雪诗词_全部图片/4784526879886620 - 七律           贼心/02.jpg", "冰雪诗词_全部图片/4784526879886620 - 七律           贼心/03.jpg", "冰雪诗词_全部图片/4784526879886620 - 七律           贼心/04.jpg"]}, {"id": "4784889843417116", "title": "鹧鸪天·仲夏晚趣", "genre": "鹧鸪天", "body": "将暮门南集市兴，\n招呼买卖耳边声。\n果蔬鲜嫩归家喜，\n鱼蟹繁多过道腥。\n宜老少，易轻松。\n唠嗑淘货望西东。\n窝居一日心头闷，\n散步舒怀沐晚风。 ​​​", "date": "2022.06.27", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4784889843417116 - 鹧鸪天 仲夏晚趣/01.jpg"]}, {"id": "4785251568324710", "title": "五绝·吟望", "genre": "五绝", "body": "一朝霜鬓矣，\n铜镜深情记。\n回首望浮生，\n烟涛风浪里。 ​​​", "date": "2022.06.28", "themes": ["羁旅思乡与行吟纪游", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4785251568324710 - 五绝    吟望/01.jpg"]}, {"id": "4785613247349378", "title": "鹧鸪天·其辱当戒", "genre": "鹧鸪天", "body": "幕后偷鸡，\n众前撒米。\n盗铃掩耳雕虫技。\n跳梁取辱把人丢，\n此般小丑终遭弃。\n大道羞行，\n偏门楞挤。\n夹头撞脸徒生气。\n改心回首路平宽，\n归宗认祖苍生计。 ​​​", "date": "2022.06.29", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4785613247349378 - 鹧鸪天 其辱当戒/01.jpg", "冰雪诗词_全部图片/4785613247349378 - 鹧鸪天 其辱当戒/02.jpg"]}, {"id": "4785976155309135", "title": "五绝·晓吟", "genre": "五绝", "body": "雨过夜清凉，\n星光笼病房。\n愁思人不寐，\n悲绪转衷肠。 ​​​", "date": "2022.06.30", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4785976155309135 - 五绝    晓吟/01.jpg"]}, {"id": "4786339843672711", "title": "阮郎归·庆七一", "genre": "阮郎归", "body": "百年华诞转来年，\n神州奋向前。\n蟾宫往返九霄眠，\n赤旗飞宇间。\n添鹰舰，射星船。\n海空疆域安。\n经商防疫顾禾田，\n苍生许梦圆。 ​​​", "date": "2022.07.01", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4786339843672711 - ​阮郎归    庆七一/01.jpg", "冰雪诗词_全部图片/4786339843672711 - ​阮郎归    庆七一/02.jpg"]}, {"id": "4786700821988660", "title": "临江仙·香江颂", "genre": "临江仙", "body": "今日波光清水漾，\n荆花娇艳芬芳。\n二十五载似朝阳。\n阵云遮不住，\n万里放霞光。\n过往狂风携恶雨，\n亦曾零落悲伤。\n红旗高挺且飞扬。\n钟馗扫魅影，\n百姓更安康。 ​​​", "date": "2022.07.02", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4786700821988660 - 临江仙    香江颂/01.jpg"]}, {"id": "4787063620112064", "title": "七绝·赠子玉会友", "genre": "七绝", "body": "夏晚吹来渤海风，\n狮乡音韵话深情。\n三年别却思无断，\n玉斝迎朋醉眼胧。 ​​​", "date": "2022.07.03", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4787063620112064 - 七绝 赠子玉会友/01.jpg"]}, {"id": "4787426504214342", "title": "七绝·吟望", "genre": "七绝", "body": "晓来骤雨叶飞声，\n寒浸病房愁梦惊。\n凭望窗前风色暗，\n何时阴影转光明。 ​​​", "date": "2022.07.04", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4787426504214342 - 七绝           吟望/01.jpg"]}, {"id": "4787796029998442", "title": "踏莎行·赠友", "genre": "踏莎行", "body": "翠柏浓荫，\n苍松茂密。\n晨昏苦练一贤弟。\n英姿飒爽意风发，\n凭空横贯刀枪戟。\n日寇曾来，\n硝烟滚去。\n虎林此乃英雄地。\n今朝不可忘当年，\n悠闲岁月强筋体。 ​​​", "date": "2022.07.05", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4787796029998442 - 踏莎行        赠友/01.jpg"]}, {"id": "4788155087850156", "title": "踏莎行·乳山晚景", "genre": "踏莎行", "body": "图画烟云，\n丹青草木。\n浑然山水如天幕。\n红颜翠色两相和，\n入眸养眼君休误。\n威海银滩，\n乳山溪路。\n人生向往绝佳处。\n世间乐土鸟争鸣，\n桃源怎比天仙府。 ​​​", "date": "2022.07.06", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4788155087850156 - 踏莎行 乳山晚景/01.jpg"]}, {"id": "4788713088882339", "title": "南乡子·七七寄怀", "genre": "南乡子", "body": "警报刺长空，\n今日神州绪不平。\n回首当年多少恨，\n填膺。\n倭寇卢沟始兽行。\n华夏聚豪英，\n破灭阴霾万里晴。\n不道东瀛兴鬼魅，\n神惊。\n地动山崩怒九龙。 ​​​", "date": "2022.07.07", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4788713088882339 - 南乡子 七七寄怀/01.jpg"]}, {"id": "4788879875377268", "title": "七律·狼出鬼没", "genre": "七律", "body": "又一金毛谢幕前，\n年来玩闹乐翻天。\n脱欧撕裂英伦岛，\n舔美窜游台海湾。\n内丑出新波浪涌，\n外忧依旧雨浇檐。\n猢狲辞树云烟灭，\n残日斜辉没远山。 ​​​", "date": "2022.07.08", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4788879875377268 - ​七律    狼出鬼没/01.jpg", "冰雪诗词_全部图片/4788879875377268 - ​七律    狼出鬼没/02.jpg"]}, {"id": "4789243472513849", "title": "朝中措·赠安倍", "genre": "朝中措", "body": "台前幕后两张皮，\n倭寇罪无思。\n拜鬼连番愈甚，\n亦能媚主眉低。\n垂涎钓岛，\n妄言台海，\n醉眼迷离。\n枪响世惊人去，\n是非地与天知。 ​​​", "date": "2022.07.09", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4789243472513849 - 朝中措    赠安倍/01.jpg", "冰雪诗词_全部图片/4789243472513849 - 朝中措    赠安倍/02.jpg", "冰雪诗词_全部图片/4789243472513849 - 朝中措    赠安倍/03.jpg"]}, {"id": "4789330529226529", "title": "七绝·闻事吟", "genre": "七绝", "body": "乡邻好坏己分明，\n喜乐悲伤自有情。\n祖辈当年遭苦难，\n仇家人死恨难平。 ​​​", "date": "2022.07.09", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4789330529226529 - 七绝        闻事吟/01.jpg"]}, {"id": "4789600373179684", "title": "七绝·闲吟", "genre": "七绝", "body": "人道三郎赴九泉，\n一心拜鬼鬼前欢。\n狂言台海他家事，\n倭寇阴魂乱世间。 ​​​", "date": "2022.07.10", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4789600373179684 - 七绝           闲吟/01.jpg"]}, {"id": "4789962723034490", "title": "七绝·午蝉", "genre": "七绝", "body": "临窗高柳隐鸣蝉，\n鼓噪长音午不闲。\n撩乱尖声冲入耳，\n凭风得意惹人烦。 ​​​", "date": "2022.07.11", "themes": ["山水田园与闲居雅趣", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4789962723034490 - 七绝           午蝉/01.jpg"]}, {"id": "4790337396015115", "title": "踏莎行·出门有感", "genre": "踏莎行", "body": "壮岁持家，\n暮时养老。\n古今此理皆知晓。\n奈何苍鬓染霜丝，\n乡间落拓街头倒。\n或许无亲，\n几多不孝。\n耆年诸事宜谋早。\n惟当体健乐心怀，\n粗餐贫舍疏烦恼。 ​​​", "date": "2022.07.12", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4790337396015115 - 踏莎行 出门有感/01.jpg"]}, {"id": "4790734006521865", "title": "鹧鸪天·东瀛一景", "genre": "鹧鸪天", "body": "庙宇门前人马稠，\n长枪短炮竞风流。\n争观寺院烟霞晚，\n静待灵车早露头。\n躯体灭，是非留。\n功名成败已无求。\n情分左右声涛半，\n入土难安余者愁。 ​​​", "date": "2022.07.13", "themes": ["感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4790734006521865 - 鹧鸪天 东瀛一景/01.jpg"]}, {"id": "4791053632406151", "title": "蝶恋花·夏日闲吟", "genre": "蝶恋花", "body": "倭寇儿孙遭暗算，\n窝里相残，\n魂魄烟云散。\n吾辈惊闻情毕现，\n缘于昨日仇和怨。\n不道有人心绪乱，\n忘祖欺宗，\n秽语污言漫。\n小丑凄声盈泪眼，\n独行渐与神州远。 ​​​", "date": "2022.07.14", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4791053632406151 - 蝶恋花 夏日闲吟/01.jpg"]}, {"id": "4791420882520478", "title": "七绝·感吟", "genre": "七绝", "body": "平日三餐细讲究，\n病床鼻饲味难求。\n世间馐馔千般态，\n身体不支徒自愁。 ​​​", "date": "2022.07.15", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4791420882520478 - 七绝           感吟/01.jpg"]}, {"id": "4791779134014038", "title": "采桑子·伏前雨", "genre": "采桑子", "body": "多情夏日风兼雨。\n暑气炎消，\n柳翠枝摇。\n不道蝉声何处逃。\n黄昏明霁心怀阔。\n霞色妖娆，\n燕舞云飘。\n庭院清凉爽鬓毛。 ​​​", "date": "2022.07.16", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4791779134014038 - 采桑子    伏前雨/01.jpg"]}, {"id": "4792141718753117", "title": "如梦令·祖孙视频", "genre": "如梦令", "body": "千里对屏嘻闹，\n爷奶这厢呼叫。\n娇靥语甜甜，\n手舞眉舒情妙。\n花俏，花俏。\n梦里无由频笑。 ​​​", "date": "2022.07.17", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4792141718753117 - 如梦令 祖孙视频/01.jpg"]}, {"id": "4792501485439661", "title": "七绝·咏茶", "genre": "七绝", "body": "居壶不作声，\n遇水恁欢腾。\n眉叶舒心展，\n霎时香气浓。 ​​​", "date": "2022.07.18", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4792501485439661 - 七绝    咏茶/01.jpg"]}, {"id": "4792861696727736", "title": "鹧鸪天·夏日寄妻", "genre": "鹧鸪天", "body": "姐妹三人守病房，\n慈萱不语痛断肠。\n无人能解心头苦，\n愁夜更超前日长。\n居老大，语双方。\n倾心沥血为亲娘。\n命悬一线千般唤，\n祈祷天公降瑞祥。 ​​​", "date": "2022.07.19", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4792861696727736 - 鹧鸪天 夏日寄妻/01.jpg"]}, {"id": "4793323040542401", "title": "七绝·题图", "genre": "七绝", "body": "有眼不睁晴亦阴，\n秃眉缺耳恨娘亲。\n鼻塌憋气胸怀恶，\n闭嘴无言狼子心。 ​​​", "date": "2022.07.20", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4793323040542401 - ​七绝           题图/01.jpg"]}, {"id": "4793586987566661", "title": "阮郎归·寄妻生日", "genre": "阮郎归", "body": "人逢花甲本应休，\n横来万缕愁。\n娘亲病里苦争求，\n身家不自由。\n餐无定，梦常忧。\n霜丝落满头。\n原先盘算付东流。\n奈何多事秋。 ​​​", "date": "2022.07.21", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4793586987566661 - 阮郎归 寄妻生日/01.jpg"]}, {"id": "4793948508001705", "title": "七绝·夏日荷塘", "genre": "七绝", "body": "菡萏飞红碧水间，\n婷婷玉立笑长天。\n随风浮起清凉意，\n袅袅云烟向远山。 ​​​", "date": "2022.07.22", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4793948508001705 - 七绝    夏日荷塘/01.jpg", "冰雪诗词_全部图片/4793948508001705 - 七绝    夏日荷塘/02.jpg"]}, {"id": "4794363907151647", "title": "浣溪沙·岳母出院", "genre": "浣溪沙", "body": "端午胃疼医护求，\n昏迷未醒卧床头。\n苍天有眼命无忧。\n今日回家须慢养，\n何时开口细交流。\n更期缓步下层楼。 ​​​", "date": "2022.07.23", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4794363907151647 - 浣溪沙 岳母出院/01.jpg"]}, {"id": "4794679398236623", "title": "七绝·愁夜吟", "genre": "七绝", "body": "星月萦窗探病亲，\n微光抚慰守床人。\n世间多少愁心事，\n缘自无穷养育恩。 ​​​", "date": "2022.07.24", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4794679398236623 - 七绝       愁夜吟/01.jpg"]}, {"id": "4795043027881653", "title": "七律·闻事有感", "genre": "七律", "body": "佛门净地藏污垢，\n虚假禅师错念经。\n崇拜钱财朝恶鬼，\n贱伤民众损真情。\n昔时英魄无安处，\n今日秃僧落骂名。\n呼唤悟空千里棒，\n高天劲舞宇寰清。 ​​​", "date": "2022.07.25", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4795043027881653 - 七律    闻事有感/01.jpg"]}, {"id": "4795761257089261", "title": "朝中措·答谢", "genre": "朝中措", "body": "顺缘玉盏映白衣，\n美誉满林西。\n挽救家亲生命\n真情绝技人思。\n回春妙手，\n温馨倍至，\n暖语如丝。\n感动阖家老少，\n举杯漫饮相知。 ​​​", "date": "2022.07.27", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4795761257089261 - 朝中措       答谢/01.jpg"]}, {"id": "4796123211892997", "title": "太常引·泪别", "genre": "太常引", "body": "挥别古冶向石门，\n风色暗沉沉。\n忍泪语家人。\n细照料，\n床头病亲。\n今番探看，\n廉州二老，\n了却念思心。\n惟愿几分身。\n多头顾，\n情长意真。 ​​​", "date": "2022.07.28", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4796123211892997 - 太常引       泪别/01.jpg"]}, {"id": "4796484840850957", "title": "清平乐·伏天异", "genre": "清平乐", "body": "云霄雨漏，\n夜半凉窗透。\n正是二伏还未够，\n却似秋风盈袖。\n晓来冷意丝丝，\n枝头珠露频滴。\n酷暑今朝不见，\n莫非玉帝营私？ ​​​", "date": "2022.07.29", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4796484840850957 - 清平乐    伏天异/01.jpg"]}, {"id": "4796850945393246", "title": "七绝·戏看", "genre": "七绝", "body": "引吭曲颈两只鸡，\n失调雌雄东与西。\n疑把海峡当己舍，\n纵身逝水浪花稀。 ​​​", "date": "2022.07.30", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4796850945393246 - 七绝           戏看/01.jpg"]}, {"id": "4797212540797108", "title": "五绝·无题", "genre": "五绝", "body": "池小纳云天，\n层楼卧水边。\n凡尘多少事，\n只在一心尖。 ​​​", "date": "2022.07.31", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4797212540797108 - 五绝    无题/01.jpg"]}, {"id": "4797212548662976", "title": "五绝·无题", "genre": "五绝", "body": "池小纳云天，\n层楼卧水边。\n凡尘多少事，\n只在一心尖。 ​​​", "date": "2022.07.31", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4797212548662976 - 五绝    无题/01.jpg"]}, {"id": "4797574365843717", "title": "采桑子·八一寄怀", "genre": "采桑子", "body": "军旗血染星徽艳。\n玖五春秋，\n钢铁洪流。\n反蒋驱倭气势牛。\n梦圆华夏歌声彻。\n将猛兵优，\n万马千舟。\n壮志盈怀宝岛收！ ​​​", "date": "2022.08.01", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4797574365843717 - ​采桑子 八一寄怀/01.jpg", "冰雪诗词_全部图片/4797574365843717 - ​采桑子 八一寄怀/02.jpg"]}, {"id": "4797935755463157", "title": "鹊桥仙·伏天午后", "genre": "鹊桥仙", "body": "枝垂叶卷，\n蛙鸣蝉噪。\n悲调催生热浪。\n炎光晴日少飞云，\n便是伫、浓荫不爽。\n午休难睡，\n萦身汗透。\n辗转心烦乱想。\n何如四季总为春，\n凭昼夜、气清风畅。 ​​​", "date": "2022.08.02", "themes": ["感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4797935755463157 - 鹊桥仙    伏天午后/01.jpg"]}, {"id": "4798298545720811", "title": "七绝·夏夜有感", "genre": "七绝", "body": "狂雨夜来风扰楼，\n寒声萧瑟似深秋。\n惟期晓日升腾起，\n万里明霞映九州。 ​​​", "date": "2022.08.03", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4798298545720811 - 七绝    夏夜有感/01.jpg"]}, {"id": "4798660346381716", "title": "行香子·情系日月潭", "genre": "行香子", "body": "耋耄巫婆，夜落松山。\n讯传来恨满心田。\n咬牙投笔，撕碎银笺。\n火胸中赤，盏中烈，梦中燃。\n台湾宝岛，宵思昼念。\n手足情何止千年。\n遭人虏掠，几次三番。\n盼浪儿归，鱼儿跃，鸟儿欢。 ​​​", "date": "2022.08.04", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4798660346381716 - 行香子    情系日月潭/01.jpg"]}, {"id": "4798852420865033", "title": "采桑子·七夕有寄", "genre": "采桑子", "body": "鹊仙桥上千年泪。\n岁岁盈眸，\n今又盈眸。\n多少情人两处愁。\n人间长有分离恨。\n门户无忧，\n南北漂流。\n老少来回几度秋。 ​​​", "date": "2022.08.04", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4798852420865033 - 采桑子 七夕有寄/01.jpg"]}, {"id": "4799021786860656", "title": "五律·吟望", "genre": "五律", "body": "位低难看远，\n霜鬓且闲心。\n儒道千年智，\n神州万事新。\n兵家围小岛，\n国策有高人。\n举首登山望，\n垂竿戏水滨。 ​​​", "date": "2022.08.05", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4799021786860656 - 五律    吟望/01.jpg"]}, {"id": "4799385902253452", "title": "鹧鸪天·喜相逢", "genre": "鹧鸪天", "body": "别却新疆四月多，\n京城相见靥婀娜。\n头扎小辫身灵动，\n指认图形眼泛波。\n情照旧，态非昨。\n腰枝柔美舞婆娑。\n士别三日惊相看，\n孙女归来燕雀歌。 ​​​", "date": "2022.08.06", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4799385902253452 - 鹧鸪天    喜相逢/01.jpg"]}, {"id": "4799747015050535", "title": "踏莎行·立秋吟", "genre": "踏莎行", "body": "雨过秋来，\n炎消暑避。\n微风阵阵清凉意。\n寻常晨练喜眉梢，\n更逢旧友舒心气。\n刀剑飞光，\n腰身垂壁。\n高低杠上平衡立。\n且将娱乐不强求，\n原装零件难相替。 ​​​", "date": "2022.08.07", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4799747015050535 - 踏莎行    立秋吟/01.jpg"]}, {"id": "4800109747634507", "title": "鹧鸪天·夏日吟望", "genre": "鹧鸪天", "body": "非是年关烟火浓，\n东南围岛炮声隆。\n无端盗寇滋斜事，\n恶意家奴趁乱风。\n营水阵，降天兵。\n势成圈套锁妖虫。\n独谋激起人神愤，\n贼子焉能叛祖宗。 ​​​", "date": "2022.08.08", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4800109747634507 - 鹧鸪天 夏日吟望/01.jpg"]}, {"id": "4800472960991848", "title": "七绝·夏日有寄", "genre": "七绝", "body": "归来金海碧云亲，\n庭院莺鸣景色新。\n别日娇娃多不语，\n而今个个吐芳音。 ​​​", "date": "2022.08.09", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4800472960991848 - 七绝    夏日有寄/01.jpg"]}, {"id": "4800835080426622", "title": "太常引·秋雨风寒", "genre": "太常引", "body": "秋来雨后晚风凉，\n薄暮隐斜阳，\n鸦雀宿归忙。\n溽暑去，微微夜长。\n盈眸暗绿，\n清幽庭院，\n霄色泛寒光。\n短袖略心慌，\n天之力，谁人可防！ ​​​", "date": "2022.08.10", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4800835080426622 - 太常引     秋雨风寒/01.jpg"]}, {"id": "4801196005265293", "title": "五绝·情", "genre": "五绝", "body": "侍狗如亲子，\n倾心忘老娘。\n漫街闻犬吠，\n苍鬓守空床。 ​​​", "date": "2022.08.11", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4801196005265293 - 五绝       情/01.jpg"]}, {"id": "4801564085325744", "title": "临江仙·闲吟", "genre": "临江仙", "body": "自作聪明人不语。\n花笺指点江山，\n梦中挥剑踏雄关。\n醒来浑不是，\n只在绣床边。\n万马飞奔腾赤兔。\n名留于世千年，\n缘功屡树胜军前。\n高飞凭展翅，\n远渡赖扬帆。 ​​​", "date": "2022.08.12", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4801564085325744 - 临江仙        闲吟/01.jpg"]}, {"id": "4801923637838024", "title": "鹧鸪天·秋老虎", "genre": "鹧鸪天", "body": "秋后天凉又闷沉，\n清晨薄雾色轻阴。\n无风庭院花凝重，\n卧鸟枝头断丽音。\n人微动，汗如淋。\n初秋老虎肆相侵。\n漫天飒爽黎民愿，\n呼唤天公顺我心。 ​​​", "date": "2022.08.13", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4801923637838024 - 鹧鸪天    秋老虎/01.jpg"]}, {"id": "4802283513316937", "title": "七绝·秋晓窃喜", "genre": "七绝", "body": "开门晨练雨潇潇，\n无奈回头且自嘲。\n知我奔忙平日苦，\n天翻云碎洒今朝。 ​​​", "date": "2022.08.14", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4802283513316937 - 七绝    秋晓窃喜/01.jpg"]}, {"id": "4802646122432190", "title": "清平乐·贺男排", "genre": "清平乐", "body": "十年隐忍，\n赢取今朝奋。\n雄冠亚洲消耻恨，\n恰似秋风解闷。\n华夏骄子高歌，\n红旗漫卷山河。\n江海同心携力，\n无穷巨浪清波。 ​​​", "date": "2022.08.15", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4802646122432190 - 清平乐    贺男排/01.jpg"]}, {"id": "4803008829851797", "title": "五律·夜问", "genre": "五律", "body": "秋风消暑气，\n桐叶欲飘离。\n月色清高远，\n蝉声苦闷稀。\n新冠还肆虐，\n百姓又愁思。\n何日瘟神灭，\n谁人告我知？ ​​​", "date": "2022.08.16", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4803008829851797 - 五律    夜问/01.jpg"]}, {"id": "4803373846761207", "title": "朝中措·六十抒怀", "genre": "朝中措", "body": "东奔西走赚浮名，\n到了事无成。\n犹似桃花柳絮，\n风来雨后漂萍。\n人生如梦，\n黄泉永伴，\n何必纷争。\n且把心源安放，\n山河江海为营。 ​​​", "date": "2022.08.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4803373846761207 - 朝中措 六十抒怀/01.jpg"]}, {"id": "4803733265055991", "title": "浣溪沙·童儿乐", "genre": "浣溪沙", "body": "竟日娇孙庭院间。\n花生豌豆近身前，\n扯衣牵手草坪欢。\n去岁相逢还不语，\n今朝每遇巧能言。\n娃聪爷笨甚前年。 ​​​", "date": "2022.08.18", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4803733265055991 - 浣溪沙    童儿乐/01.jpg"]}, {"id": "4804096357829693", "title": "采桑子·童趣", "genre": "采桑子", "body": "孙娃戏耍芳园里。\n碧水黄鸭，\n微景人家。\n锅碗瓢勺手上抓。\n橡皮泥土随心造。\n桂子桃花，\n白兔乌鸦。\n一晌时光笑属她。 ​​​", "date": "2022.08.19", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4804096357829693 - 采桑子        童趣/01.jpg", "冰雪诗词_全部图片/4804096357829693 - 采桑子        童趣/02.jpg", "冰雪诗词_全部图片/4804096357829693 - 采桑子        童趣/03.jpg"]}, {"id": "4804458678585882", "title": "朝中措·秋夜闲吟", "genre": "朝中措", "body": "轻凉闷热岂当秋，\n鸿雁亦生愁。\n不道南行与否，\n谁知何处巡游。\n风云乱卷，\n时空紊序，\n水欲西流。\n大地难堪重负，\n苍天拒应人求。 ​​​", "date": "2022.08.20", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4804458678585882 - 朝中措 秋夜闲吟/01.jpg"]}, {"id": "4804820000836570", "title": "鹧鸪天·有所思", "genre": "鹧鸪天", "body": "天不欺人人自欺，\n削山填海梦中痴。\n丛林古木年年少，\n淡水鲜鱼日日稀。\n丰雨季，断云丝。\n沙烘石烤惹愁思。\n曾经所作违天意，\n事到今朝悔晚知。 ​​​", "date": "2022.08.21", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4804820000836570 - 鹧鸪天    有所思/01.jpg"]}, {"id": "4805197790710234", "title": "一剪梅·童趣", "genre": "一剪梅", "body": "开口哥哥步向前。\n娇态轻盈，\n小手相牵。\n粉红花伞树丛间。\n两小无猜，\n草畔同欢。\n日日相逢过一年。\n快乐时光，\n共赏婵娟。\n幼儿无虑远忧烦。\n柳下花边，\n悄语心妍。 ​​​", "date": "2022.08.22", "themes": ["感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4805197790710234 - 一剪梅        童趣/01.jpg", "冰雪诗词_全部图片/4805197790710234 - 一剪梅        童趣/02.jpg"]}, {"id": "4805544969243191", "title": "五绝·望石门", "genre": "五绝", "body": "狂雨起狼烟，\n城中浪打船。\n纵横南北路，\n不见旧时颜。 ​​​", "date": "2022.08.23", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4805544969243191 - 五绝 望石门/01.jpg"]}, {"id": "4806270261398525", "title": "清平乐·秋风吟", "genre": "清平乐", "body": "层云漫卷，\n天际青无限。\n京邑秋风今又见，\n眺望南征鸿雁。\n回眸暗起愁情，\n新冠延误归程。\n二老家中应念，\n不知何日成行。 ​​​", "date": "2022.08.25", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4806270261398525 - ​清平乐    秋风吟/01.jpg"]}, {"id": "4806633055848412", "title": "七律·悼行者弟", "genre": "七律", "body": "丹青词赋醉于心，\n意气挥毫万里春。\n岂料严霜摧秀木，\n更惊恶雨毁兰君。\n芳香四溢声名远，\n清气独留桂魄存。\n驾鹤凭风追日月，\n化身光影耀乾坤。 ​​​", "date": "2022.08.26", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4806633055848412 - 七律    悼行者弟/01.jpg"]}, {"id": "4807024947499167", "title": "采桑子·初秋吟望", "genre": "采桑子", "body": "时逢周末心头静。\n闲望云天，\n雁奋莺欢。\n秋野晴柔景色妍。\n人成三五山前聚。\n水秀风绵，\n葡紫桃圆。\n笑靥舒怀忘却烦。 ​​​", "date": "2022.08.27", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4807024947499167 - 采桑子 初秋吟望/01.jpg"]}, {"id": "4807357009757627", "title": "踏莎行·致敬重庆", "genre": "踏莎行", "body": "山火无情，\n山城有爱。\n崎峰陡岭真情在。\n官兵头阵铸铜墙，\n平民无畏浓烟害。\n野路深林，\n人提车载。\n火龙虽猛终无奈。\n浩歌一曲荡长空，\n成渝儿女多豪迈。 ​​​", "date": "2022.08.28", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4807357009757627 - 踏莎行 致敬重庆/01.jpg", "冰雪诗词_全部图片/4807357009757627 - 踏莎行 致敬重庆/02.jpg", "冰雪诗词_全部图片/4807357009757627 - 踏莎行 致敬重庆/03.jpg", "冰雪诗词_全部图片/4807357009757627 - 踏莎行 致敬重庆/04.jpg"]}, {"id": "4807719628046346", "title": "清平乐·《采葛》读后", "genre": "清平乐", "body": "醒思梦盼，\n日唤千千遍。\n长昼无音愁寝饭，\n夜永如年神倦。\n三言两语情深，\n韵声直透人心。\n自古恋中儿女，\n望穿欲眼低吟。\n【附原作：诗经•玉风•采葛】\n朝代：先秦周代    作者：佚名\n彼采葛兮！一日不见，如三月兮!\n彼采萧兮！一日不见，如三秋兮!\n彼采艾兮！一日不见，如三岁兮!", "date": "2022.08.29", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4807719628046346 - 清平乐《采葛》读后/01.jpg"]}, {"id": "4808083350487416", "title": "七绝·秋晓有见", "genre": "七绝", "body": "半宵风雨转天凉，\n赶早行人露染裳。\n时见枝头飘落叶，\n周边青翠漫趋黄。 ​​​", "date": "2022.08.30", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4808083350487416 - 七绝    秋晓有见/01.jpg", "冰雪诗词_全部图片/4808083350487416 - 七绝    秋晓有见/02.jpg"]}, {"id": "4808444311245305", "title": "七绝·吟望十月", "genre": "七绝", "body": "欣闻党代会将开，\n万里航程锦绣来。\n又一百年刚起步，\n金风助力上高台。 ​​​", "date": "2022.08.31", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4808444311245305 - 七绝    吟望十月/01.jpg"]}, {"id": "4808806682855007", "title": "满江红·游万牲园", "genre": "满江红", "body": "早有心怀，携孙去，巡观鸟兽。\n今如愿，清风朗日，午前秋后。\n三代同行狮虎苑，万人围看猩猴秀。\n雀开屏，鹦鹉语欢迎，人争逗。\n熊猫馆，漫步走。犀牛处，凝眸久。\n鹿颈向云天，象鼻柔瘦。\n童稚龟前相对眼，妪翁斑马栏边凑。\n风色好，一晌尽情欢，频回首。", "date": "2022.09.01", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4808806682855007 - 满江红           游万牲园/01.jpg"]}, {"id": "4809168760343689", "title": "七绝·秋晓有见", "genre": "七绝", "body": "青天无际渺如银，\n庭院微风飒爽人。\n舞剑挥刀鸟鸣处，\n漫歌飞扇亦精神。 ​​​", "date": "2022.09.02", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4809168760343689 - 七绝    秋晓有见/01.jpg"]}, {"id": "4809531610104089", "title": "沁园春·九三寄怀", "genre": "沁园春", "body": "七秩重七，难忘当年，锣鼓滔天。\n正倭儿降溃，军民同乐；乾坤翻转，山海齐欢。\n多少英雄，抛头洒血，后继先驱誓向前。\n终赢取，我九州胜日，百姓神安。\n今朝天际云烟，似溪水，有汹涛暗澜。\n望延绵带路，贼人使绊，通连峡岸；寇子狂言。\n螳臂当车，蚍蜉撼树，花落花开谁可拦。\n神州丽，看鹏征万里，马跃长川。", "date": "2022.09.03", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4809531610104089 - 沁园春        九三寄怀/01.jpg", "冰雪诗词_全部图片/4809531610104089 - 沁园春        九三寄怀/02.jpg"]}, {"id": "4809894895029019", "title": "诉衷情·疫中情", "genre": "诉衷情", "body": "三年防疫渐无惊，\n赖有逆前行。\n心无畏，臂双擎。\n壮举映豪情。\n浅靥笑长风。\n望银屏，\n亲人备酒万千盅。\n待重逢。 ​​​", "date": "2022.09.04", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4809894895029019 - 诉衷情    疫中情/01.jpg", "冰雪诗词_全部图片/4809894895029019 - 诉衷情    疫中情/02.jpg"]}, {"id": "4810255927610604", "title": "七绝·京秋日暮", "genre": "七绝", "body": "风狂雨骤裹冰雹，\n黄叶银珠乱路桥。\n一霎行人不知措，\n受惊鸟雀久哀嚎。 ​​​", "date": "2022.09.05", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4810255927610604 - 七绝   京秋日暮/01.jpg"]}, {"id": "4810619239268789", "title": "七绝·遥寄", "genre": "七绝", "body": "疫情震害两重难，\n多事之秋笼四川。\n冷露寒霜终会去，\n峨眉山月更明圆。 ​​​", "date": "2022.09.06", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4810619239268789 - 七绝           遥寄/01.jpg", "冰雪诗词_全部图片/4810619239268789 - 七绝           遥寄/02.jpg"]}, {"id": "4810981496329035", "title": "水调歌头·月将圆孙远去", "genre": "水调歌头", "body": "白露中秋近，月向九霄圆。\n晓昏风色，已然多带几分寒。\n无奈娇孙挥手，随母行留西域，长夜可安眠？\n地角爷思念，孤望对青天。\n六千里，沙草冷，柳蝉残。\n天宽地阔，迪化自古少人烟。\n鸿雁愁飞不到，黄叶忧伤早谢，老少两心烦。\n便是银屏看，何似在身边。", "date": "2022.09.07", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4810981496329035 - 水调歌头    月将圆孙远去/01.jpg"]}, {"id": "4811343565422776", "title": "西江月·月夜吟", "genre": "西江月", "body": "白露回乡探母，\n中秋望月思妻。\n廉州古冶远东西，\n怎奈相逢梦里。\n四秩同经风雨，\n半生共赏花枝。\n老来父母病相欺，\n各绕椿萱情寄。 ​​​", "date": "2022.09.08", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4811343565422776 - 西江月    月夜吟/01.jpg"]}, {"id": "4811705698222083", "title": "蝶恋花·长相忆", "genre": "蝶恋花", "body": "又是一年重九日，\n难忘当时，\n闻讯悲流涕。\n地恸山崩江海泣，\n神州万里情难寄。\n且看今朝秋旖旎，\n俊岭长川，\n龙凤飞无际。\n古老东方腾紫气，\n韶山冲里人相忆。 ​​​", "date": "2022.09.09", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4811705698222083 - 蝶恋花    长相忆/01.jpg", "冰雪诗词_全部图片/4811705698222083 - 蝶恋花    长相忆/02.jpg", "冰雪诗词_全部图片/4811705698222083 - 蝶恋花    长相忆/03.jpg"]}, {"id": "4812070077859997", "title": "七绝·楼台觅月", "genre": "七绝", "body": "中秋前夜月无形，\n或为团圆蕴意情。\n期待来宵飞玉兔，\n银盘转动宇寰明。 ​​​", "date": "2022.09.10", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4812070077859997 - 七绝    楼台觅月/01.jpg"]}, {"id": "4812430272105794", "title": "采桑子·中秋寄怀", "genre": "采桑子", "body": "怎教眼底无离恨。\n遥望清蟾，\n辗转难眠。\n绪若波涛浪卷山。\n五人四地天涯远。\n夜永如年，\n把酒凭栏。\n无奈今宵梦里圆。 ​​​", "date": "2022.09.11", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4812430272105794 - ​采桑子 中秋寄怀/01.jpg"]}, {"id": "4812792933388899", "title": "七绝·闻思", "genre": "七绝", "body": "煞女上台王者崩，\n秋山日落冷西风。\n天寒水逝云飞散，\n零乱尘烟袅暮空。 ​​​", "date": "2022.09.12", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4812792933388899 - 七绝           闻思/01.jpg", "冰雪诗词_全部图片/4812792933388899 - 七绝           闻思/02.jpg", "冰雪诗词_全部图片/4812792933388899 - 七绝           闻思/03.jpg"]}, {"id": "4813155215871846", "title": "五绝·中秋赠友", "genre": "五绝", "body": "衣锦还乡去，\n扬眉瓦舍前。\n留香身影后，\n意气胜当年。 ​​​", "date": "2022.09.13", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4813155215871846 - 五绝 中秋赠友/01.jpg"]}, {"id": "4813517267668958", "title": "五绝·屏望", "genre": "五绝", "body": "灯下娇孙女，\n宵深不肯眠。\n坐床书在手，\n可是为来年？ ​​​", "date": "2022.09.14", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4813517267668958 - 五绝     屏望/01.jpg"]}, {"id": "4813880083612010", "title": "五绝·秋院", "genre": "五绝", "body": "借光藤架明，\n繁叶嫩瓜生。\n影动浮香处，\n时来酿蜜蜂。 ​​​", "date": "2022.09.15", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4813880083612010 - 五绝   秋院/01.jpg"]}, {"id": "4814242584463580", "title": "忆江南·秋望", "genre": "忆江南", "body": "黄河北，\n五彩胜江南。\n枫叶飘来红似火，\n岭香回荡味甘甜。\n云淡水空蓝。 ​​​", "date": "2022.09.16", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4814242584463580 - 忆江南       秋望/01.jpg", "冰雪诗词_全部图片/4814242584463580 - 忆江南       秋望/02.jpg"]}, {"id": "4814608869360984", "title": "朝中措·魂归故里", "genre": "朝中措", "body": "雄魂无奈异乡眠，\n今日把家还。\n棺柩红旗覆盖，\n水门洗却尘烟。\n秋高气爽，\n山河锦绣，\n鸟雀翩跹。\n告慰英灵毅魄，\n归来永世为安。 ​​​", "date": "2022.09.17", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4814608869360984 - 朝中措 魂归故里/01.jpg", "冰雪诗词_全部图片/4814608869360984 - 朝中措 魂归故里/02.jpg", "冰雪诗词_全部图片/4814608869360984 - 朝中措 魂归故里/03.jpg"]}, {"id": "4814967046671914", "title": "七律·回望9.18", "genre": "七律", "body": "贼谋祸起柳条湖，\n铁路自袭别有图。\n欲霸满州倭寇梦，\n觑觎黄鹤老蟾蜍。\n中华儿女多奇志，\n抗日云烟岭海浮。\n后继前英十四载，\n凯旋策马踏新途。 ​​​", "date": "2022.09.18", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4814967046671914 - 七律    回望9.18/01.jpg", "冰雪诗词_全部图片/4814967046671914 - 七律    回望9.18/02.jpg"]}, {"id": "4815329513964676", "title": "七绝·闲思", "genre": "七绝", "body": "多少登楼为赋愁，\n吟来乏味害人羞。\n眼前风物无穷尽，\n何必娇情不自由。 ​​​", "date": "2022.09.19", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4815329513964676 - ​七绝           闲思/01.jpg"]}, {"id": "4815691545315454", "title": "采桑子·秋韵", "genre": "采桑子", "body": "多天未雨秋阳烈。\n昨日堆云，\n漏作丝琴。\n润物催花自可人。\n连绵滴露声无断。\n隐没星辰，\n退却蝉音。\n拂晓寒窗冷我心。 ​​​", "date": "2022.09.20", "themes": ["山水田园与闲居雅趣", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4815691545315454 - 采桑子       秋韵/01.jpg"]}, {"id": "4816056306631114", "title": "七绝·王如秋叶", "genre": "七绝", "body": "人死生前万事休，\n穷奢身后己难求。\n愚儿借此胡操弄，\n别有用心留下仇。 ​​​", "date": "2022.09.21", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4816056306631114 - 七绝    王如秋叶/01.jpg"]}, {"id": "4816416966443696", "title": "小重山·咏秋", "genre": "小重山", "body": "落叶纷飞舞不休，\n依风南北走，\n自悠悠。\n奈何骚客乱生愁，\n笔底下，哀叹皱眉头。\n溪水向东流，\n花开花落去，本无忧。\n尘间万事莫强求，\n云空阔，且唱信天游。 ​​​", "date": "2022.09.22", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4816416966443696 - 小重山         咏秋/01.jpg"]}, {"id": "4816779212490674", "title": "七绝·秋分", "genre": "七绝", "body": "昼夜均分草色寒，\n交锋冷暖雨廉纤。\n桂花香处农家乐，\n遍地金黄稻谷妍。 ​​​", "date": "2022.09.23", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4816779212490674 - 七绝           秋分/01.jpg", "冰雪诗词_全部图片/4816779212490674 - 七绝           秋分/02.jpg"]}, {"id": "4817141596163214", "title": "霜天晓角·城河晩景", "genre": "霜天晓角", "body": "秋分日暮，\n水岸悠闲步。\n远处斜阳归去。\n声摇动，鸣蝉树。\n草路，风漫舞。\n柳荡云飞渡。\n黄叶残枝飘落。\n菊花竞，鸟争翥。 ​​​", "date": "2022.09.24", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4817141596163214 - 霜天晓角 城河晩景/01.jpg"]}, {"id": "4817503753342214", "title": "七绝·吟思", "genre": "七绝", "body": "三天捅过又三天，\n一个呈阳累万千。\n若问心头甚滋味，\n酸甜苦辣涩中咸。 ​​​", "date": "2022.09.25", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4817503753342214 - 七绝           吟思/01.jpg"]}, {"id": "4817866002273154", "title": "朝中措·遇事有思", "genre": "朝中措", "body": "又闻白发泪双流，\n儿壮却仙游。\n昨日床前曾语，\n今朝撒手难留。\n梦中别却，\n家亲未扰，\n最使人愁。\n日子更趋红火，\n何来长寿难求？ ​​​", "date": "2022.09.26", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4817866002273154 - 朝中措 遇事有思/01.jpg"]}, {"id": "4818229211694252", "title": "七绝·远思", "genre": "七绝", "body": "千里银屏玉照传，\n明眸浅靥自悠闲。\n浑然不晓亲人梦，\n秋到北疆风色寒。 ​​​", "date": "2022.09.27", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4818229211694252 - 七绝           远思/01.jpg"]}, {"id": "4818592077713650", "title": "清平乐·秋日寄怀", "genre": "清平乐", "body": "老街相聚，\n故友新朋叙。\n既往今朝情几许，\n把盏开怀无虑。\n昔时志满为公，\n赢来斑鬓苍容。\n笑对霜风玉觯，\n悠然乐趣难穷。 ​​​", "date": "2022.09.28", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4818592077713650 - 清平乐 秋日寄怀/01.jpg"]}, {"id": "4818953899086724", "title": "诉衷情·桥上吟", "genre": "诉衷情", "body": "红枫黄叶正金秋。\n漫步小桥头。\n楼光云影鱼戏，\n耆老正垂钩。\n逢盛世，少烦忧，\n更何求。\n远离闲事，常坐书前，\n香沁心头。 ​​​", "date": "2022.09.29", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4818953899086724 - 诉衷情      桥上吟/01.jpg", "冰雪诗词_全部图片/4818953899086724 - 诉衷情      桥上吟/02.jpg"]}, {"id": "4819315284774835", "title": "诉衷情·缅怀先烈", "genre": "诉衷情", "body": "当年华夏几多愁，\n内外寇无休。\n山河破碎天怒，\n赤子血倾流。\n旗奋举，漫神州，\n换春秋。\n赢来今日，四海蛟龙，\n寰宇翔游。 ​​​", "date": "2022.09.30", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4819315284774835 - 诉衷情   缅怀先烈/01.jpg", "冰雪诗词_全部图片/4819315284774835 - 诉衷情   缅怀先烈/02.jpg"]}, {"id": "4819679783421423", "title": "桂枝香·十一抒怀", "genre": "桂枝香", "body": "高天雁舞，列人字阵形，雨风难阻。\n振翅争鸣奋进，北方辞顾。\n翱翔俯瞰山河秀，胜前年，花枝萦树。\n陌阡禾盛，江湖鱼跃，景光飞度。\n望今朝，神州瑟鼓。正国庆人欢，世昌民富。\n圆梦中华，齐迈向慷庄路。\n百年耻辱行消尽，更扬眉挥手腾步。\n江山一统，必将不久，宇寰争睹。", "date": "2022.10.01", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4819679783421423 - 桂枝香          十一抒怀/01.jpg", "冰雪诗词_全部图片/4819679783421423 - 桂枝香          十一抒怀/02.jpg", "冰雪诗词_全部图片/4819679783421423 - 桂枝香          十一抒怀/03.jpg"]}, {"id": "4820040484915734", "title": "七绝·吟望", "genre": "七绝", "body": "十月开门雨不休，\n廉纤朝暮瓦檐流。\n尘空洗净盈新气，\n锦绣山河万里秋。 ​​​", "date": "2022.10.02", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4820040484915734 - 七绝           吟望/01.jpg"]}, {"id": "4820402985766745", "title": "七绝·偷袭", "genre": "七绝", "body": "四声巨响宇寰惊，\n碧海腾涛气射空。\n战火未消添猛药，\n疑云深处几时明？ ​​​", "date": "2022.10.03", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4820402985766745 - 七绝           偷袭/01.jpg", "冰雪诗词_全部图片/4820402985766745 - 七绝           偷袭/02.jpg"]}, {"id": "4820768329830045", "title": "七律·重阳有寄", "genre": "七律", "body": "连阴频雨少清辉，\n何处登高卧翠微。\n阵阵寒风鸣燕怯，\n垂垂败柳冷蝉悲。\n水流遍地伤街况，\n烟笼苍天障鸟飞，\n节假于今难尽兴，\n思乡愁客几人归。 ​​​", "date": "2022.10.04", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4820768329830045 - 七律    重阳有寄/01.jpg"]}, {"id": "4821127639859817", "title": "七绝·秋日吟", "genre": "七绝", "body": "凭栏眺望碧霄空，\n缕缕霜丝簇眼瞳。\n易老人生天不老，\n吹来还是去年风。 ​​​", "date": "2022.10.05", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4821127639859817 - 七绝        秋日吟/01.jpg"]}, {"id": "4821499741475181", "title": "撼庭秋·夜间行", "genre": "撼庭秋", "body": "欲深眠又惊起，独自驱车矣。\n月光相伴，廉州古冶，晓来千里。\n重阳已过，情怀无减，绪思迢递。\n念家妻遥远，宵行路阔，或能惊喜。 ​​​", "date": "2022.10.06", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4821499741475181 - 撼庭秋     夜间行/01.jpg", "冰雪诗词_全部图片/4821499741475181 - 撼庭秋     夜间行/02.jpg", "冰雪诗词_全部图片/4821499741475181 - 撼庭秋     夜间行/03.jpg"]}, {"id": "4821858388018734", "title": "五绝·情难禁", "genre": "五绝", "body": "连日困高楼，\n谁知孙女愁。\n疫情今晓去，\n出外喜盈眸。 ​​​", "date": "2022.10.07", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4821858388018734 - 五绝 情难禁/01.jpg", "冰雪诗词_全部图片/4821858388018734 - 五绝 情难禁/02.jpg"]}, {"id": "4822222680621162", "title": "七律·赠妻", "genre": "七律", "body": "深秋寒露人心暖，\n久病床前女更亲。\n姐妹轮番精照料，\n慈萱长卧未伤身。\n白天烧饭依鼻饲，\n半夜吸痰顺骨筋。\n莫道儿孙能养老，\n木兰行孝盛如今。 ​​​", "date": "2022.10.08", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4822222680621162 - 七律           赠妻/01.jpg", "冰雪诗词_全部图片/4822222680621162 - 七律           赠妻/02.jpg"]}, {"id": "4822580517144994", "title": "七绝·床前吟", "genre": "七绝", "body": "喂药饲汤浑不知，\n从前苦乐逝东西。\n今朝难晓忧和怨，\n留下悲伤若柳丝。 ​​​", "date": "2022.10.09", "themes": ["感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4822580517144994 - 七绝       床前吟/01.jpg"]}, {"id": "4822945107281195", "title": "七绝·闻事寄怀", "genre": "七绝", "body": "---贺国球夺冠\n小球飞舞宇寰间，\n笑傲江湖数秩年。\n昔日破冰惊旧世，\n老人帷幄谱新篇。 ​​​", "date": "2022.10.10", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4822945107281195 - 七绝    闻事寄怀/01.jpg", "冰雪诗词_全部图片/4822945107281195 - 七绝    闻事寄怀/02.jpg", "冰雪诗词_全部图片/4822945107281195 - 七绝    闻事寄怀/03.jpg"]}, {"id": "4823308648843354", "title": "醉花阴·秋望", "genre": "醉花阴", "body": "午后高阳风色暖，\n霄碧云舒卷。\n极目向长空，\n时闻流莺，\n偶有南飞雁。\n空余独坐闲庭院，\n黄叶来相伴。\n相对两飘零，\n欲诉无言，\n各有心头愿。 ​​​", "date": "2022.10.11", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4823308648843354 - 醉花阴       秋望/01.jpg"]}, {"id": "4823667739461347", "title": "七律·望山河", "genre": "七律", "body": "碧水蓝天寸土金，\n千年守固仗三军。\n英雄手里挥长剑，\n虎豹眸中怯意深。\n万古河山华夏壮，\n满腔热血九州春。\n风云乱渡何足虑，\n北斗情牵赤子心。 ​​​", "date": "2022.10.12", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4823667739461347 - ​七律        望山河/01.jpg", "冰雪诗词_全部图片/4823667739461347 - ​七律        望山河/02.jpg", "冰雪诗词_全部图片/4823667739461347 - ​七律        望山河/03.jpg"]}, {"id": "4824040948892729", "title": "七绝·秋夜吟", "genre": "七绝", "body": "床头久卧病吞金，\n多少钱财入海深。\n倘若换回亲笑脸，\n躬身万苦亦甘心。 ​​​", "date": "2022.10.13", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4824040948892729 - 七绝       秋夜吟/01.jpg"]}, {"id": "4824397904611271", "title": "七绝·深秋晓雨", "genre": "七绝", "body": "晓来丝雨细无音，\n黄叶垂珠不舍分。\n一旦离将两相去，\n此生难望再逢君。 ​​​", "date": "2022.10.14", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4824397904611271 - 七绝    深秋晓雨/01.jpg"]}, {"id": "4824754299603620", "title": "醉花阴·遥送同窗", "genre": "醉花阴", "body": "千里传来悲痛讯，\n霹雳惊天震。\n花甲一英才，\n撒手人寰，\n了却尘间恨。\n少同苦乐心头近，\n共事多齐奋。\n挥泪送君行，\n仙界云游，\n玉帝趋前问。 ​​​", "date": "2022.10.15", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4824754299603620 - 醉花阴 遥送同窗/01.jpg"]}, {"id": "4825114653492274", "title": "七绝·晓风吟", "genre": "七绝", "body": "深秋月夜冷风吹，\n黄叶离枝乱处飞。\n客至老年伤此甚，\n不知故里可能归。 ​​​", "date": "2022.10.16", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4825114653492274 - 七绝        晓风吟/01.jpg"]}, {"id": "4825477850071954", "title": "醉花阴·遥望寄思", "genre": "醉花阴", "body": "黄叶飘零秋色晚，\n望断高飞雁。\n日暮更西风，\n吹卷残云，\n影暗闲庭院。\n故园旧事空长叹，\n人去情难散。\n千里寄哀思，\n寒夜销魂，\n泪眼心头颤。 ​​​", "date": "2022.10.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4825477850071954 - ​醉花阴 遥望寄思/01.jpg"]}, {"id": "4825477951000002", "title": "醉花阴·遥望寄思", "genre": "醉花阴", "body": "黄叶飘零秋色晚，\n望断高飞雁。\n日暮更西风，\n吹卷残云，\n影暗闲庭院。\n故园旧事空长叹，\n人去情难散。\n千里寄哀思，\n寒夜销魂，\n泪眼心头颤。 ​​​", "date": "2022.10.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4825477951000002 - ​醉花阴 遥望寄思/01.jpg"]}, {"id": "4825839235236668", "title": "唐多令·十月寄怀", "genre": "唐多令", "body": "我党百年兴，\n九州盛世情。\n几代人，砥砺前行。\n星火燎原摧旧势，\n天地换，日安宁。\n今又聚群英，\n筹谋再远征。\n定五年，方略航程。\n北斗高悬明日月，\n山更秀，水更清。 ​​​", "date": "2022.10.18", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4825839235236668 - 唐多令    十月寄怀/01.jpg"]}, {"id": "4826214004687673", "title": "七绝·吟望", "genre": "七绝", "body": "金秋十月望神京，\n九夏英豪意气浓。\n为党兴帮争献策，\n尽心职守立新功。 ​​​", "date": "2022.10.19", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4826214004687673 - 七绝           吟望/01.jpg"]}, {"id": "4826565094148242", "title": "七绝·闲吟", "genre": "七绝", "body": "霄汉霞晖陌上尘，\n云泥思悟两厢人。\n并行出走不同念，\n难定东西最费神。 ​​​", "date": "2022.10.20", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4826565094148242 - 七绝           闲吟/01.jpg"]}, {"id": "4826940529183558", "title": "七绝·日渐落", "genre": "七绝", "body": "一.\n大厦将倾梁木朽，\n无由频断烂椽头。\n不才之女偷机上，\n走马下台骄气休。\n二.\n狂言犹热气先衰，\n意料之中败擂台。\n撼树蚍蜉徒费力，\n春来大地百花开。 ​​​", "date": "2022.10.21", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4826940529183558 - 七绝       日渐落/01.jpg"]}, {"id": "4827290188383000", "title": "七绝·吟望", "genre": "七绝", "body": "红叶蹁跹楼宇间，\n含情脉脉向窗轩。\n金风袅袅人心荡，\n无耐禁足难共欢。 ​​​", "date": "2022.10.22", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4827290188383000 - 七绝           吟望/01.jpg"]}, {"id": "4827652144234683", "title": "七绝·翘首以待", "genre": "七绝", "body": "十秩红船再起帆，\n今朝舵手展新颜。\n五洲瞩目争相望，\n浪涌涛行四海间。 ​​​", "date": "2022.10.23", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4827652144234683 - 七绝    翘首以待/01.jpg"]}, {"id": "4828015655914313", "title": "七绝·时令吟", "genre": "七绝", "body": "深秋晓露渐为霜，\n枫叶新添白玉裳。\n红晕凌花莺鹊羡，\n飞来飞去啭声扬。 ​​​", "date": "2022.10.24", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4828015655914313 - 七绝        时令吟/01.jpg"]}, {"id": "4828379826356282", "title": "踏莎行·品果有寄", "genre": "踏莎行", "body": "大小分明，\n甘甜迥异。\n外观取物君当忌。\n并非好看最相宜，\n歪瓜裂枣精皮里。\n目秀眉清，\n巧言能事。\n与人未必真情义。\n平生处世要当心，\n慎行思辩长牢记。 ​​​", "date": "2022.10.25", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4828379826356282 - 踏莎行 品果有寄/01.jpg"]}, {"id": "4828845117016150", "title": "踏莎行·秋晓行寄", "genre": "踏莎行", "body": "古冶凌晨，\n廉州晌午。\n朝霞迎送云飞度。\n秋风千里伴车行，\n红枫黄叶无闲顾。\n来去匆忙，\n情怀难诉。\n两头亲老皆需助。\n今朝所幸已归休，\n身心尽在床前驻。 ​​​", "date": "2022.10.26", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4828845117016150 - 踏莎行 秋晓行寄/01.jpg"]}, {"id": "4829100600460303", "title": "清平乐·阶前吟", "genre": "清平乐", "body": "鬓华如雪，\n闲看飞黄叶。\n草木深秋悠自谢，\n人到晚年情切。\n世上花落花开，\n谁能白发重来。\n把握今朝偷乐，\n邀朋携酒登台。 ​​​", "date": "2022.10.27", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4829100600460303 - 清平乐    阶前吟/01.jpg"]}, {"id": "4829463822733723", "title": "七绝·暮秋晓吟", "genre": "七绝", "body": "天公抖落满庭金，\n小院青檐鸟雀吟。\n秋色宜人风露爽，\n诗情画韵胜如春。 ​​​", "date": "2022.10.28", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4829463822733723 - 七绝    暮秋晓吟/01.jpg"]}, {"id": "4829827205172599", "title": "踏莎行·引领", "genre": "踏莎行", "body": "圣地延安，\n山坡窑洞。\n神州史册辉相映。\n十三春夏聚英才，\n杨家岭上星辰众。\n舵手明航，\n红船涌动。\n今朝湖海千帆弄。\n高歌一曲棹齐飞，\n逐涛成就中华梦。 ​​​", "date": "2022.10.29", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4829827205172599 - ​踏莎行        引领/01.jpg"]}, {"id": "4829931991466369", "title": "踏莎行·引领", "genre": "踏莎行", "body": "圣地延安，\n山坡窑洞。\n神州史册辉相映。\n十三春夏聚英才，\n杨家岭上星辰众。\n舵手明航，\n红船涌动。\n今朝湖海千帆弄。\n高歌一曲棹齐飞，\n逐涛成就中华梦。 ​​​", "date": "2022.10.29", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4829931991466369 - 踏莎行        引领/01.jpg"]}, {"id": "4830187638230668", "title": "七绝·闻事伤怀", "genre": "七绝", "body": "人生已到秋冬季，\n时有周边落叶飘。\n草木尚能春又绿，\n鬓毛霜色夏难消。 ​​​", "date": "2022.10.30", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4830187638230668 - 七绝    闻事伤怀/01.jpg"]}, {"id": "4830550370288578", "title": "七绝·望梨泰院", "genre": "七绝", "body": "万圣夜来魂魄飞，\n人叠上下几能归。\n可怜百姓愁肠断，\n寒露秋风落叶悲。 ​​​", "date": "2022.10.31", "themes": ["四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4830550370288578 - 七绝    望梨泰院/01.jpg", "冰雪诗词_全部图片/4830550370288578 - 七绝    望梨泰院/02.jpg"]}, {"id": "4830912447251256", "title": "朝中措·逐梦巡天", "genre": "朝中措", "body": "问天之后梦天来，\n玉宇筑高台。\n华夏千年畅想，\n九霄放眼开怀。\n凌云长箭，\n腾空一跃，\n抖落尘埃。\n笑傲苍穹万里，\n巡航日夜悠哉。 ​​​", "date": "2022.11.01", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4830912447251256 - 朝中措 逐梦巡天/01.jpg", "冰雪诗词_全部图片/4830912447251256 - 朝中措 逐梦巡天/02.jpg", "冰雪诗词_全部图片/4830912447251256 - 朝中措 逐梦巡天/03.jpg", "冰雪诗词_全部图片/4830912447251256 - 朝中措 逐梦巡天/04.jpg"]}, {"id": "4831275330045866", "title": "如梦令·吟望", "genre": "如梦令", "body": "秋暮疫情重现，\n可恨毒虫多变。\n布控总难防，\n更趁西风捣乱。\n征战，征战。\n豪气白衣堪赞。 ​​​", "date": "2022.11.02", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4831275330045866 - 如梦令    吟望/01.jpg"]}, {"id": "4831636946163752", "title": "七绝·农家晓吟", "genre": "七绝", "body": "阶前闲地菜青葱，\n几朵小花迎雨风。\n点缀门庭人气旺，\n暮秋农户趣无穷。 ​​​", "date": "2022.11.03", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4831636946163752 - 七绝   农家晓吟/01.jpg"]}, {"id": "4832003801745206", "title": "长相思·遥相望", "genre": "长相思", "body": "念童颜，望童颜。\n娇态纤姿笑靥妍。\n传神手眼间。\n忆天山，梦天山。\n万里乖孙山脚边。\n夜思飞笔端。 ​​​", "date": "2022.11.04", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4832003801745206 - 长相思    遥相望/01.jpg", "冰雪诗词_全部图片/4832003801745206 - 长相思    遥相望/02.jpg", "冰雪诗词_全部图片/4832003801745206 - 长相思    遥相望/03.jpg"]}, {"id": "4832362129785357", "title": "七绝·题天宫摄影", "genre": "七绝", "body": "太空俯瞰黄河远，\n横贯东西到海边。\n昔日豪情凭意性，\n今朝山水映屏前。 ​​​", "date": "2022.11.05", "themes": ["山水田园与闲居雅趣", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4832362129785357 - 七绝 题天宫摄影/01.jpg"]}, {"id": "4832724856078750", "title": "太常引·暮秋吟", "genre": "太常引", "body": "深秋日暮笼尘烟，\n乱叶舞长天。\n辉冷更风寒。\n疫情甚，城乡不安。\n核酸连测，封门闭户，\n多少夜难眠。\n云影掩残蟾。\n待何日，霄明月圆。 ​​​", "date": "2022.11.06", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4832724856078750 - 太常引       暮秋吟/01.jpg"]}, {"id": "4833086544810833", "title": "五律·京跑迎冬", "genre": "五律", "body": "秋尽初冬俏，迎宾枝叶闹。\n骄儿健步飞，靓女扬眉笑。\n南北客飘然，东西情满道。\n乘风意绪开，长跑身心少。 ​​​", "date": "2022.11.07", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4833086544810833 - 五律        京跑迎冬/01.jpg", "冰雪诗词_全部图片/4833086544810833 - 五律        京跑迎冬/02.jpg", "冰雪诗词_全部图片/4833086544810833 - 五律        京跑迎冬/03.jpg"]}, {"id": "4833449195868238", "title": "七律·遥望珠海", "genre": "七律", "body": "航展新潮看客惊，\n神州重器溢豪情。\n昔时众叹他人剑，\n今日群夸自个弓。\n昂首银鹰翔宇宙，\n凝眸铁甲映苍穹。\n任由天际风云变，\n入海腾空有巨龙。 ​​​", "date": "2022.11.08", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4833449195868238 - 七律    遥望珠海/01.jpg", "冰雪诗词_全部图片/4833449195868238 - 七律    遥望珠海/02.jpg", "冰雪诗词_全部图片/4833449195868238 - 七律    遥望珠海/03.jpg", "冰雪诗词_全部图片/4833449195868238 - 七律    遥望珠海/04.jpg", "冰雪诗词_全部图片/4833449195868238 - 七律    遥望珠海/05.jpg", "冰雪诗词_全部图片/4833449195868238 - 七律    遥望珠海/06.jpg", "冰雪诗词_全部图片/4833449195868238 - 七律    遥望珠海/07.jpg", "冰雪诗词_全部图片/4833449195868238 - 七律    遥望珠海/08.jpg", "冰雪诗词_全部图片/4833449195868238 - 七律    遥望珠海/09.jpg"]}, {"id": "4833811185798326", "title": "七绝·十月十五夜吟", "genre": "七绝", "body": "故宫古月喜相逢，\n天狗金蟾戏碧空。\n本是明圆霄汉夜，\n嫦娥掩脸晕微红。 ​​​", "date": "2022.11.09", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4833811185798326 - 七绝   十月十五夜吟/01.jpg", "冰雪诗词_全部图片/4833811185798326 - 七绝   十月十五夜吟/02.jpg", "冰雪诗词_全部图片/4833811185798326 - 七绝   十月十五夜吟/03.jpg", "冰雪诗词_全部图片/4833811185798326 - 七绝   十月十五夜吟/04.jpg"]}, {"id": "4834174999730391", "title": "减字木兰花·遥望闲吟", "genre": "减字木兰花", "body": "封城闭户，多少辛酸人欲诉。\n汝在高台，生日为儿乱了怀。\n自成反面，检点言行心莫怨。\n警示官人，天冷凝神暖予民。 ​​​", "date": "2022.11.10", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4834174999730391 - 减字木兰花     遥望闲吟/01.jpg", "冰雪诗词_全部图片/4834174999730391 - 减字木兰花     遥望闲吟/02.jpg", "冰雪诗词_全部图片/4834174999730391 - 减字木兰花     遥望闲吟/03.jpg"]}, {"id": "4834543482438061", "title": "七绝·颙望", "genre": "七绝", "body": "…贺空军73诞辰\n银鹰七秩三周岁，\n羸弱到强翔九天。\n今日鹏程千万里，\n世人昂首望无边。 ​​​", "date": "2022.11.11", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4834543482438061 - 七绝           颙望/01.jpg", "冰雪诗词_全部图片/4834543482438061 - 七绝           颙望/02.jpg", "冰雪诗词_全部图片/4834543482438061 - 七绝           颙望/03.jpg", "冰雪诗词_全部图片/4834543482438061 - 七绝           颙望/04.jpg"]}, {"id": "4834898973560289", "title": "沁园春·疫中吟望", "genre": "沁园春", "body": "叶落梧桐，风起长天，院落趋寒。\n更初冬半夜，濛濛细雨，清晨一早，袅袅云烟。\n树上乌鸦，阶前黄狗，潮冷凄凄亦少欢。\n街头喊，请大家出户，再做核酸。\n疫情肆虐三年。几起落、近来更野蛮。\n恨如狼似虎，踪痕难控，犹云若雨，形影无边。\n店铺关张，家亲难聚，多少心头愁苦连。\n仰天啸，唤白衣圣手，予世平安。", "date": "2022.11.12", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4834898973560289 - 沁园春           疫中吟望/01.jpg"]}, {"id": "4835260473279168", "title": "七绝·冬日晓吟", "genre": "七绝", "body": "气寒天冷疫情狂，\n近日随风扰故乡。\n时有异常邻里住，\n心头掠过一丝凉。 ​​​", "date": "2022.11.13", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4835260473279168 - 七绝    冬日晓吟/01.jpg"]}, {"id": "4835625499100321", "title": "七绝·敬白衣", "genre": "七绝", "body": "敲门惊晓梦，\n入户为核酸。\n来者无私欲，\n通宵更可怜。 ​​​", "date": "2022.11.14", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4835625499100321 - 七绝 敬白衣/01.jpg"]}, {"id": "4835985571975889", "title": "菩萨蛮·吟石门", "genre": "菩萨蛮", "body": "入冬寒透飞霜雪，\n冠虫乘势难将灭。\n山海漫悲情，\n黎民心不宁。\n借名精准控，\n普测归如梦。\n只怕事相违，\n掉头岂可回。 ​​​", "date": "2022.11.15", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4835985571975889 - 菩萨蛮    吟石门/01.jpg"]}, {"id": "4836349515662235", "title": "鹧鸪天·寄80亿人", "genre": "鹧鸪天", "body": "寰宇茫茫球似村，\n苍生各色古来今。\n曾经无数魔和难，\n面对千般星与辰。\n天依旧，地呻吟。\n不堪重负费人心。\n探寻土火空中去，\n或许将来万世春。 ​​​", "date": "2022.11.16", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4836349515662235 - ​鹧鸪天 寄80亿人/01.jpg"]}, {"id": "4836710665685448", "title": "采桑子·望巴厘岛", "genre": "采桑子", "body": "寰球大佬齐相聚，\n不是过年，\n不为休闲。\n只道眉毛火欲燃。\n海滨美景心头乱，\n气候忧烦，\n笼罩新冠。\n说起俄乌难上难。 ​​​", "date": "2022.11.17", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4836710665685448 - ​采桑子 望巴厘岛/01.jpg"]}, {"id": "4837072642249815", "title": "五绝·困", "genre": "五绝", "body": "闭户街邻静，\n封村鸟雀愁。\n熟人皆不见，\n是去或当留。 ​​​", "date": "2022.11.18", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4837072642249815 - 五绝       困/01.jpg"]}, {"id": "4837438231416362", "title": "减字木兰花·晨望", "genre": "减字木兰花", "body": "漫天晓雾，鸟雀醒来迷所处。\n南北东西，不见星光车马稀。\n疫中遥望，门户冷清思绪荡。\n期待天晴，万里云霄风色明。 ​​​", "date": "2022.11.19", "themes": ["羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4837438231416362 - 减字木兰花    晨望/01.jpg"]}, {"id": "4837797339070984", "title": "七绝·悲", "genre": "七绝", "body": "团圆本是一家亲，\n羁旅他乡恋旧根。\n相伴为轻孤岛苦，\n如今独自断愁魂。 ​​​", "date": "2022.11.20", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4837797339070984 - 七绝         悲/01.jpg", "冰雪诗词_全部图片/4837797339070984 - 七绝         悲/02.jpg", "冰雪诗词_全部图片/4837797339070984 - 七绝         悲/03.jpg"]}, {"id": "4838159668220439", "title": "七绝·望石门", "genre": "七绝", "body": "匆忙上路又回头，\n筹划欠周难自由。\n度势方能千里远，\n审时而动水长流。 ​​​", "date": "2022.11.21", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4838159668220439 - 七绝       望石门/01.jpg"]}, {"id": "4838522692830281", "title": "蝶恋花·时令吟", "genre": "蝶恋花", "body": "小雪节来冰未冻，\n万户千家，\n闻疫心怀重。\n真假传言屏幕弄，\n犹如落叶随风动。\n封放两难谁与共。\n独自无言，\n遥望亲人痛。\n老少易伤催恶梦，\n偏偏几处爷孙控。 ​​​", "date": "2022.11.22", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4838522692830281 - 蝶恋花    时令吟/01.jpg"]}, {"id": "4838885265247810", "title": "朝中措·冬日痛望", "genre": "朝中措", "body": "中原大火烈而凶。\n财物命皆空。\n平日粗心侥幸，\n终身遗恨无穷。\n千家遭难，\n万民悲痛。\n云暗苍穹。\n莫忘平安至上，\n做行最忌盲从。 ​​​", "date": "2022.11.23", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4838885265247810 - 朝中措 冬日痛望/01.jpg", "冰雪诗词_全部图片/4838885265247810 - 朝中措 冬日痛望/02.jpg"]}, {"id": "4839249100673319", "title": "七绝·致敬白衣", "genre": "七绝", "body": "雾笼晓空摧败叶，\n鸦啼枝杪恋寒家。\n可怜医护贪黑起，\n入户核酸又是她。 ​​​", "date": "2022.11.24", "themes": ["家国情怀与时代歌咏"], "images": ["冰雪诗词_全部图片/4839249100673319 - 七绝    致敬白衣/01.jpg"]}, {"id": "4839620984702868", "title": "长相思·抗原入户", "genre": "长相思", "body": "左一惊，右一惊。\n鼻孔酸酸泪欲零。\n忧心两道红。\n检瘟虫，灭瘟虫。\n妙计高招筹划中。\n只为争取赢。 ​​​", "date": "2022.11.25", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4839620984702868 - ​长相思 抗原入户/01.jpg"]}, {"id": "4839972042966316", "title": "七律·冬夜吟", "genre": "七律", "body": "五人四地困楼中，\n千里相思去不成。\n古冶廉州隔老俩，\n京城迪化裂家庭。\n夫妻难见心头恨，\n父女常温梦里情。\n幸有银屏可遥望，\n欣闻童稚唤爷声。 ​​​", "date": "2022.11.26", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4839972042966316 - 七律       冬夜吟/01.jpg"]}, {"id": "4840334854458471", "title": "五绝·无奈", "genre": "五绝", "body": "几案青青韭，\n迎人阵阵香。\n禁足家少菜，\n悲却入餐汤。 ​​​", "date": "2022.11.27", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4840334854458471 - 五绝    无奈/01.jpg"]}, {"id": "4840698413057516", "title": "五绝·偶赏", "genre": "五绝", "body": "芳翠去无踪，\n海棠遗果红。\n行人抬眼望，\n脚步自然轻。 ​​​", "date": "2022.11.28", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4840698413057516 - 五绝    偶赏/01.jpg"]}, {"id": "4841059776992610", "title": "沁园春·归休有寄", "genre": "沁园春", "body": "花甲凡人，从此身轻，往后心闲。\n恰肩头卸载，腰舒背挺，胸中减负，怀阔膺宽。\n虑渐行消，情投所好，浮利虚名抛九天。\n绪思转，乐尊前院后，水畔山边。\n今生多少余年。应自在、行藏花草间。\n顾儿孙俗愿，鬓华妻子，乡邻琐事，颜老椿萱。\n清晓凭栏，黄昏望月，信手拈来诗百篇。\n咏歌赋，仿前朝李杜，篱下陶潜。", "date": "2022.11.29", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4841059776992610 - 沁园春       归休有寄/01.jpg"]}, {"id": "4841422030902055", "title": "十六字令·三首", "genre": "十六字令", "body": "风，\n彻夜猖狂冷月横。\n天将裂，\n山海缀银冰。\n风，\n吹走尘霾晓色晴。\n伸双手，\n依旧刺心疼。\n风，\n残叶横飞枝杪空。\n孤鸦苦，\n谁与共寒冬。 ​​​", "date": "2022.11.30", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4841422030902055 - 十六字令    三首/01.jpg"]}, {"id": "4841783659598138", "title": "踏莎行·星空相会", "genre": "踏莎行", "body": "地面同堂，\n天宫合室。\n神舟先后蹁跹至。\n呼星唤月傲长空，\n扬眉挥手多豪气。\n饮恨当年，\n舒怀今日。\n辛酸多少情难寄。\n素娥青鸟欲争来，\n趣谈今古千般事。 ​​​", "date": "2022.12.01", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4841783659598138 - 踏莎行 星空相会/01.jpg", "冰雪诗词_全部图片/4841783659598138 - 踏莎行 星空相会/02.jpg"]}, {"id": "4842148564578959", "title": "七绝·望梅", "genre": "七绝", "body": "雪花亲吻冷梅枝，\n玉蕊惺忪回味迟。\n晴霁飞霞辉弄影，\n馨香疏淡惹人期。 ​​​", "date": "2022.12.02", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4842148564578959 - 七绝           望梅/01.jpg"]}, {"id": "4842511451291999", "title": "梅花引·和维真", "genre": "梅花引", "body": "传玉碗，赐金盏。\n后手无留意非浅。\n寒衣娃，仗义侠。\n尚武拜师，来此皆一家。\n风霜论剑闻鸡舞，\n雨雪摩拳擂鼙鼓。\n敬前贤，越前贤。\n绝技超人，盖世笑河山。\n维真原玉：\n玲珑碗，金醇盏，\n道骨仙魂龙泉浅。\n昆仑娃，武当侠，\n四海归宗，天下成一家。\n冬来踏雪笑云舞，\n夏至临风吼天鼓。\n继先贤，破先贤，\n夺世神功，挥剑指华山。", "date": "2022.12.03", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4842511451291999 - 梅花引    和维真/01.jpg"]}, {"id": "4842871314449183", "title": "五绝·冬晓", "genre": "五绝", "body": "夜暗近黎明，\n招牌闪彩虹。\n行人呼所好，\n小店暖相迎。 ​​​", "date": "2022.12.04", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4842871314449183 - 五绝    冬晓/01.jpg"]}, {"id": "4843234050180361", "title": "踏莎行·贺神舟返回", "genre": "踏莎行", "body": "大漠风寒，\n神兵天降。\n无边月夜星辉旷。\n雄鹰载誉远归来，\n自豪难表欢情漾。\n半载飞天，\n三英合唱。\n九州妙韵催波浪。\n佳音阵阵漫苍穹，\n连绵入耳心怀壮。 ​​​", "date": "2022.12.05", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4843234050180361 - 踏莎行 贺神舟返回/01.jpg", "冰雪诗词_全部图片/4843234050180361 - 踏莎行 贺神舟返回/02.jpg", "冰雪诗词_全部图片/4843234050180361 - 踏莎行 贺神舟返回/03.jpg", "冰雪诗词_全部图片/4843234050180361 - 踏莎行 贺神舟返回/04.jpg"]}, {"id": "4843597075317684", "title": "五绝·冬日闲吟", "genre": "五绝", "body": "人生多所期，\n无奈费光时。\n白日难如愿，\n犹来梦里痴。 ​​​", "date": "2022.12.06", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4843597075317684 - 五绝 冬日闲吟/01.jpg"]}, {"id": "4843962222774668", "title": "浣溪沙·节序吟", "genre": "浣溪沙", "body": "大雪时辰晓日明，\n寂寥村口尽开封。\n四周依旧少人行。\n对面阴阳难断定，\n相逢苦笑怎为情。\n冠虫诡秘悄无踪。 ​​​", "date": "2022.12.07", "themes": ["四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4843962222774668 - 浣溪沙    节序吟/01.jpg"]}, {"id": "4844320735634444", "title": "五绝·梦", "genre": "五绝", "body": "远家常有梦，\n多是在归途。\n历尽千难险，\n抬头望却无。 ​​​", "date": "2022.12.08", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4844320735634444 - 五绝       梦/01.jpg"]}, {"id": "4844691441322848", "title": "七绝·痛", "genre": "七绝", "body": "天寒夜半体发烧，\n或许无端中了招。\n还好细屏一道杠，\n惟期明日似今朝。 ​​​", "date": "2022.12.09", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4844691441322848 - 七统         痛/01.jpg"]}, {"id": "4845045498251441", "title": "七绝·无奈", "genre": "七绝", "body": "屏面依稀两道红，\n心期躲过已成空。\n隔离自己宅楼上，\n莫害家邻父老翁。 ​​​", "date": "2022.12.10", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4845045498251441 - 七绝     无奈/01.jpg"]}, {"id": "4845410880852154", "title": "长相思·坚持", "genre": "长相思", "body": "上一横，下一横。\n红线成双病已行。\n楼头苦自撑。\n忍头疼，恨头疼。\n缕缕丝丝来不停。\n几能消此情？ ​​​", "date": "2022.12.11", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4845410880852154 - 长相思        坚持/01.jpg"]}, {"id": "4845771579724860", "title": "踏莎行·酬亲友", "genre": "踏莎行", "body": "多少关怀，\n万千惦念。\n屏前身后温情漫。\n家亲周到送餐汤，\n友朋馨语频连线。\n四面春风，\n一方心坎。\n教谁能不千般暖。\n惟期疫过喜相逢，\n为君斟把醇香盏。 ​​​", "date": "2022.12.12", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4845771579724860 - 踏莎行    酬亲友/01.jpg"]}, {"id": "4846135259432172", "title": "七绝·苦", "genre": "七绝", "body": "密控周防难躲过，\n一人得中阖家祸。\n可怜老少语无详，\n苦态愁容心忐忑。 ​​​", "date": "2022.12.13", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4846135259432172 - 七绝              苦/01.jpg"]}, {"id": "4846502579540711", "title": "七绝·望", "genre": "七绝", "body": "无灾无病小神仙，\n何惧夏温冬日寒。\n清晓凭栏心不迫，\n夜来兴起赋诗笺。 ​​​", "date": "2022.12.14", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4846502579540711 - 七绝              望/01.jpg"]}, {"id": "4846865008827650", "title": "七绝·道", "genre": "七绝", "body": "尘世阴阳万物间，\n此消彼长两重天。\n乾坤翻转无穷尽，\n日月晴缺去复还。 ​​​", "date": "2022.12.15", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4846865008827650 - 七绝      道/01.jpg"]}, {"id": "4847227993063457", "title": "七律·赠友归休", "genre": "七律", "body": "人生山海景非同，\n南北风光异样情。\n莫恋曾经桃李路，\n且观今日岭坡枫。\n锦颜无悔高歌唱，\n霜鬓还应雅趣浓。\n树下逢棋心自语，\n窗前咏赋鸟来听。 ​​​", "date": "2022.12.16", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4847227993063457 - 七律    赠友归休/01.jpg"]}, {"id": "4847619815514262", "title": "蝶恋花·观图有寄", "genre": "蝶恋花", "body": "冷暖由天情在己。\n莫使心愁，\n觅趣随天意。\n桃李争春芳满地，\n红枫黄叶霞千里。\n夏院临风闲对弈。\n踏雪寻梅，\n冷处清香溢。\n月下垂竿池水碧，\n围炉博古茶烟细。\n注：月曼清游图\n图中12月，每月\n别有趣。 ​​​", "date": "2022.12.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4847619815514262 - 蝶恋花 观图有寄/01.jpg"]}, {"id": "4847944522268794", "title": "七绝·叹", "genre": "七绝", "body": "路阔灯红少气息，\n并非风冷夜深时。\n从前寂静缘封控，\n今日多因体不支。 ​​​", "date": "2022.12.18", "themes": ["感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4847944522268794 - 七绝        叹/01.jpg"]}, {"id": "4848308462034842", "title": "长相思·望", "genre": "长相思", "body": "山亦寒，水亦寒。\n闻遍阳声雁未还。\n悲情染泪笺。\n思春妍，盼春妍。\n地暖花开舒肺肝。\n疫消人自安。 ​​​", "date": "2022.12.19", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4848308462034842 - 长相思      望/01.jpg"]}, {"id": "4848669868689819", "title": "长相思·闲吟", "genre": "长相思", "body": "你也阳，我也阳。\n邻里亲朋各卧床。\n悬壶店铺忙。\n左一张，右一张。\n退热安神皆妙方。\n药行人不慌。 ​​​", "date": "2022.12.20", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4848669868689819 - 长相思       闲吟/01.jpg"]}, {"id": "4849034328551274", "title": "蝶恋花·孙女两周", "genre": "蝶恋花", "body": "生日今朝千里远。\n遥望边疆，\n多少相思念。\n拂晓闻烧心里乱，\n天公何意招人怨。\n惟盼风轻霜雪淡。\n尽早阳康，\n更若花枝灿。\n祈祝精灵神气现，\n此劫过后京城见。 ​​​", "date": "2022.12.21", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4849034328551274 - ​蝶恋花 孙女两周/01.jpg"]}, {"id": "4849437333783713", "title": "点绛唇·祈望孙女安康", "genre": "点绛唇", "body": "冬至天寒，娇娃冷热予心碎。\n嗜床昏睡，巧嘴无滋味。\n千里之遥，难替儿孙罪。\n夜无寐。祈孙烧退，开口舒肠胃。 ​​​", "date": "2022.12.22", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4849437333783713 - 点绛唇  祈望孙女安康/01.jpg"]}, {"id": "4849756541550846", "title": "浣溪沙·戏赠维真", "genre": "浣溪沙", "body": "智者归休愿景多，\n激扬文字爱生活。\n思如天马过山车。\n心想旅行人未动，\n喉出音调不成歌。\n理财苦少玉金坨。 ​​​", "date": "2022.12.23", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4849756541550846 - 浣溪沙 戏赠维真/01.jpg"]}, {"id": "4850119537071516", "title": "七绝·岁晚抒怀", "genre": "七绝", "body": "少年豪气梦趋同，\n惊醒多成半老翁。\n世路崎岖车马乱，\n几人好运入关中！ ​​​", "date": "2022.12.24", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4850119537071516 - 七绝
