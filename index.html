唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4578694892360313 - 七律 黄鹤楼寄怀/01.jpg", "冰雪诗词_全部图片/4578694892360313 - 七律 黄鹤楼寄怀/02.jpg", "冰雪诗词_全部图片/4578694892360313 - 七律 黄鹤楼寄怀/03.jpg"]}, {"id": "4579058673258300", "title": "卜算子·望庐山瀑布", "genre": "卜算子", "body": "日照古庐山，烟紫炉香酽。\n倒挂银河亿万年，瀑布琼珠乱。\n迷倒太白仙，把酒声声唤。\n翠影红霞映九天，日落苍山暗。 ​​​", "date": "2020.12.06", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4579058673258300 - 卜算子    望庐山瀑布/01.jpg", "冰雪诗词_全部图片/4579058673258300 - 卜算子    望庐山瀑布/02.jpg", "冰雪诗词_全部图片/4579058673258300 - 卜算子    望庐山瀑布/03.jpg"]}, {"id": "4579419009589952", "title": "七绝·冬夜闲吟", "genre": "七绝", "body": "故人别聚又东西，\n馐馔万千终散席。\n人世风光似花艳，\n寒霜过后化青泥。 ​​​", "date": "2020.12.07", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4579419009589952 - 七绝    冬夜闲吟/01.jpg", "冰雪诗词_全部图片/4579419009589952 - 七绝    冬夜闲吟/02.jpg"]}, {"id": "4579782694015950", "title": "七绝·大雪有寄", "genre": "七绝", "body": "银装素裹千山静，\n玉镜无言万水凝。\n篱落红梅娇欲放，\n人间祥瑞又春风。 ​​​", "date": "2020.12.08", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4579782694015950 - 七绝    大雪有寄/01.jpg", "冰雪诗词_全部图片/4579782694015950 - 七绝    大雪有寄/02.jpg"]}, {"id": "4580152665179777", "title": "七律·遥看闲咏", "genre": "七律", "body": "神州域外起狼烟，\n更忆当年祖辈贤。\n国弱家贫恒有志，\n山河南北渺强权。\n一星两弹惊天地，\n五岭三山改旧颜。\n几代先人不遗力，\n英雄气概至今传。 ​​​", "date": "2020.12.09", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4580152665179777 - 七律    遥看闲咏/01.jpg", "冰雪诗词_全部图片/4580152665179777 - 七律    遥看闲咏/02.jpg"]}, {"id": "4580504865870942", "title": "虞美人·旗映蟾宫", "genre": "虞美人", "body": "广寒宫里红旗俏，\n惊醒嫦娥笑。\n千年寂寞舞长空，\n四下无人、怎可诉衷情。\n而今可晓神州事，\n万里相思寄。\n往来天地不须愁，\n凭借飞船、山海任欢游。 ​​​", "date": "2020.12.10", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4580504865870942 - 虞美人        旗映蟾宫/01.jpg"]}, {"id": "4580865227098391", "title": "破阵子·壶口冰瀑", "genre": "破阵子", "body": "千里滔滔凝滞，\n琼花玉柱惊魂。\n一抹飞虹萦两岸，\n炫彩当空撩眼神。\n风光胜夏春。\n不用工雕匠刻，\n晶莹剔透绝伦。\n休怨隆冬无景色，\n且看黄河俏美人。\n冰壶情意真。 ​​​", "date": "2020.12.11", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4580865227098391 - 破阵子 壶口冰瀑/01.jpg", "冰雪诗词_全部图片/4580865227098391 - 破阵子 壶口冰瀑/02.jpg", "冰雪诗词_全部图片/4580865227098391 - 破阵子 壶口冰瀑/03.jpg"]}, {"id": "4581235768693779", "title": "七绝·趣题", "genre": "七绝", "body": "闲来无事坐桌旁，\n风雨不惊闻酒香。\n多少投机名利客，\n每逢此处自神伤。 ​​​", "date": "2020.12.12", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4581235768693779 - 七绝            趣题/01.jpg"]}, {"id": "4581328715255534", "title": "七绝·绝望", "genre": "七绝", "body": "懂王无奈谁人懂，\n失落之情日益浓。\n以为一根香稻草，\n到头却是水中萍。 ​​​", "date": "2020.12.12", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4581328715255534 - 七绝            绝望/01.jpg"]}, {"id": "4581593387114615", "title": "菩萨蛮·公祭抒怀", "genre": "菩萨蛮", "body": "雨花台下飞寒露，\n当年多少冤魂度。\n日寇灭人寰，\n血光映远天。\n国殇时刻记，\n勿忘山河耻。\n吾辈自当强，\n同心固汉疆。 ​​​", "date": "2020.12.13", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4581593387114615 - 菩萨蛮 公祭抒怀/01.jpg", "冰雪诗词_全部图片/4581593387114615 - 菩萨蛮 公祭抒怀/02.jpg"]}, {"id": "4581955356857861", "title": "蝶恋花·遥思", "genre": "蝶恋花", "body": "夜冷窗寒独对酒，\n灯影无言，\n恰似知心友。\n苦乐不离相看久，\n开怀畅饮同厮守。\n更深人静山衔斗，\n月转星移，\n望北频搔首。\n不道家妻伤病手，\n而今自主如前否？ ​​​", "date": "2020.12.14", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4581955356857861 - 蝶恋花        遥思/01.jpg"]}, {"id": "4582315068233386", "title": "五律·戏和行者老弟", "genre": "五律", "body": "山中望旧庵，独坐小溪南。\n香客难超五，鸣禽不过三。\n铜壶茶欲沸，施主睡方酣。\n梦里听佛语，醒来望岭岚。\n附原玉：\n五律 • 踏雪访友\n健行者\n寻阶向草庵，雪掩老门南。\n犬踱梅花五，鸡蹁竹叶三。\n闲吟炉正沸，小酌酒方酣。\n醉卧听风语，霜林漫夕岚。", "date": "2020.12.15", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4582315068233386 - 五律     戏和行者老弟/01.jpg"]}, {"id": "4582677430671703", "title": "如梦令·无赖", "genre": "如梦令", "body": "撒谎扯皮宫斗，\n顶上黄毛腥臭。\n鸦嘴总无休，\n已令世间烦透。\n难受，难受，\n且待春风除垢。 ​​​", "date": "2020.12.16", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4582677430671703 - 如梦令    无赖/01.jpg"]}, {"id": "4583039193581766", "title": "清平乐·冬练见闻", "genre": "清平乐", "body": "晓寒湿雾，\n阻断东西路。\n残月无形多冷露，\n败叶枯枝鸦宿。\n街园隐隐行人，\n跳绳舞剑频频。\n老少眉山飞雪，\n笑谈别有精神。 ​​​", "date": "2020.12.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4583039193581766 - 清平乐 冬练见闻/01.jpg"]}, {"id": "4583059783948107", "title": "踏莎行·贺嫦五回家", "genre": "踏莎行", "body": "夜色虹光，\n寒天娥影。\n蟾宫一对风情种。\n依依别过下凡间，\n圆了千载回归梦。\n袖纳奇香，\n怀揣异景。\n蹁跹晓落惊人醒。\n神州大地马牛欢，\n燕鹰高唱山河咏。 ​​​", "date": "2020.12.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4583059783948107 - 踏莎行 贺嫦五回家/01.jpg"]}, {"id": "4583406916604939", "title": "一丛花·冬晓有见", "genre": "一丛花", "body": "北风卷叶舞清寒，\n刺骨痛心尖。\n残星斜月千般躲。\n冷霜漫，灯影飞悬。\n路静人稀，\n薄冰障眼，\n鸦雀正枝眠。\n勿闻隐隐扫街边，\n车动又挥锨。\n时时嘘气呵双手。\n鬓飞雪，步履蹒跚。\n美容城市，\n孤身默默，\n日月复年年。 ​​​", "date": "2020.12.18", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4583406916604939 - 一丛花     冬晓有见/01.jpg", "冰雪诗词_全部图片/4583406916604939 - 一丛花     冬晓有见/02.jpg", "冰雪诗词_全部图片/4583406916604939 - 一丛花     冬晓有见/03.jpg"]}, {"id": "4583788653586574", "title": "卜算子·和维真", "genre": "卜算子", "body": "越岭过重山，又至云天寺。\n祈祷福财屡进香，堂殿频求字。\n日夜拜佛陀，奢望生无死。\n坐想行思几近痴，富者多如此。\n附原玉：\n卜算子      卦\n维真\n云渺绕幽山，烟锁寒凉寺。\n怨子祈添手上香，欲解乾坤字。\n福祸鉴弥陀，易卜玄生死。\n恍若心魔枉自痴，命注签如此。", "date": "2020.12.19", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4583788653586574 - 卜算子          和维真/01.jpg", "冰雪诗词_全部图片/4583788653586574 - 卜算子          和维真/02.jpg"]}, {"id": "4584129133808339", "title": "清平乐·感京都车辆新政", "genre": "清平乐", "body": "官人动嘴，\n百姓愁双腿。\n你往他来南复北，\n岁末车潮似水。\n商家买卖兴隆，\n情急难保公平。\n最苦黎民心血，\n这般如此折腾。 ​​​", "date": "2020.12.20", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4584129133808339 - 清平乐 感京都车辆新政/01.jpg", "冰雪诗词_全部图片/4584129133808339 - 清平乐 感京都车辆新政/02.jpg"]}, {"id": "4584492561864198", "title": "浣溪沙·喜逢冬至", "genre": "浣溪沙", "body": "星耀京城夜欲阑，\n子添娇女喜迎年。\n阖家欢畅更空前。\n梅雪逢春花自好，\n门庭飞瑞鹊留连。\n东风紫气艳阳天。\n七绝 冬至子得女\n昼短宵长数九天，\n始生阳气逆风寒。\n无言岁月人欢喜，\n乖女飘然落吾边。 ​​​", "date": "2020.12.21", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4584492561864198 - 浣溪沙 喜逢冬至/01.jpg", "冰雪诗词_全部图片/4584492561864198 - 浣溪沙 喜逢冬至/02.jpg"]}, {"id": "4585218491289954", "title": "踏莎行·家喜众贺", "genre": "踏莎行", "body": "母女平安，\n家门欢乐。\n恰逢冬至亲朋贺。\n爷爷奶奶喜眉梢，\n姑姨舅姥心怀阔。\n浓发娇颜，\n薄唇靥窝。\n喃喃自语娘边卧。\n众人期盼早回家，\n身揣手把灯宵彻。 ​​​", "date": "2020.12.23", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4585218491289954 - 踏莎行 家喜众贺/01.jpg"]}, {"id": "4585576890635706", "title": "点绛唇·盼", "genre": "点绛唇", "body": "姣女将归，\n秀床花被馨屋暖。\n楼台凝眼，\n晴晓风云淡。\n遥望冬阳，\n万道霞光远。\n梢头看，\n鹊鸣莺啭，\n欢响萦庭院。 ​​​", "date": "2020.12.24", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4585576890635706 - 点绛唇           盼/01.jpg"]}, {"id": "4585941777517991", "title": "看花回·玉蕊初绽", "genre": "看花回", "body": "娇小归来，长是靥放眉展。且看一双嫩手，似燕莺飞舞，时隐时现。芳脸细眸，偶尔寻声头自转。吃复睡，无虑心甜，梦里低语笑声浅。\n门户喜，光盈几案。老少乐，气和香漫。金锁银镯在手，聚长辈情怀，宾朋意愿。只盼将来，体康神安前程远。吾虽累，却无怨，乖巧天天见。", "date": "2020.12.25", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4585941777517991 - 看花回 玉蕊初绽/01.jpg"]}, {"id": "4586110384869790", "title": "七律·冬夜寄怀", "genre": "七律", "body": "静无喧闹过寒天，\n网上清新任我观。\n惟有军人风雪立，\n岂因洋鬼送平安。\n居家当念边关苦，\n出外犹思华夏甘。\n隔夜主席生诞日，\n请君默默记心间。 ​​​", "date": "2020.12.25", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4586110384869790 - 七律    冬夜寄怀/01.jpg"]}, {"id": "4586304811303664", "title": "念奴娇·领袖颂", "genre": "念奴娇", "body": "冷天寒地，恰主席生日，万众追思。休道伟人行已远，山海曾记当时。橘子洲头，井冈山上，足迹遍东西。古田明断，红军所向披靡。\n遵义城上空前，看核心确立，迈步身齐。赤水来回三四次，对手无奈皆迷。抗日八年，神州解放，华夏创新奇。至今犹唱，沁园春雪之词。", "date": "2020.12.26", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "怀古咏史与读文有感", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4586304811303664 - 念奴娇 领袖颂/01.jpg", "冰雪诗词_全部图片/4586304811303664 - 念奴娇 领袖颂/02.jpg", "冰雪诗词_全部图片/4586304811303664 - 念奴娇 领袖颂/03.jpg"]}, {"id": "4586670617794141", "title": "七绝·铭记", "genre": "七绝", "body": "吃水感恩挖井人，\n复兴凝聚圣贤魂。\n韶山旭日千辉照，\n江海清波万里春。 https://video.weibo.com/show?fid=1034:4586670562148362 ​​​", "date": "2020.12.27", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": []}, {"id": "4587033793928444", "title": "沁园春·主席颂", "genre": "沁园春", "body": "千古一人，绝代英豪，\n文秀字飘。\n望神州内外，文哲政史；\n名家无数，岂有追超。\n对阵列强，武装百姓，\n诸子谁人可比高。\n秋暴动，长工农志气，\n山海妖娆。\n赤旗多彩多娇，\n引华夏英雄竞折腰。\n反蒋家内战，运筹帷幄；\n缜思遥控，独领风骚。\n抗美援朝，国威远震，\n万里云空射大雕。\n豪气荡，更精神永在，\n激励今朝。", "date": "2020.12.28", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4587033793928444 - 沁园春                主席颂/01.jpg", "冰雪诗词_全部图片/4587033793928444 - 沁园春                主席颂/02.jpg"]}, {"id": "4587388632830973", "title": "七绝·婴儿乐", "genre": "七绝", "body": "梦里终究何喜事？\n三番五次笑由衷。\n安然无虑舒心卧，\n惟愿悠悠乐此生。 ​​​", "date": "2020.12.29", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4587388632830973 - 七绝        婴儿乐/01.jpg", "冰雪诗词_全部图片/4587388632830973 - 七绝        婴儿乐/02.jpg", "冰雪诗词_全部图片/4587388632830973 - 七绝        婴儿乐/03.jpg", "冰雪诗词_全部图片/4587388632830973 - 七绝        婴儿乐/04.jpg"]}, {"id": "4587750742821732", "title": "西江月·冬夜感怀", "genre": "西江月", "body": "冷月银空高挂，\n寒风树杪低鸣。\n街头巷尾少人行，\n楼宇窗灯相映。\n已是年前岁暮，\n又燃疫火瘟情。\n世人胆颤梦魂惊，\n祈望神州安定。 ​​​", "date": "2020.12.30", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4587750742821732 - 西江月 冬夜感怀/01.jpg", "冰雪诗词_全部图片/4587750742821732 - 西江月 冬夜感怀/02.jpg"]}, {"id": "4588112577825743", "title": "踏莎行·岁暮抒怀", "genre": "踏莎行", "body": "岁月如流，\n年光无迹。\n韶华锦绣终将逝。\n银丝斑鬓又何妨，\n窗前闲望云空碧。\n咏诵苏辛，\n追寻杜李。\n唐风宋雨催天丽。\n吟霜赋雪好迎春，\n纵情山水抒豪气。 ​​​", "date": "2020.12.31", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4588112577825743 - 踏莎行 岁暮抒怀/01.jpg", "冰雪诗词_全部图片/4588112577825743 - 踏莎行 岁暮抒怀/02.jpg", "冰雪诗词_全部图片/4588112577825743 - 踏莎行 岁暮抒怀/03.jpg"]}, {"id": "4588476139577769", "title": "念奴娇·新年寄怀", "genre": "念奴娇", "body": "无声岁月，又悄悄暗换，喜迎元旦。\n万里神州山海笑，日月星辰光灿。\n回首春时，疫情肆虐，霎那江城乱。\n精明决策，聚人心势翻转。\n更有纾困脱贫、嫦娥辞月、北斗巡天眼。\n不管风吹千里浪，且看巨龙腾远。\n百姓安居，城乡同进，诸事随人愿。\n燕莺翔奋，竞风流翼高展。", "date": "2021.01.01", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4588476139577769 - 祝大家元旦快乐！！！/01.jpg", "冰雪诗词_全部图片/4588476139577769 - 祝大家元旦快乐！！！/02.jpg", "冰雪诗词_全部图片/4588476139577769 - 祝大家元旦快乐！！！/03.jpg"]}, {"id": "4588837365356660", "title": "夜游宫·跨年情", "genre": "夜游宫", "body": "窗外寒声阵阵，\n冷侵月，夜深风劲。\n窒内温馨却无困。\n共言欢，品香茗，\n清觯饮。\n且看婵娟晕，\n渐西下，漫消辉尽。\n红日东升更人奋，\n又新年，丽云空，\n迎好运。 ​​​", "date": "2021.01.02", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4588837365356660 - 夜游宫        跨年情/01.jpg", "冰雪诗词_全部图片/4588837365356660 - 夜游宫        跨年情/02.jpg", "冰雪诗词_全部图片/4588837365356660 - 夜游宫        跨年情/03.jpg"]}, {"id": "4589201041136080", "title": "踏莎行·别样新年", "genre": "踏莎行", "body": "政客犹狂，\n疫情愈甚。\n白宫内斗街头愤。\n谁当总统吵无休，\n平民群死鲜人问。\n日本封国，\n克龙确诊。\n伦敦动荡争逃遁。\n中欧贸易立新规，\n神州山水风云劲。 ​​​", "date": "2021.01.03", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4589201041136080 - 踏莎行 别样新年/01.jpg"]}, {"id": "4589562716754697", "title": "踏莎行·夜遣怀", "genre": "踏莎行", "body": "长近尊前，\n少思身外。\n老来心淡行难快。\n孩儿自是路千条，\n乌鸦亦有他人爱。\n安度春秋，\n缓行岳岱。\n无言山水真情在。\n赏临花草气幽清，\n免生烦恼无妨碍。 ​​​", "date": "2021.01.04", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4589562716754697 - 踏莎行     夜遣怀/01.jpg"]}, {"id": "4589942082120803", "title": "渔家傲·小寒寄怀", "genre": "渔家傲", "body": "时入小寒风色冷，\n啼鸦零乱惊宵梦。\n晓起窗栊盈玉冻。\n寒气盛，\n残枝瑟瑟频摇动。\n岁暮袭来情难胜，\n银丝斑鬓毋堪镜。\n多少浮生尘世影。\n人不静，\n年光似水伤心痛。 ​​​", "date": "2021.01.05", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4589942082120803 - 渔家傲 小寒寄怀/01.jpg"]}, {"id": "4590288163048272", "title": "采桑子·祈盼", "genre": "采桑子", "body": "京门南望情怀乱，\n愁念家乡，\n疫又猖狂，\n心上眉间点点慌。\n由衷惟愿风云过，\n雨霁虹光，\n山海飞阳，\n无恙亲朋共举觞。 ​​​", "date": "2021.01.06", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4590288163048272 - 采桑子        祈盼/01.jpg", "冰雪诗词_全部图片/4590288163048272 - 采桑子        祈盼/02.jpg"]}, {"id": "4590653675931298", "title": "卜算子·闻疫有感", "genre": "卜算子", "body": "武汉疫情消，\n不道石门烈。\n零下寒风刺骨疼，\n夜里核酸确。\n灾患总无常，\n且莫轻欢跃。\n却是忧思谨慎行，\n苦难终能越。 ​​​", "date": "2021.01.07", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4590653675931298 - 卜算子 闻疫有感/01.jpg", "冰雪诗词_全部图片/4590653675931298 - 卜算子 闻疫有感/02.jpg"]}, {"id": "4590820168057602", "title": "浣溪沙·送老特", "genre": "浣溪沙", "body": "怨地仇天怼选民，\n黄毛丑脸恶心人。\n终遭唾弃似烟尘。\n搅乱寰球得报应，\n撕开美帝费贼心。\n四年埋下祸灾根。 ​​​", "date": "2021.01.07", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4590820168057602 - 浣溪沙    送老特/01.jpg", "冰雪诗词_全部图片/4590820168057602 - 浣溪沙    送老特/02.jpg", "冰雪诗词_全部图片/4590820168057602 - 浣溪沙    送老特/03.jpg", "冰雪诗词_全部图片/4590820168057602 - 浣溪沙    送老特/04.jpg"]}, {"id": "4591014364581529", "title": "踏莎行·缅怀总理", "genre": "踏莎行", "body": "磊落无私，\n清廉大爱。\n西花厅里春常在。\n诙谐睿智语平和，\n谦尊老少人心快。\n梁栋高才，\n山峰巨岱。\n谁人堪比情豪迈。\n一生无子爱无疆，\n飘然神影千年拜。 ​​​", "date": "2021.01.08", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4591014364581529 - 踏莎行 缅怀总理/01.jpg", "冰雪诗词_全部图片/4591014364581529 - 踏莎行 缅怀总理/02.jpg", "冰雪诗词_全部图片/4591014364581529 - 踏莎行 缅怀总理/03.jpg"]}, {"id": "4591378408935890", "title": "七律·颂总理", "genre": "七律", "body": "周公无子更无私，\n沥血为民才智奇。\n少壮明心华夏起，\n终生践志未曾移。\n虚怀待事情思满，\n和气与人诚不失。\n处世清廉堪典范，\n神州内外美名遗。 ​​​", "date": "2021.01.09", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4591378408935890 - 七律        颂总理/01.jpg", "冰雪诗词_全部图片/4591378408935890 - 七律        颂总理/02.jpg"]}, {"id": "4591736892424433", "title": "点绛唇·瑞雪香梅", "genre": "点绛唇", "body": "银粟纷纷，\n叶寒香冷枝梅秀。\n晓风辞旧，\n红日驱星斗。\n便是晴空，\n户外难伸手。\n正三九，\n鹊鸣残柳，\n欢喜迎辛丑。 ​​​", "date": "2021.01.10", "themes": ["感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4591736892424433 - 点绛唇  瑞雪香梅/01.jpg", "冰雪诗词_全部图片/4591736892424433 - 点绛唇  瑞雪香梅/02.jpg"]}, {"id": "4592100291120445", "title": "踏莎行·望乡", "genre": "踏莎行", "body": "地冻天寒，\n千家万户。\n悲情燕赵风云度。\n毒虫肆虐暗苍空，\n英雄儿女无穷数。\n白甲逆行，\n赤心飞步。\n一方有难八方助。\n神州同盼艳阳天，\n喜逢辛丑花开处。 ​​​", "date": "2021.01.11", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4592100291120445 - 踏莎行         望乡/01.jpg", "冰雪诗词_全部图片/4592100291120445 - 踏莎行         望乡/02.jpg", "冰雪诗词_全部图片/4592100291120445 - 踏莎行         望乡/03.jpg", "冰雪诗词_全部图片/4592100291120445 - 踏莎行         望乡/04.jpg"]}, {"id": "4592461102187960", "title": "七绝·画皮", "genre": "七绝", "body": "曾记当时佩洛西，\n暴徒祸港却心期。\n而今风景桌边秀，\n怒目仇言老脸急。 ​​​", "date": "2021.01.12", "themes": ["感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4592461102187960 - 七绝            画皮/01.jpg", "冰雪诗词_全部图片/4592461102187960 - 七绝            画皮/02.jpg", "冰雪诗词_全部图片/4592461102187960 - 七绝            画皮/03.jpg"]}, {"id": "4592826166019452", "title": "踏莎行·凭图寄怀", "genre": "踏莎行", "body": "忠孝难全，\n阴阳无怨。\n纯真儿女心怀善。\n凝神抗疫品行高，\n银屏内外同声赞。\n华夏辉煌，\n国人奉献。\n寻常日夜频挥汗。\n恒心似水向东流，\n换来今日山河灿。 ​​​", "date": "2021.01.13", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4592826166019452 - 踏莎行 凭图寄怀/01.jpg"]}, {"id": "4593188520072410", "title": "七律·遥望", "genre": "七律", "body": "惊闻疫害近家门，\n彻夜愁眠念远村。\n父母需人儿不在，\n亲朋有苦我分心。\n非常举措难归去，\n无限忧伤更费神。\n幸有东风送温暖，\n驱除寒冷好逢春。 ​​​", "date": "2021.01.14", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4593188520072410 - 七律            遥望/01.jpg"]}, {"id": "4593552749762288", "title": "七绝·心声", "genre": "七绝", "body": "疫情唤醒人间爱，\n萤火微光夜路明。\n独自宵行心胆怯，\n高歌携手唱英雄。 ​​​", "date": "2021.01.15", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4593552749762288 - 七绝            心声/01.jpg", "冰雪诗词_全部图片/4593552749762288 - 七绝            心声/02.jpg", "冰雪诗词_全部图片/4593552749762288 - 七绝            心声/03.jpg"]}, {"id": "4593911144646772", "title": "卜算子·寒夜明珠", "genre": "卜算子", "body": "……赠国网石电人\n慷慨送光明，\n万户寒灯亮。\n刺骨西风雪满身，\n眉眼冰花酿。\n不道疫突来，\n逆进谁思量。\n电入方舱病患安，\n赤胆真情漾。 ​​​", "date": "2021.01.16", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4593911144646772 - 卜算子 寒夜明珠/01.jpg", "冰雪诗词_全部图片/4593911144646772 - 卜算子 寒夜明珠/02.jpg", "冰雪诗词_全部图片/4593911144646772 - 卜算子 寒夜明珠/03.jpg", "冰雪诗词_全部图片/4593911144646772 - 卜算子 寒夜明珠/04.jpg", "冰雪诗词_全部图片/4593911144646772 - 卜算子 寒夜明珠/05.jpg", "冰雪诗词_全部图片/4593911144646772 - 卜算子 寒夜明珠/06.jpg"]}, {"id": "4594270810146673", "title": "定风波·趣闻戏吟", "genre": "定风波", "body": "饮酒归来偶犯迷，\n忘乎席上俏芳姿。\n他日相逢歌店里，\n无视。\n朱唇秀靥话当时。\n再挽金尊推玉臂，\n杯起。\n情深肠断语迟迟。\n没早搭言恨无比，\n窃喜。\n又朦南北落东西。 ​​​", "date": "2021.01.17", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4594270810146673 - 定风波 趣闻戏吟/01.jpg", "冰雪诗词_全部图片/4594270810146673 - 定风波 趣闻戏吟/02.jpg"]}, {"id": "4594633936211857", "title": "千秋岁·岁暮吟", "genre": "千秋岁", "body": "腊八将近，\n冷叶霜风奋。\n梅绽放，飞清韵。\n篱枝摇玉蕊，\n莺报春音信。\n昂首盼，\n层冰溶化新芽嫩。\n庚子年光钝，\n冠疫生心恨。\n临岁杪，情趋紧。\n闭城封户策，\n期待幽虫遁。\n闻境外，\n漫无章法人神愤！ ​​​", "date": "2021.01.18", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4594633936211857 - 千秋岁     岁暮吟/01.jpg"]}, {"id": "4595000081659967", "title": "七绝·岁末闲吟", "genre": "七绝", "body": "人生有限愿无穷，\n岁月蹉跎怨恨成。\n若使尘心终向善，\n云天寥廓总为晴。 ​​​", "date": "2021.01.19", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4595000081659967 - 七绝    岁末闲吟/01.jpg", "冰雪诗词_全部图片/4595000081659967 - 七绝    岁末闲吟/02.jpg"]}, {"id": "4595360875939780", "title": "七律·腊八寄怀", "genre": "七律", "body": "风摇月影九霄寒，\n腊日更逢飞雪天。\n一碗浓粥心里热，\n几颗香枣口中甘。\n悠悠揣品非常味，\n慢慢琢磨异往年。\n客地疫留思故里，\n梦闻父母与儿言。 ​​​", "date": "2021.01.20", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4595360875939780 - 七律    腊八寄怀/01.jpg"]}, {"id": "4595469810142246", "title": "七律·寄若煊满月", "genre": "七律", "body": "一从娇女落儿家，\n蓬荜温馨胜百花。\n长是欢声盈牖户，\n鲜闻哭闹透帏纱。\n朱唇粉面纤香手，\n黑发浓眉嫩脚丫。\n乖巧灵通诚可爱，\n犹如玉蕾似朝霞。 ​​​", "date": "2021.01.20", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4595469810142246 - 七律 寄若煊满月/01.jpg", "冰雪诗词_全部图片/4595469810142246 - 七律 寄若煊满月/02.jpg", "冰雪诗词_全部图片/4595469810142246 - 七律 寄若煊满月/03.jpg", "冰雪诗词_全部图片/4595469810142246 - 七律 寄若煊满月/04.jpg", "冰雪诗词_全部图片/4595469810142246 - 七律 寄若煊满月/05.jpg", "冰雪诗词_全部图片/4595469810142246 - 七律 寄若煊满月/06.jpg"]}, {"id": "4595724475969200", "title": "采桑子·别了老特", "genre": "采桑子", "body": "黄毛怎耐随风去，\n带走乌云，\n终作烟尘。\n树倒猢狲各自奔。\n可怜无数痴川粉，\n奢望翻身，\n断梦惊魂。\n不解风情枉费神。 ​​​", "date": "2021.01.21", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4595724475969200 - 采桑子 别了老特/01.jpg"]}, {"id": "4596083009266517", "title": "减字木兰花·二首", "genre": "减字木兰花", "body": "一.\n黯然离去，\n覆水难回人若絮。\n枉费心机，\n自恋多疑癞脸皮。\n谎言盗语，\n四载嚣张伤几许。\n四处狂嘶，\n败落孤狼独自啼。\n二.\n并非挺拜，\n举世反川情意在。\n米帝阴浑，\n祸乱神州是为根。\n打消幻想，\n利剑长缨凭手仗。\n江海齐鸣，\n巨浪滔滔起大鹏。 ​​​", "date": "2021.01.22", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4596083009266517 - 减字木兰花 二首/01.jpg", "冰雪诗词_全部图片/4596083009266517 - 减字木兰花 二首/02.jpg", "冰雪诗词_全部图片/4596083009266517 - 减字木兰花 二首/03.jpg", "冰雪诗词_全部图片/4596083009266517 - 减字木兰花 二首/04.jpg"]}, {"id": "4596446089453585", "title": "清平乐·冬泳", "genre": "清平乐", "body": "霜天雪地，\n冻水凝寒气。\n且看健儿挥赤臂，\n壮美琼花四起。\n北风吹荡残枝，\n冷光辉映冰池。\n最喜蛟龙勇色，\n身萦玉甲银丝。 ​​​", "date": "2021.01.23", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4596446089453585 - 清平乐        冬泳/01.jpg", "冰雪诗词_全部图片/4596446089453585 - 清平乐        冬泳/02.jpg"]}, {"id": "4596810025535356", "title": "七律·疫中人", "genre": "七律", "body": "难耐闲居苦掩门，\n寒窗宵昼对灯昏。\n凭栏遥想生微惧，\n望月愁思忆远村。\n无虑盘餐聊自慰，\n分心杯盏寄孤魂。\n啼鸦零乱惊晨梦，\n欹枕凝眉又把尊。 ​​​", "date": "2021.01.24", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4596810025535356 - 七律        疫中人/01.jpg"]}, {"id": "4597173822169848", "title": "七律·疫中人2", "genre": "七律", "body": "居家睡傻下厨房，\n刀俎锅盆灶上忙。\n猪肉红烧肥不腻，\n蟹虾焖炒户飘香。\n餐餐丰色盘鲜美，\n日日盈杯酒泛黄。\n疫害渐消回首望，\n横腰对镜暗心伤。 ​​​", "date": "2021.01.25", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4597173822169848 - 七律    疫中人2/01.jpg", "冰雪诗词_全部图片/4597173822169848 - 七律    疫中人2/02.jpg"]}, {"id": "4597535983535994", "title": "汉宫春·庚子吟", "genre": "汉宫春", "body": "岁暮时光，望年初疫起，武汉人愁。春寒扫枝卷叶，晴日难留。东风号令，聚八方、赤子如流。历数月，云消雨霁，花香又漫神州。\n回看西洋世界，却哀鸿遍野，怒火无由。当初信口胡语，祸水难收。如今怎奈，害无穷，人死街头。凭对比，东西两岸，此番谁劣谁优。", "date": "2021.01.26", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4597535983535994 - 汉宫春    庚子吟/01.jpg"]}, {"id": "4597898488317220", "title": "七律·疫中人3", "genre": "七律", "body": "午后无聊凑将台，\n愁思欲坐却徘徊。\n东西南北风寒起，\n九饼三条赤绿来。\n杠上开花人窃喜，\n牌中失算己悲哀。\n忧伤不只钱输尽，\n更苦家门几日开！ ​​​", "date": "2021.01.27", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4597898488317220 - 七律     疫中人3/01.jpg"]}, {"id": "4598262101970454", "title": "踏莎行·腊月十五夜", "genre": "踏莎行", "body": "明月盈空，\n冷霜匝地。\n西风彻夜浑无忌。\n帝都虽是近春天，\n依然檐下冰垂涕。\n欲进牛年，\n愤离庚子。\n愁心惟愿新冠毙。\n开门纳客喜迎春，\n南来北往随君意。 ​​​", "date": "2021.01.28", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4598262101970454 - 踏莎行 腊月十五夜/01.jpg"]}, {"id": "4598623885853666", "title": "七律·疫中人4", "genre": "七律", "body": "从前股票偷偷看，\n惟恐被辞丢饭碗。\n近日行情细细研，\n居家独大谁能管。\n开盘闭市起波涛，\n滞涨急跌心绪乱。\n红绿难期却倾心，\n而今处处无钱赚。 ​​​", "date": "2021.01.29", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4598623885853666 - 七律     疫中人4/01.jpg"]}, {"id": "4598986214212875", "title": "七律·疫中人5", "genre": "七律", "body": "寥落尘心庭院间，\n掩门自饮味难甘。\n独听残月无言语，\n孤对寒窗绪不安。\n梦里常惊冠疫事，\n醒来又看手屏前。\n有谁知晓除封日？\n旧友重逢把酒欢。 ​​​", "date": "2021.01.30", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4598986214212875 - 七律     疫中人5/01.jpg"]}, {"id": "4599347528336090", "title": "七律·疫中人6", "genre": "七律", "body": "历雨经风度晚晴，\n闭门防疫绪难平。\n机言屏语传情意，\n咏赋吟诗递爱声。\n遥望隔山同日月，\n近闻临院对筹觥。\n严寒过后春相聚，\n柳陌桃磎乐此生。 ​​​", "date": "2021.01.31", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4599347528336090 - 七律     疫中人6/01.jpg"]}, {"id": "4599706628396061", "title": "七律·疫中人7", "genre": "七律", "body": "石门疫讯渐消停，\n多少英雄可勒铭。\n医者逆行忙日月，\n警民遵命戴辰星。\n社区灯火千家暖，\n屏上官言万户宁。\n邻里隔空传信语，\n比肩寒夜待天明。 ​​​", "date": "2021.02.01", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4599706628396061 - 七律      疫中人7/01.jpg", "冰雪诗词_全部图片/4599706628396061 - 七律      疫中人7/02.jpg", "冰雪诗词_全部图片/4599706628396061 - 七律      疫中人7/03.jpg"]}, {"id": "4600073046987578", "title": "踏莎行·寄同窗", "genre": "踏莎行", "body": "天上星辰，\n人间烟火。\n岭峰千载飞云朵。\n古今江海水无穷，\n纵横阡陌飘花果。\n世态多姿，\n犹如你我。\n风霜苦乐谁能躲。\n悠悠岁月且心欢，\n尽情携酒山前卧。 ​​​", "date": "2021.02.02", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4600073046987578 - 踏莎行    寄同窗/01.jpg"]}, {"id": "4600435798969294", "title": "七绝·立春二首", "genre": "七绝", "body": "一.\n梅动诗情雪喜人，\n琼花玉蕊俏迎春。\n多愁子鼠含悲去，\n憨态丑牛诚可亲。\n二.\n神州山海映朝晖，\n情满人间燕子归。\n细语声声勤问候，\n唤来紫气染芳菲。 ​​​", "date": "2021.02.03", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4600435798969294 - 七绝   立春二首/01.jpg", "冰雪诗词_全部图片/4600435798969294 - 七绝   立春二首/02.jpg", "冰雪诗词_全部图片/4600435798969294 - 七绝   立春二首/03.jpg"]}, {"id": "4600798912457141", "title": "七绝·晓吟", "genre": "七绝", "body": "旗舞红灯入小年，\n肉香飘溢院堂间。\n殷勤洒扫污尘尽，\n情系新春丽日妍。 ​​​", "date": "2021.02.04", "themes": ["四时风光与节气流转", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4600798912457141 - 七绝           晓吟/01.jpg"]}, {"id": "4601157404073417", "title": "七律·闻事有感", "genre": "七律", "body": "人心膨胀忘初衷，\n方向迷离醉眼红。\n不惧天高偏欲往，\n却从虎口拟偷生。\n蓬随风起终将落，\n絮入川流了作萍。\n骤响惊雷魂胆破，\n黄粱一梦事无成。 ​​​", "date": "2021.02.05", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4601157404073417 - 七律    闻事有感/01.jpg"]}, {"id": "4601519670301918", "title": "踏莎行·亮剑", "genre": "踏莎行", "body": "拔地飞星，\n御天长剑。\n夜空惊破弧光艳。\n神州万里网恢恢，\n八方贼寇谁能犯。\n隐姓埋名，\n爬坡过坎。\n荒凉戈壁英雄胆。\n几多赤子写辉煌，\n苍茫宇宙风云撼。#中国诗词大会[超话]##中华好诗词# ​​​", "date": "2021.02.06", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4601519670301918 - 踏莎行        亮剑/01.jpg", "冰雪诗词_全部图片/4601519670301918 - 踏莎行        亮剑/02.jpg", "冰雪诗词_全部图片/4601519670301918 - 踏莎行        亮剑/03.jpg", "冰雪诗词_全部图片/4601519670301918 - 踏莎行        亮剑/04.jpg"]}, {"id": "4601882007834631", "title": "浣溪沙·吟望", "genre": "浣溪沙", "body": "春色先从草际归，\n随风泛绿弄朝晖。\n纵横阡陌尽芳菲。\n物态山光精气满，\n心怀胸次喜盈眉。\n金牛奋舞燕莺飞。 ​​​", "date": "2021.02.07", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4601882007834631 - 浣溪沙        吟望/01.jpg", "冰雪诗词_全部图片/4601882007834631 - 浣溪沙        吟望/02.jpg"]}, {"id": "4602249593229916", "title": "采桑子·望梅闲吟", "genre": "采桑子", "body": "年华已伴梅花晚，\n南北西东，\n晓暮匆匆。\n无悔今生笔墨浓。\n翩翩少子霜侵鬓，\n明月清风，\n天际无穷。\n淡事闲思不老松。 ​​​", "date": "2021.02.08", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4602249593229916 - 采桑子 望梅闲吟/01.jpg", "冰雪诗词_全部图片/4602249593229916 - 采桑子 望梅闲吟/02.jpg", "冰雪诗词_全部图片/4602249593229916 - 采桑子 望梅闲吟/03.jpg"]}, {"id": "4602609128707623", "title": "浣溪沙·乡愁", "genre": "浣溪沙", "body": "迎面不寒六九风，\n轻微摇荡满街红。\n路人来往更匆匆。\n已是年关归欲甚，\n难离京洛绪思浓。\n且依樽酒掩乡情。 ​​​", "date": "2021.02.09", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4602609128707623 - 浣溪沙        乡愁/01.jpg", "冰雪诗词_全部图片/4602609128707623 - 浣溪沙        乡愁/02.jpg", "冰雪诗词_全部图片/4602609128707623 - 浣溪沙        乡愁/03.jpg"]}, {"id": "4602968551460348", "title": "七律·夜望", "genre": "七律", "body": "一江明月送流年，\n辛丑春风近眼前。\n瑞雪纷纷庭院落，\n梅花袅袅映窗轩。\n芳茗数盏思家事，\n挚友三人盼世安。\n炉火红情深意暖，\n酒香淡夜色将阑。 ​​​", "date": "2021.02.10", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4602968551460348 - 七律            夜望/01.jpg", "冰雪诗词_全部图片/4602968551460348 - 七律            夜望/02.jpg"]}, {"id": "4603334033939395", "title": "踏莎行·除夕愿", "genre": "踏莎行", "body": "福禄心期，\n安康人盼。\n红灯劲舞春光灿。\n离乡游子欲团圆，\n阖家相聚情无限。\n玉鼠回归，\n金牛又见。\n神州草树祥和漫。\n万民携手力无穷，\n千年华夏山河换。 ​​​", "date": "2021.02.11", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4603334033939395 - 祝朋友们阖家欢乐！/01.jpg", "冰雪诗词_全部图片/4603334033939395 - 祝朋友们阖家欢乐！/02.jpg", "冰雪诗词_全部图片/4603334033939395 - 祝朋友们阖家欢乐！/03.jpg"]}, {"id": "4603464552038147", "title": "点绛唇·思念", "genre": "点绛唇", "body": "别样三十，\n远离二老心头苦。\n望乡凝伫，\n故里封门户。\n防疫当前，\n即便亲难助。\n心飞渡，\n隔空遥祝，\n牛载千福禄。 ​​​", "date": "2021.02.11", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4603464552038147 - 点绛唇        思念/01.jpg"]}, {"id": "4603701614349629", "title": "踏莎行·辛丑贺岁", "genre": "踏莎行", "body": "转眼新年，\n回头旧岁。\n东风荡漾春湖水。\n金牛开拓力无穷，\n踏枝喜鹊声声翠。\n江海欢腾，\n山川秀美。\n人逢盛世心无悔。\n阖家团聚挽金樽，\n红灯照暖同陶醉。 ​​​", "date": "2021.02.12", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4603701614349629 - 踏莎行 辛丑贺岁/01.jpg", "冰雪诗词_全部图片/4603701614349629 - 踏莎行 辛丑贺岁/02.jpg"]}, {"id": "4604064275106364", "title": "清平乐·新年乐", "genre": "清平乐", "body": "亲家相聚，\n漫诉心头语。\n共捧娇孙乖巧女，\n春暖馨家欢趣。\n真情玉液盈杯，\n香茗珍果轮回。\n美味佳肴丰盛，\n归来醉眼星辉。 ​​​", "date": "2021.02.13", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4604064275106364 - 清平乐     新年乐/01.jpg"]}, {"id": "4604423458524392", "title": "踏莎行·新春乐", "genre": "踏莎行", "body": "牛气冲天，\n福辉映砌。\n门庭街巷盈春意。\n郊原细草望青青，\n山河风暖云空丽。\n燕舞鹰翔，\n马欢人喜。\n亲朋挚友情无比。\n重逢故里笑频频，\n搓麻斗酒谈天地。 ​​​", "date": "2021.02.14", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4604423458524392 - 踏莎行      新春乐/01.jpg", "冰雪诗词_全部图片/4604423458524392 - 踏莎行      新春乐/02.jpg", "冰雪诗词_全部图片/4604423458524392 - 踏莎行      新春乐/03.jpg"]}, {"id": "4604781462815642", "title": "减字木兰花·春夜吟", "genre": "减字木兰花", "body": "红灯暖照，篱处梅香枝影俏。\n夜色斑斓，庭院飞光玉树间。\n芳邻闲聚，小径清幽言有趣。\n畅想牛年，何处栖身稳赚钱？ ​​​", "date": "2021.02.15", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4604781462815642 - 减字木兰花         春夜吟/01.jpg", "冰雪诗词_全部图片/4604781462815642 - 减字木兰花         春夜吟/02.jpg", "冰雪诗词_全部图片/4604781462815642 - 减字木兰花         春夜吟/03.jpg"]}, {"id": "4605153203717999", "title": "七绝·初五寄怀", "genre": "七绝", "body": "一.\n破五心期破疫情，\n火光阵阵炮声鸣。\n妖魔鬼怪随烟去，\n还我神州万里晴。\n二.\n拂晓送穷门敞开，\n清街净院纳鸿财。\n九天神圣循常道，\n凭借前缘进户来。 ​​​", "date": "2021.02.16", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4605153203717999 - 七绝    初五寄怀/01.jpg"]}, {"id": "4605507668542109", "title": "踏莎行·依依不舍", "genre": "踏莎行", "body": "把酒重逢，\n含情别去。\n匆匆故里家团聚。\n感恩父母意情长，\n寄怀乡土萦思绪。\n无限心言，\n尽穷词句。\n来生愿作乖儿女。\n庭前月下望星空，\n踏阶携手同风雨。 ​​​", "date": "2021.02.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4605507668542109 - 踏莎行 依依不舍/01.jpg", "冰雪诗词_全部图片/4605507668542109 - 踏莎行 依依不舍/02.jpg", "冰雪诗词_全部图片/4605507668542109 - 踏莎行 依依不舍/03.jpg", "冰雪诗词_全部图片/4605507668542109 - 踏莎行 依依不舍/04.jpg"]}, {"id": "4605868916086567", "title": "相见欢·时令有感", "genre": "相见欢", "body": "悠悠雨水侵春，\n气清芬，\n草木芳香鸟哢、暖风薰。\n千百味，\n谁不醉，\n恁销魂。\n蝶舞鹰翔天地、抖精神。 ​​​", "date": "2021.02.18", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4605868916086567 - 相见欢            时令有感/01.jpg", "冰雪诗词_全部图片/4605868916086567 - 相见欢            时令有感/02.jpg", "冰雪诗词_全部图片/4605868916086567 - 相见欢            时令有感/03.jpg"]}, {"id": "4606232969350000", "title": "七律·新春寄若煊", "genre": "七律", "body": "一月有余称两岁，\n千金宝贝与时新。\n呀呀欲语摇头晃，\n款款含情俏喜人。\n沉稳宵眠哭闹少，\n舒心昼耍自凝神。\n每逢戏水长欢乐，\n最是怀中各销魂。 ​​​", "date": "2021.02.19", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4606232969350000 - 七律 新春寄若煊/01.jpg"]}, {"id": "4606598540429486", "title": "画堂春·初春晓望", "genre": "画堂春", "body": "东风夜雨动林池，\n霁光穿树参差。\n水边燕舞翠莺啼，\n细叶轻枝。\n路上车流如水，\n行人步快奔驰。\n街园芳草欲萋萋，\n一派生机。 ​​​", "date": "2021.02.20", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4606598540429486 - 画堂春 初春晓望/01.jpg", "冰雪诗词_全部图片/4606598540429486 - 画堂春 初春晓望/02.jpg", "冰雪诗词_全部图片/4606598540429486 - 画堂春 初春晓望/03.jpg"]}, {"id": "4606958751188965", "title": "踏莎行·致敬英雄", "genre": "踏莎行", "body": "血肉之躯，\n军魂如铁。\n戍边对阵寒风烈。\n英雄气概壮山河，\n空拳赤手迎钩钺。\n气贯长虹，\n刀削残雪。\n铮铮豪骨蛮人灭。\n丰碑矗立熠星辉，\n威名激荡神州彻。 ​​​", "date": "2021.02.21", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4606958751188965 - 踏莎行 致敬英雄/01.jpg", "冰雪诗词_全部图片/4606958751188965 - 踏莎行 致敬英雄/02.jpg", "冰雪诗词_全部图片/4606958751188965 - 踏莎行 致敬英雄/03.jpg", "冰雪诗词_全部图片/4606958751188965 - 踏莎行 致敬英雄/04.jpg", "冰雪诗词_全部图片/4606958751188965 - 踏莎行 致敬英雄/05.jpg", "冰雪诗词_全部图片/4606958751188965 - 踏莎行 致敬英雄/06.jpg"]}, {"id": "4607319193162696", "title": "蝶恋花·闻讯而喜", "genre": "蝶恋花", "body": "门户解封枝鹊喜，\n树杪轻盈，\n欢语飘阶砌。\n多少节前年后事，\n今朝渐渐除心际。\n先自京城回故里，\n二老床前，\n叩首香茶递。\n旧友亲朋扶酒觯，\n大江南北开怀议。 ​​​", "date": "2021.02.22", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4607319193162696 - 蝶恋花 闻讯而喜/01.jpg"]}, {"id": "4607683439628353", "title": "七律·千古豪气", "genre": "七律", "body": "精气神情一脉承，\n秦兵汉将似骄龙。\n赤心铁胆驱豺豹，\n利剑长缨斗虎熊。\n雪域高原旌旆烈，\n昆仑山谷马嘶鸣。\n男儿自古凌云志，\n威震边关万里雄。 ​​​", "date": "2021.02.23", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4607683439628353 - 七律    千古豪气/01.jpg", "冰雪诗词_全部图片/4607683439628353 - 七律    千古豪气/02.jpg"]}, {"id": "4608051539351107", "title": "鹧鸪天·和洛水伊人", "genre": "鹧鸪天", "body": "华夏牛年一缕光，云霞万里映檐廊。开心笔就朱砂砚，惬意浆盈紫玉觞。\n临画扇，望梅窗，凭栏诗赋颂尧唐。舒膺昂首豪情展，傲雪琼花淡淡香。\n附：洛水伊人原玉\n鹧鸪天.贺新春\n雪藻春风沐旭光，兰襟新岁贺轩廊。瑶琴辞赋梅花砚，阙月传歌桂子觞。\n画帏扇，韵诗窗。又承词曲响华唐。且看鹏凤青云展，独领风骚四季香。", "date": "2021.02.24", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4608051539351107 - 鹧鸪天 和洛水伊人/01.jpg"]}, {"id": "4608407502324689", "title": "七律·初春无奈", "genre": "七律", "body": "云暖风薰似夏天，\n棉衣褪却露香肩。\n街头靓女纱裙短，\n庭院型男半袖衫。\n忽至寒宵冰阻路，\n奈何老幼苦难堪。\n上苍不解人心意，\n如此折腾为那般？ ​​​", "date": "2021.02.25", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4608407502324689 - 七律    初春无奈/01.jpg", "冰雪诗词_全部图片/4608407502324689 - 七律    初春无奈/02.jpg"]}, {"id": "4608768644484022", "title": "浣溪沙·元宵乐", "genre": "浣溪沙", "body": "漫煮汤圆细浪翻，\n清香水气润心田。\n滑绵入口蜜连环。\n春日云霞盈洞户，\n楼台花色映窗轩。\n怀中娇女喜空前。 ​​​", "date": "2021.02.26", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4608768644484022 - 浣溪沙     元宵乐/01.jpg"]}, {"id": "4609132445043789", "title": "蝶恋花·元宵感怀", "genre": "蝶恋花", "body": "犹记当年元夜闹，\n火树银花、似水人流笑。\n十里长街龙马俏，\n烟辉月影灯谜妙。\n今夜街头情趣少，\n网聚心怀、男女银屏泡。\n却是嫦娥宫里恼，\n蟾光难道非常好？ ​​​", "date": "2021.02.27", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "感怀人生与自省述志", "怀古咏史与读文有感", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4609132445043789 - 蝶恋花 元宵感怀/01.jpg", "冰雪诗词_全部图片/4609132445043789 - 蝶恋花 元宵感怀/02.jpg"]}, {"id": "4609494006891641", "title": "七绝·吟望", "genre": "七绝", "body": "元宵翌晚月明圆，\n年味于今散远天。\n收敛情怀当鼓劲，\n且凭牛气好耕田。 ​​​", "date": "2021.02.28", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4609494006891641 - 七绝           吟望/01.jpg", "冰雪诗词_全部图片/4609494006891641 - 七绝           吟望/02.jpg"]}, {"id": "4609862636143470", "title": "七绝·乖孙", "genre": "七绝", "body": "俩月娇儿知晓暮，\n白天玩睡两分明。\n每当入夜安眠后，\n一觉通宵少闹声。 ​​​", "date": "2021.03.01", "themes": ["亲情友情与人间至爱"], "images": ["冰雪诗词_全部图片/4609862636143470 - 七绝            乖孙/01.jpg", "冰雪诗词_全部图片/4609862636143470 - 七绝            乖孙/02.jpg", "冰雪诗词_全部图片/4609862636143470 - 七绝            乖孙/03.jpg"]}, {"id": "4610218762438606", "title": "鹧鸪天·敬戍边将士", "genre": "鹧鸪天", "body": "塞北山南守界关，\n常年寂寞对云天。\n夏阳蒸烤皮开裂，\n冬日寒潮骨缝钻。\n穿雪岭，踏冰川。\n饮风餐露伴星眠。\n豺狼虎豹浑无惧，\n屹立边陲万户安。 ​​​", "date": "2021.03.02", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4610218762438606 - 鹧鸪天 敬戍边将士/01.jpg", "冰雪诗词_全部图片/4610218762438606 - 鹧鸪天 敬戍边将士/02.jpg", "冰雪诗词_全部图片/4610218762438606 - 鹧鸪天 敬戍边将士/03.jpg", "冰雪诗词_全部图片/4610218762438606 - 鹧鸪天 敬戍边将士/04.jpg"]}, {"id": "4610586304843081", "title": "七绝·初春寄语", "genre": "七绝", "body": "一过元宵渐客稠，\n多来京洛觅金牛。\n满怀憧憬须发奋，\n莫使雄心付水流。 ​​​", "date": "2021.03.03", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4610586304843081 - 七绝    初春寄语/01.jpg"]}, {"id": "4610953083355241", "title": "临江仙·学区叹", "genre": "临江仙", "body": "为使娇娃学业好，\n潜心谋划前期。\n西城海淀几番思。\n算来七载后，\n今日抢先机。\n一套旧房八百万，\n厅堂残破窗低。\n空间窄小苦难栖。\n紧身俯首过，\n渺望凤凰枝。 ​​​", "date": "2021.03.04", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4610953083355241 - 临江仙    学区叹/01.jpg", "冰雪诗词_全部图片/4610953083355241 - 临江仙    学区叹/02.jpg"]}, {"id": "4611310644364105", "title": "五律·惊蛰", "genre": "五律", "body": "雷震地虫惊，\n阳和草木青。\n芳晨盈玉露，\n昏暮荡清风。\n万物萌欣态，\n千家竞世生。\n花芽娇欲放，\n翠鸟戏枝鸣。 ​​​", "date": "2021.03.05", "themes": ["四时风光与节气流转", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4611310644364105 - 五律     惊蛰/01.jpg"]}, {"id": "4611675154810855", "title": "减字木兰花·春晓即事", "genre": "减字木兰花", "body": "凭栏浅笑，燕语莺声枝上闹。\n楼院春辉，天上归鸿振翅飞。\n忽闻妻叫，却是娇孙沾屎尿。\n一阵匆忙，又见婴眉稚脸祥。 ​​​", "date": "2021.03.06", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4611675154810855 - 减字木兰花 春晓即事/01.jpg"]}, {"id": "4612033800571506", "title": "采桑子·探春", "genre": "采桑子", "body": "东风漫野传春信，\n陌上花开，\n燕子归来。\n池水清波映绿苔。\n城人假日寻芳去，\n溪径徘徊，\n喜煞童孩。\n逸兴闲情趣满怀。 ​​​", "date": "2021.03.07", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4612033800571506 - 采桑子        探春/01.jpg"]}, {"id": "4612413577760206", "title": "蝶恋花·三八赠妻", "genre": "蝶恋花", "body": "半世辛劳霜染鬓，\n长是无闲、内外心操尽。\n教子相夫齐奋进，\n尊亲厚友赢嘉论。\n时下看孙终日紧，\n伤累难休、情似春晖润。\n烧菜逗娃行谨慎，\n倾心老少家和顺。 ​​​", "date": "2021.03.08", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4612413577760206 - 蝶恋花  三八赠妻/01.jpg"]}, {"id": "4612756952844549", "title": "钗头凤·敬陈薇院士", "genre": "钗头凤", "body": "兰溪女。从军旅。聚情防疫心无惧。迎非典。赴江汉。病毒攻克，疫苗如愿。干！干！干！\n经风雨。名寰宇。俏将军重行轻誉。凡参战。影辉炫。沉着坚毅，奋而夺冠。赞！赞！赞！ ​​​", "date": "2021.03.09", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4612756952844549 - 钗头凤     敬陈薇院士/01.jpg"]}, {"id": "4613118120692316", "title": "七律·两会有寄", "genre": "七律", "body": "春风三月聚英豪，\n国士良谋妙计高。\n实策安邦兴百姓，\n诤言固土绿江涛。\n倾听民意渠通畅，\n擘画宏图运伟韬。\n圆梦中华千载愿，\n巨龙腾起碧空翱。 ​​​", "date": "2021.03.10", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4613118120692316 - 七律    两会有寄/01.jpg", "冰雪诗词_全部图片/4613118120692316 - 七律    两会有寄/02.jpg"]}, {"id": "4613480424408000", "title": "南乡子·轮回", "genre": "南乡子", "body": "年少入京城，\n寻道求知学苑行。\n事就毅然回故里，\n心宁，\n为报双亲养育情。\n儿又入皇京，\n立志凭身业半成。\n雪鬓帝都孙女伴，\n娇声，\n花甲之年似梦生。 ​​​", "date": "2021.03.11", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4613480424408000 - 南乡子        轮回/01.jpg"]}, {"id": "4613842815945974", "title": "清平乐·友文读感", "genre": "清平乐", "body": "读书益智，\n儒雅兼豪气。\n八裔古今收眼底，\n俯首纵横天际。\n胸盈日月情怀，\n心游峻岭瀛台。\n风雨凭栏眺望，\n静观花落花开。 ​​​", "date": "2021.03.12", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4613842815945974 - 清平乐 友文读感/01.jpg"]}, {"id": "4614205782885450", "title": "七绝·春日暮吟", "genre": "七绝", "body": "近日忙来乐趣多，\n今朝将去奈愁何。\n别离娇小正安睡，\n醒后可知爷过河？ ​​​", "date": "2021.03.13", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4614205782885450 - 七绝    春日暮吟/01.jpg"]}, {"id": "4614568875917361", "title": "木兰花令·石门吟", "genre": "木兰花令", "body": "帝里归来天欲暮，\n飞速动车春满路。\n观柳陌，望游人，\n漫野萋萋花映树。\n冉冉夕辉山隐日，\n夜色降临空寂寂。\n孤灯独对与谁言，\n幸有梦中孙女忆。 ​​​", "date": "2021.03.14", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4614568875917361 - 木兰花令 石门吟/01.jpg"]}, {"id": "4614932932595524", "title": "踏莎行·春望", "genre": "踏莎行", "body": "风动花枝，\n春归草地。\n人情物态欣欣意。\n陌阡垂柳染鹅黄，\n纵横车马穿街市。\n抖擞精神，\n聚盈牛气。\n南来北往浮生事。\n寻机拓业百般忙，\n辛劳无悔为家计。 ​​​", "date": "2021.03.15", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4614932932595524 - 踏莎行        春望/01.jpg"]}, {"id": "4615294913613564", "title": "浪淘沙·突变", "genre": "浪淘沙", "body": "塞外卷黄风，\n沙落京城。\n灰头土脸昼如冥。\n阡陌纵横芳草苦，\n枝叶飞横。\n树杪鸟儿惊，\n振翅悲鸣。\n大街小巷路难行。\n嫩蕊鲜花皆暗色，\n扰乱春情。 ​​​", "date": "2021.03.16", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4615294913613564 - 浪淘沙        突变/01.jpg", "冰雪诗词_全部图片/4615294913613564 - 浪淘沙        突变/02.jpg"]}, {"id": "4615658437869849", "title": "清平乐·湖园春色", "genre": "清平乐", "body": "枝芽竞翠，\n花惹游人醉。\n碧水清波鸳几对，\n别有一番情味。\n宜人三月春晖，\n轻寒浅暖芳菲。\n细柳缠绵丝雨，\n漫空蝶舞莺飞。 ​​​", "date": "2021.03.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4615658437869849 - 清平乐 湖园春色/01.jpg"]}, {"id": "4616017113781310", "title": "五律·春雨", "genre": "五律", "body": "丝雨入芳庭，\n草青花色浓。\n云空霾雾去，\n阶砌燕莺鸣。\n香气侵人面，\n软风盈袖中。\n一年春晓好，\n却是最匆匆。 ​​​", "date": "2021.03.18", "themes": ["山水田园与闲居雅趣", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4616017113781310 - 五律     春雨/01.jpg"]}, {"id": "4616378831864821", "title": "菩萨蛮·疫后归来", "genre": "菩萨蛮", "body": "儿归二老情怀奋，\n楼台锅灶飞欢韵。\n苍鬓脑神清，\n出门脚步轻。\n当时防疫紧，\n闭户心愁闷。\n不见远方人，\n犹如少了魂。 ​​​", "date": "2021.03.19", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4616378831864821 - 菩萨蛮 疫后归来/01.jpg"]}, {"id": "4616742527567046", "title": "如梦令·春分", "genre": "如梦令", "body": "昼夜均分和煦，\n柳绿桃红花雨。\n迎面吻春风，\n喜见鸟飞人趣。\n谁语 ，\n谁语，\n林下闹童欢聚。\n七绝        春分吟\n千红万紫映芳春，\n无限风光昼夜分。\n放眼青山莺燕喜，\n回眸绿水醉佳人。 ​​​", "date": "2021.03.20", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4616742527567046 - 如梦令    春分/01.jpg"]}, {"id": "4617105972660096", "title": "清平乐·扬眉", "genre": "清平乐", "body": "昔今对比，\n慨叹抒豪气。\n情景犹如天与地。\n峰岭川流欢涕。\n神州万里逢春，\n东风漫卷缤纷。\n碧海长空清丽，\n向阳草木欣欣。\n七绝            龙腾\n舌剑唇枪眼射光，\n巨龙腾起渺西方。\n云霄万里千年翥，\n归隐九州今又翔。 ​​​", "date": "2021.03.21", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4617105972660096 - 清平乐        扬眉/01.jpg"]}, {"id": "4617467261096592", "title": "清平乐·春煦", "genre": "清平乐", "body": "经年又聚，\n推盏心怀叙。\n家稳国强鹏正举，\n觯满醇香尽趣。\n新冠虽狠难逃，\n西方无奈飘摇。\n中美双雄对峙，\n风轻云淡天朝。 ​​​", "date": "2021.03.22", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4617467261096592 - 清平乐        春煦/01.jpg"]}, {"id": "4617830835948192", "title": "菩萨蛮·偶感", "genre": "菩萨蛮", "body": "春天冷暖无人料，\n晴空隔日寒风闹。\n老少苦难堪，\n病伤再又三。\n幸亏儿或女，\n前后轻声语。\n不惧累和烦，\n亲情日复年。 ​​​", "date": "2021.03.23", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4617830835948192 - 菩萨蛮        偶感/01.jpg"]}, {"id": "4618192028959068", "title": "蝶恋花·老少视频", "genre": "蝶恋花", "body": "千里亲情屏上见，\n仨月乖孙，\n喜把爷爷辩。\n笑靥欢眉红粉面，\n双眸炯炯机灵现。\n血脉相连思不断，\n别后长宵，\n梦里频相看。\n惟愿娇娃心体健，\n犹如花蕾迎春绽。 ​​​", "date": "2021.03.24", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4618192028959068 - 蝶恋花 老少视频/01.jpg", "冰雪诗词_全部图片/4618192028959068 - 蝶恋花 老少视频/02.jpg"]}, {"id": "4618554676610834", "title": "七绝·东西对决", "genre": "七绝", "body": "欺人之道返其身，\n怒怼西洋假圣人。\n傲慢谎言天下怨，\n龙声击碎鬼蛇魂。 ​​​", "date": "2021.03.25", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4618554676610834 - 七绝    东西对决/01.jpg"]}, {"id": "4618916905092640", "title": "菩萨蛮·春日暮行", "genre": "菩萨蛮", "body": "黄昏伫望花枝满，\n徐行芳苑春风暖。\n柳翠映桃红，\n笛音透碧空。\n孩童欢戏水，\n翁媪心陶醉。\n无虑释情怀，\n明朝许再来。 ​​​", "date": "2021.03.26", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4618916905092640 - 菩萨蛮 春日暮行/01.jpg"]}, {"id": "4619280858218597", "title": "七绝·谁之过", "genre": "七绝", "body": "烦事攻心行必乱，\n再三跌倒凭谁怨。\n黑衣老大困舷梯，\n许是苍天传意念！ ​​​", "date": "2021.03.27", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4619280858218597 - 七绝       谁之过/01.jpg"]}, {"id": "4619641878741455", "title": "定风波·今非昔比", "genre": "定风波", "body": "白净棉花于世间，\n不曾招惹鬼蛇仙。\n却被无端空问罪，\n无畏！\n怒烧烈火映长天。\n无事生非成恶性，\n毛病！\n今朝被刺痛心肝。\n还欲当年行霸道，\n胡闹！\n神州山海异从前！ ​​​", "date": "2021.03.28", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4619641878741455 - 定风波 今非昔比/01.jpg"]}, {"id": "4620002806204983", "title": "南乡子·春湖", "genre": "南乡子", "body": "又是一年春，\n盈眼芳菲万象新。\n防疫解封心底奋，\n邀人，\n漫步踏青湖水滨。\n花树绿芳茵，\n燕鹭凌空鸟哢频。\n荡漾木舟鱼跃起，\n缤纷，\n碧浪船头笑语闻。 ​​​", "date": "2021.03.29", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4620002806204983 - 南乡子        春湖/01.jpg"]}, {"id": "4620376087201084", "title": "七古·赠若煊百日", "genre": "七古", "body": "若云似雾弄春妍，\n煊烂芳菲映远天。\n百鸟齐鸣争翠柳，\n日光馨暖洒人间。\n万里长空鹰燕翥，\n事随人愿自甘甜。\n如今娇女身心健，\n意绪长欢舞蹁跹。\n清平乐 寄语若煊\n乖孙百日，\n千里祥福寄。\n多想周身萦稚气，\n背上娇声轻泣。\n先前无奈分开，\n而今愁事难排。\n一旦急情着落，\n转头宝贝拥怀。", "date": "2021.03.30", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4620376087201084 - 七古 赠若煊百日/01.jpg"]}, {"id": "4620749744639047", "title": "山花子·春祭", "genre": "山花子", "body": "临近清明袅纸烟，\n亲人祭祖忆从前。\n恩重情深难忘却，\n泪涟涟。\n昔日家贫多苦难，\n今朝国盛少忧烦。\n告慰先贤魂与魄，\n且长安。 ​​​", "date": "2021.03.31", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4620749744639047 - 山花子        春祭/01.jpg"]}, {"id": "4621091400059516", "title": "采桑子·友文读感", "genre": "采桑子", "body": "老来忆起当年事，\n思绪蹁跹，\n犹似昨天，\n人物清晰在眼前。\n曾经苦乐终难忘，\n风雨人间，\n吹皱心田，\n岁月无声年复年。 ​​​", "date": "2021.04.01", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4621091400059516 - 采桑子 友文读感/01.jpg"]}, {"id": "4621452198544648", "title": "西江月·侍老感怀", "genre": "西江月", "body": "楼外春风荡水，\n窗前愁绪凝颜。\n老人伤痛近身前。\n耋耄微躯堪叹。\n珍重青春年少，\n养存血脉芳颜。\n百年岁月且悠闲。\n雨霁晚霞为盼。 ​​​", "date": "2021.04.02", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4621452198544648 - 西江月 侍老感怀/01.jpg"]}, {"id": "4621817506169211", "title": "长相思·老人愿", "genre": "长相思", "body": "愁一宵，\n苦一宵。\n老病萦身日夜熬。\n心期妙手消。\n深一刀，\n浅一刀。\n济世仁心各有招。\n白衣医术高。 ​​​", "date": "2021.04.03", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4621817506169211 - 长相思    老人愿/01.jpg"]}, {"id": "4622177174814756", "title": "七绝·清明感怀", "genre": "七绝", "body": "今朝日子火红红，\n祭祖青烟滚滚浓。\n昔往饮风餐露叶，\n万千坟上冷清清。 ​​​", "date": "2021.04.04", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4622177174814756 - 七绝    清明感怀/01.jpg"]}, {"id": "4622548391955253", "title": "定风波·赞友家风", "genre": "定风波", "body": "父母传家重品行，\n细微之处见真情。\n针线穿梭铺锦绣，\n合奏。\n齐家携手愿终成。\n邻里不争瓜果事，\n和气。\n刚柔爱恨两分明。\n二老言行恩后辈，\n受惠。\n春风和煦享安平。 ​​​", "date": "2021.04.05", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4622548391955253 - 定风波 赞友家风/01.jpg"]}, {"id": "4622903008563538", "title": "朝中措·春夜吟", "genre": "朝中措", "body": "春光无奈骤晴阴，\n乍暖又寒心。\n檐下凭栏听雨，\n夜来苦煞双亲。\n陈年旧病，\n悄然发作，\n阵痛时侵。\n辗转愁思难睡，\n遥天残月西沉。 ​​​", "date": "2021.04.06", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4622903008563538 - 朝中措    春夜吟/01.jpg"]}, {"id": "4623264393988417", "title": "踏莎行·神州寄怀", "genre": "踏莎行", "body": "世界风云，\n东西较量。\n巨龙腾起掀波浪。\n豺狼虎豹恁心虚，\n贼眉斜眼呲牙向。\n江海涛涛，\n胸怀荡荡。\n卧薪尝胆终相望。\n一朝精气满回归，\n神兵恰似从天降。 ​​​", "date": "2021.04.07", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4623264393988417 - 踏莎行 神州寄怀/01.jpg", "冰雪诗词_全部图片/4623264393988417 - 踏莎行 神州寄怀/02.jpg", "冰雪诗词_全部图片/4623264393988417 - 踏莎行 神州寄怀/03.jpg"]}, {"id": "4623627183459314", "title": "清平乐·娇儿识画", "genre": "清平乐", "body": "有模有样，\n书本身前放。\n仨月小儿昂首望，\n双目凝神半晌。\n图文好似心明，\n不时娇态欢萌。\n如此这般长久，\n何须父母多情。 ​​​", "date": "2021.04.08", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4623627183459314 - 清平乐  娇儿识画/01.jpg"]}, {"id": "4623990222490435", "title": "万里春·芳园", "genre": "万里春", "body": "桃红柳翠，\n浸漫芳香滋味。\n草青青、碧水潺潺，\n鸟音枝上碎。\n嫩叶摇鲜蕊，\n入青眼、态娇容媚。\n且春光、细软无声，\n悄然心陶醉。 ​​​", "date": "2021.04.09", "themes": ["山水田园与闲居雅趣", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4623990222490435 - 万里春            芳园/01.jpg"]}, {"id": "4624352315706807", "title": "七绝·春日闲吟", "genre": "七绝", "body": "巧言域外月明圆，\n却是仇怀看眼前。\n日有阴晴天下事，\n劝君切记莫心偏。 ​​​", "date": "2021.04.10", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4624352315706807 - 七绝    春日闲吟/01.jpg"]}, {"id": "4624712220541363", "title": "占春芳·假日游园", "genre": "占春芳", "body": "纤柳翠，\n繁花艳，\n满眼尽春芳。\n碧水红桃相映，\n小园遍处飘香。\n惬意自徜徉。\n且凭栏、安享天光。\n听闻莺燕枝头啭，\n心绪飞扬。 ​​​", "date": "2021.04.11", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4624712220541363 - 占春芳    假日游园/01.jpg"]}, {"id": "4625076904004701", "title": "清平乐·赠学弟", "genre": "清平乐", "body": "多年未见，\n怎肯金樽浅。\n昔日同窗情意远，\n晨练曦光浮现。\n高低相差一年，\n仿佛就在跟前。\n别后今朝握手，\n谁怜鬓发苍颜。 ​​​", "date": "2021.04.12", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4625076904004701 - 清平乐     赠学弟/01.jpg"]}, {"id": "4625439782341907", "title": "五律·春晓", "genre": "五律", "body": "光熠花枝碎，\n风轻景色明。\n万丝垂翠柳，\n一片晕红樱。\n晨练桃扇舞，\n闲聊笑语萦。\n莺飞云漫卷，\n遍处喜盈盈。 ​​​", "date": "2021.04.13", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4625439782341907 - 五律    春晓/01.jpg"]}, {"id": "4625801904915902", "title": "太常引·春暖乡村", "genre": "太常引", "body": "小村遍地起层楼，\n彩瓦卧檐头。\n宝马弄堂留。\n夜如昼，声光岂休。\n街平路阔，\n欢颜老少，\n自是远烦忧。\n昔往梦中求，\n到今日，家家不愁。 ​​​", "date": "2021.04.14", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4625801904915902 - 太常引    春暖乡村/01.jpg"]}, {"id": "4626166473818562", "title": "七律·赠友", "genre": "七律", "body": "心中营地胜江南，\n锦瑟年华映远山。\n稚脸戎装凝血气，\n深秋霞色舞云天。\n胸怀梦想书灯亮，\n脚踏风沙日月还。\n八载枕戈寒暑度，\n一川烟雨润心田。 ​​​", "date": "2021.04.15", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4626166473818562 - 七律            赠友/01.jpg"]}, {"id": "4626525367829393", "title": "画堂春·敬二老", "genre": "画堂春", "body": "耄耋携手度余生，\n银丝斑鬓多情。\n对方寒暖记怀中，\n日夜心同。\n一起浇花弄草，\n芳馨小院安宁。\n晓来无虑沐春风，\n日晚霞红。 ​​​", "date": "2021.04.16", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4626525367829393 - 画堂春    敬二老/01.jpg"]}, {"id": "4626888808466174", "title": "朝中措·闻讯惊叹", "genre": "朝中措", "body": "春宵灯下酒微酲，\n独自对银屏。\n偶览环球时政，\n惊闻废水排空。\n茫茫大海，\n倭人核料，\n缓慢长行。\n此后海鲜渔货，\n任谁还敢多情。 ​​​", "date": "2021.04.17", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4626888808466174 - 朝中措 闻讯惊叹/01.jpg", "冰雪诗词_全部图片/4626888808466174 - 朝中措 闻讯惊叹/02.jpg"]}, {"id": "4627249700012592", "title": "七绝·无垠", "genre": "七绝", "body": "路到远方天为界，\n茫茫人海漫无疆。\n尘心寥廓乾坤大，\n坦荡胸怀日月藏。 ​​​", "date": "2021.04.18", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4627249700012592 - 七绝            无垠/01.jpg", "冰雪诗词_全部图片/4627249700012592 - 七绝            无垠/02.jpg"]}, {"id": "4627614024599007", "title": "太常引·夜练有感", "genre": "太常引", "body": "春宵夜色映红灯，\n月下踏街行。\n迎面树含情。\n气清爽，心神自明。\n寻常健体，\n长年不断，\n迈步越来轻。\n若为老安宁，\n勤动腿，风霜莫停。 ​​​", "date": "2021.04.19", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4627614024599007 - 太常引    夜练有感/01.jpg", "冰雪诗词_全部图片/4627614024599007 - 太常引    夜练有感/02.jpg"]}, {"id": "4627978119547087", "title": "踏莎行·车祸甚虎", "genre": "踏莎行", "body": "滚滚车流，\n茫茫尘世。\n瞬间多少魂飞逝。\n铁轮不驻向前奔，\n千家万户伤元气。\n子痛妻悲，\n哭天恸地。\n苍颜父老心无寄。\n人生有梦莫慌忙，\n出行且把平安记。 ​​​", "date": "2021.04.20", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4627978119547087 - 踏莎行 车祸甚虎/01.jpg"]}, {"id": "4628349755851732", "title": "踏莎行·踏青", "genre": "踏莎行", "body": "迷恋春光，\n钟情碧水。\n桃蹊柳陌莺声碎。\n蝶飞蜂舞映长空，\n绿茵锦绣花枝坠。\n倚望云天，\n寻游花蕊。\n风烟袅袅芳香味。\n纸鸢鹰燕尽情欢，\n舟行鱼跃人陶醉。 ​​​", "date": "2021.04.21", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4628349755851732 - 踏莎行        踏青/01.jpg"]}, {"id": "4628700215118906", "title": "太常引·遇事有感", "genre": "太常引", "body": "乱忙两日晚回京，\n心血竟无成。\n对面欠真诚。\n几来往，\n功前变生。\n黯然感慨，\n几多无奈，\n何处诉衷情。\n昂首唤苍穹，\n人守信，\n尘间纵横。 ​​​", "date": "2021.04.22", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4628700215118906 - 太常引 遇事有感/01.jpg"]}, {"id": "4629065568354945", "title": "山花子·进京路上", "genre": "山花子", "body": "漫野青葱映远空，\n群楼遥望瓦当红。\n劳者田间同奋力，\n笑声浓。\n四季勤耕黄土地，\n长年少语亦英雄。\n盛世今朝人可敬，\n且从容。 ​​​", "date": "2021.04.23", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4629065568354945 - 山花子 进京路上/01.jpg"]}, {"id": "4629429558445712", "title": "清平乐·又见乖宝", "genre": "清平乐", "body": "别离一月，\n相见心神怯。\n昂首凝眸思绪烈，\n转瞬欢颜亲切。\n翻身轻似翻书，\n笑声朗朗观图。\n最是表情乖巧，\n逗爷烦恼皆无。 ​​​", "date": "2021.04.24", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4629429558445712 - 清平乐 又见乖宝/01.jpg", "冰雪诗词_全部图片/4629429558445712 - 清平乐 又见乖宝/02.jpg"]}, {"id": "4629795100952065", "title": "寻芳草·春日晓吟", "genre": "寻芳草", "body": "草树雨来翠，\n更花朵、满枝摇缀。\n水清清，\n潋滟波影碎。\n引莺鸣，使人醉。\n意绪漫长空，\n半生过，\n往来无悔。\n日无忧，\n夜夜平安睡。\n今且乐，看孙辈。 ​​​", "date": "2021.04.25", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4629795100952065 - 寻芳草  春日晓吟/01.jpg"]}, {"id": "4630151000492019", "title": "太常引·看邻国", "genre": "太常引", "body": "阿三自大疫难消，\n近日创新高。\n老少苦难熬。\n更闻道、焚炉罢烧。\n防方缺氧，\n病人无奈。\n求美却期遥。\n惟盼望明朝，\n新德里、天晴日骄。 ​​​", "date": "2021.04.26", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4630151000492019 - 太常引       看邻国/01.jpg"]}, {"id": "4630515066080682", "title": "唐多令·人生悟", "genre": "唐多令", "body": "赤手落尘间，\n往来三万天。\n为浮名，恐后争前。\n到了都随风火去，\n任富贵，尽云烟。\n悟透且心安，\n善行从己边。\n少积多，日日年年。\n梦里不惊神鬼事，\n凭昼夜，不孤单。 ​​​", "date": "2021.04.27", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4630515066080682 - 唐多令        人生悟/01.jpg"]}, {"id": "4630874346490958", "title": "清平乐·碧水春岸", "genre": "清平乐", "body": "清河芳径，\n春色晨晖盛。\n花草葳蕤莺雀兴，\n翠叶欢声相竞。\n无忧老少闲行，\n心忙青壮粗声。\n尘世多姿多彩，\n且安苦乐人生。 ​​​", "date": "2021.04.28", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4630874346490958 - 清平乐 碧水春岸/01.jpg"]}, {"id": "4631234598145624", "title": "七律·和潇湘月夜", "genre": "七律", "body": "闲来独坐紫云轩，\n今古寻思三五番。\n俗世人生谁不老，\n凡间春暮岂能援。\n且凭泼墨挥毫手，\n散尽烟尘愤恨冤。\n块垒磨平堪慰笑，\n犹如羁客越篱樊。\n附潇湘月夜原玉：\n题紫云轩\n春风不度紫云轩，\n暗洒相思泪几番。\n玄鬓影孤愁易老，\n美人觚破力难援。\n长嗟千载丹青手，\n自洗三生不白冤。\n困在此中君莫笑，\n终能解脱出尘樊。", "date": "2021.04.29", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4631234598145624 - 七律 和潇湘月夜/01.jpg"]}, {"id": "4631597929992686", "title": "采桑子·梦天行", "genre": "采桑子", "body": "文昌箭射天和跃，\n云破星惊，\n霄汉宫成。\n携手牵牛织女行。\n生来傲作神州客，\n碧海峥嵘，\n无限深情。\n俯瞰山河景色明。 ​​​", "date": "2021.04.30", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4631597929992686 - 采桑子    梦天行/01.jpg", "冰雪诗词_全部图片/4631597929992686 - 采桑子    梦天行/02.jpg", "冰雪诗词_全部图片/4631597929992686 - 采桑子    梦天行/03.jpg"]}, {"id": "4632005638360205", "title": "蝶恋花·致敬劳动者", "genre": "蝶恋花", "body": "铺瓦添砖华夏富，\n节日无闲，\n奋斗难停步。\n汗水浸洇身下路，\n春秋寒暑风霜度。\n遍地英雄今瞩目，\n挂彩披红，\n名响千家户。\n且记寻常辛与苦，\n真情奉献无穷数。 ​​​", "date": "2021.05.01", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4632005638360205 - 蝶恋花 致敬劳动者/01.jpg"]}, {"id": "4632325600316555", "title": "临江仙·五一乐", "genre": "临江仙", "body": "节日出行诚可爱，\n盛妆乖宝招人。\n春风满面见相亲。\n每逢双笑靥，\n两眼映香魂。\n玩具可心双手握，\n明眸朱口童真。\n音容灿烂气芳芬。\n娇姿无限俏，\n稚脸意欣欣。 ​​​", "date": "2021.05.02", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4632325600316555 - 临江仙    五一乐/01.jpg", "冰雪诗词_全部图片/4632325600316555 - 临江仙    五一乐/02.jpg"]}, {"id": "4632684355388209", "title": "鹧鸪天·舍得", "genre": "鹧鸪天", "body": "望子成龙父母忧，\n一心择校几多愁。\n东西海淀千番看，\n尖校名师万众谋。\n南家问，北邻求，\n钱银不够友朋筹。\n稚童欢喜书堂去，\n爷奶余生作马牛。 ​​​", "date": "2021.05.03", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4632684355388209 - 鹧鸪天        舍得/01.jpg"]}, {"id": "4633062433883084", "title": "七绝·五四感怀", "genre": "七绝", "body": "老来不似想当年，\n力弱情衰意渐残。\n偶有梦中心绪涨，\n登高越上又争前。 ​​​", "date": "2021.05.04", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4633062433883084 - 七绝    五四感怀/01.jpg"]}, {"id": "4633410406713395", "title": "七绝·立夏有感", "genre": "七绝", "body": "凌空风絮送春归，\n临夏无云日却微。\n比似寻常寒色久，\n天公任性老人悲。 ​​​", "date": "2021.05.05", "themes": ["四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4633410406713395 - 七绝    立夏有感/01.jpg"]}, {"id": "4633773285050200", "title": "安平乐慢·回望感怀", "genre": "安平乐慢", "body": "节日神州，燕莺奋翼，游人塞北江西。\n长城远眺，碧海欣行，柔风霞色晨曦。\n绿水青山，鸟花争鸣放，遍处生机。\n正翠柳垂丝，释情怀、拈韵成诗。\n望寰宇风寒，雾缭烟乱，来往翻复迷离。\n美俄频相斗，个中情，谁又能知。\n域外新冠，灭又起，民哀鸟啼。\n众尸横，万千泪泣，惺惺唇齿相依。", "date": "2021.05.06", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4633773285050200 - 安平乐慢        回望感怀/01.jpg"]}, {"id": "4634135668984460", "title": "点绛唇·初夏暮吟", "genre": "点绛唇", "body": "乍起风沙，\n黄烟滚滚迷人眼。\n凌霄云乱，\n高柳丝翻卷。\n无奈天公，\n暗自空长叹。\n把金盏，\n酒香肠暖，\n醉不知深浅。 ​​​", "date": "2021.05.07", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4634135668984460 - 点绛唇 初夏暮吟/01.jpg"]}, {"id": "4634497596000316", "title": "踏莎行·贺外甥女订婚", "genre": "踏莎行", "body": "情定终身，\n手牵一世。\n梦中秦晋良缘起。\n火红五月艳阳天，\n槐香莺啭云空丽。\n日月为媒，\n亲朋贺喜。\n东风款款深情寄。\n连枝比翼任翔飞，\n天长地久随心意。 ​​​", "date": "2021.05.08", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4634497596000316 - 踏莎行 贺外甥女订婚/01.jpg"]}, {"id": "4634859680828392", "title": "太常引·母恩浩荡", "genre": "太常引", "body": "一生铭记母亲恩，\n万苦育儿身。\n尽孝莫辞辛。\n最当是，\n思行两真。\n时光难驻，\n亲颜将老，\n寒暖问宜频。\n床侧顾晨昏。\n才无愧，\n为人子孙。\n寄语\n为儿莫忘母恩，\n为夫莫忘妻亲。\n天下女人不易，\n惟期男子情真。 ​​​", "date": "2021.05.09", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4634859680828392 - 太常引 母恩浩荡/01.jpg"]}, {"id": "4635223692152411", "title": "七绝·闲暮吟", "genre": "七绝", "body": "今朝放眼尘寰看，\n喜见九州花盛开。\n曾历百年羞辱恨，\n睡狮已醒又归来。 ​​​", "date": "2021.05.10", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4635223692152411 - 七绝       闲暮吟/01.jpg"]}, {"id": "4635584318147256", "title": "朝中措·初夏吟", "genre": "朝中措", "body": "芬芳五月艳阳天，\n云淡碧空妍。\n月季多情似火，\n妖娆无限牡丹。\n游人遍处，\n登山戏水，\n惬意流连。\n尽释忧怀愁绪，\n归来无虑无烦。 ​​​", "date": "2021.05.11", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4635584318147256 - 朝中措    初夏吟/01.jpg"]}, {"id": "4635948493832840", "title": "七绝·扭转乾坤", "genre": "七绝", "body": "一对山桃把手中，\n犹如日月宇寰行。\n腾挪翻转春秋过，\n无语乾坤却有情。 ​​​", "date": "2021.05.12", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4635948493832840 - 七绝    扭转乾坤/01.jpg"]}, {"id": "4636319827365336", "title": "踏莎行·夏日吟", "genre": "踏莎行", "body": "晓雨如丝，\n晚晴若画。\n微风惊动葡萄架。\n星辉闪闪影重重，\n蟾光漫洒层楼下。\n柳叶藏莺，\n桐荫隔夏。\n凌空烈日浑无怕。\n花前午后品茶香，\n闲情畅意烦忧罢。 ​​​", "date": "2021.05.13", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4636319827365336 - 踏莎行    夏日吟/01.jpg"]}, {"id": "4636673512310367", "title": "七绝·初夏", "genre": "七绝", "body": "碧水青蛙夜有声，\n绿槐高柳渐蛩鸣。\n风柔日暖娇荷睡，\n花影桐荫恁有情。 ​​​", "date": "2021.05.14", "themes": ["山水田园与闲居雅趣", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4636673512310367 - 七绝            初夏/01.jpg"]}, {"id": "4637038361707993", "title": "菩萨蛮·天伦乐", "genre": "菩萨蛮", "body": "娇娃翻转天将晓，\n惺忪睡眼闻声笑。\n浅靥自多情，\n明眸左右行。\n一天心态好，\n傍晚稍烦躁。\n爷奶爱萦身，\n怀中恁是亲。 ​​​", "date": "2021.05.15", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4637038361707993 - 菩萨蛮    天伦乐/01.jpg"]}, {"id": "4637397806221865", "title": "太常引·祝融问天", "genre": "太常引", "body": "祝融轻落火星间，\n漫步舞蹁跹。\n惊起旧尘烟。\n九州客，真诚问天。\n生来几载，\n曾经往事，\n可否与人言？\n独自恁孤单，\n从今后，飞龙共欢。 ​​​", "date": "2021.05.16", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4637397806221865 - 太常引     祝融问天/01.jpg", "冰雪诗词_全部图片/4637397806221865 - 太常引     祝融问天/02.jpg"]}, {"id": "4637779022057333", "title": "清平乐·买房有寄", "genre": "清平乐", "body": "娇儿学位，\n父母心操碎。\n爷奶暗愁垂老泪，\n多少良宵无寐。\n全家左右求援，\n低眉欲语难言。\n真个人生如梦，\n谁知后世前缘。 ​​​", "date": "2021.05.17", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4637779022057333 - 清平乐 买房有寄/01.jpg"]}, {"id": "4638126217626899", "title": "感恩多·荷塘夏日", "genre": "感恩多", "body": "睡莲娇欲展，\n风起萍波远。\n翠莺穿柳烟，\n燕翔天。\n曲岸荷香气爽，\n醉心田，\n醉心田。\n草木欣欣，\n自情愉忘还。 ​​​", "date": "2021.05.18", "themes": ["感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4638126217626899 - 感恩多 荷塘夏日/01.jpg", "冰雪诗词_全部图片/4638126217626899 - 感恩多 荷塘夏日/02.jpg", "冰雪诗词_全部图片/4638126217626899 - 感恩多 荷塘夏日/03.jpg"]}, {"id": "4638483895290147", "title": "太常引·闲思", "genre": "太常引", "body": "养儿防老古人心，\n此理与诸君，\n未必可成真。\n世间事，\n横生乱云。\n深情父母，\n娇生子女，\n不孝苦双亲。\n寄语鬓霜人，\n余生乐，\n还期自身。 ​​​", "date": "2021.05.19", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4638483895290147 - 太常引        闲思/01.jpg"]}, {"id": "4638845351494187", "title": "浪淘沙·520有寄", "genre": "浪淘沙", "body": "情爱漫人间，\n春意绵绵。\n花红柳翠映长天。\n便是乌云雷阵阵，\n亦自安然。\n珍视个中缘，\n意满心田。\n同舟日月笑清寒。\n欣喜人生能巧遇，\n风雨同檐。 ​​​", "date": "2021.05.20", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4638845351494187 - 浪淘沙  520有寄/01.jpg"]}, {"id": "4639209380120719", "title": "浪淘沙·感吟", "genre": "浪淘沙", "body": "走狗乱伤人，\n利令头昏。\n欺乡蔑祖毁龙根。\n一幅可怜摇尾相，\n狼狈为亲。\n华夏日趋新，\n江海逢春。\n川原锦绣映青云。\n偶有几声哀犬吠，\n难扰心神。 ​​​", "date": "2021.05.21", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4639209380120719 - 浪淘沙        感吟/01.jpg"]}, {"id": "4639576734302990", "title": "鹧鸪天·乖孙出行", "genre": "鹧鸪天", "body": "孙乘豪车爷伴行，\n桃蹊柳院绕芳亭。\n初来人处心神紧，\n片刻花丛手脚横。\n眸乱转，嗓无停，\n莺声童语四边萦。\n娇娃感受云天好，\n笑靥欢眉别样情。 ​​​", "date": "2021.05.22", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4639576734302990 - 鹧鸪天 乖孙出行/01.jpg"]}, {"id": "4639703070411347", "title": "鹧鸪天·痛悼袁老", "genre": "鹧鸪天", "body": "当代神农驾鹤归，\n惊闻噩耗痛心扉。\n有人从未谋君面，\n谁个能离稻米炊。\n真国士，万家悲，\n江河哭泣泪横飞。\n山原翻卷阴云雨，\n今日神州景式微。 ​​​", "date": "2021.05.22", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4639703070411347 - 鹧鸪天 痛悼袁老/01.jpg"]}, {"id": "4639935220681619", "title": "清平乐·送袁老", "genre": "清平乐", "body": "为民谋事，\n山海风云记。\n悼念声惊天恸地，\n痛表深深敬意。\n田畴九秩人生，\n倾心稻米躬耕。\n换取香飘万户，\n无言岁月峥嵘 ​​​", "date": "2021.05.23", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4639935220681619 - 凊平乐    送袁老/01.jpg"]}, {"id": "4640295372982224", "title": "太常引·雨中情", "genre": "太常引", "body": "长沙昨日雨含情，\n和泪送袁公。\n鸟雀默无声。\n菊花淡，随人缓行。\n连绵不断，\n时移午夜，\n灯火更通明。\n星月耀苍鹰。\n神农去，宛如永生。 ​​​", "date": "2021.05.24", "themes": ["羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4640295372982224 - 太常引    雨中情/01.jpg", "冰雪诗词_全部图片/4640295372982224 - 太常引    雨中情/02.jpg", "冰雪诗词_全部图片/4640295372982224 - 太常引    雨中情/03.jpg"]}, {"id": "4640657564763770", "title": "朝中措·越野之殇", "genre": "朝中措", "body": "跑圈惊炸震天雷，\n九死一生悲。\n魂破白银山马，\n顶尖高手难归。\n极端天气，\n不曾相遇，\n雹雨横飞。\n挑战人生极限，\n万千准备别吹。 ​​​", "date": "2021.05.25", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4640657564763770 - 朝中措 越野之殇/01.jpg"]}, {"id": "4641046779134234", "title": "生查子·晓闻", "genre": "生查子", "body": "旭日溢霞辉，\n百啭流莺醉。\n细风拂柳丝，\n晓院飘青翠。\n早起纳纷芳，\n晨练成双对。\n无语却和谐，\n飞眉自心会。 ​​​", "date": "2021.05.26", "themes": ["山水田园与闲居雅趣", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4641046779134234 - 生查子 晓闻/01.jpg"]}, {"id": "4641382469473186", "title": "浪淘沙·奇观", "genre": "浪淘沙", "body": "苍狗咬红蟾，\n奇景悬天。\n月当十五却无圆\n玉帝有心难作为，\n千古犹然。\n诸事到人间，\n总想周全。\n奈何万物自牵连。\n且把杞人心放好，\n免去忧烦。 ​​​", "date": "2021.05.27", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4641382469473186 - 浪淘沙        奇观/01.jpg", "冰雪诗词_全部图片/4641382469473186 - 浪淘沙        奇观/02.jpg", "冰雪诗词_全部图片/4641382469473186 - 浪淘沙        奇观/03.jpg"]}, {"id": "4641748573490998", "title": "破阵子·赠财郎兄弟", "genre": "破阵子", "body": "蒙面遮头墨镜，\n轻妆上下提神。\n万里骑行山海客，\n正气盈身豪爽人。\n相逢分外亲。\n酷暑寒冬无惧，\n风霜雨雪飞奔。\n一路赏观山水美，\n阡陌芳香笑语频。\n人生总是春。\n七绝        单车乐\n一人潇洒踏车行，\n似马奔驰啸远空。\n烦恼随风千里去，\n迎星笑月自轻松。", "date": "2021.05.28", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4641748573490998 - 破阵子 赠财郎兄弟/01.jpg", "冰雪诗词_全部图片/4641748573490998 - 破阵子 赠财郎兄弟/02.jpg"]}, {"id": "4642115025372557", "title": "感恩多·喜与叹", "genre": "感恩多", "body": "校区今已占，\n先解心头念。\n六年寒暑天，\n可安眠？\n半岁娇娃不盈月，\n令人怜，\n令人怜。\n梦里无忧，\n却书山在前。 ​​​", "date": "2021.05.29", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4642115025372557 - 感恩多  喜与叹/01.jpg"]}, {"id": "4642470786501268", "title": "踏莎行·舟行霄汉", "genre": "踏莎行", "body": "二号天舟，\n一支神箭。\n瞬间飞向云空远。\n核心仓处喜相逢，\n九霄营造神州苑。\n泪洒当年，\n心生宏愿。\n太空深处凝眸干。\n如今仙女舞娇姿，\n轻盈身段惊霄汉。 ​​​", "date": "2021.05.30", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4642470786501268 - 踏莎行 舟行霄汉/01.jpg"]}, {"id": "4642833107256113", "title": "蝶恋花·阖家欢", "genre": "蝶恋花", "body": "暇日帝京郊野去，\n水岸芬芳，\n林下闻莺语。\n满目青葱花几许，\n游人乐逗乖孙女。\n笑靥明眸眉首举，\n时望云空，\n欢意千千缕。\n父母轻松无所虑，\n得闲爷奶舒心绪。 ​​​", "date": "2021.05.31", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4642833107256113 - 蝶恋花    阖家欢/01.jpg"]}, {"id": "4643195956496404", "title": "一七令·儿童节有寄", "genre": "一七令", "body": "欢。\n节日，芳天。\n童稚乐，竞林园。\n挥剑骑马，戏鱼乘船。\n亮眸频闪动，微靥映心田。\n神悦鸟鸣水岸，意飞红杏山前。\n沐清风父母陶醉，望子孙爷奶泪甘。 ​​​", "date": "2021.06.01", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4643195956496404 - 一七令  儿童节有寄/01.jpg"]}, {"id": "4643558043156735", "title": "七律·童欢无限", "genre": "七律", "body": "而今童稚乐无忧，\n玩具成堆岂用求。\n纸笔行描心里梦，\n胶泥塑造手中牛。\n水光池内金鱼钓，\n日月湖边荡小舟。\n娇嫩脸庞常带笑，\n挥金如土度春秋。 ​​​", "date": "2021.06.02", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4643558043156735 - 七律    童欢无限/01.jpg", "冰雪诗词_全部图片/4643558043156735 - 七律    童欢无限/02.jpg", "冰雪诗词_全部图片/4643558043156735 - 七律    童欢无限/03.jpg", "冰雪诗词_全部图片/4643558043156735 - 七律    童欢无限/04.jpg"]}, {"id": "4643919368816824", "title": "踏莎行·寰宇风云", "genre": "踏莎行", "body": "尘世流氓，\n丛林虎豹。\n随心作歹山湖闹。\n绵羊群里恁疯狂，\n猎人枪下徒悲叫。\n擦亮睛眸，\n巧藏枪炮。\n命门瞄准时机妙。\n一声惊响破长空，\n芸芸弱者谁无笑。 ​​​", "date": "2021.06.03", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4643919368816824 - 踏莎行 寰宇风云/01.jpg"]}, {"id": "4644283116423198", "title": "一七令·童心未泯", "genre": "一七令", "body": "人，\n莫忘，童真。\n霜染鬓，少年心。\n花底观鸟，树丛隐身。\n望云空紫燕，寻翠苑芳茵。\n临柳岸欢戏水，踏单车笑山村。\n世间烦恼任他去，遇事无争万里春。 ​​​", "date": "2021.06.04", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4644283116423198 - 一七令  童心未泯/01.jpg"]}, {"id": "4644645164027890", "title": "浪淘沙·芒种寄怀", "genre": "浪淘沙", "body": "南北欲开镰，\n麦浪滔天。\n金黄硕果促丰年。\n越过秋冬春夏盛，\n能不心欢。\n珍爱碗中餐，\n粒粒难圆。\n农人辛苦且依天。\n地里谋生恁大事，\n亘古延绵。 ​​​", "date": "2021.06.05", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4644645164027890 - 浪淘沙 芒种寄怀/01.jpg"]}, {"id": "4645007501297325", "title": "七绝·苏诗读感", "genre": "七绝", "body": "三餐一日似从前，\n同样杯盘味百千。\n缘自人生风雨过，\n曾经霜露落心田。\n附苏轼：\n庐山烟雨浙江潮，\n未到千般恨不消。\n到得还来别无事，\n庐山烟雨浙江潮。 ​​​", "date": "2021.06.06", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4645007501297325 - 七绝    苏诗读感/01.jpg"]}, {"id": "4645369646943451", "title": "鹧鸪天·寄语高考", "genre": "鹧鸪天", "body": "学子莘莘争过桥，\n神州遍地热情高。\n乡邻关注寻常问，\n父母心期昼夜熬。\n连两日，使千招，\n胸中彩墨任挥毫。\n来时金榜题名处，\n起凤腾龙入九霄。 ​​​", "date": "2021.06.07", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4645369646943451 - 鹧鸪天 寄语高考/01.jpg"]}, {"id": "4645732160113082", "title": "朝中措·鸿蒙", "genre": "朝中措", "body": "横空出世破天荒，\n贼子暗抓狂。\n打破独家垄断，\n国人眉眼飞扬。\n从今网络，\n通联情物，\n渐渐更张。\n幸有华为执剑，\n屏行免受妖伤。 ​​​", "date": "2021.06.08", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4645732160113082 - 朝中措        鸿蒙/01.jpg"]}, {"id": "4646093557598771", "title": "渔家傲·初夏晓吟", "genre": "渔家傲", "body": "夜雨霁晴连数日，\n夏庭幽静晨风细。\n翠柳欢摇浮快意，\n云旖旎，\n虫鸣鸟哢清音起。\n又是一年风爽季，\n舒心凉热和天地。\n远近出行山水丽，\n抒长气，\n醉人景色堪迢递。 ​​​", "date": "2021.06.09", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4646093557598771 - 渔家傲 初夏晓吟/01.jpg"]}, {"id": "4646463139482884", "title": "浣溪沙·稚儿趣", "genre": "浣溪沙", "body": "楼院黄昏聚幼童，\n胖丫豌豆小橙橙。\n若煊相遇眼神萌。\n车上无言招手笑，\n花前欲语字难清。\n娇音香径晚风轻。 ​​​", "date": "2021.06.10", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4646463139482884 - 浣溪沙    稚儿趣/01.jpg", "冰雪诗词_全部图片/4646463139482884 - 浣溪沙    稚儿趣/02.jpg"]}, {"id": "4646820586719472", "title": "一七令·期待", "genre": "一七令", "body": "强。\n箭起，眉扬。\n云海翥，九天翔。\n辉映寰宇，响彻四方。\n揽星辰日月，得雨露霞光。\n千古梦今日景，会嫦娥桂花香。\n喜神龙劲舞霄汉，情注天宫久久长。 ​​​", "date": "2021.06.11", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4646820586719472 - 一七令         期待/01.jpg", "冰雪诗词_全部图片/4646820586719472 - 一七令         期待/02.jpg", "冰雪诗词_全部图片/4646820586719472 - 一七令         期待/03.jpg"]}, {"id": "4647185474128227", "title": "清平乐·芍药花", "genre": "清平乐", "body": "人称花相，\n艳丽朱栏上。\n春暮薰风才绽放，\n入夏色香争旺。\n声名遍布城乡。\n山前水畔芬芳。\n不似牡丹骄贵，\n赏期却比她长。\n鹧鸪天    芍药花\n水畔山前灿烂开，\n蜂游蝶舞踏云来。\n清泉有意增姿色，\n冷露多情落粉怀。\n寻野径，入瑶台。\n芳香袅袅任风裁。\n紫红苑里称花相，\n堪比牡丹何用猜。", "date": "2021.06.12", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4647185474128227 - 清平乐    芍药花/01.jpg", "冰雪诗词_全部图片/4647185474128227 - 清平乐    芍药花/02.jpg", "冰雪诗词_全部图片/4647185474128227 - 清平乐    芍药花/03.jpg"]}, {"id": "4647543977805323", "title": "江城子·花妍城丽", "genre": "江城子", "body": "一池芍药映城台，\n盼花开，赏花来。\n远近乡朋，\n暇日喜盈怀。\n色晕妖娆佳丽笑，\n蜂蝶舞，戏香钗。\n芬芳朵朵少尘埃，\n引童孩，染红腮。\n稚嫩娇音，\n穿柳透青槐。\n啭鸟枝头浑欲醉，\n清响远，任风裁。 ​​​", "date": "2021.06.13", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4647543977805323 - 江城子 花妍城丽/01.jpg", "冰雪诗词_全部图片/4647543977805323 - 江城子 花妍城丽/02.jpg"]}, {"id": "4647907444393092", "title": "七律·端午祭", "genre": "七律", "body": "离骚千古溢芬芳，\n苦闷情深韵味长。\n天问九章求索道，\n国殇一阙魄魂飏。\n秉书明志遭人害，\n抱恨投江楚自伤。\n屈子沉冤惊日月，\n汨罗逝水粽花香。\n七绝        端午吟\n又临端午粽飘香，\n五色丝绳情意长。\n棹促龙舟灵均祭，\n神州遍咏楚辞章。 ​​​", "date": "2021.06.14", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "四时风光与节气流转", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4647907444393092 - 七律       端午祭/01.jpg"]}, {"id": "4648269542588942", "title": "七绝·兰亭闲吟", "genre": "七绝", "body": "兰亭集默序名扬，\n诗赋寻常字闪光。\n醉里挥毫神韵远，\n人前一霎墨池苍。 ​​​", "date": "2021.06.15", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4648269542588942 - 七绝    兰亭闲吟/01.jpg"]}, {"id": "4648633573837502", "title": "七律·时闻有感", "genre": "七律", "body": "宋家徒子乱清辉，\n别有情怀戾气微。\n讥骂鸿蒙行蠢事，\n狂喷国货露心扉。\n谎称学者遭人笑，\n却是庸才使众非。\n不当之言羞自取，\n劝君且莫与天违。 ​​​", "date": "2021.06.16", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4648633573837502 - 七律    时闻有感/01.jpg"]}, {"id": "4648992338085007", "title": "点绛唇·短暂交锋", "genre": "点绛唇", "body": "普拜相逢，\n青蜓点水挥挥手。\n各怀九九，\n敌视难开口。\n瑞士风光，\n看罢分头走。\n轻回首，\n世间依旧，\n暗里频相斗。 ​​​", "date": "2021.06.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4648992338085007 - 点绛唇 短暂交锋/01.jpg"]}, {"id": "4649355262561220", "title": "清平乐·圆梦", "genre": "清平乐", "body": "神舟又起，\n长驻天宫里。\n寂寞嫦娥歌舞丽，\n织女牵牛欢涕。\n星河欲转蹁跹，\n欢腾华夏山川。\n天地飞龙往复，\n今朝圆梦千年。\n太常引 天上人间\n炎黄赤子入天宫，\n玉帝满怀情，\n星月喜相迎。\n俱回首，\n神州夜明。\n山河劲舞，\n川原锦绣，\n遍处鸟欢鸣。\n万里视频通，\n诚可爱，\n英雄笑容。", "date": "2021.06.18", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4649355262561220 - 清平乐        圆梦/01.jpg", "冰雪诗词_全部图片/4649355262561220 - 清平乐        圆梦/02.jpg"]}, {"id": "4649718174975524", "title": "五律·晓院", "genre": "五律", "body": "雨霁晴空丽，\n清晨柳色新。\n白云舒笑脸，\n翠鸟舞芳茵。\n小狗闲人遛，\n家童老者亲。\n相安悠自乐，\n如画染心神。 ​​​", "date": "2021.06.19", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4649718174975524 - 五律    晓院/01.jpg"]}, {"id": "4650081426341903", "title": "朝中措·老父亲", "genre": "朝中措", "body": "稀疏银发耳偏聋，\n人善嗓门洪。\n个矮身勤手巧，\n满腔质朴情浓。\n乡村闲事，\n辛劳不计，\n意气重重。\n看似心怀未老，\n镜前已是苍翁。 ​​​", "date": "2021.06.20", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4650081426341903 - 朝中措    老父亲/01.jpg"]}, {"id": "4650235995620480", "title": "踏莎行·百善孝先", "genre": "踏莎行", "body": "父爱如山，\n母恩似水。\n亲情浩荡儿陶醉。\n人生弹指鬓如霜，\n呀呀童稚银丝缀。\n更念娘亲，\n更知爹累。\n养家不易心生愧。\n百忙岂忘孝当先，\n得闲二老床头睡。 ​​​", "date": "2021.06.20", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4650235995620480 - 踏莎行 百善孝先/01.jpg"]}, {"id": "4650441520711308", "title": "八声甘州·冬至宝宝夏至欢", "genre": "八声甘州", "body": "……寄语若煊半周岁\n看娇孙粉脸映浓眉，明眸透天真。\n手纤纤空舞，不时飞向、秀口朱唇。\n爬滚翻仰头坐，扭动小腰身。\n最是招人处，浅靥轻颦。\n笑似春风化雨，顷刻间奶奶、颠倒心神。\n喜轻声软语，长是醉爷魂。\n与乖娃，烦忧俱散；苦自消，夏至亦如春。\n欢难寐，夜深人静，梦里犹亲。", "date": "2021.06.21", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4650441520711308 - 八声甘州   冬至宝宝夏至欢/01.jpg", "冰雪诗词_全部图片/4650441520711308 - 八声甘州   冬至宝宝夏至欢/02.jpg"]}, {"id": "4650805988426855", "title": "七绝·夏夜思", "genre": "七绝", "body": "夜短昼长邻夏至，\n蝉声高远热难消。\n荷花莲叶清香溢，\n细柳蟾光意绪摇。 ​​​", "date": "2021.06.22", "themes": ["四时风光与节气流转", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4650805988426855 - 七绝        夏夜思/01.jpg"]}, {"id": "4651191005352081", "title": "蝶恋花·报志愿", "genre": "蝶恋花", "body": "学子觅桥寻左右，\n途远坑多，\n谨慎思前后。\n一旦行偏难转首，\n书山陡峭凝神走。\n尘世浮生多路口，\n惟有今番，\n此去悠长久。\n且愿诸君携挚友，\n畅游学海千帆秀。 ​​​", "date": "2021.06.23", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4651191005352081 - 蝶恋花    报志愿/01.jpg"]}, {"id": "4651644962212663", "title": "踏莎行·祖孙回家", "genre": "踏莎行", "body": "三代离京，\n一行南下。\n寻根问祖情牵挂。\n纤纤细雨软风随，\n心怀愉悦消长夏。\n家在石门，\n娃来感化。\n温馨洞户红楼瓦。\n花香鸟语境堪幽，\n颜欢手舞开心耍。 ​​​", "date": "2021.06.24", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4651644962212663 - 踏莎行 祖孙回家/01.jpg"]}, {"id": "4651894322236576", "title": "菩萨蛮·望榜兴叹", "genre": "菩萨蛮", "body": "一分改变人生路，\n早知今日何辞苦。\n年少度寒窗，\n本该灯下忙。\n奈何心向外，\n书卷香无爱。\n眼看各东西，\n心中惆怅思。 ​​​", "date": "2021.06.25", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4651894322236576 - 菩萨蛮 望榜兴叹/01.jpg"]}, {"id": "4652257469008421", "title": "鹧鸪天·石门有感", "genre": "鹧鸪天", "body": "庄里归来景貌新，\n街头商店喜盈门。\n支农路面刚铺就，\n两侧青砖无破痕。\n家照旧，却添人。\n初来便乐小娇孙。\n东瞧西看腰身扭，\n地上翻爬稚语频。 ​​​", "date": "2021.06.26", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4652257469008421 - 鹧鸪天 石门有感/01.jpg"]}, {"id": "4652682520823261", "title": "临江仙·夏夜小聚", "genre": "临江仙", "body": "热浪滔天千里外，\n清凉袅袅楼中。\n乡朋约聚豆捞宫。\n年来都未见，\n闻讯喜相逢。\n乖宝席间频对笑，\n腰身眉眼灵聪。\n金尊玉液更情浓。\n人生一代代，\n日子火红红。 ​​​", "date": "2021.06.27", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4652682520823261 - 临江仙 夏夜小聚/01.jpg"]}, {"id": "4652981754528410", "title": "踏莎行·欢聚故里", "genre": "踏莎行", "body": "四世同堂，\n一桌欢宴。\n娇娃曾祖初相见。\n只缘血脉有传承，\n乍逢熟似寻常面。\n笑靥轻盈，\n细眉舒展。\n稚音嫩脸和亲愿。\n阖家老少恁多人，\n门厅前后争相看。 ​​​", "date": "2021.06.28", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4652981754528410 - 踏莎行 欢聚故里/01.jpg"]}, {"id": "4653375154553133", "title": "减字木兰花·百年党颂", "genre": "减字木兰花", "body": "初心不改，\n奋斗百年朝气在。\n血脉传承，\n动地惊天山水明。\n红旗招展，\n四海五湖风色远。\n带路飞虹，\n小小寰球舞赤龙。 ​​​", "date": "2021.06.29", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4653375154553133 - 减字木兰花 百年党颂/01.jpg"]}, {"id": "4653713001810828", "title": "清平乐·高歌颂党", "genre": "清平乐", "body": "百年华诞，\n举世神州看。\n立党为民天地远，\n万里风高云璨。\n城乡鸟啭民康，\n国人平视八方。\n将士伏山跃海，\n巨龙霄汉翱翔。 ​​​", "date": "2021.06.30", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4653713001810828 - 清平乐 高歌颂党/01.jpg"]}, {"id": "4654067907303497", "title": "沁园春·百年风华", "genre": "沁园春", "body": "湖上红船，辉映八方，旗舞锤镰。望十三赤子，满腔热血。百年岁月，星火燎原。万里长征，合歼日寇，蒋匪烟消换地天。凭豪气，抗美援朝胜，赢取边安。\n春风化雨轩辕，携众手，神州奋向前。看创新开放，巨龙腾起。脱贫致富，华夏翩跹。带路连通，亚欧一体，世纪辉煌已必然。今昂首，跨五湖四海，跃马山川。", "date": "2021.07.01", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4654067907303497 - 沁园春        百年风华/01.jpg"]}, {"id": "4654429615163635", "title": "采桑子·七一", "genre": "采桑子", "body": "百年华诞城楼丽。\n天上银鹰，\n地上欢声。\n漫卷红旗赤子情。\n宏音沉稳千均重。\n告慰英灵，\n擘画今生。\n华夏腾飞万里鹏。 ​​​", "date": "2021.07.02", "themes": ["家国情怀与时代歌咏", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4654429615163635 - 采桑子        七一/01.jpg"]}, {"id": "4654792485896648", "title": "采桑子·认祖归来", "genre": "采桑子", "body": "匆匆来去行京冀。\n故里八天，\n乖宝悠然。\n短暂时光尽是欢。\n亲朋相见由衷笑。\n虽不能言，\n到处翩跹。\n无虑童真韵态妍。 ​​​", "date": "2021.07.03", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4654792485896648 - 采桑子 认祖归来/01.jpg"]}, {"id": "4655153297229605", "title": "七律·七一抒怀", "genre": "七律", "body": "…敬父亲在党50年\n一门四代党徽红，\n尚有三人志向明。\n逝者毕生无己欲，\n祖孙今岁袖风清。\n分居南北齐心力，\n俱为城乡景色荣。\n华诞百年同奋悦，\n胸怀激荡九州情。 ​​​", "date": "2021.07.04", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4655153297229605 - 七律    七一抒怀/01.jpg", "冰雪诗词_全部图片/4655153297229605 - 七律    七一抒怀/02.jpg"]}, {"id": "4655517596650597", "title": "蝶恋花·夏日晓吟", "genre": "蝶恋花", "body": "室内闷潮楼外爽，\n仲夏清晨，\n云淡霞光放。\n莺燕梢头流脆响，\n闲行庭院心欢畅。\n一处久居愁绪广，\n且向周边，\n寻水依山傍。\n亲近自然情意荡，\n忧烦不见人无恙 ​​​", "date": "2021.07.05", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4655517596650597 - 蝶恋花 夏日晓吟/01.jpg"]}, {"id": "4655879913474336", "title": "五律·傍晚", "genre": "五律", "body": "乖宝刚安睡，\n得闲楼院行。\n辉消缘日隐，\n暑退赖风清。\n倦鸟归高树，\n鼓蛙池上鸣。\n玩童灯下闹，\n嘻笑伴蝉声。 ​​​", "date": "2021.07.06", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4655879913474336 - 五律    傍晚/01.jpg"]}, {"id": "4656244050889764", "title": "踏莎行·时闻有感", "genre": "踏莎行", "body": "利欲头昏，\n私心脑胀。\n挥拳踢脚频相向。\n可怜院士弱腰身，\n却存风骨人难忘。\n媒体追寻，\n警方跟上。\n恶人监所蹲凉炕。\n此番事件再昭人，\n当今处世休狂妄。\n七绝    时闻有感\n满口恶言拳脚向，\n私心膨胀太猖狂。\n若非舆论铺天报，\n冠下伪君多久藏？", "date": "2021.07.07", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4656244050889764 - 踏莎行 时闻有感/01.jpg"]}, {"id": "4656423281363196", "title": "太常引·七七有寄", "genre": "太常引", "body": "防空警报刺云天，\n激起恨无边。\n倭寇至今年，\n未思过，\n时而妄言。\n协防台海，\n掺和印太，\n恶意自昭然。\n吾辈攥双拳，\n剑挥扫，\n东瀛弹丸。 ​​​", "date": "2021.07.07", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4656423281363196 - 太常引  七七有寄/01.jpg"]}, {"id": "4656602286655515", "title": "诉衷情·为人民", "genre": "诉衷情", "body": "寰球政党聚云端，\n伟业共翩跹。\n倾情亿万民众，\n谋远利当前。\n同命运，\n克时艰，\n惠千年。\n志当携手，\n合力通赢，\n丽景无边。 ​​​", "date": "2021.07.08", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱"], "images": ["冰雪诗词_全部图片/4656602286655515 - 诉衷情    为人民/01.jpg"]}, {"id": "4656964171468291", "title": "清平乐·敬航天员", "genre": "清平乐", "body": "云空漫步，\n万里飘然舞。\n兄弟无间潇洒度，\n闲看吴刚伐树。\n天和矫健身姿，\n翩跹长臂如期。\n霄汉随心翻转，\n追星捧月凭思。 ​​​", "date": "2021.07.09", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4656964171468291 - 清平乐 敬航天员/01.jpg"]}, {"id": "4657326169263025", "title": "七绝·看图有感", "genre": "七绝", "body": "一.\n弥天大谎漫人间，\n无奈平民最可怜。\n一仗死伤千百万，\n何时能够怨魂安。\n二.\n狼狈相欢祸世间，\n不知何处又遭难。\n猎枪紧握终毋懈，\n瞄准心门一二三。 ​​​", "date": "2021.07.10", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4657326169263025 - 七绝    看图有感/01.jpg", "冰雪诗词_全部图片/4657326169263025 - 七绝    看图有感/02.jpg"]}, {"id": "4657694159668199", "title": "朝中措·入伏吟", "genre": "朝中措", "body": "伏天前夜雨敲窗，\n拂晓感轻凉。\n昨日闷潮消却，\n今朝心绪飞扬。\n穿行庭院，\n鸣蝉噪柳，\n啭鸟云翔。\n期盼清阴夏日，\n微风飒爽悠长。 ​​​", "date": "2021.07.11", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4657694159668199 - 朝中措    入伏吟/01.jpg"]}, {"id": "4658057591654082", "title": "七绝·娇孙贺喜", "genre": "七绝", "body": "醒来车上向东行，\n太姥家中喜气盈。\n二老钻婚南北聚，\n子孙满地寄深情。\n踏莎行 贺岳父母钻婚\n耋耄之年，\n钻婚之喜。\n枝盈叶茂花妍丽。\n耕耘六秩果繁多，\n甘甜可口香不腻。\n两鬓丝飞，\n一怀情寄。\n凝神四代群星起。\n行居京冀总齐心，\n尊崇二老由衷意。", "date": "2021.07.12", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4658057591654082 - 七绝    娇孙贺喜/01.jpg", "冰雪诗词_全部图片/4658057591654082 - 七绝    娇孙贺喜/02.jpg", "冰雪诗词_全部图片/4658057591654082 - 七绝    娇孙贺喜/03.jpg", "冰雪诗词_全部图片/4658057591654082 - 七绝    娇孙贺喜/04.jpg"]}, {"id": "4658415466709342", "title": "七绝·闻讯闲吟", "genre": "七绝", "body": "善恶于天终有报，\n妄言岂可变成真。\n平生莫作违心事，\n留取福荫为子孙。 ​​​", "date": "2021.07.13", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4658415466709342 - 七绝    闻讯闲吟/01.jpg"]}, {"id": "4658778064816182", "title": "太常引·初伏吟", "genre": "太常引", "body": "伏来连日雨飘摇，\n京洛水滔滔，\n波漾广渠桥。\n路难过，\n人车避逃。\n风云漫卷，\n枝梢零落，\n鸟雀远危巢。\n闷热未曾消，\n雨声住，\n汗流似浇。 ​​​", "date": "2021.07.14", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4658778064816182 - 太常引    初伏吟/01.jpg"]}, {"id": "4659141194550470", "title": "朝中措·爷孙同乐", "genre": "朝中措", "body": "娇娃半岁荡秋千，\n怀里望云天。\n手舞眉开眼笑，\n神欢心悦流连。\n今朝童稚，\n身骄体健，\n远胜从前。\n黑发红颜飞韵，\n聪声慧语多妍。 ​​​", "date": "2021.07.15", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4659141194550470 - 朝中措 爷孙同乐/01.jpg"]}, {"id": "4659501942703041", "title": "太常引·帝国之殇", "genre": "太常引", "body": "当年冒进气高扬，\n今日脸灰黄，\n折将损兵忙。\n奈回撤，\n宵行昼藏。\n若知有此，\n当初何必，\n独霸藐穹苍。\n一任己张狂，\n可曾想，\n将来灭亡？ ​​​", "date": "2021.07.16", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4659501942703041 - 太常引 帝国之殇/01.jpg"]}, {"id": "4659865480596418", "title": "满庭芳·乖孙夏日", "genre": "满庭芳", "body": "云淡风清，芳庭翠院，稚童三五相逢。\n点头挥手，尽笑脸盈盈。\n环看枝飞叶舞，听啭鸟、流响西东。\n林荫道，童车来去，碾树影重重。\n时光轻逝去，午前人奋，饭后神宁。\n待醒来，儿歌音乐欢鸣。\n玩具随心戏耍，无忧虑、爷奶怀中。\n斜阳落，娇身沐浴，香气漫帘栊。", "date": "2021.07.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4659865480596418 - 满庭芳    乖孙夏日/01.jpg"]}, {"id": "4660229784731928", "title": "五绝·寄怀", "genre": "五绝", "body": "眼前童稚乐，\n故里老人悲，\n谁有双全策，\n于心两不违。 ​​​", "date": "2021.07.18", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4660229784731928 - 五绝    寄怀/01.jpg"]}, {"id": "4660593585293335", "title": "踏莎行·利剑出鞘", "genre": "踏莎行", "body": "亚轨飞行，\n群情振奋。\n云空万里星光衬。\n神州大地遍生辉，\n此情最解心头恨。\n贼寇挥矛，\n良人擎盾。\n东西对垒风云震。\n多年积怨待平舒，\n辱仇必报凭锋刃。 ​​​", "date": "2021.07.19", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4660593585293335 - 踏莎行 利剑出鞘/01.jpg", "冰雪诗词_全部图片/4660593585293335 - 踏莎行 利剑出鞘/02.jpg"]}, {"id": "4660951704670400", "title": "卜算子·夏日吟", "genre": "卜算子", "body": "闷热易伤身，\n咳嗽随风到。\n只为当时扇底凉，\n清涕胸前闹。\n鼻塞脸通红，\n转眼高烧了。\n难作尘间钢铁侠，\n一路前奔啸。 ​​​", "date": "2021.07.20", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4660951704670400 - 卜算子    夏日吟/01.jpg"]}, {"id": "4661318953213431", "title": "七律·敬妻生日", "genre": "七律", "body": "牛年过半滞京华，\n梦里常回自己家。\n花甲弱身忙内外，\n伤残细手为吾他。\n子孙身上倾心血，\n父母床头少果茶。\n每日厨房灯火晚，\n何时芳院享闲暇？ ​​​", "date": "2021.07.21", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4661318953213431 - 七律    敬妻生日/01.jpg"]}, {"id": "4661676366369469", "title": "破阵子·雨后感怀", "genre": "破阵子", "body": "暴雨洪灾肆虐，\n可怜无奈苍生。\n谁料途遭生死难，\n更痛别来无影形。\n车桥如絮萍。\n惊看江河决口，\n又闻英武官兵。\n四面八方伸暖手，\n汇聚神州万里情。\n中原天霁明。 ​​​", "date": "2021.07.22", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4661676366369469 - 破阵子 雨后感怀/01.jpg", "冰雪诗词_全部图片/4661676366369469 - 破阵子 雨后感怀/02.jpg"]}, {"id": "4662046391796299", "title": "浪淘沙·雨后有寄", "genre": "浪淘沙", "body": "暴雨虐中原，\n百态人间。\n逆行涉水手相牵。\n赠物捐钱修洞路，\n情寄灾前。\n喜见善良言，\n刺耳闻欢。\n无聊谩骂惹人烦。\n险害当头齐奋力，\n大难同担。 ​​​", "date": "2021.07.23", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4662046391796299 - 浪淘沙 雨后有寄/01.jpg"]}, {"id": "4662402535392045", "title": "五律·吟伏天", "genre": "五律", "body": "大暑却风凉，\n浑身汗扫光，\n行人开笑脸，\n飞鸟脆音扬。\n柳乐云空舞，\n鱼欢闹水塘。\n凭栏观落日，\n总道异平常。 ​​​", "date": "2021.07.24", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4662402535392045 - 五律 吟伏天/01.jpg"]}, {"id": "4662766387073094", "title": "七律·东京奥运", "genre": "七律", "body": "丑闻不断幕难开，\n延至今朝客未来。\n纸板当床遭诟病，\n核材烧饭被疑猜。\n气氛萧瑟辉
