937", "title": "清平乐·巅峰漫步", "genre": "清平乐", "body": "珠峰雪动，\n玉帝山神醒。\n红色觇标华夏影，\n不惧风寒云冷。\n丈量巨子身高，\n神州脊背多娇。\n自古顶天立地，\n雄伟傲视今朝。 ​​​", "date": "2020.05.28", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4509473744421937 - 清平乐 巅峰漫步/01.jpg", "冰雪诗词_全部图片/4509473744421937 - 清平乐 巅峰漫步/02.jpg", "冰雪诗词_全部图片/4509473744421937 - 清平乐 巅峰漫步/03.jpg", "冰雪诗词_全部图片/4509473744421937 - 清平乐 巅峰漫步/04.jpg"]}, {"id": "4509836869574290", "title": "菩萨蛮·敬任总", "genre": "菩萨蛮", "body": "九州内外千头绪，\n夜深独自思娇女。\n已是鬓白人，\n华为精气神。\n当初谋远虑，\n今日豺狼惧。\n厚禄不惟亲，\n方得威虎军。 ​​​", "date": "2020.05.29", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": []}, {"id": "4510204303788440", "title": "菩萨蛮·初夏晓寄", "genre": "菩萨蛮", "body": "凭栏晓望西南月，\n闻听树杪蛩螀咽。\n清爽院前风，\n往来翠鸟鸣。\n红日东方起，\n霞光行万里。\n初夏又一天，\n心期好梦圆。 ​​​", "date": "2020.05.30", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": []}, {"id": "4510560241338292", "title": "菩萨蛮·人头鬼面", "genre": "菩萨蛮", "body": "火光风景黑人泪，\n迎来川普开枪怼。\n异地事相同，\n一人两样声。\n煽风吹鬼火，\n信口雌黄客。\n肚里坏心肠，\n却披虚善装。 ​​​", "date": "2020.05.31", "themes": ["感怀人生与自省述志"], "images": []}, {"id": "4510923975405005", "title": "唐多令·庚子学童", "genre": "唐多令", "body": "童稚戏街园，\n天真无虑颜。\n踏轮滑，飞向花边，\n满目紫红情不尽。\n惊而叫，舞蹁跹。\n庚子疫情年，\n假期一再延。\n久宅家，身躁心烦，\n学校无缘嘻草地。\n人尚小，不知难。 ​​​", "date": "2020.06.01", "themes": ["家国情怀与时代歌咏"], "images": []}, {"id": "4510961522521354", "title": "七绝·六一随想", "genre": "七绝", "body": "童心未泯鬓飞霜，\n山水游学胜课堂。\n拜友访朋情不尽，\n尊贤敬老为孙忙。 ​​​", "date": "2020.06.01", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4511283388961947", "title": "渔家傲·所谓灯塔", "genre": "渔家傲", "body": "烟燎白宫风景线，\n黄毛歪嘴心神乱。\n虚伪说辞自呑咽。\n一浑蛋，\n威胁恶狗人群窜。\n信口胡诌天怒犯，\n熊熊烈火民声怨。\n失道赢得朋背叛。\n天正变，\n阑风伏雨年光换。 ​​​", "date": "2020.06.02", "themes": ["亲情友情与人间至爱"], "images": []}, {"id": "4511403317195196", "title": "七绝·题图", "genre": "七绝", "body": "一腔坏水两张皮，\n醉语痴言独自迷。\n小丑跳梁天下笑，\n腥臊臭味万年遗。 ​​​", "date": "2020.06.02", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4511403317195196 - 七绝           题图/01.jpg"]}, {"id": "4511648574225743", "title": "如梦令·廉州情谊", "genre": "如梦令", "body": "兄弟黄昏相聚，\n把盏凭风萦趣。\n新友旧朋欢，\n南北东西飞绪，\n无虑，无虑。\n戴月扶墙归去。 ​​​", "date": "2020.06.03", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4512010828630568", "title": "减字木兰花·遐思", "genre": "减字木兰花", "body": "鬓丝飞坠，\n记取浮生欢与醉。\n华发稀松，\n历尽人间雨雪风。\n初心如水，\n细流向东终不悔。\n喜看苍山，\n暮色斜阳五彩天。 ​​​", "date": "2020.06.04", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": []}, {"id": "4512372566560511", "title": "七绝·农家乐", "genre": "七绝", "body": "又是金黄麦浪翻，\n机收胜却手工镰。\n乡村父老开怀笑，\n免去弯腰背向天。 ​​​", "date": "2020.06.05", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4512372566560511 - 七绝         农家乐/01.jpg", "冰雪诗词_全部图片/4512372566560511 - 七绝         农家乐/02.jpg"]}, {"id": "4512735439795009", "title": "满江红·闲看风云", "genre": "满江红", "body": "今日寰球，\n凡乱处、难缺美帝。\n煽鬼火、阴风不断，\n魅魂频起。\n利己害人浑不顾，\n退群失信成新癖。\n恶棒飞、舞爪阻春风，\n白费力！\n瘟情漫、黑人死，\n平民怼、川普气。\n看白宫灯灭，黄毛躲避。\n军警开枪瞄百姓，\n人权落幕惊天地。\n霸式微，如落日云烟，\n终将逝！", "date": "2020.06.06", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣"], "images": []}, {"id": "4513098537206931", "title": "七绝·高山雪莲", "genre": "七绝", "body": "独立冰山笑碧空，\n无人欣赏亦从容。\n世间若此清心态，\n何惧东西雨雪风。 ​​​", "date": "2020.06.07", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4513098537206931 - 七绝    高山雪莲/01.jpg"]}, {"id": "4513465916178100", "title": "七绝·石门风雨", "genre": "七绝", "body": "午后黑云城欲摧，\n惊雷阵阵鸟横飞。\n狂风骤雨窗前过，\n童稚闻声哭皱眉。 ​​​", "date": "2020.06.08", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": []}, {"id": "4513834818041777", "title": "点绛唇·往事如烟", "genre": "点绛唇", "body": "千载长城，\n今朝闲卧山川翠。\n旧砖昔垒，\n曾记英雄泪。\n塞外狼烟，\n将士心神碎。\n人难寐，\n死生无畏，\n凭挡匈奴锐。 ​​​", "date": "2020.06.09", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4513834818041777 - 点绛唇 往事如烟/01.jpg"]}, {"id": "4514187092839281", "title": "西江月·风光无限", "genre": "西江月", "body": "早晚河边垂钓，\n午间树下歇凉。\n浮生往事不思量，\n且把今朝乐享。\n喜看金鱼戏水，\n厌听乌雀啼腔。\n夕阳正是好时光，\n一任鬓丝飞荡。 ​​​", "date": "2020.06.10", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4514187092839281 - 西江月 风光无限/01.jpg"]}, {"id": "4514547178488271", "title": "踏莎行·夜行随想", "genre": "踏莎行", "body": "夜色无尘，\n细风轻爽。\n闲行河岸心怀敞。\n波光流水静无声，\n丁香淡淡悠悠淌。\n暗柳低垂，\n银灯明朗。\n喧嚣褪去桥宽广。\n人生何必尽扎堆，\n疏篱曲径清幽享。 ​​​", "date": "2020.06.11", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4514547178488271 - 踏莎行 夜行随想/01.jpg", "冰雪诗词_全部图片/4514547178488271 - 踏莎行 夜行随想/02.jpg"]}, {"id": "4514909549976436", "title": "七绝·咏竹", "genre": "七绝", "body": "虚心向上志凌云，\n直挺身躯不染尘。\n翠叶青青根入地，\n迎风纳雪更精神。 ​​​", "date": "2020.06.12", "themes": ["咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4514909549976436 - 七绝           咏竹/01.jpg"]}, {"id": "4515271664630620", "title": "减字木兰花·中流击水", "genre": "减字木兰花", "body": "无情暴雨，咆哮奔腾千万里。\n肆虐家园，毁物伤人百姓难。\n谁能击水，除害为民心最美。\n赤胆深情，伏虎降龙子弟兵。 ​​​", "date": "2020.06.13", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4515634384496835", "title": "临江仙·乡村教师", "genre": "临江仙", "body": "桃李芬芳心底梦，\n护苗培土耕耘，\n修枝剪叶总熬神。\n春秋寒暑苦，\n岁月几重轮。\n乡野寄身衾枕冷，\n霜丝飞鬓留痕，\n韶华默默伴童音。\n课堂学子笑，\n村上少闲人。 ​​​", "date": "2020.06.14", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4515634384496835 - 临江仙 乡村教师/01.jpg"]}, {"id": "4515997816849770", "title": "小重山·惊闻", "genre": "小重山", "body": "清晓传来霹雳声，\n惊回千里梦，\n绪难平。\n帝都冠肺又重生。\n来势猛，\n神骇北平城。\n防疫莫稀松，\n随身携口罩，\n慎出行。\n生鲜海货且消停。\n别为嘴，\n毁了子安宁。 ​​​", "date": "2020.06.15", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4515997816849770 - 小重山        惊闻/01.jpg"]}, {"id": "4516359377424068", "title": "七绝·熊童子", "genre": "七绝", "body": "初生浅绿态乖萌，\n嫩脸纤绒点缀红。\n今日盛开花粉色，\n群观独赏趣无穷。 ​​​", "date": "2020.06.16", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4516359377424068 - 七绝        熊童子/01.jpg", "冰雪诗词_全部图片/4516359377424068 - 七绝        熊童子/02.jpg"]}, {"id": "4516721760986871", "title": "玉楼春·别样烟火", "genre": "玉楼春", "body": "卖花沽酒街头市，\n早晚升腾烟火气。\n推车挑担挽箩筐，\n赔赚不攀人自喜。\n疫情耽误民生计，\n马路地摊堪好事。\n行人过客买心欢，\n翁妪来回寻可意。 ​​​", "date": "2020.06.17", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4516721760986871 - 玉楼春 别样烟火/01.jpg", "冰雪诗词_全部图片/4516721760986871 - 玉楼春 别样烟火/02.jpg", "冰雪诗词_全部图片/4516721760986871 - 玉楼春 别样烟火/03.jpg"]}, {"id": "4516822629577941", "title": "七律·闲咏", "genre": "七律", "body": "耳闻目染春秋事，\n昼赋宵词满纸篇。\n绿水青山林草翠，\n银花火树月人圆。\n携朋聚友山间笑，\n换盏推杯席上颠。\n不为声名多显赫，\n只求文脉永相传。 ​​​", "date": "2020.06.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4517083591230961", "title": "七绝·自醒", "genre": "七绝", "body": "树有高低各向天，\n人生长短且心欢。\n切莫自寻烦恼事，\n免得神绪不能安。 ​​​", "date": "2020.06.18", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4517083591230961 - 七绝           自醒/01.jpg"]}, {"id": "4517119334555379", "title": "卜算子·逍遥游", "genre": "卜算子", "body": "独自踏千山\n挥手峦峰站\n万里晴空鸿雁飞\n云卷思无限\n丽日醉春风\n远客迷花岸\n溪水潺潺翠鸟鸣\n紫陌红霞漫 ​​​", "date": "2020.06.18", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": []}, {"id": "4517121566148067", "title": "清平乐·农家乐", "genre": "清平乐", "body": "庭轩窄小\n翠鸟鸣花草\n丽日青云风色好\n廊下欢言翁媪\n爷爷植绿墙东\n看鸡奶奶扶笼\n嘻耍童孙可爱\n追逐起落飞蓬 ​​​", "date": "2020.06.18", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": []}, {"id": "4517189610246247", "title": "江城子·百花颂", "genre": "江城子", "body": "一年四季海棠花，\n水仙花，百合花。\n淡雅清香，还看吊兰花。\n皇后之花称月季，\n情浪漫，杜鹃花。\n公主悠悠品昙花，\n望莲花，赏梅花。\n大瓣七星，月月百兰花。\n飘逸芳香惟茉莉，\n真国色，牡丹花。 ​​​", "date": "2020.06.18", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4517189610246247 - 江城子   百花颂/01.jpg", "冰雪诗词_全部图片/4517189610246247 - 江城子   百花颂/02.jpg"]}, {"id": "4517447010612454", "title": "七绝·咏松柏", "genre": "七绝", "body": "塞北江南川岭处，\n风霜寒暑挺拔生。\n一任百花开又落，\n初心不改郁葱葱。 ​​​", "date": "2020.06.19", "themes": ["山水田园与闲居雅趣", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4517447010612454 - 七绝       咏松柏/01.jpg", "冰雪诗词_全部图片/4517447010612454 - 七绝       咏松柏/02.jpg"]}, {"id": "4517548547284102", "title": "一剪梅·思念", "genre": "一剪梅", "body": "不尽长江滚滚流，\n望岳阳楼    ，\n倚岳阳楼。\n凭栏远眺绪难收，\n白浪飞鸥，\n往事悠悠。\n畅想当年携手游，\n五岳山头，\n四海潮头。\n而今独自在高楼，\n思念无休，\n憧憬无休。 ​​​", "date": "2020.06.19", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4517548547284102 - 一剪梅        思念/01.jpg"]}, {"id": "4517811462037735", "title": "少年游·无奈", "genre": "少年游", "body": "前期准拟去京城，\n不道疫情生。\n往来受限，情怀失落，\n好事又成空。\n瘟神南北沉浮起，\n此次更心惊。\n到底何时，风清云淡，\n万里自由行？ ​​​", "date": "2020.06.20", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4517811462037735 - 少年游          无奈/01.jpg"]}, {"id": "4517922704334621", "title": "七绝·闲咏", "genre": "七绝", "body": "诗词文史大观园，\n诸子先贤心路宽。\n倚马荡舟揽仙气，\n赏云傍月柳桃边。 ​​​", "date": "2020.06.20", "themes": ["山水田园与闲居雅趣", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4517922704334621 - 七绝            闲咏/01.jpg", "冰雪诗词_全部图片/4517922704334621 - 七绝            闲咏/02.jpg", "冰雪诗词_全部图片/4517922704334621 - 七绝            闲咏/03.jpg"]}, {"id": "4518173272088172", "title": "浣溪沙·敬老父亲", "genre": "浣溪沙", "body": "耋耄微躯耳渐残，\n难听言语自忧烦。\n时常郁闷使人怜。\n昔日当家成大事，\n今朝孤怯远人前。\n南山不老我心间。 ​​​", "date": "2020.06.21", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4518173272088172 - 浣溪沙 敬老父亲/01.jpg"]}, {"id": "4518535583241160", "title": "七绝·三重日", "genre": "七绝", "body": "夏至日食六月天，\n长空万里耀金环。\n父亲节里恩情重，\n孝子贤孙二老前。 ​​​", "date": "2020.06.22", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4518535583241160 - 七绝         三重日/01.jpg", "冰雪诗词_全部图片/4518535583241160 - 七绝         三重日/02.jpg"]}, {"id": "4518890548176043", "title": "七律·寄怀", "genre": "七律", "body": "时光流逝朱颜换，\n斑鬓吟诗静自安。\n春日畅游山水绿，\n秋风饱览叶霞丹。\n人生有爱恩情厚，\n心底无私天地宽。\n万里穿行星斗亮，\n凭栏远眺夜阑珊。 ​​​", "date": "2020.06.23", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4518890548176043 - 七律           寄怀/01.jpg"]}, {"id": "4518928925240479", "title": "浣溪沙·饮抒怀", "genre": "浣溪沙", "body": "玉液微酣意绪飞，\n悲愁欢喜更相催。\n花前月下梦中追。\n拂晓凭空翻巨浪，\n黄昏倚枕望斜晖。\n樽前言语似风吹。 ​​​", "date": "2020.06.23", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4518928925240479 - 浣溪沙    饮抒怀/01.jpg"]}, {"id": "4519000274714205", "title": "清平乐·神奇北斗", "genre": "清平乐", "body": "星辰北斗，\n千载牵人走。\n今日凭辉观宇宙，\n华夏乾坤在手。\n苍茫山海云空，\n寰球巡望无穷。\n转眼投足微笑，\n丝丝尽纳其中。 ​​​", "date": "2020.06.23", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4519000274714205 - 清平乐 神奇北斗/01.jpg", "冰雪诗词_全部图片/4519000274714205 - 清平乐 神奇北斗/02.jpg"]}, {"id": "4519251661382603", "title": "七绝·龙象之争", "genre": "七绝", "body": "一拳打破阿三梦，\n称霸南亚似絮萍。\n飘落只应随水去，\n无碍江河起巨龙。 ​​​", "date": "2020.06.24", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4519251661382603 - 七绝    龙象之争/01.jpg"]}, {"id": "4519360146731362", "title": "七律·银滩风色", "genre": "七律", "body": "红虾紫蟹当街市，\n母爱乳山华夏知。\n好客银滩花满路，\n迎人玉液酒盈瓻。\n碧宵天阔观明月，\n白昼水清吟古诗。\n草木漫山风色美，\n神州南北万人痴。 ​​​", "date": "2020.06.24", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱"], "images": ["冰雪诗词_全部图片/4519360146731362 - 七律    银滩风色/01.jpg", "冰雪诗词_全部图片/4519360146731362 - 七律    银滩风色/02.jpg", "冰雪诗词_全部图片/4519360146731362 - 七律    银滩风色/03.jpg"]}, {"id": "4519607497893203", "title": "山花子·端午寄怀", "genre": "山花子", "body": "又是端阳棕米香，\n黎民情洒汨罗江。\n各路龙舟风正劲，\n渡潇湘。\n屈子楚辞千古诵，\n离骚天问韵悠长。\n今看神州山水秀，\n奏华章。 ​​​", "date": "2020.06.25", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4519607497893203 - 山花子 端午寄怀/01.jpg", "冰雪诗词_全部图片/4519607497893203 - 山花子 端午寄怀/02.jpg", "冰雪诗词_全部图片/4519607497893203 - 山花子 端午寄怀/03.jpg"]}, {"id": "4519659938985531", "title": "七律·端午感怀", "genre": "七律", "body": "棕情飘溢漫天香，\n万户千家蒸煮忙。\n南北龙舟齐奋进，\n东西乡友祝安康。\n古人含恨投江去，\n今客梦圆霄汉翔。\n覆地翻天山海秀，\n神州万里映高阳。 ​​​", "date": "2020.06.25", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4519659938985531 - 七律    端午感怀/01.jpg"]}, {"id": "4519728012259511", "title": "七律·端午游", "genre": "七律", "body": "雨后西山尽兴玩，\n飘香黄粽惹心甜。\n满坡红杏枝头挂，\n转角青梅人眼馋。\n峰顶飞云携玉色，\n山间栈道翠相连。\n亭台花鸟晴空下，\n南北清风任自然。 ​​​", "date": "2020.06.25", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4519728012259511 - 七律        端午游/01.jpg", "冰雪诗词_全部图片/4519728012259511 - 七律        端午游/02.jpg"]}, {"id": "4519795176177228", "title": "七绝·端午寄", "genre": "七绝", "body": "情倾汨罗千百年，\n文人骚客赋诗篇。\n悲词痛句哭屈子，\n凭粽飞舟问九天。 ​​​", "date": "2020.06.25", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4519795176177228 - 七绝        端午寄/01.jpg"]}, {"id": "4519972195413846", "title": "七绝·屈原", "genre": "七绝", "body": "凭风愁对江头月，\n天问九章悲愤歌。\n人去情怀昭万世，\n年年端午泪婆娑。 ​​​", "date": "2020.06.26", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "感怀人生与自省述志", "怀古咏史与读文有感", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4519972195413846 - 七绝           屈原/01.jpg"]}, {"id": "4519986921564894", "title": "七绝·明星恨", "genre": "七绝", "body": "台前光艳万人追，\n窗后肮脏毒粉催。\n失律酿成千古恨，\n有何颜面再回归。 ​​​", "date": "2020.06.26", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4519986921564894 - 七绝        明星恨/01.jpg"]}, {"id": "4520085676397824", "title": "十六字令·井冈山", "genre": "十六字令", "body": "山，\n青翠茫茫袅袅烟。\n人居此，\n不愿做神仙。\n山，\n百里方圆峻岭连。\n黄洋界，\n一炮退敌千。\n山，\n遥望当年尽杜鹃。\n思先烈，\n血色映红天。 ​​​", "date": "2020.06.26", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4520085676397824 - 十六字令  井冈山/01.jpg", "冰雪诗词_全部图片/4520085676397824 - 十六字令  井冈山/02.jpg"]}, {"id": "4520338157090301", "title": "水调歌头·荷花淀", "genre": "水调歌头", "body": "日照荷塘水，鸿雁映云天。\n微风摇荡垂柳，翠叶藕相连。\n午后骄阳烈烈，花懒蝉鸣蛙叫，\n昏暮转清寒。\n湖碧光波漾，云影舞青莲。\n霓虹闪，笙歌漫，久难眠。\n倚栏昂首，遥望穹宇冷蟾圆。\n半世忙忙碌碌，奔波月月年年，\n家事不周全。\n往后心思少，日日共婵娟。", "date": "2020.06.27", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4520338157090301 - 水调歌头                荷花淀/01.jpg", "冰雪诗词_全部图片/4520338157090301 - 水调歌头                荷花淀/02.jpg"]}, {"id": "4520444189487886", "title": "七绝·赏名画", "genre": "七绝", "body": "墨香千载溢人间，\n闻宝凝情拜圣贤。\n神聚丹青思不尽，\n先朝人事在眼前。 ​​​", "date": "2020.06.27", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4520444189487886 - 七绝       赏名画/01.jpg", "冰雪诗词_全部图片/4520444189487886 - 七绝       赏名画/02.jpg", "冰雪诗词_全部图片/4520444189487886 - 七绝       赏名画/03.jpg"]}, {"id": "4520695516051855", "title": "七绝·仝卓恨", "genre": "七绝", "body": "丑事还当美事说，\n嬉皮笑脸却砸锅。\n曾经都把金银碗，\n口爽一时毁一窝。 ​​​", "date": "2020.06.28", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4520695516051855 - 七绝        仝卓恨/01.jpg", "冰雪诗词_全部图片/4520695516051855 - 七绝        仝卓恨/02.jpg"]}, {"id": "4520808271361914", "title": "沁园春·旧照寄怀", "genre": "沁园春", "body": "触物思人，念想师恩 ，\n往事胜新。\n忆当年少子，京城问道，\n家国社会、地理天文。\n何去何从、东西苦闷，\n总赖师长操碎心。\n经四载，历春秋寒暑，\n身瘦销魂。\n四十冬夏缤纷，\n虽不见，音容格外亲。\n愿时光倒转，师生再聚。\n天南地北、把酒微醺。\n北海同舟、香山携手。\n白发苍颜又一村。\n惟所盼，体康心情悦，\n轻看千金。", "date": "2020.06.28", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4520808271361914 - 沁园春       旧照寄怀/01.jpg"]}, {"id": "4521058608203267", "title": "阮郎归·夏雨", "genre": "阮郎归", "body": "惊风飘过玉珠连，\n新凉入锦帘。\n炎光湿热退窗前，\n气清人自闲。\n依案坐，旧书翻，\n钟情李杜篇。\n花溪蜀道默心间，\n悄然日已偏。 ​​​", "date": "2020.06.29", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4521058608203267 - 阮郎归       夏雨/01.jpg", "冰雪诗词_全部图片/4521058608203267 - 阮郎归       夏雨/02.jpg"]}, {"id": "4521421454151384", "title": "一丛花·鹤翔桩", "genre": "一丛花", "body": "晓来又落雨如帘，\n白雾卷窗前。\n出门晨练天难许，\n且屋内，意守丹田。\n经络并行，周身舒缓，\n任督气连绵。\n身躯松立手虚含，\n两眼视平川。\n天通百会收阳气，\n凭心念，浊泻涌泉。\n人静意空，浑然一体，\n日久自延年。 ​​​", "date": "2020.06.30", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4521421454151384 - 一丛花        鹤翔桩/01.jpg"]}, {"id": "4521556091838609", "title": "卜算子·自乐", "genre": "卜算子", "body": "只为爱诗词，\n彼此精心护。\n谁若心情不爽时，\n群里来相处。\n愁事任他流，\n换个新思路。\n咏赋吟诗韵味浓，\n时日悠然度。 ​​​", "date": "2020.06.30", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4521556091838609 - 卜算子        自乐/01.jpg"]}, {"id": "4521783372677780", "title": "满江红·七一颂", "genre": "满江红", "body": "九九为功，红旗艳，神州飘荡。\n庚子夏，转身难忘，鼠年春象。\n疫起江城民俱骇，\n情凝华夏心同向。\n政令通，赤子聚八方，争前上。\n白衣俏，迷彩壮。\n南山火，兰娟靓。\n险滩冲头阵，立杆为样。\n塞北江南迎紫陌，\n山清水秀繁花放。\n看寰球，\n魍魉魅魑惊，龙飞畅。", "date": "2020.07.01", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4521783372677780 - 满江红                      七一颂/01.jpg", "冰雪诗词_全部图片/4521783372677780 - 满江红                      七一颂/02.jpg", "冰雪诗词_全部图片/4521783372677780 - 满江红                      七一颂/03.jpg", "冰雪诗词_全部图片/4521783372677780 - 满江红                      七一颂/04.jpg"]}, {"id": "4521822261131771", "title": "长相思·再回归", "genre": "长相思", "body": "国思安，\n民思安。\n忍耐多时客走偏。\n今朝出手牵。\n陆人欢，\n港人欢。\n少数蛀虫心胆寒。\n香江水更蓝。 ​​​", "date": "2020.07.01", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4521822261131771 - 长相思     再回归/01.jpg"]}, {"id": "4521899063778047", "title": "清平乐·七一感怀", "genre": "清平乐", "body": "初心不忘，\n山海翻红浪。\n天路星桥千里望，\n五彩祥云卷放。\n天涯地角花开，\n林间岭上蜂来。\n平野庭轩硕果，\n城乡老少怡怀。 ​​​", "date": "2020.07.01", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4521899063778047 - 清平乐  七一感怀/01.jpg"]}, {"id": "4522158291797860", "title": "七绝·老子第一章读感", "genre": "七绝", "body": "可名可道皆玄妙，\n天地之始万物生。\n上下纵横多少事，\n人间精髓道德经。 ​​​", "date": "2020.07.02", "themes": ["感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4522158291797860 - 七绝 老子第一章读感/01.jpg"]}, {"id": "4522252773970766", "title": "西江月·贺友生日", "genre": "西江月", "body": "暑气漫袭南北，\n鸣莺劲舞东西。\n藉由鸿雁寄相思，\n岁岁年年如此。\n昔日同窗欢度，\n今朝异地心期。\n临屏把酒醉吟诗，\n句句杯杯情意。 ​​​", "date": "2020.07.02", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4522252773970766 - 西江月 贺友生日/01.jpg"]}, {"id": "4522506592123703", "title": "玉楼春·雨天有寄", "genre": "玉楼春", "body": "云烟卷弄廉纤雨，\n阵阵轻雷来又去。\n绿杨高柳翠无声，\n叶底惊蝉缺意绪。\n高楼独自谁能语，\n嚼字咬文攀雅趣。\n心神交会圣贤人，\n期与苏辛梦相遇。 ​​​", "date": "2020.07.03", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4522506592123703 - 玉楼春 雨天有寄/01.jpg"]}, {"id": "4522873849522774", "title": "清平乐·荷花", "genre": "清平乐", "body": "芙蓉出水，\n风色莺蝶醉。\n嫩蕊清香枝叶翠，\n辉映曲塘明媚。\n韵和隐处鸣蛙，\n根通莲藕馨家。\n无愧花之君子，\n淤泥不染芳华。 ​​​", "date": "2020.07.04", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4522873849522774 - 清平乐         荷花/01.jpg", "冰雪诗词_全部图片/4522873849522774 - 清平乐         荷花/02.jpg", "冰雪诗词_全部图片/4522873849522774 - 清平乐         荷花/03.jpg"]}, {"id": "4523055542172550", "title": "七律·晨练", "genre": "七律", "body": "曦辉漫洒绿茵园，\n浅黛翩翩秀水边。\n粉面荷花争韵色，\n娇姿翠叶映云天。\n清风雨露晨光好，\n蛙鼓蝉鸣脆响绵。\n寒暑春秋终不辍，\n芳颜丽质俏人前。 ​​​", "date": "2020.07.04", "themes": ["山水田园与闲居雅趣", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4523055542172550 - 七律             晨练/01.jpg", "冰雪诗词_全部图片/4523055542172550 - 七律             晨练/02.jpg", "冰雪诗词_全部图片/4523055542172550 - 七律             晨练/03.jpg"]}, {"id": "4523228612397749", "title": "七绝·画石", "genre": "七绝", "body": "人脸奇石把手中，\n黄毛歪嘴具神形。\n无缘相见天天见，\n日日恶心难舍扔。 ​​​", "date": "2020.07.05", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4523228612397749 - 七绝           画石/01.jpg"]}, {"id": "4523268775986346", "title": "江城子·老娘", "genre": "江城子", "body": "稀疏白发映苍颜，\n背钩弯，步蹒跚，\n高寿八十，日日不歇闲。\n总是心操家务事  ，\n千百计，使人欢 。\n历经万苦不曾言，\n几十年，弹指间。\n儿已鬓斑，再把娘手牵。\n霎那当年多少事，\n一幕幕，泪连连。 ​​​", "date": "2020.07.05", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4523268775986346 - 江城子        老娘/01.jpg"]}, {"id": "4523342721481001", "title": "浣溪沙·对酌", "genre": "浣溪沙", "body": "夏日悠悠暑气长，\n夜来对饮享清凉。\n琼浆玉液溢浓香。\n三两笑谈今日事，\n半斤神侃往昔狂。\n不觉月影上花墙。 ​​​", "date": "2020.07.05", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4523342721481001 - 浣溪沙        对酌/01.jpg"]}, {"id": "4523593184912107", "title": "七绝·夜斗", "genre": "七绝", "body": "逢光躲闪暗中忙，\n专扰酣人梦里香。\n难耐起身心底怒，\n纱拍挥舞血飞墙。 ​​​", "date": "2020.07.06", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4523593184912107 - 七绝           夜斗/01.jpg"]}, {"id": "4523956856355277", "title": "蝶恋花·学子吟", "genre": "蝶恋花", "body": "大考来临思绪乱。\n李戴张冠，\n闻却心神颤。\n数载寒窗星月伴，\n平生命运一息变。\n喜看包公出手办。\n污吏奸人，\n翻滚篷头面。\n听得此讯颜灿烂，\n挥毫奋笔清华见。 ​​​", "date": "2020.07.07", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4523956856355277 - 蝶恋花     学子吟/01.jpg"]}, {"id": "4523995149596441", "title": "采桑子·圆梦", "genre": "采桑子", "body": "夜来丝雨潇潇下，\n阵阵清风，\n吹散蒸笼，\n学子难得睡意浓。\n香眠恰助圆心梦，\n金榜题名，\n沐浴春风，\n跨马披花万紫红。 ​​​", "date": "2020.07.07", "themes": ["羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4523995149596441 - 采桑子        圆梦/01.jpg"]}, {"id": "4524063492882779", "title": "七绝·致学子", "genre": "七绝", "body": "（轱辘体）\n一\n莘莘学子跃龙门，\n题海畅游凭胆魂。\n一笔能圆十载梦，\n飞天莫忘故乡恩。\n二\n寒舍贫家几代人，\n莘莘学子跃龙门。\n而今昂首青山去，\n身正莫忧斜影痕。\n三\n寒暑春秋风雨雪，\n孤灯窗下熬心血。\n莘莘学子跃龙门，\n老少乡邻同喜悦。\n四\n家中二老妹兄贫，\n梦想于心常自温。\n处世为人遵法纪，\n莘莘学子跃龙门。", "date": "2020.07.07", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4524063492882779 - 七绝         致学子/01.jpg"]}, {"id": "4524139895882742", "title": "七律·七七寄怀", "genre": "七律", "body": "芦沟晓月映山川，\n今日已非倭寇年。\n四海风云凭我荡，\n九州江河任君还。\n南疆峻峻千峰翠，\n东海清波万里绵。\n惟有七七永牢记！\n昔时悲剧不重篇。 ​​​", "date": "2020.07.07", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4524139895882742 - 七律     七七寄怀/01.jpg", "冰雪诗词_全部图片/4524139895882742 - 七律     七七寄怀/02.jpg"]}, {"id": "4524319449566186", "title": "浣溪沙·天公助考", "genre": "浣溪沙", "body": "丝雨清风送晓凉，\n万千学子绪飞扬，\n奇思妙想著华章。\n书本阅读千万遍，\n试题攻克百十箱，\n千锤百炼状元郎。 ​​​", "date": "2020.07.08", "themes": ["羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4524319449566186 - 浣溪沙 天公助考/01.jpg"]}, {"id": "4524395484184992", "title": "西江月·岁月", "genre": "西江月", "body": "昔日苦读勤奋，\n平生乐善清贫。\n至今不忘最初心，\n笑看银丝斑鬓。\n几度山花烂漫，\n曾经海浪急频。\n得失不误挽清樽，\n雨雪风霜无恨。 ​​​", "date": "2020.07.08", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4524395484184992 - 西江月        岁月/01.jpg"]}, {"id": "4524683699358336", "title": "踏莎行·望京都", "genre": "踏莎行", "body": "阵阵雷声，\n潇潇暮雨。\n鸣莺啼燕双归去。\n庭轩萧索水潺湲，\n空阶台上愁绵续。\n白雾茫茫，\n兰烟缕缕。\n风前独自无言语。\n京城疫乱几时休？\n相思相望难相聚！ ​​​", "date": "2020.07.09", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4524683699358336 - 踏莎行      望京都/01.jpg"]}, {"id": "4524873412933019", "title": "五绝·遥望", "genre": "五绝", "body": "篱径翠竹新，\n云天风色深。\n隔屏千里望，\n犹有鸟鸣音。 ​​​", "date": "2020.07.09", "themes": ["羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4524873412933019 - 五绝     遥望/01.jpg"]}, {"id": "4525056439098934", "title": "踏莎行·高考后", "genre": "踏莎行", "body": "卸却包袱，\n放飞梦想，\n玩朋学侣轻松逛。\n近来度日总如年，\n撇开纸笔心神畅。\n先去江南，\n再游青藏，\n登山戏水云天望。\n盼着暑去妙音来，\n追随红叶清华上。 ​​​", "date": "2020.07.10", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4525056439098934 - 踏莎行     高考后/01.jpg", "冰雪诗词_全部图片/4525056439098934 - 踏莎行     高考后/02.jpg"]}, {"id": "4525087196605041", "title": "七绝·夏日雨后", "genre": "七绝", "body": "天霁云清醒耳眸，\n微风入夜似凉秋。\n悠闲漫步城河岸，\n倒影飞光竞碧流。 ​​​", "date": "2020.07.10", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4525087196605041 - 七绝    夏日雨后/01.jpg", "冰雪诗词_全部图片/4525087196605041 - 七绝    夏日雨后/02.jpg"]}, {"id": "4525445725230925", "title": "采桑子·战天灾", "genre": "采桑子", "body": "揪心屏望江南雨，\n水漫楼窗，\n风卷舟樯，\n毁路伤桥恁是狂。\n千军万马同心力，\n旗展声扬，\n车载人扛，\n固坝强堤昼夜忙。 ​​​", "date": "2020.07.11", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4525445725230925 - 采桑子    战天灾/01.jpg"]}, {"id": "4525454873522781", "title": "行香子·健身乐", "genre": "行香子", "body": "树下川前，漫步登山。\n斗寒暑，晓暮风烟。\n浑身匀称，步履翩翩。\n自睡得香，吃得好，顽得欢。\n鸟啭心闲，岭翠神安。\n交新友，故侣难偏。\n偶然远去，常聚尊前。\n对几声歌，几杯酒，几人酣。 ​​​", "date": "2020.07.11", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4525454873522781 - 行香子          健身乐/01.jpg"]}, {"id": "4525782812616618", "title": "七绝·乐善", "genre": "七绝", "body": "（轱辘体）\n一\n平凡乐善爱长留，\n似沐春风永不休。\n华夏子孙传万代，\n犹如江水向东流。\n二\n老少相亲释百愁，\n平凡乐善爱长留。\n乡邻和睦春常在，\n快乐生活无尽头。\n三\n绿水青山潇洒去，\n神州南北亲相聚。\n平凡乐善爱长留，\n触景生情吟古句。\n四\n人生在世几春秋，\n且莫寻常独自忧。\n三五相知心永伴，\n平凡乐善爱长留。", "date": "2020.07.12", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4525782812616618 - 七绝            乐善/01.jpg"]}, {"id": "4526178955723232", "title": "七律·仲夏寄语", "genre": "七律", "body": "连日阴凉似入秋，\n几宵沉睡不知愁。\n晓辉柳下闻莺语，\n夜暮河边理钓钩。\n风色宜人心不躁，\n云天舒雁翅无休。\n可怜多少商家苦，\n惟愿天闷汗水流。 ​​​", "date": "2020.07.13", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4526178955723232 - 七律    仲夏寄语/01.jpg"]}, {"id": "4526492879363031", "title": "七律·老有所乐", "genre": "七律", "body": "闲来戏水又登山，\n惬意逍遥年复年。\n处事平和谁恼恨，\n为人宽厚自神安。\n酒朋诗侣常相聚，\n飞韵猜拳俱笑颜。\n四海五湖情不尽，\n千山万岭与君欢。 ​​​", "date": "2020.07.14", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4526492879363031 - 七律 老有所乐/01.jpg"]}, {"id": "4526856375027116", "title": "水调歌头·楼院夏夜", "genre": "水调歌头", "body": "四处银灯照，\n一阵晚来风。\n孩童打闹嘻笑，\n稚脸悦眉峰。\n脚踏滑轮飞跃，\n手把单车横纵，\n欢快语声声。\n心里无忧虑，\n逢聚更从容。\n广场舞，歌声荡，\n满腔情。\n东边棋手相遇，\n西畔剑飞鸣。\n老少神怡心旷，\n满院飞光流影，\n花木乐融融。\n夜半情难尽，\n人去月胧明。", "date": "2020.07.15", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4526856375027116 - 水调歌头 楼院夏夜/01.jpg", "冰雪诗词_全部图片/4526856375027116 - 水调歌头 楼院夏夜/02.jpg", "冰雪诗词_全部图片/4526856375027116 - 水调歌头 楼院夏夜/03.jpg"]}, {"id": "4527217981528754", "title": "相见欢·庚子暑伏", "genre": "相见欢", "body": "晓来依旧频风，\n绪思清。\n草木欣欣花鸟俱从容。\n云空淡，莺声乱，\n日彤彤。\n早起行人眉展脸轻松。 ​​​", "date": "2020.07.16", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4527217981528754 - 相见欢         庚子暑伏/01.jpg"]}, {"id": "4527354129682491", "title": "七律·四姑娘山", "genre": "七律", "body": "雾掩云遮隐丽容，\n冰川九道越山峰。\n层林叠翠青烟起，\n溪水流芳白浪鸣。\n深谷柏杉争日月，\n漫川花草吻尘风。\n连天丝雨随来去，\n难挡游人乐趣行。 ​​​", "date": "2020.07.16", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4527354129682491 - 七律     四姑娘山/01.jpg", "冰雪诗词_全部图片/4527354129682491 - 七律     四姑娘山/02.jpg"]}, {"id": "4527582135978038", "title": "鹧鸪天·暮思", "genre": "鹧鸪天", "body": "向晚斜阳细柳垂，\n清馨庭院软风吹。\n亲邻饭后悠闲步，\n仰望长空倦鸟归。\n天色淡，漾星辉，\n疫情趋稳绪思飞。\n青山翠岭芳郊绿，\n踏浪出游共与谁。 ​​​", "date": "2020.07.17", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4527582135978038 - 鹧鸪天        暮思/01.jpg"]}, {"id": "4527947237299482", "title": "七绝·伏天", "genre": "七绝", "body": "夜袭骤雨却无风，\n清晓潮闷雾气腾。\n溽暑来临天色变，\n汗湿衣裤莫心惊。 ​​​", "date": "2020.07.18", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4527947237299482 - 七绝            伏天/01.jpg"]}, {"id": "4528309671560799", "title": "七绝·农院芳姿", "genre": "七绝", "body": "一.\n何处丝瓜两米长？\n农家小院菜花香。\n依墙藤蔓随人意，\n巧手谁能胜爹娘。\n二.\n丝瓜垂立比人高，\n青翠娉婷细柳腰。\n自使馨家添韵色，\n且随翁妪共逍遥。 ​​​", "date": "2020.07.19", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4528309671560799 - 七绝   农院芳姿/01.jpg", "冰雪诗词_全部图片/4528309671560799 - 七绝   农院芳姿/02.jpg"]}, {"id": "4528681445235077", "title": "七绝·荷塘垂钓", "genre": "七绝", "body": "荷芰亭亭碧水中，\n风姿难扰钓鱼翁。\n心神只在垂丝上，\n不问芳塘绿与红。 ​​​", "date": "2020.07.20", "themes": ["山水田园与闲居雅趣", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4528681445235077 - 七绝     荷塘垂钓/01.jpg"]}, {"id": "4529065510574431", "title": "浣溪沙·寄妻生日", "genre": "浣溪沙", "body": "退而不休来帝都，\n高楼深户总难出。\n为迎孙辈又读书。\n一日三餐心费尽，\n成年累月意无图。\n今朝惟愿子媳福。 ​​​", "date": "2020.07.21", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4529065510574431 - 浣溪沙 寄妻生日/01.jpg"]}, {"id": "4529394230233046", "title": "减字木兰花·家宴", "genre": "减字木兰花", "body": "花香萦面，\n精美蛋糕生日宴。\n子孝媳贤，\n语暖情深心底甜。\n灯柔气爽，\n和睦家庭福禄广。\n共盼娇孙，\n送子观音梦里亲。 ​​​", "date": "2020.07.22", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4529394230233046 - 减字木兰花 家宴/01.jpg"]}, {"id": "4529504633234677", "title": "七律·阆中张飞祠", "genre": "七律", "body": "镇守古城七载多，\n修文尚武不蹉跎。\n为消关羽生死恨，\n却被张达头颅割。\n身首失连千古怨，\n阴阳别恨万人说。\n可怜威猛三国将，\n黄土一堆野草坡。 ​​​", "date": "2020.07.22", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4529504633234677 - 七律 阆中张飞祠/01.jpg"]}, {"id": "4529759637475737", "title": "七绝·诗心", "genre": "七绝", "body": "（轱辘体）\n兰亭雅韵漾诗心，\n曲水流觞尽兴吟。\n明月清风桥上过，\n疏星闪闪似弹琴。\n才子佳人各觅寻，\n兰亭雅韵漾诗心。\n合情投意相携去，\n来往花前月下临。\n待到洞房红火日，\n两情相悦香罗系。\n兰亭雅韵漾诗心，\n地角天涯前后继。\n白头偕老醉花阴，\n赏月凭风望翠林。\n闲赋诗词合咏调，\n兰亭雅韵漾诗心。", "date": "2020.07.23", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4529759637475737 - 七绝             诗心/01.jpg"]}, {"id": "4529899744535536", "title": "破阵子·贺天问发射", "genre": "破阵子", "body": "胖五升空耀眼，\n千年天问成真。\n探索深空圆众梦，\n飞向火星憾吾心。\n茫茫宇宙巡。\n沉睡巨龙腾起，\n山川霄汉惊闻。\n今日兴国凭大志，\n自古安邦赖铁军。\n神州万里亲。 ​​​", "date": "2020.07.23", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4529899744535536 - 破阵子 贺天问发射/01.jpg"]}, {"id": "4530140946367051", "title": "七律·感怀", "genre": "七律", "body": "薄暮高楼感细风，\n朦胧淡月隐穹东。\n星空遥望千年远，\n心绪松舒百事通。\n路上人流奔似水，\n街边店影乱飘红。\n浮生如梦终无怨，\n不作随风起落蓬。 ​​​", "date": "2020.07.24", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4530140946367051 - 七律           感怀/01.jpg"]}, {"id": "4530888996029422", "title": "喝火令·暑夜庭院", "genre": "喝火令", "body": "日暮云霞炫，\n庭轩起阵风。\n暑天无躁绪思清。\n楼院彩灯初上，\n佳丽舞轻盈。\n童稚追逐闹，\n欢声溢草坪。\n渐疏星朗月分明。\n夜色如银，\n夜色亦多情，\n夜色绚光飞度。\n缤彩映长空。 ​​​", "date": "2020.07.26", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4530888996029422 - 喝火令 暑夜庭院/01.jpg"]}, {"id": "4531222338867796", "title": "山花子·老人劫", "genre": "山花子", "body": "羸弱登阶似越山，\n最宜扶杖缓趋前。\n一旦失足筋骨裂，\n痛延绵。\n坐卧不安愁永夜，\n心神无奈整天烦。\n美味佳肴难下咽，\n苦相连。 ​​​", "date": "2020.07.27", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4531222338867796 - 山花子    老人劫/01.jpg"]}, {"id": "4531582176333088", "title": "风入松·七二八寄怀", "genre": "风入松", "body": "又逢此日忆唐山，\n四十四年前。\n天崩地裂人悲泣，\n高楼倾，断壁残垣。\n内外全无音讯，\n妻离子散愁颜。\n神州南北手相牵，\n齐力克时艰。\n废墟之上建家园，\n新城立，楼密街宽。\n古老凤凰腾起，\n黎民百姓心甜。 ​​​", "date": "2020.07.28", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": []}, {"id": "4532401420372392", "title": "钗头凤·热", "genre": "钗头凤", "body": "食无味，宵难睡。\n溽湿浸遍厅堂柜。\n空调伴，频出汗。\n可行何处？炙闷连片。\n乱、乱、乱。\n人疲惫，心神累。\n苦烦无奈成双倍。\n谁能唤？天公办。\n雨风齐降，气清凉漫。\n盼、盼、盼。 ​​​", "date": "2020.07.30", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4532401420372392 - 钗头凤           热/01.jpg"]}, {"id": "4532653145460473", "title": "七律·三伏天", "genre": "七律", "body": "堪当酷热不虚名，\n静坐芳荫汗自盈。\n无奈蝉蛩声调软，\n悲催枝叶盼清风。\n水滴石板腾白雾，\n手触栏杆玉指红。\n耐受天光尘世考，\n方得安逸度余生。 ​​​", "date": "2020.07.31", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4532653145460473 - 七律        三伏天/01.jpg"]}, {"id": "4533018230788602", "title": "梅花引·八一颂", "genre": "梅花引", "body": "枪声响，城头上，\n燎原星火蒸蒸旺。\n工农情，井冈红，\n古田会议，\n旌旗色更浓。\n长征万里寰球望，\n抗日八年华夏壮。\n蒋匪平，碧空晴，\n威武之师，\n昂首踏征程。 ​​​", "date": "2020.08.01", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4533018230788602 - 梅花引    八一颂/01.jpg"]}, {"id": "4533095074637279", "title": "临江仙·庆八一", "genre": "临江仙", "body": "枪响南昌惊夜色，\n秋收起义成军。\n井冈山上聚红心。\n长征行万里，\n抗日为家亲。\n歼灭蒋匪宏大业，\n援朝抗美封神。\n赢得华夏有如今。\n钢枪跟党走，\n日月映忠魂。 ​​​", "date": "2020.08.01", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4533095074637279 - 临江仙    庆八一/01.jpg"]}, {"id": "4533225060309949", "title": "如梦令·子弟兵", "genre": "如梦令", "body": "疆场纵横威猛，\n抢险舍身英勇。\n可爱胜亲人，\n鱼水情深谁更？\n当敬、当敬，\n万语千言难颂！\n临江仙    庆八一\n枪响南昌惊夜色，\n秋收起义成军。\n井冈山上聚红心。\n长征行万里，\n抗日为家亲。\n歼灭蒋匪宏大业，\n援朝抗美封神。\n赢得华夏有如今。\n钢枪跟党走，\n日月映忠魂。\n梅花引    八一颂\n枪声响，城头上，\n燎原星火蒸蒸旺。\n工农情，井冈红，\n古田会议，\n旌旗色更浓。\n长征万里寰球望，\n抗日八年华夏壮。\n蒋匪平，碧空晴，\n威武之师，\n昂首踏征程。", "date": "2020.08.01", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4533225060309949 - 如梦令 子弟兵/01.jpg"]}, {"id": "4533753131830524", "title": "御街行·伏天雨后", "genre": "御街行", "body": "雨歇午后骄阳烈，\n树上蝉声切。\n无言花草忍天光，\n自是低头卷叶。\n桐荫人聚，\n频摇蒲扇，\n依旧难消热。\n黄昏风起飞莺雀，\n落日余辉谢。\n气凉人爽绪思平，\n暮色孩童欢跃。\n夜深人静，\n月移花影，\n渐渐酣声彻。 ​​​", "date": "2020.08.03", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4533753131830524 - 御街行 伏天雨后/01.jpg"]}, {"id": "4534107738997645", "title": "七律·杜甫草堂", "genre": "七律", "body": "诗圣旧居千古韵，\n书家墨宝与时新。\n水流溪径青荷翠。\n竹绕亭台老树亲。\n壁刻言辞龙凤舞，\n窗含花草映烟云。\n一朝迈步文香院，\n日后亦能词赋吟。 ​​​", "date": "2020.08.04", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4534107738997645 - 七律     杜甫草堂/01.jpg"]}, {"id": "4534465478525005", "title": "玉楼春·老人叹", "genre": "玉楼春", "body": "人老意疏伤病近，\n寡语孤闻心里闷。\n不识文字更无聊，\n耳背言迟疑懒问。\n风吹草动惊难禁，\n落叶飞声多少恨。\n一朝跌倒卧床头，\n苦痛无穷愁染鬓。 ​​​", "date": "2020.08.05", "themes": ["感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4534465478525005 - 玉楼春    老人叹/01.jpg"]}, {"id": "4534834574394085", "title": "减字木兰花·立秋前日", "genre": "减字木兰花", "body": "雨宵声切，\n晨晓依然珠打叶。\n暑气全消，\n触目清凉水漫漂。\n蝉蛩不语，\n碧绿池塘荷芰举。\n明日归秋，\n期待山川硕果收。 ​​​", "date": "2020.08.06", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4534834574394085 - 减字木兰花 立秋前日/01.jpg"]}, {"id": "4535191172814338", "title": "阮郎归·立秋有寄", "genre": "阮郎归", "body": "晓凉惊梦已初秋，\n年光似水流。\n镜中斑鬓岂须愁，\n诗情漾小楼。\n回首望，院清幽，\n柳蝉歌不休。\n鹰飞雁舞映双眸，\n云空万里柔。 ​​​", "date": "2020.08.07", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4535191172814338 - 阮郎归 立秋有寄/01.jpg"]}, {"id": "4535551703646870", "title": "七律·赠同龄", "genre": "七律", "body": "人逢花甲不得闲，\n老少两端天复年。\n父母至亲恩必报，\n儿孙极爱虑相连。\n东西忙碌虽无怨，\n上下奔波怎尽欢。\n愿有双头三五臂，\n家中琐事九肩担。 ​​​", "date": "2020.08.08", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4535551703646870 - 七律        赠同龄/01.jpg"]}, {"id": "4535912975568693", "title": "点绛唇·初秋晨光", "genre": "点绛唇", "body": "院静无风，\n长空遥望云光淡。\n出门晨练，\n迈步浑身汗。\n绿处人多，\n老少声歌乱。\n抬头看，\n舞姿飞旋，\n红穗刀枪剑。 ​​​", "date": "2020.08.09", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4535912975568693 - 点绛唇 初秋晨光/01.jpg"]}, {"id": "4536284997487661", "title": "清平乐·赠伪君", "genre": "清平乐", "body": "大洋彼岸，\n恶语胡言漫。\n不见出头来理断，\n却骂国民争辩。\n文辞自作聪明，\n偷梁换柱歪声。\n只许匪兵放火，\n杜绝百姓点灯？ ​​​", "date": "2020.08.10", "themes": ["家国情怀与时代歌咏", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4536284997487661 - 清平乐    赠伪君/01.jpg"]}, {"id": "4536648757153063", "title": "卜算子·有所思", "genre": "卜算子", "body": "域外疫情高，\n应对千般乱。\n政府轻敌百策疏，\n民众行思漫。\n同在地球村，\n心态相差万。\n信口胡言尽甩锅，\n百姓频遭难。 ​​​", "date": "2020.08.11", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4536648757153063 - 卜算子     有所思/01.jpg"]}, {"id": "4537038223450398", "title": "踏莎行·赠文朋诗侣", "genre": "踏莎行", "body": "韵海扬帆，\n文坛劲舞。\n蕴诗笔墨频飞度。\n律绝词赋领风骚，\n唐魂宋魄吟千古。\n鸣燕浮鹰，\n藏龙卧虎。\n碧空云淡争翔翥。\n神州南北映光辉，\n江河山岳情无数。 ​​​", "date": "2020.08.12", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4537038223450398 - 踏莎行 赠文朋诗侣/01.jpg"]}, {"id": "4537355618489742", "title": "采桑子·秋后伏雨", "genre": "采桑子", "body": "夜闷喜降倾盆雨，\n风骤雷急，\n叶落花凄，\n拂晓依然垂玉丝。\n中伏秋后消烦暑，\n高柳蝉嘶，\n不似前时，\n早晚风凉语调低。 ​​​", "date": "2020.08.13", "themes": ["感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4537355618489742 - 采桑子 秋后伏雨/01.jpg"]}, {"id": "4537718182251260", "title": "七绝·雨后故宫", "genre": "七绝", "body": "天霁楼台景色新，\n清波倒影更消魂。\n昔时百姓谁能见，\n今日疯传老少群。 ​​​", "date": "2020.08.14", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4537718182251260 - 七绝    雨后故宫/01.jpg", "冰雪诗词_全部图片/4537718182251260 - 七绝    雨后故宫/02.jpg"]}, {"id": "4538097020962421", "title": "清平乐·尘世人间", "genre": "清平乐", "body": "年光不住，\n斗转星河度。\n日月轮回寒又暑，\n尘世朝朝暮暮。\n人间万物兴衰，\n庭前花落花开。\n依重地规天意，\n得失无忌舒怀。 ​​​", "date": "2020.08.15", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4538097020962421 - 清平乐 尘世人间/01.jpg"]}, {"id": "4538221424024680", "title": "七绝·铭记", "genre": "七绝", "body": "日寇投降心未死，\n隔三差五事非生。\n今朝吾辈当同力，\n不负九泉英烈情。 ​​​", "date": "2020.08.15", "themes": ["怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4538221424024680 - 七绝            铭记/01.jpg"]}, {"id": "4538438835505473", "title": "鹧鸪天·南海风云", "genre": "鹧鸪天", "body": "域外搅局胡乱言，\n焦灼无奈跳台前。\n扭曲嘴脸人神恨，\n丑陋心魂魑魅欢。\n云水暗，浪涛翻，\n陈虾腐蟹映苍天。\n神州日丽山河壮，\n且看流星落野边。 ​​​", "date": "2020.08.16", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4538438835505473 - 鹧鸪天 南海风云/01.jpg"]}, {"id": "4538797884703546", "title": "清平乐·失道寡助", "genre": "清平乐", "body": "贼心费尽，\n提案遭人恨。\n昔日跟班浑不论，\n老大风光怎混。\n言行失道胡为，\n优先米帝难随。\n天下苦之久矣，\n今朝此幕怨谁！ ​​​", "date": "2020.08.17", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4538797884703546 - 清平乐 失道寡助/01.jpg"]}, {"id": "4538857716978752", "title": "七律·武隆天坑地缝", "genre": "七律", "body": "地裂奇坑百丈深，\n神工鬼斧不留痕。\n天生桥洞连环套，\n泉吐琼珠飞瀑频。\n四壁怪石人慨叹，\n一溪清水鸟鸣音。\n古来传颂多神密，\n今日穿行探伪真。 ​​​", "date": "2020.08.17", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4538857716978752 - 七律 武隆天坑地缝/01.jpg"]}, {"id": "4539154954454061", "title": "忆秦娥·秋思", "genre": "忆秦娥", "body": "年光逝，\n春花开落秋来矣。\n秋来矣，\n蝉声趋软，\n渐消暑气。\n风轻云淡神难静，\n家中老少心头事。\n心头事，\n昼思夜念，\n平安为寄。 ​​​", "date": "2020.08.18", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4539154954454061 - 忆秦娥         秋思/01.jpg"]}, {"id": "4539523776382567", "title": "南歌子·电之情", "genre": "南歌子", "body": "银线凌空越，\n高人线上行。\n云中漫舞远山横，\n俯瞰岭峰千里送光明。\n遥望江南北，\n凭借电传情。\n城乡万户乐融融，\n挥汗成川无悔写人生。 https://video.weibo.com/show?fid=1034:4539523669884937 ​​​", "date": "2020.08.19", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": []}, {"id": "4539661379183166", "title": "清平乐·武隆天坑地缝", "genre": "清平乐", "body": "天光一线，\n坑底云烟漫。\n百丈深渊从未见，\n远客寻游感叹。\n何方刀斧翩跹，\n何年飘落人间。\n惟有天神发力，\n轻轻撕裂山川。 ​​​", "date": "2020.08.19", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4539661379183166 - 清平乐 武隆天坑地缝/01.jpg"]}, {"id": "4539901872180810", "title": "梅花引·山水行", "genre": "梅花引", "body": "高台卧，小窗侧，风雨难阻远行客。\n懒观花，闲品茶，对酒当歌，乡野访人家。\n雁鹰同行山海道，惬意随心越芳草。\n桃红时，菊黄时，无穷往复，谁似老夫痴。 ​​​", "date": "2020.08.20", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4539901872180810 - 梅花引         山水行/01.jpg"]}, {"id": "4540247096950852", "title": "浣溪沙·遥思", "genre": "浣溪沙", "body": "在外儿心念老娘，\n日前病腿遇新伤。\n最愁宵昼不离床。\n陪护当中急有事，\n离开之后更思量。\n幸得俩妹尽周详。 ​​​", "date": "2020.08.21", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4540247096950852 - 浣溪沙        遥思/01.jpg"]}, {"id": "4540662349046544", "title": "清平乐·秋菊", "genre": "清平乐", "body": "晚晴云淡，\n五彩霞光漫。\n风色清新花满院，\n丛菊争香竞艳。\n当年陶氏钟情，\n赢得千古留名。\n每到金秋送爽，\n城乡映紫堆红。 ​​​", "date": "2020.08.22", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4540662349046544 - 清平乐        秋菊/01.jpg"]}, {"id": "4540986791037745", "title": "南乡子·秋思", "genre": "南乡子", "body": "游子各奔忙，\n木叶凭风老树黄。\n又是东篱当酒季，\n思量，\n何日窗前共把觞。\n少壮总呈强，\n山海寻游恣意狂。\n席地而眠天作被，\n荒唐，\n霜鬓更觉家饭香。 ​​​", "date": "2020.08.23", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4540986791037745 - 南乡子       秋思/01.jpg"]}, {"id": "4541349905566822", "title": "浣溪沙·赠黄毛", "genre": "浣溪沙", "body": "撒谎胡为瘾已深，\n内心黑暗影沉沉。\n神州花茂乱贼神。\n结派拉帮营恶势，\n吹风点火助阴魂。\n斜眉歪脸众人喷。 ​​​", "date": "2020.08.24", "themes": ["唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4541349905566822 - 浣溪沙    赠黄毛/01.jpg"]}, {"id": "4541744190074630", "title": "卜算子·七夕", "genre": "卜算子", "body": "千古鹊桥边，\n多少天仙恨？\n织女牛郎洒泪别，\n离苦言难尽。\n化作雨飘潇，\n却引人悲悯。\n天上不如尘世间，\n相爱凭缘分。 ​​​", "date": "2020.08.25", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4541744190074630 - 卜算子        七夕/01.jpg"]}, {"id": "4541826550469983", "title": "七绝·七夕怨", "genre": "七绝", "body": "又是鹊桥仙女泪，\n一年一度落人间。\n离多聚少千秋恨，\n何日长圆笑九天。\n七绝        七夕情\n牛郎织女彩云间，\n一岁一逢天水边。\n聚短别长心不悔，\n此情此景几千年。 ​​​", "date": "2020.08.25", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4541826550469983 - 七绝         七夕怨/01.jpg"]}, {"id": "4542073049713916", "title": "七绝·酌思", "genre": "七绝", "body": "人逢难事玉樽行，\n两盏三杯乱绪通。\n老酒一壶天地阔，\n凭高望远释愁情。 ​​​", "date": "2020.08.26", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4542073049713916 - 七绝           酌思/01.jpg"]}, {"id": "4542436133311349", "title": "七绝·闲咏", "genre": "七绝", "body": "人生逆旅且前行，\n莫管东西南北风。\n晴日偷闲把茶品，\n雨天笑对酒一盅。 ​​​", "date": "2020.08.27", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4542436133311349 - 七绝           闲咏/01.jpg"]}, {"id": "4542790753847070", "title": "夜游宫·七夕望", "genre": "夜游宫", "body": "廊叶秋声乍起，\n望弦月，雪辉千里。\n楼上凭栏聚眸子，\n眺星空，觅银河、天界事。\n都道七夕日，\n鹊桥上，情深语密。\n一岁一逢苦悲泣，\n牛女泪，落人间、竞淅沥。 ​​​", "date": "2020.08.28", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4542790753847070 - 夜游宫               七夕望/01.jpg"]}, {"id": "4543164196587765", "title": "七绝·叹李白", "genre": "七绝", "body": "凭酒赋诗山海行，\n惊天词句溢豪情。\n可怜一世难得志，\n无奈迷樽醉死生。 ​​​", "date": "2020.08.29", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4543164196587765 - 七绝        叹李白/01.jpg"]}, {"id": "4543538178818449", "title": "七绝·咏李白", "genre": "七绝", "body": "千古诗坛北斗星，\n豪情逸兴万年惊。\n殿前假旨羞权贵，\n傲视小人堪为峰。 ​​​", "date": "2020.08.30", "themes": ["家国情怀与时代歌咏", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4543538178818449 - 七绝        咏李白/01.jpg"]}, {"id": "4543888113799201", "title": "菩萨蛮·秋夜吟", "genre": "菩萨蛮", "body": "三伏早过依然热，\n蝉声未减人难乐。\n月下扇频摇，\n闲情趣话聊。\n鼠年多怪事，\n最数新冠疫。\n域外任逍遥，\n新坟竞日高。 ​​​", "date": "2020.08.31", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4543888113799201 - 菩萨蛮    秋夜吟/01.jpg"]}, {"id": "4544294700975287", "title": "七律·咏农家", "genre": "七律", "body": "世间最苦数黎民，\n阡陌耕耘日月辛。\n呵护田园凭己力，\n尊崇老幼尽身心。\n良言善事传家训，\n置地修房为子孙。\n儿女双全千古梦，\n可怜白发映黄昏。 ​​​", "date": "2020.09.01", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4544294700975287 - 七律        咏农家/01.jpg"]}, {"id": "4544615376226016", "title": "生查子·秋晓", "genre": "生查子", "body": "朝云漫卷飞，\n风色秋来早。\n红日映长空，\n群雁飘飖小。\n柳丝袅袅垂，\n叶底蝉声老。\n楼院起童音，\n老少追清晓。 ​​​", "date": "2020.09.02", "themes": ["感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4544615376226016 - 生查子 秋晓/01.jpg"]}, {"id": "4544992482430824", "title": "破阵子·铭记", "genre": "破阵子", "body": "抗日情怀激荡，\n英魂浩气长存。\n先烈芳名传万代，\n贼寇魔行警亿人。\n苍天爱恨分。\n世界风云涌动，\n飞言乱语时闻。\n吾辈子孙惟奋力，\n赢取神州万里春。\n山河日月新。 ​​​", "date": "2020.09.03", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4544992482430824 - 破阵子         铭记/01.jpg"]}, {"id": "4545342341906860", "title": "七绝·秋晓", "genre": "七绝", "body": "日月同辉万里秋，\n晓空雁鹤竞风流。\n菊黄恰似春红好，\n袅袅云烟小院幽。 ​​​", "date": "2020.09.04", "themes": ["山水田园与闲居雅趣", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4545342341906860 - 七绝           秋晓/01.jpg"]}, {"id": "4545709699764396", "title": "七绝·秋色", "genre": "七绝", "body": "（轱辘体）\n金风渡彩果儿鲜，\n冉冉秋阳笑脸甜。\n溪水远山云似画，\n无边花草竞娇颜。\n山野游人尽笑颜，\n金风渡彩果儿鲜。\n遥天鸿雁南飞去，\n戏水鸳鸯比蜜甜。\n俊男靓女两心甜，\n踏草穿林舞丽颜。\n遥望鹊桥心荡漾，\n金风渡彩果儿鲜。 ​​​", "date": "2020.09.05", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4545709699764396 - 七绝            秋色/01.jpg"]}, {"id": "4546072574169162", "title": "醉花阴·致敬军人", "genre": "醉花阴", "body": "平安岁月知多少，\n遥看边防哨。\n卧雪斗风寒，\n似火骄阳，\n时有豺狼闹。\n功勋将士终究老，\n请对他真好。\n激励后来人，\n发奋图强，\n万代山河笑。 ​​​", "date": "2020.09.06", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4546072574169162 - 醉花阴 致敬军人/01.jpg", "冰雪诗词_全部图片/4546072574169162 - 醉花阴 致敬军人/02.jpg"]}, {"id": "4546455798286572", "title": "醉花阴·变", "genre": "醉花阴", "body": "淮河南北橘和枳，\n本是一颗籽。\n水土不相同，\n形状微别，\n果味差千里。\n人生落地皆尘世，\n性善无差异。\n近赤或拥黑，\n日久潜移，\n颜色毋能比。 ​​​", "date": "2020.09.07", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4546455798286572 - 醉花阴           变/01.jpg"]}, {"id": "4546569838264886", "title": "卜算子·白露", "genre": "卜算子", "body": "风色正当时，\n云卷云飘落。\n遍处金秋雁鹤飞，\n天地悠悠过。\n将士枕金戈，\n骚客挥香墨。\n尚武崇文万里安，\n百姓樽前乐。 ​​​", "date": "2020.09.07", "themes": ["家国情怀与时代歌咏", "四时风光与节气流转", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4546569838264886 - 卜算子       白露/01.jpg"]}, {"id": "4546793080357152", "title": "采桑子·动车见闻", "genre": "采桑子", "body": "飞驰如箭山川去，\n甩落斜阳，\n树闪边窗，\n秋韵黄花遍地香。\n疫情过后趋活跃，\n南北通商，\n内外皆忙，\n鼎沸人声笑语扬。 ​​​", "date": "2020.09.08", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4546793080357152 - 采桑子 动车见闻/01.jpg"]}, {"id": "4547148883168011", "title": "临江仙·缅怀主席", "genre": "临江仙", "body": "今古奇才谁可比，\n世间文武绝伦。\n神州千古圣贤贫。\n无私心底阔，\n有爱为黎民。\n盖世功名传万代，\n惠及华夏儿孙。\n宏光浩气映人心。\n犹苍天地久，\n似日月长存。 ​​​", "date": "2020.09.09", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4547148883168011 - 临江仙 缅怀主席/01.jpg"]}, {"id": "4547522519632165", "title": "御街行·寄恩师", "genre": "御街行", "body": "讲台三尺终生站，\n桃李芬芳远。\n呕心沥血育新苗，\n笑脸慈祥满。\n言传身教，\n嘘寒问暖，\n解惑释人难。\n一生受益记犹深，\n梦里长相见。\n依稀又聚至君前，\n清泪盈双面。\n书香馥郁，\n师恩荡荡，\n心语千千万。 ​​​", "date": "2020.09.10", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4547522519632165 - 御街行    寄恩师/01.jpg"]}, {"id": "4547893777928643", "title": "渔家傲·电厂评审", "genre": "渔家傲", "body": "府谷深山忙昼夜，\n机炉几案人急切。\n文海书山逐字阅，\n熬心血，\n点滴只为厂飞跃。\n废寝忘食评与写，\n各方合作皆欢悦。\n楼下惜别言感谢，\n听秋叶，\n山中早晚寒风烈。 ​​​", "date": "2020.09.11", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4547893777928643 - 渔家傲 电厂评审/01.jpg"]}, {"id": "4548233026865339", "title": "七绝·飞行有寄", "genre": "七绝", "body": "滚滚白云足下踩，\n乘风破浪悦心怀。\n凝眸俯瞰山河秀，\n万里神州画卷开。 ​​​", "date": "2020.09.12", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4548233026865339 - 七绝    飞行有寄/01.jpg", "冰雪诗词_全部图片/4548233026865339 - 七绝    飞行有寄/02.jpg"]}, {"id": "4548612653057897", "title": "风入松·归来", "genre": "风入松", "body": "风轻日暮叶微黄，\n征雁映斜阳。\n归鸦栖树云烟淡，\n柳边菊，竞艳飞香。\n人静月移花影，\n空明星闪辉光。\n金秋夜半气清凉，\n樽酒热衷肠。\n奔波在外多年后，\n转头看，坎坷刚强。\n独自凭栏望远，\n温馨何似家乡。 ​​​", "date": "2020.09.13", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4548612653057897 - 风入松         归来/01.jpg"]}, {"id": "4548967583454609", "title": "减字木兰花·798艺术区", "genre": "减字木兰花", "body": "京都老厂，今日奇思叠妙想。\n旧壁残垣，粉彩黑白映九天。\n俊郎靓女，追梦求新檐下聚。\n暮色朝阳，意境朦胧万里香。 ​​​", "date": "2020.09.14", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4548967583454609 - 减字木兰花       798艺术区/01.jpg", "冰雪诗词_全部图片/4548967583454609 - 减字木兰花       798艺术区/02.jpg", "冰雪诗词_全部图片/4548967583454609 - 减字木兰花       798艺术区/03.jpg"]}, {"id": "4549322157067450", "title": "七绝·秋思", "genre": "七绝", "body": "西风扫过尽残荷，\n败草余香映旧波。\n花落蝉歇情未老，\n故乡人事梦中多。 ​​​", "date": "2020.09.15", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4549322157067450 - 七绝           秋思/01.jpg"]}, {"id": "4549688889706491", "title": "少年游·秋晓", "genre": "少年游", "body": "夜来纤雨晓清凉，\n风色近重阳。\n天高云淡，\n舞鹰飞雁，\n篱下漫花香。\n外出急促家中返，\n只为老爹娘。\n递水床头，\n身边谈笑，\n细语热衷肠。 ​​​", "date": "2020.09.16", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4549688889706491 - 少年游       秋晓/01.jpg"]}, {"id": "4550051525039546", "title": "七律·秋", "genre": "七律", "body": "西风舞彩染金秋，\n云淡空朗碧水流。\n赤绿橙黄峰岭漫，\n梨桃瓜果陌阡熟。\n蝉声渐老情难断，\n雁阵虽高意不休。\n此去衡阳还暂驻，\n明年春暖又回头。 ​​​", "date": "2020.09.17", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4550051525039546 - 七律               秋/01.jpg"]}, {"id": "4550413712359543", "title": "破阵子·铭记九一八", "genre": "破阵子", "body": "难忘当年今日，\n倭贼半夜炮轰。\n霎那间烟光四起，\n淫火侵烧北大营。\n可怜我众生。\n十四春秋惨烈，\n万千罪恶分明。\n抵赖模糊强盗事，\n妄想乾坤向后行。\n语出世界惊。 ​​​", "date": "2020.09.18", "themes": ["羁旅思乡与行吟纪游", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4550413712359543 - 破阵子 铭记九一八/01.jpg"]}, {"id": "4550450298755839", "title": "浪淘沙·居安思危", "genre": "浪淘沙", "body": "警报刺长空，\n唤起悲情。\n当年日寇炮声隆。\n东北无端频挑事，\n借故攻营。\n贼盗露真容，\n山海无宁。\n神州烈火淬英雄。\n十四春秋得胜利，\n石刻碑铭。 ​​​", "date": "2020.09.18", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4550450298755839 - 浪淘沙 居安思危/01.jpg"]}, {"id": "4550772370967803", "title": "浪淘沙·农家乐", "genre": "浪淘沙", "body": "秋色染农家，\n紫粉黄花。\n耄耋二老乐哈哈。\n当年梦里谁能想，\n海蟹河虾。\n小院众人夸，\n果菜鸡鸭。\n晨昏无虑理桑麻。\n多彩夕阳无限好，\n景秀神佳。 ​​​", "date": "2020.09.19", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4550772370967803 - 浪淘沙     农家乐/01.jpg", "冰雪诗词_全部图片/4550772370967803 - 浪淘沙     农家乐/02.jpg"]}, {"id": "4551132250638760", "title": "十六字令·秋", "genre": "十六字令", "body": "秋，\n花草黄红碧水流。\n云空丽，\n山海任君游。\n秋，\n如画山川映两眸。\n经行处，\n鸟啭果香稠。\n秋，\n水岸汀州起鹭鸥。\n鱼欢跃，\n轻荡木兰舟。 ​​​", "date": "2020.09.20", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4551132250638760 - 十六字令       秋/01.jpg"]}, {"id": "4551499252501671", "title": "南歌子·金秋寄怀", "genre": "南歌子", "body": "黄叶中秋近，\n银丝染鬓霜。\n人间天上月清朗，\n喜看金风碧水雁争翔。\n庚子年多事，\n啼乌噪雀慌。\n呲牙奋爪几番忙，\n难阻神州万里熠星光。 ​​​", "date": "2020.09.21", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4551499252501671 - 南歌子         金秋寄怀/01.jpg"]}, {"id": "4551863255172025", "title": "七律·秋分有寄", "genre": "七律", "body": "蝉声渐老昼宵均，\n庚子年光最费神。\n白日出行思口罩，\n夜深梦里念亲人。\n妻儿异地难相顾，\n父母同居病扰身。\n期盼晚秋天气爽，\n忧烦伤痛远家亲。 ​​​", "date": "2020.09.22", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4551863255172025 - 七律    秋分有寄/01.jpg"]}, {"id": "4552228574855476", "title": "七律·咏鸡有喻", "genre": "七律", "body": "（折腰）\n铁笼三尺把鸡圈，\n寸步难行日月年。\n无虑吃喝非自主，\n随音歌唱己难欢。\n失去自由她最苦，\n生得笨蛋为谁甜。\n若能遍野寻食去，\n最是开心尘世间。\n#中国诗词大会[超话]##中华好诗词##古诗词# ​​​", "date": "2020.09.23", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4552228574855476 - 七律    咏鸡有喻/01.jpg"]}, {"id": "4552594993186673", "title": "七绝·秋喜", "genre": "七绝", "body": "飞雨飘红满院香，\n可心冷暖度秋光。\n入眸风物招人喜，\n酒不盈怀意绪伤。 ​​​", "date": "2020.09.24", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4552594993186673 - 七绝           秋喜/01.jpg"]}, {"id": "4552950636616455", "title": "浪淘沙·晓闻有思", "genre": "浪淘沙", "body": "不意望朝霞，\n辉映黄花。\n行人早起又离家。\n如水车流急驶去，\n只为生涯？\n世道任谁夸，\n雨润风佳。\n辛勤劳作不愁发。\n且莫仰天期馅饼，\n手懒心暇。 ​​​", "date": "2020.09.25", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4552950636616455 - 浪淘沙 晓闻有思/01.jpg"]}, {"id": "4553313934643031", "title": "七绝·山海关", "genre": "七绝", "body": "长城入水水连天，\n阻断扰袭千百年。\n万里纵横绝险处，\n奇雄天下第一关。 ​​​", "date": "2020.09.26", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4553313934643031 - 七绝        山海关/01.jpg", "冰雪诗词_全部图片/4553313934643031 - 七绝        山海关/02.jpg", "冰雪诗词_全部图片/4553313934643031 - 七绝        山海关/03.jpg"]}, {"id": "4553492464666437", "title": "七绝·新诗旧韵", "genre": "七绝", "body": "泳雪\n昔日童鞋花色好，\n而今脚大穿来小。\n依然不愿置新鞋，\n却道当年颜料老。#中国诗词大会[超话]##中华好诗词##古诗词# ​​​", "date": "2020.09.26", "themes": ["家国情怀与时代歌咏", "感怀人生与自省述志"], "images": []}, {"id": "4553678604474895", "title": "减字木兰花·咏妻舞", "genre": "减字木兰花", "body": "翩跹起舞，\n锣鼓争鸣情自主。\n雅韵芳姿，\n月满金秋国庆时。\n人欢红炫，\n尽日风光花灿烂。\n花甲之身，\n心气弥高总是春。\n#中国诗词大会[超话]##中华好诗词##古诗词# ​​​", "date": "2020.09.27", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4553678604474895 - 减字木兰花 咏妻舞/01.jpg"]}, {"id": "4553781662452234", "title": "长相思·韵", "genre": "长相思", "body": "你吟诗，\n他吟诗，\n平水读音谁可知？\n倚猫说虎姿。\n人赋词，\n我赋词，\n新韵朗朗意境奇。\n山河景物滋。 ​​​", "date": "2020.09.27", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": []}, {"id": "4554049610846965", "title": "鹧鸪天·游侠", "genre": "鹧鸪天", "body": "世上如仙山水郎，\n古来豪迈俱疏狂。\n凭风踏浪江河去，\n诗赋文辞著华章。\n歌一首，酒三觞，\n每天潇洒胜侯王。\n珠楼玉阙难请进，\n仗剑独行向远方。 ​​​", "date": "2020.09.28", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4554049610846965 - 鹧鸪天        游侠/01.jpg"]}, {"id": "4554403308372381", "title": "西江月·金秋颂", "genre": "西江月", "body": "国庆中秋奇遇，\n红旗明月重辉。\n银空万里彩云飞，\n灯影星光交汇。\n燕舞莺鸣鸟乐，\n江涛海浪声威。\n故人欢聚不思归，\n心悦樽频陶醉。 ​​​", "date": "2020.09.29", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4554403308372381 - 西江月     金秋颂/01.jpg"]}, {"id": "4554774395750815", "title": "定风波·九三〇抒怀", "genre": "定风波", "body": "秋雨催寒晓色清，\n天安门下祭英灵。\n云淡风轻人伫静，\n心敬！\n追思先烈绪难平。\n华夏祥和千古梦，\n今幸！\n山河无恙任从容。\n纪念前贤凭自警，\n长醒！\n神州江海可安宁。 ​​​", "date": "2020.09.30", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4554774395750815 - 定风波 九三〇抒怀/01.jpg"]}, {"id": "4554907829404116", "title": "蝶恋花·缅怀先烈", "genre": "蝶恋花", "body": "静默无言齐肃立，\n纪念碑前，\n俱为英魂泣。\n浴血神州家万里，\n子孙代代心铭记。\n今日山河风景丽，\n矗立东方，\n国盛云天碧。\n带路连通欧亚体，\n且凭北斗龙腾起。 ​​​", "date": "2020.09.30", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4554907829404116 - 蝶恋花  缅怀先烈/01.jpg"]}, {"id": "4555137773735635", "title": "长相思·十一寄怀", "genre": "长相思", "body": "升国旗，\n敬国旗，\n玉露金秋红叶时。\n故人万里思。\n先辈期，\n吾辈期，\n锦绣神州天地齐。\n黎民百姓滋。 ​​​", "date": "2020.10.01", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4555137773735635 - 长相思 十一寄怀/01.jpg"]}, {"id": "4555512547383856", "title": "夜游宫·洛阳望月", "genre": "夜游宫", "body": "庚子中秋典礼，\n傍伊水、龙门开启。\n万众倾心聚眸子。\n歌舞妍，月明圆，\n灯火丽。\n自古都王地，\n俏牡丹，欣逢盛世。\n久卧中原又腾起。\n倚今宵，壮山河，\n赢人气。 ​​​", "date": "2020.10.02", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4555512547383856 - 夜游宫      洛阳望月/01.jpg"]}, {"id": "4555860371575743", "title": "七绝·银滩望月", "genre": "七绝", "body": "千里驱车观海月，\n清蟾戏水照无眠。\n广寒宫里飘丹桂，\n玉液清香溢世间。 ​​​", "date": "2020.10.03", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4555860371575743 - 七绝    银滩望月/01.jpg", "冰雪诗词_全部图片/4555860371575743 - 七绝    银滩望月/02.jpg", "冰雪诗词_全部图片/4555860371575743 - 七绝    银滩望月/03.jpg"]}, {"id": "4556208662644630", "title": "临江仙·银滩晓望", "genre": "临江仙", "body": "遥望海天升旭日，\n彩霞万里云飞。\n渔舟满载伴歌归。\n银滩鸥鹭起，\n燕雀树梢追。\n无际晴空心绪畅，\n闲行堤岸风吹。\n叶鸣蛩唱浪花催。\n金秋凭晓色，\n人道胜春晖。 ​​​", "date": "2020.10.04", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4556208662644630 - 临江仙 银滩晓望/01.jpg"]}, {"id": "4556240128842550", "title": "七绝·赠老特", "genre": "七绝", "body": "懂王不懂老天心，\n乱语胡为罪上身。\n尘世人间公道在，\n无关统领与平民。 ​​​", "date": "2020.10.04", "themes": ["感怀人生与自省述志", "唱和应酬与赠友之作"], "images": []}, {"id": "4556585898083922", "title": "八声甘州·银滩寄怀", "genre": "八声甘州", "body": "望水天空阔海鸥翔，\n正时令金秋。\n看白云舒卷，南飞鸿雁，\n影落汀洲。\n映岸芦花飘荡，\n远处隐渔舟。\n滚滚千层浪，\n涛涌潮流。\n四面气清霞灿，\n更斜阳冉冉，\n思绪难收。\n叹匆来急去，\n惟愿久居留。\n踏金沙、欢歌戏水，\n品果珍、享虾蟹山馐。\n凭昼夜，海风吹处，\n无影烦忧。", "date": "2020.10.05", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4556585898083922 - 八声甘州       银滩寄怀/01.jpg", "冰雪诗词_全部图片/4556585898083922 - 八声甘州       银滩寄怀/02.jpg", "冰雪诗词_全部图片/4556585898083922 - 八声甘州       银滩寄怀/03.jpg"]}, {"id": "4556947570036555", "title": "踏莎行·银滩夜欢舞", "genre": "踏莎行", "body": "月照长堤，涛鸣曲岸。\n海风阵阵歌声漫。\n群芳劲舞溢心怀，\n沙滩广场银花灿。\n夜色微寒，凉亭爆满。\n诚邀明月真情展。\n盛妆浓彩共秋声，\n双节喜气盈眉眼。 ​​​", "date": "2020.10.06", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4556947570036555 - 踏莎行    银滩夜欢舞/01.jpg", "冰雪诗词_全部图片/4556947570036555 - 踏莎行    银滩夜欢舞/02.jpg", "冰雪诗词_全部图片/4556947570036555 - 踏莎行    银滩夜欢舞/03.jpg"]}, {"id": "4557309902064996", "title": "水调歌头·十一颂", "genre": "水调歌头", "body": "秋日云天碧，\n山水好风光。\n神州国庆民奋，\n旗展舞飞扬。\n塞北江南红遍，\n燕舞蝉鸣竞秀，\n喜气遍城乡。\n草树迎人笑，\n街角溢花香。\n欣回首，\n情不尽，\n韵悠长。\n举国防疫，\n凝聚万众创辉煌。\n又为小康同进，\n北斗指明航向，\n江海映高阳。\n华夏齐心力，\n圆梦谱新章。 ​​​", "date": "2020.10.07", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4557309902064996 - 水调歌头  十一颂/01.jpg", "冰雪诗词_全部图片/4557309902064996 - 水调歌头  十一颂/02.jpg", "冰雪诗词_全部图片/4557309902064996 - 水调歌头  十一颂/03.jpg"]}, {"id": "4557663365236048", "title": "踏莎行·银滩日暮观潮", "genre": "踏莎行", "body": "浪滚山移，\n涛击壁立。\n轰隆震耳弥寒气。\n苍茫碧水望无边，\n霞光万道千辉熠。\n月挂星空，\n海连天地。\n秋光夜色凭栏倚。\n一人于世一微尘，\n万人凝聚擎天力。 ​​​", "date": "2020.10.08", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4557663365236048 - 踏莎行 银滩日暮观潮/01.jpg", "冰雪诗词_全部图片/4557663365236048 - 踏莎行 银滩日暮观潮/02.jpg"]}, {"id": "4557809876993575", "title": "浣溪沙·银滩早市", "genre": "浣溪沙", "body": "拂晓出门星月天，\n摆摊街巷肩并肩。\n清莹果菜蟹鱼鲜。\n北调南腔争问价，\n老翁少妇紧收钱。\n公平买卖两相欢。 ​​​", "date": "2020.10.08", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4557809876993575 - 浣溪沙 银滩早市/01.jpg", "冰雪诗词_全部图片/4557809876993575 - 浣溪沙 银滩早市/02.jpg"]}, {"id": "4558039061109864", "title": "踏莎行·养老绝佳地", "genre": "踏莎行", "body": "水岸晨辉，\n山前晚照。\n银滩秋色风光俏。\n八方远客慕名来，\n朝歌暮舞街头笑。\n院后楼前，\n南腔北调。\n古今趣事家常唠。\n一年一度总相逢，\n都说负氧能防老。 ​​​", "date": "2020.10.09", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4558039061109864 - 踏莎行 养老绝佳地/01.jpg", "冰雪诗词_全部图片/4558039061109864 - 踏莎行 养老绝佳地/02.jpg", "冰雪诗词_全部图片/4558039061109864 - 踏莎行 养老绝佳地/03.jpg"]}, {"id": "4558136951707706", "title": "七律·游银滩多福山", "genre": "七律", "body": "晨曦四射耀福山，\n木翠草葱风色仙。\n半米方池盈玉液，\n两排圆顶袅云烟。\n石阶千磴三潭落，\n花径九折一线天。\n越岭攀岩极远眺，\n秋光福禄纳心间。 ​​​", "date": "2020.10.09", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4558136951707706 - 七律 游银滩多福山/01.jpg", "冰雪诗词_全部图片/4558136951707706 - 七律 游银滩多福山/02.jpg", "冰雪诗词_全部图片/4558136951707706 - 七律 游银滩多福山/03.jpg"]}, {"id": "4558392750509553", "title": "渔家傲·游多福山", "genre": "渔家傲", "body": "十月多褔山灿烂，\n黄花红叶云空炫，\n曲径丛幽莺鸟啭。\n轻挥汗，\n飞身跃顶天池畔。\n香客游人盈笑脸，\n玉皇庙顶俯身瞰，\n楼伫银滩清水岸。\n高声唤，\n秋风漫卷英雄汉。 ​​​", "date": "2020.10.10", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4558392750509553 - 渔家傲 游多福山/01.jpg", "冰雪诗词_全部图片/4558392750509553 - 渔家傲 游多福山/02.jpg"]}, {"id": "4558573809437515", "title": "七绝·闻讯心惊", "genre": "七绝", "body": "正是丰华不惑年，\n秋宵梦里命归天。\n无心撒手突然去，\n留下痛伤家道残。 ​​​", "date": "2020.10.10", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4558573809437515 - 七绝    闻讯心惊/01.jpg"]}, {"id": "4558759542653961", "title": "减字木兰花·银滩夜雨", "genre": "减字木兰花", "body": "狂风彻夜，\n骤雨时歇时肆虐。\n木叶飘零，\n阵阵凄寒梦里惊。\n醒来无奈，\n静坐独思霄汉外。\n鸡唱窗明，\n山远海空天地平。 ​​​", "date": "2020.10.11", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4558759542653961 - 减字木兰花 银滩夜雨/01.jpg", "冰雪诗词_全部图片/4558759542653961 - 减字木兰花 银滩夜雨/02.jpg", "冰雪诗词_全部图片/4558759542653961 - 减字木兰花 银滩夜雨/03.jpg"]}, {"id": "4559124039206243", "title": "七绝·咏石榴", "genre": "七绝", "body": "一.\n娇容似火染窗彤，\n招引阶前燕雀鸣。\n风霜无奈心灵美，\n小院秋晖韵味浓。\n二.\n枝头冉冉舞裙红，\n绿叶悠悠晓露清。\n万千赤子同心聚，\n暮色秋光情意凝。 ​​​", "date": "2020.10.12", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4559124039206243 - 七绝       咏石榴/01.jpg", "冰雪诗词_全部图片/4559124039206243 - 七绝       咏石榴/02.jpg"]}, {"id": "4559487770298914", "title": "浣溪沙·海堤夜行", "genre": "浣溪沙", "body": "皓月繁星耀海空，\n波光潋滟水多情，\n夜深人静弄琴声。\n万里舞台风伴乐，\n千年涛浪共弦鸣。\n悠悠思绪落蟾宫。 ​​​", "date": "2020.10.13", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4559487770298914 - 浣溪沙 海堤夜行/01.jpg"]}, {"id": "4559649761668631", "title": "临江仙·圆梦", "genre": "临江仙", "body": "傍水依山昨日梦，\n银滩此刻成真。\n登高望远景萦身。\n出门天地阔，\n幽静少杂音。\n临近福山东海水，\n云空花木清新。\n夏秋风色最宜人。\n渔村亲远客，\n心醉乐晨昏。 ​​​", "date": "2020.10.13", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4559649761668631 - 临江仙       圆梦/01.jpg", "冰雪诗词_全部图片/4559649761668631 - 临江仙       圆梦/02.jpg", "冰雪诗词_全部图片/4559649761668631 - 临江仙       圆梦/03.jpg", "冰雪诗词_全部图片/4559649761668631 - 临江仙       圆梦/04.jpg", "冰雪诗词_全部图片/4559649761668631 - 临江仙       圆梦/05.jpg", "冰雪诗词_全部图片/4559649761668631 - 临江仙       圆梦/06.jpg"]}, {"id": "4559836375155001", "title": "七绝·芦花二首", "genre": "七绝", "body": "一.\n飘洒芦花染晚秋，\n不须谁赏自欢悠。\n为人行事皆如此，\n心里清安少乱愁。\n二.\n风摆苇丛飞浪花，\n芦塘深处有渔家。\n船头偶见金鱼跃，\n笑靥微微映晚霞。 ​​​", "date": "2020.10.14", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4559836375155001 - 七绝   芦花二首/01.jpg"]}, {"id": "4559954302736728", "title": "减字木兰花·秋雨闲赋", "genre": "减字木兰花", "body": "云飘雨落，\n窗外清风亲远客。\n节气宜人，\n望海休闲最销魂。\n琴音楼上，\n顿挫悠扬思绪畅。\n诗画品读，\n缕缕书香浸玉壶。 ​​​", "date": "2020.10.14", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4559954302736728 - 减字木兰花 秋雨闲赋/01.jpg"]}, {"id": "4560217109172752", "title": "虞美人·银滩独酌", "genre": "虞美人", "body": "楼台远眺银空月，\n千里思乡切。\n中秋已过近重阳，\n斜倚栏杆、\n飒飒北风凉。\n玉樽盈酒谁能语，\n独自频频举。\n无心邀月共干杯，\n寒气袭人、\n落叶几番催。 ​​​", "date": "2020.10.15", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4560217109172752 - 虞美人 银滩独酌/01.jpg", "冰雪诗词_全部图片/4560217109172752 - 虞美人 银滩独酌/02.jpg"]}, {"id": "4560571082478729", "title": "卜算子·秋日", "genre": "卜算子", "body": "雨过细风凉，\n纸扇收叠了。\n庭院桐荫渐渐稀，\n蝉响声声老。\n又是艳阳天，\n遥望高飞鸟。\n沐日迎风漫步行，\n无限情思好 。 ​​​", "date": "2020.10.16", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4560571082478729 - 卜算子       秋日/01.jpg", "冰雪诗词_全部图片/4560571082478729 - 卜算子       秋日/02.jpg", "冰雪诗词_全部图片/4560571082478729 - 卜算子       秋日/03.jpg"]}, {"id": "4560958700127858", "title": "七绝·深秋暮色", "genre": "七绝", "body": "赤绿黄橙映远天，\n谁人法力大无边。\n等闲信手丹青画，\n胜却尘间俏粉颜。 ​​​", "date": "2020.10.17", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4560958700127858 - 七绝    深秋暮色/01.jpg", "冰雪诗词_全部图片/4560958700127858 - 七绝    深秋暮色/02.jpg", "冰雪诗词_全部图片/4560958700127858 - 七绝    深秋暮色/03.jpg"]}, {"id": "4561297150321125", "title": "念奴娇·银滩夜行有寄", "genre": "念奴娇", "body": "月明波冷，\n望蟾光淡淡，\n夜色如银。\n潮退沙平风浪小，\n天海空阔宜人。\n静岸独行，\n银灯高照，\n星影伴蝉音。\n凭风惬意，\n低声赋咏诗吟。\n千里圆梦银滩，\n已深秋寒露，\n花木犹新。\n母爱乳山风色好，\n鱼蟹鲜果频频。\n远道而来，\n登山眺海，\n日久意情深。\n乡民好客，\n余生长作芳邻。", "date": "2020.10.18", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4561297150321125 - 念怒娇 银滩夜行有寄/01.jpg", "冰雪诗词_全部图片/4561297150321125 - 念怒娇 银滩夜行有寄/02.jpg", "冰雪诗词_全部图片/4561297150321125 - 念怒娇 银滩夜行有寄/03.jpg"]}, {"id": "4561656674522433", "title": "七绝·咏松三首", "genre": "七绝", "body": "时入金秋阵阵风，\n黄花红叶少蝉声。\n山崖挺立犹苍翠，\n笑看尘间几世雄。\n昂首青峦向碧空，\n暑寒无惧傲长风。\n一生笑对人间客，\n寂静悠悠不老翁。\n籽随风荡落坡崖，\n立志岭峰根叶发。\n雨雪冰霜浑不惧，\n一棵胜似万千花。 ​​​", "date": "2020.10.19", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4561656674522433 - 七绝    咏松三首/01.jpg", "冰雪诗词_全部图片/4561656674522433 - 七绝    咏松三首/02.jpg"]}, {"id": "4562019490209790", "title": "七绝·松", "genre": "七绝", "body": "（轱辘体）\n黄山顶上一棵颂，\n惊世风光在险峰。\n苍翠向天情韵远，\n倩姿迎客意无穷。\n千载白云万里风，\n黄山顶上一棵松。\n迎霜斗雪浑无怕，\n影弱身单不自轻。\n随处安身根入地，\n枝繁叶茂真神气。\n黄山顶上一棵松，\n激励世人当自立。\n诗吟词颂俱含情，\n南北东西雅韵声。\n五夜三天歌不尽，\n黄山顶上一棵松。", "date": "2020.10.20", "themes": ["山水田园与闲居雅趣", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4562019490209790 - 七绝               松/01.jpg", "冰雪诗词_全部图片/4562019490209790 - 七绝               松/02.jpg"]}, {"id": "4562383466406381", "title": "点绛唇·赠群友", "genre": "点绛唇", "body": "词赋江湖，\n诗情曲韵清波漾。\n偶飞花浪，\n舟上心神旷。\n鱼跃帆扬，\n把酒凭栏畅。\n高天望，\n鹭鸥争上，\n无限情怀荡。 ​​​", "date": "2020.10.21", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4562383466406381 - 点绛唇     赠群友/01.jpg", "冰雪诗词_全部图片/4562383466406381 - 点绛唇     赠群友/02.jpg"]}, {"id": "4562743505720966", "title": "七律·毛岸英", "genre": "七律", "body": "异域归来愤入朝，\n别离父母远新娇。\n闻鸡劲舞挥长剑，\n催马争前抖战袍。\n思想开明盈血气，\n言行得体飒姿骄。\n身遭不幸神州痛，\n领袖情怀举世昭。 ​​​", "date": "2020.10.22", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4562743505720966 - 七律        毛岸英/01.jpg", "冰雪诗词_全部图片/4562743505720966 - 七律        毛岸英/02.jpg", "冰雪诗词_全部图片/4562743505720966 - 七律        毛岸英/03.jpg"]}, {"id": "4563094779201329", "title": "踏莎行·战而扬威", "genre": "踏莎行", "body": "…入朝作战70周年\n举世心惊，\n超人胆魄。\n鸭绿江水千军过。\n援朝抗美保家园，\n同仇敌忾刀枪握。\n领袖儿先，\n黎民子跃。\n上甘岭上乌云破。\n国威远震屹东方，\n神龙昂首山河阔。 ​​​", "date": "2020.10.23", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4563094779201329 - 踏莎行  战而扬威/01.jpg", "冰雪诗词_全部图片/4563094779201329 - 踏莎行  战而扬威/02.jpg"]}, {"id": "4563218498851608", "title": "破阵子·大会观感", "genre": "破阵子", "body": "话语铿锵有力，\n掌声经久难息。\n参战英雄盈热泪，\n好汉今朝擎大旗，\n戎装谁可敌。\n收取台湾宝岛，\n神州山海统一。\n狼子野心当自碎，\n龙跃长空万里奇。\n苍天百姓期。 ​​​", "date": "2020.10.23", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4563218498851608 - 破阵子 大会观感/01.jpg"]}, {"id": "4563551077534180", "title": "江城子·重阳寄怀", "genre": "江城子", "body": "悠悠岁月又重阳，\n叶红黄  ，漫菊香。\n万里晴空 ， 鸿雁奋高翔。\n无悔春秋今更是，\n心不老  ，鬓微霜。\n尽情放眼路宽长，\n跨川江  ，越城乡。\n秀丽神州，山海赤旗扬。\n企盼春风化雨日，\n华夏梦 ，世无双。 ​​​", "date": "2020.10.24", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4563551077534180 - 江城子      重阳寄怀/01.jpg"]}, {"id": "4563845341777270", "title": "点绛唇·夜思", "genre": "点绛唇", "body": "九九重阳，\n凭栏遥望家亲苦。\n寄情三处，\n无限思难住。\n老少相离，\n新病添伤楚。\n斜阳暮，\n冷窗寒露，\n孤影灯前度。 ​​​", "date": "2020.10.25", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4563845341777270 - 点绛唇        夜思/01.jpg"]}, {"id": "4563961804752696", "title": "浣溪沙·抗美援朝寄怀", "genre": "浣溪沙", "body": "一战立威狼虎前，\n和平红利几十年。\n神州大地百花妍。\n敬重英雄风气正，\n缅怀历史忆先贤。\n豪情血脉永相传。 ​​​", "date": "2020.10.25", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4563961804752696 - 浣溪沙 抗美援朝寄怀/01.jpg"]}, {"id": "4564551448658231", "title": "青玉案·塞罕坝", "genre": "青玉案", "body": "茫茫沙漠无花树，\n更吹落，尘和土。\n竟日昏沉难辩路。\n水缺风大，\n少人稀物，\n四季黄龙舞。\n扎根坝上知青户，\n数秩春秋无所顾。\n绿化沙洲千百度。\n蓦然回首，\n鸟虫花木，\n满眼清幽处。 ​​​", "date": "2020.10.27", "themes": ["山水田园与闲居雅趣", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4564551448658231 - 青玉案     塞罕坝/01.jpg", "冰雪诗词_全部图片/4564551448658231 - 青玉案     塞罕坝/02.jpg", "冰雪诗词_全部图片/4564551448658231 - 青玉案     塞罕坝/03.jpg"]}, {"id": "4564928738629253", "title": "七绝·感怀", "genre": "七绝", "body": "人生于世万千难，\n雨雪风霜落眼前。\n跌倒扬头微笑过，\n红花翠叶映芳园。 ​​​", "date": "2020.10.28", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4564928738629253 - 七绝            感怀/01.jpg"]}, {"id": "4565310261428819", "title": "七绝·秋色", "genre": "七绝", "body": "满眼金黄人欲醉，\n云天辉染万千媚。\n斜阳馨暖胜春风，\n泼洒人间弥可贵。 ​​​", "date": "2020.10.29", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4565310261428819 - 七绝           秋色/01.jpg", "冰雪诗词_全部图片/4565310261428819 - 七绝           秋色/02.jpg", "冰雪诗词_全部图片/4565310261428819 - 七绝           秋色/03.jpg"]}, {"id": "4565775731921291", "title": "七绝·秋望金山岭", "genre": "七绝", "body": "车至山前正晚晴，\n映天苍翠染黄红。\n长城无语峰峦上，\n难挡深秋万里风。 ​​​", "date": "2020.10.30", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4565775731921291 - 七绝 秋望金山岭/01.jpg", "冰雪诗词_全部图片/4565775731921291 - 七绝 秋望金山岭/02.jpg", "冰雪诗词_全部图片/4565775731921291 - 七绝 秋望金山岭/03.jpg"]}, {"id": "4566027302339679", "title": "少年游·望金山岭长城", "genre": "少年游", "body": "京承路上，金山脚下，日暮舞云霞。\n岭坡苍郁，枫红欲燃，点点缀黄花。\n遥朓远山游人醉，寒叶撩衣纱。\n万里长城无言卧，凭栏望，乱啼鸦。\n七绝\n眺望金山万里秋，\n长城难阻帝王愁。\n不堪回首当年事，\n寂寞残墙过客游。", "date": "2020.10.31", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4566027302339679 - 望金山岭长城二首/01.jpg", "冰雪诗词_全部图片/4566027302339679 - 望金山岭长城二首/02.jpg", "冰雪诗词_全部图片/4566027302339679 - 望金山岭长城二首/03.jpg"]}, {"id": "4566373102257975", "title": "踏莎行·祝岳母生日", "genre": "踏莎行", "body": "华鬓欢朝，\n银丝笑晚。\n妪翁携手芳邻羡。\n冬阳夏雨品书香，\n风霜雪露心神淡。\n四世同堂，\n一家美满。\n木兰胜似无情汉。\n春秋南北俱相思，\n东西朝暮嘘寒暖。 ​​​", "date": "2020.11.01", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4566373102257975 - 踏莎行 祝岳母生日/01.jpg", "冰雪诗词_全部图片/4566373102257975 - 踏莎行 祝岳母生日/02.jpg"]}, {"id": "4566485110359395", "title": "七绝·银杏树", "genre": "七绝", "body": "曾经风雨叶金黄，\n笑对严寒傲雪霜。\n依旧挺拔春又绿，\n钟情大地与天长。 ​​​", "date": "2020.11.01", "themes": ["感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4566485110359395 - 七绝        银杏树/01.jpg", "冰雪诗词_全部图片/4566485110359395 - 七绝        银杏树/02.jpg", "冰雪诗词_全部图片/4566485110359395 - 七绝        银杏树/03.jpg"]}, {"id": "4566735837989639", "title": "水调歌头·避暑山庄", "genre": "水调歌头", "body": "自古风凉处，清帝建行宫。\n方圆十里苍翠，四面邈山峰。\n夏日烟波致爽，南木殿堂无虑，\n闻远近泉声。\n眺水芳岩秀，沐万壑松风。\n勤政殿，水心榭，冷香亭。\n云山松鹤清樾，赏万树莺鸣。\n烟雨楼中议事，素尚斋前谈笑，\n芝径念苍生。\n西岭晨霞落，夕照磬锤峰。", "date": "2020.11.02", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4566735837989639 - 水调歌头  避暑山庄/01.jpg", "冰雪诗词_全部图片/4566735837989639 - 水调歌头  避暑山庄/02.jpg", "冰雪诗词_全部图片/4566735837989639 - 水调歌头  避暑山庄/03.jpg", "冰雪诗词_全部图片/4566735837989639 - 水调歌头  避暑山庄/04.jpg", "冰雪诗词_全部图片/4566735837989639 - 水调歌头  避暑山庄/05.jpg", "冰雪诗词_全部图片/4566735837989639 - 水调歌头  避暑山庄/06.jpg"]}, {"id": "4567095671788276", "title": "七绝·赏菊感怀", "genre": "七绝", "body": "黄花也趁秋光老，\n天道轮回梅更俏。\n一夜东风百苑香，\n紫燕黄莺桃李笑。 ​​​", "date": "2020.11.03", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4567095671788276 - 七绝    赏菊感怀/01.jpg", "冰雪诗词_全部图片/4567095671788276 - 七绝    赏菊感怀/02.jpg", "冰雪诗词_全部图片/4567095671788276 - 七绝    赏菊感怀/03.jpg", "冰雪诗词_全部图片/4567095671788276 - 七绝    赏菊感怀/04.jpg"]}, {"id": "4567458952774683", "title": "七律·普宁普佑寺游感", "genre": "七律", "body": "天下清宁千古愿，\n皇家寺庙隐虚玄。\n人心所向佛门事，\n他念无生社稷安。\n教养官僧凭圣意，\n策驱百姓不挥鞭。\n铜炉香火天天旺，\n代代良民自苦甘。 ​​​", "date": "2020.11.04", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4567458952774683 - 七律 普宁普佑寺游感/01.jpg", "冰雪诗词_全部图片/4567458952774683 - 七律 普宁普佑寺游感/02.jpg"]}, {"id": "4567821306309250", "title": "相见欢·晓梦惊妻", "genre": "相见欢", "body": "醒来残月当楼，\n冷嗖嗖，\n一夜西风桐叶舞京秋。\n黄花乱，\n寒云卷，\n有人愁。\n晓梦惊魂枕泪暗啼流。 ​​​", "date": "2020.11.05", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4567821306309250 - 相见欢         晓梦惊妻/01.jpg"]}, {"id": "4567885140201860", "title": "七绝·遥看擂台", "genre": "七绝", "body": "各自称赢一夜间，\n冷嘲怒骂闹翻天。\n斯文扫地寻常事，\n俩老爷们怪可怜。 ​​​", "date": "2020.11.05", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4567885140201860 - 七绝     遥看擂台/01.jpg", "冰雪诗词_全部图片/4567885140201860 - 七绝     遥看擂台/02.jpg", "冰雪诗词_全部图片/4567885140201860 - 七绝     遥看擂台/03.jpg"]}, {"id": "4568172013292665", "title": "清平乐·活佛行宫", "genre": "清平乐", "body": "鎏金庙顶，\n突显皇恩盛。\n御笔题名趋者众，\n二百年来胜境。\n期求满藏一家，\n神州万里无瑕。\n达赖班禅二主，\n热河行住皆佳。 ​​​", "date": "2020.11.06", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4568172013292665 - 清平乐  活佛行宫/01.jpg", "冰雪诗词_全部图片/4568172013292665 - 清平乐  活佛行宫/02.jpg", "冰雪诗词_全部图片/4568172013292665 - 清平乐  活佛行宫/03.jpg", "冰雪诗词_全部图片/4568172013292665 - 清平乐  活佛行宫/04.jpg", "冰雪诗词_全部图片/4568172013292665 - 清平乐  活佛行宫/05.jpg", "冰雪诗词_全部图片/4568172013292665 - 清平乐  活佛行宫/06.jpg"]}, {"id": "4568537995418568", "title": "七绝·冬夜有感", "genre": "七绝", "body": "梦里寒来又立冬，\n掌灯欹枕绪无穷。\n遥思彼岸情和事，\n何脸说人黑与红？ ​​​", "date": "2020.11.07", "themes": ["四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4568537995418568 - 七绝    冬夜有感/01.jpg", "冰雪诗词_全部图片/4568537995418568 - 七绝    冬夜有感/02.jpg", "冰雪诗词_全部图片/4568537995418568 - 七绝    冬夜有感/03.jpg"]}, {"id": "4568900626809429", "title": "清平乐·鸡狗斗", "genre": "清平乐", "body": "岂知真假？\n各自说赢话。\n彼此隔空胡乱骂，\n别样文明灯塔。\n欣然台下吃瓜，\n可该偏向谁家？\n且看鸡飞狗跳，\n悠悠乐乐哈哈。 ​​​", "date": "2020.11.08", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4568900626809429 - 清平乐     鸡狗斗/01.jpg", "冰雪诗词_全部图片/4568900626809429 - 清平乐     鸡狗斗/02.jpg"]}, {"id": "4568995015688294", "title": "卜算子·迫不及待", "genre": "卜算子", "body": "墙破众人推，\n树倒猢狲散。\n驴象之争未定时，\n狼狗挑边站。\n昔日语缠绵，\n此刻无相伴。\n一哨从前受气人，\n纷泄心头怨。 ​​​", "date": "2020.11.08", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4568995015688294 - 英国法国还有德意印日韩等大国总统总理电贺拜登当选美总统！奥巴马、克林顿也电贺拜登/01.jpg"]}, {"id": "4569265783708608", "title": "减字木兰花·困兽", "genre": "减字木兰花", "body": "远观风景，\n对岸懂王心火盛。\n无奈选情，\n懊恼生疑喊不公。\n人浑嘴硬，\n斜眼黄毛常耍横。\n留恋王宫，\n痴梦随风或落空。 ​​​", "date": "2020.11.09", "themes": ["羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4569265783708608 - 减字木兰花 困兽/01.jpg"]}, {"id": "4569627789887683", "title": "点绛唇·游棒槌山", "genre": "点绛唇", "body": "遥望锤峰，\n神针定海乾坤转。\n绝除灾患，\n峻峻金蟾现。\n夕照秋山，\n苍翠红黄点。\n枫欲燃，\n叶飘风灿，\n暮色云烟漫。 ​​​", "date": "2020.11.10", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4569627789887683 - 点绛唇 游棒槌山/01.jpg", "冰雪诗词_全部图片/4569627789887683 - 点绛唇 游棒槌山/02.jpg", "冰雪诗词_全部图片/4569627789887683 - 点绛唇 游棒槌山/03.jpg", "冰雪诗词_全部图片/4569627789887683 - 点绛唇 游棒槌山/04.jpg"]}, {"id": "4569991527796596", "title": "点绛唇·寒夜思乡", "genre": "点绛唇", "body": "露冷风清，\n凭栏无语观星斗。\n蓦然回首，\n桐叶窗前瘦。\n无奈离亲，\n遥望家山久。\n娘知否？\n重阳别后，\n思念浓如酒。 ​​​", "date": "2020.11.11", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4569991527796596 - 点绛唇 寒夜思乡/01.jpg", "冰雪诗词_全部图片/4569991527796596 - 点绛唇 寒夜思乡/02.jpg", "冰雪诗词_全部图片/4569991527796596 - 点绛唇 寒夜思乡/03.jpg"]}, {"id": "4570357254588464", "title": "点绛唇·寄同窗", "genre": "点绛唇", "body": "谊厚情深，\n韶华共奋寒窗案。\n酒香茶酽，\n不惧斜辉晚。\n长忆当年，\n劲舞屠龙剑。\n楼头看，\n夕阳无限，\n红叶迎风炫。 ​​​", "date": "2020.11.12", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4570357254588464 - 点绛唇    寄同窗/01.jpg", "冰雪诗词_全部图片/4570357254588464 - 点绛唇    寄同窗/02.jpg"]}, {"id": "4570722842975472", "title": "七律·山庄温泉", "genre": "七律", "body": "泉汤午浴艳阳天，\n悠雅乐音萦远山。\n池净水滑人欲醉，\n风轻云淡叶蹁跹。\n一丛香草安神气，\n几片灵芝养玉颜。\n纵使三宫妃子笑，\n帝王有几若今欢？ ​​​", "date": "2020.11.13", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4570722842975472 - 七律     山庄温泉/01.jpg", "冰雪诗词_全部图片/4570722842975472 - 七律     山庄温泉/02.jpg", "冰雪诗词_全部图片/4570722842975472 - 七律     山庄温泉/03.jpg", "冰雪诗词_全部图片/4570722842975472 - 七律     山庄温泉/04.jpg"]}, {"id": "4571089264711721", "title": "踏莎行·人心向背", "genre": "踏莎行", "body": "众叛亲离，孤愁群奋。\n懂王四载人神恨。\n昔时盟友苦难堪，\n今朝对手怡心寸。\n老泪盈眸，黄毛乱鬓。\n被人抛弃心头困。\n不知自视却矫情，\n苍天有眼除骚棍。 ​​​", "date": "2020.11.14", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4571089264711721 - 踏莎行       人心向背/01.jpg", "冰雪诗词_全部图片/4571089264711721 - 踏莎行       人心向背/02.jpg", "冰雪诗词_全部图片/4571089264711721 - 踏莎行       人心向背/03.jpg"]}, {"id": "4571445588135665", "title": "踏莎行·远眺感怀", "genre": "踏莎行", "body": "滚滚车流，\n声声笛响。\n纵横灯火人来往。\n风霜寒暑不停歇，\n辛劳且为儿孙闯。\n两鬓华斑，\n一怀梦想。\n满腔心血滴滴淌。\n神州南北度春秋，\n回眸细把千红赏。 ​​​", "date": "2020.11.15", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4571445588135665 - 踏莎行 远眺感怀/01.jpg"]}, {"id": "4571809808652380", "title": "减字木兰花·对峙", "genre": "减字木兰花", "body": "白宫门外，\n火浪烟涛都不怪。\n荷弹携枪，\n老特粉丝痴欲狂。\n疫情谁顾，\n早被谎言蒙蔽住。\n败选难承，\n宣泄聊发痛苦情。 ​​​", "date": "2020.11.16", "themes": ["家国情怀与时代歌咏", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4571809808652380 - 减字木兰花 对峙/01.jpg", "冰雪诗词_全部图片/4571809808652380 - 减字木兰花 对峙/02.jpg", "冰雪诗词_全部图片/4571809808652380 - 减字木兰花 对峙/03.jpg", "冰雪诗词_全部图片/4571809808652380 - 减字木兰花 对峙/04.jpg"]}, {"id": "4572172275685342", "title": "七律·求学叹", "genre": "七律", "body": "望子成龙父母心，\n娇儿未降校区寻。\n都城旧院楼台破，\n学教新规钱袋贫。\n隐处一间茅厕价，\n他乡半片小楼群。\n可怜老少倾全力，\n只为将来彩凤临。\n注：学区房每平\n十几万多，落户\n6年方能入学。 ​​​", "date": "2020.11.17", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4572172275685342 - 七律        求学叹/01.jpg"]}, {"id": "4572533468695526", "title": "七绝·游唐家湾", "genre": "七绝", "body": "秋山小院望天门，\n叶浪松涛晓色新。\n岭舞云叠湖水碧，\n骆驼峰上最销魂。 ​​​", "date": "2020.11.18", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4572533468695526 - 七绝   游唐家湾/01.jpg", "冰雪诗词_全部图片/4572533468695526 - 七绝   游唐家湾/02.jpg", "冰雪诗词_全部图片/4572533468695526 - 七绝   游唐家湾/03.jpg"]}, {"id": "4572893633583184", "title": "采桑子·余晖", "genre": "采桑子", "body": "老来恰似秋光晚，\n鬓角飞霜，\n岁月沧桑，\n苦乐得失胸腹藏。\n余年宛若夕阳好，\n五彩霞光，\n韵味悠长，\n缓缓柔晖暖故乡。 ​​​", "date": "2020.11.19", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4572893633583184 - 采桑子       余晖/01.jpg", "冰雪诗词_全部图片/4572893633583184 - 采桑子       余晖/02.jpg"]}, {"id": "4573255451284943", "title": "清平乐·歪风斜景", "genre": "清平乐", "body": "输赢不认，\n胡搅添风韵。\n百姓难言多少恨，\n欲火熊烧更甚。\n宫中戏码迭新，\n街头杂乱纷纷。\n怒目持枪对峙，\n长空弥漫烟云。 ​​​", "date": "2020.11.20", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4573255451284943 - 清平乐 歪风斜景/01.jpg", "冰雪诗词_全部图片/4573255451284943 - 清平乐 歪风斜景/02.jpg"]}, {"id": "4573627682654977", "title": "小重山·冬晓望乡", "genre": "小重山", "body": "夜雨天寒更北风，\n晓来残叶舞、乱鸦鸣。\n楼头衰草映初冬，\n花无语、偶见水成冰。\n无奈滞都城，\n凭栏思二老、绪无穷。\n苍颜病腿耳还聋，\n行且慢、诸事莫匆匆。 ​​​", "date": "2020.11.21", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4573627682654977 - 小重山         冬晓望乡/01.jpg", "冰雪诗词_全部图片/4573627682654977 - 小重山         冬晓望乡/02.jpg"]}, {"id": "4573983041389763", "title": "五绝·今古恨", "genre": "五绝", "body": "人骄国力小，\n割地赔钱了。\n含恨泪滴流，\n尊严谈个鸟。\n打脸“宁要小\n民尊严，不\n要大国崛起” ​​​", "date": "2020.11.22", "themes": ["家国情怀与时代歌咏"], "images": ["冰雪诗词_全部图片/4573983041389763 - 五绝 今古恨/01.jpg"]}, {"id": "4574115295666920", "title": "踏莎行·生日抒怀", "genre": "踏莎行", "body": "落座人欢，铜锅家宴。\n欣逢小雪生辰见。\n五十八载度春秋，\n悠然回首心无憾。\n祖辈农夫，后生企管。\n都城遥望乡居远。\n喜期来月又添丁，\n阖家兴旺今朝愿。 ​​​", "date": "2020.11.22", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4574115295666920 - 踏莎行        生日抒怀/01.jpg", "冰雪诗词_全部图片/4574115295666920 - 踏莎行        生日抒怀/02.jpg"]}, {"id": "4574344732739506", "title": "卜算子·初冬有寄", "genre": "卜算子", "body": "节序不欺人，小雪准时到。\n风荡云空乱叶飞，残柳啼鸦闹。\n庭院粉红稀，楼外冰当道。\n老友重逢把酒欢，情奋千杯少。 ​​​", "date": "2020.11.23", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4574344732739506 - 卜算子             初冬有寄/01.jpg", "冰雪诗词_全部图片/4574344732739506 - 卜算子             初冬有寄/02.jpg"]}, {"id": "4574703094074018", "title": "七律·贺嫦娥五升空", "genre": "七律", "body": "又见嫦娥舞碧空，\n万里骄飞韵味浓。\n俯瞰神州山水秀，\n慕思人世蜡灯明。\n千年寂寞今朝去，\n一缕欢欣天地同。\n辛苦不辞凭昼夜，\n聚凝华夏月圆情。 ​​​", "date": "2020.11.24", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4574703094074018 - 七律 贺嫦娥五升空/01.jpg"]}, {"id": "4575071236786935", "title": "木兰花·触景感怀", "genre": "木兰花", "body": "惊风又起疏篱院，\n萧瑟菊花争舞乱。\n远山斜照映塘中，\n潋滟清波吹不断。\n人生宛若游丝短，\n心事且行当莫缓。\n流年易逝恨无长，\n不意苍颜霜鬓染。 ​​​", "date": "2020.11.25", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4575071236786935 - 木兰花 触景感怀/01.jpg", "冰雪诗词_全部图片/4575071236786935 - 木兰花 触景感怀/02.jpg", "冰雪诗词_全部图片/4575071236786935 - 木兰花 触景感怀/03.jpg"]}, {"id": "4575431681909851", "title": "蝶恋花·寄友抒怀", "genre": "蝶恋花", "body": "莫对黄花孤负酒，\n畅饮高歌，\n笑过重阳九。\n谁道老来心怀瘦，\n亲山乐水诗情秀。\n一曲新词思故旧，\n锦色芳华，\n山海常携手。\n无悔当初南北走，\n凭栏遥望推心友。 ​​​", "date": "2020.11.26", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4575431681909851 - 蝶恋花 寄友抒怀/01.jpg", "冰雪诗词_全部图片/4575431681909851 - 蝶恋花 寄友抒怀/02.jpg", "冰雪诗词_全部图片/4575431681909851 - 蝶恋花 寄友抒怀/03.jpg"]}, {"id": "4575793579035576", "title": "鹧鸪天·遣怀", "genre": "鹧鸪天", "body": "一介书生鬓染霜，\n半生江海任疏狂。\n搏涛击浪风云后，\n赏月观花倚草堂。\n别闹市、近书香，\n文情诗韵漫幽窗。\n晴天几案茶一盏，\n雨夜灯前酒半觞。 ​​​", "date": "2020.11.27", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4575793579035576 - 鹧鸪天        遣怀/01.jpg", "冰雪诗词_全部图片/4575793579035576 - 鹧鸪天        遣怀/02.jpg"]}, {"id": "4576154110135352", "title": "卜算子·咏松柏", "genre": "卜算子", "body": "野外傲秋风，苍干峥峥骨。\n枝叶悠悠翠不衰，无惧寒冬苦。\n伫立越千年，涛浪犹天鼓。\n岁月无言人世非，笑看雄鹰舞。 ​​​", "date": "2020.11.28", "themes": ["感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4576154110135352 - 卜算子        咏松柏/01.jpg", "冰雪诗词_全部图片/4576154110135352 - 卜算子        咏松柏/02.jpg"]}, {"id": "4576520092254702", "title": "踏莎行·冬夜思", "genre": "踏莎行", "body": "日暮灯红，\n冷风明月。\n中庭残柳栖鸦雀。\n行人稀少院清清，\n疏桐零乱寒声咽。\n时序逢冬，\n银空欲雪。\n千山万岭芳香谢。\n墙梅独自笑长天。\n迎春玉蕊娇人靥。 ​​​", "date": "2020.11.29", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4576520092254702 - 踏莎行    冬夜思/01.jpg", "冰雪诗词_全部图片/4576520092254702 - 踏莎行    冬夜思/02.jpg", "冰雪诗词_全部图片/4576520092254702 - 踏莎行    冬夜思/03.jpg", "冰雪诗词_全部图片/4576520092254702 - 踏莎行    冬夜思/04.jpg"]}, {"id": "4576886879945866", "title": "七绝·望雪寻梅", "genre": "七绝", "body": "北风吹雪雪天寒，\n银粟茫茫覆岭川。\n放眼云空无翠鸟，\n回眸玉蕊绽篱边。 ​​​", "date": "2020.11.30", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4576886879945866 - 七绝    望雪寻梅/01.jpg", "冰雪诗词_全部图片/4576886879945866 - 七绝    望雪寻梅/02.jpg"]}, {"id": "4577242779489058", "title": "七律·都城闲咏", "genre": "七律", "body": "清冷微风晓色明。\n层楼庭院舞红灯。\n商家造市求出货，\n物业搭台赚美名。\n午后舒心人漫步，\n柳前惬意鸟争鸣。\n冬寒虽甚神州暖，\n不道西方乱疫情。 ​​​", "date": "2020.12.01", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4577242779489058 - 七律    都城闲咏/01.jpg", "冰雪诗词_全部图片/4577242779489058 - 七律    都城闲咏/02.jpg"]}, {"id": "4577604834692032", "title": "少年游·平湖秋色", "genre": "少年游", "body": "秋风弄影，老鱼吹浪，\n水岸映芦花。\n湖光潋滟，飘枫如画，\n声渺隐歌娃。\n远处夕阳悠然落，\n暮色赛朝华。\n摇橹荡舟心怡事，\n情难尽，戏莎沙。 ​​​", "date": "2020.12.02", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4577604834692032 - 少年游       平湖秋色/01.jpg", "冰雪诗词_全部图片/4577604834692032 - 少年游       平湖秋色/02.jpg"]}, {"id": "4577966577161789", "title": "清平乐·冬晓心奋", "genre": "清平乐", "body": "月残风冷，\n晨练催人醒。\n杠上飞身双臂挺，\n翻转腾空立定。\n人称腿脚非凡，\n自觉不抵当年。\n已是风霜白发，\n心神还似从前。 ​​​", "date": "2020.12.03", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4577966577161789 - 清平乐 冬晓心奋/01.jpg", "冰雪诗词_全部图片/4577966577161789 - 清平乐 冬晓心奋/02.jpg", "冰雪诗词_全部图片/4577966577161789 - 清平乐 冬晓心奋/03.jpg", "冰雪诗词_全部图片/4577966577161789 - 清平乐 冬晓心奋/04.jpg"]}, {"id": "4578331553434390", "title": "七律·望黄鹤楼", "genre": "七律", "body": "白云千载绕空楼，\n独立江边水自流。\n墨客文人诗并赋，\n彩亭碑字毁重修。\n古人期盼春江绿，\n今子莫发秋日愁。\n地北天南楼上客，\n只宜潇洒乐悠悠。 ​​​", "date": "2020.12.04", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4578331553434390 - 七律    望黄鹤楼/01.jpg", "冰雪诗词_全部图片/4578331553434390 - 七律    望黄鹤楼/02.jpg"]}, {"id": "4578694892360313", "title": "七律·黄鹤楼寄怀", "genre": "七律", "body": "疫去众来黄鹤楼，\n登高望远散忧愁。\n龟山蔼蔼尖峰翠，\n汉水清清细浪流。\n岁末年初瘟肆虐，\n江头秋暮起飞鸥。\n若得仙鹤今朝至，\n盛叹萋萋鹦鹉洲。 ​​​", "date": "2020.12.05", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "
