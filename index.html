 "4961028079092544", "title": "七绝·暮秋吟", "genre": "七绝", "body": "寒风卷叶命由天，\n人事消磨难两全。\n遥望云空穷碧落，\n霞晖飞渡万重山。 ​​​", "date": "2023.10.26", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4961028079092544 - 七绝        暮秋吟/01.jpg"]}, {"id": "4961373299411041", "title": "七绝·吟怀", "genre": "七绝", "body": "人生尽处己无知，\n怎奈亲朋泪眼痴。\n自古养儿防病老，\n今朝孝女榻前栖。 ​​​", "date": "2023.10.27", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4961373299411041 - 七绝           吟怀/01.jpg"]}, {"id": "4961773503382135", "title": "七绝·归如箭", "genre": "七绝", "body": "京城古冶快车行，\n秋景难留断雁鸣。\n黄叶悲催寒意切，\n西风撩乱老梧桐。 ​​​", "date": "2023.10.28", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4961773503382135 - 七绝       归如箭/01.jpg"]}, {"id": "4962128065201113", "title": "七绝·暮秋吟", "genre": "七绝", "body": "黄叶飘零亿万千，\n随风落处自心安。\n久依枝干多牵挂，\n此去断离尘世缘。 ​​​", "date": "2023.10.29", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4962128065201113 - 七绝       暮秋吟/01.jpg"]}, {"id": "4962486338454480", "title": "七绝·秋日吟", "genre": "七绝", "body": "雾笼飘窗暗晓天，\n予心沉闷守床边。\n曾闻岳母逐宵瘦，\n仍被形容骇胆肝。 ​​​", "date": "2023.10.30", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱"], "images": ["冰雪诗词_全部图片/4962486338454480 - 七绝       秋日吟/01.jpg"]}, {"id": "4963205614146574", "title": "天净沙·秋窗寄怀", "genre": "天净沙", "body": "轻阴薄雾尘天。\n细风黄叶飞烟。\n眺望难寻断雁。\n床头忍见。\n骨尖神滞衰颜。 ​​​", "date": "2023.11.01", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4963205614146574 - ​天净沙 秋窗寄怀/01.jpg"]}, {"id": "4963569299360262", "title": "西江月·暮秋吟", "genre": "西江月", "body": "黄叶秋冬漫落，\n青条春夏欣丰。\n此番情景若人生。\n万物命由天定。\n想象因人而异，\n忧愁自古相同。\n名财功利害无穷。\n世事沉浮如梦。 ​​​", "date": "2023.11.02", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4963569299360262 - 西江月    暮秋吟/01.jpg"]}, {"id": "4965375289593834", "title": "五律·痛悼岳母", "genre": "五律", "body": "雨送先人去，\n风悲孝女心。\n八十七载路，\n一世善为人。\n家婿眸含泪，\n外孙怀感恩。\n目亲乘鹤远，\n仙界万年春。 ​​​", "date": "2023.11.07", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4965375289593834 - 五律 痛悼岳母/01.jpg"]}, {"id": "4965834202810088", "title": "鹧鸪天·立冬寄怀", "genre": "鹧鸪天", "body": "亲去床空夜色沉，\n临窗星月意情真。\n蟾光缕缕频相顾，\n桐叶悄悄探旧邻。\n容不在，静无音。\n冷香寒蜡袅烟尘。\n飞霜滴露千般痛，\n悲不堪言泪染襟。 ​​​", "date": "2023.11.08", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4965834202810088 - 鹧鸪天 立冬寄怀/01.jpg"]}, {"id": "4966089364604523", "title": "七律·代妻吟", "genre": "七律", "body": "老娘仙逝女白头，\n胸底堆积无限愁。\n谁可解开思念扣，\n何人能闭泪泉流。\n寒风吹荡悲情切，\n落叶飞飘痛苦尤。\n更恨当初病来迅，\n家亲心愿未曾留。 ​​​", "date": "2023.11.09", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4966089364604523 - 七律       代妻吟/01.jpg"]}, {"id": "4966456359125233", "title": "七绝·初冬吟", "genre": "七绝", "body": "人生长卷写春秋，\n字里云烟染喜忧。\n书过今朝成往事，\n章残笔落子孙留。 ​​​", "date": "2023.11.10", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4966456359125233 - 七绝       初冬吟/01.jpg"]}, {"id": "4966817284491608", "title": "虞美人·初冬夜吟", "genre": "虞美人", "body": "秋冬转换心怀冷，\n叶落风难定。\n床头不见旧音容，\n往日灯光彻夜、映苍穹。\n星空万里悲情递，\n百念凭风寄。\n愿亲乘鹤去无忧，\n碧落云霄俱事、不须愁。 ​​​", "date": "2023.11.11", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4966817284491608 - 虞美人   初冬夜吟/01.jpg"]}, {"id": "4967641140957434", "title": "五律·先人居", "genre": "五律", "body": "黄泉三尺土，\n十万雪花银。\n逝者安眠地，\n来生富贵身。\n出行龙马伴，\n坐卧使佣人。\n玉女金童俏，\n山桃水鸟亲。 ​​​", "date": "2023.11.13", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4967641140957434 - ​五律 先人居/01.jpg"]}, {"id": "4969006068665077", "title": "临江仙·初冬寄怀", "genre": "临江仙", "body": "窗外寒风黄叶落，\n阳台暖意融融。\n绿萝抖擞满怀情。\n吊兰依角立，\n妻子理芳丛。\n前日悲伤思绪甚，\n无心青翠娇红。\n任由架倒瓦盆横。\n今朝精打扮，\n旧貌换新容。 ​​​", "date": "2023.11.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4969006068665077 - 临江仙 初冬寄怀/01.jpg"]}, {"id": "4969365345142557", "title": "踏莎行·吟望", "genre": "踏莎行", "body": "侧脸无情，\n横眉冷对。\n不知下句谁遭罪。\n为防失态恁揪心，\n有谁能晓今番累。\n人老言迟，\n枝残花坠。\n寒蛩秋暮嘶声废。\n奈何统领却贪权，\n案前议事常昏睡。 ​​​", "date": "2023.11.18", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4969365345142557 - ​踏莎行       吟望/01.jpg"]}, {"id": "4970171733643301", "title": "渔家傲·闻事吟", "genre": "渔家傲", "body": "果敢明家应早料，\n横行犯法终遭报。\n子女风光挥镣铐。\n天地笑，\n枝头莺雀频欢叫。\n在外出行须看道，\n遵规守矩休胡闹。\n肥己害人逃不掉。\n天地妙，\n人间善恶皆知晓。 ​​​", "date": "2023.11.20", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4970171733643301 - ​渔家傲    闻事吟/01.jpg"]}, {"id": "4970483096486500", "title": "七绝·童智", "genre": "七绝", "body": "父女离京古冶来，\n觅爷恋奶乐开怀。\n半年已过家犹记，\n抬手推门不用猜。 ​​​", "date": "2023.11.21", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4970483096486500 - 七绝           童智/01.jpg", "冰雪诗词_全部图片/4970483096486500 - 七绝           童智/02.jpg"]}, {"id": "4970836768852073", "title": "浣溪沙·玩童", "genre": "浣溪沙", "body": "三岁将临小若煊。\n弯眉纤手靥辉圆，\n朱唇乌发笑声连。\n蹦跳轻盈如玉兔，\n歌吟婉转似银蝉。\n明眸灵动舞风前。 ​​​", "date": "2023.11.22", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4970836768852073 - 浣溪沙        玩童/01.jpg"]}, {"id": "4971537057717665", "title": "七绝·冬日闲吟", "genre": "七绝", "body": "寒流无意刻窗花，\n黄叶多情恋晓鸦。\n不忍别离含泪去，\n飘零何处可安家。 ​​​", "date": "2023.11.24", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4971537057717665 - 七绝    冬日闲吟/01.jpg"]}, {"id": "4971914233905358", "title": "鹧鸪天·小保洁", "genre": "鹧鸪天", "body": "个比拖杆矮一截，\n埋头擦地影痕斜。\n腰身转动眉飞舞，\n腿脚开合体欲跌。\n人瘦小，手无歇。\n厅堂卧室渐光洁。\n女童欢乐阖家喜，\n最是开心还数爷。 ​​​", "date": "2023.11.25", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4971914233905358 - ​鹧鸪天    小保洁/01.jpg", "冰雪诗词_全部图片/4971914233905358 - ​鹧鸪天    小保洁/02.jpg", "冰雪诗词_全部图片/4971914233905358 - ​鹧鸪天    小保洁/03.jpg"]}, {"id": "4972317806430304", "title": "浣溪沙·冬日吟望", "genre": "浣溪沙", "body": "小雪时来冷不休，\n霜花摇拽挂枝头。\n丹枫红叶胜深秋。\n一抹青辉霄汉阔，\n无边绿色覆阡畴。\n农闲望麦少烦忧。 ​​​", "date": "2023.11.26", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4972317806430304 - 浣溪沙 冬日吟望/01.jpg"]}, {"id": "4972998629262025", "title": "七绝·杂趣", "genre": "七绝", "body": "锅中螃蟹不甘心，\n乱舞尖钳向我孙。\n幼女围观忽近远，\n既欢又怕耍童真。 ​​​", "date": "2023.11.28", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4972998629262025 - 七绝          杂趣/01.jpg"]}, {"id": "4973732634038481", "title": "七绝·家趣", "genre": "七绝", "body": "小手纤纤挑绿豆，\n追随奶奶看生芽。\n每天睡眼轻声问，\n终见银针这大啦。 ​​​", "date": "2023.11.30", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4973732634038481 - 七绝           家趣/01.jpg"]}, {"id": "4974116430680530", "title": "踏莎行·图趣", "genre": "踏莎行", "body": "蓝色梯形，\n桔红三角\n多边方块拼图妙。\n荷花莲叶趣成辉，\n齿轮转过时光好。\n动静结合，\n神魂颠倒。\n祖孙同乐终昏晓。\n协调手脑利身心，\n幼童健长爷难老。 ​​​", "date": "2023.12.01", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4974116430680530 - 踏莎行        图趣/01.jpg", "冰雪诗词_全部图片/4974116430680530 - 踏莎行        图趣/02.jpg", "冰雪诗词_全部图片/4974116430680530 - 踏莎行        图趣/03.jpg", "冰雪诗词_全部图片/4974116430680530 - 踏莎行        图趣/04.jpg", "冰雪诗词_全部图片/4974116430680530 - 踏莎行        图趣/05.jpg", "冰雪诗词_全部图片/4974116430680530 - 踏莎行        图趣/06.jpg"]}, {"id": "4974814652272972", "title": "蝶恋花·吟望", "genre": "蝶恋花", "body": "苦难人生衰老易。\n青发朱颜，\n还有谁能记。\n日暮青灯冬夜里，\n打窗风雪寒声递。\n慕富嫌贫今古世。\n打破头皮，\n踮脚争名利。\n穷困爹娘徒有子，\n门前寥落悲无计。 ​​​", "date": "2023.12.03", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4974814652272972 - 蝶恋花       吟望/01.jpg"]}, {"id": "4975186211767868", "title": "七绝·冬日闲吟", "genre": "七绝", "body": "淡定乡翁岁月悠，\n老心宁静少烦愁。\n漫行所处皆风景，\n何惧寒霜雪染头。 ​​​", "date": "2023.12.04", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4975186211767868 - 七绝    冬日闲吟/01.jpg"]}, {"id": "4975976247724806", "title": "七绝·吟望", "genre": "七绝", "body": "任风由雨稳如山，\n自信人生二百年。\n气势高低崖谷处，\n雄鹰飞过鸟回还。 ​​​", "date": "2023.12.06", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4975976247724806 - 七绝           吟望/01.jpg"]}, {"id": "4976262967988738", "title": "七绝·时令吟", "genre": "七绝", "body": "大雪时光无雪花，\n金黄漫地映寒鸦。\n北风刺骨枝摇拽，\n杂病猖狂百姓家。 ​​​", "date": "2023.12.07", "themes": ["四时风光与节气流转", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4976262967988738 - 七绝        时令吟/01.jpg"]}, {"id": "4979654090033233", "title": "踏莎行·痛", "genre": "踏莎行", "body": "戴月迎风，\n出门赶路。\n为孙排队求医护。\n连天咳嗽恁愁爷，\n高烧不退情无助。\n人满厅堂，\n瓶盈梁柱。\n孩童哭闹声飞度。\n雪花吻地透心凉，\n更添等盼煎熬苦。 ​​​", "date": "2023.12.16", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4979654090033233 - 踏莎行          痛/01.jpg"]}, {"id": "4980328152170520", "title": "七绝·苦吟", "genre": "七绝", "body": "三岁娇娃吊小瓶，\n老翁陪伴恁心疼。\n病毒肆虐人无措，\n祈祷将身替稚童。 ​​​", "date": "2023.12.18", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4980328152170520 - 七绝           苦吟/01.jpg"]}, {"id": "4980592511028601", "title": "七绝·吟娇孙", "genre": "七绝", "body": "纤细银针血脉连，\n晶莹玉液体循环。\n可怜幼女皮薄嫩，\n不闹赢夸五六天。 ​​​", "date": "2023.12.19", "themes": ["亲情友情与人间至爱"], "images": ["冰雪诗词_全部图片/4980592511028601 - 七绝        吟娇孙/01.jpg"]}, {"id": "4980972213502630", "title": "踏莎行·冬夜吟望", "genre": "踏莎行", "body": "冷月当空，\n银辉染地。\n枯枝残雪寒鸦泣。\n北风凛冽刺行人，\n急归脚下冰无计。\n紧扯衣裳，\n轻舒腹气。\n驱前缓慢时停立。\n家中有事火攻心，\n进门病倒无人替。 ​​​", "date": "2023.12.20", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4980972213502630 - 踏莎行 冬夜吟望/01.jpg"]}, {"id": "4981757382493135", "title": "踏莎行·孙女生日", "genre": "踏莎行", "body": "昨日煊煊三岁喜。\n玩偶萦身，\n手舞眉飞立。\n金鼠欢腾逢盛世，\n厅堂回荡精灵气。\n精美蛋糕凝厚意。\n寿面丝滑，\n缕缕长相忆。\n父母开心情不已，\n舒怀爷奶神魂奕。 ​​​", "date": "2023.12.22", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4981757382493135 - ​踏莎行 孙女生日/01.jpg", "冰雪诗词_全部图片/4981757382493135 - ​踏莎行 孙女生日/02.jpg", "冰雪诗词_全部图片/4981757382493135 - ​踏莎行 孙女生日/03.jpg", "冰雪诗词_全部图片/4981757382493135 - ​踏莎行 孙女生日/04.jpg", "冰雪诗词_全部图片/4981757382493135 - ​踏莎行 孙女生日/05.jpg", "冰雪诗词_全部图片/4981757382493135 - ​踏莎行 孙女生日/06.jpg", "冰雪诗词_全部图片/4981757382493135 - ​踏莎行 孙女生日/07.jpg", "冰雪诗词_全部图片/4981757382493135 - ​踏莎行 孙女生日/08.jpg", "冰雪诗词_全部图片/4981757382493135 - ​踏莎行 孙女生日/09.jpg"]}, {"id": "4982038004498981", "title": "鹧鸪天·祝娘高寿", "genre": "鹧鸪天", "body": "尝罢孙娃生日餐，\n驱车千里拜娘前。\n寒风难阻归家路，\n残雪漫扬轮毂间。\n合兄妹，把杯盘。\n鸡丝鱼片敬椿萱。\n福如东海南山寿，\n情似苍崖不老天。 ​​​", "date": "2023.12.23", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4982038004498981 - 鹧鸪天 祝娘高寿/01.jpg", "冰雪诗词_全部图片/4982038004498981 - 鹧鸪天 祝娘高寿/02.jpg", "冰雪诗词_全部图片/4982038004498981 - 鹧鸪天 祝娘高寿/03.jpg"]}, {"id": "4982391863772040", "title": "西江月·冬日冷暖", "genre": "西江月", "body": "大雪多年少见，\n低温近日常闻。\n夜行刺脸冻双唇，\n脚下歪斜难稳。\n路上黄衣挥汗，\n街头白絮移身。\n晓来出外喜行人，\n回望点头询问。 ​​​", "date": "2023.12.24", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4982391863772040 - 西江月 冬日冷暖/01.jpg", "冰雪诗词_全部图片/4982391863772040 - 西江月 冬日冷暖/02.jpg", "冰雪诗词_全部图片/4982391863772040 - 西江月 冬日冷暖/03.jpg"]}, {"id": "4982755567599836", "title": "七绝·冬趣", "genre": "七绝", "body": "九九消寒梅尽染，\n雪飞腊月喜迎春。\n古人雅趣闲挥墨，\n妙手丹青赋韵文。 ​​​", "date": "2023.12.25", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4982755567599836 - 七绝           冬趣/01.jpg"]}, {"id": "4983119465154210", "title": "沁园春·缅怀主席", "genre": "沁园春", "body": "……伟人诞辰130周年寄怀\n坦荡无私，独爱神州，沥血为民。\n纵离妻失子，初心不改，穷山险水，壮志凌云。\n坎坷一生，豪情万丈，唤醒工农翻了身。\n轻挥手，便情迷百姓，号令三军。\n神魂历久弥新。到今日，遍华夏念君。\n望韶山冲里，人潮涌动，延安塔下，鼓点同频。\n日月齐欢，江河共唱，劲舞高歌情意真。\n永不忘，恰东方红日，暖耀国人。", "date": "2023.12.26", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4983119465154210 - 沁园春                    缅怀主席/01.jpg", "冰雪诗词_全部图片/4983119465154210 - 沁园春                    缅怀主席/02.jpg", "冰雪诗词_全部图片/4983119465154210 - 沁园春                    缅怀主席/03.jpg", "冰雪诗词_全部图片/4983119465154210 - 沁园春                    缅怀主席/04.jpg", "冰雪诗词_全部图片/4983119465154210 - 沁园春                    缅怀主席/05.jpg", "冰雪诗词_全部图片/4983119465154210 - 沁园春                    缅怀主席/06.jpg"]}, {"id": "4983484066040653", "title": "清平乐·敬缅主席", "genre": "清平乐", "body": "东方红日，\n偶被乌云蔽。\n雾散霾除明万里，\n无限光芒永世。\n寒冬温暖人间，\n春秋花果欣妍。\n夏季驱阴消雨，\n神州岁月悠然。 ​​​", "date": "2023.12.27", "themes": ["家国情怀与时代歌咏", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4983484066040653 - 清平乐 敬缅主席/01.jpg"]}, {"id": "4983840765117972", "title": "七绝·坚守", "genre": "七绝", "body": "铁塔凌空银线舞，\n翻江越岭送光明。\n为得百姓寒冬暖，\n无惧山头饮朔风。 ​​​", "date": "2023.12.28", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4983840765117972 - 七绝           坚守/01.jpg", "冰雪诗词_全部图片/4983840765117972 - 七绝           坚守/02.jpg", "冰雪诗词_全部图片/4983840765117972 - 七绝           坚守/03.jpg", "冰雪诗词_全部图片/4983840765117972 - 七绝           坚守/04.jpg"]}, {"id": "4984203787635813", "title": "七绝·晓吟", "genre": "七绝", "body": "轻阴薄雾笼寒冬，\n残叶栖鸦冷瑟中。\n晨练乡邻争上杠，\n腾身转体暖融融。 ​​​", "date": "2023.12.29", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4984203787635813 - 七绝           晓吟/01.jpg"]}, {"id": "4984575577556014", "title": "七律·岁暮吟", "genre": "七律", "body": "坚守变通人世间，\n红花绿叶景光妍。\n缩头龟可千年寿，\n昂首猪来一岁难。\n猴子化身无数个，\n唐僧执念向西天。\n悠悠日月轮回动，\n恒是东升缺或圆。 ​​​", "date": "2023.12.30", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4984575577556014 - 七律       岁暮吟/01.jpg"]}, {"id": "4984953599428537", "title": "长相思·岁杪寄怀", "genre": "长相思", "body": "送一年，又一年。\n来往劳神两鬓残。\n匆忙岁月天。\n苦三番，乐三番。\n几度春秋风雨间。\n老来心坦然。 ​​​", "date": "2023.12.31", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4984953599428537 - 长相思 岁杪寄怀/01.jpg"]}, {"id": "4985292479795970", "title": "十六字令·元旦", "genre": "十六字令", "body": "年。\n似水光阴漫向前。\n无穷尽，\n日月度关山。\n年。\n市井乡邻多笑颜。\n频招手，\n得空闹樽前。\n年。\n温暖如春微信间。\n临屏问，\n万里若厅前。 ​​​", "date": "2024.01.01", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4985292479795970 - ​十六字令    元旦/01.jpg"]}, {"id": "4985657121048707", "title": "五绝·童欢", "genre": "五绝", "body": "新年童稚乐，\n礼物可心怀。\n浅靥腮边俏，\n眉梢向上开。 ​​​", "date": "2024.01.02", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4985657121048707 - 五绝    童欢/01.jpg"]}, {"id": "4986027103486423", "title": "朝中措·寒冬慢行", "genre": "朝中措", "body": "一宵薄雾晓来晴，\n霾散赖东风。\n残雪街头连片，\n路人躲闪前行。\n今冬别样，\n异常寒冷，\n冰处难溶。\n出外留心防范，\n切毋坏了心情。 ​​​", "date": "2024.01.03", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4986027103486423 - 朝中措 寒冬慢行/01.jpg"]}, {"id": "4986385477406991", "title": "七绝·岁暮寄怀", "genre": "七绝", "body": "兔将离任龙张望，\n人欲归休茶水凉。\n尘世人间同岁月，\n且行且卧莫心伤。 ​​​", "date": "2024.01.04", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4986385477406991 - 七绝    岁暮寄怀/01.jpg", "冰雪诗词_全部图片/4986385477406991 - 七绝    岁暮寄怀/02.jpg"]}, {"id": "4986739585977648", "title": "蝶恋花·二九吟望", "genre": "蝶恋花", "body": "酷冷严冬铺雪地，\n多在厅堂，\n谨慎门前立。\n近日回温天转丽，\n纷纷出外寻情趣。\n残雪消溶冰水溢。\n清澈潺潺，\n轻浪欢歌去。\n抒展胸怀深纳气，\n周身寒透赢心意。 ​​​", "date": "2024.01.05", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4986739585977648 - 蝶恋花 二九吟望/01.jpg", "冰雪诗词_全部图片/4986739585977648 - 蝶恋花 二九吟望/02.jpg"]}, {"id": "4987102766565294", "title": "七绝·节令吟", "genre": "七绝", "body": "昨天雪水夜成冰，\n今日小寒君慢行。\n三九将来温色降，\n晓枝鸦雀梦魂惊。 ​​​", "date": "2024.01.06", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4987102766565294 - 七绝       节令吟/01.jpg"]}, {"id": "4987467600495088", "title": "五绝·闲吟", "genre": "五绝", "body": "家是故乡亲，\n金樽敬旧人。\n无关深与浅，\n把盏最欢心。 ​​​", "date": "2024.01.07", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4987467600495088 - 五绝    闲吟/01.jpg"]}, {"id": "4987826851023723", "title": "七绝·咏叹", "genre": "七绝", "body": "夜围炉火话当年，\n转眼稚童霜鬓颜。\n岁月公平留印迹，\n额头纹络共樽前。 ​​​", "date": "2024.01.08", "themes": ["感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/4987826851023723 - 七绝          咏叹/01.jpg"]}, {"id": "4988558320076717", "title": "七绝·吟望", "genre": "七绝", "body": "高知入米落街头，\n堕水浮萍任浪流。\n丢尽馨香清雅气，\n风寒无奈惹人愁？ ​​​", "date": "2024.01.10", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4988558320076717 - 七绝           吟望/01.jpg"]}, {"id": "4988915132140684", "title": "五绝·难", "genre": "五绝", "body": "冬至老人难，\n躲风难躲寒。\n爹娘多病痛，\n愁子不堪言。 ​​​", "date": "2024.01.11", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4988915132140684 - 五绝       难/01.jpg"]}, {"id": "4989293168954328", "title": "七绝·军威", "genre": "七绝", "body": "南昌舰艇斗波涛，\n掌舵娇颜气势豪。\n左转右旋龙欲跃，\n海空万里任逍遥。 ​​​", "date": "2024.01.12", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/4989293168954328 - 七绝           军威/01.jpg", "冰雪诗词_全部图片/4989293168954328 - 七绝           军威/02.jpg", "冰雪诗词_全部图片/4989293168954328 - 七绝           军威/03.jpg", "冰雪诗词_全部图片/4989293168954328 - 七绝           军威/04.jpg"]}, {"id": "4989638231984050", "title": "行香子·冬日咏怀", "genre": "行香子", "body": "风雨人生，霜鬓从容。陪老人携手孙童。游玩水榭，闲眺云空。戏棋中马，水中蟹，草中虫。\n不觉寒暑，钟情燕雀。悦厅堂稚语耆声。时光飞逝，岁月安宁。更心无憾，身无债，梦无惊。 ​​​", "date": "2024.01.13", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4989638231984050 - 行香子           冬日咏怀/01.jpg"]}, {"id": "4990000565586140", "title": "蝶恋花·欣闻有感", "genre": "蝶恋花", "body": "…贺引力一号发射\n海上巨龙喷火焰。\n万里长空，\n一道辉光灿。\n移动礁盘来备战，\n远洋深处谁寻见。\n巧妙伪装容貌变。\n暗里无声，\n瞄准人间怨。\n一霎烟消乌兽散，\n可平尘世千般乱。 ​​​", "date": "2024.01.14", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4990000565586140 - 蝶恋花    欣闻有感/01.jpg", "冰雪诗词_全部图片/4990000565586140 - 蝶恋花    欣闻有感/02.jpg", "冰雪诗词_全部图片/4990000565586140 - 蝶恋花    欣闻有感/03.jpg", "冰雪诗词_全部图片/4990000565586140 - 蝶恋花    欣闻有感/04.jpg"]}, {"id": "4990367995266101", "title": "五绝·赠友", "genre": "五绝", "body": "负任入京城，\n不图功与名。\n老来心益壮，\n策马志无穷。 ​​​", "date": "2024.01.15", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4990367995266101 - 五绝    赠友/01.jpg"]}, {"id": "4990742991210393", "title": "七绝·吟望", "genre": "七绝", "body": "一张纸片惹烟尘，\n霾雾遮天日色阴。\n只待清风扫寰宇，\n隆冬虽冷净无云！ ​​​", "date": "2024.01.16", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4990742991210393 - 七绝           吟望/01.jpg"]}, {"id": "4991122103602805", "title": "蝶恋花·吟望寄怀", "genre": "蝶恋花", "body": "黑手岂能遮日月。\n山陡枝高，\n难挡飞天雪。\n滴水成河淹蚁阙，\n波涛推浪残渣泄。\n老笔纵横和泪写。\n百姓呼声，\n阵阵通天界。\n定有霞辉驱暗夜，\n晴空万里苍生悦。 ​​​", "date": "2024.01.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4991122103602805 - 蝶恋花 吟望寄怀/01.jpg"]}, {"id": "4991469323026848", "title": "西江月·腊八", "genre": "西江月", "body": "前夜精心挑米，\n清晨温火熬粥。\n厅堂香味渐浓稠。\n大小碗排前后。\n奶奶轻端慢品，\n娇孙紧把无休。\n风寒腊日更何求。\n惬意心怀暖透。 ​​​", "date": "2024.01.18", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4991469323026848 - 西江月        腊八/01.jpg"]}, {"id": "4991833994428646", "title": "采桑子·闻事有感", "genre": "采桑子", "body": "天平不稳随风晃。\n砝码轻摇，\n称重虚飘。\n百姓心头虑不消。\n古今打铁身须硬。\n锻造钉销，\n莫差分毫。\n斧钺钩叉气自高。 ​​​", "date": "2024.01.19", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4991833994428646 - 采桑子 闻事有感/01.jpg"]}, {"id": "4992175651687148", "title": "七绝·时令吟", "genre": "七绝", "body": "日过大寒临近年，\n冰溶雪化露真颜。\n梅花竞秀迎春到，\n京客思乡尽望南。 ​​​", "date": "2024.01.20", "themes": ["四时风光与节气流转", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4992175651687148 - 七绝       时令吟/01.jpg"]}, {"id": "4992543861770411", "title": "七绝·四九晓吟", "genre": "七绝", "body": "寒潮骤降晓风急，\n红日遥升暖色迟。\n赶早出行人罩面，\n枝头惊梦鸟声凄。 ​​​", "date": "2024.01.21", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4992543861770411 - 七绝    四九晓吟/01.jpg"]}, {"id": "4992904001224817", "title": "七律·吟望寄友", "genre": "七律", "body": "裹带京城霜雪意，\n来寻宝岛俏风情。\n裘衣褪却心怀爽，\n波浪徘徊鸥鹭萌。\n兄弟追云欢戏水，\n夫妻揽月弄涛声。\n天涯海角同窗聚，\n斑鬓年光兴趣浓。 ​​​", "date": "2024.01.22", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4992904001224817 - 七律    吟望寄友/01.jpg", "冰雪诗词_全部图片/4992904001224817 - 七律    吟望寄友/02.jpg", "冰雪诗词_全部图片/4992904001224817 - 七律    吟望寄友/03.jpg", "冰雪诗词_全部图片/4992904001224817 - 七律    吟望寄友/04.jpg"]}, {"id": "4993645173015672", "title": "鹧鸪天·年声", "genre": "鹧鸪天", "body": "天地风寒难掩情，\n灯笼高挂味趋浓。\n龙年脚步声声近，\n庭院枝头点点红。\n兴集市，蟹虾丰。\n乡邻照面喜盈盈。\n竹篮布袋回身满，\n笑脸弯腰语不停。 ​​​", "date": "2024.01.24", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/4993645173015672 - 鹧鸪天       年声/01.jpg"]}, {"id": "4994008444831677", "title": "七绝·闻事吟", "genre": "七绝", "body": "与人为善路平宽，\n孝敬双亲日夜安。\n和睦夫妻香火旺，\n持家创业两周全。 ​​​", "date": "2024.01.25", "themes": ["亲情友情与人间至爱", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4994008444831677 - 七绝        闻事吟/01.jpg"]}, {"id": "4995105656407269", "title": "清平乐·岁杪吟望", "genre": "清平乐", "body": "车流似水，\n年近心头醉。\n来往东西辞旧岁，\n南北穿梭回味。\n同窗把盏言欢，\n老乡玉液频干。\n战友豪情益壮，\n白红见底轮番。 ​​​", "date": "2024.01.28", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4995105656407269 - 清平乐 岁杪吟望/01.jpg"]}, {"id": "4995437586811566", "title": "七绝·冬日吟", "genre": "七绝", "body": "功名远去病加身，\n几案书香陶冶心。\n耆老莫求青壮事，\n与孙为乐共童真。 ​​​", "date": "2024.01.29", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4995437586811566 - 七绝       冬日吟/01.jpg"]}, {"id": "4995803434976851", "title": "七绝·闻事吟", "genre": "七绝", "body": "沾花君子斗蛐臣，\n时代不同别样人。\n雨雪从来天际落，\n身心生就本无尘。 ​​​", "date": "2024.01.30", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4995803434976851 - 七绝       闻事吟/01.jpg"]}, {"id": "4996165987209634", "title": "七律·遥望寄怀", "genre": "七律", "body": "节前天际雪花多，\n年后河塘漾碧波。\n四海飘游华夏子，\n一心搭乘故乡车。\n泥尘无惧双亲拜，\n情义深沉老少和。\n守岁秉烛先祖祭，\n阳春再奏凯旋歌。 ​​​", "date": "2024.01.31", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4996165987209634 - ​七律    遥望寄怀/01.jpg"]}, {"id": "4996524624577271", "title": "踏莎行·龙年大礼", "genre": "踏莎行", "body": "意料之中，\n闻听尤奋。\n手屏夜半传佳讯。\n白刘魏害罪应得，\n折身依法香烛烬。\n天网恢恢，\n国威震震。\n神州号令中华盾。\n名高气壮映八方，\n环球瞩目今番信。 ​​​", "date": "2024.02.01", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/4996524624577271 - ​踏莎行 龙年大礼/01.jpg"]}, {"id": "4996893255927336", "title": "七绝·灶前吟", "genre": "七绝", "body": "转眼时光到小年，\n灶王言事上青天。\n临行询问人间愿，\n嘱与帝君约束仙。 ​​​", "date": "2024.02.02", "themes": ["四时风光与节气流转", "羁旅思乡与行吟纪游", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4996893255927336 - 七绝        灶前吟/01.jpg"]}, {"id": "4997270336444084", "title": "七律·岁杪吟望", "genre": "七律", "body": "预期雪影未曾来，\n许是天公释善怀。\n知晓人间节日到，\n遣将琼粉饰瑶台。\n众仙协奏阳春曲，\n百姓合赢盛世牌。\n南北红灯分外艳，\n东西锣鼓震八垓。 ​​​", "date": "2024.02.03", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4997270336444084 - 七律    岁杪吟望/01.jpg"]}, {"id": "4997624597318185", "title": "七律·立春有寄", "genre": "七律", "body": "新年未到已逢春，\n不日花红柳色深。\n岁至甲辰龙劲舞，\n时当盛世故乡亲。\n归家游子心头热，\n把盏香醪敬旧邻。\n转眼除夕鞭炮响，\n桃符更换喜盈门。 ​​​", "date": "2024.02.04", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/4997624597318185 - 七律    立春有寄/01.jpg"]}, {"id": "4997972675003085", "title": "卜算子·岁暮吟", "genre": "卜算子", "body": "昨日已春归，\n岁月悄然过。\n一寸光阴不欠谁，\n别怪天公错。\n世路百千条，\n莫作无心客。\n右侧言明有玉山，\n你却偏行左。 ​​​", "date": "2024.02.05", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4997972675003085 - 卜算子    岁暮吟/01.jpg"]}, {"id": "4998335604457862", "title": "七绝·春来闲吟", "genre": "七绝", "body": "为人感悟与时增，\n处世修行理渐通。\n怎奈时光染霜鬓，\n春归更羡草重生。 ​​​", "date": "2024.02.06", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4998335604457862 - 七绝    春来闲吟/01.jpg"]}, {"id": "4998714016141137", "title": "卜算子·吟望", "genre": "卜算子", "body": "绿影冷森森，\n远望凉风透。\n多少国人夜未眠，\n无奈街头遛。\n投入去无回，\n运气千般臭。\n已近年关苦不言，\n假笑娘前凑。 ​​​", "date": "2024.02.07", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4998714016141137 - 卜算子        吟望/01.jpg"]}, {"id": "4999091887540077", "title": "五绝·岁杪", "genre": "五绝", "body": "清晓街头静，\n寻常忙者闲。\n除夕明日至，\n好梦过年关。 ​​​", "date": "2024.02.08", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/4999091887540077 - 五绝    岁杪/01.jpg"]}, {"id": "4999807981061858", "title": "满庭芳·过大年", "genre": "满庭芳", "body": "鞭炮轰鸣，烟花璀璨，昔时年味回还。\n红灯高挂，福字映阶前。\n万户千家同庆，点香火、祭祖堂前。\n净庭院，风尘不染，晴日对春联。\n望枝头喜鹊，飞身跳跃，羽艳声欢。\n守岁夜，阖家老少团圆。\n手把金樽畅饮，钟声响、龙兔交班。\n新年到，东方红日，耀万里河山。", "date": "2024.02.10", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/4999807981061858 - 祝大家新春快乐！万事如意！/01.jpg"]}, {"id": "5000152425432164", "title": "七绝·省亲", "genre": "七绝", "body": "大年初二走娘家，\n车载手牵夫与娃。\n梦里几番呼父母，\n今朝相见靥如花。 ​​​", "date": "2024.02.11", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5000152425432164 - 七绝           省亲/01.jpg"]}, {"id": "5000532160941401", "title": "七绝·新春闲吟", "genre": "七绝", "body": "初三晓静路无人，\n昨日重逢醉了心。\n亲友同欢托好梦，\n春宵熟睡养精神。 ​​​", "date": "2024.02.12", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5000532160941401 - 七绝    新春闲吟/01.jpg"]}, {"id": "5000876077351729", "title": "踏莎行·吟望咏怀", "genre": "踏莎行", "body": "内地祥和，\n边疆毅勇。\n山川将士眸光炯。\n踏冰卧雪保家园，\n赢得华夏黎民颂。\n节日思亲，\n闲时想静。\n赖凭门户无人动。\n若非国盛壮三军，\n便当酷暑心头冷。 ​​​", "date": "2024.02.13", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5000876077351729 - 踏莎行 吟望咏怀/01.jpg", "冰雪诗词_全部图片/5000876077351729 - 踏莎行 吟望咏怀/02.jpg", "冰雪诗词_全部图片/5000876077351729 - 踏莎行 吟望咏怀/03.jpg"]}, {"id": "5001236380124524", "title": "七绝·初五有寄", "genre": "七绝", "body": "凌晨鞭炮响连天，\n破五财神喜迓还。\n数载声消烟火断，\n今朝遍处爆花妍。 ​​​", "date": "2024.02.14", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5001236380124524 - 七绝    初五有寄/01.jpg"]}, {"id": "5001610925180207", "title": "七律·过年", "genre": "七律", "body": "春晚欢鲜滋味淡，\n闷头酣睡几多年。\n幸得鞭炮回宵夜，\n助兴亲朋宴案前。\n龙兔交班华夏悦，\n弟兄守岁醉心田。\n东风吹荡烟花雨，\n万里金星璀璨天。 ​​​", "date": "2024.02.15", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/5001610925180207 - 七律           过年/01.jpg"]}, {"id": "5002025069183912", "title": "七绝·年趣", "genre": "七绝", "body": "竹雨堂中叙旧情，\n金樽玉液鬓霜浓。\n光阴飞逝三十载，\n再话初逢感慨生。 ​​​", "date": "2024.02.16", "themes": ["感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5002025069183912 - 七绝           年趣/01.jpg"]}, {"id": "5002333991732411", "title": "七律·快乐时光", "genre": "七律", "body": "过年最乐属孩童，\n压岁红包染稚容。\n花炮飞鸣纤手舞，\n糖人传递故乡情。\n走家串户逢亲拜，\n姑舅叔伯祝愿声。\n日日开心宵不寐，\n时时笑靥映长空。 ​​​", "date": "2024.02.17", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5002333991732411 - 七律    快乐时光/01.jpg", "冰雪诗词_全部图片/5002333991732411 - 七律    快乐时光/02.jpg", "冰雪诗词_全部图片/5002333991732411 - 七律    快乐时光/03.jpg", "冰雪诗词_全部图片/5002333991732411 - 七律    快乐时光/04.jpg", "冰雪诗词_全部图片/5002333991732411 - 七律    快乐时光/05.jpg", "冰雪诗词_全部图片/5002333991732411 - 七律    快乐时光/06.jpg"]}, {"id": "5002685933685459", "title": "七绝·得失", "genre": "七绝", "body": "最长节假把人闲，\n初九上工情不甘。\n却是荣休心静好，\n寻常日月总如年。 ​​​", "date": "2024.02.18", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/5002685933685459 - 七绝           得失/01.jpg"]}, {"id": "5003047782845036", "title": "七绝·时令吟", "genre": "七绝", "body": "雨水时节雪探头，\n寒潮复降惹人愁。\n新春本欲花初绽，\n此弄枝芽不自由。 ​​​", "date": "2024.02.19", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5003047782845036 - ​七绝       时令吟/01.jpg"]}, {"id": "5003425400753370", "title": "蝶恋花·初春晓吟", "genre": "蝶恋花", "body": "春雪夜来寒又至。\n丝雨加杂，\n混入泥尘地。\n晓色阴沉云蔽日，\n新春喜庆浑无计。\n苦了行人谁可替。\n赶点开工，\n惆怅心憋气。\n惟盼长空霄汉霁，\n东风吹荡城乡丽。 ​​​", "date": "2024.02.20", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5003425400753370 - 蝶恋花 初春晓吟/01.jpg"]}, {"id": "5003778755658709", "title": "七绝·倒春寒", "genre": "七绝", "body": "时逢雨水雪纷纷，\n天地茫茫少见人。\n便是舟车风里卧，\n树鸦凄瑟断肠魂。 ​​​", "date": "2024.02.21", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转"], "images": ["冰雪诗词_全部图片/5003778755658709 - 七绝       倒春寒/01.jpg"]}, {"id": "5004134636060680", "title": "七绝·初春赠友", "genre": "七绝", "body": "天女散花风漫舞，\n黄梅香溢沁心魂。\n十方院里虔诚客，\n金阙宫中辞旧身。 ​​​", "date": "2024.02.22", "themes": ["亲情友情与人间至爱", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5004134636060680 - 七绝    初春赠友/01.jpg"]}, {"id": "5004859931888200", "title": "七律·元宵节", "genre": "七律", "body": "一口汤圆软糯甜，\n观灯品味甲辰年。\n龙腾鱼跃金猴奋，\n马踏羊牵玉兔欢。\n情侣街头明月照，\n宾朋庭院望花天。\n银光火树星空夜，\n鼓乐笙箫谁个眠。 ​​​", "date": "2024.02.24", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/5004859931888200 - 七律       元宵节/01.jpg"]}, {"id": "5005627330398359", "title": "西江月·新春北上", "genre": "西江月", "body": "正月廉州别却，\n孤身京邑前行。\n两头牵挂一腔情，\n老少盈怀搅动。\n守岁椿萱同乐，\n赏灯孙女期空。\n今朝能去意千重，\n心在旅途难定。 ​​​", "date": "2024.02.26", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5005627330398359 - ​西江月 新春北上/01.jpg"]}, {"id": "5006310072386378", "title": "七绝·心愿", "genre": "七绝", "body": "春来又到入园时，\n三岁娇娃有所期。\n询问爷爷能去否，\n闻声稚脸喜滋滋。 ​​​", "date": "2024.02.28", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5006310072386378 - 七绝           心愿/01.jpg"]}, {"id": "5007783924075119", "title": "七律·春会吟望", "genre": "七律", "body": "建言国是聚京城，\n汇纳神州百姓声。\n田野禾苗应更壮，\n庙堂财物怎尤丰。\n山河无恙凭谁守，\n道路微坑几日平，\n广厦栋梁堪重任，\n经霜沐雨抗西风。 ​​​", "date": "2024.03.03", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5007783924075119 - ​七律    春会吟望/01.jpg"]}, {"id": "5008233008467768", "title": "七绝·春日闲吟", "genre": "七绝", "body": "有缘早晚能相遇，\n少爱夫妻亦闹翻。\n朋侣推心天地久，\n弟兄计较苦无边。 ​​​", "date": "2024.03.04", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5008233008467768 - 七绝    春日闲吟/01.jpg"]}, {"id": "5008525673369156", "title": "七绝·惊蛰有寄", "genre": "七绝", "body": "地温渐暖搅虫眠，\n睡眼惺忪杂草间。\n不道朔风吹雪日，\n自鸣所见数他全。 ​​​", "date": "2024.03.05", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5008525673369156 - 七绝    惊蛰有寄/01.jpg"]}, {"id": "5009240563647009", "title": "七律·新春代孙吟", "genre": "七律", "body": "梦里入园今日成，\n明眸浅靥放歌声。\n爸妈别我辛劳作，\n爷奶驱车快乐行。\n门口随师挥手去，\n厅堂与伴笑眉平。\n童真难掩心头悦，\n蹦跳欢言游戏中。 ​​​", "date": "2024.03.07", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5009240563647009 - 七律 新春代孙吟/01.jpg", "冰雪诗词_全部图片/5009240563647009 - 七律 新春代孙吟/02.jpg", "冰雪诗词_全部图片/5009240563647009 - 七律 新春代孙吟/03.jpg"]}, {"id": "5009571009793206", "title": "踏莎行·贺三八", "genre": "踏莎行", "body": "笑靥红妆，\n穿针引线。\n育儿养老千斤担。\n贤妻良母古来今，\n弓身巧手丰盈饭。\n职场玫瑰，\n征途花旦。\n英姿飒爽情无限。\n扬鞭策马傲须眉，\n齐驱并驾山峰见。 ​​​", "date": "2024.03.08", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5009571009793206 - 踏莎行    贺三八/01.jpg"]}, {"id": "5010326654027781", "title": "朝中措·新春乐园", "genre": "朝中措", "body": "一群三岁俏孩童，\n鲜有泣哭声。\n稚语招人引笑，\n明眸闪动多情。\n扬眉起舞，\n随师咏唱，\n悦嗓欢容。\n迎面春风陶醉，\n归来浅靥盈盈。 ​​​", "date": "2024.03.10", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5010326654027781 - 朝中措 新春乐园/01.jpg", "冰雪诗词_全部图片/5010326654027781 - 朝中措 新春乐园/02.jpg", "冰雪诗词_全部图片/5010326654027781 - 朝中措 新春乐园/03.jpg"]}, {"id": "5010658494776862", "title": "七绝·二月二", "genre": "七绝", "body": "飞龙昂首傲八方，\n旭日霞辉万里扬。\n又抖精神重远去，\n行囊珠满再还乡。 ​​​", "date": "2024.03.11", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5010658494776862 - 七绝       二月二/01.jpg"]}, {"id": "5011067367852050", "title": "七律·植树寄怀", "genre": "七律", "body": "今栽小院一棵苗，\n期许遮阴风水调。\n酷暑炎光能蔽日，\n严霜寒地赏花娇。\n长年喜鹊枝头卧，\n后世佳丁才气高。\n岁月无忧潇洒过，\n乘凉树下自逍遥。 ​​​", "date": "2024.03.12", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5011067367852050 - 七律    植树寄怀/01.jpg"]}, {"id": "5011387816869963", "title": "七绝·咏春", "genre": "七绝", "body": "日影星辉万象新，\n物华景秀水宜人。\n花妍鸟啭山峰丽，\n翠色青云撩老身。 ​​​", "date": "2024.03.13", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5011387816869963 - 七绝           咏春/01.jpg"]}, {"id": "5011742365583544", "title": "七绝·春晓", "genre": "七绝", "body": "人多未起太阳升，\n东海泛波霄汉红。\n紫气蒸腾笼华夏，\n神州草树沐春风。 ​​​", "date": "2024.03.14", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/5011742365583544 - 七绝           春晓/01.jpg"]}, {"id": "5013922678311942", "title": "七绝·春分", "genre": "七绝", "body": "天均昼夜软风吹，\n陌上花妍翠柳垂。\n旭日初升人早起，\n谋生晨练不须催。 ​​​", "date": "2024.03.20", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5013922678311942 - 七绝           春分/01.jpg"]}, {"id": "5014063882439999", "title": "七绝·幼儿迎春", "genre": "七绝", "body": "春分彩蛋立桌台，\n稚脸明眸笑靥开。\n幼小心灵叹奇妙，\n师生携手乐膺怀。 ​​​", "date": "2024.03.20", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5014063882439999 - 七绝    幼儿迎春/01.jpg", "冰雪诗词_全部图片/5014063882439999 - 七绝    幼儿迎春/02.jpg"]}, {"id": "5014280550484541", "title": "鹧鸪天·幼儿踏青", "genre": "鹧鸪天", "body": "童稚寻芳百子湾，\n湖堤缓步手相牵。\n闻听翠鸟高歌唱，\n观看金鱼戏水边。\n争询问，抢声言。\n如何花艳是春天。\n谁人能解黄莺语，\n宛转清音为那般？ ​​​", "date": "2024.03.21", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/5014280550484541 - 鹧鸪天 幼儿踏青/01.jpg", "冰雪诗词_全部图片/5014280550484541 - 鹧鸪天 幼儿踏青/02.jpg", "冰雪诗词_全部图片/5014280550484541 - 鹧鸪天 幼儿踏青/03.jpg"]}, {"id": "5014643855067631", "title": "七绝·春日吟", "genre": "七绝", "body": "抬头忽见柳条青，\n万物更新赖雨风。\n滋润根苗辞旧貌，\n凭得紫气绽芳容。 ​​​", "date": "2024.03.22", "themes": ["咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5014643855067631 - 七绝       春日吟/01.jpg"]}, {"id": "5015038314420166", "title": "七绝·敬王校长", "genre": "七绝", "body": "赞誉漫传人去后，\n定因诚意换民心。\n坐行磊落繁霜鬓，\n传道黉门幸此君。 ​​​", "date": "2024.03.23", "themes": ["羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5015038314420166 - 七绝    敬王校长/01.jpg", "冰雪诗词_全部图片/5015038314420166 - 七绝    敬王校长/02.jpg"]}, {"id": "5015409320004068", "title": "七律·花蕾初绽", "genre": "七律", "body": "风吹杨柳万千条，\n翠色京城别样娇。\n多彩幼儿初试镜，\n真情稚脸把人招。\n对答流畅心无怯，\n手眼翩跹气亦高。\n三岁乖孙赢赞誉，\n染霜爷奶乐逍遥。 ​​​", "date": "2024.03.24", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5015409320004068 - ​七律    花蕾初绽/01.jpg", "冰雪诗词_全部图片/5015409320004068 - ​七律    花蕾初绽/02.jpg", "冰雪诗词_全部图片/5015409320004068 - ​七律    花蕾初绽/03.jpg", "冰雪诗词_全部图片/5015409320004068 - ​七律    花蕾初绽/04.jpg", "冰雪诗词_全部图片/5015409320004068 - ​七律    花蕾初绽/05.jpg", "冰雪诗词_全部图片/5015409320004068 - ​七律    花蕾初绽/06.jpg"]}, {"id": "5015842084095650", "title": "五绝·三月春", "genre": "五绝", "body": "翠色暖风来，\n木棉花盛开。\n温馨红火意，\n摇曳入心怀。 ​​​", "date": "2024.03.25", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5015842084095650 - 五绝 三月春/01.jpg"]}, {"id": "5016105389918510", "title": "踏莎行·春思", "genre": "踏莎行", "body": "晓色微明，\n晨曦初照。\n百花娇艳惊栖鸟。\n风摇细柳绿飘垂，\n阳春三月人行早。\n追赶时光，\n争淘珠宝。\n一心只为门庭好。\n阖家老幼眼睁睁，\n可怜青壮闲思少。 ​​​", "date": "2024.03.26", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5016105389918510 - 踏莎行       春思/01.jpg"]}, {"id": "5016519222493607", "title": "踏莎行·童春悦行", "genre": "踏莎行", "body": "一早乘车，\n半天游览。\n幼儿满座欢声伴。\n巡观义利面包房，\n师生仿制赢称赞。\n缕缕飘香，\n丝丝扣愿。\n装兜提袋将家返。\n童言稚语笑翻天，\n枝头花朵争相看。 ​​​", "date": "2024.03.27", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5016519222493607 - 踏莎行    童春悦行/01.jpg", "冰雪诗词_全部图片/5016519222493607 - 踏莎行    童春悦行/02.jpg", "冰雪诗词_全部图片/5016519222493607 - 踏莎行    童春悦行/03.jpg", "冰雪诗词_全部图片/5016519222493607 - 踏莎行    童春悦行/04.jpg", "冰雪诗词_全部图片/5016519222493607 - 踏莎行    童春悦行/05.jpg", "冰雪诗词_全部图片/5016519222493607 - 踏莎行    童春悦行/06.jpg"]}, {"id": "5016861039660117", "title": "七绝·闲吟", "genre": "七绝", "body": "街店冷清医处忙，\n熬时漫等起心慌。\n原来伤痛还无看，\n怎奈新忧断我肠。 ​​​", "date": "2024.03.28", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5016861039660117 - 七绝           闲吟/01.jpg"]}, {"id": "5017208080830506", "title": "七律·隔屏赠友", "genre": "七律", "body": "多年未见酒相迎，\n伊力陈醪色味浓。\n迪化风情催客醉，\n楼兰美馔伴君行。\n昔时杨柳殷勤问，\n边地花枝慰远朋。\n战友欢谈军旅事，\n同窗笑忆校园声。 ​​​", "date": "2024.03.29", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5017208080830506 - 七律    隔屏赠友/01.jpg", "冰雪诗词_全部图片/5017208080830506 - 七律    隔屏赠友/02.jpg"]}, {"id": "5017548615320255", "title": "七绝·春趣", "genre": "七绝", "body": "湖苑枝头别样花，\n朱唇浅靥绽芳华。\n飞来莺鹊长凝视，\n怎个先前未见她。 ​​​", "date": "2024.03.30", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5017548615320255 - ​七绝           春趣/01.jpg", "冰雪诗词_全部图片/5017548615320255 - ​七绝           春趣/02.jpg"]}, {"id": "5017920698584012", "title": "行香子·踏青", "genre": "行香子", "body": "春日乘风，父女前行。染霜爷奶喜陪同。京城郊外，暖丽云空。望陌头翠，枝头彩，渡头明。\n温榆河畔，人来车往。耳旁盈荡趣欢声。沙滩闲坐，远眺雄鹰。自心生悦，脑生念，目生情。 ​​​", "date": "2024.03.31", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5017920698584012 - 行香子            踏青/01.jpg", "冰雪诗词_全部图片/5017920698584012 - 行香子            踏青/02.jpg", "冰雪诗词_全部图片/5017920698584012 - 行香子            踏青/03.jpg", "冰雪诗词_全部图片/5017920698584012 - 行香子            踏青/04.jpg", "冰雪诗词_全部图片/5017920698584012 - 行香子            踏青/05.jpg", "冰雪诗词_全部图片/5017920698584012 - 行香子            踏青/06.jpg"]}, {"id": "5018310745260417", "title": "鹧鸪天·重游万牲园", "genre": "鹧鸪天", "body": "假日前来狮虎山，\n娇孙添岁任由欢。\n金丝猴处开心舞，\n大象身旁露俏颜。\n熊猫秀，企鹅安。\n喜逢鹦鹉语声连。\n去年斑马今还在，\n嘶叫犹如唤若煊。 ​​​", "date": "2024.04.01", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5018310745260417 - ​鹧鸪天 重游万牲园/01.jpg", "冰雪诗词_全部图片/5018310745260417 - ​鹧鸪天 重游万牲园/02.jpg", "冰雪诗词_全部图片/5018310745260417 - ​鹧鸪天 重游万牲园/03.jpg", "冰雪诗词_全部图片/5018310745260417 - ​鹧鸪天 重游万牲园/04.jpg", "冰雪诗词_全部图片/5018310745260417 - ​鹧鸪天 重游万牲园/05.jpg", "冰雪诗词_全部图片/5018310745260417 - ​鹧鸪天 重游万牲园/06.jpg"]}, {"id": "5018746898352359", "title": "七绝·童趣有感", "genre": "七绝", "body": "鼠兔本该行陌阡，\n纵横黄土近云烟。\n如今身陷籓笼里，\n看似无忧不自然。 ​​​", "date": "2024.04.02", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5018746898352359 - 七绝   童趣有感/01.jpg", "冰雪诗词_全部图片/5018746898352359 - 七绝   童趣有感/02.jpg"]}, {"id": "5019010080967345", "title": "踏莎行·观展寄怀", "genre": "踏莎行", "body": "一个星球，\n万千生物。\n自来演变谁停步。\n惟当人类立潮头，\n乘风踏浪旗独树。\n活在今朝，\n晓知远古。\n暗生感慨无穷数。\n珍惜眼下每一天，\n光阴逝去无从复。 ​​​", "date": "2024.04.03", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5019010080967345 - 踏莎行 观展寄怀/01.jpg", "冰雪诗词_全部图片/5019010080967345 - 踏莎行 观展寄怀/02.jpg", "冰雪诗词_全部图片/5019010080967345 - 踏莎行 观展寄怀/03.jpg", "冰雪诗词_全部图片/5019010080967345 - 踏莎行 观展寄怀/04.jpg", "冰雪诗词_全部图片/5019010080967345 - 踏莎行 观展寄怀/05.jpg", "冰雪诗词_全部图片/5019010080967345 - 踏莎行 观展寄怀/06.jpg"]}, {"id": "5019460083912412", "title": "七绝·清明", "genre": "七绝", "body": "山川草木色清新，\n堕泪天公祭逝魂。\n悲痛家亲肠欲断，\n纸烟缭绕万千坟。 ​​​", "date": "2024.04.04", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/5019460083912412 - 七绝           清明/01.jpg"]}, {"id": "5020449996278131", "title": "七绝·仲春吟望", "genre": "七绝", "body": "尘世春回昼渐长，\n百花争艳漫清香。\n巡天日月情无怠，\n熠煜山川草木芳。 ​​​", "date": "2024.04.07", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5020449996278131 - ​七绝    仲春吟望/01.jpg"]}, {"id": "5020811599547771", "title": "七律·将老抒怀", "genre": "七律", "body": "心静方能明事理，\n人闲才可与孙欢。\n怱忙于世遗烦恼，\n急躁攻身伤胆肝。\n枯木逢春花竞艳，\n状元去势度残年。\n白云无所空中乐，\n翠鸟高巢风后难。 ​​​", "date": "2024.04.08", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5020811599547771 - ​七律    将老抒怀/01.jpg"]}, {"id": "5021527349395721", "title": "踏莎行·春日欣讯", "genre": "踏莎行", "body": "瞩目迁西，\n关心贵富。\n历经仨月清门户。\n春宵夜半落锤音，\n翻山跨海云飞度。\n声震乌鸦，\n魂惊老虎。\n黎民闻讯欢无数。\n为官切莫乱言行，\n越池逾矩名如鼠。 ​​​", "date": "2024.04.10", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5021527349395721 - ​踏莎行 春日欣讯/01.jpg"]}, {"id": "5021893268343853", "title": "七绝·回头吟", "genre": "七绝", "body": "风雨由天人自主，\n体勤心奋争寒暑。\n壮时尝胆闯东西，\n耆老年光难受苦。 ​​​", "date": "2024.04.11", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5021893268343853 - 七绝       回头吟/01.jpg"]}, {"id": "5022253454199395", "title": "浪淘沙·西北吟望", "genre": "浪淘沙", "body": "大漠望无边，\n远上云端。\n微茫人马玉沙间。\n行走千年浑未变，\n今古同天。\n往事自悠然，\n际阔心闲。\n置身此处忘忧烦。\n一任黄风来又去，\n不改初颜。 ​​​", "date": "2024.04.12", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5022253454199395 - 浪淘沙 西北吟望/01.jpg", "冰雪诗词_全部图片/5022253454199395 - 浪淘沙 西北吟望/02.jpg", "冰雪诗词_全部图片/5022253454199395 - 浪淘沙 西北吟望/03.jpg"]}, {"id": "5022618344227456", "title": "鹧鸪天·别样春游", "genre": "鹧鸪天", "body": "……赠马英九\n人老情疏念故乡，\n乘风跨海鬓毛扬。\n寻根俯首黄陵拜，\n追梦思贤著华章。\n秦俑叹，泪山冈。\n几回掩泣绪飘茫。\n中山墓畔伤残胆，\n东大厅中悔旧肠。 ​​​", "date": "2024.04.13", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5022618344227456 - 鹧鸪天 别样春游/01.jpg"]}, {"id": "5022978964717951", "title": "七绝·闻事吟", "genre": "七绝", "body": "善友同行世路宽，\n无情风雨共承担。\n征途坎坷勤携手，\n对视抬头望远天。 ​​​", "date": "2024.04.14", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5022978964717951 - 七绝       闻事吟/01.jpg"]}, {"id": "5023351279979222", "title": "唐多令·贺马逍新婚", "genre": "唐多令", "body": "春雨贵如油，\n花枝彩染头。\n宴会厅、灯丽光流。\n友子成婚宾客喜，\n尊盏满、贺无休。\n父母乐悠悠，\n新人笑语稠。\n自今朝、爱甚情周。\n共枕同眠寻好梦，\n携玉手、任欢游。 ​​​", "date": "2024.04.15", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5023351279979222 - 唐多令 贺马逍新婚/01.jpg"]}, {"id": "5023745587285771", "title": "清平乐·吟趣", "genre": "清平乐", "body": "借凭婚宴，\n幸会同窗面。\n别久各忙鲜有见，\n今日归休多半。\n左右斑鬓霜丝，\n容光不似当时。\n谈笑不曾相认，\n说来名姓深知。 ​​​", "date": "2024.04.16", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/5023745587285771 - 清平乐       吟趣/01.jpg"]}, {"id": "5024065808501812", "title": "七律·廉州一绝", "genre": "七律", "body": "华夏宫灯自藁城，\n屯头工匠远闻名。\n一村千户心灵巧，\n十巷九条庭院红。\n王谢堂前飘丽影，\n天安门上映长空。\n神州内外赢声誉，\n寰宇楼台舞彩缨。 ​​​", "date": "2024.04.17", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5024065808501812 - 七律    廉州一绝/01.jpg", "冰雪诗词_全部图片/5024065808501812 - 七律    廉州一绝/02.jpg", "冰雪诗词_全部图片/5024065808501812 - 七律    廉州一绝/03.jpg", "冰雪诗词_全部图片/5024065808501812 - 七律    廉州一绝/04.jpg", "冰雪诗词_全部图片/5024065808501812 - 七律    廉州一绝/05.jpg", "冰雪诗词_全部图片/5024065808501812 - 七律    廉州一绝/06.jpg"]}, {"id": "5024433070410682", "title": "朝中措·贺爹高寿", "genre": "朝中措", "body": "八十有二寿辰来，\n三月百花开。\n初九天晴柳翠，\n风摇香絮袭怀。\n孙男孝女，\n争前拜祝，\n玉馔盈台。\n樽盏染红苍鬓，\n燕莺高啭徘徊。 ​​​", "date": "2024.04.18", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5024433070410682 - 朝中措 贺爹高寿/01.jpg"]}, {"id": "5024796557707445", "title": "菩萨蛮·吟望", "genre": "菩萨蛮", "body": "时逢谷雨春将暮，\n落红飞絮飘无数。\n不必惹伤愁，\n天择适者留。\n芳郊苗木壮，\n逐日蒸蒸上。\n四野绿成荫，\n凝眸景色新。 ​​​", "date": "2024.04.19", "themes": ["四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5024796557707445 - 菩萨蛮        吟望/01.jpg"]}, {"id": "5025167128920795", "title": "七绝·闻事吟", "genre": "七绝", "body": "年少谁知父母心，\n几多白眼对家亲。\n秋来悔恨光如箭，\n不待回头雪染身。 ​​​", "date": "2024.04.20", "themes": ["亲情友情与人间至爱"], "images": ["冰雪诗词_全部图片/5025167128920795 - 七绝        闻事吟/01.jpg"]}, {"id": "5025518540557669", "title": "七绝·暮春吟望", "genre": "七绝", "body": "无欲青云闲自在，\n欢腾溪水向东流。\n知足心底宽明亮，\n寡淡得失少苦愁。 ​​​", "date": "2024.04.21", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5025518540557669 - 七绝   暮春吟望/01.jpg"]}, {"id": "5025886765582448", "title": "七绝·中文美", "genre": "七绝", "body": "撇捺钩横笺上描，\n龙翔凤翥墨香飘。\n翠微碧落扶摇韵，\n漫卷尘寰气自豪。 ​​​", "date": "2024.04.22", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5025886765582448 - 七绝       中文美/01.jpg"]}, {"id": "5026251211539518", "title": "七律·鹤翔庄有感", "genre": "七律", "body": "奇经妙络脉相连，\n百会中通到涌泉。\n气走任督周复始，\n意行天地远回还。\n青蜓点水盈精血，\n白鹤凌空疏胆肝。\n日夜无形除病灶，\n春秋永志养容颜。 ​​​", "date": "2024.04.23", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5026251211539518 - ​七律 鹤翔庄有感/01.jpg"]}, {"id": "5027067130806515", "title": "七绝·春暮吟", "genre": "七绝", "body": "时光牵手风拂面，\n日月悠悠尘世间。\n回首人生花甲过，\n且凭诗酒度余年。 ​​​", "date": "2024.04.25", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5027067130806515 - 七绝       春暮吟/01.jpg"]}, {"id": "5027326340106491", "title": "七律·贺发射成功", "genre": "七律", "body": "神舟似箭入苍穹，\n裹带黄河不老风。\n映衬牡丹花更艳，\n启熏笑脸韵无穷。\n一十八次飞天地，\n亿万千回欢舞声。\n探月逐星今古事，\n嫦娥颙望断悲情。 ​​​", "date": "2024.04.26", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5027326340106491 - 七律 贺发射成功/01.jpg", "冰雪诗词_全部图片/5027326340106491 - 七律 贺发射成功/02.jpg"]}, {"id": "5027688543160756", "title": "鹧鸪天·暮春寄友", "genre": "鹧鸪天", "body": "细雨轻雷电闪鸣，\n城南一味友相逢。\n廉州地主诚心待，\n京邑宾朋笑脸红。\n樽醪满，馔香萦。\n趣谈妙语蕴深情。\n不觉窗外云霄霁，\n挽手呼车送一程。 ​​​", "date": "2024.04.27", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5027688543160756 - 鹧鸪天 暮春寄友/01.jpg"]}, {"id": "5028057645585295", "title": "七绝·暮春吟望", "genre": "七绝", "body": "品茗春涧观峰翠，\n听鸟闻香人自醉。\n云骤风急雨洗茶，\n古亭依旧山崖媚。 ​​​", "date": "2024.04.28", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5028057645585295 - 七绝    暮春吟望/01.jpg"]}, {"id": "5028415828919817", "title": "七绝·隔岸吟望", "genre": "七绝", "body": "虚讲自由愚弄人，\n言行切莫背其心。\n曾夸风景今相遇，\n触动神经乱了魂。 ​​​", "date": "2024.04.29", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5028415828919817 - 七绝    隔岸吟望/01.jpg"]}, {"id": "5028778230941812", "title": "七绝·节前吟", "genre": "七绝", "body": "人逢节假有忙闲，\n日月轮回昼夜间。\n花落花开方为世，\n任他苦乐扣心弦。 ​​​", "date": "2024.04.30", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5028778230941812 - 七绝       节前吟/01.jpg"]}, {"id": "5029155941124998", "title": "七律·假日吟望", "genre": "七律", "body": "五一节日艳阳欢，\n柳翠空明花色妍。\n洒水车来街道净，\n游人影过笑声连。\n飞天侠客云边落，\n入海艨艟浪里潜。\n华夏山川旗劲舞，\n城乡锣鼓响尘寰。 ​​​", "date": "2024.05.01", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5029155941124998 - 七律    假日吟望/01.jpg", "冰雪诗词_全部图片/5029155941124998 - 七律    假日吟望/02.jpg"]}, {"id": "5029498947372803", "title": "七绝·观图有寄", "genre": "七绝", "body": "晓来屏上望乳山，\n忽起情思绪万千。\n三载未曾闻牡蛎，\n预期今岁可尝鲜。 ​​​", "date": "2024.05.02", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5029498947372803 - 七绝    观图有寄/01.jpg", "冰雪诗词_全部图片/5029498947372803 - 七绝    观图有寄/02.jpg", "冰雪诗词_全部图片/5029498947372803 - 七绝    观图有寄/03.jpg"]}, {"id": "5029862471109416", "title": "七绝·题图", "genre": "七绝", "body": "一挺一弯一瞬间，\n此情胜似万千言。\n料他遗臭三生世，\n羞愧子孙八百年。 ​​​", "date": "2024.05.03", "themes": ["亲情友情与人间至爱", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5029862471109416 - 七绝           题图/01.jpg"]}, {"id": "5030227254446341", "title": "采桑子·五四寄怀", "genre": "采桑子", "body": "青春不负当年事。\n岁月多情，\n回味无穷。\n镜里飞霜染鬓容。\n周边柳翠鲜花艳。\n盛世峥嵘，\n探海巡空。\n昨见嫦娥舞月宫。 ​​​", "date": "2024.05.04", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5030227254446341 - 采桑子 五四寄怀/01.jpg"]}, {"id": "5030611360680622", "title": "卜算子·时令吟", "genre": "卜算子", "body": "晓雨送春归，\n夏日悠然到。\n水碧花红气色新，\n树杪鸣莺闹。\n节假剩一天，\n本欲东行了。\n二老牵心动魄魂，\n续把恩情报。 ​​​", "date": "2024.05.05", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5030611360680622 - 卜算子    时令吟/01.jpg"]}, {"id": "5031315008918827", "title": "七绝·福祸", "genre": "七绝", "body": "真假李逵千百年，\n唬人弄鬼不周全。\n本尊虚拟同屏语，\n便是亲朋认亦难。 ​​​", "date": "2024.05.07", "themes": ["亲情友情与人间至爱"], "images": ["冰雪诗词_全部图片/5031315008918827 - 七绝           福祸/01.jpg"]}, {"id": "5031788854382929", "title": "七绝·悲", "genre": "七绝", "body": "井底之蛙望斗天，\n不知四外阔无边。\n虫前狂语何如我，\n忽落砖头小命完。 ​​​", "date": "2024.05.08", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5031788854382929 - 七绝              悲/01.jpg"]}, {"id": "5031790695678569", "title": "七绝·悲", "genre": "七绝", "body": "岛底之蛙望斗天，\n不知四外阔无边。\n虫前狂语何如我，\n忽落砖头小命完。 ​​​", "date": "2024.05.08", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5031790695678569 - ​七绝              悲/01.jpg"]}, {"id": "5032428852744754", "title": "鹧鸪天·吟望寄怀", "genre": "鹧鸪天", "body": "杨柳摇风乱絮飞，\n行人无奈苦伤悲。\n呛喉咳嗽声难断，\n迷眼喷酸泪不归。\n花已落，雨频催。\n暮春愁色鬓边堆。\n何当天际空明净，\n昂首凭栏展骏眉。 ​​​", "date": "2024.05.10", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5032428852744754 - 鹧鸪天 吟望寄怀/01.jpg"]}, {"id": "5033126403768496", "title": "鹧鸪天·母亲快乐并祝儿生日", "genre": "鹧鸪天", "body": "耆老娘亲白发稀，情思受限语多迟。\n闲聊常问孙何处，兴起频言岁几时。\n行缓慢，坐斜依。粗粮饭菜最当吃。\n缺牙少味浑呑咽，和蔼苍颜事不期。 ​​​", "date": "2024.05.12", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5033126403768496 - 鹧鸪天        母亲快乐并祝儿生日/01.jpg"]}, {"id": "5033906556895945", "title": "一剪梅·吟痛", "genre": "一剪梅", "body": "初夏当空絮扰人，\n迷眼分神，睁眼无神。\n红斑漫起痒周身，\n坐亦烦心，卧亦烦心。\n吃药难舒又吊针，\n举目无亲，招手无亲。\n昼宵独自苦相侵，\n无奈呻吟，谁解呻吟。 ​​​", "date": "2024.05.14", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5033906556895945 - 一剪梅         吟痛/01.jpg"]}, {"id": "5034613103663513", "title": "七绝·世间吟望", "genre": "七绝", "body": "近邻交往有人嫌，\n搅棍投石语恶言。\n惟恐比肩同挽手，\n掀翻独霸换新天。 ​​​", "date": "2024.05.16", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5034613103663513 - 七绝    世间吟望/01.jpg"]}, {"id": "5035001903842081", "title": "踏莎行·夏日吟望", "genre": "踏莎行", "body": "袅袅青烟，\n欣欣绿浪。\n无垠阡陌风光靓。\n灌浆麦粒喜垂头，\n迎风摇曳心怀壮。\n昭示丰收，\n加深盼望。\n农家盘算豪情涨。\n秋来置业盖新屋，\n孩儿嫁娶追时尚。 ​​​", "date": "2024.05.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5035001903842081 - 踏莎行 夏日吟望/01.jpg"]}, {"id": "5035676166521355", "title": "七绝·夏日闲吟", "genre": "七绝", "body": "小满将临籽灌浆，\n尚须滋育待时光。\n人生最忌功初就，\n唤雨呼风声调扬。 ​​​", "date": "2024.05.19", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5035676166521355 - 七绝    夏日闲吟/01.jpg"]}, {"id": "5036031496161842", "title": "七绝·记事吟", "genre": "七绝", "body": "十天滴液日如年，\n小满来临体魄还。\n尚有残斑留印迹，\n遇人相问俏开言。 ​​​", "date": "2024.05.20", "themes": ["四时风光与节气流转", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5036031496161842 - 七绝       记事吟/01.jpg"]}, {"id": "5036386980463588", "title": "踏莎行·尘寰吟望", "genre": "踏莎行", "body": "国际风云，\n江湖涛浪。\n奈何四处狼烟漾。\n多家首脑死伤悲，\n天知幕后真情况。\n纵是阴谋，\n切毋狂妄。\n言行无耻双簧唱。\n画皮内外渐分明，\n终将白骨灰埋葬。 ​​​", "date": "2024.05.21", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5036386980463588 - 踏莎行 尘寰吟望/01.jpg"]}, {"id": "5036748291709583", "title": "七绝·凭栏吟望", "genre": "七绝", "body": "小楼对面起高层，\n昔日垄田回忆中。\n麦浪摇风香不再，\n喧嚣趋甚乱心情。 ​​​", "date": "2024.05.22", "themes": ["羁旅思乡与行吟纪游", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5036748291709583 - 七绝    凭栏吟望/01.jpg"]}, {"id": "5037113544540691", "title": "七绝·致敬任总", "genre": "七绝", "body": "不因域外喜伤悲，\n自主图强血汗挥。\n雪耻莫言头拱地，\n堪为华夏树丰碑。 ​​​", "date": "2024.05.23", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5037113544540691 - 七绝    致敬任总/01.jpg"]}, {"id": "5037483068753929", "title": "鹧鸪天·六一吟望", "genre": "鹧鸪天", "body": "节日将临童稚欢，\n多姿溢彩幼儿园。\n朱唇浅靥招人笑，\n纤手明眸舞院前。\n钢琴秀，彩旗妍。\n歌声飘荡入云天。\n枝头小鸟频频顾，\n几欲同台一起玩。 ​​​", "date": "2024.05.24", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5037483068753929 - 鹧鸪天 六一吟望/01.jpg", "冰雪诗词_全部图片/5037483068753929 - 鹧鸪天 六一吟望/02.jpg", "冰雪诗词_全部图片/5037483068753929 - 鹧鸪天 六一吟望/03.jpg"]}, {"id": "5037838431421723", "title": "七绝·夏日闲吟", "genre": "七绝", "body": "花开叶落赖天公，\n昂首垂头气自胸。\n心态充盈难亦乐，\n神情懈怠苦无穷。 ​​​", "date": "2024.05.25", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5037838431421723 - 七绝    夏日闲吟/01.jpg"]}, {"id": "5038221128630418", "title": "踏莎行·小聚咏怀", "genre": "踏莎行", "body": "故友情深，\n乳鸽香溢。\n芳醪玉液怀思寄。\n曾经幕幕眼前来，\n回头三秩光阴逝。\n邀聚新朋，\n拜商愁事。\n姐孩托付吾兄弟。\n时常教悔用真心，\n赢得日后终生记。 ​​​", "date": "2024.05.26", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5038221128630418 - 踏莎行 小聚咏怀/01.jpg"]}, {"id": "5038573072157309", "title": "太常引·寄语独蛙", "genre": "太常引", "body": "两天围岛练兵枪。看似不心慌。\n肚里苦回肠。弹丸地、如何躲藏。\n水天无际，云梯不稳，胆颤嘴呈强。\n只怕闪雷光。声响处、鱼虾死伤。 ​​​", "date": "2024.05.27", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5038573072157309 - 太常引          寄语独蛙/01.jpg"]}, {"id": "5038929420225069", "title": "蝶恋花·叙旧咏怀", "genre": "蝶恋花", "body": "酒过三巡频握手。\n挚友深情，言语心肝透。\n斑鬓霜丝追往旧，\n曾经岁月欢回首。\n奉献芳华人已瘦。\n各自归休，且与孙娃逗。\n最是开心今聚后，\n人情家事聊无够。 ​​​", "date": "2024.05.28", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5038929420225069 - ​  蝶恋花         叙旧咏怀/01.jpg"]}, {"id": "5039301097687922", "title": "七律·小店深情", "genre": "七律", "body": "寻常酒馆聚珍朋，\n丽日青云映暖空。\n玉液穿肠温旧事，\n清茶入口话闲情。\n香醪满盏心怀醉，\n细语同频意趣浓。\n厅里大多人已去，\n惟余我处火还红。 ​​​", "date": "2024.05.29", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5039301097687922 - 七律    小店深情/01.jpg"]}, {"id": "5039647975804156", "title": "七绝·五月吟所见", "genre": "七绝", "body": "甜杏黄红摆路边，\n诱人色味入心田。\n下班急过歇歇脚，\n老少回家解解馋。 ​​​", "date": "2024.05.30", "themes": ["感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5039647975804156 - 七绝 五月吟所见/01.jpg", "冰雪诗词_全部图片/5039647975804156 - 七绝 五月吟所见/02.jpg", "冰雪诗词_全部图片/5039647975804156 - 七绝 五月吟所见/03.jpg"]}, {"id": "5040020821904189", "title": "清平乐·六一寄怀", "genre": "清平乐", "body": "隔空遥望，\n万里娇孙想。\n辜有音姿屏幕上，\n慰我心怀情畅。\n节前月末今朝，\n闻知亲子逍遥。\n母女同台竞技，\n幼儿园里妖娆。 ​​​", "date": "2024.05.31", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5040020821904189 - 清平乐 六一寄怀/01.jpg"]}, {"id": "5040375074653436", "title": "踏莎行·六一咏怀", "genre": "踏莎行", "body": "节日来临，\n稚童欢乐。\n青云翠鸟来相贺。\n幼儿园里舞蹁跹，\n绿茵场上歌声彻。\n旗子飘飘，\n花儿朵朵。\n园丁浇灌枝条阔。\n个中多少栋梁才，\n必成立厦擎天客。 ​​​", "date": "2024.06.01", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5040375074653436 - ​踏莎行 六一咏怀/01.jpg", "冰雪诗词_全部图片/5040375074653436 - ​踏莎行 六一咏怀/02.jpg", "冰雪诗词_全部图片/5040375074653436 - ​踏莎行 六一咏怀/03.jpg", "冰雪诗词_全部图片/5040375074653436 - ​踏莎行 六一咏怀/04.jpg", "冰雪诗词_全部图片/5040375074653436 - ​踏莎行 六一咏怀/05.jpg", "冰雪诗词_全部图片/5040375074653436 - ​踏莎行 六一咏怀/06.jpg"]}, {"id": "5040734514708659", "title": "太常引·六一有感", "genre": "太常引", "body": "光阴无奈指间流，\n稚子已白头。\n花甲更何求。\n望晚辈、行端品优。\n人和家睦，征途策马，\n世路少闲愁。\n远去有川丘，\n莫气馁、心恒志酬。 ​​​", "date": "2024.06.02", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5040734514708659 - 太常引     六一有感/01.jpg"]}, {"id": "5041098927640786", "title": "太常引·仲夏晓吟", "genre": "太常引", "body": "一轮初日耀东方。\n漫步享清凉。\n树杪闪金光。\n翠鸟醒、佳音远扬。\n晴空无际，心怀愉悦，\n思绪万千长。\n人海有闲忙。\n霜染鬓、心安梦香。 ​​​", "date": "2024.06.03", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5041098927640786 - 太常引    仲夏晓吟/01.jpg"]}, {"id": "5041473839435708", "title": "七绝·闲闻有寄", "genre": "七绝", "body": "一世人生多巧合，\n奇逢妙遇任凭说。\n有缘屡次途中会，\n阳错阴差同趟车。​ ​​​", "date": "2024.06.04", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5041473839435708 - 七绝    闲闻有寄/01.jpg"]}, {"id": "5041831998131723", "title": "七律·芒种有寄", "genre": "七律", "body": "今闻节令想当年，\n梦眼惺忪手把镰。\n随父低头挥汗雨，\n只身捆麦叹云烟。\n可怜手掌多磨泡，\n无奈腰椎难打弯。\n高考随心京邑去，\n忧愁少却六七番。 ​​​", "date": "2024.06.05", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5041831998131723 - 七律    芒种有寄/01.jpg"]}, {"id": "5042548160332977", "title": "七绝·吟望寄怀", "genre": "七绝", "body": "当年高考无人问，\n学子今朝万目追。\n俱盼挥毫高榜中，\n满门荣耀映金辉。 ​​​", "date": "2024.06.07", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5042548160332977 - 七绝    吟望寄怀/01.jpg"]}, {"id": "5042917229986947", "title": "七绝·晓来吟", "genre": "七绝", "body": "端午将临人远去，\n边陲迎夏看娇孙。\n幸得二老今无恙，\n才可辞乡落下心。 ​​​", "date": "2024.06.08", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/5042917229986947 - 七绝       晓来吟/01.jpg"]}, {"id": "5043340290820497", "title": "七律·节前出行", "genre": "七律", "body": "赛里木湖端午游，\n西疆晓色映窗流。\n岭山远近连天外，\n草树高低卧土丘。\n车上祖孙情俱悦，\n云边思绪阔无忧。\n阖家五口分头去，\n博乐相逢始自由。 ​​​", "date": "2024.06.09", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/5043340290820497 - 七律    节前出行/01.jpg", "冰雪诗词_全部图片/5043340290820497 - 七律    节前出行/02.jpg", "冰雪诗词_全部图片/5043340290820497 - 七律    节前出行/03.jpg"]}, {"id": "5043812271654676", "title": "太常引·出游宿博州", "genre": "太常引", "body": "依河夜宿似江南。\n桥树草花妍。\n清晓碧云天。\n恰端午、风和粽甜。\n早餐用罢，行程继续，\n近午到湖边。\n休整木亭间。\n蓄精气、为图畅玩。 ​​​", "date": "2024.06.10", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5043812271654676 - 太常引    出游宿博州/01.jpg", "冰雪诗词_全部图片/5043812271654676 - 太常引    出游宿博州/02.jpg", "冰雪诗词_全部图片/5043812271654676 - 太常引    出游宿博州/03.jpg"]}, {"id": "5044101106108744", "title": "太常引·游赛里木湖", "genre": "太常引", "body": "雪山环抱水青蓝。\n玉帝泪珠圆。\n净海美名传。\n五百里、湖含远天。\n帆舟竞渡，天鹅奋舞，\n风过漾波澜。\n游客聚流连。\n人接踵、车龙往还。 ​​​", "date": "2024.06.11", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5044101106108744 - 太常引   游赛里木湖/01.jpg", "冰雪诗词_全部图片/5044101106108744 - 太常引   游赛里木湖/02.jpg", "冰雪诗词_全部图片/5044101106108744 - 太常引   游赛里木湖/03.jpg", "冰雪诗词_全部图片/5044101106108744 - 太常引   游赛里木湖/04.jpg", "冰雪诗词_全部图片/5044101106108744 - 太常引   游赛里木湖/05.jpg", "冰雪诗词_全部图片/5044101106108744 - 太常引   游赛里木湖/06.jpg"]}, {"id": "5044423334038788", "title": "七绝·旅途闲吟", "genre": "七绝", "body": "览景偷闲亦健身，\n纤姿有样看娇孙。\n近朱染赤天然色，\n来去无忧若片云。 ​​​", "date": "2024.06.12", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5044423334038788 - 七绝    旅途闲吟/01.jpg"]}, {"id": "5045137589410392", "title": "太常引·夏游特克斯", "genre": "太常引", "body": "乾坤八卦布街城。\n踏入似迷宫。\n南北或西东。\n放眼望、龙吟虎鸣。\n八方四面，神同貌似，\n烟火映长空。\n天地物相通。\n风水转、人和域宁。 ​​​", "date": "2024.06.14", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5045137589410392 - 太常引    夏游特克斯/01.jpg", "冰雪诗词_全部图片/5045137589410392 - 太常引    夏游特克斯/02.jpg", "冰雪诗词_全部图片/5045137589410392 - 太常引    夏游特克斯/03.jpg"]}, {"id": "5045503303353426", "title": "鹧鸪天·游喀拉峻", "genre": "鹧鸪天", "body": "车到山门近日昏，\n微茫烟雨笼疲身。\n无穷青翠连天际，\n几处霓虹染草茵。\n鹰远翥，马狂奔。\n牛羊闲漫景温馨。\n凭栏望眼胸怀阔，\n塞外江南夏胜春。 ​​​", "date": "2024.06.15", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5045503303353426 - 鹧鸪天 游喀拉峻/01.jpg", "冰雪诗词_全部图片/5045503303353426 - 鹧鸪天 游喀拉峻/02.jpg", "冰雪诗词_全部图片/5045503303353426 - 鹧鸪天 游喀拉峻/03.jpg", "冰雪诗词_全部图片/5045503303353426 - 鹧鸪天 游喀拉峻/04.jpg", "冰雪诗词_全部图片/5045503303353426 - 鹧鸪天 游喀拉峻/05.jpg", "冰雪诗词_全部图片/5045503303353426 - 鹧鸪天 游喀拉峻/06.jpg"]}, {"id": "5045856761286999", "title": "踏莎行·老父亲", "genre": "踏莎行", "body": "手巧心灵，\n腰疼耳背。\n萦身脉络昏昏睡。\n平生良善事殷勤，\n务农实在终疲惫。\n萱草将衰，\n椿庭无悔。\n同迎风雨闻虫吠。\n朱檐青瓦共朝霞，\n悠悠岁月夕阳美。 ​​​", "date": "2024.06.16", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5045856761286999 - 踏莎行   老父亲/01.jpg"]}, {"id": "5046217090534893", "title": "七律·伊犁见闻", "genre": "七律", "body": "熏衣草处紫云烟，\n公主解忧西域间。\n香气宜人赢赞誉，\n花魂除晦保平安。\n和亲不惧乌孙远，\n白发方得汉室还。\n千载悠悠情不尽，\n天山南北美名传。 ​​​", "date": "2024.06.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5046217090534893 - 七律    伊犁见闻/01.jpg", "冰雪诗词_全部图片/5046217090534893 - 七律    伊犁见闻/02.jpg", "冰雪诗词_全部图片/5046217090534893 - 七律    伊犁见闻/03.jpg", "冰雪诗词_全部图片/5046217090534893 - 七律    伊犁见闻/04.jpg", "冰雪诗词_全部图片/5046217090534893 - 七律    伊犁见闻/05.jpg", "冰雪诗词_全部图片/5046217090534893 - 七律    伊犁见闻/06.jpg"]}, {"id": "5047619930294447", "title": "七绝·时令吟", "genre": "七绝", "body": "夏至边疆月影凉，\n避寒未敢夜开窗。\n晓来风色犹春日，\n漫步街头念故乡。 ​​​", "date": "2024.06.21", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5047619930294447 - 七绝       时令吟/01.jpg"]}, {"id": "5047988952500230", "title": "蝶恋花·稚子情欢", "genre": "蝶恋花", "body": "生日同天三女靓。\n一派祥和，\n俱是娇模样。\n糕点溢香烛火旺，\n幼童欢乐花儿唱。\n头戴皇冠人最棒。\n伫立台前，\n闪闪金光放。\n拇指齐伸均向上，\n文欢园里苗茁壮。 ​​​", "date": "2024.06.22", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5047988952500230 - 蝶恋花 稚子情欢/01.jpg"]}, {"id": "5048411910833136", "title": "蝶恋花·彩淡情深", "genre": "蝶恋花", "body": "纤手轻轻描画笔。\n彩染白猫，\n眉眼层层丽。\n黑墨点睛神几许，\n红黄蓝配添情趣。\n孙女舒怀心更喜。\n不舍难离，\n把握时时举。\n夜置床头埋被里，\n醒来紧抱亲无比。 ​​​", "date": "2024.06.23", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5048411910833136 - 蝶恋花  彩淡情深/01.jpg", "冰雪诗词_全部图片/5048411910833136 - 蝶恋花  彩淡情深/02.jpg", "冰雪诗词_全部图片/5048411910833136 - 蝶恋花  彩淡情深/03.jpg", "冰雪诗词_全部图片/5048411910833136 - 蝶恋花  彩淡情深/04.jpg", "冰雪诗词_全部图片/5048411910833136 - 蝶恋花  彩淡情深/05.jpg", "冰雪诗词_全部图片/5048411910833136 - 蝶恋花  彩淡情深/06.jpg"]}, {"id": "5048766165948300", "title": "太常引·游哈熊沟", "genre": "太常引", "body": "蜿蜒百里岭沟间。\n屡过碎石滩。\n水少草无欢。\n踏黄土、扬灰起烟。\n游人骑马，风尘漫卷，\n遮断碧云天。\n旁者莫能安。\n今朝至、身心不堪。 ​​​", "date": "2024.06.24", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5048766165948300 - 太常引     游哈熊沟/01.jpg", "冰雪诗词_全部图片/5048766165948300 - 太常引     游哈熊沟/02.jpg", "冰雪诗词_全部图片/5048766165948300 - 太常引     游哈熊沟/03.jpg", "冰雪诗词_全部图片/5048766165948300 - 太常引     游哈熊沟/04.jpg", "冰雪诗词_全部图片/5048766165948300 - 太常引     游哈熊沟/05.jpg", "冰雪诗词_全部图片/5048766165948300 - 太常引     游哈熊沟/06.jpg"]}, {"id": "5049115763282469", "title": "七绝·祥瑞凌空", "genre": "七绝", "body": "暮云漫卷似龙腾，\n寥廓神州瑞色兴。\n昂首舒怀心底畅，\n惟期天际万年青。 ​​​", "date": "2024.06.25", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5049115763282469 - 七绝    祥瑞凌空/01.jpg"]}, {"id": "5050163754172557", "title": "采桑子·迪化夏日", "genre": "采桑子", "body": "微风日暮神情爽。\n翠叶青枝，\n绿院红梯。\n老少悠闲景适宜。\n妪翁树下舒心坐。\n童稚追嘻，\n各自无欺。\n维汉祥和看此时。 ​​​", "date": "2024.06.28", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5050163754172557 - 采桑子 迪化夏日/01.jpg", "冰雪诗词_全部图片/5050163754172557 - 采桑子 迪化夏日/02.jpg"]}, {"id": "5050523243251758", "title": "采桑子·花枝初绽", "genre": "采桑子", "body": "课余舞蹈心头爱。\n乖巧娇孙，\n尽显童真。\n紧体香衣裹瘦身。\n一周两次修仨月。\n犹木逢春，\n花蕾宜人。\n韵味芬芳日日欣。 ​​​", "date": "2024.06.29", "themes": ["亲情友情与人间至爱"], "images": ["冰雪诗词_全部图片/5050523243251758 - ​采桑子 花枝初绽/01.jpg"]}, {"id": "5050890765732381", "title": "五律·领悟", "genre": "五律", "body": "室外风光热，\n书屋案卷香。\n桌旁一母女，\n手里几篇章。\n慈母轻声念，\n娇儿细嗓扬。\n温馨人羡慕，\n惬意韵悠长。 ​​​", "date": "2024.06.30", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5050890765732381 - ​五律    领悟/01.jpg", "冰雪诗词_全部图片/5050890765732381 - ​五律    领悟/02.jpg"]}, {"id": "5051266386100994", "title": "清平乐·庆七一", "genre": "清平乐", "body": "童心向党，\n朵朵花儿放。\n枝叶欣繁争向上，\n自是根苗茁壮。\n文欢沃土丰田，\n园丁耕作少言。\n向日葵香四溢，\n含情仪态芳妍。 ​​​", "date": "2024.07.01", "themes": ["家国情怀与时代歌咏", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5051266386100994 - 清平乐    庆七一/01.jpg", "冰雪诗词_全部图片/5051266386100994 - 清平乐    庆七一/02.jpg", "冰雪诗词_全部图片/5051266386100994 - 清平乐    庆七一/03.jpg", "冰雪诗词_全部图片/5051266386100994 - 清平乐    庆七一/04.jpg", "冰雪诗词_全部图片/5051266386100994 - 清平乐    庆七一/05.jpg", "冰雪诗词_全部图片/5051266386100994 - 清平乐    庆七一/06.jpg"]}, {"id": "5051614216587348", "title": "清平乐·健身有寄", "genre": "清平乐", "body": "老来缓动。\n游泳随人性，\n器械架前谁与共。\n莫要争强好胜。\n练家相互切磋，\n闲来独自琢磨。\n疑惑咨询私教，\n涓涓细水成河。 ​​​", "date": "2024.07.02", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5051614216587348 - 清平乐 健身有寄/01.jpg", "冰雪诗词_全部图片/5051614216587348 - 清平乐 健身有寄/02.jpg", "冰雪诗词_全部图片/5051614216587348 - 清平乐 健身有寄/03.jpg", "冰雪诗词_全部图片/5051614216587348 - 清平乐 健身有寄/04.jpg", "冰雪诗词_全部图片/5051614216587348 - 清平乐 健身有寄/05.jpg", "冰雪诗词_全部图片/5051614216587348 - 清平乐 健身有寄/06.jpg"]}, {"id": "5051984039642015", "title": "鹧鸪天·夏日喜雨", "genre": "鹧鸪天", "body": "夜霁银空晓色凉，\n驱除炎热泛清香。\n天边旭日云层破，\n树上污尘水洗光。\n青叶秀，细风扬。\n行人吐纳气丝长。\n胸怀饱满舒心去，\n一昼能当两昼忙。 ​​​", "date": "2024.07.03", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5051984039642015 - 鹧鸪天 夏日喜雨/01.jpg"]}, {"id": "5052354927794397", "title": "七律·贺深中直通", "genre": "七律", "body": "昔人文氏叹伶仃，\n今日穿洋走地宫。\n举世闻听惊转赞，\n神州笑傲更从容。\n飞天潜海寻常事，\n探月捉鳖乐不穷。\n水陆桥涵通内外，\n舟车驰越岭川行。 ​​​", "date": "2024.07.04", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5052354927794397 - 七律 贺深中直通/01.jpg", "冰雪诗词_全部图片/5052354927794397 - 七律 贺深中直通/02.jpg", "冰雪诗词_全部图片/5052354927794397 - 七律 贺深中直通/03.jpg", "冰雪诗词_全部图片/5052354927794397 - 七律 贺深中直通/04.jpg", "冰雪诗词_全部图片/5052354927794397 - 七律 贺深中直通/05.jpg", "冰雪诗词_全部图片/5052354927794397 - 七律 贺深中直通/06.jpg"]}, {"id": "5053428424246926", "title": "七律·夏日别趣", "genre": "七律", "body": "化作青蛙仰望天，\n景观不似在人间。\n透光荷叶他番趣，\n映日莲花别样妍。\n菡萏高枝纤挺立，\n青云碎影水中含。\n大千世界多奇妙，\n便是圣才难认全。 ​​​", "date": "2024.07.07", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5053428424246926 - 七律    夏日别趣/01.jpg", "冰雪诗词_全部图片/5053428424246926 - 七律    夏日别趣/02.jpg"]}, {"id": "5054513737630726", "title": "七绝·闲来吟望", "genre": "七绝", "body": "贼子心虚乱咬人，\n妄言白昼是黄昏。\n损招不断徒得意，\n到了翻伤自个身。 ​​​", "date": "2024.07.10", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5054513737630726 - 七绝    闲来吟望/01.jpg", "冰雪诗词_全部图片/5054513737630726 - 七绝    闲来吟望/02.jpg"]}, {"id": "5054893515868573", "title": "五绝·淀中乐", "genre": "五绝", "body": "老者荡轻舟，\n鱼虾为所求。\n把樽餐美味，\n兜鼓眼神牛。 ​​​", "date": "2024.07.11", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5054893515868573 - 五绝 淀中乐/01.jpg"]}, {"id": "5055263856394487", "title": "五律·吟东南", "genre": "五律", "body": "​蛙岛人关注，\n舰机巡不停。\n鸟虫闻讯闹，\n草木遇风惊。\n独子胡言语，\n家亲掷地声。\n离乡时已远，\n莫待苦无穷。 ​​​", "date": "2024.07.12", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5055263856394487 - 五律 吟东南/01.jpg", "冰雪诗词_全部图片/5055263856394487 - 五律 吟东南/02.jpg"]}, {"id": "5055601862250788", "title": "七律·新世缘", "genre": "七律", "body": "俩童本是北京人，\n奇遇边疆真个神。\n同在小区前后住，\n共居园里铺相临。\n课余携手滑梯上，\n檐下齐眉歌舞群。\n三五春秋能再见，\n帝都或许一师门。 ​​​", "date": "2024.07.13", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/5055601862250788 - 七律        新世缘/01.jpg"]}, {"id": "5056387136098081", "title": "七律·数伏有寄", "genre": "七律", "body": "又入神州最热天，\n疆城干爽不湿粘。\n太阳底下光难耐，\n绿树荫中风自闲。\n早晚出行人惬意，\n柳枝鸣唱醉高蝉。\n遥思故里三伏日，\n汗水盈身夜未眠。 ​​​", "date": "2024.07.15", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5056387136098081 - 七律    数伏有寄/01.jpg"]}, {"id": "5056751457535824", "title": "鹧鸪天·游独山子", "genre": "鹧鸪天", "body": "鹿角湾中起野餐，\n娇孙笑靥映云寰。\n大峡谷里婆媳舞，\n独库路头风景妍。\n博物馆，忆从前。\n工兵将士战天山。\n百多英烈长眠此，\n南北疆通利万年。 ​​​", "date": "2024.07.16", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5056751457535824 - 鹧鸪天 游独山子/01.jpg", "冰雪诗词_全部图片/5056751457535824 - 鹧鸪天 游独山子/02.jpg", "冰雪诗词_全部图片/5056751457535824 - 鹧鸪天 游独山子/03.jpg", "冰雪诗词_全部图片/5056751457535824 - 鹧鸪天 游独山子/04.jpg", "冰雪诗词_全部图片/5056751457535824 - 鹧鸪天 游独山子/05.jpg", "冰雪诗词_全部图片/5056751457535824 - 鹧鸪天 游独山子/06.jpg", "冰雪诗词_全部图片/5056751457535824 - 鹧鸪天 游独山子/07.jpg", "冰雪诗词_全部图片/5056751457535824 - 鹧鸪天 游独山子/08.jpg", "冰雪诗词_全部图片/5056751457535824 - 鹧鸪天 游独山子/09.jpg"]}, {"id": "5057114903152023", "title": "鹧鸪天·峡谷吟", "genre": "鹧鸪天", "body": "神斧轻划地裂开，\n石崖玉壁眼前排。\n俯身探看深无底，\n吊胆移挪惊满怀。\n峡谷事，客思猜。\n终无谁可道明白。\n人间风物尤如此，\n多少情形空叹哀。 ​​​", "date": "2024.07.17", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5057114903152023 - 鹧鸪天    峡谷吟/01.jpg", "冰雪诗词_全部图片/5057114903152023 - 鹧鸪天    峡谷吟/02.jpg", "冰雪诗词_全部图片/5057114903152023 - 鹧鸪天    峡谷吟/03.jpg"]}, {"id": "5057427114558881", "title": "七律·独库英雄赞", "genre": "七律", "body": "天山横亘东西向，\n阻断九霄南北风。\n便是雄鹰悲且叹，\n奈何骏马冷无情。\n凿石筑路一声令，\n挥镐推车十万兵。\n卧雪战冰餐血汗，\n畅通疆域慰英灵。 ​​​", "date": "2024.07.18", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5057427114558881 - 七律 独库英雄赞/01.jpg", "冰雪诗词_全部图片/5057427114558881 - 七律 独库英雄赞/02.jpg", "冰雪诗词_全部图片/5057427114558881 - 七律 独库英雄赞/03.jpg"]}, {"id": "5058180597943410", "title": "蝶恋花·大美新疆", "genre": "蝶恋花", "body": "夏日冰川风色美。\n四面八方，\n游客心陶醉。\n如镜天池凝碧水，\n惊魂峡谷叠青翠。\n独库车流南或北。\n四季同天，\n雨雪时交会。\n遍览草原花点缀，\n大巴扎里还回味。 ​​​", "date": "2024.07.20", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5058180597943410 - 蝶恋花 大美新疆/01.jpg", "冰雪诗词_全部图片/5058180597943410 - 蝶恋花 大美新疆/02.jpg", "冰雪诗词_全部图片/5058180597943410 - 蝶恋花 大美新疆/03.jpg", "冰雪诗词_全部图片/5058180597943410 - 蝶恋花 大美新疆/04.jpg", "冰雪诗词_全部图片/5058180597943410 - 蝶恋花 大美新疆/05.jpg", "冰雪诗词_全部图片/5058180597943410 - 蝶恋花 大美新疆/06.jpg"]}, {"id": "5058876158249766", "title": "七绝·边城夏吟", "genre": "七绝", "body": "大暑多云树色深，\n炎光隐去晓宜人。\n轻身晨练微出汗，\n犹似故乡逢暮春。 ​​​", "date": "2024.07.22", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5058876158249766 - 七绝    边城夏吟/01.jpg"]}, {"id": "5059239645549286", "title": "七绝·夏日闲吟", "genre": "七绝", "body": "长空堆荡彩云山，\n七色交织恁壮观。\n华夏今朝逢盛世，\n霞辉染遍九州天。 ​​​", "date": "2024.07.23", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5059239645549286 - 七绝   夏日闲吟/01.jpg", "冰雪诗词_全部图片/5059239645549286 - 七绝   夏日闲吟/02.jpg", "冰雪诗词_全部图片/5059239645549286 - 七绝   夏日闲吟/03.jpg"]}, {"id": "5059779191898228", "title": "七绝·夏日暮吟", "genre": "七绝", "body": "余辉闲照意悠然，\n自在爷孙楼树间。\n水榭高台风漫过，\n不觉暑气只闻蝉。 ​​​", "date": "2024.07.24", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5059779191898228 - 七绝    夏日暮吟/01.jpg", "冰雪诗词_全部图片/5059779191898228 - 七绝    夏日暮吟/02.jpg", "冰雪诗词_全部图片/5059779191898228 - 七绝    夏日暮吟/03.jpg"]}, {"id": "5059965130378279", "title": "采桑子·闻事有寄", "genre": "采桑子", "body": "散沙风卷飘无处。\n粘聚如钢，\n抵挡刀枪。\n阻水遮光耐雪霜。\n世间万物真奇妙。\n骤短忽长，\n乍热还凉。\n把握时机弱转强。 ​​​", "date": "2024.07.25", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5059965130378279 - ​采桑子 闻事有寄/01.jpg"]}, {"id": "5060369669690171", "title": "五绝·夏愁", "genre": "五绝", "body": "千般防不住，\n一霎醒来疼。\n肿胀孩童闹，\n阖家夜未宁。 ​​​", "date": "2024.07.26", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5060369669690171 - 五绝    夏愁/01.jpg"]}, {"id": "5060674151779220", "title": "踏莎行·巴黎吟望", "genre": "踏莎行", "body": "一水行舟，\n五星耀眼。\n中华儿女骄姿艳。\n红旗摇荡满怀情，\n凝神铆劲金牌献。\n奥运搭台，\n宾朋会面。\n俯身竞技争长短。\n更高更快妙无穷，\n探珠何惧龙宫远。 ​​​", "date": "2024.07.27", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5060674151779220 - 踏莎行 巴黎吟望/01.jpg", "冰雪诗词_全部图片/5060674151779220 - 踏莎行 巴黎吟望/02.jpg", "冰雪诗词_全部图片/5060674151779220 - 踏莎行 巴黎吟望/03.jpg"]}, {"id": "5061037345213648", "title": "采桑子·登雅山有寄", "genre": "采桑子", "body": "群楼怎抵山峰秀。\n四望无边，\n抬手及天。\n近日沾辉云里闲。\n谋生眺远登高处。\n敞阔心田，\n多是良言。\n稳妥餐行避祸端。 ​​​", "date": "2024.07.28", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5061037345213648 - 采桑子 登雅山有寄/01.jpg", "冰雪诗词_全部图片/5061037345213648 - 采桑子 登雅山有寄/02.jpg", "冰雪诗词_全部图片/5061037345213648 - 采桑子 登雅山有寄/03.jpg"]}, {"id": "5061416998670218", "title": "鹧鸪天·夏日闲吟", "genre": "鹧鸪天", "body": "漫步闲思发会呆，\n挥毫随写老心怀。\n见闻化作诗词句，\n善恶说来任剪裁。\n君莫笑，子宜猜。\n世间万事悟中开。\n盲人摸象非全貌，\n瞎子点灯鬼不来。 ​​​", "date": "2024.07.29", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5061416998670218 - 鹧鸪天 夏日闲吟/01.jpg"]}, {"id": "5062122566324336", "title": "蝶恋花·升班典礼赞", "genre": "蝶恋花", "body": "一.\n文苑鲜花初绽放，\n喜看枝头，\n幼鸟齐声唱。\n最是园丁当赞赏，\n春秋寒暑苗儿壮。\n童稚一年多变样。\n认字学歌，\n礼貌成时尚。\n戴帽穿衣纤手上，\n乐得家长心花放。\n二.\n一早驱车孙女笑。\n剧场登台，\n敬庆八一到。\n音乐飞扬银幕闹，\n文欢此刻星光耀。\n玉女金童争汇报。\n独奏群歌，\n舞蹈情兼貌。\n花朵缤纷空里俏，\n童心向党春晖照。", "date": "2024.07.31", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5062122566324336 - 蝶恋花 升班典礼赞/01.jpg", "冰雪诗词_全部图片/5062122566324336 - 蝶恋花 升班典礼赞/02.jpg", "冰雪诗词_全部图片/5062122566324336 - 蝶恋花 升班典礼赞/03.jpg", "冰雪诗词_全部图片/5062122566324336 - 蝶恋花 升班典礼赞/04.jpg", "冰雪诗词_全部图片/5062122566324336 - 蝶恋花 升班典礼赞/05.jpg", "冰雪诗词_全部图片/5062122566324336 - 蝶恋花 升班典礼赞/06.jpg"]}, {"id": "5062491984105856", "title": "采桑子·庆八一", "genre": "采桑子", "body": "军旗擎举边防稳。\n疆固民安，\n功盖长天。\n寥廓神州山水妍。\n枕戈将士餐风雪。\n行坐优先，\n牢记心田。\n风气将成转自然。 ​​​", "date": "2024.08.01", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5062491984105856 - 采桑子    庆八一/01.jpg"]}, {"id": "5062844502770948", "title": "蝶恋花·贺潘展乐", "genre": "蝶恋花", "body": "碧水池中催浪起。\n鬼愕神惊，\n华夏添新喜。\n打破白人争霸事，\n神州骄子宣绝技。\n闻讯今朝情不自。\n提笔抒怀，\n发泄窝囊气。\n尿检不公由美帝，\n转身夺冠名于世！ ​​​", "date": "2024.08.02", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5062844502770948 - 蝶恋花 贺潘展乐/01.jpg", "冰雪诗词_全部图片/5062844502770948 - 蝶恋花 贺潘展乐/02.jpg", "冰雪诗词_全部图片/5062844502770948 - 蝶恋花 贺潘展乐/03.jpg"]}, {"id": "5063208844919344", "title": "蝶恋花·贺邓雅文", "genre": "蝶恋花", "body": "驱动小轮成大事。\n跨界前来，\n首秀赢佳绩。\n汗水无言千万次，\n一朝夺冠名天际。\n凭借青春留印迹。\n妙写春秋，\n光耀三生世。\n莫道付出犹水逝，\n逐涛击浪风云丽。 ​​​", "date": "2024.08.03", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5063208844919344 - 蝶恋花 贺邓雅文/01.jpg", "冰雪诗词_全部图片/5063208844919344 - 蝶恋花 贺邓雅文/02.jpg", "冰雪诗词_全部图片/5063208844919344 - 蝶恋花 贺邓雅文/03.jpg"]}, {"id": "5063650878685787", "title": "江城子·贺郑钦文", "genre": "江城子", "body": "网单女冠谱新篇。\n几十年，梦儿圆。\n笑傲巴黎，\n旗展五星妍。\n奥运神州多靓丽。\n龙腾跃，映长天。\n钦文汗水洗娇颜。\n屡夺关，苦翻甜。\n一路挥拍，\n纵马跃山巅。\n含泪回眸一霎那。\n思华夏，意缠绵。 ​​​", "date": "2024.08.04", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5063650878685787 - 江城子 贺郑钦文/01.jpg", "冰雪诗词_全部图片/5063650878685787 - 江城子 贺郑钦文/02.jpg", "冰雪诗词_全部图片/5063650878685787 - 江城子 贺郑钦文/03.jpg"]}, {"id": "5063991124822739", "title": "鹧鸪天·重游江布拉克", "genre": "鹧鸪天", "body": "景色依稀入眼亲，峰峦叠翠映白云。\n随风麦浪金光闪，拔地云杉落绿荫。\n逃暑热，趁清欣。房车游客各成群。\n帐篷遍地闲人卧，鹰鸟当空闻水音。\n附：去年七月二十五日游记\n沁园春      江布拉克\n古郡奇台，百里方圆，万顷山川。\n眺松林雪岭，霄连地漫，花涛麦浪，绿绣红妍。\n峡谷清幽，白云舒卷，牛马成群映草原。\n风凉夏，纵晴明无雨，入夜微寒。\n穿行犹似云端。花海子，展眸不到边。\n遇怪坡上下，有违物理，星空宵昼，别具风烟。\n溪水轻流，雄鹰高翥，醉卧毡篷好梦眠。\n宜避暑，度消魂日月，不慕神仙。", "date": "2024.08.05", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5063991124822739 - 鹧鸪天     重游江布拉克/01.jpg", "冰雪诗词_全部图片/5063991124822739 - 鹧鸪天     重游江布拉克/02.jpg", "冰雪诗词_全部图片/5063991124822739 - 鹧鸪天     重游江布拉克/03.jpg", "冰雪诗词_全部图片/5063991124822739 - 鹧鸪天     重游江布拉克/04.jpg", "冰雪诗词_全部图片/5063991124822739 - 鹧鸪天     重游江布拉克/05.jpg", "冰雪诗词_全部图片/5063991124822739 - 鹧鸪天     重游江布拉克/06.jpg", "冰雪诗词_全部图片/5063991124822739 - 鹧鸪天     重游江布拉克/07.jpg", "冰雪诗词_全部图片/5063991124822739 - 鹧鸪天     重游江布拉克/08.jpg", "冰雪诗词_全部图片/5063991124822739 - 鹧鸪天     重游江布拉克/09.jpg"]}, {"id": "5064363142027512", "title": "鹧鸪天·游江布拉克有寄", "genre": "鹧鸪天", "body": "茂密云杉隐木屋，恰逢大暑昼宵舒。\n祖孙山坳蘑菇采，松鼠枝头精气足。\n山野静，好读书。忧烦杂念瞬时除。\n若得逢夏长居此，不道人间还数伏。 ​​​", "date": "2024.08.06", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5064363142027512 - 鹧鸪天    游江布拉克有寄/01.jpg", "冰雪诗词_全部图片/5064363142027512 - 鹧鸪天    游江布拉克有寄/02.jpg", "冰雪诗词_全部图片/5064363142027512 - 鹧鸪天    游江布拉克有寄/03.jpg"]}, {"id": "5064673143294674", "title": "七绝·立秋吟", "genre": "七绝", "body": "一夜西风晓转凉，\n抬头偶见叶微黄。\n人情天道寻常理，\n瞅准时机行与藏。 ​​​", "date": "2024.08.07", "themes": ["四时风光与节气流转", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5064673143294674 - 七绝       立秋吟/01.jpg"]}, {"id": "5065036928913702", "title": "七绝·赞潘展乐", "genre": "七绝", "body": "骄龙一跃挽狂澜，\n俯首神游后变前。\n涌起银涛连碧浪，\n打翻四秩霸王冠。 ​​​", "date": "2024.08.08", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5065036928913702 - 七绝    赞潘展乐/01.jpg"]}, {"id": "5065506568539767", "title": "七绝·夏日吟", "genre": "七绝", "body": "举世遥听龙啸音，\n银屏奥运胜亲临。\n神州圆梦千般事，\n夺冠之骄多子衿。 ​​​", "date": "2024.08.09", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5065506568539767 - ​七绝       夏日吟/01.jpg"]}, {"id": "5066240754455154", "title": "七绝·夏日吟望", "genre": "七绝", "body": "昨宵网上咏七夕，\n梦醒巴黎又第一。\n华夏健儿神与气，\n风头正劲卷东西。 ​​​", "date": "2024.08.11", "themes": ["四时风光与节气流转", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5066240754455154 - 七绝   夏日吟望/01.jpg"]}, {"id": "5066521437016367", "title": "太常引·赞奥运健儿", "genre": "太常引", "body": "金牌榜上竞豪雄。\n华夏宇寰名。\n游泳世间惊。\n网球女、挥拍爆红。\n无忧跳水，\n乒乓如愿，\n举重立新功。\n掉杠意难平。\n四年后，冲高跃层。 ​​​", "date": "2024.08.12", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5066521437016367 - 太常引 赞奥运健儿/01.jpg"]}, {"id": "5067921107978795", "title": "蝶恋花·消夏闲吟", "genre": "蝶恋花", "body": "水磨沟中消暑气。\n牵手娇孙，\n观赏鱼鸭戏。\n争闹觅食情有趣，\n岸边投喂合心意。\n树下欣闻歌舞艺。\n鸟雀同欢，\n老少无忧虑。\n最爱边城逢夏季，\n总能寻到清凉地。 ​​​", "date": "2024.08.16", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5067921107978795 - ​蝶恋花  消夏闲吟/01.jpg", "冰雪诗词_全部图片/5067921107978795 - ​蝶恋花  消夏闲吟/02.jpg", "冰雪诗词_全部图片/5067921107978795 - ​蝶恋花  消夏闲吟/03.jpg", "冰雪诗词_全部图片/5067921107978795 - ​蝶恋花  消夏闲吟/04.jpg", "冰雪诗词_全部图片/5067921107978795 - ​蝶恋花  消夏闲吟/05.jpg", "冰雪诗词_全部图片/5067921107978795 - ​蝶恋花  消夏闲吟/06.jpg"]}, {"id": "5069006292125157", "title": "七绝·边城闲吟", "genre": "七绝", "body": "迪化初秋夜雨寒，\n风吹梧叶断声蝉。\n可怜一夏吱吱叫，\n不道黄花雪染天。 ​​​", "date": "2024.08.19", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5069006292125157 - 七绝    边城闲吟/01.jpg"]}, {"id": "5069751871078471", "title": "五律·童如愿", "genre": "五律", "body": "娇孙大板台，\n落座眼光开。\n张口心中问，\n抬头图上猜。\n京新家两处，\n手指几徘徊。\n母解孩儿惑，\n舒眉释闷怀。 ​​​", "date": "2024.08.21", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5069751871078471 - 五律 童如愿/01.jpg"]}, {"id": "5070950760454532", "title": "蝶恋花·娇孙学艺", "genre": "蝶恋花", "body": "偶见轮滑心里痒。\n缠闹家人，\n只道千般想。\n三岁娇娃终入场，\n行头全套新模样。\n撞撞跌跌身踉跄。\n摔倒无哭，\n爬起驱前上。\n梦里喃喃还不忘，\n三天独自悠闲逛。 ​​​", "date": "2024.08.24", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5070950760454532 - 蝶恋花 娇孙学艺/01.jpg", "冰雪诗词_全部图片/5070950760454532 - 蝶恋花 娇孙学艺/02.jpg", "冰雪诗词_全部图片/5070950760454532 - 蝶恋花 娇孙学艺/03.jpg", "冰雪诗词_全部图片/5070950760454532 - 蝶恋花 娇孙学艺/04.jpg", "冰雪诗词_全部图片/5070950760454532 - 蝶恋花 娇孙学艺/05.jpg", "冰雪诗词_全部图片/5070950760454532 - 蝶恋花 娇孙学艺/06.jpg"]}, {"id": "5071202945075186", "title": "渔家傲·疆城晚照", "genre": "渔家傲", "body": "日暮南湖歌舞劲，\n飞霞飘影人心奋。\n倦鸟归来神又振，\n添美韵。\n点头摇翅频相问。\n老少舒怀消晚闷，\n呼星唤月风拂鬓。\n域外谣言诚可恨，\n人神愤。\n欣闻此刻谁还信。 ​​​", "date": "2024.08.25", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5071202945075186 - 渔家傲 疆城晚照/01.jpg", "冰雪诗词_全部图片/5071202945075186 - 渔家傲 疆城晚照/02.jpg", "冰雪诗词_全部图片/5071202945075186 - 渔家傲 疆城晚照/03.jpg", "冰雪诗词_全部图片/5071202945075186 - 渔家傲 疆城晚照/04.jpg", "冰雪诗词_全部图片/5071202945075186 - 渔家傲 疆城晚照/05.jpg", "冰雪诗词_全部图片/5071202945075186 - 渔家傲 疆城晚照/06.jpg"]}, {"id": "5071956216645403", "title": "七绝·出游阿勒泰", "genre": "七绝", "body": "驱车向北少人烟，\n千里黄沙映远天。\n窗外起伏风卷浪，\n到得福海草花妍。 ​​​", "date": "2024.08.27", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5071956216645403 - 七绝 出游阿勒泰/01.jpg", "冰雪诗词_全部图片/5071956216645403 - 七绝 出游阿勒泰/02.jpg", "冰雪诗词_全部图片/5071956216645403 - 七绝 出游阿勒泰/03.jpg", "冰雪诗词_全部图片/5071956216645403 - 七绝 出游阿勒泰/04.jpg", "冰雪诗词_全部图片/5071956216645403 - 七绝 出游阿勒泰/05.jpg", "冰雪诗词_全部图片/5071956216645403 - 七绝 出游阿勒泰/06.jpg"]}, {"id": "5072332978389679", "title": "踏莎行·游乌伦古湖", "genre": "踏莎行", "body": "沙漠明珠，\n人间福海。\n女娲遗玉多姿彩。\n无边碧水漾波澜，\n渔舟快艇皆为爱。\n魔鬼城惊，\n野狼形骇。\n雅丹地貌心澎湃。\n八方远客叹神奇，\n争相点赞情于外。 ​​​", "date": "2024.08.28", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5072332978389679 - 踏莎行 游乌伦古湖/01.jpg", "冰雪诗词_全部图片/5072332978389679 - 踏莎行 游乌伦古湖/02.jpg", "冰雪诗词_全部图片/5072332978389679 - 踏莎行 游乌伦古湖/03.jpg", "冰雪诗词_全部图片/5072332978389679 - 踏莎行 游乌伦古湖/04.jpg", "冰雪诗词_全部图片/5072332978389679 - 踏莎行 游乌伦古湖/05.jpg", "冰雪诗词_全部图片/5072332978389679 - 踏莎行 游乌伦古湖/06.jpg"]}, {"id": "5072710166382564", "title": "采桑子·游宿布尔津", "genre": "采桑子", "body": "中苏交往风情在。\n集市留痕，\n桥路留痕。\n河水滔滔唤故人。\n星辉夜色灯光璨。\n烟火迎君，\n花月迎君。\n远道而来似旧亲。 ​​​", "date": "2024.08.29", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5072710166382564 - 采桑子 游宿布尔津/01.jpg", "冰雪诗词_全部图片/5072710166382564 - 采桑子 游宿布尔津/02.jpg", "冰雪诗词_全部图片/5072710166382564 - 采桑子 游宿布尔津/03.jpg", "冰雪诗词_全部图片/5072710166382564 - 采桑子 游宿布尔津/04.jpg", "冰雪诗词_全部图片/5072710166382564 - 采桑子 游宿布尔津/05.jpg", "冰雪诗词_全部图片/5072710166382564 - 采桑子 游宿布尔津/06.jpg", "冰雪诗词_全部图片/5072710166382564 - 采桑子 游宿布尔津/07.jpg", "冰雪诗词_全部图片/5072710166382564 - 采桑子 游宿布尔津/08.jpg", "冰雪诗词_全部图片/5072710166382564 - 采桑子 游宿布尔津/09.jpg"]}, {"id": "5074097934173792", "title": "踏莎行·游宿禾木", "genre": "踏莎行", "body": "四处环山，\n一河流水。\n木屋成片云空缀。\n夏秋风色鸟舒怀，\n冬春雪景人陶醉。\n篝火欢歌，\n繁星笑对。\n清风明月来相会。\n远飘美味悦姮娥，\n吴刚神荡宵难寐。 ​​​", "date": "2024.09.02", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5074097934173792 - 踏莎行 游宿禾木/01.jpg", "冰雪诗词_全部图片/5074097934173792 - 踏莎行 游宿禾木/02.jpg", "冰雪诗词_全部图片/5074097934173792 - 踏莎行 游宿禾木/03.jpg", "冰雪诗词_全部图片/5074097934173792 - 踏莎行 游宿禾木/04.jpg", "冰雪诗词_全部图片/5074097934173792 - 踏莎行 游宿禾木/05.jpg", "冰雪诗词_全部图片/5074097934173792 - 踏莎行 游宿禾木/06.jpg"]}, {"id": "5074464189189980", "title": "七律·游宿喀纳斯", "genre": "七律", "body": "遥闻水怪客前来，\n日暮廉纤雨撞怀。\n犹到湖边争远眺，\n奈何雾里乱疑猜。\n木屋深夜人无寐，\n山顶清晨眼尽开。\n只见白云闲起落，\n难寻涛浪怪徘徊。\n清平乐    喀纳斯\n观鱼台上，\n远客争相望。\n湖怪无形山水旷，\n伫立心怡神畅。\n飞云峰岭悠闲，\n俯身极目三湾。\n白浪欢歌而下，\n青天碧水遥连。\n注：湖下游为河，\n有卧龙湾、月亮\n湾、神仙湾。", "date": "2024.09.03", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5074464189189980 - 七律 游宿喀纳斯/01.jpg", "冰雪诗词_全部图片/5074464189189980 - 七律 游宿喀纳斯/02.jpg", "冰雪诗词_全部图片/5074464189189980 - 七律 游宿喀纳斯/03.jpg", "冰雪诗词_全部图片/5074464189189980 - 七律 游宿喀纳斯/04.jpg", "冰雪诗词_全部图片/5074464189189980 - 七律 游宿喀纳斯/05.jpg", "冰雪诗词_全部图片/5074464189189980 - 七律 游宿喀纳斯/06.jpg"]}, {"id": "5074830997062399", "title": "七绝·过路游", "genre": "七绝", "body": "疆域闻名五彩滩，\n胡杨碧水映长天。\n雅丹朝暮非同色，\n玉落凡尘亿万年。 ​​​", "date": "2024.09.04", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5074830997062399 - ​七绝       过路游/01.jpg", "冰雪诗词_全部图片/5074830997062399 - ​七绝       过路游/02.jpg", "冰雪诗词_全部图片/5074830997062399 - ​七绝       过路游/03.jpg", "冰雪诗词_全部图片/5074830997062399 - ​七绝       过路游/04.jpg", "冰雪诗词_全部图片/5074830997062399 - ​七绝       过路游/05.jpg", "冰雪诗词_全部图片/5074830997062399 - ​七绝       过路游/06.jpg"]}, {"id": "5075183366833977", "title": "鹧鸪天·过乌尔禾", "genre": "鹧鸪天", "body": "超大雅丹魔鬼城，\n驱车游逛自心惊。\n楼亭百丈凌空立，\n剑客千年跨马行。\n凭想象、画图生。\n狂奔狮虎卧神龙。\n置身此处由衷叹，\n俗子休贪天地功。\n​\n​注：多部影视剧\n​拍摄地。 ​​​", "date": "2024.09.05", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5075183366833977 - ​鹧鸪天 过乌尔禾/01.jpg", "冰雪诗词_全部图片/5075183366833977 - ​鹧鸪天 过乌尔禾/02.jpg", "冰雪诗词_全部图片/5075183366833977 - ​鹧鸪天 过乌尔禾/03.jpg", "冰雪诗词_全部图片/5075183366833977 - ​鹧鸪天 过乌尔禾/04.jpg", "冰雪诗词_全部图片/5075183366833977 - ​鹧鸪天 过乌尔禾/05.jpg", "冰雪诗词_全部图片/5075183366833977 - ​鹧鸪天 过乌尔禾/06.jpg"]}, {"id": "5075549662479452", "title": "渔家傲·游宿克拉玛依", "genre": "渔家傲", "body": "近望楼前一号井，\n凭生城市人烟盛。\n闻道芳郊奇异景，\n游客竞。\n黑油山上油花蹦。\n昔日青年留倩影，\n忠心赤胆人称颂。\n戈壁滩涂钻探洞，\n终得胜。\n绿洲葱郁边陲映。 ​​​", "date": "2024.09.06", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5075549662479452 - 渔家傲 游宿克拉玛依/01.jpg", "冰雪诗词_全部图片/5075549662479452 - 渔家傲 游宿克拉玛依/02.jpg", "冰雪诗词_全部图片/5075549662479452 - 渔家
