傲 游宿克拉玛依/03.jpg", "冰雪诗词_全部图片/5075549662479452 - 渔家傲 游宿克拉玛依/04.jpg", "冰雪诗词_全部图片/5075549662479452 - 渔家傲 游宿克拉玛依/05.jpg", "冰雪诗词_全部图片/5075549662479452 - 渔家傲 游宿克拉玛依/06.jpg"]}, {"id": "5075897906629518", "title": "太常引·过石河子", "genre": "太常引", "body": "…敬览博物馆\n军人兼作务农工。\n戈壁起春风。\n红绿染云空。\n筑楼处、经年为城。\n种瓜点豆，\n繁荣集市，\n西域日安宁。\n盛世念英雄。\n传后代、千秋太平。\n#带你看展览# ​​​", "date": "2024.09.07", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/5075897906629518 - 太常引   过石河子/01.jpg", "冰雪诗词_全部图片/5075897906629518 - 太常引   过石河子/02.jpg", "冰雪诗词_全部图片/5075897906629518 - 太常引   过石河子/03.jpg", "冰雪诗词_全部图片/5075897906629518 - 太常引   过石河子/04.jpg", "冰雪诗词_全部图片/5075897906629518 - 太常引   过石河子/05.jpg", "冰雪诗词_全部图片/5075897906629518 - 太常引   过石河子/06.jpg"]}, {"id": "5076618434055299", "title": "清平乐·敬缅主席", "genre": "清平乐", "body": "四十八载，\n笑貌深情在。\n温暖黎民无替代，\n千古人间大爱。\n沤心打下根基，\n后生立柱堆石。\n大厦东方高耸，\n五洲举目称奇。\n#历史那些事##人间温暖# ​​​", "date": "2024.09.09", "themes": ["家国情怀与时代歌咏", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5076618434055299 - 清平乐 敬缅主席/01.jpg"]}, {"id": "5076996349232854", "title": "南乡子·赠幼儿教师", "genre": "南乡子", "body": "每日语童真，\n情意丝滑暖稚心。\n群幼不知丁点事，\n陶熏。\n春雨清风分外亲。\n苗木与时新，\n仰仗园丁灌溉勤。\n喜见映天松柏树，\n情深。\n翠叶高枝笑望君。\n#常感师恩# ​​​", "date": "2024.09.10", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5076996349232854 - 南乡子 赠幼儿教师/01.jpg"]}, {"id": "5077343834476704", "title": "蝶恋花·吟望", "genre": "蝶恋花", "body": "妄想天堂偏入狱。\n何似息神，\n闭目由他去。\n一觉醒来常谓己，\n欺人亏理平生忌。\n世路宽平天盖地。\n行走凝眸，\n远躲南墙壁。\n霜降风吹何所惧，\n赤身光脚迎狂雨。 ​​​", "date": "2024.09.11", "themes": ["四时风光与节气流转", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5077343834476704 - 蝶恋花       吟望/01.jpg"]}, {"id": "5077710847609545", "title": "蝶恋花·游宿吐鲁番", "genre": "蝶恋花", "body": "……观叹坝儿井\n竖井间隔十几米，\n深浅随坡，\n底下连通壁。\n雪水天山来漫地，\n暗渠遍布堪奇迹。\n敬佩先人勤努力，\n聪慧躬行，\n驱害得天利。\n改善民生名被记，\n千年不朽功于世。#游记##国内旅游# ​​​", "date": "2024.09.12", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5077710847609545 - 蝶恋花 游宿吐鲁番/01.jpg", "冰雪诗词_全部图片/5077710847609545 - 蝶恋花 游宿吐鲁番/02.jpg", "冰雪诗词_全部图片/5077710847609545 - 蝶恋花 游宿吐鲁番/03.jpg", "冰雪诗词_全部图片/5077710847609545 - 蝶恋花 游宿吐鲁番/04.jpg", "冰雪诗词_全部图片/5077710847609545 - 蝶恋花 游宿吐鲁番/05.jpg", "冰雪诗词_全部图片/5077710847609545 - 蝶恋花 游宿吐鲁番/06.jpg"]}, {"id": "5078085253465899", "title": "鹧鸪天·游宿吐鲁番", "genre": "鹧鸪天", "body": "……悦览葡萄沟\n火焰山旁碧水流，\n葡萄遍地色盈沟。\n无核白玉迎人笑，\n含籽红珠隐客愁。\n篇章美，语文牛。\n少年学子背从头。\n今番亲历书中事，\n犹似春宵梦里游。#绿水青山就是金山银山##国内旅游# ​​​", "date": "2024.09.13", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5078085253465899 - 鹧鸪天 游宿吐鲁番/01.jpg", "冰雪诗词_全部图片/5078085253465899 - 鹧鸪天 游宿吐鲁番/02.jpg", "冰雪诗词_全部图片/5078085253465899 - 鹧鸪天 游宿吐鲁番/03.jpg", "冰雪诗词_全部图片/5078085253465899 - 鹧鸪天 游宿吐鲁番/04.jpg", "冰雪诗词_全部图片/5078085253465899 - 鹧鸪天 游宿吐鲁番/05.jpg", "冰雪诗词_全部图片/5078085253465899 - 鹧鸪天 游宿吐鲁番/06.jpg", "冰雪诗词_全部图片/5078085253465899 - 鹧鸪天 游宿吐鲁番/07.jpg", "冰雪诗词_全部图片/5078085253465899 - 鹧鸪天 游宿吐鲁番/08.jpg", "冰雪诗词_全部图片/5078085253465899 - 鹧鸪天 游宿吐鲁番/09.jpg"]}, {"id": "5078448142029513", "title": "鹧鸪天·游宿吐鲁番", "genre": "鹧鸪天", "body": "……近观火焰山\n少小即闻火焰山，\n老来有幸站跟前。\n西游记里僧途事，\n尘世餐中作笑谈。\n芭蕉扇，力无边。\n把之灭火蔽云天。\n今朝旁立留身影，\n祈盼凭她避祸端。#旅行日记# ​​​", "date": "2024.09.14", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5078448142029513 - 鹧鸪天 游宿吐鲁番/01.jpg", "冰雪诗词_全部图片/5078448142029513 - 鹧鸪天 游宿吐鲁番/02.jpg", "冰雪诗词_全部图片/5078448142029513 - 鹧鸪天 游宿吐鲁番/03.jpg"]}, {"id": "5078805414941229", "title": "踏莎行·文欢歌宴", "genre": "踏莎行", "body": "时欲中秋，\n天将满月。\n梧桐枝杪飘黄叶。\n幼儿园里舞还歌，\n笑颜师长情真切。\n台上国风，\n树稍莺鹊。\n溢香家宴楼前列。\n珍馐美馔色盈眸，\n朵颐老少心怀惬。#幼儿园##汉服[超话]# ​​​", "date": "2024.09.15", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/5078805414941229 - 踏莎行 文欢歌宴/01.jpg", "冰雪诗词_全部图片/5078805414941229 - 踏莎行 文欢歌宴/02.jpg", "冰雪诗词_全部图片/5078805414941229 - 踏莎行 文欢歌宴/03.jpg", "冰雪诗词_全部图片/5078805414941229 - 踏莎行 文欢歌宴/04.jpg", "冰雪诗词_全部图片/5078805414941229 - 踏莎行 文欢歌宴/05.jpg", "冰雪诗词_全部图片/5078805414941229 - 踏莎行 文欢歌宴/06.jpg"]}, {"id": "5079357201318211", "title": "踏莎行·吟望", "genre": "踏莎行", "body": "明日中秋，\n今宵西域。\n乡关遥望八千里。\n爹娘幸甚妹相亲，\n为儿愧对难由己。\n晚辈争前，\n老夫助力。\n边城数月陪孙聚。\n待得十月转回家，\n椿萱庭院身心寄。#﻿记录生活##晚安心语# ​​​", "date": "2024.09.16", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5079357201318211 - 踏莎行       吟望/01.jpg"]}, {"id": "5079557493494424", "title": "踏莎行·中秋抒怀", "genre": "踏莎行", "body": "白鹭一行，\n清风两盏。\n月儿今夜将圆满。\n阖家企盼共抬头，\n奈何独子须行远。\n中午欢谈，\n黄昏别散。\n京新两地深宵看。\n银辉皓月耀长空，\n婵娟颙望同心愿。#中秋快乐##﻿记录生活##晚安心语# ​​​", "date": "2024.09.17", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/5079557493494424 - 踏莎行 中秋抒怀/01.jpg"]}, {"id": "5079939567586694", "title": "七律·铭耻备战", "genre": "七律", "body": "当年倭寇兽行狂，\n华夏山河遭祸殃。\n十四春秋齐抗战，\n万千儿女赴国殇。\n英雄气概弥寰宇，\n悲壮情怀感上苍。\n今日东瀛妖又舞，\n愤呼大圣换刀枪。#十四年情怀##抗战十四年# ​​​", "date": "2024.09.18", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5079939567586694 - ​七律    铭耻备战/01.jpg"]}, {"id": "5080659066358840", "title": "五绝·秋夜寄友", "genre": "五绝", "body": "冀新同望月，\n兄弟共相思。\n待到还乡日，\n交杯话此时。\n#记录美好生活##中秋快乐# ​​​", "date": "2024.09.20", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5080659066358840 - 五绝 秋夜寄友/01.jpg"]}, {"id": "5081018973294344", "title": "采桑子·秋日吟", "genre": "采桑子", "body": "援疆母女期将到。\n近日回京，\n爷奶随行。\n往复三年别有情。\n边城迪化蒸蒸上。\n街院繁荣，\n歌舞欢声。\n鹰雁争翔啭碧空。#采桑子##边城# ​​​", "date": "2024.09.21", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5081018973294344 - ​采桑子    秋日吟/01.jpg"]}, {"id": "5081330239671417", "title": "七绝·时令吟", "genre": "七绝", "body": "秋来昼夜暂均分，\n此后阳衰渐感阴。\n尘世风云凭日月，\n江湖善恶透人心。#昼夜均分,快乐共享# ​​​", "date": "2024.09.22", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5081330239671417 - 七绝       时令吟/01.jpg", "冰雪诗词_全部图片/5081330239671417 - 七绝       时令吟/02.jpg", "冰雪诗词_全部图片/5081330239671417 - 七绝       时令吟/03.jpg"]}, {"id": "5082052296442713", "title": "七绝·吟趣", "genre": "七绝", "body": "远看老生俯首读，\n专心注目手轻扶。\n近前不道人何处，\n只见青石哪有书。#七绝# ​​​", "date": "2024.09.24", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5082052296442713 - 七绝           吟趣/01.jpg"]}, {"id": "5083162064196129", "title": "七绝·归来吟", "genre": "七绝", "body": "别时西域叶飘黄，\n早晚出门着厚裳。\n来至京城枝杪翠，\n行人短袖不觉凉。#生活手记##日常[超话]# ​​​", "date": "2024.09.27", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5083162064196129 - ​七绝       归来吟/01.jpg"]}, {"id": "5084606372252958", "title": "虞美人·十一颂", "genre": "虞美人", "body": "七十五载江山丽，\n华夏新天地。\n九州百姓暖心怀，\n国庆金秋歌舞靓亭台。\n晴空万里辉芒映，\n草木今朝盛。\n岭川妍秀染云空，\n鸟语花香尘世漫清风。#记录美好生活# ​​​", "date": "2024.10.01", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5084606372252958 - 虞美人           十一颂/01.jpg", "冰雪诗词_全部图片/5084606372252958 - 虞美人           十一颂/02.jpg", "冰雪诗词_全部图片/5084606372252958 - 虞美人           十一颂/03.jpg", "冰雪诗词_全部图片/5084606372252958 - 虞美人           十一颂/04.jpg", "冰雪诗词_全部图片/5084606372252958 - 虞美人           十一颂/05.jpg", "冰雪诗词_全部图片/5084606372252958 - 虞美人           十一颂/06.jpg", "冰雪诗词_全部图片/5084606372252958 - 虞美人           十一颂/07.jpg", "冰雪诗词_全部图片/5084606372252958 - 虞美人           十一颂/08.jpg", "冰雪诗词_全部图片/5084606372252958 - 虞美人           十一颂/09.jpg"]}, {"id": "5086770140022825", "title": "七律·吟长假", "genre": "七律", "body": "金风送爽喜间愁，\n众欲出行挤破头。\n路上人车云下卧，\n景区花草梦中游。\n山门虽近忧停步，\n湖岸徒长苦觅舟。\n身困天峰争宿厕，\n腰包涨鼓水难求。 ​​​", "date": "2024.10.07", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5086770140022825 - 七律       吟长假/01.jpg", "冰雪诗词_全部图片/5086770140022825 - 七律       吟长假/02.jpg", "冰雪诗词_全部图片/5086770140022825 - 七律       吟长假/03.jpg", "冰雪诗词_全部图片/5086770140022825 - 七律       吟长假/04.jpg", "冰雪诗词_全部图片/5086770140022825 - 七律       吟长假/05.jpg", "冰雪诗词_全部图片/5086770140022825 - 七律       吟长假/06.jpg"]}, {"id": "5087127366275273", "title": "七律·节后晓吟", "genre": "七律", "body": "寒露今朝日色扬，\n匆忙童子上学堂。\n临街店铺勤迎客，\n赶路职员着靓妆。\n十月金秋盈喜气，\n万家红火娶新娘。\n神州南北欢天地，\n山海东西硕果香。#二十四节气# ​​​", "date": "2024.10.08", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5087127366275273 - 七律    节后晓吟/01.jpg"]}, {"id": "5087486281779960", "title": "蝶恋花·老父亲", "genre": "蝶恋花", "body": "霜鬓居家闲不住。\n种菜浇花，\n庭院枝藤舞。\n手巧人勤无惧苦，\n清香日月盈门户。\n喜获冬瓜一米五。\n欲与肩高，\n尽可蒸烧煮。\n入味丝滑频下肚，\n洗肠瘦体天然补。#我家院子里的风景##生活诗意##乡味##蝶恋花##家的味道# ​​​", "date": "2024.10.09", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5087486281779960 - 蝶恋花    老父亲/01.jpg"]}, {"id": "5087884921014809", "title": "蝶恋花·节前吟寄", "genre": "蝶恋花", "body": "天欲重阳人念旧。\n思绪飞扬，\n举目频搔首。\n往事依稀心左右，\n遂邀故友樽前凑。\n昔日华颜今老叟。\n弯背塌腰，\n笑把杯中酒。\n见面不多情意厚，\n开怀同醉扶墙走。 ​​​", "date": "2024.10.10", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5087884921014809 - 蝶恋花 节前吟寄/01.jpg"]}, {"id": "5088228762452982", "title": "五律·重阳寄怀", "genre": "五律", "body": "九九登高日，\n银空万仞晴。\n云游归故里，\n神绪荡苍穹。\n人道俦朋逝，\n予心悲痛浓。\n茱萸无觅处，\n思念几时穷。 ​​​", "date": "2024.10.11", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5088228762452982 - 五律 重阳寄怀/01.jpg"]}, {"id": "5088944469838386", "title": "五律·秋夜小聚", "genre": "五律", "body": "经久未曾逢，\n樽前意趣浓。\n欢谈同辈事，\n笑语子孙情。\n涮肉穿肠过，\n香醪落口中。\n不觉时已晚，\n半月映长空。 ​​​", "date": "2024.10.13", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5088944469838386 - 五律 秋夜小聚/01.jpg"]}, {"id": "5089294454360404", "title": "五律·友相聚", "genre": "五律", "body": "秋叶任风摇，\n清蟾隐夜霄。\n故朋灯下聚，\n新客觯前聊。\n香酒十人醉，\n欢言举案飘。\n曾经同苦难，\n退后各逍遥。#五律# ​​​", "date": "2024.10.14", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5089294454360404 - 五律 友相聚/01.jpg"]}, {"id": "5090389410972546", "title": "五律·同窗聚", "genre": "五律", "body": "石门秋正浓，\n黄叶弄寒声。\n兴起安家聚，\n悦谈兄弟情。\n香醪争入口，\n罩饼暖心宫。\n往日今朝事，\n飞霜染鬓丛。#尽兴生活每一天# ​​​", "date": "2024.10.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5090389410972546 - 五律 同窗聚/01.jpg"]}, {"id": "5091105339348168", "title": "五律·秋思", "genre": "五律", "body": "长夜廉纤雨，\n暮秋心底寒。\n孤灯难入睡，\n百念绕床前。\n五口京津冀，\n四方星月天。\n晓阶黄叶覆，\n思绪更缠绵。#手机随手拍##五律##生活诗意##乡味# ​​​", "date": "2024.10.19", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5091105339348168 - 五律    秋思/01.jpg"]}, {"id": "5094737579606906", "title": "七绝·街景", "genre": "七绝", "body": "草木叶黄秋已深，\n栖鸦飞燕冷心魂。\n闲余老者阶前聚，\n畅浴阳光话古今。 ​​​", "date": "2024.10.29", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5094737579606906 - 七绝           街景/01.jpg"]}, {"id": "5095118032601636", "title": "清平乐·闻讯抒怀", "genre": "清平乐", "body": "神舟十九，\n秋日晨昂首。\n喜见三人挥巨手，\n飞向天宫会友。\n半年守望苍穹，\n巡回俯瞰山溟。\n逐日携星揽月，\n为得寰宇安宁。 ​​​", "date": "2024.10.30", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5095118032601636 - 清平乐 闻讯抒怀/01.jpg", "冰雪诗词_全部图片/5095118032601636 - 清平乐 闻讯抒怀/02.jpg", "冰雪诗词_全部图片/5095118032601636 - 清平乐 闻讯抒怀/03.jpg"]}, {"id": "5095463726350938", "title": "朝中措·吟望怀", "genre": "朝中措", "body": "太空舱内喜相逢，\n携手舞天宫。\n华夏英雄儿女，\n穿梭日月云星。\n神舟利剑，\n从无到有，\n自主奇功。\n举世今朝仰望，\n交织羡忌杂情。 ​​​", "date": "2024.10.31", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5095463726350938 - 朝中措    吟望怀/01.jpg"]}, {"id": "5095836037417420", "title": "采桑子·老来乐", "genre": "采桑子", "body": "小轮转动躯前展。\n腰臂拉伸，\n上下抻筋。\n鼻脸无忧与地亲。\n半年渐进终成就。\n不负余心，\n炼罢舒身。\n腹背凹凸欲作真。\n#健身[超话]##健身打卡##好身材每日健身打卡计划# ​​​", "date": "2024.11.01", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5095836037417420 - 采桑子    老来乐/01.jpg", "冰雪诗词_全部图片/5095836037417420 - 采桑子    老来乐/02.jpg", "冰雪诗词_全部图片/5095836037417420 - 采桑子    老来乐/03.jpg"]}, {"id": "5096190510630694", "title": "朝中措·唐山宴", "genre": "朝中措", "body": "小山世界往昔情，\n旧物忆峥嵘。\n店铺当街叫卖，\n匾牌旗帜飞红。\n境迁时过，\n仿修原貌，\n韵味犹浓。\n招引京邻远客，\n品游美乐食空。\n#吃喝玩乐##美食探店##生活诗意# ​​​", "date": "2024.11.02", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5096190510630694 - 朝中措    唐山宴/01.jpg", "冰雪诗词_全部图片/5096190510630694 - 朝中措    唐山宴/02.jpg", "冰雪诗词_全部图片/5096190510630694 - 朝中措    唐山宴/03.jpg", "冰雪诗词_全部图片/5096190510630694 - 朝中措    唐山宴/04.jpg", "冰雪诗词_全部图片/5096190510630694 - 朝中措    唐山宴/05.jpg", "冰雪诗词_全部图片/5096190510630694 - 朝中措    唐山宴/06.jpg", "冰雪诗词_全部图片/5096190510630694 - 朝中措    唐山宴/07.jpg", "冰雪诗词_全部图片/5096190510630694 - 朝中措    唐山宴/08.jpg", "冰雪诗词_全部图片/5096190510630694 - 朝中措    唐山宴/09.jpg"]}, {"id": "5096905422673003", "title": "七律·岳母周年祭", "genre": "七律", "body": "车灯穿雾向陵园，\n逝者仙归整一年。\n平日家人常忆事，\n今朝亲友伫坟前。\n陡河水气萦碑墓，\n秋叶寒声痛胆肝。\n贡品丰盈悲更甚，\n后生思念寄青烟。 ​​​", "date": "2024.11.04", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5096905422673003 - 七律 岳母周年祭/01.jpg"]}, {"id": "5097271516988569", "title": "七律·闻西马有寄", "genre": "七律", "body": "跨步长安别样天，\n时空穿越两千年。\n永宁门处人昂首，\n长庆宫前鸟悦颜。\n大雁塔头铃忆事，\n华清池畔水传言。\n古今多少风流过，\n血染都城脚下砖。\n注：西安马拉松\n起点永宁门。 ​​​", "date": "2024.11.05", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5097271516988569 - 七律 闻西马有寄/01.jpg"]}, {"id": "5101287400279183", "title": "破阵子·吟望寄怀", "genre": "破阵子", "body": "珠海航空展演，\n今非昔日神州。\n撩眼无人新武器，\n不断惊闻喜上头。\n开怀情自流。\n最是邻朋远客，\n徘徊询问详由。\n触目彩虹凝白帝，\n难禁心欢舞亮眸。\n携来雪耻仇。\n注：彩虹无人机\n白帝空天战机\n#武器装备# ​​​", "date": "2024.11.16", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5101287400279183 - 破阵子 吟望寄怀/01.jpg", "冰雪诗词_全部图片/5101287400279183 - 破阵子 吟望寄怀/02.jpg", "冰雪诗词_全部图片/5101287400279183 - 破阵子 吟望寄怀/03.jpg"]}, {"id": "5101655659906452", "title": "七绝·冬日闲吟", "genre": "七绝", "body": "尘世相逢人不易，\n寻常交往且珍惜。\n心诚念少天长久，\n遇事无争情自怡。 ​​​", "date": "2024.11.17", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5101655659906452 - ​七绝    冬日闲吟/01.jpg"]}, {"id": "5102375922040908", "title": "七律·故友小聚", "genre": "七律", "body": "多年未见喜相逢，\n窗外风寒情意浓。\n酒满金樽香入口，\n锅频涮肉味萦空。\n朋俦高语交心腹，\n妻子欢言热眼瞳。\n午后冬阳斜照暖，\n微醺霜鬓踏归程。#记录美好生活# ​​​", "date": "2024.11.19", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5102375922040908 - 七律    故友小聚/01.jpg"]}, {"id": "5103079541703289", "title": "七绝·初冬吟望", "genre": "七绝", "body": "朝霞东起月沉西，\n日夜轮回诚可期。\n莫谓长阴晴色少，\n苍天公道古来知。 ​​​", "date": "2024.11.21", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5103079541703289 - 七绝    初冬吟望/01.jpg"]}, {"id": "5103792852830120", "title": "七绝·冬日晨吟", "genre": "七绝", "body": "小雪时来晓色寒，\n出门戴月展双拳。\n微风拂面周身热，\n鸦雀噪枝人向前。#身边的风景# ​​​", "date": "2024.11.23", "themes": ["四时风光与节气流转"], "images": ["冰雪诗词_全部图片/5103792852830120 - 七绝    冬日晨吟/01.jpg"]}, {"id": "5105297423600028", "title": "鹧鸪天·冬日吟望", "genre": "鹧鸪天", "body": "风卷尘飞叶满天，\n枝鸦瑟瑟草花寒。\n交加雨雪冰初就，\n次第晨昏人不安。\n温骤降，苦缠绵。\n出行无奈冷心田。\n可怜老少居家处，\n期待阳升日色妍。 ​​​", "date": "2024.11.27", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5105297423600028 - 鹧鸪天 冬日吟望/01.jpg"]}, {"id": "5106715974436346", "title": "五律·冬日闲吟", "genre": "五律", "body": "无风寒意减，\n晨炼汗加身。\n几日出门怕，\n今朝爽入心。\n苍天威力重，\n大地热情深。\n便是冰叠雪，\n终归万里春。\n#随手拍美景##身边的风景##生活诗意# ​​​", "date": "2024.12.01", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5106715974436346 - 五律 冬日闲吟/01.jpg"]}, {"id": "5107415168844083", "title": "七绝·闻事感怀", "genre": "七绝", "body": "南北观山景不同，\n众说人影短长声。\n言出异口寻常事，\n认作云泥自有情。 ​​​", "date": "2024.12.03", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5107415168844083 - 七绝    闻事感怀/01.jpg"]}, {"id": "5107792636282819", "title": "七律·冬日闲吟", "genre": "七律", "body": "转眼寒天大雪来，\n一年光景自徘徊。\n春花香漫千山过，\n夏雨风悠万树裁。\n秋日飞霜甘果盛，\n冬时落叶腊梅开。\n阴阳交替无穷尽，\n悲乐轮回撞我怀。#身边的风景# ​​​", "date": "2024.12.04", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5107792636282819 - 七律    冬日闲吟/01.jpg"]}, {"id": "5108150990537920", "title": "踏莎行·大势所趋", "genre": "踏莎行", "body": "……吟陆生访台\n华夏东南，\n中国台北。\n出言响亮蝇营碎。\n一声激起浪滔天，\n谋独小丑云空坠。\n面目狰狞，\n心神交瘁。\n呲牙舞爪情徒费。\n挡车螳臂若烟尘，\n飞轮滚滚归龙队。\n#时政# ​​​", "date": "2024.12.05", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5108150990537920 - 踏莎行 大势所趋/01.jpg", "冰雪诗词_全部图片/5108150990537920 - 踏莎行 大势所趋/02.jpg"]}, {"id": "5108516196976830", "title": "七绝·时令吟", "genre": "七绝", "body": "大雪时来又近春，\n两寒过后物华新。\n忍得短暂冰霜苦，\n翠紫芳红迎抱君。\n#二十四节气# ​​​", "date": "2024.12.06", "themes": ["四时风光与节气流转", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5108516196976830 - 七绝       时令吟/01.jpg"]}, {"id": "5109599814027829", "title": "七绝·冬晓吟望", "genre": "七绝", "body": "风云漫卷中东乱，\n虎豹争食草木哀。\n百姓安居华夏暖，\n当空晴日待春来。\n#随手拍天气##记录生活每一天# ​​​", "date": "2024.12.09", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5109599814027829 - 七绝   冬晓吟望/01.jpg"]}, {"id": "5113959797491088", "title": "七律·冬至", "genre": "七律", "body": "晓月当空趋向西，\n北风枯叶劲摇枝。\n老夫早起人稀少，\n宿狗突惊吠叫急。\n宁静街头声乍破，\n高低杠上跃翁姿。\n周身渐暖心怀阔，\n数九从今日日期。\n#今日冬至##二十四节气# ​​​", "date": "2024.12.21", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5113959797491088 - 七律           冬至/01.jpg"]}, {"id": "5114301754901755", "title": "七律·孙女生日", "genre": "七律", "body": "冬至煊煊整四周，\n家亲宠爱更何求。\n爹娘短暂千般趣，\n爷奶无穷万事由。\n四季一心情灌注，\n三餐多味饭稀稠。\n身高已在同龄上，\n体智乘风崭露头。\n#养娃日记# ​​​", "date": "2024.12.22", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "怀古咏史与读文有感", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/5114301754901755 - 七律    孙女生日/01.jpg"]}, {"id": "5115754563240050", "title": "踏莎行·缅怀主席", "genre": "踏莎行", "body": "圣诞东方，\n福临华夏。\n移山填海开新画。\n贫穷百姓喜翻身，\n挥拳砸碎南天霸。\n射弹飞星，\n营渠造坝。\n三分世界赢天下。\n呕心国是筑根基，\n得来今日凌云厦。\n#历史[超话]##中华文化学习笔记# ​​​", "date": "2024.12.26", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5115754563240050 - 踏莎行 缅怀主席/01.jpg"]}, {"id": "5116140784717411", "title": "七绝·吟望", "genre": "七绝", "body": "伟人诞日艳阳天，\n华夏双飞秀技颜。\n神秘空中南北客，\n举头仰望赤心甜。 ​​​", "date": "2024.12.27", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5116140784717411 - 七绝          吟望/01.jpg", "冰雪诗词_全部图片/5116140784717411 - 七绝          吟望/02.jpg", "冰雪诗词_全部图片/5116140784717411 - 七绝          吟望/03.jpg"]}, {"id": "5117326750648848", "title": "七绝·故友三家聚", "genre": "七绝", "body": "京邑东西各自忙，\n难得抽空享时光。\n娇孙都已学园去，\n落座潇湘几案香。\n#生活碎片# ​​​", "date": "2024.12.30", "themes": ["亲情友情与人间至爱"], "images": ["冰雪诗词_全部图片/5117326750648848 - 七绝 故友三家聚/01.jpg"]}, {"id": "5117975834661102", "title": "鹤冲天·元旦抒怀", "genre": "鹤冲天", "body": "年初岁暮，九汉争鹰鹭。\n晴日秀芳姿，翩跹舞。\n四海人皆望，惊叫赞声无数。\n欢心催泪目。\n元旦来临，览喜事刷屏幕。\n追星赶月，华夏辉煌今古。\n北斗引鸣镝，神雕翥。\n俯瞰疆川域岭，巡湖海，盯礁渚。\n神州精把护。\n百姓安闲，岂惧豹豺狼虎。 ​​​", "date": "2025.01.01", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/5117975834661102 - ​    鹤冲天        元旦抒怀/01.jpg"]}, {"id": "5118300613248585", "title": "七绝·岭上花", "genre": "七绝", "body": "生在悬崖人不知，\n无声开落应天时。\n经年未染尘间秽，\n笑与清风两念思。 ​​​", "date": "2025.01.02", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5118300613248585 - 七绝       岭上花/01.jpg"]}, {"id": "5118670630555204", "title": "七律·健身寄怀", "genre": "七律", "body": "室外寒风刺骨吹，\n楼中健体暖心扉。\n哑铃弯举匀吸气，\n单杠平伸血脉催。\n器械夹胸双臂胀，\n游池蹬腿老身飞。\n一年四季膺怀悦，\n霜发春秋任手挥。\n#见人不如健身##健身打卡##运动打卡# ​​​", "date": "2025.01.03", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5118670630555204 - 七律    健身寄怀/01.jpg", "冰雪诗词_全部图片/5118670630555204 - 七律    健身寄怀/02.jpg", "冰雪诗词_全部图片/5118670630555204 - 七律    健身寄怀/03.jpg", "冰雪诗词_全部图片/5118670630555204 - 七律    健身寄怀/04.jpg", "冰雪诗词_全部图片/5118670630555204 - 七律    健身寄怀/05.jpg", "冰雪诗词_全部图片/5118670630555204 - 七律    健身寄怀/06.jpg"]}, {"id": "5119412773852304", "title": "七绝·时令吟", "genre": "七绝", "body": "大雪时节雪未飘，\n深冬交往气温高。\n小寒今又晴空丽，\n期待早春花色娇。\n#手机随拍# ​​​", "date": "2025.01.05", "themes": ["四时风光与节气流转"], "images": ["冰雪诗词_全部图片/5119412773852304 - 七绝       时令吟/01.jpg"]}, {"id": "5120104419560916", "title": "七绝·冬日晓吟", "genre": "七绝", "body": "寒星隐隐腊八来，\n晓色朔风迎我怀。\n庭院冷光描树影，\n粥香缕缕溢窗台。 ​​​", "date": "2025.01.07", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/5120104419560916 - ​七绝    冬日晓吟/01.jpg"]}, {"id": "5121923616867842", "title": "玉楼春·吟望寄怀", "genre": "玉楼春", "body": "山火无情人有恨，\n多少公知心里闷。\n昔时眉眼向西歪，\n此刻缩头遭众愤。\n信口雌黄浑不论，\n崇外诬中曾起劲。\n而今世道换新天，\n水荡风流华夏润。 ​​​", "date": "2025.01.12", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5121923616867842 - 玉楼春 吟望寄怀/01.jpg", "冰雪诗词_全部图片/5121923616867842 - 玉楼春 吟望寄怀/02.jpg", "冰雪诗词_全部图片/5121923616867842 - 玉楼春 吟望寄怀/03.jpg"]}, {"id": "5123376877668311", "title": "朝中措·童稚迎春", "genre": "朝中措", "body": "幼儿画笔诉心声。\n蛇舞彩云空。\n泼墨辞别旧岁，\n挥毫妆点新容。\n胸中美景，\n飘然纸上，\n韵味无穷。\n今日朦胧童愿，\n将来或许都成。\n#日常记录##养娃日记# ​​​", "date": "2025.01.16", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5123376877668311 - 朝中措 童稚迎春/01.jpg", "冰雪诗词_全部图片/5123376877668311 - 朝中措 童稚迎春/02.jpg"]}, {"id": "5124092438776358", "title": "七绝·岁暮抒怀", "genre": "七绝", "body": "日月难穷人易老，\n山河无恙换新妆。\n愚公代代齐天志，\n江海同心感上苍。\n#日出##诗歌[超话]# ​​​", "date": "2025.01.18", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5124092438776358 - 七绝    岁暮抒怀/01.jpg"]}, {"id": "5124817762390666", "title": "五律·岁暮吟", "genre": "五律", "body": "大寒冬欲尽，\n不日又迎春。\n别却西风冷，\n思归故里亲。\n进门尊父母，\n卧榻定心魂。\n长久飘乡外，\n得闲邀旧人。\n​#传统二十四节气##民俗# ​​​", "date": "2025.01.20", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5124817762390666 - 五律 岁暮吟/01.jpg"]}, {"id": "5125533446180956", "title": "七绝·小年", "genre": "七绝", "body": "京城晓色静无风，\n残月西南卧远空。\n路上人车已偏少，\n任谁不起故乡情。\n#身边的风景##记录生活# ​​​", "date": "2025.01.22", "themes": ["四时风光与节气流转", "羁旅思乡与行吟纪游", "怀古咏史与读文有感", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/5125533446180956 - 七绝           小年/01.jpg"]}, {"id": "5126993329522181", "title": "七绝·岁杪吟望", "genre": "七绝", "body": "千呼万唤雪毛来，\n落下无形隐老宅。\n吻润云空亲故土，\n待风吹绽百花开。 ​​​", "date": "2025.01.26", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5126993329522181 - 七绝   岁杪吟望/01.jpg"]}, {"id": "5129521491347013", "title": "七律·乙巳年吟怀", "genre": "七律", "body": "鞭炮回归年味浓，\n九州街巷染灯红。\n走亲访友频来往，\n串店刷屏尽笑容。\n春晚新添神秘客，\n舞台依旧漫真情。\n今逢初五嘣穷日，\n一早冲天震耳鸣。 ​​​", "date": "2025.02.02", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5129521491347013 - 七律 乙巳年吟怀/01.jpg"]}, {"id": "5129914883507772", "title": "蝶恋花·立春抒怀", "genre": "蝶恋花", "body": "四季轮回春又到。\n万里无云，\n山海晴阳照。\n乙巳年来闻响炮，\n灵蛇献瑞人欢笑。\n寒冷将行花欲俏。\n喜看门庭，\n雀鸟枝头叫。\n暖坐阶前闲老少，\n家长里短开心唠。\n#立春##新春祝福# ​​​", "date": "2025.02.03", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5129914883507772 - 蝶恋花 立春抒怀/01.jpg", "冰雪诗词_全部图片/5129914883507772 - 蝶恋花 立春抒怀/02.jpg", "冰雪诗词_全部图片/5129914883507772 - 蝶恋花 立春抒怀/03.jpg"]}, {"id": "5130266360152814", "title": "五律·吟怀", "genre": "五律", "body": "不觉年已过，\n岁月自悠然。\n老者霜丝甚，\n少儿心底甜。\n连餐鱼蟹肉，\n满手百十元。\n梦里偷偷笑，\n醒来无个闲。\n#记录美好生活# ​​​", "date": "2025.02.04", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5130266360152814 - 五律    吟怀/01.jpg"]}, {"id": "5131347130320718", "title": "七绝·初十吟寄", "genre": "七绝", "body": "十全十美人心愿，\n岁首扬眉共向前。\n春至百花皆欲放，\n莺鸣柳翠众芳妍。\n祝朋友们心想事成！ ​​​", "date": "2025.02.07", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5131347130320718 - 七绝    初十吟寄/01.jpg"]}, {"id": "5131707512261158", "title": "采桑子·吟望寄怀", "genre": "采桑子", "body": "狗粮暗供催其吠。\n挑逗星辰，\n搅动风云。\n主子无形它咬人。\n而今暴露魔头面。\n大快民心，\n恶犬失魂。\n寰宇空明气色新。 ​​​", "date": "2025.02.08", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5131707512261158 - 采桑子 吟望寄怀/01.jpg", "冰雪诗词_全部图片/5131707512261158 - 采桑子 吟望寄怀/02.jpg", "冰雪诗词_全部图片/5131707512261158 - 采桑子 吟望寄怀/03.jpg"]}, {"id": "5132063388993830", "title": "七律·春日吟望", "genre": "七律", "body": "正月心闲日子红，\n炉台烟火袅云空。\n舒眉漫享团圆趣，\n落坐畅聊南北情。\n迈步街头逢故友，\n举觞家里笑今生。\n无忧自在枝檐鸟，\n恰似门阶霜鬓翁。 ​​​", "date": "2025.02.09", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5132063388993830 - 七律    春日吟望/01.jpg"]}, {"id": "5132422760890611", "title": "七绝·春怨", "genre": "七绝", "body": "时逢乙巳倒春寒，\n冷甚严冬三九天。\n连日北风狂肆虐，\n吹枝卷地扰新年。\n#记录生活# ​​​", "date": "2025.02.10", "themes": ["怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5132422760890611 - ​七绝           春怨/01.jpg"]}, {"id": "5132783230389145", "title": "七绝·吟怀", "genre": "七绝", "body": "新春膺悦赋闲篇，\n思绪飞扬眉宇间。\n屏上文交天下友，\n才情神韵尽诗仙。\n#诗歌[超话]# ​​​", "date": "2025.02.11", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5132783230389145 - 七绝           吟怀/01.jpg"]}, {"id": "5133156904603429", "title": "七绝·乙巳元宵节", "genre": "七绝", "body": "花灯破晓闹新春，\n五色汤圆万户亲。\n一缕阳光初耀眼，\n微风和煦暖人心。\n#有爱自团圆##新春祝福# ​​​", "date": "2025.02.12", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5133156904603429 - 七绝 乙巳元宵节/01.jpg"]}, {"id": "5133217044895723", "title": "七律·悼黄老院士", "genre": "七律", "body": "卅载埋名未见亲，\n凝眸铸剑赤儿心。\n日思夜继寻遥梦，\n笔算纸承图念真。\n入水蛟龙声远震，\n冲天神火散阴魂。\n老来霜鬓惊乡土，\n驾鹤西归众染襟。 ​​​", "date": "2025.02.12", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5133217044895723 - 七律 悼黄老院士/01.jpg", "冰雪诗词_全部图片/5133217044895723 - 七律 悼黄老院士/02.jpg", "冰雪诗词_全部图片/5133217044895723 - 七律 悼黄老院士/03.jpg"]}, {"id": "5133523742886936", "title": "五律·乙巳元夕", "genre": "五律", "body": "新年初满月，\n辉影弄花灯。\n笑靥随蛇舞，\n俏眸追火龙。\n彩烛争璀璨，\n玉树闪金星。\n都市宵无寐，\n乡村连炮声。\n#新春祝福# ​​​", "date": "2025.02.13", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5133523742886936 - 五律 乙巳元夕/01.jpg"]}, {"id": "5134249152481868", "title": "七绝·春日寄人", "genre": "七绝", "body": "过桥莫忘回头看，\n或许他时往复行。\n雁去衡阳春亦返，\n螺旋进取是人生。\n#诗歌[超话]# ​​​", "date": "2025.02.15", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5134249152481868 - 七绝    春日寄人/01.jpg"]}, {"id": "5134602133833128", "title": "七绝·岁初吟望", "genre": "七绝", "body": "彼岸一番操弄后，\n崇洋媚客却无言。\n昔时鼓噪乌鸦嘴，\n近日缩头怪可怜。 ​​​", "date": "2025.02.16", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5134602133833128 - 七绝    岁初吟望/01.jpg"]}, {"id": "5135688280051890", "title": "五律·春意", "genre": "五律", "body": "东风吹古柳，\n雨水润新芽。\n老者欣欣意，\n童儿朵朵花。\n城乡生璀璨，\n山海染辉霞。\n放眼晴空阔，\n街头气色佳。 ​​​", "date": "2025.02.19", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5135688280051890 - 五律    春意/01.jpg"]}, {"id": "5136048470098626", "title": "七律·引体人生", "genre": "七律", "body": "手拉躯体头超杠，\n上下垂直往复行。\n臂背核心齐用力，\n腰身经脉悄然通。\n二十余载从无断，\n数万来回别有情。\n花甲时光多自主，\n双修早晚意方平。\n#健身打卡##我的健身日常##见人不如健身##每日健身日记[超话]# ​​​", "date": "2025.02.20", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5136048470098626 - 七律    引体人生/01.jpg"]}, {"id": "5136414750540901", "title": "七律·乙巳吟望", "genre": "七律", "body": "新年哪吒火出圈，\n影院爆棚宵不眠。\n角色闪辉情喻世，\n言谈含蓄隐尘烟。\n票房史上名前列，\n人气今朝冲破天。\n华夏春风吹正甚，\n此花芳苑或夺冠。\n#动漫[超话]# ​​​", "date": "2025.02.21", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5136414750540901 - 七律    乙巳吟望/01.jpg"]}, {"id": "5136804624467329", "title": "五绝·郊外吟", "genre": "五绝", "body": "细柳扶人背，\n携春望水流。\n扬眉青鸟舞，\n惬意更何求。 ​​​", "date": "2025.02.22", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5136804624467329 - 五绝 郊外吟/01.jpg"]}, {"id": "5137867684972746", "title": "鹧鸪天·春日闲吟", "genre": "鹧鸪天", "body": "冬晓林园雾色浓，\n初春草木映天明。\n昔时小径人稀少，\n今日高枝众鸟鸣。\n年过后，友相逢。\n送完学子倍轻松。\n畅谈哪吒银屏事，\n沐浴温阳神自宁。\n#随手拍天气##随手拍美景##身边的风景##随手拍春天# ​​​", "date": "2025.02.25", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5137867684972746 - 鹧鸪天 春日闲吟/01.jpg"]}, {"id": "5138601822913177", "title": "七绝·龙之声", "genre": "七绝", "body": "无论东西南北风，\n立根华夏若苍松。\n阴晴雨雪皆无谓，\n躯干雄拔叶自青。 ​​​", "date": "2025.02.27", "themes": ["咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5138601822913177 - 七绝        龙之声/01.jpg"]}, {"id": "5139313272817986", "title": "七绝·二月二", "genre": "七绝", "body": "新春正月时光逝，\n转眼今朝龙首昂。\n细柳发芽人跃步，\n且凭鸿运走八方。\n#龙族[超话]# ​​​", "date": "2025.03.01", "themes": ["咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5139313272817986 - 七绝       二月二/01.jpg"]}, {"id": "5140415909201377", "title": "采桑子·悼汪院长", "genre": "采桑子", "body": "惊闻讣告追思远。\n学苑当年，\n笑貌悠然。\n如画蹁跹又眼前。\n寻常语缓情深厚。\n授课余闲，\n问暖嘘寒。\n君去温存心底间。 ​​​", "date": "2025.03.04", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5140415909201377 - 采桑子 悼汪院长/01.jpg"]}, {"id": "5140775891111295", "title": "七绝·惊蛰有寄", "genre": "七绝", "body": "春华渐入芬芳境，\n虫草扬眉气色新。\n人世百年迎巨变，\n大洋两岸竞晴阴。 ​​​", "date": "2025.03.05", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5140775891111295 - 七绝    惊蛰有寄/01.jpg"]}, {"id": "5141122838169019", "title": "五绝·吟望", "genre": "五绝", "body": "开年春为首，\n又见风吹柳。\n摇曳恁多情，\n悄然思故旧。#随手拍春天##诗歌[超话]# ​​​", "date": "2025.03.06", "themes": ["羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5141122838169019 - ​五绝    吟望/01.jpg"]}, {"id": "5141493774026487", "title": "采桑子·入群吟贺", "genre": "采桑子", "body": "乡情凝聚八方客。\n南北知音，\n老少相亲。\n只为廉州一脉根。\n书香漫溢人陶醉。\n犹木逢春，\n历久成林。\n故土芬芳天地新。 ​​​", "date": "2025.03.07", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5141493774026487 - 采桑子 入群吟贺/01.jpg"]}, {"id": "5141851565719781", "title": "朝中措·三八吟寄", "genre": "朝中措", "body": "九州女子半边天。\n家事缀心田。\n料里还须忙外，\n公差勇往争先。\n春秋寒暑，\n操劳日夜，\n灶上屏前。\n居内心倾老少，\n加班无悔鲜言。 ​​​", "date": "2025.03.08", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5141851565719781 - ​朝中措 三八吟寄/01.jpg"]}, {"id": "5142227001543185", "title": "七律·藁城吟颂", "genre": "七律", "body": "廉州自古远名扬，\n华夏肥国属汉邦。\n宫酒飘香皇室醉，\n宫灯闪耀伴君王。\n台西铁钺商周事，\n岗上黑猪御宴汤。\n名将梅花村灭寇，\n子麟故里尚书庄。 ​​​", "date": "2025.03.09", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5142227001543185 - 七律    藁城吟颂/01.jpg"]}, {"id": "5142582042034724", "title": "五绝·吟望", "genre": "五绝", "body": "已被当枪使，\n今应亦自知。\n人前堆苦笑，\n夜里悔无时。 ​​​", "date": "2025.03.10", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5142582042034724 - 五绝    吟望/01.jpg"]}, {"id": "5143303293244209", "title": "七律·植树节吟望", "genre": "七律", "body": "霞日春辉百子湾，\n园丁影衬草花妍。\n挖坑浇水根茁壮，\n培土修枝绿染天。\n今种幼苗心念驻，\n终将老木入云端。\n前人栽下摇钱树，\n实惠后生千万年。\n#随手拍美景# ​​​", "date": "2025.03.12", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5143303293244209 - 七律 植树节吟望/01.jpg"]}, {"id": "5143664896773692", "title": "七律·孙女春趣", "genre": "七律", "body": "学稚归来百子湾，\n斜阳沐浴嫩娇颜。\n彩虹跑道嘻声闹，\n浅绿草坪悄语酣。\n滑板追逐摔倒乐，\n跳绳碰撞躺平欢。\n眼前花朵争先放，\n爷奶近旁心里甜。 ​​​", "date": "2025.03.13", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5143664896773692 - 七律   孙女春趣/01.jpg", "冰雪诗词_全部图片/5143664896773692 - 七律   孙女春趣/02.jpg"]}, {"id": "5144014080704677", "title": "七绝·春日吟怀", "genre": "七绝", "body": "别人逐利我求闲，\n得空躬身二老前。\n兼顾儿孙多少事，\n任谁埋怨莫搭言。\n#励志语录[超话]##正能量[超话]##诗歌[超话]# ​​​", "date": "2025.03.14", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5144014080704677 - 七绝    春日吟怀/01.jpg"]}, {"id": "5144389697668048", "title": "小重山·冷暖抒怀", "genre": "小重山", "body": "乙巳春光少女情。\n娇颜难料定、暗忽明。\n柳眉扬起喜鸣莺。\n欢一刻、转脸恼丛生。\n暖日映苍穹。\n隔天云密布、起寒风。\n可怜老少路难行。\n凭生愿、惟岁月长晴。\n#身边的风景# ​​​", "date": "2025.03.15", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5144389697668048 - 小重山        冷暖抒怀/01.jpg"]}, {"id": "5144776727072319", "title": "太常引·315有感", "genre": "太常引", "body": "奸商黑店昧良心。\n假货乱充真。\n修物骗人金。\n肉掺水、坑钱害民。\n日常监管，\n君臣不到，\n奏报少回音。\n每岁只逢今。\n凭晚会、难能断根。 ​​​", "date": "2025.03.16", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5144776727072319 - 太常引     315有感/01.jpg"]}, {"id": "5145134404732094", "title": "七律·仲春闲吟", "genre": "七律", "body": "阳光普照心头暖，\n连日阴霾逝九天。\n研墨读章皆快事，\n抒怀醒脑自悠然。\n诗学李杜从新韵，\n词咏苏辛爱旧篇。\n更有廉州骚客友，\n书香群里共言欢。\n#致新的一天# ​​​", "date": "2025.03.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5145134404732094 - ​七律    仲春闲吟/01.jpg"]}, {"id": "5145836157665484", "title": "采桑子·孙女学拳", "genre": "采桑子", "body": "娇童初练跆拳道。\n意兴欣然。\n眼亮声尖。\n手腿劈蹬侧转翻。\n强身利脑坚其志。\n不畏炎寒。\n玉立人前。\n柔软腰姿好少年。 ​​​", "date": "2025.03.19", "themes": ["亲情友情与人间至爱"], "images": ["冰雪诗词_全部图片/5145836157665484 - 采桑子 孙女学拳/01.jpg", "冰雪诗词_全部图片/5145836157665484 - 采桑子 孙女学拳/02.jpg", "冰雪诗词_全部图片/5145836157665484 - 采桑子 孙女学拳/03.jpg", "冰雪诗词_全部图片/5145836157665484 - 采桑子 孙女学拳/04.jpg", "冰雪诗词_全部图片/5145836157665484 - 采桑子 孙女学拳/05.jpg", "冰雪诗词_全部图片/5145836157665484 - 采桑子 孙女学拳/06.jpg"]}, {"id": "5146189759253415", "title": "七律·春分有寄", "genre": "七律", "body": "乙巳今朝昼夜均，\n神州花草水清欣。\n东来紫气蒸蒸上，\n西落斜辉漫漫沉。\n日月轮回天不老，\n阴阳交替景宜人。\n一年四季风光好，\n骚客诗章偏爱春。\n#随手拍美景##随手拍春天##今日春分# ​​​", "date": "2025.03.20", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5146189759253415 - 七律    春分有寄/01.jpg", "冰雪诗词_全部图片/5146189759253415 - 七律    春分有寄/02.jpg"]}, {"id": "5146927504556253", "title": "清平乐·乙巳闲吟", "genre": "清平乐", "body": "归休烦少，\n多半陪煊宝。\n四载娇孙哭更笑，\n日子喜添调料。\n任凭苦辣酸咸，\n片云难掩晴天。\n屡屡微风拂过，\n悠悠我自清欢。#随手拍美景# ​​​", "date": "2025.03.22", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5146927504556253 - 清平乐 乙巳闲吟/01.jpg"]}, {"id": "5147278423886133", "title": "西江月·春日闲吟", "genre": "西江月", "body": "转眼时来周末，\n回头日过七天。\n光阴飞逝鬓霜间。\n精气充盈早晚。\n拂晓舒筋花苑，\n清晨送幼学园。\n得闲撸铁泳池边。\n星夜苏辛书伴。 ​​​", "date": "2025.03.23", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5147278423886133 - ​西江月 春日闲吟/01.jpg"]}, {"id": "5147647393138243", "title": "西江月·览群寄杯", "genre": "西江月", "body": "屏上诗词书画，\n心中淡静闲安。\n凝神细赏赋拙篇。\n邀友粗读评鉴。\n故里藏龙卧虎，\n大家吐气盈天。\n不才何日拜真颜，\n了却一桩心愿。 ​​​", "date": "2025.03.24", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5147647393138243 - 西江月 览群寄杯/01.jpg"]}, {"id": "5148007822788236", "title": "七绝·春日晓吟", "genre": "七绝", "body": "抬头翠色染新枝，\n满目鲜花竞艳姿。\n便是大风心不冷，\n春光远胜暖冬时。\n#随手拍春天# ​​​", "date": "2025.03.25", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5148007822788236 - 七绝    春日晓吟/01.jpg"]}, {"id": "5148364014355902", "title": "七律·春园有寄", "genre": "七律", "body": "早晚经行百子湾，\n爷孙最爱是春天。\n林花竞秀迎童去，\n翠鸟争呜送稚还。\n老者舒心闲散步，\n幼儿脱手漫撒欢。\n夕阳斜照东风暖，\n惬意归来放纸鸢。 ​​​", "date": "2025.03.26", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5148364014355902 - 七律    春园有寄/01.jpg"]}, {"id": "5148727900635317", "title": "七律·藁城咏望", "genre": "七律", "body": "滹沱河水润良田，\n自与廉州结妙缘。\n两岸稻粱金谷盛，\n万家炉火袅青烟。\n宫灯闪耀楼台宇，\n宫面飘香日月年。\n风土乡情民意厚，\n酿来御酒醉神仙。 ​​​", "date": "2025.03.27", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5148727900635317 - 七律    藁城咏望/01.jpg"]}, {"id": "5149091462646342", "title": "踏莎行·乙巳感怀", "genre": "踏莎行", "body": "世态炎凉，\n人心恶善。\n江湖风雨寻常见。\n老来静处一杯茶，\n闲听鸟语家妻伴。\n忘却忧愁，\n倾情餐饭。\n神舒食饱身常练。\n养精蓄力不求人，\n九旬笑饮峰溪畔。\n#身边的风景# ​​​", "date": "2025.03.28", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5149091462646342 - 踏莎行 乙巳感怀/01.jpg"]}, {"id": "5149462402959063", "title": "七绝·乙巳风云", "genre": "七绝", "body": "不意春寒闹玉京，\n花伤雀躁乱西风。\n应天大势谁能改，\n紫气还来日更红。 ​​​", "date": "2025.03.29", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5149462402959063 - 七绝    乙巳风云/01.jpg"]}, {"id": "5149818285197489", "title": "七绝·吟望东南", "genre": "七绝", "body": "被人霸领已多年，\n几次招回起事端。\n今欲亲情呼认祖，\n奈何逆子坏心肝。 ​​​", "date": "2025.03.30", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5149818285197489 - 七绝    吟望东南/01.jpg"]}, {"id": "5150184935261407", "title": "七律·台岛吟望", "genre": "七律", "body": "银鹰怒目向东南，\n铁甲奔流草木喧。\n浊水蟹虾犹乱舞，\n晴空日月照魔顽。\n岛中小丑形孤兽，\n岸上雄师名宇寰。\n猎狗擒狼华夏稳，\n神州一统九龙旋。 ​​​", "date": "2025.03.31", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5150184935261407 - ​七律    台岛吟望/01.jpg"]}, {"id": "5150543808040152", "title": "七绝·近清明有感", "genre": "七绝", "body": "忽觉空里漫浮灰，\n烧纸家亲解念悲。\n万户今朝红火日，\n尽凭冥币了心扉。 ​​​", "date": "2025.04.01", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/5150543808040152 - 七绝 近清明有感/01.jpg"]}, {"id": "5150901234304297", "title": "西江月·望故乡", "genre": "西江月", "body": "上树摘桃年少，\n爬墙掏鸟时迁。\n每当忆起暖膺田。\n远去风光难现。\n昔日青丝浅靥，\n今朝霜鬓苍颜。\n街头相遇不曾言，\n人道同窗玩伴。 ​​​", "date": "2025.04.02", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5150901234304297 - 西江月    望故乡/01.jpg"]}, {"id": "5151265262145411", "title": "七绝·乙巳春吟望", "genre": "七绝", "body": "春风普惠世间花，\n粉紫红黄染万家。\n更有窗前枝杪翠，\n盎然生气映朝霞。 ​​​", "date": "2025.04.03", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5151265262145411 - 七绝 乙巳春吟望/01.jpg"]}, {"id": "5151625258205882", "title": "七绝·清明见闻", "genre": "七绝", "body": "便道划圈堆纸烧，\n悲思飘过故乡桥。\n远途难到坟前祭，\n想必先人理不挑。 ​​​", "date": "2025.04.04", "themes": ["四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/5151625258205882 - 七绝    清明见闻/01.jpg"]}, {"id": "5152011235363909", "title": "蝶恋花·清明吟望", "genre": "蝶恋花", "body": "百里山蹊徒步走。\n学子三千，\n顶日迎星斗。\n昼夜兼程无意柳。\n只缘烈士心中有。\n祭拜英灵齐叩首。\n卅载坚持，\n感地惊天久。\n如此育人真善守。\n神州万代山河秀。 ​​​", "date": "2025.04.05", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/5152011235363909 - 蝶恋花 清明吟望/01.jpg"]}, {"id": "5152420552513987", "title": "蝶恋花·贺父寿八十三", "genre": "蝶恋花", "body": "三月风光初九日。\n椿寿萱亲，四代人欢喜。\n袅袅炊烟香漫溢，\n农家小院辉盈壁。\n慈父居堂心满意。\n儿女孙娃，把盏福音寄。\n不老南山松久立，\n亲如日月同天地。 ​​​", "date": "2025.04.06", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5152420552513987 - ​蝶恋花    贺父寿八十三/01.jpg"]}, {"id": "5152714558017697", "title": "七绝·风云吟望", "genre": "七绝", "body": "花开必有落花时，\n人至巅峰贵自知。\n留路下山频顾望，\n当归莫恋鸟鸣啼。 ​​​", "date": "2025.04.07", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5152714558017697 - 七绝    风云吟望/01.jpg"]}, {"id": "5153077330708096", "title": "七绝·闲人吟望", "genre": "七绝", "body": "吾儿三口到成都，\n临去乖孙咏杜书。\n今日草堂门处站，\n少陵绝律应声出。 ​​​", "date": "2025.04.08", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5153077330708096 - 七绝    闲人吟望/01.jpg"]}, {"id": "5153457329668307", "title": "江城子·读友买车记吟怀", "genre": "江城子", "body": "四驱越野任驰翔。\n过河床，跨峰梁。\n华夏东西、南北细端详。\n五岳群山寻探后，\n观四海，望三江。\n余生惬意好风光。\n景无常，绪飞扬。\n神魄云游，妙手著华章。\n屡有诗词平仄句，\n情无限，韵悠长。 ​​​", "date": "2025.04.09", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5153457329668307 - 江城子 读友买车记吟怀/01.jpg"]}, {"id": "5153800000901126", "title": "七绝·题照", "genre": "七绝", "body": "昔气充盈眼放光，\n满怀自信笑声长。\n而今黯寂失魂魄，\n贪草老牛愁断肠。 ​​​", "date": "2025.04.10", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5153800000901126 - 七绝           题照/01.jpg"]}, {"id": "5154168738943568", "title": "朝中措·十二级狂风欲闹", "genre": "朝中措", "body": "极端预警为黎民。风力恁惊人。\n百载廉州未见，闻听骇魄飞魂。\n由来西北，尘沙南下，地暗天昏。\n学校行将停课，拜托转告乡邻。 ​​​", "date": "2025.04.11", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5154168738943568 - ​    朝中措    十二级狂风欲闹/01.jpg"]}, {"id": "5154526237298501", "title": "蝶恋花·春宵难寐", "genre": "蝶恋花", "body": "彻夜狂风声怒吼。\n房瓦叮当，\n砖块环庭走。\n牌匾心寒频颤抖，\n断枝残叶窗阶凑。\n清晓落红铺地厚。\n燕雀无形，\n只剩春梢瘦。\n一早人稀空远透，\n可怜环卫街前后。 ​​​", "date": "2025.04.12", "themes": ["山水田园与闲居雅趣", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5154526237298501 - ​蝶恋花 春宵难寐/01.jpg"]}, {"id": "5154889665090175", "title": "南乡子·大风后寄怀", "genre": "南乡子", "body": "转日景光新。\n万里长空无片云。\n晨起清凉听鸟雀，\n惜春。\n百啭千声尽妙音。\n岁月有晴阴。\n凡事遭逢可两分。\n且莫一心钻死角，\n回身。\n世路崎岖总有人。 ​​​", "date": "2025.04.13", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5154889665090175 - 南乡子 大风后寄怀/01.jpg"]}, {"id": "5155285187167815", "title": "七绝·黄毛之痛", "genre": "七绝", "body": "抡起钢刀劈对方，\n不成想己亦遭枪。\n病身失血难言苦，\n暗恨爪牙无预防。 ​​​", "date": "2025.04.14", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5155285187167815 - 七绝    黄毛之痛/01.jpg"]}, {"id": "5155626784917779", "title": "七绝·中越吟望", "genre": "七绝", "body": "犹似连枝两弟兄，\n围居南海几多情。\n共经风雨心怀异，\n同对豺狼合力生。 ​​​", "date": "2025.04.15", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5155626784917779 - 七绝    中越吟望/01.jpg"]}, {"id": "5156339127948605", "title": "七律·暮春吟望", "genre": "七律", "body": "神州花绽韵无穷，\n遍处芬芳映远空。\n彼岸寒潮携墨雨，\n吾庭角落起阴风。\n东升旭日消霾雾，\n西坠斜辉裹旧红。\n岁月轮回天地换，\n飞龙盛世唱英雄。 ​​​", "date": "2025.04.17", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5156339127948605 - 七律    暮春吟望/01.jpg"]}, {"id": "5156701277523070", "title": "鹧鸪天·彼岸吟望", "genre": "鹧鸪天", "body": "驴技将穷象亦难。\n丛林套路岂遮天。\n高悬大棒收无奈，\n频耍花腔少信言。\n灯塔暗，月光残。\n出行路上渐成单。\n世人今日趋清醒，\n失道之徒夏也寒。 ​​​", "date": "2025.04.18", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5156701277523070 - 鹧鸪天 彼岸吟望/01.jpg"]}, {"id": "5157076872989667", "title": "定风波·蛙泳有感", "genre": "定风波", "body": "池里学蛙双腿蹬。\n埋头呼气臂伸平。\n划手胸前夹抱水。\n挺背。\n畅怀吸纳自充盈。\n如此循环沉又起。\n惬意。\n浪花朵朵玉晶莹。\n霜鬓妪翁勤锻炼。\n常见。\n天南地北话无穷。 ​​​", "date": "2025.04.19", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5157076872989667 - ​定风波 蛙泳有感/01.jpg"]}, {"id": "5157463386493533", "title": "蝶恋花·谷雨抒怀", "genre": "蝶恋花", "body": "谷雨之前甘露降。\n润物除尘，\n今日晴空旷。\n放眼高楼心底畅\n葱葱郁郁千层浪。\n草木感恩花竞放。\n山海多情，\n莺鹊欢声唱。\n最是黎民天不忘，\n秋收祭拜添佳酿。 ​​​", "date": "2025.04.20", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5157463386493533 - 蝶恋花 谷雨抒怀/01.jpg"]}, {"id": "5157795566716936", "title": "西江月·周末小姐妹", "genre": "西江月", "body": "团子来家做客，\n若煊出户迎宾。\n入门牵手笑声频。\n缓步厅堂答问。\n玩具并肩摆弄，\n读书异口同音。\n蜜般滋味润童心。\n一晌欢情未尽。 ​​​", "date": "2025.04.21", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5157795566716936 - 西江月 周末小姐妹/01.jpg"]}, {"id": "5158150753222723", "title": "七律·京城半马赛", "genre": "七律", "body": "常闻人跑马拉松，\n突现机奔亮眼睛。\n手脚协同神气在，\n腰身摆动意从容。\n路边观者皆欢舞，\n业界来宾亦震惊。\n一霎创新传四宇，\n万千网友赞无穷。 ​​​", "date": "2025.04.22", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5158150753222723 - ​七律 京城半马赛/01.jpg", "冰雪诗词_全部图片/5158150753222723 - ​七律 京城半马赛/02.jpg"]}, {"id": "5158531041334040", "title": "踏莎行·今非昔比", "genre": "踏莎行", "body": "……贺海军生日\n向海图强，\n凝心聚力。\n七十六载风和雨。\n辛酸挥泪更高歌，\n缺船少舰成回忆。\n航母巡游，\n大驱轮替。\n无踪潜艇开天地。\n五洲任我自由行，\n大西洋里频来去。 ​​​", "date": "2025.04.23", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "怀古咏史与读文有感", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5158531041334040 - ​踏莎行 今非昔比/01.jpg", "冰雪诗词_全部图片/5158531041334040 - ​踏莎行 今非昔比/02.jpg"]}, {"id": "5158902879750011", "title": "蝶恋花·书香藁城", "genre": "蝶恋花", "body": "缕缕书香飘四海。\n熏暖廉州，\n受众多豪迈。\n字画俗规皆所爱，\n诗词文赋情慷慨。\n提振膺怀人不怠。\n政要黎民，\n尽展新风采。\n敬业持家和内外，\n并肩逐梦初心在。 ​​​", "date": "2025.04.24", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5158902879750011 - 蝶恋花 书香藁城/01.jpg"]}, {"id": "5159249374613180", "title": "菩萨蛮·贺神舟20发射成功", "genre": "菩萨蛮", "body": "五十五载同一处。\n箭辉更亮星如故。\n兴起忆当年，东方红漫天。\n举国歌并舞，齐庆敲锣鼓。\n今日驻天宫，嫦娥笑靥浓。\n注：神舟20与第一颗人造\n卫星同天同地点发射。 ​​​", "date": "2025.04.25", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5159249374613180 - ​菩萨蛮 贺神舟20发射成功/01.jpg"]}, {"id": "5159623553716947", "title": "朝中措·暮春有思", "genre": "朝中措", "body": "娇娃学课老夫闲。\n隔壁稚声喧。\n恰是晚春天暮，\n抬头青翠无边。\n风摇秀景，\n群楼耸立，\n霞色盈天。\n花草春秋往复，\n谁能许我童年。 ​​​", "date": "2025.04.26", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5159623553716947 - 朝中措 暮春有思/01.jpg"]}, {"id": "5159967481397960", "title": "五律·春日吟", "genre": "五律", "body": "暮春天渐暖，\n晨练喜添人。\n舞炫歌声远，\n拳飞脚带魂。\n老夫翻卷杠，\n翠鸟啭清音。\n庭院温馨景，\n神州遍处闻。 ​​​", "date": "2025.04.27", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5159967481397960 - 五律 春日吟/01.jpg"]}, {"id": "5160333081840679", "title": "七绝·寰宇吟望", "genre": "七绝", "body": "教皇葬礼却偷闲，\n规避他人聊会天。\n肢体语言瞒不住，\n无声画面世间传。 ​​​", "date": "2025.04.28", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5160333081840679 - 七绝    寰宇吟望/01.jpg"]}, {"id": "5160695596581510", "title": "十六字令·三首", "genre": "十六字令", "body": "风。\n落叶秋来卷过冬。\n冰融化，\n春草百花生。\n风。\n吹散阴霾万里晴。\n山川丽，\n春水泛光明。\n风。\n扫灭西方塔上灯。\n天边亮，\n春日旭由东。 ​​​", "date": "2025.04.29", "themes": ["山水田园与闲居雅趣"], "images": ["冰雪诗词_全部图片/5160695596581510 - 十六字令    三首/01.jpg"]}, {"id": "5161611154948252", "title": "清平乐·劳动节吟赞", "genre": "清平乐", "body": "无声打脸。\n董姐浑身胆。\n格力腰直行路远。\n任汝说长道短。\n海龟或有间谍。\n用人业主谋决。\n不鸟周边犬吠。\n挺胸再上台阶。 ​​​", "date": "2025.05.01", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5161611154948252 - 清平乐 劳动节吟赞/01.jpg"]}, {"id": "5162536912814873", "title": "减字木兰花·青年节吟望", "genre": "减字木兰花", "body": "今逢五四，昔日青春成记忆。\n过往辉煌，回荡心头日月长。\n苍颜斑鬓，喜望山河情亦奋。\n地覆天翻，遍处青葱草木妍。 ​​​", "date": "2025.05.04", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5162536912814873 - 减字木兰花     青年节吟望/01.jpg"]}, {"id": "5162906530616766", "title": "五律·立夏吟", "genre": "五律", "body": "夜雨迎初夏，\n晓风拂老身。\n民心河畔景，\n单杠柱边人。\n踢腿弯腰乐，\n牵绳遛狗亲。\n凌空鸣鸟翥，\n鱼跃响清音。 ​​​", "date": "2025.05.05", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5162906530616766 - 五律 立夏吟/01.jpg"]}, {"id": "5163951709489412", "title": "七律·临屏吟望", "genre": "七律", "body": "印巴交火起东风，\n吹落阿三铁鸟篷。\n败阵军心生恐惧，\n闻情政客更发蒙。\n当年惹事愁肠断，\n今日抽疯苦胆疼。\n狂妄无知天下笑，\n劝君切莫耍聪明。 ​​​", "date": "2025.05.08", "themes": ["家国情怀与时代歌咏", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5163951709489412 - 七律    临屏吟望/01.jpg", "冰雪诗词_全部图片/5163951709489412 - 七律    临屏吟望/02.jpg"]}, {"id": "5164313044583153", "title": "七绝·乙巳夏初", "genre": "七绝", "body": "纤丝细雨已连天，\n雷电未闻风亦闲。\n喜纳玉珠苗木壮，\n人逢甘露润心田。 ​​​", "date": "2025.05.09", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5164313044583153 - 七绝    乙巳夏初/01.jpg"]}, {"id": "5164841552316931", "title": "江城子·乙巳还乡", "genre": "江城子", "body": "祖孙五口故乡还。\n旧堂前，拜椿萱。\n四载时光，\n二老念煊煊。\n半岁当时曾见过。\n今目秀，更心欢。\n满门四代俱平安。\n老一言，少一言。\n笑语盈盈，\n喜气胜新年。\n兄妹三家人俱到，\n连环乐，闹翻天。 ​​​", "date": "2025.05.10", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5164841552316931 - ​江城子 乙巳还乡/01.jpg"]}, {"id": "5165402473892136", "title": "七绝·母亲节有寄", "genre": "七绝", "body": "一.\n贤妻良母一家亲，\n琴瑟和鸣漫妙音。\n常有身边儿女伴，\n风霜寒暑总如春。\n二.\n逢儿生日母亲节，\n孙女忙前不肯歇。\n俏语欢歌传四处，\n偷闲左右找爷爷。 ​​​", "date": "2025.05.12", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5165402473892136 - 七绝 母亲节有寄/01.jpg", "冰雪诗词_全部图片/5165402473892136 - 七绝 母亲节有寄/02.jpg"]}, {"id": "5165764190930921", "title": "七绝·神龙吟望", "genre": "七绝", "body": "印巴交手子扬名，\n举世方知有巨龙。\n平日鲜闻潜水下，\n一朝腾起露真容。 ​​​", "date": "2025.05.13", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5165764190930921 - 七绝    神龙吟望/01.jpg"]}, {"id": "5166123081009270", "title": "七绝·愁望", "genre": "七绝", "body": "五月冰雹降夜空，\n大如鸡蛋使人惊。\n可怜花木失魂魄，\n毁损麦田愁老农。 ​​​", "date": "2025.05.14", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5166123081009270 - 七绝           愁望/01.jpg"]}, {"id": "5166496863748513", "title": "五律·夏园有寄", "genre": "五律", "body": "翠鸟树争鸣，\n繁花粉映红。\n青云闲自度，\n湖水静无声。\n健体人心悦，\n浇园苦壮丁。\n阳光同照耀，\n草木各西东。 ​​​", "date": "2025.05.15", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5166496863748513 - 五律 夏园有寄/01.jpg"]}, {"id": "5166848028183659", "title": "蝶恋花·风云吟望", "genre": "蝶恋花", "body": "川普无端兴税浪。\n多地人惊，\n跪倒埋头向。\n胆颤心寒神不壮，\n总觉刀片迎眸晃。\n华夏硬刚惟榜样。\n对岸无着，\n货断人声呛。\n无奈几番期造访，\n终得瑞士东方亮。 ​​​", "date": "2025.05.16", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5166848028183659 - 蝶恋花 风云吟望/01.jpg"]}, {"id": "5167215084833263", "title": "蝶恋花·闻趣有寄", "genre": "蝶恋花", "body": "交火双方皆庆祝。\n真假迷人，\n惟阵风清楚。\n巴放录音谁苦诉，\n阿三铁鸟生无助。\n一战歼十成大户。\n举世惊魂，\n仰望神龙翥。\n霄汉翱翔凭自主，\n神州何日开疆土？ ​​​", "date": "2025.05.17", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5167215084833263 - 蝶恋花 闻趣有寄/01.jpg"]}, {"id": "5167574835003899", "title": "七绝·夜悦吟", "genre": "七绝", "body": "夏初昼热晚风凉，\n忙罢娇孙享夜光。\n楼院舒心闲散步，\n吟思词句凑篇章。\n#记录美好生活##日常分享# ​​​", "date": "2025.05.18", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5167574835003899 - 七绝        夜悦吟/01.jpg"]}, {"id": "5167938304213250", "title": "五律·乙巳初夏", "genre": "五律", "body": "春归夜雨频，\n晓霁少飞云。\n高树枝梢翠，\n长空气色新。\n恋花欢鸟雀，\n行路不愁人。\n醉爱天公意，\n红黄染绿荫。 ​​​", "date": "2025.05.19", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5167938304213250 - 五律 乙巳初夏/01.jpg"]}, {"id": "5168338751717662", "title": "七绝·乙巳闲吟", "genre": "七绝", "body": "柴米油盐日复年，\n春秋寒暑苦还甜。\n子孙依次攀登上，\n白首老夫心自甘。 ​​​", "date": "2025.05.20", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5168338751717662 - 七绝    乙巳闲吟/01.jpg"]}, {"id": "5168688824323186", "title": "蝶恋花·小满有寄", "genre": "蝶恋花", "body": "喜看麦田秸粒壮。\n风起青萍，\n绿海翻波浪。\n无数农家齐盼望，\n天公助力台阶上。\n人物相通君莫忘。\n地利天时，\n得遇人和畅。\n便有先机休恣妄，\n功名小满宜谦让。 ​​​", "date": "2025.05.21", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5168688824323186 - 蝶恋花 小满有寄/01.jpg"]}, {"id": "5169385629025588", "title": "七律·琴音悦耳", "genre": "七律", "body": "课外学琴家里弹，\n孙娃四岁不偷闲。\n书中五线音符密，\n键上一双童手纤。\n入耳飞声人自乐，\n扬眉埋首韵您然。\n黑白舞动和弦妙，\n旋律充盈玉指间 ​​​", "date": "2025.05.23", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5169385629025588 - ​七律    琴音悦耳/01.jpg"]}, {"id": "5169868460525255", "title": "浣溪沙·乙巳初夏", "genre": "浣溪沙", "body": "夜雨洗尘明霁空，\n恰逢周末好心情。\n孙随父母悦闲翁。\n眺远凭高杨柳翠，\n飞声入耳鹊莺鸣。\n倚栏独望趣无穷。 ​​​", "date": "2025.05.24", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5169868460525255 - 浣溪沙 乙巳初夏/01.jpg"]}, {"id": "5170481688482508", "title": "五律·幼女骑车", "genre": "五律", "body": "不觉孙已大，\n首次试骑行。\n目举前方看，\n耳倾边侧听。\n小轮能助稳，\n纤手把平衡。\n眉眼神情秀，\n腰直腿脚蹬。 ​​​", "date": "2025.05.26", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5170481688482508 - ​五律 幼女骑车/01.jpg"]}, {"id": "5170943198760164", "title": "七律·孙女咏趣", "genre": "七律", "body": "一天背过沁园春，\n玩乐之余巧聚神。\n汉武秦皇随口问，\n唐宗宋祖引童真。\n言词反复知其意，\n平仄融合有妙音。\n稚子心灵潜力巨，\n莫凭杂念误儿身。 ​​​", "date": "2025.05.27", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5170943198760164 - 七律    孙女咏趣/01.jpg"]}, {"id": "5171196569324892", "title": "七绝·夏园晓色", "genre": "七绝", "body": "笛子悠扬声悦耳，\n芳园葱郁养心神。\n抬头满眼皆青翠，\n晨晓温凉最喜人。 ​​​", "date": "2025.05.28", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5171196569324892 - 七绝    夏园晓色/01.jpg"]}, {"id": "5171569765648724", "title": "虞美人·爷孙参访北大", "genre": "虞美人", "body": "妈妈深造燕园里，\n钩起娇娃趣。\n爷孙相伴兴前来，\n游览未名湖畔、尽心怀。\n百贤古院书香甚，\n幼女频相问。\n将来能否此读书，\n博雅塔边傍晚、看鸭浮？ ​​​", "date": "2025.05.29", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5171569765648724 - 虞美人    爷孙参访北大/01.jpg", "冰雪诗词_全部图片/5171569765648724 - 虞美人    爷孙参访北大/02.jpg", "冰雪诗词_全部图片/5171569765648724 - 虞美人    爷孙参访北大/03.jpg", "冰雪诗词_全部图片/5171569765648724 - 虞美人    爷孙参访北大/04.jpg", "冰雪诗词_全部图片/5171569765648724 - 虞美人    爷孙参访北大/05.jpg", "冰雪诗词_全部图片/5171569765648724 - 虞美人    爷孙参访北大/06.jpg"]}, {"id": "5171960669541637", "title": "朝中措·祖国花朵", "genre": "朝中措", "body": "时临六一幼儿欢，\n早晚尽开颜。\n长辈叠加礼物，\n老师语润心田。\n居家可爱，\n园中勇跃，\n遇事争先。\n今日娇柔花朵，\n将来梁栋盈天。 ​​​", "date": "2025.05.30", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5171960669541637 - 朝中措 祖国花朵/01.jpg", "冰雪诗词_全部图片/5171960669541637 - 朝中措 祖国花朵/02.jpg", "冰雪诗词_全部图片/5171960669541637 - 朝中措 祖国花朵/03.jpg"]}, {"id": "5172285200665008", "title": "蝶恋花·乙巳端午", "genre": "蝶恋花", "body": "又品粽香华夏味。\n千载传承，\n恰似东流水。\n青叶米团红枣配，\n甘甜入口心陶醉。\n多少龙舟宵不寐。\n只为今朝，\n竞渡江头会。\n锣鼓喧天驱鬼魅，\n旌旗翻卷灵均泪。 ​​​", "date": "2025.05.31", "themes": ["山水田园与闲居雅趣", "四时风光与节气流转", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/5172285200665008 - 蝶恋花 乙巳端午/01.jpg"]}, {"id": "5172641308610375", "title": "鹧鸪天·儿童节有寄", "genre": "鹧鸪天", "body": "端午六一前后天，\n幼儿欢乐若新年。\n粽香漫溢神州地，\n花朵芬芳华夏园。\n新衣俏，浅妆妍。\n开怀嘻闹不思还。\n才骑木马滑梯悦，\n又喂鱼鸭戏水滩。 ​​​", "date": "2025.06.01", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5172641308610375 - 鹧鸪天 儿童节有寄/01.jpg"]}, {"id": "5173375888264752", "title": "蝶恋花·闻讯有寄", "genre": "蝶恋花", "body": "香会开成媒体秀。\n米帝新官，\n作派还依旧。\n嘴大不知天地厚，\n自嗨人恨名声臭。\n且看龙哥眉眼透。\n刚毅坚强，\n谁敢和他斗。\n半岛昔时驱恶狗，\n今朝寰宇频昂首。 ​​​", "date": "2025.06.03", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5173375888264752 - ​蝶恋花 闻讯有寄/01.jpg"]}, {"id": "5173732110504770", "title": "七绝·闻事吟", "genre": "七绝", "body": "登高莫忘来时路，\n振臂发声休背心。\n痕迹已留难抹去，\n盗铃掩耳妄欺人。 ​​​", "date": "2025.06.04", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5173732110504770 - 七绝        闻事吟/01.jpg"]}, {"id": "5174092996283871", "title": "七律·乙巳芒种吟", "genre": "七律", "body": "京城今日忆当年，\n随父麦收学舞镰。\n三点起床天未亮，\n五更挥手汗珠连。\n弯腰埋首心头苦，\n入夜屈身梦里甜。\n睡醒指根多水泡，\n脖疼臂肿后背酸。 ​​​", "date": "2025.06.05", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5174092996283871 - 七律 乙巳芒种吟/01.jpg", "冰雪诗词_全部图片/5174092996283871 - 七律 乙巳芒种吟/02.jpg"]}, {"id": "5174825293186285", "title": "踏莎行·吟学子", "genre": "踏莎行", "body": "高考来临，\n寒门期待。\n十年心血贫能改。\n爹娘无靠自殷勤，\n征途不想人前败。\n宛若独桥，\n几多无奈。\n埋头挥墨心胸快。\n换得慧眼巧识珠，\n黄金榜下情豪迈。 ​​​", "date": "2025.06.07", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5174825293186285 - 踏莎行    吟学子/01.jpg"]}, {"id": "5175183263400234", "title": "蝶恋花·京城大吉巷", "genre": "蝶恋花", "body": "菜市口旁新去处。\n地上悠闲，\n地下光盈目。\n店面琳琅赢客驻，\n吃喝玩乐光阴度。\n百姓欢游朝与暮。\n情侣双双，\n夜晚难移步。\n谁道旧时骡马路，\n而今万众争相顾。 ​​​", "date": "2025.06.08", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5175183263400234 - 蝶恋花 京城大吉巷/01.jpg", "冰雪诗词_全部图片/5175183263400234 - 蝶恋花 京城大吉巷/02.jpg", "冰雪诗词_全部图片/5175183263400234 - 蝶恋花 京城大吉巷/03.jpg", "冰雪诗词_全部图片/5175183263400234 - 蝶恋花 京城大吉巷/04.jpg", "冰雪诗词_全部图片/5175183263400234 - 蝶恋花 京城大吉巷/05.jpg", "冰雪诗词_全部图片/5175183263400234 - 蝶恋花 京城大吉巷/06.jpg"]}, {"id": "5175543592125409", "title": "太常引·寄语学子", "genre": "太常引", "body": "今朝考罢路东西。\n各自有心期。\n何必抢高枝。\n尽情唱，终为所知。\n莺啼树上，\n鸡鸣窗下，\n庭院显生机。\n两者莫缺一。\n如日月，风光晓夕。 ​​​", "date": "2025.06.09", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5175543592125409 - 太常引  寄语学子/01.jpg"]}, {"id": "5175913815737957", "title": "浣溪沙·夏晓吟寄", "genre": "浣溪沙", "body": "送罢娇孙入早园。\n穿行石径百花间。\n鸟声盈耳悦心田。\n闲望浮云来又去，\n欣闻歌舞起回旋。\n老翁神态胜青年。 ​​​", "date": "2025.06.10", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5175913815737957 - ​浣溪沙 夏晓吟寄/01.jpg"]}, {"id": "5176269885932917", "title": "七绝·天怒人怨", "genre": "七绝", "body": "往时风景到身边，\n不见妖婆嘻笑颜。\n米帝当年拿手戏，\n今朝屡屡馈她前。 ​​​", "date": "2025.06.11", "themes": ["感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5176269885932917 - 七绝    天怒人怨/01.jpg"]}, {"id": "5176642710014122", "title": "七律·颂少校张伟", "genre": "七律", "body": "和平卫士气如山，\n无愧英雄天地间。\n跪拜含情别母去，\n转身入水使人还。\n连番五次拼竭力，\n不怕一生止眼前。\n解放军中兵与将，\n世逢危难总当先。 ​​​", "date": "2025.06.12", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5176642710014122 - 七律 颂少校张伟/01.jpg"]}, {"id": "5176993382400102", "title": "七绝·仲夏晓吟", "genre": "七绝", "body": "三年夏日在新疆，\n夜里从来未敞窗。\n京邑今朝刚欲热，\n醒神已是汗浇床。 ​​​", "date": "2025.06.13", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5176993382400102 - 七绝    仲夏晓吟/01.jpg"]}, {"id": "5177369445009007", "title": "五绝·夏雨人欢", "genre": "五绝", "body": "老天怜百姓，\n周末雨浇城。\n退却烦人热，\n依栏别有情。 ​​​", "date": "2025.06.14", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5177369445009007 - 五绝 夏雨人欢/01.jpg"]}, {"id": "5177767530071028", "title": "踏莎行·节日敬父", "genre": "踏莎行", "body": "父爱如山，\n亲情似海。\n椿庭敞亮春长在。\n仰天远阔悦儿心，\n阖家受益多豪迈。\n银发稀疏，\n柔怀未改。\n重孙相见心澎湃。\n八十三岁挺腰身，\n迎风矗立犹松柏。 ​​​", "date": "2025.06.15", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5177767530071028 - 踏莎行 节日敬父/01.jpg"]}, {"id": "5178449117054830", "title": "蝶恋花·北京绿心森林", "genre": "蝶恋花", "body": "废厂焕新盈草木。\n引水成渠，\n桥上游人驻。\n云戏碧波蛙劲鼓，\n绿荫树下环行路。\n周末祖孙携手度。\n望远抒怀，\n心悦莺鸣舞。\n为赏风光勤脚步，\n宜人景色频回顾。 ​​​", "date": "2025.06.17", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5178449117054830 - 蝶恋花 北京绿心森林/01.jpg", "冰雪诗词_全部图片/5178449117054830 - 蝶恋花 北京绿心森林/02.jpg", "冰雪诗词_全部图片/5178449117054830 - 蝶恋花 北京绿心森林/03.jpg"]}, {"id": "5178807354920056", "title": "采桑子·日暮吟雨", "genre": "采桑子", "body": "娇孙上课吾听雨。\n打叶敲窗，\n祛热添凉。\n青翠枝条气色扬。\n甘霖骤降人心喜。\n清爽盈腔，\n意绪飞翔。\n稚嫩书声韵味长。 ​​​", "date": "2025.06.18", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5178807354920056 - ​采桑子 日暮吟雨/01.jpg"]}, {"id": "5179528972603424", "title": "七绝·中东吟望", "genre": "七绝", "body": "心浮杂念苦苍生，\n火弹银花乱夜空。\n百姓不知何处是，\n躲藏无奈梦魂惊。 ​​​", "date": "2025.06.20", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5179528972603424 - ​七绝    中东吟望/01.jpg"]}, {"id": "5179909924456258", "title": "踏莎行·乙巳夏至", "genre": "踏莎行", "body": "时遇周休，\n年逢夏至。\n最长白昼弥炎气。\n从今往后暑难熬，\n汗流面背身如洗。\n梦里求风，\n醒来祈雨。\n坐行专捡阴凉地。\n手摇蒲扇眼惺忪，\n蝉鸣树杪添烦意。 ​​​", "date": "2025.06.21", "themes": ["四时风光与节气流转", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5179909924456258 - 踏莎行 乙巳夏至/01.jpg"]}, {"id": "5180631823684950", "title": "蝶恋花·夏日闲思", "genre": "蝶恋花", "body": "网上言谈天与地。\n真假难分，\n闻罢由他去。\n碧落风云凭玉帝，\n物情对错人心里。\n路走东西终靠己。\n切莫随风，\n摇摆墙头立。\n欲到长城依脚力，\n八达岭上辉光异。 ​​​", "date": "2025.06.23", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5180631823684950 - 蝶恋花 夏日闲思/01.jpg"]}, {"id": "5180980446365688", "title": "蝶恋花·吟中东", "genre": "蝶恋花", "body": "曾望加沙心坏笑。\n不想今时，\n家破楼倾倒。\n天道轮回终有报，\n眉凝肠断闻哭闹。\n狂妄言行常跑调。\n撕毁章程，\n上下东西跳。\n以为没谁能管了，\n不成想会钟馗到。 ​​​", "date": "2025.06.24", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5180980446365688 - 蝶恋花    吟中东/01.jpg", "冰雪诗词_全部图片/5180980446365688 - 蝶恋花    吟中东/02.jpg", "冰雪诗词_全部图片/5180980446365688 - 蝶恋花    吟中东/03.jpg"]}, {"id": "5181748260113721", "title": "朝中措·夏日有感", "genre": "朝中措", "body": "蝴蝶飞舞百花丛。\n自奋且凭风。\n无虑闲舒心态，\n绕枝起落身轻。\n引予观看，\n触发感想，\n激荡神情。\n人世何当如此，\n悠哉潇洒平生。 ​​​", "date": "2025.06.26", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5181748260113721 - 朝中措 夏日有感/01.jpg"]}, {"id": "5182537560492579", "title": "踏莎行·琴声激荡", "genre": "踏莎行", "body": "期待十天，\n欢弹一刻。\n钢琴学练初收获。\n今朝检试展人前，\n低头行礼回身坐。\n双手轻舒，\n两眸闪烁。\n音符跳动童心彻。\n和弦妙韵谢师恩，\n娇孙添技爷相贺。 ​​​", "date": "2025.06.28", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5182537560492579 - 踏莎行 琴声激荡/01.jpg"]}, {"id": "5183157596849634", "title": "踏莎行·童趣", "genre": "踏莎行", "body": "园里同班，\n小区邻住。\n三天姐弟长相顾。\n时逢周末早前约，\n两家郊外光阴度。\n画笔合描，\n转轮同步。\n吟诗对句无穷数。\n青云来去影相随，\n黄莺飞过心头妒。 ​​​", "date": "2025.06.30", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5183157596849634 - 踏莎行       童趣/01.jpg", "冰雪诗词_全部图片/5183157596849634 - 踏莎行       童趣/02.jpg"]}, {"id": "5183544554160236", "title": "踏莎行·七一抒怀", "genre": "踏莎行", "body": "昔日红船，\n今朝航母。\n历经百载千难苦。\n神州日月换新天，\n大洋彼岸愁川普。\n你控晶芯，\n我封稀土。\n可怜洛马神无主。\n银鹰六代刺云空，\n长巡碧落谁为伍！\n注：洛马为米国\n最大军火商。 ​​​", "date": "2025.07.01", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5183544554160236 - 踏莎行 七一抒怀/01.jpg"]}, {"id": "5184250384223367", "title": "南乡子·乙巳夏吟", "genre": "南乡子", "body": "闷热胜昔年。\n还未头伏汗水连。\n白昼少风愁鸟雀。\n人烦。\n深夜翻腾总不眠。\n湿度日高攀。\n雾气蒙蒙蔽远天。\n便是彻阴无烈日。\n身黏。\n苦状揪心不可言。 ​​​", "date": "2025.07.03", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5184250384223367 - 南乡子 乙巳夏吟/01.jpg"]}, {"id": "5184615103072333", "title": "清平乐·酬友赠句", "genre": "清平乐", "body": "欣闻佳韵，\n溽暑心怀润。\n妙笔生辉传美讯，\n骤减炎光一寸。\n若风入户穿梁，\n提神醒脑添香。\n回味飘来字句，\n长思细品华章。 ​​​", "date": "2025.07.04", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5184615103072333 - 清平乐 酬友赠句/01.jpg"]}, {"id": "5185329121988433", "title": "踏莎行·孙女舞蹈", "genre": "踏莎行", "body": "背挺眉舒，\n腰柔眼亮。\n合生汇处心怀向。\n每周相聚舞娇姿，\n园丁浇灌禾苗壮。\n师长倾心，\n幼儿渴望。\n今朝展演争前上。\n婀娜身手引人眸，\n鲜花朵朵迎风靓。 ​​​", "date": "2025.07.06", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5185329121988433 - 踏莎行 孙女舞蹈/01.jpg", "冰雪诗词_全部图片/5185329121988433 - 踏莎行 孙女舞蹈/02.jpg", "冰雪诗词_全部图片/5185329121988433 - 踏莎行 孙女舞蹈/03.jpg"]}, {"id": "5185725886367141", "title": "采桑子·铭记国耻", "genre": "采桑子", "body": "七七事变八八载。\n战火风烟，\n地覆天翻。\n日寇狼心存世间。\n倭贼近日频频动。\n窥伺周边，\n怪论奇谈。\n吾辈钢枪顶上肩。 ​​​", "date": "2025.07.07", "themes": ["家国情怀与时代歌咏", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5185725886367141 - 采桑子 铭记国耻/01.jpg"]}, {"id": "5186789116478293", "title": "五律·夏日吟", "genre": "五律", "body": "雨浇天未凉，\n暑气透纱窗。\n平卧身难耐，\n烦听心愈慌。\n蝉鸣人躁虑，\n叶落树悲伤。\n如此三伏近，\n到时愁更长。 ​​​", "date": "2025.07.10", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5186789116478293 - ​五律 夏日吟/01.jpg"]}, {"id": "5190532183622094", "title": "朝中措·出京避暑", "genre": "朝中措", "body": "帝都一路向山东。\n窗外郁葱葱。\n车内祖孙三口，\n沿途喜乐融融。\n淄博夜宿，\n闲游街市，\n烧烤香浓。\n张店吴家就坐，\n人说远近闻名。 ​​​", "date": "2025.07.20", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5190532183622094 - ​朝中措 出京避暑/01.jpg", "冰雪诗词_全部图片/5190532183622094 - ​朝中措 出京避暑/02.jpg"]}, {"id": "5190803941230763", "title": "朝中措·到乳山银滩", "genre": "朝中措", "body": "淄博晓起再东行。\n过午海滨停。\n左转海都花苑。\n卧闻千里涛声。\n娇孙期待，\n金辉拇指，\n广场多情。\n日暮星光璀璨，\n银滩歌舞欢腾。 ​​​", "date": "2025.07.21", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5190803941230763 - 朝中措 到乳山银滩/01.jpg", "冰雪诗词_全部图片/5190803941230763 - 朝中措 到乳山银滩/02.jpg", "冰雪诗词_全部图片/5190803941230763 - 朝中措 到乳山银滩/03.jpg", "冰雪诗词_全部图片/5190803941230763 - 朝中措 到乳山银滩/04.jpg", "冰雪诗词_全部图片/5190803941230763 - 朝中措 到乳山银滩/05.jpg", "冰雪诗词_全部图片/5190803941230763 - 朝中措 到乳山银滩/06.jpg"]}, {"id": "5191543822227067", "title": "七律·大暑有寄", "genre": "七律", "body": "院临堤岸夜风凉，\n酣卧纱帘半掩窗。\n电扇不开身倍爽。\n空调未挂梦犹香。\n清晨鸟语催人起，\n傍晚蝉声伴绪扬。\n暑日时光潇洒过，\n银滩谁道是他乡。 ​​​", "date": "2025.07.23", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5191543822227067 - 七律    大暑有寄/01.jpg"]}, {"id": "5191909342971210", "title": "蝶恋花·银滩海洋园", "genre": "蝶恋花", "body": "夜场游园光烂漫。\n人少心愉，\n爷俩精玩遍。\n海盗船头摇眺瞰，\n欢骑木马千般转。\n漫步太空身欲探。\n碰碰车中，\n娇女肝肠颤。\n旋转双飞风洗面，\n摩天轮上银滩灿。 ​​​", "date": "2025.07.24", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5191909342971210 - 蝶恋花 银滩海洋园/01.jpg", "冰雪诗词_全部图片/5191909342971210 - 蝶恋花 银滩海洋园/02.jpg", "冰雪诗词_全部图片/5191909342971210 - 蝶恋花 银滩海洋园/03.jpg", "冰雪诗词_全部图片/5191909342971210 - 蝶恋花 银滩海洋园/04.jpg", "冰雪诗词_全部图片/5191909342971210 - 蝶恋花 银滩海洋园/05.jpg", "冰雪诗词_全部图片/5191909342971210 - 蝶恋花 银滩海洋园/06.jpg"]}, {"id": "5192628486014225", "title": "七律·银滩戏水", "genre": "七律", "body": "长江路上海洋园，\n华夏八方客涌前。\n京邑祖孙初试水，\n银滩波浪掩鸣蝉。\n学爷划手双蹬腿，\n望伴漂流两眼馋。\n飞下滑梯白玉碎，\n碧涛洗面笑欢言。 ​​​", "date": "2025.07.26", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5192628486014225 - 七律    银滩戏水/01.jpg", "冰雪诗词_全部图片/5192628486014225 - 七律    银滩戏水/02.jpg", "冰雪诗词_全部图片/5192628486014225 - 七律    银滩戏水/03.jpg", "冰雪诗词_全部图片/5192628486014225 - 七律    银滩戏水/04.jpg", "冰雪诗词_全部图片/5192628486014225 - 七律    银滩戏水/05.jpg", "冰雪诗词_全部图片/5192628486014225 - 七律    银滩戏水/06.jpg"]}, {"id": "5193335620503860", "title": "蝶恋花·盛夏童欢", "genre": "蝶恋花", "body": "​南北京城兄妹趣。\n祖辈同窗，\n约在银滩聚。\n相见若亲双手递，\n好玩食物凭心取。\n形影不离消夏季。\n戏水挖沙，\n合荡秋千去。\n同坐滑梯生惬意，\n摩天轮上长欢叙。 ​​​", "date": "2025.07.28", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5193335620503860 - 蝶恋花 盛夏童欢/01.jpg", "冰雪诗词_全部图片/5193335620503860 - 蝶恋花 盛夏童欢/02.jpg", "冰雪诗词_全部图片/5193335620503860 - 蝶恋花 盛夏童欢/03.jpg", "冰雪诗词_全部图片/5193335620503860 - 蝶恋花 盛夏童欢/04.jpg", "冰雪诗词_全部图片/5193335620503860 - 蝶恋花 盛夏童欢/05.jpg", "冰雪诗词_全部图片/5193335620503860 - 蝶恋花 盛夏童欢/06.jpg", "冰雪诗词_全部图片/5193335620503860 - 蝶恋花 盛夏童欢/07.jpg", "冰雪诗词_全部图片/5193335620503860 - 蝶恋花 盛夏童欢/08.jpg", "冰雪诗词_全部图片/5193335620503860 - 蝶恋花 盛夏童欢/09.jpg"]}, {"id": "5194055642516830", "title": "七绝·闻事吟", "genre": "七绝", "body": "佛门净地亦藏污，\n一夜风来浊气除。\n期望禅房香愈甚，\n诵经打坐破尘俗。 ​​​", "date": "2025.07.30", "themes": ["羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5194055642516830 - 七绝       闻事吟/01.jpg"]}, {"id": "5194416725952779", "title": "蝶恋花·银滩之夜", "genre": "蝶恋花", "body": "傍晚海风消暑气。\n乡客出门，\n堤岸舒心意。\n闲望烟云别有趣，\n银滩暮色风光丽。\n歌舞盈眸锣鼓密。\n娱乐抒怀，\n老少皆参与。\n模特走来香满地，\n闻听竹板勾回忆。 ​​​", "date": "2025.07.31", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5194416725952779 - 蝶恋花 银滩之夜/01.jpg", "冰雪诗词_全部图片/5194416725952779 - 蝶恋花 银滩之夜/02.jpg", "冰雪诗词_全部图片/5194416725952779 - 蝶恋花 银滩之夜/03.jpg", "冰雪诗词_全部图片/5194416725952779 - 蝶恋花 银滩之夜/04.jpg", "冰雪诗词_全部图片/5194416725952779 - 蝶恋花 银滩之夜/05.jpg", "冰雪诗词_全部图片/5194416725952779 - 蝶恋花 银滩之夜/06.jpg"]}, {"id": "5194782750019513", "title": "踏莎行·八一颂", "genre": "踏莎行", "body": "将勇兵强，\n矛长盾固。\n三军昼夜江山护。\n神州岁月稳平安，\n黎民无虑时光度。\n偶起风云，\n紧盯门户。\n钢枪时刻瞄狼虎。\n挺胸高举舞旌旗，\n八一闪耀夺人目。 ​​​", "date": "2025.08.01", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5194782750019513 - 踏莎行    八一颂/01.jpg"]}, {"id": "5195533481150028", "title": "采桑子·伏天乐学", "genre": "采桑子", "body": "海滨松树林中坐。\n风色宜人，\n暑日消魂。\n简易书桌乐我孙。\n打开斑马思维课。\n数字诗文，\n图画声音。\n雀鸟飞来几探身。 ​​​", "date": "2025.08.03", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5195533481150028 - 采桑子 伏天乐学/01.jpg", "冰雪诗词_全部图片/5195533481150028 - 采桑子 伏天乐学/02.jpg"]}, {"id": "5196257949648520", "title": "水调歌头·山东银滩寄怀", "genre": "水调歌头", "body": "暑季银滩飒，早晚有凉风。江南塞北，闲客于此好心情。拂晓沿堤散步，前晌寻街探市，日落踏歌声。三五成群伴，满脸尽欢容。\n品海鲜，吸富氧，乐无穷。短休长住，涛浪云月俱相迎。新痛转天或好，久病日长亦去，时日更轻松。翁媪无忧虑，碧水对青空。", "date": "2025.08.05", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5196257949648520 - 水调歌头    山东银滩寄怀/01.jpg", "冰雪诗词_全部图片/5196257949648520 - 水调歌头    山东银滩寄怀/02.jpg", "冰雪诗词_全部图片/5196257949648520 - 水调歌头    山东银滩寄怀/03.jpg", "冰雪诗词_全部图片/5196257949648520 - 水调歌头    山东银滩寄怀/04.jpg", "冰雪诗词_全部图片/5196257949648520 - 水调歌头    山东银滩寄怀/05.jpg", "冰雪诗词_全部图片/5196257949648520 - 水调歌头    山东银滩寄怀/06.jpg"]}, {"id": "5196949839152781", "title": "五绝·时令吟", "genre": "五绝", "body": "立秋如往常，\n未感更风凉。\n隔日三伏到，\n后才枝叶黄。 ​​​", "date": "2025.08.07", "themes": ["四时风光与节气流转", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5196949839152781 - 五绝 时令吟/01.jpg"]}, {"id": "5197291230594224", "title": "蝶恋花·银滩踏海", "genre": "蝶恋花", "body": "海里娇孙初戏水。\n笑靥如花，\n臂展心陶醉。\n双手急划频踹腿，\n波涛卷舞纤肩背。\n浪里众游声鼎沸。\n老少同欢，\n不道身怀累。\n暮色苍茫星欲坠，\n归来满口腥咸味。 ​​​", "date": "2025.08.08", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5197291230594224 - 蝶恋花 银滩踏海/01.jpg", "冰雪诗词_全部图片/5197291230594224 - 蝶恋花 银滩踏海/02.jpg"]}, {"id": "5198042001311387", "title": "七律·青岛海底世界", "genre": "七律", "body": "生物繁多乱眼球，\n斑斓色彩水中流。\n鲨鳍涛里凭心舞，\n鲸骨人前不自由。\n玳瑁企鹅行缓慢，\n金鱼海豹竞驰游。\n珊瑚摇动孙兴奋，\n水母如花脚步留。 ​​​", "date": "2025.08.10", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5198042001311387 - 七律 青岛海底世界/01.jpg", "冰雪诗词_全部图片/5198042001311387 - 七律 青岛海底世界/02.jpg", "冰雪诗词_全部图片/5198042001311387 - 七律 青岛海底世界/03.jpg", "冰雪诗词_全部图片/5198042001311387 - 七律 青岛海底世界/04.jpg", "冰雪诗词_全部图片/5198042001311387 - 七律 青岛海底世界/05.jpg", "冰雪诗词_全部图片/5198042001311387 - 七律 青岛海底世界/06.jpg"]}, {"id": "5198770450991466", "title": "踏莎行·濒海灯光秀", "genre": "踏莎行", "body": "彩挂楼阁，\n光铺水岸。\n海滨夜色丰姿幻。\n妙图美乐酷无穷，\n眼迷耳胀心撩乱。\n鸟啭激扬，\n人山翻卷。\n繁星摇曳风情漫。\n银花火树映霄空，\n初秋青岛凭君恋。 ​​​", "date": "2025.08.12", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5198770450991466 - 踏莎行 濒海灯光秀/01.jpg", "冰雪诗词_全部图片/5198770450991466 - 踏莎行 濒海灯光秀/02.jpg", "冰雪诗词_全部图片/5198770450991466 - 踏莎行 濒海灯光秀/03.jpg", "冰雪诗词_全部图片/5198770450991466 - 踏莎行 濒海灯光秀/04.jpg", "冰雪诗词_全部图片/5198770450991466 - 踏莎行 濒海灯光秀/05.jpg", "冰雪诗词_全部图片/5198770450991466 - 踏莎行 濒海灯光秀/06.jpg"]}, {"id": "5199139864314731", "title": "七律·青岛八大关", "genre": "七律", "body": "古时关隘作街名，\n三纵七横车马行。\n别墅于间格调异，\n瓦砖置上色偏红。\n蓝天映照烟花盛，\n碧海合围草木荣。\n游者摩肩声鼎沸，\n摆拍朋侣恁多情。\n注：起初八个关名\n八条路，后扩两关\n两路。 ​​​", "date": "2025.08.13", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5199139864314731 - 七律 青岛八大关/01.jpg", "冰雪诗词_全部图片/5199139864314731 - 七律 青岛八大关/02.jpg", "冰雪诗词_全部图片/5199139864314731 - 七律 青岛八大关/03.jpg", "冰雪诗词_全部图片/5199139864314731 - 七律 青岛八大关/04.jpg", "冰雪诗词_全部图片/5199139864314731 - 七律 青岛八大关/05.jpg", "冰雪诗词_全部图片/5199139864314731 - 七律 青岛八大关/06.jpg"]}, {"id": "5199487312332850", "title": "清平乐·和友见赠", "genre": "清平乐", "body": "云青气润，\n堤岸飘秋韵。\n碧海无边思不尽，\n眺望征鸿飞阵。\n沙滩松软滑柔，\n回头翠叶盈眸。\n暮色凉风好梦，\n神游枕上如舟。 ​​​", "date": "2025.08.14", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5199487312332850 - ​清平乐 和友见赠/01.jpg"]}, {"id": "5199854481445294", "title": "五律·寄日寇", "genre": "五律", "body": "战败八十载，\n罪行无反思。\n书中长掩盖，\n嘴上久相欺。\n政客图私欲，\n国民事莫知。\n瞒天天不应，\n尘世共喷之。 ​​​", "date": "2025.08.15", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5199854481445294 - 五律 寄日寇/01.jpg"]}, {"id": "5200207484031011", "title": "蝶恋花·夏日吟望", "genre": "蝶恋花", "body": "举世遥期双普会。\n就在今朝，\n予盾强相对。\n必是往来烟火味，\n不知高下人心惴。\n最是欧乌难醒寐。\n命运由他，\n空落膺怀累。\n玉案虽宽无己位，\n菜单被点凭开胃。 ​​​", "date": "2025.08.16", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5200207484031011 - 蝶恋花 夏日吟望/01.jpg", "冰雪诗词_全部图片/5200207484031011 - 蝶恋花 夏日吟望/02.jpg"]}, {"id": "5200320411733176", "title": "清平乐·赠普京", "genre": "清平乐", "body": "单刀赴会，\n昂首心无愧。\n便是虎穴徒手对，\n君为国何所谓。\n战机掠过从容，\n一车双普同行。\n交手言谈得体，\n临别拜谒英雄。 ​​​", "date": "2025.08.16", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5200320411733176 - 清平乐    赠普京/01.jpg", "冰雪诗词_全部图片/5200320411733176 - 清平乐    赠普京/02.jpg", "冰雪诗词_全部图片/5200320411733176 - 清平乐    赠普京/03.jpg"]}, {"id": "5200559805829496", "title": "蝶恋花·孙女玩杠", "genre": "蝶恋花", "body": "一岁多时初吊杠。\n三载光阴，\n屡次爷扶上。\n口数三十当日状，\n今朝百二娇模样。\n每有同龄腰腿壮。\n欲试高低，\n总比她先晃。\n羸弱香肩堪小将，\n争先意愿心怀荡。 ​​​", "date": "2025.08.17", "themes": ["亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5200559805829496 - 蝶恋花 孙女玩杠/01.jpg", "冰雪诗词_全部图片/5200559805829496 - 蝶恋花 孙女玩杠/02.jpg", "冰雪诗词_全部图片/5200559805829496 - 蝶恋花 孙女玩杠/03.jpg"]}, {"id": "5200932778542792", "title": "浣溪沙·初秋有寄", "genre": "浣溪沙", "body": "送罢娇孙返乳山，\n难得老俩自悠闲。\n初秋漫赏逛银滩。\n树果飘香街市旺，\n海鱼入味灶盘鲜。\n凭风望海度流年。 ​​​", "date": "2025.08.18", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5200932778542792 - 浣溪沙 初秋有寄/01.jpg", "冰雪诗词_全部图片/5200932778542792 - 浣溪沙 初秋有寄/02.jpg"]}, {"id": "5201285592383552", "title": "浣溪沙·幼儿喜相逢", "genre": "浣溪沙", "body": "遥望娇孙返幼园。\n中班开课第一天。\n重逢姐弟笑开颜。\n放假出游时过月，\n入学落座趣无边。\n琮琮招手唤煊煊。 ​​​", "date": "2025.08.19", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5201285592383552 - 浣溪沙 幼儿喜相逢/01.jpg"]}, {"id": "5201659329778185", "title": "七绝·秋日闲吟", "genre": "七绝", "body": "出伏暑气未全消，\n秋虎袭来无处逃。\n漫待风吹桐叶落，\n天清云爽任逍遥。 ​​​", "date": "2025.08.20", "themes": ["山水田园与闲居雅趣", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5201659329778185 - 七绝    秋日闲吟/01.jpg"]}, {"id": "5202009401590935", "title": "踏莎行·彼岸吟望", "genre": "踏莎行", "body": "别样风情，\n空前宴会。\n丛林老虎独高位。\n豺狼狗兔不甘心，\n奈何势弱徒含泪。\n欲上餐桌，\n实得杂碎。\n尝来不是曾经味。\n无知今日异昔时，\n守残抱旧堪愚昧。 ​​​", "date": "2025.08.21", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5202009401590935 - ​踏莎行 彼岸吟望/01.jpg"]}, {"id": "5202371031597146", "title": "七绝·秋日吟", "genre": "七绝", "body": "秋香漫溢染银滩，\n瓜果鱼虾映碧天。\n风色人情留远客，\n八方相聚又一年。 ​​​", "date": "2025.08.22", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱"], "images": ["冰雪诗词_全部图片/5202371031597146 - 七绝        秋日吟/01.jpg", "冰雪诗词_全部图片/5202371031597146 - 七绝        秋日吟/02.jpg", "冰雪诗词_全部图片/5202371031597146 - 七绝        秋日吟/03.jpg"]}, {"id": "5206361063293108", "title": "七律·金秋盛宴", "genre": "七律", "body": "上合峰会聚八方，\n星耀海河龙凤祥。\n四面风来秋更飒，\n五湖鱼跃米尤香。\n神州待客发诚意，\n津水载舟思远航。\n携手宾朋盈笑靥，\n共谋欧亚再图强。 ​​​", "date": "2025.09.02", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5206361063293108 - 七律    金秋盛宴/01.jpg", "冰雪诗词_全部图片/5206361063293108 - 七律    金秋盛宴/02.jpg", "冰雪诗词_全部图片/5206361063293108 - 七律    金秋盛宴/03.jpg"]}, {"id": "5206758257854481", "title": "清平乐·观阅兵有感", "genre": "清平乐", "body": "高朋满座，\n争看三军愕。\n铁甲银鹰呼啸过，\n徒步官兵炯烁。\n空中水下神惊，\n无敌陆上群英。\n华夏今朝底气，\n东风助力和平。 ​​​", "date": "2025.09.03", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5206758257854481 - 清平乐 观阅兵有感/01.jpg"]}, {"id": "5207080516715291", "title": "朝中措·谁与争锋", "genre": "朝中措", "body": "……九三寄怀\n东风浩荡卷尘沙。\n利剑扫天涯。\n且凭高能锐器，\n宇寰所向开花。\n三军抖擞，\n银鹰舞动，\n铁甲穿插。\n将士横刀立马，\n把来盗寇击杀。 ​​​", "date": "2025.09.04", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5207080516715291 - 朝中措 谁与争锋/01.jpg", "冰雪诗词_全部图片/5207080516715291 - 朝中措 谁与争锋/02.jpg", "冰雪诗词_全部图片/5207080516715291 - 朝中措 谁与争锋/03.jpg", "冰雪诗词_全部图片/5207080516715291 - 朝中措 谁与争锋/04.jpg", "冰雪诗词_全部图片/5207080516715291 - 朝中措 谁与争锋/05.jpg", "冰雪诗词_全部图片/5207080516715291 - 朝中措 谁与争锋/06.jpg"]}, {"id": "5207457429195624", "title": "朝中措·九三之后", "genre": "朝中措", "body": "东风闪过宇寰新。\n四海少杂音。\n西霸眼花心悸，\n猢狲留去难分。\n沉浮渐定，\n光阴照旧，\n翻转乾坤。\n华夏复兴非梦，\n神州万里迎春。 ​​​", "date": "2025.09.05", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游"], "images": ["冰雪诗词_全部图片/5207457429195624 - 朝中措 九三之后/01.jpg", "冰雪诗词_全部图片/5207457429195624 - 朝中措 九三之后/02.jpg", "冰雪诗词_全部图片/5207457429195624 - 朝中措 九三之后/03.jpg"]}, {"id": "5208910287864307", "title": "清平乐·缅怀主席", "genre": "清平乐", "body": "那年今日，\n山裂江河滞。\n泪水长流华夏地，\n四十九载常忆。\n像前将士昂头，\n赤心瞩目城楼。\n敬慰先驱领袖，\n红旗沃土无忧。 ​​​", "date": "2025.09.09", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5208910287864307 - 清平乐 缅怀主席/01.jpg", "冰雪诗词_全部图片/5208910287864307 - 清平乐 缅怀主席/02.jpg", "冰雪诗词_全部图片/5208910287864307 - 清平乐 缅怀主席/03.jpg"]}, {"id": "5212152109729413", "title": "采桑子·国耻铭心", "genre": "采桑子", "body": "……九一八抒怀\n九十四载谁能忘。\n倭寇猖狂，\n掳掠爹娘。\n践踏山河华夏殇。\n英雄儿女齐心力。\n意志坚强，\n奋舞刀枪。\n消灭豺狼迎暑光。 ​​​", "date": "2025.09.18", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5212152109729413 - 采桑子  国耻铭心/01.jpg"]}, {"id": "5213956350151268", "title": "七绝·乙巳秋分", "genre": "七绝", "body": "中秋将近昼宵均，\n木叶趋黄细雨勤。\n今岁天凉较往早，\n阴晴无定更愁人。 ​​​", "date": "2025.09.23", "themes": ["四时风光与节气流转", "感怀人生与自省述志", "节日庆典与民俗风情"], "images": ["冰雪诗词_全部图片/5213956350151268 - 七绝    乙巳秋分/01.jpg"]}, {"id": "5216890280479897", "title": "满江红·十一寄怀", "genre": "满江红", "body": "…迎国庆七十六周年\n云淡天高，秋风劲、空明国庆。\n亿民悦、五星旗赤，山河辉映。\n江海飞舟腾碧浪，边陲跃马欢歌竞。\n忆前贤、叹地覆天翻，今朝盛。\n航母飒，华为硬。军民奋，惊贼梦。\n华夏展宏图，遍如仙境。\n亚太融合峰岭秀，宇寰协振星辰共。\n且扬眉、昂首再挥鞭，神州胜。", "date": "2025.10.01", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "怀古咏史与读文有感", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5216890280479897 - 满江红       十一寄怀/01.jpg"]}, {"id": "5225200956213132", "title": "七绝·霜后有寄", "genre": "七绝", "body": "近日诗词友未闻，\n念吾思绪几萦心。\n寒宵来电情怀暖，\n睡起余温笼老身。 ​​​", "date": "2025.10.24", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5225200956213132 - 七绝    霜后有寄/01.jpg"]}, {"id": "5225739877090951", "title": "采桑子·闻讯寄怀", "genre": "采桑子", "body": "台湾光复八十秩。\n日月轮回，\n浪子无归。\n政客贪权百姓悲。\n家亲思念频呼唤。\n情迫声催，\n大势难违。\n聚力神州共起飞。 ​​​", "date": "2025.10.25", "themes": ["亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5225739877090951 - ​采桑子 闻讯寄怀/01.jpg"]}, {"id": "5227004647441754", "title": "鹧鸪天·重九寄怀", "genre": "鹧鸪天", "body": "昔日重阳敬老人，\n而今霜鬓染吾身。\n无穷岁月悠悠去，\n短暂霞辉漫漫沉。\n花间客，岭头云。\n犹蓬飘过少留痕。\n凡尘世物皆如此，\n度尽秋冬总是春。 ​​​", "date": "2025.10.29", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "节日庆典与民俗风情", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5227004647441754 - ​鹧鸪天 重九寄怀/01.jpg"]}, {"id": "5228453253353657", "title": "七绝·秋日吟望", "genre": "七绝", "body": "寒风落叶冷深秋，\n鸟雀无声草木忧。\n偶有阳光人世暖，\n倚墙翁妪少闲愁。 ​​​", "date": "2025.11.02", "themes": ["山水田园与闲居雅趣", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5228453253353657 - 七绝    秋日吟望/01.jpg"]}, {"id": "5229539621864316", "title": "采桑子·宝岛吟望", "genre": "采桑子", "body": "百年烂党新魁首。\n念想牵魂，\n声势夺人。\n或聚蓝营散漫心！\n绿白两阵偷瞭望。\n各自思寻，\n细找伤痕。\n能胜英姿俏丽文？ ​​​", "date": "2025.11.05", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5229539621864316 - ​采桑子 宝岛吟望/01.jpg"]}, {"id": "5230362771066697", "title": "七绝·立冬有寄", "genre": "七绝", "body": "杂忙无意岁临冬，\n细雨缠绵日冷清。\n更有尘间多少事，\n寒风吹过透心胸。 ​​​", "date": "2025.11.07", "themes": ["亲情友情与人间至爱", "四时风光与节气流转", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5230362771066697 - 七绝   立冬有寄/01.jpg"]}, {"id": "5230671828353918", "title": "渔家傲·福建航母赞", "genre": "渔家傲", "body": "航母成三华夏奋，\n劈波斩浪风头劲。\n迈向深蓝携利刃，\n威名震。\n大洋阔海凭出进。\n昔日有心缺后盾，\n岛礁遥望徒生恨。\n强盗横行得尺寸，\n膺怀闷。\n今朝吞气眉峰顺。 ​​​", "date": "2025.11.08", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀"], "images": ["冰雪诗词_全部图片/5230671828353918 - 渔家傲 福建航母赞/01.jpg", "冰雪诗词_全部图片/5230671828353918 - 渔家傲 福建航母赞/02.jpg", "冰雪诗词_全部图片/5230671828353918 - 渔家傲 福建航母赞/03.jpg"]}, {"id": "5232445847769226", "title": "踏莎行·初冬吟望", "genre": "踏莎行", "body": "落叶铺金，\n玩童拾趣。\n稚声鼎沸连天地。\n林园韵味恁宜人，\n手忙心醉情难抑。\n树鸟凝神，\n园丁会意。\n景音融洽腾欢气。\n栋梁缘自幼苗根，\n他年大厦凌云立。 ​​​", "date": "2025.11.13", "themes": ["羁旅思乡与行吟纪游", "感怀人生与自省述志"], "images": ["冰雪诗词_全部图片/5232445847769226 - 踏莎行 初冬吟望/01.jpg", "冰雪诗词_全部图片/5232445847769226 - 踏莎行 初冬吟望/02.jpg", "冰雪诗词_全部图片/5232445847769226 - 踏莎行 初冬吟望/03.jpg"]}, {"id": "5248142447741701", "title": "鹧鸪天·纪念主席诞辰132年", "genre": "鹧鸪天", "body": "圣诞中华国运来，\n百年磨难聚英排。\n三山推倒翻天地，\n万马奔腾画卷开。\n身虽去，念徘徊。\n每逢今日忆贤才。\n若无盖世君擎臂，\n巨厦倾斜遍地埃。 ​​​", "date": "2025.12.26", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "怀古咏史与读文有感"], "images": ["冰雪诗词_全部图片/5248142447741701 - 鹧鸪天 纪念主席诞辰132年/01.jpg"]}, {"id": "5269043369214017", "title": "满江红·贺宁忠岩冰上速滑夺冠", "genre": "满江红", "body": "赤子神风，寒光里、龙飞旗跃。惊玉道、一金破阵，百年冰裂。赤县久缺霜刃锐，亚洲今有锋芒烨。丙午春、挥手向长天，情怀悦。\n征衣烈，心似铁；男儿奋，魂如血。任高寒彻骨，志冲云阙。不负艰辛夺胜绩，犹得奥运开新页。待明朝、华夏展雄姿，群英列。", "date": "2026.02.22", "themes": ["家国情怀与时代歌咏", "山水田园与闲居雅趣", "亲情友情与人间至爱", "感怀人生与自省述志", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5269043369214017 - ​满江红  贺宁忠岩冰上速滑夺冠/01.jpg"]}, {"id": "5269401849038119", "title": "七律·丙午春寄怀", "genre": "七律", "body": "五人三地度新春，\n古冶廉州劳燕分。\n京邑鸟儿飞上海，\n浦江城堡戏青云。\n夫妻各自陪亲老，\n子幼合欢逛景林。\n元日连屏遥问好，\n团圆难称万家心。 ​​​", "date": "2026.02.23", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5269401849038119 - 七律 丙午春寄怀/01.jpg"]}, {"id": "5269785480009445", "title": "一剪梅·丙午春开工有寄", "genre": "一剪梅", "body": "九昼春休意未央，山魄徜徉，水趣徜徉。\n归程各趁好时光，亲敬高堂，友聚华堂。\n今赴新程向远疆，眉宇轩昂，志意轩昂。\n马年风运正腾骧，业比春长，福与天长。 ​​​", "date": "2026.02.24", "themes": ["山水田园与闲居雅趣", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5269785480009445 - ​           一剪梅    丙午春开工有寄/01.jpg"]}, {"id": "5270187448207602", "title": "沁园春·娇孙舞元日", "genre": "沁园春", "body": "红漫云台，福耀星空，光影纷缭。恰爆竹声里，岁华新换；屠苏盏外，暖意初调。五岁煊儿，两年才艺，今挽红灯态更娇。朱唇俏，唱桃符焕彩，万户妖娆。\n霓裳诗韵飞飘。融稚气、翩跹上碧霄。俱身轻目秀，眸深靥浅；群声振玉，笑卷春潮。卡酷屏中，童姿音律，细把春阳景色描。华堂里，众家亲聚望，喜染眉梢。\n注释：正月初四，北京卫视卡酷少儿频道播出了全国少儿新春大联欢，小孙女参加了一个舞蹈节目，以王安石的诗词《元日》为主题。", "date": "2026.02.25", "themes": ["家国情怀与时代歌咏", "亲情友情与人间至爱", "羁旅思乡与行吟纪游", "感怀人生与自省述志", "咏物寄意与比兴抒怀", "唱和应酬与赠友之作"], "images": ["冰雪诗词_全部图片/5270187448207602 - ​正月初四，北京卫视卡酷少儿频道播出了全国少儿新春大联欢，小孙女参加了一个舞蹈节/01.jpg", "冰雪诗词_全部图片/5270187448207602 - ​正月初四，北京卫视卡酷少儿频道播出了全国少儿新春大联欢，小孙女参加了一个舞蹈节/02.jpg", "冰雪诗词_全部图片/5270187448207602 - ​正月初四，北京卫视卡酷少儿频道播出了全国少儿新春大联欢，小孙女参加了一个舞蹈节/03.jpg"]}, {"id": "5270487332816836", "title": "临江仙·马年初雨有寄", "genre": "临江仙", "body": "窗外雨丝牵晓色，\n更添春意融融。\n直教残
